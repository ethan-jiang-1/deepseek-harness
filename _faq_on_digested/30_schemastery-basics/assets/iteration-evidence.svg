<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
<title id="title">开发迭代要区分工程回归与模型效果</title><desc id="desc">声明和真实装配、固定轨迹回放、真实模型验收各有证明范围。刷新与录制不能替代独立的结果判据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="620" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="26" fill="#0f172a" font-weight="700">开发迭代要区分工程回归与模型效果</text>
<text x="32" y="80" font-size="18" fill="#334155" font-weight="400">按改动影响选择证据；下列检查在适用时累加，不能互相替代。</text><rect x="32" y="115" width="322" height="145" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="50" y="146" font-size="20" fill="#2563eb" font-weight="600">声明与真实装配</text><text x="50" y="175" font-size="16" fill="#334155" font-weight="400">解析正反例 / 类型检查</text><text x="50" y="201" font-size="16" fill="#334155" font-weight="400">Loader 加载 / 依赖 / 清理</text><text x="50" y="227" font-size="16" fill="#334155" font-weight="400">消费者、磁盘与重启恢复</text><rect x="399" y="115" width="322" height="145" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="417" y="146" font-size="20" fill="#2563eb" font-weight="600">固定模型轨迹回放</text><text x="417" y="175" font-size="16" fill="#334155" font-weight="400">历史模型输出保持固定</text><text x="417" y="201" font-size="16" fill="#334155" font-weight="400">执行当前 Harness 与工具</text><text x="417" y="227" font-size="16" fill="#334155" font-weight="400">比较请求、日志与可见结果</text><rect x="766" y="115" width="322" height="145" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="784" y="146" font-size="20" fill="#2563eb" font-weight="600">真实模型任务验收</text><text x="784" y="175" font-size="16" fill="#334155" font-weight="400">当前模型读取当前输入</text><text x="784" y="201" font-size="16" fill="#334155" font-weight="400">实际工具行为与外部结果</text><text x="784" y="227" font-size="16" fill="#334155" font-weight="400">按独立任务判据验收</text><path d="M354 184 L399 184" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M721 184 L766 184" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="301" font-size="20" fill="#2563eb" font-weight="600">可复现工程回归</text><text x="766" y="301" font-size="20" fill="#047857" font-weight="600">模型行为与任务效果</text><rect x="32" y="352" width="322" height="148" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="50" y="383" font-size="20" fill="#2563eb" font-weight="600">replay：日常回归</text><text x="50" y="412" font-size="16" fill="#334155" font-weight="400">不调用真实模型</text><text x="50" y="438" font-size="16" fill="#334155" font-weight="400">拿历史输出驱动当前实现</text><text x="50" y="464" font-size="16" fill="#334155" font-weight="400">通过不代表新提示词更有效</text><rect x="399" y="352" width="322" height="148" rx="12" fill="white" stroke="#b45309" stroke-width="2"/><text x="417" y="383" font-size="20" fill="#b45309" font-weight="600">refresh：刷新预期</text><text x="417" y="412" font-size="16" fill="#334155" font-weight="400">仍然复用历史模型输出</text><text x="417" y="438" font-size="16" fill="#334155" font-weight="400">重算当前实现的预期产物</text><text x="417" y="464" font-size="16" fill="#334155" font-weight="400">新 diff 必须逐项评审</text><rect x="766" y="352" width="322" height="148" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="784" y="383" font-size="20" fill="#2563eb" font-weight="600">record：重新录制</text><text x="784" y="412" font-size="16" fill="#334155" font-weight="400">调用真实模型得到新轨迹</text><text x="784" y="438" font-size="16" fill="#334155" font-weight="400">保留组装输入与运行证据</text><text x="784" y="464" font-size="16" fill="#334155" font-weight="400">录到结果仍需独立判定</text><text x="32" y="550" font-size="17" fill="#334155" font-weight="400">独立验收：例如检查应注册的工具和最终工作区文件树；不要随 refresh 一起改成当前结果。</text><text x="32" y="583" font-size="18" fill="#9a3412" font-weight="600">记录完整 ≠ 任务完成；快照通过 ≠ 当前模型能力提升。</text>
</g></svg>
