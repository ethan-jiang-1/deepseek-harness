<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="title desc">
<title id="title">设置保存：谁校验、谁写盘、谁负责恢复</title><desc id="desc">SettingsForms 限制编辑并检查修订，ConfigEditor 锁内校验和持久化，协调失败时尝试恢复旧 patch。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="660" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="26" fill="#0f172a" font-weight="700">设置保存：谁校验、谁写盘、谁负责恢复</text>
<text x="32" y="80" font-size="18" fill="#334155" font-weight="400">Settings 写入路径的局部恢复，与直接 Loader 更新的保证不同。</text><rect x="32" y="112" width="318" height="138" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="50" y="143" font-size="20" fill="#2563eb" font-weight="600">① SettingsForms</text><text x="50" y="172" font-size="16" fill="#334155" font-weight="400">检查即时字段与修订号</text><text x="50" y="198" font-size="16" fill="#334155" font-weight="400">从 Host 原始配置合并修改</text><text x="50" y="224" font-size="16" fill="#334155" font-weight="400">不把脱敏响应作为完整配置</text><rect x="400" y="112" width="318" height="138" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="418" y="143" font-size="20" fill="#2563eb" font-weight="600">② ConfigEditor（锁内）</text><text x="418" y="172" font-size="16" fill="#334155" font-weight="400">重读配置并校验完整候选</text><text x="418" y="198" font-size="16" fill="#334155" font-weight="400">检查是否被更高层覆盖</text><text x="418" y="224" font-size="16" fill="#334155" font-weight="400">原子写入 profile patch</text><rect x="768" y="112" width="318" height="138" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="786" y="143" font-size="20" fill="#2563eb" font-weight="600">③ 协调并审计激活</text><text x="786" y="172" font-size="16" fill="#334155" font-weight="400">让 Loader 应用组合</text><text x="786" y="198" font-size="16" fill="#334155" font-weight="400">确认目标实例激活结果</text><text x="786" y="224" font-size="16" fill="#334155" font-weight="400">成功后返回</text><path d="M350 181 L400 181" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M718 181 L768 181" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M927 250 L927 337" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="646" y="337" width="440" height="137" rx="12" fill="white" stroke="#b45309" stroke-width="2"/><text x="664" y="368" font-size="20" fill="#b45309" font-weight="600">应用失败：尝试恢复</text><text x="664" y="397" font-size="16" fill="#334155" font-weight="400">写回原 patch，再协调旧组合</text><text x="664" y="423" font-size="16" fill="#334155" font-weight="400">恢复也可能失败；外部副作用未必撤销</text><rect x="32" y="337" width="552" height="137" rx="12" fill="white" stroke="#b45309" stroke-width="2"/><text x="50" y="368" font-size="20" fill="#b45309" font-weight="600">保存前拒绝</text><text x="50" y="397" font-size="16" fill="#334155" font-weight="400">非法值 / 陈旧修订 / 更高层覆盖等</text><text x="50" y="423" font-size="16" fill="#334155" font-weight="400">不把本次候选持久化；锁内可能已同步外部变化</text><text x="32" y="535" font-size="21" fill="#0f172a" font-weight="600">分别观察三个状态</text><text x="32" y="573" font-size="18" fill="#334155" font-weight="400">磁盘 patch：保存了什么？    运行实例/引用：现在是什么？    操作参数：本次实际用了什么？</text><text x="32" y="618" font-size="17" fill="#334155" font-weight="400">patch 的 config 整块替换；单字段 reset 与移除整个 config 覆盖具有不同的继承结果。</text>
</g></svg>
