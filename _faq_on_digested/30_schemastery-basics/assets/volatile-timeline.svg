<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc">
<title id="title">即时配置的关键：读取与提交的时间</title><desc id="desc">操作 A 捕获旧超时，引用更新后操作 B 读取新超时。无效更新和普通更新具有不同失败与生命周期语义。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="600" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="26" fill="#0f172a" font-weight="700">即时配置的关键：读取与提交的时间</text>
<text x="32" y="80" font-size="18" fill="#334155" font-weight="400">示意：默认超时从 120000 ms 改为 30000 ms；仅展示满足即时更新条件的路径。</text><path d="M80 150 L1050 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><circle cx="100" cy="150" r="6" fill="#2563eb"/><text x="62" y="124" font-size="18" fill="#0f172a" font-weight="600">t0：操作 A 解析</text><circle cx="440" cy="150" r="6" fill="#2563eb"/><text x="402" y="124" font-size="18" fill="#0f172a" font-weight="600">t1：提交新值</text><circle cx="790" cy="150" r="6" fill="#2563eb"/><text x="752" y="124" font-size="18" fill="#0f172a" font-weight="600">t2：操作 B 解析</text><rect x="42" y="200" width="294" height="122" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="60" y="231" font-size="20" fill="#2563eb" font-weight="600">操作 A 已捕获参数</text><text x="60" y="260" font-size="16" fill="#334155" font-weight="400">timeoutMs = 120000</text><text x="60" y="286" font-size="16" fill="#334155" font-weight="400">后续更新不改写此参数</text><rect x="406" y="200" width="294" height="122" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="424" y="231" font-size="20" fill="#2563eb" font-weight="600">同一实例、同一引用</text><text x="424" y="260" font-size="16" fill="#334155" font-weight="400">ref.get(): 120000 → 30000</text><text x="424" y="286" font-size="16" fill="#334155" font-weight="400">先提交所有引用，再发通知</text><rect x="770" y="200" width="306" height="122" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="788" y="231" font-size="20" fill="#2563eb" font-weight="600">操作 B 重新读取</text><text x="788" y="260" font-size="16" fill="#334155" font-weight="400">ref.get() = 30000</text><text x="788" y="286" font-size="16" fill="#334155" font-weight="400">再结合请求值和最大超时</text><rect x="42" y="384" width="495" height="126" rx="12" fill="white" stroke="#b45309" stroke-width="2"/><text x="60" y="415" font-size="20" fill="#b45309" font-weight="600">候选无效：Loader 即时更新</text><text x="60" y="444" font-size="16" fill="#334155" font-weight="400">旧运行引用值保留；raw config 可保留新值</text><text x="60" y="470" font-size="16" fill="#334155" font-weight="400">这不代表磁盘或整棵配置树回滚</text><rect x="575" y="384" width="501" height="126" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="593" y="415" font-size="20" fill="#64748b" font-weight="600">普通字段或依赖等改变</text><text x="593" y="444" font-size="16" fill="#334155" font-weight="400">可能释放旧实例并按正常生命周期重新挂载</text><text x="593" y="470" font-size="16" fill="#334155" font-weight="400">新实例与新引用不承诺保持身份</text><text x="42" y="558" font-size="17" fill="#334155" font-weight="400">Shell 在 resolve(request) 捕获超时。其他字段的读取时点，应逐一检查其真实消费者。</text>
</g></svg>
