<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-labelledby="title desc">
<title id="title">一个配置声明，多个实际消费者</title><desc id="desc">配置经 Loader 和 Cordis 解析后进入业务。原生 schema 还用于设置、JSON Schema 投影和静态配置目录。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="700" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="32" y="44" font-size="26" fill="#0f172a" font-weight="700">一个配置声明，多个实际消费者</text>
<text x="32" y="78" font-size="18" fill="#334155" font-weight="400">实际配置进入插件；同一份声明另供设置、检查和文档读取。</text><rect x="32" y="112" width="238" height="130" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="50" y="143" font-size="20" fill="#2563eb" font-weight="600">组合后的 raw config</text><text x="50" y="172" font-size="16" fill="#334155" font-weight="400">profile / bundle / patch</text><text x="50" y="198" font-size="16" fill="#334155" font-weight="400">部署与用户配置</text><rect x="316" y="112" width="238" height="130" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="334" y="143" font-size="20" fill="#2563eb" font-weight="600">Loader + Cordis</text><text x="334" y="172" font-size="16" fill="#334155" font-weight="400">求值配置表达式</text><text x="334" y="198" font-size="16" fill="#334155" font-weight="400">依赖满足后校验并激活</text><rect x="600" y="112" width="220" height="130" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="618" y="143" font-size="20" fill="#2563eb" font-weight="600">解析后的 Config</text><text x="618" y="172" font-size="16" fill="#334155" font-weight="400">默认值、有效值</text><text x="618" y="198" font-size="16" fill="#334155" font-weight="400">volatile 引用</text><rect x="866" y="112" width="222" height="130" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="884" y="143" font-size="20" fill="#2563eb" font-weight="600">业务操作</text><text x="884" y="172" font-size="16" fill="#334155" font-weight="400">读取当前配置</text><text x="884" y="198" font-size="16" fill="#334155" font-weight="400">形成一次操作参数</text><path d="M270 177 L316 177" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M554 177 L600 177" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 177 L866 177" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="310" width="330" height="128" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="334" y="341" font-size="20" fill="#2563eb" font-weight="600">Schemastery 声明</text><text x="334" y="370" font-size="16" fill="#334155" font-weight="400">Config(raw) 可执行解析</text><text x="334" y="396" font-size="16" fill="#334155" font-weight="400">type / dict / meta 可读取</text><path d="M435 310 L435 242" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="500" width="300" height="120" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="50" y="531" font-size="20" fill="#2563eb" font-weight="600">设置服务与 Client</text><text x="50" y="560" font-size="16" fill="#334155" font-weight="400">即时字段、脱敏、草稿校验</text><text x="50" y="586" font-size="16" fill="#334155" font-weight="400">控件仍由产品组件编写</text><rect x="410" y="500" width="300" height="120" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="428" y="531" font-size="20" fill="#2563eb" font-weight="600">JSON Schema 投影</text><text x="428" y="560" font-size="16" fill="#334155" font-weight="400">表达可转换的输入规则</text><text x="428" y="586" font-size="16" fill="#334155" font-weight="400">显式报告不完整与局限</text><rect x="788" y="500" width="300" height="120" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="806" y="531" font-size="20" fill="#2563eb" font-weight="600">配置目录生成</text><text x="806" y="560" font-size="16" fill="#334155" font-weight="400">静态分析字段、类型与说明</text><text x="806" y="586" font-size="16" fill="#334155" font-weight="400">检查字段存在及产物新鲜度</text><path d="M480 438 L182 500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 438 L560 500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 438 L938 500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="667" font-size="16" fill="#334155" font-weight="400">启动校验走 Standard Schema 协议；图中的其他消费者进一步依赖 Schemastery 的原生声明。</text>
</g></svg>
