<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>一份 session.jsonl 的解剖：它就是 trajectory</title>
  <desc>左侧是 snapshots/session/bash-tool-turn/session.v4.jsonl 的 22 行事件，按颜色分成六组：首行 header、会话配置、turn 与 step 包围、模型可见的输入、请求头（模型真正收到什么）、模型的输出与工具往返。右侧三张卡说明同一份文件可以按三种粒度取用：只看单条事件（断言某个事件存在与顺序）、只看请求头（钉住我给模型加了什么）、整条轨迹回放（无 key 回归基线），成本依次抬高。底部说明它缺的四类失败——首个 chunk 之前就抛、接受之后再抛、取消或挂起、注入重试——这四类日志里根本不存在，要用 replay.override.json 补。</desc>

  <rect width="1200" height="760" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">一份 session.jsonl 的解剖</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">一行一个事件、首行 header；它同时记着「模型收到什么」「模型说了什么」「世界被改成了什么」</text>

  <rect x="40" y="76" width="470" height="536" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="102" font-size="13" font-weight="700" fill="#334155">实测：bash-tool-turn/session.v4.jsonl（22 行）</text>
  <text x="60" y="122" fill="#64748b" font-size="11">一次「提问 → 调工具 → 总结」的完整闭环</text>

  <rect x="56" y="134" width="440" height="18" rx="4" fill="#e2e8f0"/>
  <text x="66" y="147" font-size="11" fill="#334155">1　session　← header：版本 / id / cwd / delegationDepth</text>

  <rect x="56" y="156" width="440" height="18" rx="4" fill="#e2e8f0"/>
  <text x="66" y="169" font-size="11" fill="#334155">2–4　permission/preset · sandbox/mode · approval/policy</text>

  <rect x="56" y="178" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="191" font-size="11" fill="#334155">5　agent/inbox/spliced　← 用户输入入队</text>
  <rect x="56" y="200" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="213" font-size="11" fill="#334155">6　turn/start　← turn 边界</text>
  <rect x="56" y="222" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="235" font-size="11" fill="#334155">7　agent/inbox/spliced　← 输入被消费、移出队列</text>
  <rect x="56" y="244" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="257" font-size="11" fill="#334155">8　step/start</text>

  <rect x="56" y="266" width="440" height="18" rx="4" fill="#dbeafe"/>
  <text x="66" y="279" font-size="11" fill="#1e40af">9　system/message　← 系统提示词（正文是 {{system}}）</text>
  <rect x="56" y="288" width="440" height="18" rx="4" fill="#dbeafe"/>
  <text x="66" y="301" font-size="11" fill="#1e40af">10–11　user/message　← 用户消息 + 运行时上下文</text>

  <rect x="56" y="310" width="440" height="18" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="66" y="323" font-size="11" font-weight="700" fill="#92400e">12　request/header　← 模型真正收到的：config + tools</text>
  <rect x="56" y="332" width="440" height="18" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="66" y="345" font-size="11" fill="#92400e">13　request/context　← provider / model</text>
  <rect x="56" y="354" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="367" font-size="11" fill="#334155">14　session/title</text>

  <rect x="56" y="376" width="440" height="18" rx="4" fill="#dcfce7"/>
  <text x="66" y="389" font-size="11" fill="#166534">15　assistant/message　← 模型输出：reasoning + tool-call</text>
  <rect x="56" y="398" width="440" height="18" rx="4" fill="#ede9fe"/>
  <text x="66" y="411" font-size="11" fill="#5b21b6">16　tool/call　← bash("echo TERMINAL_OK")</text>
  <rect x="56" y="420" width="440" height="18" rx="4" fill="#ede9fe"/>
  <text x="66" y="433" font-size="11" fill="#5b21b6">17　tool/result　← isError=false</text>

  <rect x="56" y="442" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="455" font-size="11" fill="#334155">18　step/end</text>
  <rect x="56" y="464" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="477" font-size="11" fill="#334155">19　step/start</text>
  <rect x="56" y="486" width="440" height="18" rx="4" fill="#dcfce7"/>
  <text x="66" y="499" font-size="11" fill="#166534">20　assistant/message　← 模型输出：reasoning + text</text>
  <rect x="56" y="508" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="521" font-size="11" fill="#334155">21　step/end</text>
  <rect x="56" y="530" width="440" height="18" rx="4" fill="#f1f5f9"/>
  <text x="66" y="543" font-size="11" fill="#334155">22　turn/end</text>

  <text x="60" y="580" font-size="11" fill="#64748b">两种记法：V0 / V1 历史夹具把模型流记成显式 assistant/chunk 行；</text>
  <text x="60" y="598" font-size="11" fill="#64748b">V3 / V4 一行一事件、流紧凑内嵌在 assistant/message 里。回放两边都认。</text>

  <rect x="536" y="76" width="624" height="132" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="556" y="102" font-size="13" font-weight="700" fill="#1e40af">粒度一 · 单条事件（最便宜）</text>
  <text x="556" y="126" fill="#334155" font-size="11">断言某个事件存在、顺序正确、字段对。绝大多数插件测试停在这里就够。</text>
  <text x="556" y="148" fill="#64748b" font-size="11">需要的文件：只要 session.jsonl。</text>
  <text x="556" y="176" fill="#1e40af" font-size="11" font-weight="700">它证明：流程走到了该走的地方。它不证明：模型实际收到了什么。</text>

  <rect x="536" y="220" width="624" height="132" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="556" y="246" font-size="13" font-weight="700" fill="#92400e">粒度二 · 请求头（插件最该借的一层）</text>
  <text x="556" y="270" fill="#334155" font-size="11">request/header 是组装之后真正发出去的东西：config + 工具目录 + 系统提示词。</text>
  <text x="556" y="292" fill="#64748b" font-size="11">主仓把体积搬进 sidecar：{{system}} → system-prompt.expected.md，{{tools}} → tool-schemas.expected.json。</text>
  <text x="556" y="320" fill="#92400e" font-size="11" font-weight="700">推论：动了请求头却没有夹具变化 ⇒ 要么对模型不可见，要么不变量破了。</text>

  <rect x="536" y="364" width="624" height="132" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="556" y="390" font-size="13" font-weight="700" fill="#166534">粒度三 · 整条轨迹（最贵）</text>
  <text x="556" y="414" fill="#334155" font-size="11">把 session.jsonl 交给 dsh-llm-replay，无 key 重放整轮并比对持久化结果。</text>
  <text x="556" y="436" fill="#64748b" font-size="11">它同时是回放输入和期望输出——这正是它便宜的原因，也是它危险的来源。</text>
  <text x="556" y="464" fill="#166534" font-size="11" font-weight="700">代价：一条要有人重录、有人看 diff 的长期资产。</text>

  <rect x="536" y="508" width="624" height="104" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="556" y="534" font-size="13" font-weight="700" fill="#991b1b">它缺什么：四类「日志里根本不存在」的失败</text>
  <text x="556" y="558" fill="#334155" font-size="11">① 首个 chunk 之前就抛（pre-2xx）　② 接受之后再抛（post-2xx）</text>
  <text x="556" y="578" fill="#334155" font-size="11">③ 取消 / 挂起（需要一个不终止的流）　④ 注入重试（脚本中途插一次失败）</text>
  <text x="556" y="600" fill="#991b1b" font-size="11" font-weight="700">这四类只能由 replay.override.json 补：条目三种（chunks / throw / hang），文档两种。</text>

  <rect x="40" y="628" width="1120" height="106" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="654" font-size="13" font-weight="700" fill="#334155">为什么它比「一份 trajectory」多出三样东西</text>
  <text x="60" y="678" fill="#475569" font-size="11">① 模型真正收到的请求头——普通 trajectory 通常没有「发出去的完整请求」这一层；</text>
  <text x="60" y="698" fill="#475569" font-size="11">② 保留关系的 typed token（{{session:1}} / {{message:1}} / {{cwd}}），父子和引用关系可读；</text>
  <text x="60" y="718" fill="#475569" font-size="11">③ 它是投影而不是字节录像：省略 seq / time 包络，回放时合成——损失的是现场字节，换来的是可审阅的 diff。</text>
</svg>
