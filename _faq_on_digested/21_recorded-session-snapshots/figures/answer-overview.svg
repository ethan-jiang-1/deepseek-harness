<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>录制会话快照对 DSH 插件开发的价值：一页看懂</title>
  <desc>三列并排。左列（蓝）主仓为什么需要它：起点是 postmortem 0001，178 个单测全绿、100% 行覆盖、ACP 桥在生产完全不能用；它买到的唯一东西是组装之后的完整转录——模型实际收到什么、说了什么、落了什么盘；并且能在无 key 的 CI 里逐字节复现。中列（绿）插件仓能拿到什么：@deepseek-ai/dsh-llm-replay 是发布在 npm 上的普通 function 插件，接受未经投影的原始运行日志，于是能买到三样东西——trajectory 回归基线、可稳定复现的 bug、模型可见面的断言点。右列（琥珀与红）代价与上限：顶层语料治理搬不走也不该抄，语义守卫必须自己写，而且它只是变更探测器不是正确性 oracle——postmortem 0002 里快照套件曾为一次真实回归背书。底部是一条 L0 到 L4 的证据阶梯：导出守卫、行为 spec、HMR、REAL composition 默认都做，L4 行为回归证据面按触发条件启用。一句话记法：机制可以拿，制度不要抄，判断不能外包。</desc>
  <defs>
    <marker id="ov-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">录制会话快照对插件开发：一页看懂</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">问题不是「要不要这套东西」，而是「机制能拿多少、制度要不要抄、判断能不能外包」</text>

  <rect x="40" y="80" width="360" height="336" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="220" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">① 主仓为什么离不开它</text>
  <line x1="64" y1="124" x2="376" y2="124" stroke="#bfdbfe" stroke-width="1"/>
  <text x="64" y="150" font-size="11" font-weight="700" fill="#1e40af">起点：一次事故</text>
  <text x="64" y="172" fill="#334155">178 个单测全绿、100% 行覆盖，</text>
  <text x="64" y="190" fill="#334155">ACP 桥在生产里完全不能用</text>
  <text x="64" y="208" fill="#64748b" font-size="11">postmortem 0001：没走真实装载路径</text>
  <text x="64" y="240" font-size="11" font-weight="700" fill="#1e40af">买到的唯一一样东西</text>
  <rect x="64" y="252" width="312" height="62" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="220" y="276" text-anchor="middle" font-weight="700" fill="#1e40af">组装之后的完整转录</text>
  <text x="220" y="296" text-anchor="middle" fill="#334155" font-size="11">模型实际收到什么 / 说了什么 / 落了什么盘</text>
  <text x="64" y="340" font-size="11" font-weight="700" fill="#1e40af">而且无 key 可复现</text>
  <text x="64" y="362" fill="#334155">真运行的保真度 + 夹具的确定性</text>
  <text x="64" y="380" fill="#64748b" font-size="11">录制花配额，回放零 key，CI 只读</text>
  <text x="64" y="404" fill="#64748b" font-size="11">210 个场景 / 1271 个文件的主仓语料</text>

  <rect x="420" y="80" width="360" height="336" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="600" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">② 插件仓能拿到什么</text>
  <line x1="444" y1="124" x2="756" y2="124" stroke="#bbf7d0" stroke-width="1"/>
  <text x="444" y="150" font-size="11" font-weight="700" fill="#166534">前提：它是一个发布包</text>
  <text x="444" y="172" fill="#334155">@deepseek-ai/dsh-llm-replay</text>
  <text x="444" y="190" fill="#64748b" font-size="11">npm next = 0.2.0-rc.2（就是本基线）</text>
  <text x="444" y="208" fill="#64748b" font-size="11">普通 function 插件：name / inject / apply</text>
  <text x="444" y="240" font-size="11" font-weight="700" fill="#166534">三样买到的东西</text>
  <rect x="444" y="252" width="312" height="46" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="460" y="272" fill="#166534" font-weight="700">A · trajectory 回归</text>
  <text x="460" y="290" fill="#334155" font-size="11">组装转录的固定基线，diff request/header</text>
  <rect x="444" y="304" width="312" height="46" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="460" y="324" fill="#166534" font-weight="700">B · bug 复现</text>
  <text x="460" y="342" fill="#334155" font-size="11">固定流之后仍复现 = 产品 bug</text>
  <rect x="444" y="356" width="312" height="46" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="460" y="376" fill="#166534" font-weight="700">C · model-visible 钉住</text>
  <text x="460" y="394" fill="#334155" font-size="11">「我给模型加了什么」的断言点</text>

  <rect x="800" y="80" width="360" height="336" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="980" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">③ 代价与上限</text>
  <line x1="824" y1="124" x2="1136" y2="124" stroke="#fde68a" stroke-width="1"/>
  <text x="824" y="150" font-size="11" font-weight="700" fill="#92400e">搬不走：语料治理（别抄）</text>
  <text x="824" y="172" fill="#334155">顶层 snapshots/ 所有权、四面分工、</text>
  <text x="824" y="190" fill="#334155">corpus policy 与 gate、dsh-session-snapshot</text>
  <text x="824" y="208" fill="#64748b" font-size="11">那是给「一仓维护 210 个场景」用的制度</text>
  <text x="824" y="240" font-size="11" font-weight="700" fill="#92400e">必须自己写：语义守卫</text>
  <text x="824" y="262" fill="#334155">对你的插件，「语义上不可能」长什么样</text>
  <text x="824" y="280" fill="#334155">只有你知道，夹具不会替你想到</text>

  <rect x="824" y="298" width="312" height="100" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="980" y="322" text-anchor="middle" font-weight="700" fill="#991b1b">上限：变更探测器 ≠ 正确性 oracle</text>
  <text x="980" y="344" text-anchor="middle" fill="#334155" font-size="11">postmortem 0002：快照刷新把七个场景的</text>
  <text x="980" y="361" text-anchor="middle" fill="#334155" font-size="11">UNKNOWN_TOOL 当成新期望输出，套件全绿</text>
  <text x="980" y="384" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="700">刷新是生产夹具，不是正确性评审</text>

  <line x1="600" y1="416" x2="600" y2="444" stroke="#64748b" stroke-width="2" marker-end="url(#ov-a)"/>

  <rect x="40" y="452" width="1120" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="478" font-size="13" font-weight="700" fill="#334155">证据阶梯：L0–L3 默认都做，L4 按触发条件启用</text>

  <rect x="60" y="492" width="196" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="158" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">L0 导出形态守卫</text>
  <text x="158" y="532" text-anchor="middle" font-size="11" fill="#64748b">真 Loader 不丢命名空间</text>

  <rect x="268" y="492" width="196" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="366" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">L1 行为 spec</text>
  <text x="366" y="532" text-anchor="middle" font-size="11" fill="#64748b">挂真依赖，只假最外层</text>

  <rect x="476" y="492" width="196" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="574" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">L2 HMR-safety</text>
  <text x="574" y="532" text-anchor="middle" font-size="11" fill="#64748b">dispose 后贡献消失</text>

  <rect x="684" y="492" width="196" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="782" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">L3 REAL composition</text>
  <text x="782" y="532" text-anchor="middle" font-size="11" fill="#64748b">真 Loader 读真 cordis.yml</text>

  <rect x="892" y="492" width="248" height="52" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1016" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">L4 行为回归证据面（按需）</text>
  <text x="1016" y="532" text-anchor="middle" font-size="11" fill="#166534">命中触发条件才建，贵在维护</text>

  <text x="60" y="576" font-size="12" font-weight="700" fill="#334155">一句话记法：机制可以拿，制度不要抄，判断不能外包。</text>
  <text x="60" y="594" fill="#475569" font-size="11">with-key e2e 证明「今天还活着」，轨迹回放证明「组装转录没变」——互补，谁也替代不了谁。</text>
</svg>
