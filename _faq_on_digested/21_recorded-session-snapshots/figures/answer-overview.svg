<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>录制会话快照对 DSH 插件开发的价值：一页总览</title>
  <desc>三列并排总结录制会话快照对插件开发的决策要点。左列说明主仓为什么离不开它：源自 postmortem 0001（178 个单测全绿、100% 行覆盖率但生产不可用），锁住真实组装后的完整会话转录并在无密钥 CI 中确定性重放。中列说明插件仓可复用公开 npm 包 @deepseek-ai/dsh-llm-replay，直接读取原始明文 session.jsonl，解决多步跨版回归、偶发流 bug 复现与模型可见面核验三类问题。右列说明维护代价与硬上限：主仓多世代配额制度不要照抄，且快照只是变更探测器而非正确性裁判（postmortem 0002）。底部展示插件测试四步推进阶梯。</desc>
  <defs>
    <marker id="ov-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="ov-g" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">录制会话快照与插件开发：一页总览</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">核心铁律：回放机制随时可拿，主仓配额制度别抄，正确性判断绝不能外包</text>

  <rect x="40" y="80" width="360" height="336" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="220" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">① 主仓为什么离不开它</text>
  <line x1="64" y1="122" x2="376" y2="122" stroke="#bfdbfe" stroke-width="1"/>
  <text x="64" y="148" font-size="11" font-weight="700" fill="#1e40af">导火索：postmortem 0001 生产瘫痪</text>
  <text x="64" y="170" font-size="11" fill="#334155">178 个单测全绿、100% 行覆盖率，</text>
  <text x="64" y="188" font-size="11" fill="#334155">dsh --profile acp 发版后彻底不可用</text>
  <text x="64" y="208" font-size="11" fill="#64748b">根因：手搭单测绕过了真实配置装载与子进程链</text>
  <text x="64" y="238" font-size="11" font-weight="700" fill="#1e40af">无可替代的独特证据</text>
  <rect x="64" y="250" width="312" height="62" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="220" y="274" text-anchor="middle" font-weight="700" fill="#1e40af">真实组装后的完整会话转录</text>
  <text x="220" y="295" text-anchor="middle" font-size="11" fill="#334155">系统提示词 / 请求头工具表 / 输出流 / 落盘事件</text>
  <text x="64" y="338" font-size="11" font-weight="700" fill="#1e40af">真运行保真度 + 无密钥确定性</text>
  <text x="64" y="360" font-size="11" fill="#334155">本地带密钥真跑一次，审阅后提交进 Git</text>
  <text x="64" y="380" font-size="11" fill="#64748b">CI 零密钥逐字节重放，PR 逐行审文本 diff</text>
  <text x="64" y="400" font-size="11" fill="#64748b">主仓顺带守护历史会话格式的向前兼容读取</text>

  <rect x="420" y="80" width="360" height="336" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="600" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">② 外部插件仓怎么复用</text>
  <line x1="444" y1="122" x2="756" y2="122" stroke="#bbf7d0" stroke-width="1"/>
  <text x="444" y="148" font-size="11" font-weight="700" fill="#166534">底座：回放器是公开 npm 插件</text>
  <text x="444" y="170" font-size="11" fill="#334155">@deepseek-ai/dsh-llm-replay（锁同 CLI 版本）</text>
  <text x="444" y="190" font-size="11" fill="#64748b">直接接受未经脱敏投影的原始明文 session.jsonl</text>
  <text x="444" y="210" font-size="11" fill="#64748b">两层薄 --patch 即可打通录制与无密钥回放</text>
  <text x="444" y="238" font-size="11" font-weight="700" fill="#166534">能解决的三类真问题</text>
  <rect x="444" y="250" width="312" height="46" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="462" y="270" font-weight="700" fill="#166534">A · 多步编排与跨版本回归</text>
  <text x="462" y="288" font-size="11" fill="#334155">固定完整会话轨迹，随 DSH 升版防行为漂移</text>
  <rect x="444" y="302" width="312" height="46" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="462" y="322" font-weight="700" fill="#166534">B · 偶发模型流 Bug 稳定锁死</text>
  <text x="462" y="340" font-size="11" fill="#334155">固定流仍复现即坐实代码缺陷；支持异常/取消注入</text>
  <rect x="444" y="354" width="312" height="46" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="462" y="374" font-weight="700" fill="#166534">C · 锁定组装后的模型可见面</text>
  <text x="462" y="392" font-size="11" fill="#334155">逐字比对 system/message 与 request/header</text>

  <rect x="800" y="80" width="360" height="336" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="980" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">③ 维护代价与硬上限</text>
  <line x1="824" y1="122" x2="1136" y2="122" stroke="#fde68a" stroke-width="1"/>
  <text x="824" y="148" font-size="11" font-weight="700" fill="#92400e">别照抄：主仓重型语料配额制度</text>
  <text x="824" y="170" font-size="11" fill="#334155">多世代并存配额、四入口目录分工、</text>
  <text x="824" y="188" font-size="11" fill="#334155">强绑 vitest 的 dsh-session-snapshot</text>
  <text x="824" y="208" font-size="11" fill="#64748b">外部插件仓重录直接覆盖单文件，不背历史包袱</text>
  <text x="824" y="238" font-size="11" font-weight="700" fill="#92400e">必须自备：独立外部终态与禁区断言</text>
  <text x="824" y="260" font-size="11" fill="#334155">磁盘文件是否真写对、哪些错误码绝不该出现，</text>
  <text x="824" y="278" font-size="11" fill="#334155">必须靠会话文本之外的独立断言把关</text>

  <rect x="824" y="296" width="312" height="104" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="980" y="320" text-anchor="middle" font-weight="700" fill="#991b1b">硬上限：变更探测器 ≠ 正确性裁判</text>
  <text x="980" y="342" text-anchor="middle" font-size="11" fill="#334155">postmortem 0002：7 个场景报 UNKNOWN_TOOL，</text>
  <text x="980" y="360" text-anchor="middle" font-size="11" fill="#334155">一次盲目刷新把故障录成新基线，测试照样全绿</text>
  <text x="980" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">刷新只是重产夹具，绝不能替代正确性审查</text>

  <line x1="600" y1="416" x2="600" y2="444" stroke="#64748b" stroke-width="2" marker-end="url(#ov-a)"/>

  <rect x="40" y="450" width="1120" height="162" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="62" y="476" font-size="13" font-weight="700" fill="#334155">插件测试推进阶梯：先把前 3 步低成本底座做齐，命中触发条件再开第 4 步</text>

  <rect x="62" y="492" width="232" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="178" y="515" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">1 · 导出形态检查</text>
  <text x="178" y="534" text-anchor="middle" font-size="11" fill="#64748b">禁 default 导出，防丢 inject</text>
  <line x1="298" y1="519" x2="318" y2="519" stroke="#64748b" stroke-width="1.5" marker-end="url(#ov-a)"/>

  <rect x="324" y="492" width="232" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="440" y="515" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">2 · 行为与清理单测</text>
  <text x="440" y="534" text-anchor="middle" font-size="11" fill="#64748b">挂真依赖测分支，验卸载无残留</text>
  <line x1="560" y1="519" x2="580" y2="519" stroke="#64748b" stroke-width="1.5" marker-end="url(#ov-a)"/>

  <rect x="586" y="492" width="244" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="708" y="515" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">3 · 真实 Loader 装配测试</text>
  <text x="708" y="534" text-anchor="middle" font-size="11" fill="#64748b">读 cordis.yml 启动，验配置与拓扑</text>
  <line x1="834" y1="519" x2="854" y2="519" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ov-g)"/>

  <rect x="860" y="492" width="278" height="54" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="999" y="515" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">4 · 渲染期望 / 会话回放（按需）</text>
  <text x="999" y="534" text-anchor="middle" font-size="11" fill="#166534">UI 优先 DOM 期望；编排再上回放</text>

  <text x="62" y="574" font-size="12" font-weight="700" fill="#334155">分工互补：带密钥真模型 e2e 验证「今天对线上模型还能调通」，无密钥录制回放验证「组装转录没有意外漂移」。</text>
  <text x="62" y="594" font-size="11" fill="#475569">夹具须明文进 Git 供 PR 逐行 diff（禁开 Git LFS）；临时 .sessions/ 目录与未脱敏用户日志一律写进 .gitignore。</text>
</svg>
