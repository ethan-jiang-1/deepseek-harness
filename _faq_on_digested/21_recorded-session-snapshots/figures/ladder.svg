<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>插件仓测试推进阶梯：前 3 步默认必做，第 4 步按交付面按需启用</title>
  <desc>上半列出进入第 4 步回归快照的触发判据：若修改模型可见输入、锁死模型流耦合 bug、验证日志外异常流或跨 DSH 版本编排回归，建立录制会话回放；若核心交付面在 Web 自定义卡片或面板，优先建立轻量 DOM 渲染期望（expected.dom.json）；纯内部重构、纯样式微调与并发子智能体扇出明确不建回放。中部展示从第 1 步导出检查到第 4 步回归快照的递进阶梯。底部列出六条避坑底线与先红后绿验收铁律。</desc>
  <defs>
    <marker id="ld-s" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="ld-g" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="770" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">插件仓四步测试推进阶梯</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">前 3 步低成本挡住绝大多数装载与逻辑缺陷；第 4 步贵在长期重录与审 diff，命中判据再启用</text>

  <rect x="40" y="78" width="1120" height="234" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="62" y="104" font-size="13" font-weight="700" fill="#92400e">第 4 步回归快照的启用判据（命中再建：模型/编排面建「会话回放」，Web 界面优先建「DOM 渲染期望」）</text>

  <rect x="62" y="116" width="528" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="80" y="136" font-size="11" font-weight="700" fill="#92400e">① 修改了发往模型的可见内容（建会话回放）</text>
  <text x="80" y="155" font-size="11" fill="#334155">注入系统提示词、新增或修改工具参数 Schema、自定义上下文投影</text>

  <rect x="610" y="116" width="528" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="628" y="136" font-size="11" font-weight="700" fill="#92400e">② 锁死只在真实模型流下暴露的 Bug（建会话回放）</text>
  <text x="628" y="155" font-size="11" fill="#334155">固定输出流后仍稳定复现 → 手写脱敏最小 authored 轨迹永久守门</text>

  <rect x="62" y="172" width="528" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="80" y="192" font-size="11" font-weight="700" fill="#92400e">③ 验证常规日志记不下来的异常流（建回放 + override）</text>
  <text x="80" y="211" font-size="11" fill="#334155">首包前报错 / 中途断流 / 挂起取消 / 瞬时重试 → 配 replay.override.json</text>

  <rect x="610" y="172" width="528" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="628" y="192" font-size="11" font-weight="700" fill="#92400e">④ 跨 DSH 版本核验多角色编排未走样（建会话回放）</text>
  <text x="628" y="211" font-size="11" fill="#334155">拿既有轨迹在新版运行时无密钥重放，充当轻量升版兼容回归网</text>

  <rect x="62" y="228" width="1076" height="48" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="80" y="248" font-size="11" font-weight="700" fill="#166534">⑤ 核心交付面在 Web 自定义工具卡片 / 状态面板（优先建 DOM 渲染期望，暂缓整轮会话回放）</text>
  <text x="80" y="267" font-size="11" fill="#334155">喂确定事件提取可见文本与按钮状态，比对窄带 expected.dom.json；十来秒跑完，截图仅留本地核对不进 Git</text>

  <text x="62" y="298" font-size="11" font-weight="600" fill="#92400e">明确不建会话回放：纯内部重构、纯 CSS 微调、仅改内部服务接口，以及含并发子智能体扇出的任务（按序抢流会乱序）。</text>

  <rect x="40" y="326" width="796" height="28" rx="6" fill="#e2e8f0"/>
  <text x="438" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">前 3 步：所有插件仓默认必做（低成本底座）</text>
  <rect x="856" y="326" width="304" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="1008" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">第 4 步：命中上方条件再按需启用</text>

  <rect x="40" y="498" width="246" height="82" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="163" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">第 1 步 · 导出形态守卫</text>
  <text x="163" y="545" text-anchor="middle" font-size="11" fill="#475569">断言无 default 导出 + unwrapExports</text>
  <text x="163" y="564" text-anchor="middle" font-size="11" fill="#64748b">秒级免疫 postmortem 0001 装载坑</text>

  <rect x="314" y="454" width="246" height="82" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="437" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">第 2 步 · 行为与清理单测</text>
  <text x="437" y="501" text-anchor="middle" font-size="11" fill="#475569">挂真实下游依赖，仅替掉最外层 I/O</text>
  <text x="437" y="520" text-anchor="middle" font-size="11" fill="#64748b">销毁 fiber 断言注册项干净撤回</text>

  <rect x="588" y="410" width="248" height="82" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="712" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">第 3 步 · 真实 Loader 装配</text>
  <text x="712" y="457" text-anchor="middle" font-size="11" fill="#475569">用真 Loader 读临时 cordis.yml 启动</text>
  <text x="712" y="476" text-anchor="middle" font-size="11" fill="#64748b">校验 Config 生效与模型可见文案</text>

  <rect x="856" y="368" width="304" height="148" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1008" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">第 4 步 · 回归快照（按需）</text>
  <text x="1008" y="416" text-anchor="middle" font-size="11" fill="#166534">独立编排仓放顶层 snapshots/；小包放 tests/</text>
  <text x="1008" y="438" text-anchor="middle" font-size="11" fill="#334155">• 界面交付：expected.dom.json 渲染期望</text>
  <text x="1008" y="458" text-anchor="middle" font-size="11" fill="#334155">• 编排交付：session.jsonl（+ override）</text>
  <text x="1008" y="478" text-anchor="middle" font-size="11" fill="#334155">• 外部核验：world.expected.json 终态断言</text>
  <text x="1008" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">夹具同 PR 进 Git（禁开 LFS），.sessions 忽略</text>

  <line x1="286" y1="534" x2="310" y2="504" stroke="#64748b" stroke-width="1.8" marker-end="url(#ld-s)"/>
  <line x1="560" y1="490" x2="584" y2="460" stroke="#64748b" stroke-width="1.8" marker-end="url(#ld-s)"/>
  <line x1="836" y1="446" x2="852" y2="436" stroke="#16a34a" stroke-width="2" marker-end="url(#ld-g)"/>

  <line x1="40" y1="598" x2="1160" y2="598" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="620" text-anchor="middle" font-size="11" fill="#64748b">跳过前 3 步直接建录制快照，等于拿维护最贵的重锤去敲几行单测就能挡住的装载错误</text>

  <rect x="40" y="636" width="1120" height="108" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="62" y="662" font-size="13" font-weight="700" fill="#991b1b">六条落地避坑底线</text>
  <text x="62" y="685" font-size="11" fill="#334155">① 别搬主仓多世代配额与四入口门禁　② 别装强绑 vitest 的 dsh-session-snapshot（只用公开包 dsh-llm-replay）</text>
  <text x="62" y="705" font-size="11" fill="#334155">③ 别把含隐私的用户日志进 Git（改写脱敏 authored）　④ 顶层 snapshots/README 注明自管清单（防 Agent 误套主仓 schema）</text>
  <text x="62" y="727" font-size="11" font-weight="700" fill="#991b1b">⑤ 必配独立终态与错误码禁区断言　⑥ 先红后绿验收（先故意改坏期望确认报 exit 1，再恢复变绿；保留定期真模型冒烟）</text>
</svg>
