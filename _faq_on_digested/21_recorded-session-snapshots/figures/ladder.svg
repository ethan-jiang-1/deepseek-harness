<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>插件仓测试推进阶梯：前 3 步默认必做，第 4 步按需启用</title>
  <desc>上半是第 4 步（录制回归快照）的五条启用触发条件：修改了模型可见输入（工具描述、系统提示词注入、工具 Schema、会话事件投影）；修复了只在真实模型流下复现的 bug；需要验证日志无法重建的异常流（抛错、取消、挂起、重试）；跟随 DSH 版本升级验证行为无漂移；界面主要面向 Web 卡片或面板渲染（优先建 DOM 渲染期望）。纯内部重构、纯样式微调或涉及并发子智能体扇出的场景则不应建立会话回放。下半是从左到右四步推进阶梯与六条避坑底线。</desc>
  <defs>
    <marker id="ld-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="780" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">插件仓测试推进阶梯</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">前 3 步低成本挡住绝大多数缺陷；第 4 步录制快照贵在长期维护，命中触发条件再建</text>

  <rect x="40" y="78" width="1120" height="234" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="60" y="104" font-size="13" font-weight="700" fill="#92400e">第 4 步录制快照的启用触发条件（命中任意一条再建）</text>

  <rect x="60" y="116" width="530" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="76" y="136" font-size="11" font-weight="700" fill="#92400e">① 修改了发给模型的可见内容</text>
  <text x="76" y="155" fill="#334155" font-size="11">工具描述、系统提示词注入、参数 JSON Schema、会话投影事件</text>

  <rect x="610" y="116" width="530" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="626" y="136" font-size="11" font-weight="700" fill="#92400e">② 修复只在真实模型流下才暴露的 Bug</text>
  <text x="626" y="155" fill="#334155" font-size="11">固定流后仍稳定复现 → 用脱敏 authored 轨迹永久锁住回归</text>

  <rect x="60" y="172" width="530" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="76" y="192" font-size="11" font-weight="700" fill="#92400e">③ 验证常规日志记不下来的异常流</text>
  <text x="76" y="211" fill="#334155" font-size="11">上游抛错 / 中途取消 / 流挂起 / 瞬时重试 → 搭配 replay.override.json</text>

  <rect x="610" y="172" width="530" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="626" y="192" font-size="11" font-weight="700" fill="#92400e">④ 跟随 DSH 升级核验多步编排未漂移</text>
  <text x="626" y="211" fill="#334155" font-size="11">拿既有轨迹在新版运行时重放，充当轻量跨版本兼容回归网</text>

  <rect x="60" y="228" width="1080" height="48" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="76" y="248" font-size="11" font-weight="700" fill="#92400e">⑤ 核心交付面在 Web 自定义卡片 / 面板 UI</text>
  <text x="76" y="267" fill="#334155" font-size="11">优先建立更轻快的 DOM 渲染期望（expected.dom.json 结构化比对），无需绕一整圈模型会话回放</text>

  <text x="60" y="300" font-size="11" fill="#92400e">明确不建的场景：纯内部实现重构、纯样式微调、仅改内部服务接口，以及含并发子智能体扇出的流程（脚本按序抢占会乱序）。</text>

  <line x1="120" y1="364" x2="1120" y2="364" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="368" font-size="11" font-weight="700" fill="#64748b">默认必做</text>
  <text x="1150" y="368" text-anchor="end" font-size="11" font-weight="700" fill="#b45309">按需启用 →</text>

  <rect x="40" y="498" width="248" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="164" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">第 1 步 · 导出与入口守卫</text>
  <text x="164" y="544" text-anchor="middle" font-size="11" fill="#64748b">断言无 default 导出、unwrapExports</text>
  <text x="164" y="562" text-anchor="middle" font-size="11" fill="#64748b">一行代码挡住 postmortem 0001 同类坑</text>

  <rect x="316" y="450" width="248" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="440" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">第 2 步 · 行为与卸载清理单测</text>
  <text x="440" y="496" text-anchor="middle" font-size="11" fill="#64748b">挂真实下游服务，只替掉最外层 I/O；</text>
  <text x="440" y="514" text-anchor="middle" font-size="11" fill="#64748b">销毁 fiber 断言注册副作用彻底清除</text>

  <rect x="592" y="402" width="248" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="716" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">第 3 步 · 真实 Loader 装配测试</text>
  <text x="716" y="448" text-anchor="middle" font-size="11" fill="#64748b">用真 Loader 读 cordis.yml 启动插件，</text>
  <text x="716" y="466" text-anchor="middle" font-size="11" fill="#64748b">同时校验 Config 生效与模型可见文案</text>

  <rect x="868" y="342" width="292" height="140" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1014" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">第 4 步 · 录制快照（按需）</text>
  <text x="1014" y="390" text-anchor="middle" font-size="11" fill="#166534">独立智能体仓放顶层 snapshots/；小包可放 tests/</text>
  <text x="1014" y="410" text-anchor="middle" font-size="11" fill="#334155">UI 优先：expected.dom.json 渲染期望</text>
  <text x="1014" y="428" text-anchor="middle" font-size="11" fill="#334155">组装与轨迹：session.jsonl + override</text>
  <text x="1014" y="446" text-anchor="middle" font-size="11" fill="#334155">+ world.expected.json 外部终态断言</text>
  <text x="1014" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">夹具进 Git，原始 .sessions/ 进 gitignore</text>

  <line x1="288" y1="536" x2="316" y2="492" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="564" y1="488" x2="592" y2="444" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="840" y1="438" x2="868" y2="412" stroke="#4ade80" stroke-width="2" marker-end="url(#ld-a)"/>

  <line x1="40" y1="600" x2="1160" y2="600" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="622" text-anchor="middle" font-size="11" fill="#64748b">跳过前 3 步直接建录制快照，等于拿维护成本最高的重武器去补一行单测就能抓到的低级装载错误</text>

  <rect x="40" y="640" width="1120" height="94" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="60" y="664" font-size="12" font-weight="700" fill="#991b1b">六个避坑底线</text>
  <text x="60" y="686" fill="#334155" font-size="11">① 别照搬主仓多世代配额与四入口门禁　② 别装强绑 vitest 的 dsh-session-snapshot（只用 dsh-llm-replay）　③ 别拿手写 chunk 当日常主路径</text>
  <text x="60" y="706" fill="#334155" font-size="11">④ 别把含隐私的用户日志直接进 Git（改写成最小 authored 轨迹）　⑤ 别只对比日志不写语义断言　⑥ 别用回放彻底取代真模型冒烟测试</text>
  <text x="60" y="726" fill="#991b1b" font-size="11" font-weight="700">验收铁律：每条快照守卫上线前必须先故意改坏期望看到红灯（exit 1），再恢复变绿；没红过的守卫按不存在处理。</text>
</svg>
