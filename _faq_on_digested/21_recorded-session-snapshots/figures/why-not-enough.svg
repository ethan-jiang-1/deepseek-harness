<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>为什么单元测试、手写流式 Mock 与带密钥真模型 e2e 仍会漏掉真实组装缺陷</title>
  <desc>上方总结 postmortem 0001 的教训：178 个单测全绿、100% 行覆盖率，ACP 插件发版后却彻底不可用，因为没有任何测试走过真实配置装载路径与子进程调用链。中部三列对比单元测试、手写流式 Mock 与带密钥真模型 e2e 各自能验证的内容与共同盲区——尤其无密钥 PR CI 中真模型 e2e 会自动跳过，导致测试全绿而真实组装根本没跑过。底部说明录制会话快照如何同时保住真实组装路径与无密钥逐字节确定性重放。</desc>
  <defs>
    <marker id="wn-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">三种常规测试手段，留下一格共同盲区</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">起点是 postmortem 0001：178 个单测全绿、100% 行覆盖率，dsh --profile acp 发版后却彻底瘫痪</text>

  <rect x="40" y="80" width="380" height="102" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="106" font-size="12" font-weight="700" fill="#334155">三种手段各司其职，谁也不被淘汰</text>
  <text x="60" y="129" font-size="11" fill="#475569">单测、Mock 与真模型 e2e 各有不可替代的防线；</text>
  <text x="60" y="149" font-size="11" fill="#475569">录制快照补上的不是它们的失职，而是三者合在一起</text>
  <text x="60" y="169" font-size="11" fill="#64748b">依然漏掉的「真实发布组装 + 无密钥确定性回归」。</text>

  <rect x="440" y="80" width="720" height="102" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="462" y="106" font-size="12" font-weight="700" fill="#991b1b">事故复盘（postmortem 0001）：两个独立缺陷漏网的共同根源</text>
  <text x="462" y="129" font-size="11" fill="#334155">• 没有任何一条测试走过插件发布时的真实配置装载路径（cordis.yml）与真实子进程调用链</text>
  <text x="462" y="149" font-size="11" fill="#334155">• 100% 行覆盖率只证明代码行执行过，证明不了按发布形态装得起来（误写 export default 直接丢掉 inject）</text>
  <text x="462" y="169" font-size="11" fill="#64748b">核心教训：问题不在于单测写得不够多，而在于测试走的路径和真实交付路径根本不是同一条。</text>

  <line x1="218" y1="186" x2="218" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>
  <line x1="600" y1="186" x2="600" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>
  <line x1="982" y1="186" x2="982" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>

  <rect x="40" y="224" width="356" height="226" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="218" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">单元测试（手搭 ctx.plugin）</text>
  <rect x="60" y="268" width="316" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="76" y="290" font-size="11" font-weight="700" fill="#166534">能证明什么</text>
  <text x="76" y="310" font-size="11" fill="#334155">分支逻辑、参数校验、错误返回与</text>
  <text x="76" y="328" font-size="11" fill="#334155">fiber 卸载清理——跑得最快最省的一层</text>
  <rect x="60" y="350" width="316" height="84" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="76" y="372" font-size="11" font-weight="700" fill="#991b1b">盲区在哪</text>
  <text x="76" y="392" font-size="11" fill="#334155">上下文由测试代码手搭，绕过 cordis.yml</text>
  <text x="76" y="410" font-size="11" fill="#334155">配置解析、具名导出拆包与跨进程边界，</text>
  <text x="76" y="426" font-size="11" fill="#334155">抓不住真实装载期的接线故障</text>

  <rect x="422" y="224" width="356" height="226" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">手写流式 Mock / HTTP 拦截</text>
  <rect x="442" y="268" width="316" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="458" y="290" font-size="11" font-weight="700" fill="#166534">能证明什么</text>
  <text x="458" y="310" font-size="11" fill="#334155">无需真密钥即可跑通 agent-loop 与</text>
  <text x="458" y="328" font-size="11" fill="#334155">会话持久化管道，验证内部桥接逻辑</text>
  <rect x="442" y="350" width="316" height="84" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="458" y="372" font-size="11" font-weight="700" fill="#991b1b">盲区在哪</text>
  <text x="458" y="392" font-size="11" fill="#334155">手编 SSE 假分片不是真实系统产物；</text>
  <text x="458" y="410" font-size="11" fill="#334155">一旦上游适配器或流事件结构演进，假脚本</text>
  <text x="458" y="426" font-size="11" fill="#334155">不会报错，只会与线上真行为悄悄脱节</text>

  <rect x="804" y="224" width="356" height="226" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="982" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">带密钥真模型 e2e（test:e2e）</text>
  <rect x="824" y="268" width="316" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="840" y="290" font-size="11" font-weight="700" fill="#166534">能证明什么</text>
  <text x="840" y="310" font-size="11" fill="#334155">今天对线上真模型依然能调通——</text>
  <text x="840" y="328" font-size="11" fill="#334155">唯一能验证外部模型接口未变的一层</text>
  <rect x="824" y="350" width="316" height="84" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="840" y="372" font-size="11" font-weight="700" fill="#991b1b">盲区在哪</text>
  <text x="840" y="392" font-size="11" fill="#334155">每次采样输出不同，无法逐字比对请求头；</text>
  <text x="840" y="410" font-size="11" font-weight="600" fill="#991b1b">无密钥 PR CI 自动跳过——测试全绿，真实组装</text>
  <text x="840" y="426" font-size="11" font-weight="600" fill="#991b1b">却没跑过；偶发流故障也无法固定复现</text>

  <line x1="600" y1="454" x2="600" y2="484" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>

  <rect x="40" y="490" width="1120" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="62" y="516" font-size="13" font-weight="700" fill="#1e40af">录制会话快照补齐的正是这一格：走完整真实组装路径 + 无密钥逐字节确定性重放</text>
  <text x="62" y="540" font-size="11" fill="#334155">本地带密钥真跑一次留存 session.jsonl；CI 无密钥回放时走完整 dsh 配置装载，从同一份日志还原模型流并逐行比对请求头与落盘结果。</text>
  <text x="62" y="562" font-size="11" fill="#475569">主仓借此顺带守护历史会话格式的向前兼容读取；外部插件仓无需抄多世代配额，只需拿 dsh-llm-replay 锁住自身模型可见面与多步回归。</text>
</svg>
