<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>为什么单测、mock 与 with-key e2e 都填不上那个缺口</title>
  <desc>三列并排，每列写清一种既有手段证明什么、缺口在哪。单元测试：证明组件行为，但装配是手搭的，不经过真实装载路径与真实调用拓扑；覆盖率只证明行跑过。mock 与手搭 ctx.plugin：证明管道能通，但手搭的装配永远复现不了 Loader 的导出解析问题——postmortem 0001 的 bug 就是这样漏掉的。with-key e2e：证明今天对真模型还能工作，但不确定、需要 key，而 PR CI 刻意无 key，没 key 就自跳，于是会绿着但不跑真套件。底部一条带子说明快照补上的正是这三者共同的缺口：组装之后的完整转录，无 key 可逐字节复现，并且能把历史格式世代留在语料里。</desc>
  <defs>
    <marker id="wn-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">三种既有手段，三个填不上的缺口</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">起点是一次事故：178 个单测全绿、100% 行覆盖，而 ACP 桥在生产里完全不能用</text>

  <rect x="40" y="80" width="360" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="106" font-size="12" font-weight="700" fill="#334155">没有测试是免费的：三种手段各自证明了什么</text>
  <text x="60" y="130" fill="#475569" font-size="11">它们全都保留，谁也没被取代。快照补的不是它们的失败，</text>
  <text x="60" y="148" fill="#475569" font-size="11">而是它们共同覆盖不到的那一格。</text>
  <text x="60" y="170" fill="#64748b" font-size="11">下面三列 = 三种手段的「证明」与「缺口」。</text>

  <rect x="424" y="80" width="736" height="104" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="444" y="106" font-size="12" font-weight="700" fill="#991b1b">事故的形状：两条根因都被同一种盲区放过</text>
  <text x="444" y="130" fill="#334155" font-size="11">「no test exercised the plugin through its real load path or its real call topology.」——postmortem 0001</text>
  <text x="444" y="152" fill="#334155" font-size="11">「Coverage proves lines ran; it says nothing about whether the feature works the way it ships.」——同文件</text>
  <text x="444" y="174" fill="#64748b" font-size="11">所以缺口不是「测得不够多」，而是「测的那条路径和发布的那条路径不是同一条」。</text>

  <line x1="230" y1="196" x2="230" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>
  <line x1="600" y1="196" x2="600" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>
  <line x1="970" y1="196" x2="970" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>

  <rect x="40" y="230" width="360" height="220" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">单元测试</text>
  <rect x="60" y="274" width="320" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="76" y="296" font-size="11" font-weight="700" fill="#166534">证明什么</text>
  <text x="76" y="316" fill="#334155" font-size="11">组件行为、错误路径、事件顺序、</text>
  <text x="76" y="334" fill="#334155" font-size="11">契约回归——最快、最便宜的一层</text>
  <rect x="60" y="356" width="320" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="76" y="378" font-size="11" font-weight="700" fill="#991b1b">缺口在哪</text>
  <text x="76" y="398" fill="#334155" font-size="11">装配常常是手搭的 ctx.plugin(...)，</text>
  <text x="76" y="416" fill="#334155" font-size="11">不经过真实装载路径；覆盖率只说明</text>
  <text x="76" y="432" fill="#334155" font-size="11">行跑过，不说明按发布形态工作</text>

  <rect x="420" y="230" width="360" height="220" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">mock 与手搭装配</text>
  <rect x="440" y="274" width="320" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="456" y="296" font-size="11" font-weight="700" fill="#166534">证明什么</text>
  <text x="456" y="316" fill="#334155" font-size="11">管道能通：脚本化模型 + 真 loop +</text>
  <text x="456" y="334" fill="#334155" font-size="11">真 session，证明桥把字节搬对了</text>
  <rect x="440" y="356" width="320" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="456" y="378" font-size="11" font-weight="700" fill="#991b1b">缺口在哪</text>
  <text x="456" y="398" fill="#334155" font-size="11">手搭的装配永远复现不了 Loader 的</text>
  <text x="456" y="416" fill="#334155" font-size="11">导出解析问题——一个多余的</text>
  <text x="456" y="432" fill="#334155" font-size="11">export default 就能吃掉整个命名空间</text>

  <rect x="800" y="230" width="360" height="220" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="980" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">with-key e2e</text>
  <rect x="820" y="274" width="320" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="836" y="296" font-size="11" font-weight="700" fill="#166534">证明什么</text>
  <text x="836" y="316" fill="#334155" font-size="11">今天对真模型还能工作——唯一</text>
  <text x="836" y="334" fill="#334155" font-size="11">能证明「活着」的一层</text>
  <rect x="820" y="356" width="320" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="836" y="378" font-size="11" font-weight="700" fill="#991b1b">缺口在哪</text>
  <text x="836" y="398" fill="#334155" font-size="11">不确定；PR CI 刻意无 key，没 key</text>
  <text x="836" y="416" fill="#334155" font-size="11">就自跳，于是会「绿着但不跑真套件」。</text>
  <text x="836" y="432" fill="#334155" font-size="11">它也不能把一次失败固定下来</text>

  <line x1="600" y1="458" x2="600" y2="486" stroke="#64748b" stroke-width="2" marker-end="url(#wn-a)"/>

  <rect x="40" y="494" width="1120" height="86" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="60" y="520" font-size="13" font-weight="700" fill="#1e40af">快照补上的正是这一格：组装之后的完整转录，而且无 key 可逐字节复现</text>
  <text x="60" y="544" fill="#334155" font-size="11">录制时用真模型跑一次并提交持久化日志；回放时从同一份日志反推模型流，跑完再和它比对。输入与期望是同一个文件。</text>
  <text x="60" y="566" fill="#475569" font-size="11">附带产出：历史格式世代留在语料里，「已发布的用户数据还能不能读」有了提交在案的样本。</text>
</svg>
