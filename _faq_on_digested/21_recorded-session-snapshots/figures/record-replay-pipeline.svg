<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>录制一次、提交夹具、无密钥回放：插件仓的最小可用链路</title>
  <desc>左上是录制环：人工带 API key 用真模型跑一次 dsh，加一层把会话日志写成明文的补丁，得到 session.vN.jsonl。中间是提交进仓：把日志拷入 snapshots/某场景/session.jsonl，它是明文、带整数 version 的持久化资产，同时充当回放输入与期望输出。左下是回放环：CI 用回放补丁关掉全部真实模型与标题生成入口，挂上 dsh-llm-replay 读本仓夹具按位置吐模型流，全过程无需密钥。右侧列出接线避坑要点：用 --dump-config 核准被禁入口 id、区分 file 与 overrideFile、保持任务文本与调用次数一致、锁定包版本。</desc>
  <defs>
    <marker id="rp-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="rp-g" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">录制一次 · 提交夹具 · 无密钥回放</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">外部插件仓只需复用一个已发布插件：@deepseek-ai/dsh-llm-replay</text>

  <rect x="40" y="76" width="740" height="188" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="60" y="102" font-size="13" font-weight="700" fill="#92400e">① 录制环（本地人工执行，需 API Key，不进 CI）</text>

  <rect x="60" y="118" width="212" height="60" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="166" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">真模型跑一次</text>
  <text x="166" y="162" text-anchor="middle" font-size="11" fill="#334155">dsh --profile headless</text>
  <text x="166" y="176" text-anchor="middle" font-size="11" fill="#334155">--patch record.patch.yml</text>

  <line x1="278" y1="148" x2="308" y2="148" stroke="#b45309" stroke-width="2" marker-end="url(#rp-a)"/>

  <rect x="314" y="118" width="212" height="60" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="420" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">关掉默认压缩</text>
  <text x="420" y="162" text-anchor="middle" font-size="11" fill="#334155">compression: none</text>
  <text x="420" y="176" text-anchor="middle" font-size="11" fill="#64748b">默认 zstd，回放器只读明文</text>

  <line x1="532" y1="148" x2="562" y2="148" stroke="#b45309" stroke-width="2" marker-end="url(#rp-a)"/>

  <rect x="568" y="118" width="192" height="60" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="664" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">确认外部结果正确</text>
  <text x="664" y="162" text-anchor="middle" font-size="11" fill="#334155">.sessions/…/session.vN.jsonl</text>
  <text x="664" y="176" text-anchor="middle" font-size="11" fill="#64748b">一行一事件明文轨迹</text>

  <rect x="60" y="192" width="700" height="58" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text x="76" y="214" font-size="11" font-weight="700" fill="#92400e">零配置替代路径：从会话导出取明文</text>
  <text x="76" y="234" fill="#334155" font-size="11">Web 界面会话菜单「Download session log」或 /export 导出的 zip 内始终是解码后的明文 JSONL，无需改 compression。</text>

  <line x1="410" y1="264" x2="410" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#rp-a)"/>

  <rect x="40" y="300" width="740" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="60" y="326" font-size="13" font-weight="700" fill="#334155">② 审阅并提交进 Git（同 PR 入库）</text>
  <rect x="60" y="336" width="700" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="359" font-size="11" fill="#334155">snapshots/&lt;case-slug&gt;/session.jsonl　←　同时充当回放输入与期望输出；首行 header 须带整数 version</text>

  <line x1="410" y1="386" x2="410" y2="414" stroke="#15803d" stroke-width="2" marker-end="url(#rp-g)"/>

  <rect x="40" y="422" width="740" height="188" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="60" y="448" font-size="13" font-weight="700" fill="#166534">③ 回放环（CI 每个 PR 无密钥自动跑）</text>

  <rect x="60" y="464" width="212" height="60" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="166" y="488" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">禁掉全部真模型入口</text>
  <text x="166" y="508" text-anchor="middle" font-size="11" fill="#334155">llm-deepseek / account</text>
  <text x="166" y="522" text-anchor="middle" font-size="11" fill="#334155">及 session-title-llm</text>

  <line x1="278" y1="494" x2="308" y2="494" stroke="#15803d" stroke-width="2" marker-end="url(#rp-g)"/>

  <rect x="314" y="464" width="212" height="60" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="420" y="488" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">llm-replay 接管</text>
  <text x="420" y="508" text-anchor="middle" font-size="11" fill="#334155">从日志反推并按序吐流</text>
  <text x="420" y="522" text-anchor="middle" font-size="11" fill="#64748b">零外部网络请求</text>

  <line x1="532" y1="494" x2="562" y2="494" stroke="#15803d" stroke-width="2" marker-end="url(#rp-g)"/>

  <rect x="568" y="464" width="192" height="60" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="664" y="488" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">比对日志 + 独立断言</text>
  <text x="664" y="508" text-anchor="middle" font-size="11" fill="#334155">校验 request/header</text>
  <text x="664" y="522" text-anchor="middle" font-size="11" fill="#64748b">与外部文件/业务状态</text>

  <rect x="60" y="538" width="700" height="56" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="76" y="560" font-size="11" font-weight="700" fill="#166534">为什么维护轻巧</text>
  <text x="76" y="580" fill="#334155" font-size="11">无需手写流式 mock 脚本：deriveReplayScript() 直接将日志中每条 assistant/message 展开为按位置绑定的模型输出流。</text>

  <rect x="800" y="76" width="360" height="292" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="820" y="102" font-size="13" font-weight="700" fill="#991b1b">接线避坑清单</text>
  <text x="820" y="128" font-size="11" font-weight="700" fill="#991b1b">① 先用 --dump-config 核准入口 id</text>
  <text x="820" y="148" fill="#334155" font-size="11">补丁写错 id 不会报错，本机有凭据就会静默</text>
  <text x="820" y="166" fill="#334155" font-size="11">调真模型；连 session-title-llm 也要一并禁掉。</text>
  <text x="820" y="194" font-size="11" font-weight="700" fill="#991b1b">② 任务输入直接从夹具提取</text>
  <text x="820" y="214" fill="#334155" font-size="11">驱动脚本从 session.jsonl 读首条 user/message，</text>
  <text x="820" y="232" fill="#334155" font-size="11">并校验模型调用次数完全消费（assertConsumed）。</text>
  <text x="820" y="260" font-size="11" font-weight="700" fill="#991b1b">③ 并发子智能体不可用于回放</text>
  <text x="820" y="280" fill="#334155" font-size="11">子会话按首次请求顺序抢脚本，并发扇出会乱序。</text>
  <text x="820" y="308" font-size="11" font-weight="700" fill="#991b1b">④ 回放包与 CLI 版本严格锁定</text>
  <text x="820" y="328" fill="#334155" font-size="11">加载时强校验会话格式目录版本，错配即报错。</text>
  <text x="820" y="352" fill="#64748b" font-size="11">裸 ReplayEntry[] 只能放 overrideFile，不能塞进 file。</text>

  <rect x="800" y="384" width="360" height="226" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="820" y="410" font-size="13" font-weight="700" fill="#1e40af">这套链路为你锁住什么</text>
  <rect x="820" y="424" width="320" height="38" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="836" y="448" fill="#1e40af" font-size="11">无密钥的真实组装回归 —— 每个 PR 自动执行</text>
  <rect x="820" y="470" width="320" height="38" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="836" y="494" fill="#1e40af" font-size="11">确定性异常复现 —— 配合 override 测抛错与取消</text>
  <rect x="820" y="516" width="320" height="38" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="836" y="540" fill="#1e40af" font-size="11">模型可见面守卫 —— 盯紧 request/header 每一处变化</text>
  <text x="820" y="576" fill="#64748b" font-size="11">切记：录制前先核实外部运行结果正确，防固化缺陷。</text>
</svg>
