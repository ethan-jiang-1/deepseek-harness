<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>录制一次、提交夹具、无密钥回放：外部插件仓的最小可用链路</title>
  <desc>左上录制环：本地人工带 API Key 跑一次 dsh（叠一层 compression: none 补丁或从 Web /export 导出明文），核实外部副作用正确后产出明文日志。中部入库环：将审阅过的夹具拷入 snapshots/某场景/session.jsonl 同 PR 提交进 Git，临时 .sessions 目录写入 .gitignore。左下回放环：CI 禁用全部真模型与标题生成模型入口，挂载公开插件 @deepseek-ai/dsh-llm-replay 无密钥重演并比对日志与外部状态。右侧列出四项静默失效避坑要点与三项守护收益。</desc>
  <defs>
    <marker id="rp-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="rp-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
    <marker id="rp-g" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">录制一次 · 提交夹具 · 无密钥回放</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">外部插件仓只需安装同 CLI 版本的公开包：@deepseek-ai/dsh-llm-replay</text>

  <rect x="40" y="76" width="740" height="188" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="60" y="102" font-size="13" font-weight="700" fill="#92400e">① 录制环（本地人工执行，需 API Key，不进 CI）</text>

  <rect x="58" y="116" width="210" height="62" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="163" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">真模型跑一次</text>
  <text x="163" y="158" text-anchor="middle" font-size="11" fill="#334155">dsh --profile headless</text>
  <text x="163" y="172" text-anchor="middle" font-size="11" fill="#64748b">--patch record.patch.yml</text>

  <line x1="272" y1="147" x2="298" y2="147" stroke="#b45309" stroke-width="2" marker-end="url(#rp-b)"/>

  <rect x="304" y="116" width="210" height="62" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="409" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">输出独立明文日志</text>
  <text x="409" y="158" text-anchor="middle" font-size="11" fill="#334155">compression: none + 独立 root</text>
  <text x="409" y="172" text-anchor="middle" font-size="11" fill="#64748b">默认 zstd，回放器只读明文</text>

  <line x1="518" y1="147" x2="544" y2="147" stroke="#b45309" stroke-width="2" marker-end="url(#rp-b)"/>

  <rect x="550" y="116" width="212" height="62" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="656" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">核实外部真实结果</text>
  <text x="656" y="158" text-anchor="middle" font-size="11" fill="#334155">.sessions/ 下明文 .jsonl</text>
  <text x="656" y="172" text-anchor="middle" font-size="11" fill="#64748b">确认磁盘文件与行为无误</text>

  <rect x="58" y="192" width="704" height="56" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text x="76" y="213" font-size="11" font-weight="700" fill="#92400e">零配置替代路径：Web 会话直接导出明文</text>
  <text x="76" y="233" font-size="11" fill="#334155">点会话标题栏「Download session log」或输入 /export，导出的 zip 内自带解码重序列化后的标准明文 JSONL。</text>

  <line x1="410" y1="264" x2="410" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#rp-a)"/>

  <rect x="40" y="298" width="740" height="88" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="60" y="324" font-size="13" font-weight="700" fill="#334155">② 审阅并同 PR 提交进 Git（禁开 Git LFS；临时 .sessions/ 写入 .gitignore）</text>
  <rect x="58" y="336" width="704" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="359" font-size="11" fill="#334155">snapshots/&lt;case-slug&gt;/session.jsonl　←　兼作回放输入与期望输出；首行须带整数 version</text>

  <line x1="410" y1="386" x2="410" y2="414" stroke="#15803d" stroke-width="2" marker-end="url(#rp-g)"/>

  <rect x="40" y="420" width="740" height="190" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="60" y="446" font-size="13" font-weight="700" fill="#166534">③ 回放环（CI 每个 PR 无密钥自动重演）</text>

  <rect x="58" y="462" width="210" height="62" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="163" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">禁掉全部真模型入口</text>
  <text x="163" y="504" text-anchor="middle" font-size="11" fill="#334155">llm-deepseek / account</text>
  <text x="163" y="518" text-anchor="middle" font-size="11" fill="#64748b">连同 session-title-llm</text>

  <line x1="272" y1="493" x2="298" y2="493" stroke="#15803d" stroke-width="2" marker-end="url(#rp-g)"/>

  <rect x="304" y="462" width="210" height="62" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="409" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">llm-replay 接管</text>
  <text x="409" y="504" text-anchor="middle" font-size="11" fill="#334155">从日志反推并按序吐流</text>
  <text x="409" y="518" text-anchor="middle" font-size="11" fill="#64748b">隔离 DSH_HOME 零外网</text>

  <line x1="518" y1="493" x2="544" y2="493" stroke="#15803d" stroke-width="2" marker-end="url(#rp-g)"/>

  <rect x="550" y="462" width="212" height="62" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="656" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">比对日志 + 独立断言</text>
  <text x="656" y="504" text-anchor="middle" font-size="11" fill="#334155">核验请求头与调用轮数</text>
  <text x="656" y="518" text-anchor="middle" font-size="11" fill="#64748b">+ 外部文件与禁区错误码</text>

  <rect x="58" y="538" width="704" height="56" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="76" y="559" font-size="11" font-weight="700" fill="#166534">为什么搭建轻巧</text>
  <text x="76" y="579" font-size="11" fill="#334155">无需手写流式分片：回放器自动把日志中每条 assistant/message 展开为按首次调用位置绑定的模型输出流。</text>

  <rect x="800" y="76" width="360" height="304" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="822" y="102" font-size="13" font-weight="700" fill="#991b1b">四个静默失效避坑点</text>
  <text x="822" y="128" font-size="11" font-weight="700" fill="#991b1b">① 先跑 --dump-config 核准被禁行 id</text>
  <text x="822" y="147" font-size="11" fill="#334155">补丁写错 id 不会崩溃，本机有凭据就会静默调</text>
  <text x="822" y="164" font-size="11" fill="#334155">真模型；务必在无凭据 DSH_HOME 下验一次。</text>
  <text x="822" y="190" font-size="11" font-weight="700" fill="#991b1b">② 别漏禁 session-title-llm 标题模型</text>
  <text x="822" y="209" font-size="11" fill="#334155">标题生成同样走 llm/stream，会抢走回放槽位。</text>
  <text x="822" y="235" font-size="11" font-weight="700" fill="#991b1b">③ 输入取自夹具 + 断言轮数跑满</text>
  <text x="822" y="254" font-size="11" fill="#334155">从首条 user/message 读任务文本；外部命令启动</text>
  <text x="822" y="271" font-size="11" fill="#334155">须主动断言 assistant/message 轮数完全消费。</text>
  <text x="822" y="297" font-size="11" font-weight="700" fill="#991b1b">④ 版本严格对齐 + 区分 file 与 overrideFile</text>
  <text x="822" y="316" font-size="11" fill="#334155">回放包须锁同 CLI 版本；裸 ReplayEntry[] 只能</text>
  <text x="822" y="333" font-size="11" fill="#334155">放 overrideFile；并发子智能体不可做回放。</text>
  <text x="822" y="360" font-size="11" fill="#64748b">Cordis 补丁 config 是整块替换，勿漏写独立 root。</text>

  <rect x="800" y="394" width="360" height="216" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="822" y="420" font-size="13" font-weight="700" fill="#1e40af">这套最小链路为你守住什么</text>
  <rect x="822" y="434" width="316" height="38" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="838" y="458" font-size="11" fill="#1e40af">无密钥真实组装回归 —— 开源 PR CI 每次必跑</text>
  <rect x="822" y="480" width="316" height="38" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="838" y="504" font-size="11" fill="#1e40af">确定性异常复现 —— 配 override 测抛错与取消</text>
  <rect x="822" y="526" width="316" height="38" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="838" y="550" font-size="11" fill="#1e40af">模型可见面守卫 —— 盯紧提示词与工具表每处 diff</text>
  <text x="822" y="590" font-size="11" fill="#475569">重录时直接覆盖单文件，不背多世代兼容包袱。</text>
</svg>
