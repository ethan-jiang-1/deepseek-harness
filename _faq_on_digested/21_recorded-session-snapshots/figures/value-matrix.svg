<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>录制快照对插件开发的实际收益、五层测试分工与硬上限</title>
  <desc>上半对照录制快照对插件开发的三类实际收益（多步轨迹与跨版本回归、模型流相关偶发 bug 确定性复现、锁定模型可见输入面）及其触发时机与维护代价。中部并列五层测试手段各自验证与不验证的边界。底部强调 postmortem 0002 的教训：快照只是变更探测器而非正确性裁判，刷新快照不能替代外部真实状态核验与独立语义断言。</desc>

  <rect width="1200" height="660" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">录制快照对插件开发的收益、分工与硬上限</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">收益在于锁住单测与假脚本够不到的「真实组装转录」；代价在于长期重录与人工逐行审 diff</text>

  <rect x="40" y="78" width="204" height="28" rx="6" fill="#e2e8f0"/>
  <text x="142" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">核心收益维度</text>
  <rect x="252" y="78" width="300" height="28" rx="6" fill="#e2e8f0"/>
  <text x="402" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">实际解决什么问题</text>
  <rect x="560" y="78" width="300" height="28" rx="6" fill="#e2e8f0"/>
  <text x="710" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">什么时候启用</text>
  <rect x="868" y="78" width="292" height="28" rx="6" fill="#e2e8f0"/>
  <text x="1014" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">维护账单</text>

  <rect x="40" y="114" width="1120" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="52" y="126" width="180" height="54" rx="8" fill="#dbeafe"/>
  <text x="142" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">A · 轨迹与升版回归</text>
  <text x="142" y="169" text-anchor="middle" font-size="11" fill="#1e40af">端到端多步基线</text>
  <text x="266" y="147" font-size="11" fill="#334155">把组装后的模型收发与工具落盘</text>
  <text x="266" y="167" font-size="11" fill="#334155">固定成可逐行对比的确定性基线</text>
  <text x="574" y="147" font-size="11" fill="#334155">插件承担多步编排，或随 DSH 升版</text>
  <text x="574" y="167" font-size="11" fill="#334155">需确认既有会话行为未意外漂移</text>
  <text x="882" y="147" font-size="11" fill="#334155">首次带密钥真跑 + 变更后重录</text>
  <text x="882" y="167" font-size="11" fill="#64748b">PR 须逐行人工审阅 JSONL diff</text>

  <rect x="40" y="200" width="1120" height="78" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="52" y="212" width="180" height="54" rx="8" fill="#dcfce7"/>
  <text x="142" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">B · 偶发流 Bug 锁死</text>
  <text x="142" y="255" text-anchor="middle" font-size="11" fill="#166534">不可替代性最高</text>
  <text x="266" y="233" font-size="11" fill="#334155">把碰运气的流式怪病变成百分百重演；</text>
  <text x="266" y="253" font-size="11" fill="#334155">配合 override 注入断流、挂起与重试</text>
  <text x="574" y="233" font-size="11" fill="#334155">固定模型流后故障仍稳定复现</text>
  <text x="574" y="253" font-size="11" fill="#64748b">（借此区分代码缺陷与采样随机波动）</text>
  <text x="882" y="233" font-size="11" fill="#334155">手写脱敏最小 authored 轨迹</text>
  <text x="882" y="253" font-size="11" fill="#64748b">严禁重录脚本自动覆盖冲掉</text>

  <rect x="40" y="286" width="1120" height="78" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <rect x="52" y="298" width="180" height="54" rx="8" fill="#fde68a"/>
  <text x="142" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">C · 锁定模型可见面</text>
  <text x="142" y="341" text-anchor="middle" font-size="11" fill="#92400e">高性价比顺带断言</text>
  <text x="266" y="319" font-size="11" fill="#334155">直接核验 system/message 系统提示词</text>
  <text x="266" y="339" font-size="11" fill="#334155">与 request/header 工具 JSON Schema</text>
  <text x="574" y="319" font-size="11" fill="#334155">注入提示词、新增或修改工具参数、</text>
  <text x="574" y="339" font-size="11" fill="#334155">自定义上下文或会话事件投影</text>
  <text x="882" y="319" font-size="11" fill="#334155">零额外造假成本（轨迹自带）</text>
  <text x="882" y="339" font-size="11" fill="#64748b">小插件仓无需拆分旁路 sidecar</text>

  <rect x="40" y="378" width="1120" height="118" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="402" font-size="13" font-weight="700" fill="#334155">五层手段各管一段：谁验证什么、谁兜不住什么</text>

  <rect x="60" y="414" width="206" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="163" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">1 · 导出与行为单测</text>
  <text x="163" y="454" text-anchor="middle" font-size="11" fill="#475569">验具名导出、分支与清理</text>
  <text x="163" y="471" text-anchor="middle" font-size="11" fill="#64748b">不验真实配置装载</text>

  <rect x="278" y="414" width="206" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="381" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">2 · 真实 Loader 测试</text>
  <text x="381" y="454" text-anchor="middle" font-size="11" fill="#475569">验 cordis.yml 与依赖拓扑</text>
  <text x="381" y="471" text-anchor="middle" font-size="11" fill="#64748b">不验完整多步会话转录</text>

  <rect x="496" y="414" width="206" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="599" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">3 · 带密钥真模型 e2e</text>
  <text x="599" y="454" text-anchor="middle" font-size="11" fill="#475569">验今天对线上模型仍可通</text>
  <text x="599" y="471" text-anchor="middle" font-size="11" fill="#64748b">结果随机，无密钥 CI 跳过</text>

  <rect x="714" y="414" width="206" height="68" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="817" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">4 · 录制会话回放</text>
  <text x="817" y="454" text-anchor="middle" font-size="11" fill="#166534">验组装转录未漂、故障复现</text>
  <text x="817" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">自己分不清结果对错</text>

  <rect x="932" y="414" width="208" height="68" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1036" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">5 · 独立外部终态断言</text>
  <text x="1036" y="454" text-anchor="middle" font-size="11" fill="#475569">验磁盘文件与语义禁区</text>
  <text x="1036" y="471" text-anchor="middle" font-size="11" fill="#166534">守住业务正确性最后防线</text>

  <rect x="40" y="510" width="1120" height="126" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="62" y="536" font-size="13" font-weight="700" fill="#991b1b">硬上限警钟：快照只是「变更探测器」，绝不是「正确性裁判」（postmortem 0002）</text>
  <text x="62" y="560" font-size="11" fill="#334155">真实翻车：配置中错误的 !!js 条件导致 7 个文件系统场景工具全部禁用、日志记满 UNKNOWN_TOOL；盲目刷新快照却把故障录成了新基线并全绿放行。</text>
  <text x="62" y="582" font-size="11" fill="#334155">三条自保铁律：① 录制入库前先核实外部真实文件与副作用无误；② 配套独立 world.expected.json（禁录制脚本自动改写）；③ 写死错误码禁区断言。</text>
  <text x="62" y="606" font-size="11" font-weight="700" fill="#991b1b">去魅校准：主仓公开的四篇生产事故复盘（0001–0004）里，仅 0004 靠录制快照锁死回归——它是关键拼图，绝非万灵药。</text>
</svg>
