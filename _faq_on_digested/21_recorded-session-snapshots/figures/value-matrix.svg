<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>录制快照对插件开发的实际收益、测试分工与硬上限</title>
  <desc>上半是三类实际收益与维护成本对照：A 多步轨迹与跨版本回归、B 模型流相关 bug 稳定复现、C 锁定模型可见请求头（request/header）。中间是五层测试手段各自能验证与不能验证的边界：带密钥 e2e 验证今天对真模型仍可用，录制回放验证组装转录未发生意外漂移，两者互补。下半是红色硬上限警示：快照只是变更探测器而非正确性裁判，postmortem 0002 中快照刷新曾将 7 个场景的 UNKNOWN_TOOL 错误固化为期望输出，因此必须配独立语义与世界状态断言。</desc>

  <rect width="1200" height="700" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">录制快照对插件开发的收益与边界</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">收益在于锁住单测与 mock 摸不到的「真实组装转录」；代价在于长期维护与人工审阅 diff</text>

  <rect x="40" y="80" width="200" height="30" rx="6" fill="#e2e8f0"/>
  <text x="140" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">核心场景</text>
  <rect x="248" y="80" width="300" height="30" rx="6" fill="#e2e8f0"/>
  <text x="398" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">实际解决什么问题</text>
  <rect x="556" y="80" width="300" height="30" rx="6" fill="#e2e8f0"/>
  <text x="706" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">什么时候启用</text>
  <rect x="864" y="80" width="296" height="30" rx="6" fill="#e2e8f0"/>
  <text x="1012" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">维护成本</text>

  <rect x="40" y="118" width="1120" height="86" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="52" y="130" width="176" height="62" rx="8" fill="#dbeafe"/>
  <text x="140" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">A · 轨迹与升版回归</text>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#1e40af">守住端到端行为基线</text>
  <text x="260" y="150" fill="#334155" font-size="11">把组装后模型实际收发与落盘事件</text>
  <text x="260" y="170" fill="#334155" font-size="11">固定成可逐行对比的基线</text>
  <text x="568" y="150" fill="#334155" font-size="11">插件承担多步编排，或跟随 DSH 升版</text>
  <text x="568" y="170" fill="#334155" font-size="11">需要确认既有会话行为未漂移</text>
  <text x="876" y="150" fill="#334155" font-size="11">首次带密钥录制 + 后续变更时</text>
  <text x="876" y="170" fill="#334155" font-size="11">重录并人工审阅 JSONL diff</text>
  <text x="876" y="190" fill="#64748b" font-size="11">单测与手写 mock 无法覆盖这一层</text>

  <rect x="40" y="212" width="1120" height="86" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="52" y="224" width="176" height="62" rx="8" fill="#dcfce7"/>
  <text x="140" y="249" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">B · 偶发 Bug 复现</text>
  <text x="140" y="270" text-anchor="middle" font-size="11" fill="#166534">最具不可替代性</text>
  <text x="260" y="244" fill="#334155" font-size="11">把「再跑一次碰运气」变成确定性重放；</text>
  <text x="260" y="264" fill="#334155" font-size="11">抛错 / 挂起 / 取消 / 重试用 override 注入</text>
  <text x="568" y="244" fill="#334155" font-size="11">固定模型输出流后故障依然稳定重现</text>
  <text x="568" y="264" fill="#334155" font-size="11">（以此区分代码 bug 与模型随机波动）</text>
  <text x="876" y="244" fill="#334155" font-size="11">编写脱敏最小 authored 轨迹，</text>
  <text x="876" y="264" fill="#334155" font-size="11">异常流场景外挂 replay.override.json</text>
  <text x="876" y="284" fill="#64748b" font-size="11">真模型 e2e 能撞见但无法稳定锁死</text>

  <rect x="40" y="306" width="1120" height="86" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <rect x="52" y="318" width="176" height="62" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="140" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">C · 锁定模型可见面</text>
  <text x="140" y="364" text-anchor="middle" font-size="11" fill="#92400e">顺带拿到的高性价比断言</text>
  <text x="260" y="338" fill="#334155" font-size="11">直接对 request/header 与 system/message</text>
  <text x="260" y="358" fill="#334155" font-size="11">核验实际发往模型的提示词和工具定义</text>
  <text x="568" y="338" fill="#334155" font-size="11">新增工具、修改工具描述与参数 Schema、</text>
  <text x="568" y="358" fill="#334155" font-size="11">注入上下文或自定义会话事件投影</text>
  <text x="876" y="338" fill="#334155" font-size="11">几乎零额外搭建成本 ——</text>
  <text x="876" y="358" fill="#334155" font-size="11">请求头天然记录在会话轨迹中</text>
  <text x="876" y="378" fill="#64748b" font-size="11">小插件仓可直接保留明文无需拆 sidecar</text>

  <rect x="40" y="404" width="1120" height="112" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="428" font-size="12" font-weight="700" fill="#334155">各司其职：五层测试手段分别验证什么、不验证什么</text>
  <rect x="60" y="438" width="212" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="166" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">导出检查 + 行为单测</text>
  <text x="166" y="476" text-anchor="middle" font-size="11" fill="#64748b">验证命名导出、分支逻辑与清理</text>
  <text x="166" y="492" text-anchor="middle" font-size="11" fill="#64748b">不验证真实配置装配</text>
  <rect x="284" y="438" width="212" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">真实 Loader 装配测试</text>
  <text x="390" y="476" text-anchor="middle" font-size="11" fill="#64748b">验证 cordis.yml 解析与服务拓扑</text>
  <text x="390" y="492" text-anchor="middle" font-size="11" fill="#64748b">不验证完整多步会话转录</text>
  <rect x="508" y="438" width="212" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="614" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">带密钥真模型 e2e</text>
  <text x="614" y="476" text-anchor="middle" font-size="11" fill="#64748b">验证今天对真实模型还能跑通</text>
  <text x="614" y="492" text-anchor="middle" font-size="11" fill="#64748b">每次采样不同，无密钥 CI 会跳过</text>
  <rect x="732" y="438" width="212" height="62" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="838" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">录制会话回放</text>
  <text x="838" y="476" text-anchor="middle" font-size="11" fill="#166534">验证组装转录未变、故障稳定复现</text>
  <text x="838" y="492" text-anchor="middle" font-size="11" fill="#991b1b">不能自己判断业务对错（见下）</text>
  <rect x="956" y="438" width="184" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1048" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">独立语义与状态断言</text>
  <text x="1048" y="476" text-anchor="middle" font-size="11" fill="#64748b">校验外部文件终态与禁区</text>
  <text x="1048" y="492" text-anchor="middle" font-size="11" fill="#64748b">守住正确性的最后防线</text>

  <rect x="40" y="530" width="1120" height="106" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="60" y="556" font-size="13" font-weight="700" fill="#991b1b">硬上限：快照是变更探测器，绝不是正确性裁判（postmortem 0002）</text>
  <text x="60" y="580" fill="#334155" font-size="11">真实教训：配置缺陷导致 7 个文件系统场景的工具全部未注册、日志满是 UNKNOWN_TOOL，刷新快照却将其录成新基线，CI 照样全绿通过。</text>
  <text x="60" y="600" fill="#334155" font-size="11">三条铁律：① 录制前先检查外部真实副作用无误；② 刷新后的 diff 必须逐行人工审查；③ 必须配独立于会话文本的语义守卫与终态断言。</text>
  <text x="60" y="622" fill="#991b1b" font-size="11" font-weight="700">客观校准：主仓四篇生产事故复盘（0001–0004）里，仅 0004 一篇靠录制快照做回归锁 —— 它是关键拼图，但不是万灵药。</text>

  <text x="600" y="664" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">结论：先把前 3 步基础测试做扎实；命中触发条件再上录制快照，且上了就必须配独立断言。</text>
  <text x="600" y="686" text-anchor="middle" fill="#64748b" font-size="11">具体推进阶梯、目录布局与 Git 入库规范见 03-adoption-ladder-and-repo-layout.md。</text>
</svg>
