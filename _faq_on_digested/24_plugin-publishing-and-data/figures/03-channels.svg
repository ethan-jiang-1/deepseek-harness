<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="1040" height="590" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>六种插件来源渠道与统一的 Profile 落点</title>
  <desc>清晰平铺全部六种插件来源渠道：官方按需目录、第三方市场索引、npm 包名、GitHub/Git 仓库、本地 .tgz 归档、本地目录软链 link:，最终统一写入 $DSH_HOME/profiles/&lt;name&gt;/。</desc>
  <defs>
    <marker id="arr24c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1040" height="590" rx="8" fill="#f8fafc"/>
  <text x="520" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">六种分发与安装来源，汇聚同一个 Profile 落点</text>
  <text x="520" y="56" text-anchor="middle" font-size="11.5" fill="#475569">渠道只决定“代码从哪获取、构建在何时发生、信任门槛在哪”；落盘结构与启动装载规则完全一致</text>

  <!-- Row 1 of 3x2 grid -->
  <rect x="36" y="76" width="308" height="122" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="102" font-size="12.5" font-weight="700" fill="#1e3a8a">① npm registry（公开发布首选）</text>
  <text x="56" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1d4ed8">add @acme/dsh-pack@1.2.0</text>
  <text x="56" y="146" font-size="10.5" fill="#334155">作者发版前预构建 ESM 产物并配齐 files；</text>
  <text x="56" y="164" font-size="10.5" fill="#334155">支持精确版本锁定、平滑升级与指定旧版回退</text>
  <text x="56" y="184" font-size="10" fill="#475569">用户装包无需运行编译脚本，体验最稳</text>

  <rect x="366" y="76" width="308" height="122" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="386" y="102" font-size="12.5" font-weight="700" fill="#166534">② 本地 .tgz 归档（离线交付与验收）</text>
  <text x="386" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#15803d">add ./acme-dsh-pack-1.2.0.tgz</text>
  <text x="386" y="146" font-size="10.5" fill="#334155">由 pnpm pack 生成，安装时不执行 prepare；</text>
  <text x="386" y="164" font-size="10.5" fill="#334155">100% 复现 npm 真实文件树，最能抓出漏文件</text>
  <text x="386" y="184" font-size="10" fill="#475569">适合内网私有分发与发版前必跑的冒烟自检</text>

  <rect x="696" y="76" width="308" height="122" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="716" y="102" font-size="12.5" font-weight="700" fill="#0f172a">③ 本地目录软链 link:（开发联调）</text>
  <text x="716" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#334155">add link:/abs/path/to/pack</text>
  <text x="716" y="146" font-size="10.5" fill="#334155">软链本地插件目录，改码构建后可借 HMR 刷新；</text>
  <text x="716" y="164" font-size="10.5" fill="#334155">也可在 Plugins 页直接粘贴宿主机绝对路径</text>
  <text x="716" y="184" font-size="10" fill="#b45309">注意：不过滤 files 字段，不可替代 .tgz 验收</text>

  <!-- Row 2 of 3x2 grid -->
  <rect x="36" y="214" width="308" height="122" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="240" font-size="12.5" font-weight="700" fill="#92400e">④ GitHub / Git 仓库（源码内测）</text>
  <text x="56" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b45309">add github:acme/pack#&lt;40-hex-sha&gt;</text>
  <text x="56" y="284" font-size="10.5" fill="#334155">拉取仓库源码并在用户本机跑 prepare 构建；</text>
  <text x="56" y="302" font-size="10.5" fill="#334155">强烈建议锁死 40 位 commit SHA 防分支漂移</text>
  <text x="56" y="322" font-size="10" fill="#92400e">含构建脚本时须用户显式批准 allowBuilds</text>

  <rect x="366" y="214" width="308" height="122" rx="9" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="386" y="240" font-size="12.5" font-weight="700" fill="#9d174d">⑤ 第三方市场目录（Discover 索引）</text>
  <text x="386" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#be185d">https://market.example/index.json</text>
  <text x="386" y="284" font-size="10.5" fill="#334155">开启 Custom plugin markets 后挂载静态 JSON；</text>
  <text x="386" y="302" font-size="10.5" fill="#334155">条目指向 npm 包或带 40 位 SHA 的 Git 源码</text>
  <text x="386" y="322" font-size="10" fill="#9d174d">官方不内置市场源，仅验格式不背书代码安全</text>

  <rect x="696" y="214" width="308" height="122" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="716" y="240" font-size="12.5" font-weight="700" fill="#3730a3">⑥ 官方按需目录（第一方内置列表）</text>
  <text x="716" y="262" font-size="10" font-weight="700" fill="#4338ca">Plugins 页 On-demand Official 开关</text>
  <text x="716" y="284" font-size="10.5" fill="#334155">构建期脚本生成，仅收录公开 @deepseek-ai/dsh-*；</text>
  <text x="716" y="302" font-size="10.5" fill="#334155">正式版拉取同版本包，源码开发态自动走 link:</text>
  <text x="716" y="322" font-size="10" fill="#475569">仅限官方第一方包，外部作者走前五种渠道</text>

  <!-- Convergence arrows -->
  <line x1="190" y1="336" x2="190" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr24c)"/>
  <line x1="520" y1="336" x2="520" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr24c)"/>
  <line x1="850" y1="336" x2="850" y2="364" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr24c)"/>

  <!-- Unified Profile Landing -->
  <rect x="36" y="370" width="968" height="106" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="396" font-size="13" font-weight="700" fill="#0f172a">统一持久化落点：$DSH_HOME/profiles/&lt;name&gt;/（由 Plugin Manager 或 dsh plugin 维护，勿手改清单）</text>
  <text x="56" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1e3a8a">package.json      → 写入 dependencies 并追加至有序 dsh.profile.bundles</text>
  <text x="56" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1e3a8a">node_modules/     → 宿主机 pnpm 解压落盘的实际包与依赖树</text>
  <text x="56" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1e3a8a">cordis.patch.yml  → 用户覆盖层（叠在所有 Bundle 自带 Patch 之后）</text>
  <text x="610" y="420" font-size="10.5" fill="#334155">· CLI add 仅完成 pnpm 落盘与清单登记，不启动宿主；</text>
  <text x="610" y="440" font-size="10.5" fill="#334155">· 应用内 install_bundle 装完立即尝试激活并返回状态；</text>
  <text x="610" y="460" font-size="10.5" fill="#334155">· 全渠道统一执行 engines.dsh 版本兼容门禁。</text>

  <!-- Security bottom box -->
  <rect x="36" y="490" width="968" height="82" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="56" y="516" font-size="12.5" font-weight="700" fill="#991b1b">安全底线：安装第三方插件 = 授予当前操作系统用户级执行权限</text>
  <text x="56" y="538" font-size="10.5" fill="#7f1d1d">1. 获批的安装期脚本（postinstall / Git prepare）直接以宿主机当前用户权限执行，allowBuilds 批准记录按包名持久保存在该 Profile 中。</text>
  <text x="56" y="556" font-size="10.5" fill="#7f1d1d">2. 激活后的 Host 插件与宿主同处一个 Node 进程，运行在模型工具沙箱之外；安装前务必核对确认框里的真实来源仓库或包名。</text>
</svg>
