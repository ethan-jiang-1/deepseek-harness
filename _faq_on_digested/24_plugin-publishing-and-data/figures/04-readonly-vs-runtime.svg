<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="1040" height="590" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>只读插件包目录与包外三块运行期可写落点</title>
  <desc>包目录（import.meta.dirname / node_modules）只放可执行代码、Preset 定义与 SkillProvider 注册的随包技能，升级即整目录替换；运行期数据按归属落入会话日志、$DSH_HOME 托管存储与工作区目录（另由 $DSH_AGENTS_HOME 管跨工具技能）。</desc>
  <defs>
    <marker id="arr24d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1040" height="590" rx="8" fill="#f8fafc"/>
  <text x="520" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">只读插件包 vs 包外运行期数据：升级整包替换，状态留在三处可写归属地</text>
  <text x="520" y="56" text-anchor="middle" font-size="11.5" fill="#475569">随版本冻结的放包内（只读）；运行期产生或因用户/项目而异的留包外（各有唯一标准接口）</text>

  <!-- Upper container: Read-only Bundle Directory -->
  <rect x="32" y="76" width="976" height="218" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="52" y="104" font-size="13.5" font-weight="700" fill="#1e3a8a">只读包目录（import.meta.dirname / node_modules/&lt;pkg&gt; — 升级或重装即整目录替换）</text>
  <text x="52" y="124" font-size="10.5" fill="#1e40af">严禁在运行期往包目录回写状态或缓存！热更新 Bundle 时，运行中的活会话继续钉在旧 revision 上，新建会话与重启后切新版本。</text>

  <rect x="52" y="140" width="296" height="134" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="70" y="164" font-size="12" font-weight="700" fill="#1e3a8a">可执行插件代码与前端入口</text>
  <text x="70" y="186" font-size="10.5" fill="#334155">· Host 入口：apply(ctx) / Service</text>
  <text x="70" y="206" font-size="10.5" fill="#334155">· 前端扩展：dsh.client + ./client</text>
  <text x="70" y="226" font-size="10.5" fill="#334155">· Schema 配置定义：Config</text>
  <text x="70" y="250" font-size="10" fill="#64748b">不含任何业务数据、硬编码路径或明文密钥</text>

  <rect x="368" y="140" width="296" height="134" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="386" y="164" font-size="12" font-weight="700" fill="#1e3a8a">只读智能体预设（Preset 行）</text>
  <text x="386" y="186" font-size="10.5" fill="#334155">· 插入 @deepseek-ai/dsh-agent-preset</text>
  <text x="386" y="206" font-size="10.5" fill="#334155">· 固定 persona 人设前缀与职责边界</text>
  <text x="386" y="226" font-size="10.5" fill="#334155">· 显式列出该智能体的工具白名单</text>
  <text x="386" y="250" font-size="10" fill="#64748b">Registry 仅提供只读查询，无运行期回写接口</text>

  <rect x="684" y="140" width="304" height="134" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="702" y="164" font-size="12" font-weight="700" fill="#1e3a8a">静态模板与随包技能（SkillProvider）</text>
  <text x="702" y="186" font-size="10.5" fill="#334155">· assets/skills/&lt;name&gt;/SKILL.md + 参考文档</text>
  <text x="702" y="206" font-size="10.5" fill="#334155">· 默认不扫 node_modules，须注册 SkillProvider</text>
  <text x="702" y="226" font-size="10.5" fill="#334155">· 注册为 bundled（rank: 300）</text>
  <text x="702" y="250" font-size="10" fill="#64748b">允许用户在项目 .dsh/skills/（rank: 100）同名覆盖</text>

  <!-- Arrow across boundary -->
  <line x1="520" y1="294" x2="520" y2="324" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24d)"/>
  <text x="536" y="314" font-size="10.5" font-weight="700" fill="#334155">插件代码通过宿主标准服务读写包外数据</text>

  <!-- Lower container: 3 Runtime Writable Homes -->
  <rect x="32" y="330" width="976" height="196" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="52" y="356" font-size="13.5" font-weight="700" fill="#92400e">包外三块运行期可写落点（卸载插件默认全部保留，防误删用户资产）</text>

  <rect x="52" y="370" width="296" height="138" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text x="70" y="394" font-size="12" font-weight="700" fill="#92400e">① 会话轨迹（$DSH_HOME/sessions/）</text>
  <text x="70" y="416" font-size="10.5" fill="#334155">· 铁律：model-visible ⟺ logged</text>
  <text x="70" y="436" font-size="10.5" fill="#334155">· 复用工具返回、agent.inject() 与附件</text>
  <text x="70" y="456" font-size="10.5" fill="#334155">· 用 ctx.sessionProjections 纯函数派生状态</text>
  <text x="70" y="480" font-size="10" fill="#b45309">外部插件勿私造新的 SessionEventMap 持久事件</text>

  <rect x="368" y="370" width="296" height="138" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text x="386" y="394" font-size="12" font-weight="700" fill="#1e3a8a">② 跨会话宿主状态（$DSH_HOME）</text>
  <text x="386" y="416" font-size="10.5" fill="#334155">· 账本：ctx.storageDomain（带版本校验）</text>
  <text x="386" y="436" font-size="10.5" fill="#334155">· 密钥：ctx.credentials（动态 resolve）</text>
  <text x="386" y="456" font-size="10.5" fill="#334155">· 开关/缓存：Config.volatile() · dshCachePath</text>
  <text x="386" y="480" font-size="10" fill="#475569">统一用 resolveDshHome()，严禁硬编码 ~/.dsh</text>

  <rect x="684" y="370" width="304" height="138" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text x="702" y="394" font-size="12" font-weight="700" fill="#166534">③ 用户项目文件（工作区目录）</text>
  <text x="702" y="416" font-size="10.5" fill="#334155">· 经 ctx.workingDirectory + ctx.fs 访问</text>
  <text x="702" y="436" font-size="10.5" fill="#334155">· 聊天卡片交付走 present（仅记路径引用）</text>
  <text x="702" y="456" font-size="10.5" fill="#334155">· 受会话沙箱约束，严禁裸调 node:fs 绕过</text>
  <text x="702" y="480" font-size="10" fill="#475569">项目级约定留给项目 AGENTS.md 与 .dsh/skills/</text>

  <!-- Note bar on $DSH_AGENTS_HOME -->
  <rect x="32" y="538" width="976" height="36" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="520" y="561" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3730a3">补充根路径：跨 Agent 工具共享的全局技能与指令归 $DSH_AGENTS_HOME（默认 ~/.agents，经 resolveAgentsHome() 解析），插件切勿安装时静默篡改它。</text>
</svg>
