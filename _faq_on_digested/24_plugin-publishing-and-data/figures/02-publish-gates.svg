<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>插件发布的六项检查与三类失败后果</title>
  <desc>按真实失败表现将六道关口归为三档：直接拒绝安装或启动跳过（Patch 解析、版本兼容、已声明 Config）、装时不拦用时报错（入口导出与依赖共享、打包自包含与前端挂载）、仅管理页展示降级（多语言与图标元数据）。</desc>
  <rect width="1040" height="600" rx="8" fill="#f8fafc"/>
  <text x="520" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">从安装到激活的六道关口：按真实失败后果分三档核对</text>
  <text x="520" y="56" text-anchor="middle" font-size="11.5" fill="#475569">“能装进依赖树”不等于“能正常激活工作”——区分哪些当场拒装、哪些运行期才崩、哪些仅展示降级</text>

  <!-- Group 1: Red - Immediate Reject / Skip -->
  <rect x="32" y="76" width="976" height="164" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="52" y="102" font-size="13" font-weight="700" fill="#991b1b">第一档 · 直接拒绝安装 / 启动时跳过（框架主动拦截）</text>

  <rect x="52" y="116" width="300" height="108" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="68" y="138" font-size="11.5" font-weight="700" fill="#991b1b">① Patch 清单与可解析性</text>
  <text x="68" y="158" font-size="10.5" fill="#334155">必含 dsh.bundle.patch 且 YAML/包名可解析；</text>
  <text x="68" y="176" font-size="10" fill="#7f1d1d">缺失时 install_bundle 报 not-bundle 回滚，</text>
  <text x="68" y="194" font-size="10" fill="#7f1d1d">启动期损坏则整包跳过记入 skippedBundles</text>

  <rect x="370" y="116" width="312" height="108" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="386" y="138" font-size="11.5" font-weight="700" fill="#991b1b">② 版本兼容门禁（engines.dsh 优先）</text>
  <text x="386" y="158" font-size="10.5" fill="#334155">写了 engines.dsh 则只校验它（忽略 peer）；</text>
  <text x="386" y="176" font-size="10" fill="#7f1d1d">未写时才回退检查全部 @deepseek-ai/dsh* peer；</text>
  <text x="386" y="194" font-size="10" fill="#7f1d1d">残留 workspace:* 直接拒装，豁免仅限精确版本对</text>

  <rect x="700" y="116" width="288" height="108" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="716" y="138" font-size="11.5" font-weight="700" fill="#991b1b">③ 已声明 Config 的插件行校验</text>
  <text x="716" y="158" font-size="10.5" fill="#334155">插件导出 Config schema 时严检传入参数；</text>
  <text x="716" y="176" font-size="10" fill="#7f1d1d">不合法时必需行直接终止进程，可选行报错跳过；</text>
  <text x="716" y="194" font-size="10" fill="#7f1d1d">未声明 Config 则不拦截（但禁硬编码可调项）</text>

  <!-- Group 2: Amber - Installs clean, fails on load/use -->
  <rect x="32" y="256" width="976" height="164" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="52" y="282" font-size="13" font-weight="700" fill="#92400e">第二档 · 安装不拦，加载或运行期才报错（最易漏检的高危区）</text>

  <rect x="52" y="296" width="456" height="108" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text x="68" y="318" font-size="11.5" font-weight="700" fill="#92400e">④ ESM 导出契约与宿主单例共享</text>
  <text x="68" y="338" font-size="10.5" fill="#334155">· 入口只选具名 apply 或 default Service 其一，混用会丢掉 inject</text>
  <text x="68" y="358" font-size="10.5" fill="#334155">· @deepseek-ai/cordis 等共享包须写进 peerDependencies 防双实例</text>
  <text x="68" y="378" font-size="10" fill="#78350f">· 工具与事件注册必须挂 ctx.effect / ctx.on 返回 disposer</text>

  <rect x="528" y="296" width="460" height="108" rx="8" fill="#ffffff" stroke="#fde68a"/>
  <text x="544" y="318" font-size="11.5" font-weight="700" fill="#92400e">⑤ 打包产物自包含与 dsh.client 前端挂载</text>
  <text x="544" y="338" font-size="10.5" fill="#334155">· 全栈 ESM（type: "module"），files 须含 lib/、patch 与技能</text>
  <text x="544" y="358" font-size="10.5" fill="#334155">· 本地 link: 不过滤 files，漏写文件要发成 .tgz 后才会暴露报错</text>
  <text x="544" y="378" font-size="10" fill="#78350f">· 声明 dsh.client 的包须挂一条 Host 根插件行，否则前端不扫 ./client</text>

  <!-- Group 3: Green - Display fallback only -->
  <rect x="32" y="436" width="976" height="96" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="52" y="462" font-size="13" font-weight="700" fill="#166534">第三档 · 仅影响管理页展示降级（不阻断安装与运行）</text>

  <rect x="52" y="472" width="936" height="46" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="68" y="499" font-size="10.5" fill="#14532d">⑥ 展示元数据（./locale/*.json 的 meta.title / description 与 ≤ 256 KiB 的 ./icon）：不激活代码直接读取；缺失或超限时插件照常运行，仅回退显示包名并附诊断提示。</text>

  <!-- Bottom takeaway -->
  <rect x="32" y="546" width="976" height="38" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="520" y="570" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">发版前标准动作：跑 pnpm pack 打出真实 .tgz → 在干净临时 DSH_HOME 下安装 → 跑 --dump-config 与真实会话冒烟，一次排除全部三档隐患。</text>
</svg>
