<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="1060" height="620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>DSH 运行期数据的四大原生能力分组地图</title>
  <desc>按会话上下文、$DSH_HOME 宿主状态、工作区交付物与浏览器设备视图四个象限，汇总各原生接口的职责、作用域与禁用红线。</desc>
  <rect width="1060" height="620" rx="8" fill="#f8fafc"/>
  <text x="530" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">原生数据能力地图：四大归属域与各自的使用红线</text>
  <text x="530" y="56" text-anchor="middle" font-size="11.5" fill="#475569">告别手拼路径与裸调 node:fs——按“谁拥有生命周期、模型是否可见”直接选用对应的宿主服务</text>

  <!-- Quadrant 1: Session & Model Context -->
  <rect x="32" y="78" width="486" height="232" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="52" y="104" font-size="13.5" font-weight="700" fill="#92400e">① 会话与模型上下文域（Session &amp; Context）</text>

  <rect x="52" y="118" width="446" height="54" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="68" y="138" font-size="11" font-weight="700" fill="#92400e">工具返回 / agent.inject() + ctx.sessionProjections</text>
  <text x="68" y="158" font-size="10" fill="#334155">模型可见输入与同步纯函数折叠状态（禁私造新 SessionEventMap 事件）</text>

  <rect x="52" y="180" width="446" height="54" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="68" y="200" font-size="11" font-weight="700" fill="#92400e">ctx.attachments（二进制输入） · ctx.spillStore（超长输出）</text>
  <text x="68" y="220" font-size="10" fill="#334155">附件内容寻址先落盘再引用；spillStore 落 OS 临时目录、重启后清理</text>

  <rect x="52" y="242" width="446" height="52" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="68" y="262" font-size="11" font-weight="700" fill="#92400e">ctx.sessionQuery（跨会话只读浏览与全文检索）</text>
  <text x="68" y="280" font-size="10" fill="#334155">优先读内存活会话、回退磁盘索引；纯查询接口，勿当写入存储</text>

  <!-- Quadrant 2: $DSH_HOME Host State -->
  <rect x="542" y="78" width="486" height="232" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="562" y="104" font-size="13.5" font-weight="700" fill="#1e3a8a">② $DSH_HOME 托管宿主状态域（模型不可见）</text>

  <rect x="562" y="118" width="446" height="54" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="578" y="138" font-size="11" font-weight="700" fill="#1e3a8a">ctx.storageDomain（插件持久账本：JSON / SQLite）</text>
  <text x="578" y="158" font-size="10" fill="#334155">内存同步读 + 串行落盘写；JSON 键限 [a-zA-Z0-9_-]+，无自动版本迁移</text>

  <rect x="562" y="180" width="446" height="54" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="578" y="200" font-size="11" font-weight="700" fill="#991b1b">ctx.credentials（API Key / OAuth 令牌安全存取）</text>
  <text x="578" y="220" font-size="10" fill="#334155">配置只存 CredentialRef，每次外部调用动态 resolve()，禁明文落日志</text>

  <rect x="562" y="242" width="446" height="52" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="578" y="262" font-size="11" font-weight="700" fill="#1e3a8a">Config + .volatile()（单 Profile 开关） · dshCachePath（缓存）</text>
  <text x="578" y="280" font-size="10" fill="#334155">开关写回当前 Profile patch（勿存增长列表）；缓存须支持随时删空重建</text>

  <!-- Quadrant 3: Workspace & User Files -->
  <rect x="32" y="328" width="486" height="222" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="52" y="354" font-size="13.5" font-weight="700" fill="#166534">③ 工作区与用户交付物域（项目所有权）</text>

  <rect x="52" y="368" width="446" height="54" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="68" y="388" font-size="11" font-weight="700" fill="#166534">ctx.workingDirectory + ctx.fs（项目源码与文档读写）</text>
  <text x="68" y="408" font-size="10" fill="#334155">带乐观并发保护并遵守会话沙箱；严禁调 process.cwd() 或裸 node:fs</text>

  <rect x="52" y="430" width="446" height="52" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="68" y="450" font-size="11" font-weight="700" fill="#166534">present 工具（@deepseek-ai/dsh-tool-present）</text>
  <text x="68" y="468" font-size="10" fill="#334155">先写进工作区再登记交付卡片；仅记录文件路径引用，不复制字节入库</text>

  <rect x="52" y="490" width="446" height="46" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="68" y="510" font-size="11" font-weight="700" fill="#166534">ctx.workspaceRegistry（左侧栏工作区分组索引）</text>
  <text x="68" y="527" font-size="10" fill="#334155">UUID 主键登记簿；移除记录不删磁盘文件夹，也不删历史会话</text>

  <!-- Quadrant 4: Client UI & Lifecycle Boundary -->
  <rect x="542" y="328" width="486" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="562" y="354" font-size="13.5" font-weight="700" fill="#0f172a">④ 客户端视图边界与卸载留存契约</text>

  <rect x="562" y="368" width="446" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="578" y="388" font-size="11" font-weight="700" fill="#334155">浏览器 localStorage / Electron userData（纯视图偏好）</text>
  <text x="578" y="408" font-size="10" fill="#475569">分栏宽度、折叠状态等设备级 UI 状态；自己带包名前缀，禁存身份与真值</text>

  <rect x="562" y="430" width="446" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="578" y="450" font-size="11" font-weight="700" fill="#334155">单进程写假设（storageDomain 并发边界）</text>
  <text x="578" y="468" font-size="10" fill="#475569">无跨进程文件锁，切勿让多个活跃 Host 进程同时共享同一 DSH_HOME 写表</text>

  <rect x="562" y="490" width="446" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="578" y="510" font-size="11" font-weight="700" fill="#334155">卸载插件默认保留数据</text>
  <text x="578" y="527" font-size="10" fill="#475569">卸载仅移除依赖与配置行；storages/、附件与工作区文件留存须写入 README</text>

  <!-- Footer -->
  <rect x="32" y="564" width="996" height="38" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="530" y="588" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">干净环境验收法：指定 DSH_HOME=/tmp/test-home（必要时配 DSH_AGENTS_HOME），即可将全部宿主状态与个人日常环境 100% 物理隔离。</text>
</svg>
