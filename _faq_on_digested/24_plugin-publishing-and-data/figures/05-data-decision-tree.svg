<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" width="1020" height="760" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>运行期数据落点决策树</title>
  <desc>从用户与模型视角出发，沿七步判断将任意插件数据精确映射到工作区 ctx.fs、会话日志与投影、浏览器存储、内存/临时溢出、ctx.credentials、Config.volatile() 或 ctx.storageDomain。</desc>
  <defs>
    <marker id="arr24e" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1020" height="760" rx="8" fill="#f8fafc"/>
  <text x="510" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">运行期数据落点决策树：顺着七个问题找到唯一标准接口</text>
  <text x="510" y="56" text-anchor="middle" font-size="11.5" fill="#475569">沿左侧主干按“否”向下排除，命中“是”立即落入右侧原生能力（一切运行数据均不进插件包目录）</text>

  <!-- Step 1 -->
  <rect x="44" y="82" width="460" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="106" font-size="12" font-weight="700" fill="#0f172a">1. 是用户要直接打开、编辑、提交 Git 或带走的项目文件吗？</text>
  <text x="64" y="128" font-size="10.5" fill="#64748b">例如生成的源码、文档、补丁、报表或项目内配置</text>
  <line x1="504" y1="113" x2="586" y2="113" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="545" y="105" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">是</text>
  <rect x="594" y="82" width="382" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="614" y="106" font-size="12" font-weight="700" fill="#166534">工作区文件：ctx.workingDirectory + ctx.fs</text>
  <text x="614" y="128" font-size="10.5" fill="#15803d">向聊天卡片交付配 present 工具（只记路径，不复制字节）</text>

  <line x1="274" y1="144" x2="274" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="290" y="160" font-size="10" fill="#475569">否</text>

  <!-- Step 2 -->
  <rect x="44" y="174" width="460" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="198" font-size="12" font-weight="700" fill="#0f172a">2. 这份信息需要进入模型上下文，或随单条会话回放吗？</text>
  <text x="64" y="220" font-size="10.5" fill="#64748b">铁律：凡进入模型请求的内容必须可从会话日志完整重建</text>
  <line x1="504" y1="205" x2="586" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="545" y="197" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">是</text>
  <rect x="594" y="174" width="382" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="614" y="198" font-size="12" font-weight="700" fill="#92400e">会话日志：工具结果 / agent.inject() + 投影</text>
  <text x="614" y="220" font-size="10.5" fill="#78350f">投影用 ctx.sessionProjections；大二进制走 ctx.attachments</text>

  <line x1="274" y1="236" x2="274" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="290" y="252" font-size="10" fill="#475569">否</text>

  <!-- Step 3 -->
  <rect x="44" y="266" width="460" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="290" font-size="12" font-weight="700" fill="#0f172a">3. 只是当前浏览器窗口的纯 UI 视图偏好吗？</text>
  <text x="64" y="312" font-size="10.5" fill="#64748b">例如侧栏宽度、面板折叠态、本地筛选器（Host 无需感知）</text>
  <line x1="504" y1="297" x2="586" y2="297" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="545" y="289" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">是</text>
  <rect x="594" y="266" width="382" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="614" y="290" font-size="12" font-weight="700" fill="#0f172a">浏览器 localStorage（带包名前缀与版本号）</text>
  <text x="614" y="312" font-size="10.5" fill="#475569">按访问 Origin 隔离，换端口即重置，严禁存业务真值</text>

  <line x1="274" y1="328" x2="274" y2="352" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="290" y="344" font-size="10" fill="#475569">否</text>

  <!-- Step 4 -->
  <rect x="44" y="358" width="460" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="382" font-size="12" font-weight="700" fill="#0f172a">4. 只是无需跨重启保留的运行态，或可随时重算的缓存吗？</text>
  <text x="64" y="404" font-size="10.5" fill="#64748b">例如超长工具抓包临时输出、远端元数据本地缓存、派生索引</text>
  <line x1="504" y1="389" x2="586" y2="389" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="545" y="381" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">是</text>
  <rect x="594" y="358" width="382" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="614" y="382" font-size="12" font-weight="700" fill="#0f172a">超长输出用 ctx.spillStore · 缓存用 dshCachePath</text>
  <text x="614" y="404" font-size="10.5" fill="#475569">代码必须容忍目录被清空并在缺失时自动重建</text>

  <line x1="274" y1="420" x2="274" y2="444" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="290" y="436" font-size="10" fill="#475569">否（需跨重启持久保留）</text>

  <!-- Step 5 -->
  <rect x="44" y="450" width="460" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="474" font-size="12" font-weight="700" fill="#0f172a">5. 是 API Key、OAuth 令牌或 Webhook 签名密钥吗？</text>
  <text x="64" y="496" font-size="10.5" fill="#64748b">任何敏感凭据都不得明文写进 patch、日志或普通存储表</text>
  <line x1="504" y1="481" x2="586" y2="481" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="545" y="473" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">是</text>
  <rect x="594" y="450" width="382" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="614" y="474" font-size="12" font-weight="700" fill="#991b1b">凭据服务：ctx.credentials（.credentials.yaml）</text>
  <text x="614" y="496" font-size="10.5" fill="#7f1d1d">配置只存引用，每次发起请求动态调 resolve() 防缓存在途失效</text>

  <line x1="274" y1="512" x2="274" y2="536" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="290" y="528" font-size="10" fill="#475569">否</text>

  <!-- Step 6 -->
  <rect x="44" y="542" width="460" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="566" font-size="12" font-weight="700" fill="#0f172a">6. 是用户在设置面板手动调节的开关、阈值或默认项吗？</text>
  <text x="64" y="588" font-size="10.5" fill="#64748b">低频人工修改的参数，而非插件后台持续写入的数据行</text>
  <line x1="504" y1="573" x2="586" y2="573" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="545" y="565" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">是</text>
  <rect x="594" y="542" width="382" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="614" y="566" font-size="12" font-weight="700" fill="#1e3a8a">插件配置：Config Schema + .volatile()</text>
  <text x="614" y="588" font-size="10.5" fill="#1e40af">单 Profile 作用域，自动映射设置页并写回当前 Profile patch</text>

  <line x1="274" y1="604" x2="274" y2="628" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <text x="290" y="620" font-size="10" fill="#475569">否（插件自有持久状态）</text>

  <!-- Step 7 -->
  <rect x="44" y="634" width="460" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="64" y="658" font-size="12" font-weight="700" fill="#1e3a8a">7. 跨会话保留的插件内部账本、同步游标或历史统计</text>
  <text x="64" y="680" font-size="10.5" fill="#1e40af">模型不可见、用户不直接编辑的结构化状态</text>
  <line x1="504" y1="665" x2="586" y2="665" stroke="#475569" stroke-width="1.5" marker-end="url(#arr24e)"/>
  <rect x="594" y="634" width="382" height="62" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="614" y="658" font-size="12" font-weight="700" fill="#1e3a8a">托管存储域：ctx.storageDomain（JSON / SQLite）</text>
  <text x="614" y="680" font-size="10.5" fill="#1e40af">路径键先做 SHA-256 摘要（限 [a-zA-Z0-9_-]+）；版本变更显式迁移</text>

  <!-- Footer -->
  <rect x="44" y="710" width="932" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="510" y="732" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">三条不变量：包目录永远只读 · 模型可见信息必落会话日志 · 全局路径一律走 resolveDshHome() 而非硬编码 ~/.dsh。</text>
</svg>
