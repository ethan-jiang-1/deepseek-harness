<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>Creator 模式：让 Agent 改造 DSH 自身的四步闭环</title>
  <desc>Creator 模式的四步自举循环：一、通过 cordis_inspect_list 与 cordis_inspect_query 只读探查宿主运行时服务、事件与配置树；二、按需加载四个内置创作技能编写插件或预设补丁；三、在具备 profileContext 的宿主中通过 plugin_manager（配合审批门）装入当前 profile；四、变更跨会话持久生效，新插件或新模式投入使用。</desc>
  <defs>
    <marker id="arrowGreen2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Creator 模式：让 Agent 扩展 DSH 自身的四步闭环</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#64748b">前三个模式的 Agent 只改你的项目文件；Creator 在完整保留 Standard 工具的同时，把 DSH 宿主自身也纳入工作对象。</text>

  <!-- ① 检查 -->
  <rect x="40" y="96" width="255" height="200" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="66" cy="122" r="12" fill="#16a34a"/>
  <text x="66" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  <text x="172" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">探查宿主（只读）</text>
  <text x="58" y="154" font-size="12" fill="#334155">cordis_inspect_list：列出可查数据源</text>
  <text x="58" y="174" font-size="12" fill="#334155">cordis_inspect_query：查接口与配置树</text>
  <text x="58" y="200" font-size="11" fill="#64748b">Host 侧可查服务/事件签名与活 Loader</text>
  <text x="58" y="216" font-size="11" fill="#64748b">树（条目 ID、配置状态、包目录）；</text>
  <text x="58" y="232" font-size="11" fill="#64748b">Client 侧可查当前连接页面的前端插槽</text>
  <text x="58" y="260" font-size="11" fill="#b91c1c">默认模式刻意不开放：查询支持执行</text>
  <text x="58" y="276" font-size="11" fill="#b91c1c">模型编写的 JS，无常规沙箱包裹</text>

  <line x1="295" y1="192" x2="340" y2="192" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen2)"/>

  <!-- ② 编写 -->
  <rect x="345" y="96" width="275" height="200" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="371" cy="122" r="12" fill="#16a34a"/>
  <text x="371" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <text x="488" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">按需读四个创作技能编写</text>
  <text x="363" y="154" font-size="11.5" fill="#334155">① cordis-plugin-development</text>
  <text x="363" y="170" font-size="10.5" fill="#64748b">　开发、安装与调试持久插件及 MCP 流程</text>
  <text x="363" y="190" font-size="11.5" fill="#334155">② editing-cordis-compositions</text>
  <text x="363" y="206" font-size="10.5" fill="#64748b">　预设声明与覆盖补丁写法（无原地修改）</text>
  <text x="363" y="226" font-size="11.5" fill="#334155">③ cordis-composition-reference</text>
  <text x="363" y="242" font-size="10.5" fill="#64748b">　insert / override / isolate 语法与包目录</text>
  <text x="363" y="262" font-size="11.5" fill="#334155">④ agent-experience</text>
  <text x="363" y="278" font-size="10.5" fill="#64748b">　面向模型的工具定义、描述与渐进加载规范</text>

  <line x1="620" y1="192" x2="665" y2="192" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen2)"/>

  <!-- ③ 安装 -->
  <rect x="670" y="96" width="255" height="200" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="696" cy="122" r="12" fill="#16a34a"/>
  <text x="696" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
  <text x="802" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">审批安装进 Profile</text>
  <text x="688" y="154" font-size="12" fill="#334155">plugin_manager（install_bundle 等）</text>
  <text x="688" y="174" font-size="11.5" fill="#475569">+ 可选只读市场查询 plugin_market</text>
  <text x="688" y="200" font-size="11" fill="#64748b">条件开关：!ctx.get('profileContext')</text>
  <text x="688" y="216" font-size="11" fill="#64748b">无 profile 上下文的宿主自动禁用该行，</text>
  <text x="688" y="232" font-size="11" fill="#64748b">不会导致预设挂载报错</text>
  <rect x="688" y="250" width="220" height="26" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="798" y="267" text-anchor="middle" font-size="10.5" fill="#991b1b">强制审批：宿主代码跑在工作区沙箱外</text>

  <line x1="925" y1="192" x2="965" y2="192" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen2)"/>

  <!-- ④ 生效 -->
  <rect x="970" y="96" width="190" height="200" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="996" cy="122" r="12" fill="#16a34a"/>
  <text x="996" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
  <text x="1070" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">持久生效与验证</text>
  <text x="986" y="154" font-size="12" fill="#334155">写入当前 profile 补丁，</text>
  <text x="986" y="174" font-size="12" fill="#334155">跨会话、跨重启保留</text>
  <text x="986" y="200" font-size="11" fill="#64748b">支持热加载的插件即时生效，</text>
  <text x="986" y="216" font-size="11" fill="#64748b">触及宿主底层的提示需重启；</text>
  <text x="986" y="232" font-size="11" fill="#64748b">新预设在下次新建任务时可选</text>
  <text x="986" y="260" font-size="11" fill="#166534">官方建议：让 Agent 装好并</text>
  <text x="986" y="276" font-size="11" fill="#166534">实测验证，别只生成源码</text>

  <!-- 回路 -->
  <path d="M 1065 296 C 1065 334, 190 334, 170 298" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen2)"/>
  <text x="615" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">新能力就位 → 回到第 ① 步继续探查验证（一切皆插件的自举闭环）</text>

  <!-- 下半：机制注解 -->
  <rect x="40" y="372" width="550" height="150" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="315" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">创作技能为什么不直接塞进系统提示词？</text>
  <text x="315" y="426" text-anchor="middle" font-size="12" fill="#713f12">· customSkillDirs 是“追加”而非“替换”：用户和项目原有的技能照常可用</text>
  <text x="315" y="448" text-anchor="middle" font-size="12" fill="#713f12">· 渐进披露控成本：常驻上下文只有简短目录，触发时首载约 3.9KB 主干流程，</text>
  <text x="315" y="468" text-anchor="middle" font-size="12" fill="#713f12">　详细示例与模板拆在 references/ 与 templates/，压在 8192 字符裁剪线内</text>
  <text x="315" y="492" text-anchor="middle" font-size="12" fill="#713f12">· 查阅优先级：先跑 cordis_inspect_query → 再读包 README → 最后看源码</text>

  <rect x="610" y="372" width="550" height="150" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="885" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">改模式没有任何隐藏特权，全走标准声明式补丁</text>
  <text x="885" y="426" text-anchor="middle" font-size="12" fill="#5b21b6">· 新插件是标准包，新模式只是一行 @deepseek-ai/dsh-agent-preset 插件声明</text>
  <text x="885" y="448" text-anchor="middle" font-size="12" fill="#5b21b6">· 注册表不扫神秘文件夹：一切增改都是往当前 profile 叠装一份 bundle patch</text>
  <text x="885" y="468" text-anchor="middle" font-size="12" fill="#5b21b6">· Web 设置里的预设编辑器与“让 Agent 帮我创建预设模式”走完全相同的落盘通道，</text>
  <text x="885" y="488" text-anchor="middle" font-size="12" fill="#5b21b6">　自带 revision 校验与 profile 文件锁防止并发写坏配置</text>

  <!-- 底部 -->
  <rect x="40" y="544" width="1120" height="84" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="572" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">安全边界：Preset 只管组装能力，不管权限隔离；真正的闸门在 danger-full-access 审批</text>
  <text x="600" y="596" text-anchor="middle" font-size="12" fill="#475569">只要会话没开最高权限，plugin_manager 每一次启用、禁用、安装或卸载插件都会弹出明确警告，批准也只对当次调用生效，不会暗中放宽整个会话的权限。</text>
</svg>
