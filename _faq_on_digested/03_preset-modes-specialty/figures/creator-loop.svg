<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>Creator 模式：让 Agent 探查、编写、审批安装并验证 DSH 扩展的四步闭环</title>
  <desc>Creator 模式（预设 id: cordis）在保留 Standard 全部 31 个工具的基础上，串联四步自扩展闭环：一、cordis_inspect_* 只读探查宿主；二、按需读取四个内置创作技能编写扩展；三、有 profileContext 时经 danger-full-access 审批调 plugin_manager 安装进当前 profile；四、跨会话持久生效并回到第一步实测验证。</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1240" height="640" rx="8" fill="#f8fafc"/>
  <text x="620" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Creator 模式（id: cordis）：让 Agent 扩展 DSH 自身的四步闭环</text>
  <text x="620" y="56" text-anchor="middle" font-size="12.5" fill="#475569">在完整保留 Standard 31 个常规工具的基础上，新增只读探查、条件插件管理与四个创作技能，把 DSH 宿主自身纳入工作对象。</text>

  <!-- ① 探查宿主 -->
  <rect x="36" y="88" width="272" height="206" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="62" cy="116" r="12" fill="#16a34a"/>
  <text x="62" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="180" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">只读探查活体宿主</text>
  <text x="56" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#14532d">cordis_inspect_list / query</text>
  <text x="56" y="176" font-size="11.5" fill="#334155">· Host：查服务/事件签名与活 Loader</text>
  <text x="56" y="196" font-size="11.5" fill="#334155">　树（插件行 ID、启停状态、packageDir）</text>
  <text x="56" y="218" font-size="11.5" fill="#334155">· Client：查已连接浏览器页插槽与状态</text>
  <text x="56" y="250" font-size="11" fill="#991b1b">因允许执行模型编写的 JS 过滤代码，</text>
  <text x="56" y="268" font-size="11" fill="#991b1b">Standard 默认关闭，仅在 Creator 开放</text>

  <line x1="308" y1="191" x2="332" y2="191" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- ② 读技能编写 -->
  <rect x="336" y="88" width="280" height="206" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="362" cy="116" r="12" fill="#16a34a"/>
  <text x="362" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="484" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">按需读四个创作技能编写</text>
  <text x="356" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#14532d">① cordis-plugin-development</text>
  <text x="356" y="168" font-size="11" fill="#475569">　持久插件与 MCP 接入开发调试全流程</text>
  <text x="356" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#14532d">② editing-cordis-compositions</text>
  <text x="356" y="208" font-size="11" fill="#475569">　以 minimal 为模板新增或覆盖预设补丁</text>
  <text x="356" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#14532d">③ cordis-composition-reference</text>
  <text x="356" y="248" font-size="11" fill="#475569">　insert / isolate / !!js 语法与官方包表</text>
  <text x="356" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#14532d">④ agent-experience（工具体验规范）</text>

  <line x1="616" y1="191" x2="640" y2="191" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- ③ 审批安装 -->
  <rect x="644" y="88" width="280" height="206" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="670" cy="116" r="12" fill="#16a34a"/>
  <text x="670" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="792" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">条件启用与审批装入</text>
  <text x="664" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#14532d">plugin_manager · plugin_market</text>
  <text x="664" y="174" font-size="11.5" fill="#334155">· 条件开关：!ctx.get('profileContext')</text>
  <text x="664" y="194" font-size="11.5" fill="#475569">　正式 profile 下自动启用；无 profile</text>
  <text x="664" y="214" font-size="11.5" fill="#475569">　环境自动禁用，绝不拖垮预设挂载</text>
  <rect x="662" y="236" width="244" height="42" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="784" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">每次调用强制走 danger-full-access</text>
  <text x="784" y="270" text-anchor="middle" font-size="10.5" fill="#7f1d1d">单次审批放行，不暗改会话权限档位</text>

  <line x1="924" y1="191" x2="948" y2="191" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- ④ 持久生效与验证 -->
  <rect x="952" y="88" width="252" height="206" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="978" cy="116" r="12" fill="#16a34a"/>
  <text x="978" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="1086" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">持久落盘与闭环实测</text>
  <text x="972" y="150" font-weight="700" fill="#14532d">写入当前 profile 用户补丁层</text>
  <text x="972" y="174" font-size="11.5" fill="#334155">· 支持热重载的插件即时生效；触及</text>
  <text x="972" y="194" font-size="11.5" fill="#334155">　宿主已载模块时 nextStep 提示重启</text>
  <text x="972" y="216" font-size="11.5" fill="#334155">· 新预设在下次新建任务时立即可选</text>
  <text x="972" y="250" font-size="11.5" font-weight="700" fill="#166534">官方建议：直接要求 Agent 完成</text>
  <text x="972" y="268" font-size="11.5" font-weight="700" fill="#166534">安装并实测验证，别只生成源码</text>

  <!-- 底部自举回路箭头 -->
  <path d="M 1078 294 C 1078 330, 172 330, 172 298" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="620" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">新扩展或新模式就位 → 回到第 ① 步再次探查核验（一切皆插件的自举闭环）</text>

  <!-- 下半两栏机制说明 -->
  <rect x="36" y="366" width="572" height="148" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="322" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#854d0e">为什么把开发规范做成 4 个技能，而不是塞进系统提示词？</text>
  <text x="58" y="422" fill="#713f12">· customSkillDirs 走“追加”而非覆盖：项目与个人目录下的日常技能照常可用</text>
  <text x="58" y="446" fill="#713f12">· 渐进披露省窗口：常驻提示仅挂简短目录；首载 SKILL.md 压在约 3.9KB（远低于</text>
  <text x="58" y="466" fill="#713f12">　8,192 字符裁剪线），详细示例与脚手架拆在 references/ 与 templates/</text>
  <text x="58" y="490" font-size="11.5" fill="#a16207">· 查接口顺序：先跑 cordis_inspect_query → 再读包 README → 最后看类型或源码</text>

  <rect x="632" y="366" width="572" height="148" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="918" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">无隐藏后门：Agent 与 Web 预设编辑器走同一条落盘通道</text>
  <text x="654" y="422" fill="#5b21b6">· 没有任何原地改模式的特权 API：新增或覆盖预设就是往当前 profile 装一份补丁</text>
  <text x="654" y="446" fill="#5b21b6">· 设置页「让 Agent 帮我创建预设模式」与图形化预设编辑器写同一份用户补丁层</text>
  <text x="654" y="470" fill="#5b21b6">· 落盘自带 revision 乐观锁校验与 profile 文件锁，防止多端并发写坏配置文件</text>
  <text x="654" y="492" font-size="11.5" fill="#6d28d9">· 安装进 profile 的宿主代码运行在工作区文件沙箱之外，因此每次修改都须人工确认</text>

  <!-- 底部收束 -->
  <rect x="36" y="532" width="1168" height="84" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="620" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">安全铁律：Preset 负责组装能力，danger-full-access 审批门负责守住宿主进程边界</text>
  <text x="620" y="584" text-anchor="middle" font-size="12" fill="#475569">只要会话未切到最高权限档位，plugin_manager 每一次启停、安装或移除插件都会明确提示“改动跨会话持久生效且宿主代码跑在工作区沙箱外”，</text>
  <text x="620" y="603" text-anchor="middle" font-size="11.5" fill="#64748b">用户点同意仅放行当次调用，绝不会在后台静默升级整个会话的权限模式。</text>
</svg>
