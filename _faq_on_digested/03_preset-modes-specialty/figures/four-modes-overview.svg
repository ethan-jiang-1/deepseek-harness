<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>四个内置模式总览：共享同一套宿主底座，四份声明式补丁拼出四种性格</title>
  <desc>顶部是共享宿主底座（Agent loop、ToolRuntime 执行管道、权限审批与沙箱、会话日志）；下方四张卡片依次对比 Standard（31 工具常规基准）、PTC（折叠为唯一 run_code）、Minimal（一句提示词 + 持久终端对照基线）与 Creator（开放只读宿主探查、条件插件管理与四个创作技能）。</desc>
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1260" height="640" rx="8" fill="#f8fafc"/>
  <text x="630" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">四个内置模式：共享同一套 Agent 底座，四份 YAML 拼出四种性格</text>
  <text x="630" y="56" text-anchor="middle" font-size="12.5" fill="#475569">四份预设补丁（packages/bundle/web-app/presets/*.patch.yml）不改一行主循环代码，只按会话 scope 重新组装工具与提示词。</text>

  <!-- 共享宿主底座 -->
  <rect x="36" y="76" width="1188" height="62" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="630" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">共享宿主底座（四个模式完全一致）</text>
  <text x="630" y="123" text-anchor="middle" font-size="12" fill="#475569">Agent loop · ToolRuntime 管道（pre-execute → ctx.tools.guard → execute → post-execute → result）· 沙箱与审批 · 会话日志</text>

  <line x1="176" y1="138" x2="176" y2="170" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <line x1="478" y1="138" x2="478" y2="170" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <line x1="782" y1="138" x2="782" y2="170" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <line x1="1084" y1="138" x2="1084" y2="170" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowGray)"/>

  <!-- 1. Standard -->
  <rect x="36" y="176" width="280" height="384" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="36" y="176" width="280" height="52" rx="12" fill="#475569"/>
  <text x="176" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Standard（标准模式）</text>
  <text x="176" y="219" text-anchor="middle" font-size="11" fill="#e2e8f0">id: standard · order 1 · 新任务默认</text>

  <text x="56" y="258" font-weight="700" fill="#0f172a">· 工具：31 个常规原生 Schema</text>
  <text x="56" y="282" fill="#475569">　文件读写/搜索 · 后台作业 · 定时调度</text>
  <text x="56" y="308" font-weight="700" fill="#0f172a">· 提示词：{{model}} 身份 + AGENTS.md</text>
  <text x="56" y="332" fill="#475569">　（≤64KB）+ 时间与动态环境快照</text>
  <text x="56" y="358" font-weight="700" fill="#0f172a">· 终端与编排：单次 bash/pwsh</text>
  <text x="56" y="382" fill="#475569">　subagent×2 + workflow + 目标/计划/待办</text>
  <text x="56" y="408" font-weight="700" fill="#991b1b">· 收口：禁 cordis_* / mcp_* / ralph</text>
  <text x="56" y="432" fill="#475569">　plugin_manager 等同样显式禁用</text>

  <rect x="54" y="492" width="244" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="176" y="514" text-anchor="middle" font-weight="700" fill="#0f172a">90% 日常任务起点</text>
  <text x="176" y="532" text-anchor="middle" font-size="11" fill="#475569">改代码、查问题、写脚本批处理均适用</text>

  <!-- 2. PTC -->
  <rect x="338" y="176" width="280" height="384" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  <rect x="338" y="176" width="280" height="52" rx="12" fill="#7c3aed"/>
  <text x="478" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">PTC（程序化工具调用）</text>
  <text x="478" y="219" text-anchor="middle" font-size="11" fill="#ede9fe">id: ptc · order 2 · 折叠调用呈现</text>

  <text x="358" y="258" font-weight="700" fill="#5b21b6">· 工具：仅暴露 1 个 run_code</text>
  <text x="358" y="282" fill="#475569">　其余常规工具转为提示词内 .d.ts SDK</text>
  <text x="358" y="308" font-weight="700" fill="#5b21b6">· 核心配置：tool-presentation</text>
  <text x="358" y="332" fill="#475569">　会话级 mode: ptc，同进程多模式不串表</text>
  <text x="358" y="358" font-weight="700" fill="#0f172a">· 安全管道：子调用逐次过审批与日志</text>
  <text x="358" y="382" fill="#475569">　中间脏数据留内存，仅回传 print / return</text>
  <text x="358" y="408" font-weight="700" fill="#991b1b">· 差异：显式禁用 workflow（防入口重叠）</text>

  <rect x="356" y="492" width="244" height="50" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="478" y="514" text-anchor="middle" font-weight="700" fill="#5b21b6">大批文件/日志聚合利器</text>
  <text x="478" y="532" text-anchor="middle" font-size="11" fill="#6d28d9">筛选、去重、统计对账，省往返与上下文</text>

  <!-- 3. Minimal -->
  <rect x="642" y="176" width="280" height="384" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="642" y="176" width="280" height="52" rx="12" fill="#ea580c"/>
  <text x="782" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Minimal（极简模式）</text>
  <text x="782" y="219" text-anchor="middle" font-size="11" fill="#ffedd5">id: minimal · order 3 · 剥离外围辅助</text>

  <text x="662" y="258" font-weight="700" fill="#9a3412">· 工具：仅 3 个基础入口</text>
  <text x="662" y="282" fill="#475569">　持久 bash/pwsh · read_image · 工作目录</text>
  <text x="662" y="308" font-weight="700" fill="#9a3412">· 提示词：complete: true 独占一句</text>
  <text x="662" y="332" fill="#475569">　不读 AGENTS.md，屏蔽可选动态环境快照</text>
  <text x="662" y="358" font-weight="700" fill="#0f172a">· 状态：isolate: terminals 持久 PTY</text>
  <text x="662" y="382" fill="#475569">　跨步保持目录与变量；保留基础 /compact</text>
  <text x="662" y="408" font-weight="700" fill="#991b1b">· 砍掉：技能 · 目标/计划/待办 · 子智能体</text>

  <rect x="660" y="492" width="244" height="50" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="782" y="514" text-anchor="middle" font-weight="700" fill="#9a3412">A/B 对照实验基线</text>
  <text x="782" y="532" text-anchor="middle" font-size="11" fill="#c2410c">测“纯模型 + 终端”与完整 Harness 差距</text>

  <!-- 4. Creator -->
  <rect x="944" y="176" width="280" height="384" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="944" y="176" width="280" height="52" rx="12" fill="#16a34a"/>
  <text x="1084" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Creator（创造模式）</text>
  <text x="1084" y="219" text-anchor="middle" font-size="11" fill="#dcfce7">id: cordis · order 4 · 宿主自扩展</text>

  <text x="964" y="258" font-weight="700" fill="#166534">· 工具：Standard 31 项 + 宿主探查</text>
  <text x="964" y="282" fill="#475569">　新增只读 cordis_inspect_list / query</text>
  <text x="964" y="308" font-weight="700" fill="#166534">· 条件工具：有 profileContext 时启用</text>
  <text x="964" y="332" fill="#475569">　plugin_manager 与可选 plugin_market</text>
  <text x="964" y="358" font-weight="700" fill="#0f172a">· 技能：追加 4 个内置插件/预设创作技能</text>
  <text x="964" y="382" fill="#475569">　写入当前 profile 用户补丁，跨会话生效</text>
  <text x="964" y="408" font-weight="700" fill="#991b1b">· 闸门：装改插件强制走 danger 单次审批</text>

  <rect x="962" y="492" width="244" height="50" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="1084" y="514" text-anchor="middle" font-weight="700" fill="#166534">DSH 自举改造工坊</text>
  <text x="1084" y="532" text-anchor="middle" font-size="11" fill="#15803d">通过对话写插件、加界面或拼第 5 种模式</text>

  <!-- 底部硬边界 -->
  <rect x="36" y="578" width="1188" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="630" y="605" text-anchor="middle" font-size="12.5" fill="#1e40af">两条硬边界：① Preset 只管组装，不是安全沙箱（权限永远由 sandboxPolicy + approval 把守）；② 首条消息发出后模式锁定不可中途切换。</text>
</svg>
