<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>PTC 模式：一次 run_code 的完整往返解剖</title>
  <desc>左侧是模型上下文，工具列表只含 run_code，系统提示词内含生成的 .d.ts 工具 SDK。模型提交 TS 代码后，在受会话文件沙箱约束的全新 Node 进程中运行，通过 await tools.xxx() 发起子调用；每次子调用仍经过完整权限审批与审计管道，写一对不进模型历史的 tool/ptc-dispatch 日志供前端展示，最终只有 print 或 return 的汇总回到模型上下文。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="740" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PTC 模式：一次 run_code 调用的完整往返</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#64748b">发给模型的工具只剩 run_code；底层工具实现、沙箱、审批、日志一条没少——变的是中间数据不再逐条塞爆上下文。</text>

  <!-- 模型上下文 -->
  <rect x="40" y="100" width="250" height="240" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="165" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">模型看到的输入</text>
  <rect x="60" y="142" width="210" height="52" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="165" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">唯一工具：run_code</text>
  <text x="165" y="180" text-anchor="middle" font-size="11" fill="#6d28d9">必填参数：{ code, description }</text>
  <rect x="60" y="204" width="210" height="52" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="165" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">生成的工具 SDK（.d.ts）</text>
  <text x="165" y="242" text-anchor="middle" font-size="11" fill="#6d28d9">tools.name(args) 字典序排列保缓存</text>
  <text x="165" y="276" text-anchor="middle" font-size="11" fill="#64748b">调用约定：只读可 Promise.all 并发；</text>
  <text x="165" y="292" text-anchor="middle" font-size="11" fill="#64748b">写/互斥操作按提交顺序串行；有依赖就 await</text>
  <text x="165" y="316" text-anchor="middle" font-size="11" fill="#64748b">30 个常规工具不再逐个暴露原生 JSON Schema</text>

  <!-- run_code 调用 -->
  <line x1="290" y1="180" x2="380" y2="180" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="335" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">提交 TS 脚本</text>

  <!-- PTC 进程 -->
  <rect x="385" y="100" width="330" height="240" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="550" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">受沙箱约束的全新 Node 进程</text>
  <rect x="405" y="142" width="290" height="64" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="550" y="164" text-anchor="middle" font-size="12" fill="#1e3a8a">async 函数体：支持顶层 await / return</text>
  <text x="550" y="184" text-anchor="middle" font-size="11" fill="#64748b">自由写 for 循环、正则过滤、try-catch、聚合统计</text>
  <rect x="405" y="218" width="290" height="50" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="550" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">桥接通道：await tools.read(args) …</text>
  <text x="550" y="256" text-anchor="middle" font-size="11" fill="#64748b">走独立控制通道，与脚本 stdout/stderr 隔离</text>
  <text x="550" y="290" text-anchor="middle" font-size="11" fill="#475569">遵守当前会话的文件沙箱策略，环境变量清空</text>
  <text x="550" y="308" text-anchor="middle" font-size="11" fill="#475569">只读子调用并发上限 maxParallelSubCalls = 10</text>
  <text x="550" y="326" text-anchor="middle" font-size="11" fill="#475569">脚本抛错作为工具结果返回，不崩宿主进程</text>

  <!-- 子调用管道 -->
  <line x1="550" y1="340" x2="550" y2="372" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="628" y="362" font-size="11" font-weight="700" fill="#1e40af">每次子调用单独走完整安全管道</text>
  <rect x="180" y="376" width="740" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="550" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">tools/pre-execute → 单调拦截 guards → tools/execute → tools/post-execute → finalizeContent → tools/result</text>
  <text x="550" y="424" text-anchor="middle" font-size="11" fill="#64748b">权限插件既可在运行前审脚本源码，也会逐个拦截子调用；子调用 ID 形如 &lt;parent&gt;:ptc:&lt;n&gt;</text>

  <!-- 工具 -->
  <line x1="550" y1="450" x2="550" y2="478" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="180" y="482" width="740" height="60" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="506" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">会话内的真实工具照常工作：read / edit / write / glob / grep / bash / subagent / web_search / todo_write …</text>
  <text x="550" y="528" text-anchor="middle" font-size="11" fill="#64748b">（唯独 workflow-ptc 与 tool-workflow 在 PTC 预设中设为 disabled: true）</text>

  <!-- 会话日志 -->
  <rect x="25" y="376" width="148" height="166" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="99" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">会话审计日志</text>
  <text x="99" y="424" text-anchor="middle" font-size="10" fill="#713f12">每次子调用成对写入</text>
  <text x="99" y="440" text-anchor="middle" font-size="10" fill="#713f12">tool/ptc-dispatch-</text>
  <text x="99" y="456" text-anchor="middle" font-size="10" fill="#713f12">start 与 ptc-dispatch</text>
  <text x="99" y="472" text-anchor="middle" font-size="10" fill="#713f12">事件，保留完整输出；</text>
  <text x="99" y="488" text-anchor="middle" font-size="10" fill="#713f12">落盘留痕但不塞进模型</text>
  <text x="99" y="504" text-anchor="middle" font-size="10" fill="#713f12">历史，供 Web 界面渲染</text>
  <text x="99" y="520" text-anchor="middle" font-size="10" fill="#713f12">可展开的嵌套子调用行</text>

  <!-- 回程 -->
  <path d="M 385 220 C 300 220, 260 260, 290 300" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="292" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">仅 print / return 回模型上下文</text>
  <text x="292" y="368" text-anchor="middle" font-size="11" fill="#64748b">几十次中间读取结果留在脚本内存里消化</text>

  <!-- 图像 defer -->
  <rect x="40" y="562" width="560" height="70" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="320" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">图片结果特殊处理：不塞进脚本字符串返回值</text>
  <text x="320" y="608" text-anchor="middle" font-size="10.5" fill="#9a3412">子调用若产出图片块，在 run_code 结束后自动延后为一条独立 user message 附带给模型</text>

  <!-- 升级路径 -->
  <rect x="620" y="562" width="540" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="890" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">沙箱提权同样走正式审批（e2e 测试锁死）</text>
  <text x="890" y="606" text-anchor="middle" font-size="10.5" fill="#7f1d1d">只读沙箱下写文件直接报 EPERM/EROFS → 必须显式传 sandbox_permissions:</text>
  <text x="890" y="622" text-anchor="middle" font-size="10.5" fill="#7f1d1d">"workspace-write" 与理由触发审批 → 用户批准前绝不落盘</text>

  <!-- 底部 -->
  <rect x="40" y="652" width="1120" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="678" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">核心收益：既省模型往返轮数（循环/分支在一次脚本里跑完），又省上下文窗口（只回传精炼汇总）</text>
  <text x="600" y="700" text-anchor="middle" font-size="12" fill="#475569">权衡代价：系统提示词需常驻一份 .d.ts SDK 声明；脚本内等待人工审批或慢工具时会计入脚本执行总耗时。</text>
</svg>
