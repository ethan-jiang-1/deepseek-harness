<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>PTC 模式：一次 run_code 调用的完整往返与安全审批链路</title>
  <desc>左侧模型上下文仅见唯一工具 run_code 与生成的 .d.ts SDK；中间全新沙箱 Node 进程运行 TS 脚本并通过控制通道发起 tools.xxx() 子调用；下方每次子调用逐个穿过完整安全管道，左侧审计日志成对记录 tool/ptc-dispatch-start 与 tool/ptc-dispatch 供前端展示，最终只把 print/return 汇总回传模型上下文。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1220" height="700" rx="8" fill="#f8fafc"/>
  <text x="610" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">PTC 模式：一次 run_code 调用的完整往返与安全管道</text>
  <text x="610" y="56" text-anchor="middle" font-size="12.5" fill="#475569">工具列表折叠成唯一 run_code；脚本内每次子调用照走完整审批与审计日志，只有精炼汇总回到模型上下文。</text>

  <!-- 左上：模型上下文 -->
  <rect x="36" y="84" width="310" height="236" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="191" y="112" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d28d9">模型看到的上下文输入</text>

  <rect x="58" y="128" width="266" height="54" rx="7" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="191" y="150" text-anchor="middle" font-weight="700" fill="#5b21b6">唯一工具 Schema：run_code</text>
  <text x="191" y="170" text-anchor="middle" font-size="11" fill="#6d28d9">必填参数：{ code, description }</text>

  <rect x="58" y="194" width="266" height="54" rx="7" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="191" y="216" text-anchor="middle" font-weight="700" fill="#5b21b6">提示词内嵌 .d.ts 工具 SDK</text>
  <text x="191" y="236" text-anchor="middle" font-size="11" fill="#6d28d9">tools.name(args) 按字典序稳定排列保缓存</text>

  <text x="191" y="274" text-anchor="middle" font-size="11.5" fill="#475569">只读工具支持 Promise.all 并发调用</text>
  <text x="191" y="294" text-anchor="middle" font-size="11.5" fill="#64748b">写操作与互斥工具按提交顺序排队独占执行</text>

  <!-- 提交脚本箭头 -->
  <line x1="346" y1="165" x2="454" y2="165" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrowPurple)"/>
  <text x="400" y="153" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">提交 TS 脚本</text>

  <!-- 回传汇总箭头 -->
  <line x1="460" y1="245" x2="354" y2="245" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="407" y="233" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">仅回传 print / return</text>
  <text x="407" y="264" text-anchor="middle" font-size="10.5" fill="#64748b">中间脏数据留内存即弃</text>

  <!-- 右上：PTC Node 子进程 -->
  <rect x="462" y="84" width="722" height="236" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="823" y="112" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">受沙箱约束的全新 Node 子进程（dsh-ptc-runtime-node）</text>

  <rect x="488" y="128" width="320" height="82" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="648" y="152" text-anchor="middle" font-weight="700" fill="#1e3a8a">async 函数体（支持顶层 await / return）</text>
  <text x="648" y="174" text-anchor="middle" font-size="11.5" fill="#475569">自由写 for 循环、条件过滤、try/catch</text>
  <text x="648" y="194" text-anchor="middle" font-size="11.5" fill="#64748b">清空环境变量，受当前会话文件沙箱限制</text>

  <rect x="832" y="128" width="326" height="82" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="995" y="152" text-anchor="middle" font-weight="700" fill="#1e3a8a">独立控制通道桥接子调用</text>
  <text x="995" y="174" text-anchor="middle" font-size="11.5" fill="#475569">await tools.read(...) 与 stdout/stderr 隔离</text>
  <text x="995" y="194" text-anchor="middle" font-size="11.5" fill="#64748b">并发安全子调用上限 maxParallelSubCalls = 10</text>

  <rect x="488" y="224" width="670" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="823" y="250" text-anchor="middle" font-weight="700" fill="#1e3a8a">挂载即验真 + 异常安全兜底</text>
  <text x="823" y="274" text-anchor="middle" font-size="11.5" fill="#1e40af">缺 ctx.ptcRuntime 时预设挂载即报错拒绝；脚本抛错转回常规工具错误结果，绝不击穿宿主进程</text>

  <!-- 向下进入完整管道 -->
  <line x1="823" y1="320" x2="823" y2="352" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="945" y="341" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">每次 tools.xxx() 单独穿过完整管道</text>

  <!-- 中左：会话审计日志 -->
  <rect x="36" y="356" width="380" height="156" rx="12" fill="#fefce8" stroke="#fde047"/>
  <text x="226" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">会话审计日志（前端可见 · 模型不重塞）</text>
  <text x="58" y="412" fill="#713f12">· 成对写入 tool/ptc-dispatch-start 与</text>
  <text x="58" y="432" fill="#713f12">　tool/ptc-dispatch 事件，保留完整入参与结果</text>
  <text x="58" y="456" fill="#713f12">· Web 界面据此渲染可展开的嵌套子调用明细</text>
  <text x="58" y="480" font-size="11.5" fill="#a16207">· 推导模型历史时自动跳过子调用，仅留最终汇总</text>

  <!-- 中右：ToolRuntime 管道 + 真实工具 -->
  <rect x="436" y="356" width="748" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="810" y="382" text-anchor="middle" font-weight="700" fill="#0f172a">tools/pre-execute → ctx.tools.guard() → tools/execute → post-execute → finalizeContent → result</text>
  <text x="810" y="406" text-anchor="middle" font-size="11.5" fill="#475569">权限插件既可预审脚本源码，也会逐个拦截子调用（子调用 ID 形如 &lt;parent&gt;:ptc:&lt;n&gt;）</text>

  <line x1="810" y1="428" x2="810" y2="446" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="436" y="450" width="748" height="62" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="810" y="476" text-anchor="middle" font-weight="700" fill="#166534">底层真实工具照常执行：read · edit · write · glob · grep · bash · subagent · web_search · todo_write …</text>
  <text x="810" y="498" text-anchor="middle" font-size="11.5" fill="#475569">（唯独 workflow-ptc 与 tool-workflow 在 ptc.patch.yml 中显式设为 disabled: true）</text>

  <!-- 下方两块特殊机制卡片 -->
  <rect x="36" y="530" width="564" height="74" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="318" y="556" text-anchor="middle" font-weight="700" fill="#9a3412">图片块自动延后附带（不塞进脚本字符串返回值）</text>
  <text x="318" y="580" text-anchor="middle" font-size="11.5" fill="#c2410c">子调用若产出图片，在 run_code 结束后自动延后为独立 user 消息发给模型</text>

  <rect x="620" y="530" width="564" height="74" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="902" y="556" text-anchor="middle" font-weight="700" fill="#991b1b">越权写文件照常触发正式审批（e2e 测试锁死）</text>
  <text x="902" y="580" text-anchor="middle" font-size="11.5" fill="#7f1d1d">只读沙箱直接写报 EPERM/EROFS；须传 workspace-write 与理由，点同意前绝不落盘</text>

  <!-- 底部权衡 -->
  <rect x="36" y="620" width="1148" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="610" y="645" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">选型账本：读几十份配置或日志做聚合统计时，把几十次模型往返压成 1 次；只改一两个文件用 Standard 更轻快</text>
  <text x="610" y="665" text-anchor="middle" font-size="11.5" fill="#475569">留意边界：提示词需常驻一份 .d.ts SDK 前缀；脚本内等待人工审批或慢工具的时间计入单次 run_code 总时长预算。</text>
</svg>
