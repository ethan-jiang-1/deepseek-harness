<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>PTC 模式：一次 run_code 的完整往返解剖</title>
  <desc>左侧是模型上下文，只含 run_code 工具和生成的 SDK。模型提交 run_code 的 code 与 description，程序在全新 Node 进程里执行，受会话文件沙箱约束。程序通过 await tools.xxx 调工具，每次子调用都走完整管道（pre-execute、guards、execute、post-execute、result），受权限与审批约束，并写一对 tool/ptc-dispatch 日志事件（不进模型历史）。程序结束后只有打印或返回值回到模型上下文；图像块在结算后 defer 成一条 user message。右侧标出沙箱升级路径：先被只读沙箱拒绝，审批通过后以 workspace-write 重试。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="740" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PTC 模式：一次 run_code 的完整往返</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#64748b">wire 上只有 run_code；工具本体、权限、审计全部不变——变的是"模型看见什么、什么回到上下文"。</text>

  <!-- 模型上下文 -->
  <rect x="40" y="100" width="250" height="240" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="165" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">模型上下文</text>
  <rect x="60" y="142" width="210" height="52" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="165" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">run_code</text>
  <text x="165" y="180" text-anchor="middle" font-size="11" fill="#6d28d9">{ code, description } 两个必填</text>
  <rect x="60" y="204" width="210" height="52" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="165" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">生成 SDK（.d.ts）</text>
  <text x="165" y="242" text-anchor="middle" font-size="11" fill="#6d28d9">tools.name(args) 全量声明，字典序稳定</text>
  <text x="165" y="276" text-anchor="middle" font-size="11" fill="#64748b">SDK 合同：只读调用可 Promise.all；</text>
  <text x="165" y="292" text-anchor="middle" font-size="11" fill="#64748b">互斥调用按提交序串行；有依赖就 await</text>
  <text x="165" y="316" text-anchor="middle" font-size="11" fill="#64748b">原生 schema 一个都不上 wire</text>

  <!-- run_code 调用 -->
  <line x1="290" y1="180" x2="380" y2="180" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="335" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">提交程序</text>

  <!-- PTC 进程 -->
  <rect x="385" y="100" width="330" height="240" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="550" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">全新 Node 进程（每次 run_code 一个）</text>
  <rect x="405" y="142" width="290" height="64" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="550" y="164" text-anchor="middle" font-size="12" fill="#1e3a8a">async 函数体：顶层 await / return</text>
  <text x="550" y="184" text-anchor="middle" font-size="11" fill="#64748b">循环 / 条件 / try-catch / Promise.all</text>
  <rect x="405" y="218" width="290" height="50" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="550" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">绑定通道：await tools.read(args) …</text>
  <text x="550" y="256" text-anchor="middle" font-size="11" fill="#64748b">独立控制通道，与 stdout/stderr 分开</text>
  <text x="550" y="290" text-anchor="middle" font-size="11" fill="#475569">跑在调用 Session 的文件沙箱策略下</text>
  <text x="550" y="308" text-anchor="middle" font-size="11" fill="#475569">程序环境变量为空；失败作为结果返回</text>
  <text x="550" y="326" text-anchor="middle" font-size="11" fill="#475569">并发上限 maxParallelSubCalls 默认 10</text>

  <!-- 子调用管道 -->
  <line x1="550" y1="340" x2="550" y2="372" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="620" y="362" font-size="11" font-weight="700" fill="#1e40af">每个子调用单独过完整管道</text>
  <rect x="180" y="376" width="740" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="550" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">tools/pre-execute → 单调 guards → tools/execute → tools/post-execute → finalizeContent → tools/result</text>
  <text x="550" y="424" text-anchor="middle" font-size="11" fill="#64748b">权限插件可在程序运行前检查程序文本；子调用 id 形如 &lt;parent&gt;:ptc:&lt;n&gt;；互斥调用独占池，结算时未启动的排队调用被放弃</text>

  <!-- 工具 -->
  <line x1="550" y1="450" x2="550" y2="478" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="180" y="482" width="740" height="60" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="506" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">可见 store 里的工具照常存在：read / edit / write / glob / grep / bash / subagent / web_search / todo_write / ask_user_question …</text>
  <text x="550" y="528" text-anchor="middle" font-size="11" fill="#64748b">（workflow 三件在 PTC 预设里 disabled: true）</text>

  <!-- 会话日志 -->
  <rect x="25" y="376" width="148" height="166" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="99" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">会话日志</text>
  <text x="99" y="424" text-anchor="middle" font-size="10" fill="#713f12">每个子 dispatch 写</text>
  <text x="99" y="440" text-anchor="middle" font-size="10" fill="#713f12">一对 ptc-dispatch-</text>
  <text x="99" y="456" text-anchor="middle" font-size="10" fill="#713f12">start / end 事件，</text>
  <text x="99" y="472" text-anchor="middle" font-size="10" fill="#713f12">含完整渲染结果；</text>
  <text x="99" y="488" text-anchor="middle" font-size="10" fill="#713f12">持久化但不进模型</text>
  <text x="99" y="504" text-anchor="middle" font-size="10" fill="#713f12">历史，Web 嵌套子</text>
  <text x="99" y="520" text-anchor="middle" font-size="10" fill="#713f12">行从这里渲染</text>

  <!-- 回程 -->
  <path d="M 385 220 C 300 220, 260 260, 290 300" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="292" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">只有 print / return 回上下文</text>
  <text x="292" y="368" text-anchor="middle" font-size="11" fill="#64748b">中间 tool-result 不再逐个整份回流</text>

  <!-- 图像 defer -->
  <rect x="40" y="562" width="560" height="70" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="320" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">图像块例外：不嵌进父 tool 结果</text>
  <text x="320" y="608" text-anchor="middle" font-size="10.5" fill="#9a3412">run_code 结算后 deferContext 成一条 user message（按提交序排在兄弟结果之后）</text>

  <!-- 升级路径 -->
  <rect x="620" y="562" width="540" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="890" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">沙箱升级走既有审批（e2e 钉住）</text>
  <text x="890" y="606" text-anchor="middle" font-size="10.5" fill="#7f1d1d">只读沙箱下 EPERM/EROFS 拒绝 → 程序显式 sandbox_permissions:</text>
  <text x="890" y="622" text-anchor="middle" font-size="10.5" fill="#7f1d1d">"workspace-write" + justification → 批准前文件不落盘</text>

  <!-- 底部 -->
  <rect x="40" y="652" width="1120" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="678" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">设计来源：LLM 写代码的经验远多于写人工 tool-call 轨迹（Cloudflare Code Mode 的观察）</text>
  <text x="600" y="700" text-anchor="middle" font-size="12" fill="#475569">换来的两件事：省往返（循环/分支/扇出不再每次回模型）+ 省上下文（中间结果留在程序里）。代价：SDK 前缀成本；嵌套等待消耗程序时长预算。</text>
</svg>
