<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>Standard 模式：31 个常规工具分组、三个隔离组与安全收口边界</title>
  <desc>左列列出 Standard 模式由 e2e 测试逐项锁死的 31 个常规原生工具（八组）；中列展示三个 isolate 隔离组与默认满配上下文输入；右列说明刻意挡在门外的三类高危能力及 web_fetch 的闭环放行判据。</desc>

  <rect width="1240" height="660" rx="8" fill="#f8fafc"/>
  <text x="620" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Standard 模式：31 个常规工具全景、隔离组与安全收口判据</text>
  <text x="620" y="56" text-anchor="middle" font-size="12.5" fill="#475569">工具清单由 apps/web/tests/shipped-composition.e2e.ts 逐项锁死；它是其余三个模式做折叠、剥离或扩权前的基准契约。</text>

  <!-- 左列：31 个工具（8 组） -->
  <rect x="36" y="78" width="380" height="492" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="226" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">暴露给模型的 31 个常规工具（八组）</text>

  <rect x="56" y="122" width="340" height="72" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="74" y="144" font-weight="700" fill="#1e3a8a">1. 终端（1）+ 2. 文件与搜索（7）</text>
  <text x="74" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">bash/pwsh · read · read_image · edit · write</text>
  <text x="74" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">working_directory · glob · grep（内置 ripgrep）</text>

  <rect x="56" y="204" width="340" height="72" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="74" y="226" font-weight="700" fill="#1e3a8a">3. 后台任务（3）+ 4. 定时调度（4）</text>
  <text x="74" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">job_list · job_output · job_kill</text>
  <text x="74" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">schedule_list · create · update · delete</text>

  <rect x="56" y="286" width="340" height="72" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="74" y="308" font-weight="700" fill="#1e3a8a">5. 长任务推进（5）</text>
  <text x="74" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">create_goal · get_goal · update_goal</text>
  <text x="74" y="347" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">exit_plan_mode · todo_write</text>

  <rect x="56" y="368" width="340" height="76" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="74" y="390" font-weight="700" fill="#166534">6. 子智能体委派与工作流编排（6）</text>
  <text x="74" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#14532d">subagent · subagent_fork · workflow</text>
  <text x="74" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#15803d">list_agents · interrupt_agent · send_message</text>

  <rect x="56" y="454" width="340" height="96" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="74" y="476" font-weight="700" fill="#1e3a8a">7. 联网检索（2）+ 8. 技能/交付/提问（3）</text>
  <text x="74" y="497" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">web_search · web_fetch</text>
  <text x="74" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">skill · present · ask_user_question</text>
  <text x="74" y="536" font-size="11" fill="#64748b">按需读 SKILL.md · 登记交付物卡 · 结构化澄清分歧</text>

  <!-- 中列：三个 isolate 隔离组 + 满配上下文 -->
  <rect x="434" y="78" width="372" height="492" rx="12" fill="#fefce8" stroke="#fde047"/>
  <text x="620" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#854d0e">三个 isolate 隔离组与满配提示词</text>

  <rect x="454" y="122" width="332" height="84" rx="8" fill="#ffffff" stroke="#fde047"/>
  <text x="472" y="146" font-weight="700" fill="#854d0e">① planning（isolate: planMode）</text>
  <text x="472" y="168" fill="#475569">把 /plan 只读探索纪律圈在当前预设内，</text>
  <text x="472" y="188" fill="#475569">进出计划模式绝不污染同进程其他会话。</text>

  <rect x="454" y="218" width="332" height="96" rx="8" fill="#ffffff" stroke="#fde047"/>
  <text x="472" y="242" font-weight="700" fill="#854d0e">② compaction（isolate: compaction 等）</text>
  <text x="472" y="264" fill="#475569">独立托管自动压缩、/compact 命令与长输出</text>
  <text x="472" y="284" fill="#475569">裁剪器（单次超 8,192 字符时留头 4,096</text>
  <text x="472" y="302" font-size="11" fill="#64748b">+ 尾 1,024 字符）。</text>

  <rect x="454" y="326" width="332" height="88" rx="8" fill="#ffffff" stroke="#fde047"/>
  <text x="472" y="350" font-weight="700" fill="#854d0e">③ delegation（isolate: workflowEngine）</text>
  <text x="472" y="372" fill="#475569">让子智能体池与受沙箱约束的 workflow-ptc</text>
  <text x="472" y="392" fill="#475569">脚本引擎在组内协同，跨预设彼此隐身。</text>

  <rect x="454" y="426" width="332" height="124" rx="8" fill="#fffbeb" stroke="#facc15"/>
  <text x="472" y="450" font-weight="700" fill="#854d0e">默认上下文输入（全开基线）</text>
  <text x="472" y="474" fill="#713f12">· persona：注入 {{model}} 身份前缀</text>
  <text x="472" y="496" fill="#713f12">· agent-instructions：读 AGENTS.md（≤64KB）</text>
  <text x="472" y="518" fill="#713f12">· time-context 时间段与动态环境快照</text>
  <text x="472" y="538" font-size="11" fill="#a16207">（Minimal 模式做减法时会将这三项全部剥离）</text>

  <!-- 右列：刻意收起的高危能力 -->
  <rect x="824" y="78" width="380" height="492" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1014" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">刻意挡在默认门外的能力（安全判据）</text>

  <rect x="844" y="122" width="340" height="104" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="862" y="146" font-weight="700" fill="#991b1b">✕ cordis_inspect_* · plugin_manager</text>
  <text x="862" y="168" fill="#7f1d1d">探查工具执行模型 JS 无沙箱约束；插件管理</text>
  <text x="862" y="188" fill="#7f1d1d">写入宿主进程且跨会话持久生效，仅在配齐</text>
  <text x="862" y="208" font-size="11" fill="#991b1b">danger 审批的 Creator 模式开放。</text>

  <rect x="844" y="238" width="340" height="90" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="862" y="262" font-weight="700" fill="#991b1b">✕ mcp_* 外部服务工具</text>
  <text x="862" y="284" fill="#7f1d1d">外部 MCP Server 在 ctx.shell 之外独立</text>
  <text x="862" y="304" fill="#7f1d1d">拉起子进程，默认沙箱管不到，需用户显式挂载。</text>

  <rect x="844" y="340" width="340" height="90" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="862" y="364" font-weight="700" fill="#991b1b">✕ ralph 无人值守自治循环</text>
  <text x="862" y="386" fill="#7f1d1d">多轮无人监督运行且依赖子任务自报完成，</text>
  <text x="862" y="406" fill="#7f1d1d">不进默认交互模式，按需安装 ralph-bundle。</text>

  <rect x="844" y="442" width="340" height="108" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="862" y="466" font-weight="700" fill="#166534">✓ 正向对照：为什么 web_fetch 默认上桌？</text>
  <text x="862" y="488" fill="#14532d">宿主补齐“公网地址强制校验（防内网 SSRF）</text>
  <text x="862" y="508" fill="#14532d">+ 一次性人工审批”后，模型自选 URL 的外发</text>
  <text x="862" y="528" fill="#14532d">风险闭环受控，因此正式纳入默认工具集。</text>

  <!-- 底部总结 -->
  <rect x="36" y="588" width="1168" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="620" y="611" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">准入铁律：能不能进 Standard，不看功能炫不炫，只看默认沙箱与审批管道能不能把风险闭环关住</text>
  <text x="620" y="630" text-anchor="middle" font-size="11.5" fill="#475569">日常编码甚至写临时脚本批量处理文件，直接用 Standard 就够；只有想省掉几十轮读取占用的上下文窗口时才需切 PTC。</text>
</svg>
