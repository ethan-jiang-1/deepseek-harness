<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>Minimal 模式：清空预设提示词，只留持久终端与基础压缩</title>
  <desc>上半部分展示提示词剥离：Standard 的多层系统提示词输入（身份前缀、工具使用指引、AGENTS.md、宿主额外段落）在 Minimal 里被 persona complete: true 全部屏蔽，只剩一句话；suppressRuntimeContext 关掉可选环境快照，仅留必需的当前工作目录。下半部分展示工具从 31 个缩减为 3 个（持久 bash/pwsh、read_image、working_directory），保留自动与手动 /compact 压缩，用作对照实验基线。</desc>
  <defs>
    <marker id="arrowOrange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Minimal 模式：清空预设指令栈，只留一句提示词与持久终端</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#64748b">核心靠 persona 的两个开关：complete: true（一句话独占系统提示词）+ includeRuntimeContext: false（关掉可选环境快照）。</text>

  <!-- 上半：提示词剥层 -->
  <text x="70" y="96" font-size="14" font-weight="700" fill="#c2410c">提示词与上下文层：从 Standard 满配剥离到只剩一句话</text>

  <rect x="40" y="112" width="520" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="300" y="140" text-anchor="middle" font-size="12" fill="#334155">部署级 persona 身份前缀（You are a coding agent powered by {{model}}）</text>
  <text x="576" y="140" font-size="16" fill="#dc2626" font-weight="700">✕</text>

  <rect x="40" y="166" width="520" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="300" y="194" text-anchor="middle" font-size="12" fill="#334155">内置工作流、工具使用规范与时间段落（time-context）</text>
  <text x="576" y="194" font-size="16" fill="#dc2626" font-weight="700">✕</text>

  <rect x="40" y="220" width="520" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="300" y="248" text-anchor="middle" font-size="12" fill="#334155">仓库级指令注入：agent-instructions（读取 AGENTS.md，上限 64KB）</text>
  <text x="576" y="248" font-size="16" fill="#dc2626" font-weight="700">✕</text>

  <rect x="40" y="274" width="520" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="300" y="302" text-anchor="middle" font-size="12" fill="#334155">可选动态环境快照（suppressRuntimeContext 屏蔽可选信息，仅留必需 cwd）</text>
  <text x="576" y="302" font-size="16" fill="#dc2626" font-weight="700">✕</text>

  <rect x="40" y="328" width="520" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="5 3"/>
  <text x="300" y="356" text-anchor="middle" font-size="12" fill="#991b1b">宿主全局额外挂载的任意段落（快照测试注入哨兵文本验证彻底排斥）</text>
  <text x="576" y="356" font-size="16" fill="#dc2626" font-weight="700">✕</text>

  <line x1="605" y1="240" x2="645" y2="240" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="655" y="176" width="495" height="128" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="902" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Minimal 发给模型的完整系统提示词</text>
  <text x="902" y="244" text-anchor="middle" font-size="13" fill="#7f1d1d" font-style="italic">"You are a helpful software engineer assistant."</text>
  <text x="902" y="278" text-anchor="middle" font-size="11" fill="#9a3412">complete: true —— 直接忽略后缀与其余所有提示词段落</text>

  <text x="902" y="332" text-anchor="middle" font-size="11" fill="#64748b">注：工具 JSON Schema 独立于提示词段落，3 个保留工具的定义照常发给模型</text>

  <!-- 下半：工具与状态 -->
  <text x="70" y="392" font-size="14" font-weight="700" fill="#c2410c">工具收缩与状态托管方式切换</text>

  <rect x="40" y="406" width="240" height="108" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="160" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Standard：31 个工具</text>
  <text x="160" y="456" text-anchor="middle" font-size="11" fill="#64748b">专用文件读写 / 搜索 / 后台任务 /</text>
  <text x="160" y="472" text-anchor="middle" font-size="11" fill="#64748b">目标 / 计划 / 子智能体 / 联网 …</text>
  <text x="160" y="496" text-anchor="middle" font-size="11" fill="#64748b">跨步状态由 Harness 设施分担</text>

  <line x1="280" y1="458" x2="330" y2="458" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="305" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">收敛</text>

  <rect x="335" y="406" width="250" height="108" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Minimal：仅 3 个工具</text>
  <text x="460" y="456" text-anchor="middle" font-size="11" fill="#9a3412">· bash（持久 PTY，Windows 为 pwsh）</text>
  <text x="460" y="474" text-anchor="middle" font-size="11" fill="#9a3412">· read_image · working_directory</text>
  <text x="460" y="496" text-anchor="middle" font-size="11" fill="#9a3412">isolate: terminals 隔离持久终端会话</text>

  <rect x="610" y="406" width="550" height="108" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="885" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">跨步状态回到持久 Shell 进程本身（快照测试实证）</text>
  <text x="885" y="456" text-anchor="middle" font-size="11" fill="#166534">第 1 次调用：cd persistent-state &amp;&amp; export DSH_MINIMAL_STATE=PERSISTED</text>
  <text x="885" y="474" text-anchor="middle" font-size="11" fill="#166534">第 2 次调用：直接读回 PERSISTED:{{cwd}}/persistent-state（目录与环境变量持续存活）</text>
  <text x="885" y="496" text-anchor="middle" font-size="11" fill="#64748b">对照：Standard 的 bash 每次命令都在全新子进程里执行，状态不跨步保留</text>

  <!-- 代价带 -->
  <rect x="40" y="530" width="1120" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="600" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">真实边界：虽保留上下文压缩（自动触发 + /compact），但没有待办、计划、子代理与专用改文件防呆</text>
  <text x="600" y="570" text-anchor="middle" font-size="11" fill="#7f1d1d">引导文案明确提醒："工具少，不代表对新手更容易"；同时终端命令照常受文件沙箱与审批门约束</text>

  <!-- 用途带 -->
  <rect x="40" y="598" width="1120" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="624" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">设计初衷：干净的对照实验（A/B 测试）基线与强化学习对齐参考面</text>
  <text x="600" y="646" text-anchor="middle" font-size="12" fill="#475569">固定模型、权限、输入与工作区初始状态，分别用 Standard 和 Minimal 跑同一任务，就能测出 Harness 脚手架到底贡献了多少增益。</text>
  <text x="600" y="664" text-anchor="middle" font-size="11" fill="#64748b">拆掉一切工程辅助后，看清“纯模型 + 一个持久终端”的真实底色。</text>
</svg>
