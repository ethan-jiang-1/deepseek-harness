<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>Minimal 模式：清空预设指令栈，只留一句提示词与持久终端</title>
  <desc>上半场展示 persona 的 complete: true 与 includeRuntimeContext: false 将多层常规提示词剥离到只剩一句英文提示词；下半场展示工具从 31 个收缩为 3 个（持久 PTY bash/pwsh、read_image、working_directory）并保留基础压缩，作为干净的 A/B 对照实验基线。</desc>
  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1220" height="680" rx="8" fill="#f8fafc"/>
  <text x="610" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Minimal 模式：清空预设指令栈，只留一句提示词与持久终端</text>
  <text x="610" y="56" text-anchor="middle" font-size="12.5" fill="#475569">核心靠 persona 的两枚开关：complete: true（独占系统提示词）+ includeRuntimeContext: false（屏蔽可选环境快照）。</text>

  <!-- 上半：提示词剥离 -->
  <text x="40" y="92" font-size="14" font-weight="700" fill="#9a3412">一、提示词与指令层：五类外围输入全部剥离（快照哨兵实证）</text>

  <rect x="40" y="108" width="560" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="320" y="134" text-anchor="middle" fill="#334155">常规部署身份前缀（You are a coding agent powered by {{model}}）</text>
  <text x="616" y="135" font-size="15" font-weight="700" fill="#dc2626">✕</text>

  <rect x="40" y="158" width="560" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="320" y="184" text-anchor="middle" fill="#334155">内置工具与工作流指南段落 + time-context 时间上下文</text>
  <text x="616" y="185" font-size="15" font-weight="700" fill="#dc2626">✕</text>

  <rect x="40" y="208" width="560" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="320" y="234" text-anchor="middle" fill="#334155">工作区指令自动推送：agent-instructions（不读仓库 AGENTS.md）</text>
  <text x="616" y="235" font-size="15" font-weight="700" fill="#dc2626">✕</text>

  <rect x="40" y="258" width="560" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="320" y="284" text-anchor="middle" fill="#334155">可选动态环境快照（suppressRuntimeContext 仅保留必需的当前 cwd）</text>
  <text x="616" y="285" font-size="15" font-weight="700" fill="#dc2626">✕</text>

  <rect x="40" y="308" width="560" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="5 3"/>
  <text x="320" y="334" text-anchor="middle" fill="#991b1b">宿主全局注册的任意额外段落（minimal-preset.snapshot.ts 哨兵断言排斥）</text>
  <text x="616" y="335" font-size="15" font-weight="700" fill="#dc2626">✕</text>

  <line x1="644" y1="228" x2="684" y2="228" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <rect x="692" y="156" width="488" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="936" y="188" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3412">Minimal 发给模型的完整系统提示词</text>
  <text x="936" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" fill="#7c2d12">"You are a helpful software engineer assistant."</text>
  <text x="936" y="256" text-anchor="middle" font-size="11.5" fill="#c2410c">complete: true —— 一字不差，直接屏蔽其余所有提示词段落</text>
  <text x="936" y="278" text-anchor="middle" font-size="11" fill="#64748b">（保留的 3 个工具 JSON Schema 独立于提示词，照常发送）</text>

  <!-- 下半：工具收缩与持久终端 -->
  <text x="40" y="384" font-size="14" font-weight="700" fill="#9a3412">二、工具收缩与跨步状态托管切换</text>

  <rect x="40" y="400" width="260" height="112" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="170" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Standard：31 个专用工具</text>
  <text x="170" y="452" text-anchor="middle" font-size="11.5" fill="#475569">文件读写 / 搜索 / 后台任务 /</text>
  <text x="170" y="472" text-anchor="middle" font-size="11.5" fill="#475569">目标 / 计划 / 待办 / 子智能体</text>
  <text x="170" y="494" text-anchor="middle" font-size="11" fill="#64748b">单次 bash 子进程（状态不跨步）</text>

  <line x1="300" y1="456" x2="348" y2="456" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="324" y="442" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">收敛</text>

  <rect x="356" y="400" width="276" height="112" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="494" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3412">Minimal：仅留 3 个工具</text>
  <text x="494" y="452" text-anchor="middle" font-size="11.5" fill="#7c2d12">· 持久 bash（Windows 为 pwsh）</text>
  <text x="494" y="472" text-anchor="middle" font-size="11.5" fill="#7c2d12">· read_image · working_directory</text>
  <text x="494" y="494" text-anchor="middle" font-size="11" fill="#c2410c">isolate: terminals 隔离持久 PTY</text>

  <rect x="652" y="400" width="528" height="112" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="916" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">持久 PTY 终端接管跨步状态（快照测试实证）</text>
  <text x="916" y="452" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#14532d">第 1 步：cd persistent-state &amp;&amp; export DSH_MINIMAL_STATE=PERSISTED</text>
  <text x="916" y="474" text-anchor="middle" font-size="11.5" fill="#15803d">第 2 步：直接读回 PERSISTED:{{cwd}}/persistent-state（目录与变量一直活着）</text>
  <text x="916" y="495" text-anchor="middle" font-size="11" fill="#475569">同时保留基础压缩（自动 + /compact），且终端命令照走文件沙箱与审批门</text>

  <!-- 误区与正确定位 -->
  <rect x="40" y="530" width="1140" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="610" y="553" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">防踩坑提醒：“工具少 ≠ 新手简单模式”——缺少先读后改保护、结构化搜索与长任务进度辅助，日常开发请选 Standard</text>
  <text x="610" y="572" text-anchor="middle" font-size="11" fill="#7f1d1d">另请注意区分：Web 里的 minimal 会话预设，与命令行供外部嵌入的 dsh --profile sdk-minimal 进程配置毫无包含关系。</text>

  <rect x="40" y="596" width="1140" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="610" y="622" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">正确用法：固定模型、权限、任务输入与工作区起始状态，与 Standard 做干净的 A/B 对照实验</text>
  <text x="610" y="644" text-anchor="middle" font-size="11.5" fill="#475569">拆掉一切工程脚手架后，直接测量“纯模型 + 持久终端”的裸能力，以及 AGENTS.md、专用工具和技能带来的真实增益。</text>
</svg>
