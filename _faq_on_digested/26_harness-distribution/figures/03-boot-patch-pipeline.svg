<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>启动流水线：四层 Patch 合成、模块解析与失败分级</title>
  <desc>拆解 app-boot 启动三阶段：四层 Patch 按固定顺序覆盖（同名行 config 整块替换）、先内置底座后单 Profile node_modules 解析模块、按必需行/可选行/跳过 Bundle 分级容错，以及三种 --dump 静态检查旁路。</desc>
  <defs>
    <marker id="arr26c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1160" height="620" rx="8" fill="#f8fafc"/>
  <text x="580" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">启动装载流水线：四层 Patch 合成 → 模块解析 → 分级激活</text>
  <text x="580" y="56" text-anchor="middle" font-size="11.5" fill="#475569">从空白根配置起步按序叠加；模块绝不跨 Profile 借用；失败按 Bundle 级与插件行重要性分级处置</text>

  <!-- Stage 1 -->
  <rect x="28" y="84" width="352" height="352" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="28" y="84" width="352" height="42" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="204" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">阶段 ① · 四层 Patch 顺序合成</text>

  <text x="48" y="152" font-size="11" font-weight="700" fill="#0f172a">1. Bundle 自带 Patch（按 bundles 顺序铺底）</text>
  <text x="48" y="176" font-size="11" font-weight="700" fill="#0f172a">2. Profile 级 cordis.patch.yml（设置页写回层）</text>
  <text x="48" y="200" font-size="11" font-weight="700" fill="#0f172a">3. 全局 $DSH_HOME/cordis.patch.yml</text>
  <text x="48" y="224" font-size="11" font-weight="700" fill="#0f172a">4. 命令行 CLI --patch（按参数顺序最高优先）</text>

  <line x1="48" y1="244" x2="360" y2="244" stroke="#e2e8f0"/>
  <text x="48" y="268" font-size="11" font-weight="700" fill="#991b1b">头号陷阱：同名行 config 是整块替换！</text>
  <text x="48" y="290" font-size="10.5" fill="#334155">· 不做深层对象或数组合并（勿局部改 preset-standard）</text>
  <text x="48" y="312" font-size="10.5" fill="#334155">· 写死 webserver 静态字面量会吞掉 !!js 参数表达式，</text>
  <text x="60" y="330" font-size="10.5" fill="#334155">导致外层传 --port / --no-open 完全失效</text>
  <text x="48" y="356" font-size="10" fill="#64748b">· 出厂默认值请放第 1 层，勿写进第 3 层锁死用户设置页</text>
  <text x="48" y="376" font-size="10" fill="#64748b">· 禁用后重新启用 Bundle 会排到列表末尾改变覆盖次序</text>

  <line x1="380" y1="260" x2="404" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26c)"/>

  <!-- Stage 2 -->
  <rect x="410" y="84" width="340" height="352" rx="10" fill="#ffffff" stroke="#86efac"/>
  <rect x="410" y="84" width="340" height="42" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="580" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">阶段 ② · Bundle 与依赖模块解析</text>

  <text x="430" y="152" font-size="11" font-weight="700" fill="#166534">两级查找链（严格隔离）：</text>
  <text x="430" y="176" font-size="10.5" fill="#334155">1. 优先从当前运行的 DSH 安装底座解析内置包</text>
  <text x="444" y="194" font-size="10" fill="#64748b">（如 dsh-base、dsh-web-app、dsh-headless）</text>
  <text x="430" y="218" font-size="10.5" fill="#334155">2. 其次从当前 Profile 的 node_modules/ 解析外部包</text>

  <line x1="430" y1="244" x2="730" y2="244" stroke="#e2e8f0"/>
  <text x="430" y="268" font-size="11" font-weight="700" fill="#92400e">全局 Patch 层无独立 node_modules！</text>
  <text x="430" y="290" font-size="10.5" fill="#334155">· 不同 Profile 之间绝不互相借用 node_modules</text>
  <text x="430" y="312" font-size="10.5" fill="#334155">· 若在 $DSH_HOME/cordis.patch.yml 插入仅装在</text>
  <text x="442" y="330" font-size="10.5" fill="#334155">kanban 里的包，切回 web 启动即报找不到模块</text>
  <text x="430" y="356" font-size="10" fill="#64748b">· 损坏或版本不兼容的外部 Bundle 整包记入</text>
  <text x="442" y="376" font-size="10" fill="#64748b">skippedBundles，其余健康 Bundle 按原序继续</text>

  <line x1="750" y1="260" x2="774" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26c)"/>

  <!-- Stage 3 -->
  <rect x="780" y="84" width="352" height="352" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="780" y="84" width="352" height="42" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="956" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">阶段 ③ · Loader 激活与失败分级</text>

  <text x="800" y="152" font-size="11" font-weight="700" fill="#991b1b">· 必需插件行失败 → 写诊断日志并 exit 1</text>
  <text x="814" y="170" font-size="10" fill="#64748b">（如 agent-loop / webserver / 前端未构建产物）</text>
  <text x="800" y="196" font-size="11" font-weight="700" fill="#92400e">· 可选插件行失败 → 打印警告并跳过该行</text>
  <text x="814" y="214" font-size="10" fill="#64748b">（服务继续运行，但该扩展功能静默缺失）</text>
  <text x="800" y="240" font-size="11" font-weight="700" fill="#991b1b">· 用户或 Profile Patch 语法损坏 → 直接终止</text>

  <line x1="800" y1="260" x2="1112" y2="260" stroke="#e2e8f0"/>
  <text x="800" y="284" font-size="11" font-weight="700" fill="#0f172a">热重载（HMR）与重启边界：</text>
  <text x="800" y="306" font-size="10.5" fill="#334155">· 改 patch 参数可由 dsh-hmr 串行热重组生效</text>
  <text x="800" y="328" font-size="10.5" fill="#334155">· 新增/移除 Bundle、升级依赖版本或更新前端</text>
  <text x="812" y="346" font-size="10.5" fill="#334155">静态构建产物，一律以重启宿主进程为准</text>
  <text x="800" y="376" font-size="10" fill="#64748b">诊断日志落点：$DSH_HOME/logs/startup-*.log</text>

  <!-- Dump bypass strip -->
  <rect x="28" y="456" width="1104" height="106" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="48" y="482" font-size="12.5" font-weight="700" fill="#312e81">不拉起服务的静态预检旁路（Dump 模式）</text>
  <text x="48" y="506" font-size="10.5" fill="#334155">· --dump-default-config：仅查看第 1 层有序 Bundle 合成后的出厂配置（覆盖已有行前先跑它看清原行 !!js 表达式）</text>
  <text x="48" y="526" font-size="10.5" fill="#334155">· --dump-config：完整叠加全部四层 Patch，并在注释中精确标出每一行配置的来源文件</text>
  <text x="48" y="546" font-size="10.5" fill="#4338ca">· --dump-config-schema：导出各插件声明的 JSON Schema（纯检查模式，不接受 --port 等运行期参数；注意仅对可信插件执行）</text>

  <!-- Bottom motto -->
  <text x="580" y="592" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">交付自检顺序：查 package.json 清单 → 跑 --dump-config 验合成树 → 查 startup-*.log 验激活 → 走 ?token= 验前端与会话。</text>
</svg>
