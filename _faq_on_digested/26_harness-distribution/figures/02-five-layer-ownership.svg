<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>定制工作台的五层运行栈与所有权划分</title>
  <desc>基于 DSH 组装定制工作台时的五层结构：运行时底座、Profile 组合清单、唯一受支持启动器 dsh、交互面 Surface、以及设置叠层与数据主目录隔离。</desc>
  <defs>
    <marker id="arr26b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1160" height="660" rx="8" fill="#f8fafc"/>
  <text x="580" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">定制工作台的五层运行栈：交付前必须逐层认领负责人</text>
  <text x="580" y="56" text-anchor="middle" font-size="11.5" fill="#475569">90% 场景发单包 Bundle 即可；一旦跨入独立定制工作台交付，包能装上 ≠ 入口合规 ≠ 数据已隔离</text>

  <!-- Layer 1 -->
  <rect x="28" y="82" width="844" height="88" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="108" font-size="13" font-weight="700" fill="#1e3a8a">① 运行时底座层（Runtime Carrier）</text>
  <text x="48" y="132" font-size="11" fill="#334155">可选载体：本机 Node + 全局 @deepseek-ai/dsh · 官方 Desktop 内置运行时 · 容器镜像 · Python SDK wheel</text>
  <text x="48" y="152" font-size="10" fill="#64748b">决定 Node 版本把关（^22.19 || &gt;=24）、安装包公证签名、自动更新源与离线依赖载荷</text>

  <rect x="888" y="82" width="244" height="88" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="908" y="108" font-size="11" font-weight="700" fill="#3730a3">负责方：底座提供者</text>
  <text x="908" y="130" font-size="10.5" fill="#334155">DSH 官方 / 桌面壳 / 镜像方</text>
  <text x="908" y="150" font-size="10" fill="#4338ca">谁打包底座，谁负责升级运行时</text>

  <line x1="450" y1="170" x2="450" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26b)"/>

  <!-- Layer 2 -->
  <rect x="28" y="192" width="844" height="88" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="218" font-size="13" font-weight="700" fill="#1e3a8a">② Profile 组合清单层（$DSH_HOME/profiles/&lt;name&gt;/）</text>
  <text x="48" y="242" font-size="11" fill="#334155">三类模式：官方 CLI 模板（web / headless / sdk / acp） · 派生自命名 Profile（kanban） · 桌面独占（desktop）</text>
  <text x="48" y="262" font-size="10" fill="#64748b">由 package.json 的有序 dsh.profile.bundles 与单 Profile 级 cordis.patch.yml 组成</text>

  <rect x="888" y="192" width="244" height="88" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="908" y="218" font-size="11" font-weight="700" fill="#3730a3">负责方：单一写入权威</text>
  <text x="908" y="240" font-size="10.5" fill="#334155">引导脚本 / 用户 / Desktop 壳</text>
  <text x="908" y="260" font-size="10" fill="#4338ca">勿每次启动重跑 --from-default-profile</text>

  <line x1="450" y1="280" x2="450" y2="298" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26b)"/>

  <!-- Layer 3 -->
  <rect x="28" y="302" width="844" height="88" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="328" font-size="13" font-weight="700" fill="#1e3a8a">③ 应用启动器层（Sole Supported Launcher）</text>
  <text x="48" y="352" font-size="11" fill="#334155">薄包装脚本 / systemd / 容器 Entrypoint 只负责设好环境变量与参数，最终 exec dsh --profile &lt;name&gt;</text>
  <text x="48" y="372" font-size="10" fill="#991b1b">架构铁律：严禁在自定义包里写 bin 直接 new Loader() 绕过 dsh 另起炉灶！</text>

  <rect x="888" y="302" width="244" height="88" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="908" y="328" font-size="11" font-weight="700" fill="#3730a3">负责方：DSH 核心启动链</text>
  <text x="908" y="350" font-size="10.5" fill="#334155">app-boot 统一接管生命周期</text>
  <text x="908" y="370" font-size="10" fill="#4338ca">保障兼容门禁、HMR 与优雅停机</text>

  <line x1="450" y1="390" x2="450" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26b)"/>

  <!-- Layer 4 -->
  <rect x="28" y="412" width="844" height="88" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="438" font-size="13" font-weight="700" fill="#1e3a8a">④ 交互面与首启引导层（Surface &amp; First-Run）</text>
  <text x="48" y="462" font-size="11" fill="#334155">Web 首启一次性 ?token= 换 Cookie · 目录选择器适配（原生框 vs 网页浏览） · 前端 openSession 绑定</text>
  <text x="48" y="482" font-size="10" fill="#64748b">不同交互面的命令行参数互不相通（如 headless 派生 Profile 传 --port 会报未知参数）</text>

  <rect x="888" y="412" width="244" height="88" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="908" y="438" font-size="11" font-weight="700" fill="#3730a3">负责方：Surface + 前端插件</text>
  <text x="908" y="460" font-size="10.5" fill="#334155">勿强绑 Web 独有的 welcome-notice</text>
  <text x="908" y="480" font-size="10" fill="#4338ca">包装脚本 --no-open 须透传 ?token=</text>

  <line x1="450" y1="500" x2="450" y2="518" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26b)"/>

  <!-- Layer 5 -->
  <rect x="28" y="522" width="844" height="88" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="48" y="548" font-size="13" font-weight="700" fill="#92400e">⑤ 设置优先级与数据隔离层（State &amp; Isolation）</text>
  <text x="48" y="572" font-size="11" fill="#334155">出厂默认值放第 1 层 Bundle Patch，把第 2 层留给用户设置页；光换 --profile 仍共用会话、工作区与凭据！</text>
  <text x="48" y="592" font-size="10" fill="#92400e">需要彻底隔离双开时，必须同时指定独立的 DSH_HOME + 独立监听端口（桌面壳外加 --user-data-dir）</text>

  <rect x="888" y="522" width="244" height="88" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="908" y="548" font-size="11" font-weight="700" fill="#92400e">负责方：定制工作台设计者</text>
  <text x="908" y="570" font-size="10.5" fill="#334155">明确共享还是隔离 DSH_HOME</text>
  <text x="908" y="590" font-size="10" fill="#78350f">文档写明回退命令与卸载清理路径</text>

  <!-- Bottom rule -->
  <text x="580" y="638" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">选型准则：能靠“单包 Bundle + 应用内 Plugins 页一键安装”解决的场景，绝不过早背负自定义启动脚本与重打包维护成本。</text>
</svg>
