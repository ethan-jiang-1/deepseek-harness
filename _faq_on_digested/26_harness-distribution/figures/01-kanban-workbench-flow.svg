<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>Kanban 定制工作台端到端组装与运行流</title>
  <desc>上半部展示从专属 Profile 清单与 Kanban Bundle 装配出宿主 Runtime 与前端模块；下半部展示前端自定义视图经 Web BFF 控制器创建会话、绑定 kanban 预设并通过 ctx.fs.contains 限界读写用户看板文件的闭环。</desc>
  <defs>
    <marker id="arr26a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1160" height="660" rx="8" fill="#f8fafc"/>
  <text x="580" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Kanban 定制工作台：从启动组装到安全读写看板文件的完整闭环</text>
  <text x="580" y="56" text-anchor="middle" font-size="11.5" fill="#475569">上半区完成启动期插件树合成；下半区串联定制前端视图、Web BFF 控制器、智能体专属工具与用户项目文件</text>

  <!-- Band 1: Boot Composition -->
  <rect x="28" y="78" width="1104" height="206" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="104" font-size="13" font-weight="700" fill="#0f172a">① 启动期组装：专属 Profile 清单 + 工作台 Bundle → 宿主 Runtime</text>

  <rect x="48" y="120" width="328" height="106" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="68" y="144" font-size="11.5" font-weight="700" fill="#1e3a8a">专属 Profile（profiles/kanban/package.json）</text>
  <text x="68" y="166" font-size="10.5" fill="#334155">· 首次用 --from-default-profile web 初始化</text>
  <text x="68" y="186" font-size="10.5" fill="#334155">· bundles 顺序：base → web-app → kanban-bundle</text>
  <text x="68" y="206" font-size="10" fill="#1e40af">内置底座从 dsh 解析，外部包从当前 Profile 解析</text>

  <line x1="376" y1="173" x2="404" y2="173" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26a)"/>

  <rect x="410" y="120" width="352" height="106" rx="8" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="430" y="144" font-size="11.5" font-weight="700" fill="#9d174d">工作台扩展包（@acme/kanban-bundle）</text>
  <text x="430" y="166" font-size="10.5" fill="#334155">· cordis.patch.yml：挂 Host 根行以激活 dsh.client</text>
  <text x="430" y="186" font-size="10.5" fill="#334155">· presets/kanban.patch.yml：插入独立 preset-kanban 行</text>
  <text x="430" y="206" font-size="10" fill="#9d174d">显式白名单列出 @acme/kanban-tools 与 present</text>

  <line x1="762" y1="173" x2="790" y2="173" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26a)"/>

  <rect x="796" y="120" width="316" height="106" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="816" y="144" font-size="11.5" font-weight="700" fill="#92400e">app-boot → 宿主 Runtime 与前端构建</text>
  <text x="816" y="166" font-size="10.5" fill="#334155">· 按 Bundle → Profile → Home → --patch 叠层</text>
  <text x="816" y="186" font-size="10.5" fill="#334155">· Registry 挂载 kanban 预设的专属插件子树</text>
  <text x="816" y="206" font-size="10" fill="#78350f">注意：同名行 config 为整块替换，勿冲掉 !!js 参数</text>

  <rect x="48" y="238" width="1064" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="580" y="259" text-anchor="middle" font-size="10.5" fill="#334155">叠层合成流水线：空根配置 → 有序 Bundle Patch（出厂默认值） → Profile Patch（用户设置页写回层） → $DSH_HOME 全局层 → CLI --patch 临时层</text>

  <!-- Band 2: End-to-End Runtime Flow -->
  <rect x="28" y="302" width="1104" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="328" font-size="13" font-weight="700" fill="#0f172a">② 运行期数据流：定制前端视图 ↔ Web BFF 控制器 ↔ 专属工具 ↔ 用户看板文件</text>

  <rect x="48" y="346" width="248" height="156" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="66" y="370" font-size="11.5" font-weight="700" fill="#1e3a8a">定制前端视图（./client）</text>
  <text x="66" y="394" font-size="10.5" fill="#334155">1. 目录选择器选定看板文件夹</text>
  <text x="66" y="416" font-size="10.5" fill="#334155">2. 需侧栏分组则调 workspace.create</text>
  <text x="66" y="438" font-size="10.5" fill="#334155">3. 建好会话后显式调 openSession</text>
  <text x="66" y="464" font-size="10" fill="#1d4ed8">注：后端建会话不会自动替浏览器</text>
  <text x="66" y="480" font-size="10" fill="#1d4ed8">切换当前打开的对话标签页！</text>

  <line x1="296" y1="424" x2="322" y2="424" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26a)"/>

  <rect x="328" y="346" width="252" height="156" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="346" y="370" font-size="11.5" font-weight="700" fill="#166534">Web BFF（sessionController）</text>
  <text x="346" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#14532d">session.create({</text>
  <text x="346" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#14532d">  workspaceId | cwd, // 二选一</text>
  <text x="346" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#14532d">  agentPreset: "kanban"</text>
  <text x="346" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#14532d">})</text>
  <text x="346" y="472" font-size="10" fill="#15803d">同传 workspaceId 与 cwd 会直接报</text>
  <text x="346" y="488" font-size="10" fill="#15803d">gateway/bad-request；固化 header.cwd</text>

  <line x1="580" y1="424" x2="606" y2="424" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26a)"/>

  <rect x="612" y="346" width="256" height="156" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="630" y="370" font-size="11.5" font-weight="700" fill="#92400e">Kanban 专属工具（Host 侧）</text>
  <text x="630" y="394" font-size="10.5" fill="#334155">· 取不可变的 session.header.cwd</text>
  <text x="630" y="416" font-size="10.5" fill="#334155">· 调 ctx.fs.contains(root, target)</text>
  <text x="630" y="438" font-size="10.5" fill="#334155">· 经 ctx.fs 乐观并发读写看板文件</text>
  <text x="630" y="464" font-size="10" fill="#b45309">红线：Host 插件跑在模型沙箱之外，</text>
  <text x="630" y="480" font-size="10" fill="#b45309">必须自己锁死项目根目录防路径穿越</text>

  <line x1="868" y1="424" x2="894" y2="424" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr26a)"/>

  <rect x="900" y="346" width="212" height="156" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="918" y="370" font-size="11.5" font-weight="700" fill="#065f46">用户项目看板文件</text>
  <text x="918" y="394" font-size="10.5" fill="#334155">board.json / cards/*.md</text>
  <text x="918" y="418" font-size="10.5" fill="#334155">· 配合 present 渲染预览卡片</text>
  <text x="918" y="440" font-size="10.5" fill="#334155">· 归终端用户与项目仓库所有</text>
  <text x="918" y="466" font-size="10" fill="#047857">删侧栏记录或卸载工作台</text>
  <text x="918" y="482" font-size="10" fill="#047857">均绝不删除项目目录文件</text>

  <!-- Band 3: Ownership ledger strip -->
  <rect x="28" y="542" width="1104" height="98" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="48" y="568" font-size="12" font-weight="700" fill="#312e81">③ 三处并存状态的清晰归属账单（互不混存）</text>
  <text x="48" y="592" font-size="10.5" fill="#334155">· 用户项目目录：存放看板卡片与文档唯一真值（随时可提交 Git 带走）。</text>
  <text x="48" y="612" font-size="10.5" fill="#334155">· 专属 $DSH_HOME：存放会话日志（sessions/）、跨项目最近列表（ctx.storageDomain）与 API 密钥（.credentials.yaml，严禁打进镜像）。</text>
  <text x="48" y="630" font-size="10.5" fill="#4338ca">· 浏览器 Origin / 桌面壳 userData：仅存看板列折叠、筛选器与当前打开会话等纯视图偏好（定制 Web 建议固定独立端口防撞 Origin）。</text>
</svg>
