<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>设置层：默认值、覆盖与两个陷阱</title>
  <desc>Config schema 默认值、bundle patch、profile patch、home patch、CLI overrides、env/args、client/shell 设置；后层覆盖前层；整份 config 替换和字面值让 --port 失效是两个陷阱。</desc>

  <rect width="1200" height="760" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">设置层：默认值、覆盖与两个陷阱</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">后层覆盖前层；patch 替换整份 config，不做字段合并</text>

  <g>
    <rect x="24" y="92" width="660" height="56" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="116" font-size="11" font-weight="700" fill="#1e40af">Config schema 默认值</text>
    <text x="44" y="136" font-size="9.5" fill="#64748b">plugin 声明；不是插入的配置值</text>

    <rect x="24" y="160" width="660" height="56" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="184" font-size="11" font-weight="700" fill="#1e40af">bundle patch</text>
    <text x="44" y="204" font-size="9.5" fill="#64748b">发行版默认值；随 bundle 版本发布</text>

    <rect x="24" y="228" width="660" height="56" rx="8" fill="#eef2ff" stroke="#818cf8"/>
    <text x="44" y="252" font-size="11" font-weight="700" fill="#1e40af">profile patch</text>
    <text x="44" y="272" font-size="9.5" fill="#334155">用户/发行版设置；Settings UI（Config.volatile）写这里</text>

    <rect x="24" y="296" width="660" height="56" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="320" font-size="11" font-weight="700" fill="#1e40af">home patch</text>
    <text x="44" y="340" font-size="9.5" fill="#64748b">$DSH_HOME/cordis.patch.yml；同 home 所有 profile，优先级高于 profile</text>

    <rect x="24" y="364" width="660" height="56" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="388" font-size="11" font-weight="700" fill="#1e40af">CLI --patch</text>
    <text x="44" y="408" font-size="9.5" fill="#64748b">本次启动的 overlay；按 argv 顺序，最后赢</text>

    <rect x="24" y="432" width="660" height="56" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="456" font-size="11" font-weight="700" fill="#1e40af">app args / env / .env / credentials</text>
    <text x="44" y="476" font-size="9.5" fill="#64748b">--port 等只在 row 保留 !!js 表达式时压过 config</text>

    <rect x="24" y="500" width="660" height="56" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="524" font-size="11" font-weight="700" fill="#1e40af">client localStorage / Desktop shell 设置</text>
    <text x="44" y="544" font-size="9.5" fill="#64748b">按 origin/device；Electron userData/desktop/settings.json 不受 DSH_HOME 重定位</text>
  </g>

  <path d="M 354 148 L 354 158" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 348 152 L 354 160 L 360 152" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 354 216 L 354 226" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 348 220 L 354 228 L 360 220" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 354 284 L 354 294" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 348 288 L 354 296 L 360 288" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 354 352 L 354 362" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 348 356 L 354 364 L 360 356" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 354 420 L 354 430" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 348 424 L 354 432 L 360 424" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 354 488 L 354 498" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 348 492 L 354 500 L 360 492" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <rect x="716" y="92" width="460" height="204" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="736" y="120" font-size="12" font-weight="700" fill="#b45309">陷阱 1：整份 config 替换</text>
  <text x="736" y="146" font-size="9.5" fill="#334155">patch 只写 port/openBrowser，host 就丢了：</text>
  <text x="736" y="168" font-size="9.5" fill="#334155">webserver required 失败，</text>
  <text x="736" y="188" font-size="9.5" fill="#334155">“$.host missing required value”。</text>
  <text x="736" y="214" font-size="9.5" fill="#64748b">patch 对 config 是整份替换，不是字段合并。</text>
  <text x="736" y="242" font-size="9.5" fill="#64748b">要写全必填字段，或保留表达式。</text>

  <rect x="716" y="312" width="460" height="204" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="736" y="340" font-size="12" font-weight="700" fill="#991b1b">陷阱 2：字面值让 --port 失效</text>
  <text x="736" y="366" font-size="9.5" fill="#334155">默认是 !!js ctx.webStartup.port ?? 3080；</text>
  <text x="736" y="388" font-size="9.5" fill="#334155">patch 写死 port: 4133 后，</text>
  <text x="736" y="410" font-size="9.5" fill="#334155">dsh web --port 0 仍监听 4133。</text>
  <text x="736" y="436" font-size="9.5" fill="#64748b">app 参数不是总开关，只在表达式保留时生效。</text>

  <rect x="716" y="532" width="460" height="96" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="736" y="560" font-size="12" font-weight="700" fill="#3730a3">层序实验（T）</text>
  <text x="736" y="584" font-size="9.5" fill="#334155">profile 4123 → home 4124 → --patch 4125</text>
  <text x="736" y="606" font-size="9.5" fill="#64748b">dump-config 注释标出每个 row 的来源文件。</text>

  <text x="24" y="600" font-size="9.5" fill="#64748b">dump-default-config 只看 bundle 层；dump-config 叠加 profile/home/CLI；两者都初始化缺失 profile，但不证明挂载。</text>
  <text x="24" y="620" font-size="9.5" fill="#64748b">Settings UI 写 profile patch；home patch 是机器级共享；Desktop shell 设置独立。</text>

  <text x="24" y="700" font-size="9.5" fill="#64748b">C：CLI reference、config layers、web bundle；T：隔离 home 实验（见 90）。</text>
  <text x="24" y="720" font-size="9.5" fill="#64748b">发行版默认值放 bundle patch；用户覆盖留 profile/home；不要把凭据写进 patch。</text>
</svg>
