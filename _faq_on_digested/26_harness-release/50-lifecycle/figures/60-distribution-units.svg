<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>分发单位：包含什么、怎么装、谁更新、谁校验</title>
  <desc>npm bundle、发行版安装器、Desktop App、容器镜像、Python wheel、离线 tarball、目录索引七种分发单位的安装、更新与签名责任。</desc>

  <rect width="1200" height="700" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">分发单位：包含什么、怎么装、谁更新、谁校验</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">bundle 是安装单位；profile 不是发布物；安装器/镜像/壳是交付载体</text>

  <rect x="24" y="84" width="200" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">发布单位</text>
  <rect x="224" y="84" width="300" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="240" y="105" font-size="11" font-weight="700" fill="#3730a3">包含什么</text>
  <rect x="524" y="84" width="250" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="540" y="105" font-size="11" font-weight="700" fill="#3730a3">安装</text>
  <rect x="774" y="84" width="200" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="790" y="105" font-size="11" font-weight="700" fill="#3730a3">更新</text>
  <rect x="974" y="84" width="202" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="990" y="105" font-size="11" font-weight="700" fill="#3730a3">签名/校验</text>

  <g>
    <rect x="24" y="120" width="1152" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="148" font-size="10" font-weight="700" fill="#1e40af">npm bundle</text>
    <text x="40" y="166" font-size="9.5" fill="#64748b">作者发布物</text>
    <text x="240" y="148" font-size="9.5" fill="#334155">包 + dsh.bundle.patch + 依赖</text>
    <text x="540" y="148" font-size="9.5" fill="#334155">dsh plugin add</text>
    <text x="540" y="166" font-size="9.5" fill="#64748b">重启 profile</text>
    <text x="790" y="148" font-size="9.5" fill="#334155">npm 版本</text>
    <text x="990" y="148" font-size="9.5" fill="#334155">checksum；provenance 可选</text>

    <rect x="24" y="192" width="1152" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="220" font-size="10" font-weight="700" fill="#1e40af">发行版安装器</text>
    <text x="40" y="238" font-size="9.5" fill="#64748b">首启/升级</text>
    <text x="240" y="220" font-size="9.5" fill="#334155">脚本 + profile bootstrap + 固定 bundle</text>
    <text x="540" y="220" font-size="9.5" fill="#334155">创建 profile + add</text>
    <text x="540" y="238" font-size="9.5" fill="#64748b">幂等；保留数据</text>
    <text x="790" y="220" font-size="9.5" fill="#334155">发行版 updater</text>
    <text x="990" y="220" font-size="9.5" fill="#334155">checksum/签名</text>

    <rect x="24" y="264" width="1152" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="292" font-size="10" font-weight="700" fill="#1e40af">官方 Desktop</text>
    <text x="40" y="310" font-size="9.5" fill="#64748b">消费桌面</text>
    <text x="240" y="292" font-size="9.5" fill="#334155">Electron 壳 + 内置 dsh + profile</text>
    <text x="540" y="292" font-size="9.5" fill="#334155">安装包</text>
    <text x="540" y="310" font-size="9.5" fill="#64748b">单实例；drain</text>
    <text x="790" y="292" font-size="9.5" fill="#334155">应用 feed</text>
    <text x="990" y="292" font-size="9.5" fill="#334155">平台签名/公证</text>

    <rect x="24" y="336" width="1152" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="364" font-size="10" font-weight="700" fill="#1e40af">容器镜像</text>
    <text x="40" y="382" font-size="9.5" fill="#64748b">托管/内网</text>
    <text x="240" y="364" font-size="9.5" fill="#334155">dsh + profile + entrypoint</text>
    <text x="540" y="364" font-size="9.5" fill="#334155">pull/run</text>
    <text x="540" y="382" font-size="9.5" fill="#64748b">挂载 home/数据卷</text>
    <text x="790" y="364" font-size="9.5" fill="#334155">tag/digest</text>
    <text x="990" y="364" font-size="9.5" fill="#334155">镜像签名/digest</text>

    <rect x="24" y="408" width="1152" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="436" font-size="10" font-weight="700" fill="#1e40af">Python wheel</text>
    <text x="40" y="454" font-size="9.5" fill="#64748b">SDK/ACP</text>
    <text x="240" y="436" font-size="9.5" fill="#334155">dsh CLI + SDK runtime</text>
    <text x="540" y="436" font-size="9.5" fill="#334155">pip install</text>
    <text x="540" y="454" font-size="9.5" fill="#64748b">显式 home</text>
    <text x="790" y="436" font-size="9.5" fill="#334155">wheel 版本</text>
    <text x="990" y="436" font-size="9.5" fill="#334155">wheel hash</text>

    <rect x="24" y="480" width="1152" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="508" font-size="10" font-weight="700" fill="#1e40af">离线 tarball</text>
    <text x="40" y="526" font-size="9.5" fill="#64748b">内网/air-gap</text>
    <text x="240" y="508" font-size="9.5" fill="#334155">npm tgz/镜像/profile 快照</text>
    <text x="540" y="508" font-size="9.5" fill="#334155">本地 add/load</text>
    <text x="540" y="526" font-size="9.5" fill="#64748b">按顺序</text>
    <text x="790" y="508" font-size="9.5" fill="#334155">手动</text>
    <text x="990" y="508" font-size="9.5" fill="#334155">checksum</text>

    <rect x="24" y="552" width="1152" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="580" font-size="10" font-weight="700" fill="#1e40af">目录/市场索引</text>
    <text x="40" y="598" font-size="9.5" fill="#64748b">发现</text>
    <text x="240" y="580" font-size="9.5" fill="#334155">元数据，不含安装内容</text>
    <text x="540" y="580" font-size="9.5" fill="#334155">不安装</text>
    <text x="540" y="598" font-size="9.5" fill="#64748b">跳转到源</text>
    <text x="790" y="580" font-size="9.5" fill="#334155">索引刷新</text>
    <text x="990" y="580" font-size="9.5" fill="#334155">不适用</text>
  </g>

  <text x="24" y="648" font-size="9.5" fill="#64748b">C：FAQ 24 的包合同、CLI/Desktop 文档；S/R：社区安装器/壳/镜像样本。发布物自包含、声明兼容、带 README/license。</text>
  <text x="24" y="668" font-size="9.5" fill="#64748b">版本钉住（dsh/bundle/lock/digest）是分发的一部分；更新要有 owner，回退是重装旧版本。</text>
</svg>
