<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>启动面矩阵：命令、参数、生命周期与支持状态</title>
  <desc>Web、Desktop、headless、SDK、ACP、TUI 的启动方式、参数、生命周期和支持状态。</desc>

  <rect width="1200" height="820" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">启动面矩阵：命令、参数、生命周期与支持状态</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">同一个 launcher，不同 surface；shipped / 可能 要分清</text>

  <rect x="24" y="84" width="160" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">Surface</text>
  <rect x="184" y="84" width="250" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="200" y="105" font-size="11" font-weight="700" fill="#3730a3">启动</text>
  <rect x="434" y="84" width="320" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="450" y="105" font-size="11" font-weight="700" fill="#3730a3">参数 / 协议</text>
  <rect x="754" y="84" width="240" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="770" y="105" font-size="11" font-weight="700" fill="#3730a3">生命周期</text>
  <rect x="994" y="84" width="182" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="1010" y="105" font-size="11" font-weight="700" fill="#3730a3">支持状态</text>

  <g>
    <rect x="24" y="120" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="148" font-size="11" font-weight="700" fill="#1e40af">Web</text>
    <text x="40" y="168" font-size="9.5" fill="#64748b">浏览器 GUI</text>
    <text x="200" y="148" font-size="9.5" fill="#334155">dsh web / dsh --profile web</text>
    <text x="200" y="168" font-size="9.5" fill="#64748b">shipped web profile</text>
    <text x="450" y="148" font-size="9.5" fill="#334155">--host --port --tls-cert/key</text>
    <text x="450" y="168" font-size="9.5" fill="#334155">--public-url --trusted-host --no-open</text>
    <text x="770" y="148" font-size="9.5" fill="#334155">长驻；5s drain</text>
    <text x="770" y="168" font-size="9.5" fill="#64748b">SIGTERM 0 / SIGINT 130</text>
    <text x="1010" y="158" font-size="9.5" fill="#15803d">C · shipped</text>

    <rect x="24" y="200" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="228" font-size="11" font-weight="700" fill="#1e40af">Desktop</text>
    <text x="40" y="248" font-size="9.5" fill="#64748b">官方 Electron</text>
    <text x="200" y="228" font-size="9.5" fill="#334155">双击应用 / 内置命令</text>
    <text x="200" y="248" font-size="9.5" fill="#64748b">dsh-app://app/</text>
    <text x="450" y="228" font-size="9.5" fill="#334155">Electron 参数；port patch</text>
    <text x="450" y="248" font-size="9.5" fill="#64748b">OS 分配端口、loopback</text>
    <text x="770" y="228" font-size="9.5" fill="#334155">单实例；更新 drain</text>
    <text x="770" y="248" font-size="9.5" fill="#64748b">recovery 对话框</text>
    <text x="1010" y="238" font-size="9.5" fill="#15803d">C · 官方</text>

    <rect x="24" y="280" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="308" font-size="11" font-weight="700" fill="#1e40af">headless</text>
    <text x="40" y="328" font-size="9.5" fill="#64748b">一次性任务</text>
    <text x="200" y="308" font-size="9.5" fill="#334155">dsh --profile headless "task"</text>
    <text x="200" y="328" font-size="9.5" fill="#64748b">无端口/无 Web</text>
    <text x="450" y="308" font-size="9.5" fill="#334155">任务文本（位置参数）</text>
    <text x="450" y="328" font-size="9.5" fill="#64748b">stdout 最终文本；stderr reasoning</text>
    <text x="770" y="308" font-size="9.5" fill="#334155">completed 0，否则 1</text>
    <text x="770" y="328" font-size="9.5" fill="#64748b">fresh session</text>
    <text x="1010" y="318" font-size="9.5" fill="#15803d">C · shipped</text>

    <rect x="24" y="360" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="388" font-size="11" font-weight="700" fill="#1e40af">SDK</text>
    <text x="40" y="408" font-size="9.5" fill="#64748b">JSON-RPC</text>
    <text x="200" y="388" font-size="9.5" fill="#334155">dsh --profile sdk</text>
    <text x="200" y="408" font-size="9.5" fill="#64748b">sdk-minimal 同</text>
    <text x="450" y="388" font-size="9.5" fill="#334155">无选项；stdio 协议</text>
    <text x="450" y="408" font-size="9.5" fill="#64748b">client 负责 spawn</text>
    <text x="770" y="388" font-size="9.5" fill="#334155">到 disconnect</text>
    <text x="770" y="408" font-size="9.5" fill="#64748b">EOF 即退出</text>
    <text x="1010" y="398" font-size="9.5" fill="#15803d">C · shipped</text>

    <rect x="24" y="440" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="468" font-size="11" font-weight="700" fill="#1e40af">ACP</text>
    <text x="40" y="488" font-size="9.5" fill="#64748b">自动化</text>
    <text x="200" y="468" font-size="9.5" fill="#334155">dsh --profile acp</text>
    <text x="200" y="488" font-size="9.5" fill="#64748b">stdio</text>
    <text x="450" y="468" font-size="9.5" fill="#334155">无选项；ACP 协议</text>
    <text x="450" y="488" font-size="9.5" fill="#64748b">create/resume/close</text>
    <text x="770" y="468" font-size="9.5" fill="#334155">到 disconnect</text>
    <text x="770" y="488" font-size="9.5" fill="#64748b">权限/取消</text>
    <text x="1010" y="478" font-size="9.5" fill="#15803d">C · shipped</text>

    <rect x="24" y="520" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="548" font-size="11" font-weight="700" fill="#1e40af">TUI / 自定义</text>
    <text x="40" y="568" font-size="9.5" fill="#64748b">terminal app</text>
    <text x="200" y="548" font-size="9.5" fill="#334155">dsh --profile &lt;tui&gt;</text>
    <text x="200" y="568" font-size="9.5" fill="#64748b">profile 名自定</text>
    <text x="450" y="548" font-size="9.5" fill="#334155">由 terminal app bundle 解析</text>
    <text x="450" y="568" font-size="9.5" fill="#64748b">ctx.cmdlineArgs</text>
    <text x="770" y="548" font-size="9.5" fill="#334155">app-defined</text>
    <text x="770" y="568" font-size="9.5" fill="#64748b">非 shipped</text>
    <text x="1010" y="558" font-size="9.5" fill="#b45309">可能 · 非 shipped</text>

  </g>

  <text x="24" y="620" font-size="9.5" fill="#64748b">C = DSH 当前合同；shipped = 随 dsh 提供的 profile。T = 隔离 home 实验：web --port 0、SDK/ACP EOF、headless 无任务。</text>
  <text x="24" y="640" font-size="9.5" fill="#64748b">service/容器/反代是部署包装，见 60；不要自建第二层 launcher/桌面壳。</text>
</svg>
