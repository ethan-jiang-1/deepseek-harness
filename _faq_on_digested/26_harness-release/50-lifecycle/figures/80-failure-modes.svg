<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>失败模式：症状、原因、检查与修复</title>
  <desc>base-only Web、半挂载、整份 config 替换、app 参数失效、engines 不匹配、profile 重置、双写者、端口占用、skipped bundle 九种失败。</desc>

  <rect width="1200" height="800" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">失败模式：症状、原因、检查与修复</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">大多数“装好了但没用”都能归到状态层、config 层或 membership 层</text>

  <rect x="24" y="84" width="200" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">失败</text>
  <rect x="224" y="84" width="300" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="240" y="105" font-size="11" font-weight="700" fill="#3730a3">症状</text>
  <rect x="524" y="84" width="320" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="540" y="105" font-size="11" font-weight="700" fill="#3730a3">原因</text>
  <rect x="844" y="84" width="332" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="860" y="105" font-size="11" font-weight="700" fill="#3730a3">检查 / 修复</text>

  <g>
    <rect x="24" y="120" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="146" font-size="10" font-weight="700" fill="#1e40af">base-only Web</text>
    <text x="40" y="166" font-size="9.5" fill="#64748b">无页面/无端口</text>
    <text x="240" y="146" font-size="9.5" fill="#334155">dsh plugin 只初始化 base</text>
    <text x="240" y="166" font-size="9.5" fill="#64748b">没有 web-app row</text>
    <text x="540" y="146" font-size="9.5" fill="#334155">profile bundles 只有 base</text>
    <text x="860" y="146" font-size="9.5" fill="#334155">首次用 web 模板，或显式加 web-app</text>

    <rect x="24" y="190" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="216" font-size="10" font-weight="700" fill="#1e40af">半挂载</text>
    <text x="40" y="236" font-size="9.5" fill="#64748b">exit 0 但 roster 没有</text>
    <text x="240" y="216" font-size="9.5" fill="#334155">add 成功但没进 bundles</text>
    <text x="240" y="236" font-size="9.5" fill="#64748b">或运行中未重启</text>
    <text x="540" y="216" font-size="9.5" fill="#334155">package.json/bundles 读回</text>
    <text x="860" y="216" font-size="9.5" fill="#334155">重启 profile；检查 dsh.bundle.patch</text>

    <rect x="24" y="260" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="286" font-size="10" font-weight="700" fill="#1e40af">整份 config 替换</text>
    <text x="40" y="306" font-size="9.5" fill="#64748b">required plugin 失败</text>
    <text x="240" y="286" font-size="9.5" fill="#334155">patch 只写 port，host 丢失</text>
    <text x="240" y="306" font-size="9.5" fill="#64748b">config 不是字段合并</text>
    <text x="540" y="286" font-size="9.5" fill="#334155">看 ValidationError 的字段</text>
    <text x="860" y="286" font-size="9.5" fill="#334155">写全必填字段，或保留表达式</text>

    <rect x="24" y="330" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="356" font-size="10" font-weight="700" fill="#1e40af">app 参数失效</text>
    <text x="40" y="376" font-size="9.5" fill="#64748b">--port 0 仍监听 4133</text>
    <text x="240" y="356" font-size="9.5" fill="#334155">port 被写成字面值</text>
    <text x="240" y="376" font-size="9.5" fill="#64748b">row 不再读 ctx.webStartup</text>
    <text x="540" y="356" font-size="9.5" fill="#334155">dump config 看 port 是字面值</text>
    <text x="860" y="356" font-size="9.5" fill="#334155">保留 !!js 表达式，或不要传参数</text>

    <rect x="24" y="400" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="426" font-size="10" font-weight="700" fill="#1e40af">engines/peer 不匹配</text>
    <text x="40" y="446" font-size="9.5" fill="#64748b">install/boot 被拒</text>
    <text x="240" y="426" font-size="9.5" fill="#334155">bundle 声明的范围不含当前 dsh</text>
    <text x="240" y="446" font-size="9.5" fill="#64748b">或共享包版本冲突</text>
    <text x="540" y="426" font-size="9.5" fill="#334155">dsh --version + bundle manifest</text>
    <text x="860" y="426" font-size="9.5" fill="#334155">对齐版本；exemption 只作显式例外</text>

    <rect x="24" y="470" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="496" font-size="10" font-weight="700" fill="#1e40af">profile 被重置</text>
    <text x="40" y="516" font-size="9.5" fill="#64748b">依赖/patch 消失</text>
    <text x="240" y="496" font-size="9.5" fill="#334155">对已有 profile 用了 --from-default-profile</text>
    <text x="540" y="496" font-size="9.5" fill="#334155">profile 目录时间戳/staging/previous</text>
    <text x="860" y="496" font-size="9.5" fill="#334155">从备份恢复；首次之外不要重置</text>

    <rect x="24" y="540" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="566" font-size="10" font-weight="700" fill="#1e40af">双写者</text>
    <text x="40" y="586" font-size="9.5" fill="#64748b">状态漂移/锁冲突</text>
    <text x="240" y="566" font-size="9.5" fill="#334155">安装器与用户同时写 profile</text>
    <text x="240" y="586" font-size="9.5" fill="#64748b">或两个 updater</text>
    <text x="540" y="566" font-size="9.5" fill="#334155">检查 lock/进程/安装器日志</text>
    <text x="860" y="566" font-size="9.5" fill="#334155">单写者；走 dsh plugin/Plugin Manager</text>

    <rect x="24" y="610" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="636" font-size="10" font-weight="700" fill="#1e40af">端口占用</text>
    <text x="40" y="656" font-size="9.5" fill="#64748b">EADDRINUSE</text>
    <text x="240" y="636" font-size="9.5" fill="#334155">固定 3080/固定端口被占</text>
    <text x="540" y="636" font-size="9.5" fill="#334155">lsof/启动日志</text>
    <text x="860" y="636" font-size="9.5" fill="#334155">--port 0 或换端口；单实例</text>

    <rect x="24" y="680" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="706" font-size="10" font-weight="700" fill="#1e40af">skipped bundle</text>
    <text x="40" y="726" font-size="9.5" fill="#64748b">required 服务缺失</text>
    <text x="240" y="706" font-size="9.5" fill="#334155">某 bundle 加载/兼容失败被 skip</text>
    <text x="540" y="706" font-size="9.5" fill="#334155">启动报告 skippedBundles/诊断日志</text>
    <text x="860" y="706" font-size="9.5" fill="#334155">修 bundle 或移除；不要假设 skip 后仍可用</text>
  </g>

  <text x="24" y="772" font-size="9.5" fill="#64748b">C：CLI/app-boot/plugin-manager 合同；T：隔离 home 实验见 90。修复优先“读回状态”，不要靠猜。</text>
</svg>
