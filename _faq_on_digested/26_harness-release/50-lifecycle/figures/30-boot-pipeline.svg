<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>启动流水线：patch 层 → 解析 → Loader → 结果</title>
  <desc>bundle patch、profile patch、home patch、CLI overlay 合成树；bundle 解析先从 dsh 安装再从 profile；Loader 区分 required/optional/skipped bundle；dump 模式旁路。</desc>

  <rect width="1200" height="760" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">启动流水线：patch 层 → 解析 → Loader → 结果</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">组合是层叠的；解析有先后；失败分 required / optional / skipped bundle</text>

  <rect x="24" y="88" width="360" height="360" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="116" font-size="12" font-weight="700" fill="#1e40af">① patch 层</text>
  <text x="44" y="144" font-size="10" fill="#334155">bundle patches（按 bundles 顺序）</text>
  <text x="44" y="172" font-size="10" fill="#334155">profile cordis.patch.yml</text>
  <text x="44" y="200" font-size="10" fill="#334155">home $DSH_HOME/cordis.patch.yml</text>
  <text x="44" y="228" font-size="10" fill="#334155">CLI --patch（按 argv 顺序）</text>
  <text x="44" y="262" font-size="9.5" fill="#64748b">后层覆盖前层；row config 整份替换</text>
  <text x="44" y="286" font-size="9.5" fill="#64748b">HMR 监听 profile/home；membership 变化要重启</text>
  <text x="44" y="320" font-size="9.5" fill="#b45309">空 root 开始；不是增量合并</text>
  <text x="44" y="344" font-size="9.5" fill="#64748b">未命中 target 会在 stderr 报告</text>

  <rect x="420" y="88" width="330" height="360" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="440" y="116" font-size="12" font-weight="700" fill="#1e40af">② bundle 解析</text>
  <text x="440" y="144" font-size="10" fill="#334155">先从 dsh 安装解析 in-box bundle</text>
  <text x="440" y="172" font-size="10" fill="#334155">再从 profile node_modules 解析 out-of-tree</text>
  <text x="440" y="200" font-size="10" fill="#334155">profile 包保持 native 优先</text>
  <text x="440" y="228" font-size="10" fill="#334155">不做 fallback link</text>
  <text x="440" y="262" font-size="9.5" fill="#64748b">bundle 加载/兼容失败：skip 并报告</text>
  <text x="440" y="286" font-size="9.5" fill="#64748b">剩余 bundle 保持顺序</text>
  <text x="440" y="320" font-size="9.5" fill="#b45309">skip 不保证 required 服务仍存在</text>

  <rect x="786" y="88" width="390" height="360" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="806" y="116" font-size="12" font-weight="700" fill="#1e40af">③ Loader</text>
  <text x="806" y="144" font-size="10" fill="#334155">required plugin 失败 → 报告并 exit 1</text>
  <text x="806" y="172" font-size="10" fill="#334155">optional 失败 → 警告，继续</text>
  <text x="806" y="200" font-size="10" fill="#334155">bundle 失败 → skip，报告 skippedBundles</text>
  <text x="806" y="228" font-size="10" fill="#334155">profile/user patch 错误 → 直接失败</text>
  <text x="806" y="262" font-size="9.5" fill="#64748b">诊断写 $DSH_HOME/logs/startup-*.log</text>
  <text x="806" y="286" font-size="9.5" fill="#64748b">required 覆盖 agent-loop/webserver/web-runtime 等</text>
  <text x="806" y="320" font-size="9.5" fill="#b45309">Web 前端未 build → 启动失败</text>

  <rect x="24" y="480" width="1152" height="108" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="508" font-size="12" font-weight="700" fill="#3730a3">dump 旁路</text>
  <text x="44" y="534" font-size="10" fill="#334155">--dump-default-config：只看 bundle 层</text>
  <text x="44" y="556" font-size="10" fill="#334155">--dump-config：加 profile/home/CLI；注释标出每个 row 的来源</text>
  <text x="44" y="578" font-size="10" fill="#334155">--dump-config-schema：只看声明；不接受 app 参数</text>
  <text x="700" y="534" font-size="9.5" fill="#64748b">dump 初始化缺失 profile，</text>
  <text x="700" y="556" font-size="9.5" fill="#64748b">但不证明挂载/参数解析。</text>

  <path d="M 384 268 L 416 268" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 406 262 L 414 268 L 406 274" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 750 268 L 782 268" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 772 262 L 780 268 L 772 274" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <text x="24" y="628" font-size="9.5" fill="#64748b">C：CLI reference、app-boot、plugin-manager、web bundle；T：隔离 home 实验见 90。</text>
  <text x="24" y="648" font-size="9.5" fill="#64748b">启动顺序不是“装完就跑”：membership、patch、解析、Loader 是四个不同阶段。</text>
  <text x="24" y="668" font-size="9.5" fill="#64748b">required 失败看诊断；optional 失败看警告；skipped bundle 看缺失服务。</text>
</svg>
