<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>安装 → profile → 启动 → surface：谁拥有哪一层</title>
  <desc>一份 Harness 发行版的五层：运行时来源、profile、launcher、surface、设置与状态；每层有不同 owner。</desc>

  <rect width="1200" height="700" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">安装 → profile → 启动 → surface：谁拥有哪一层</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">装得上 ≠ 启动得了 ≠ 设置归你；每层都要有 owner</text>

  <!-- layer 1 -->
  <rect x="24" y="88" width="900" height="92" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="116" font-size="13" font-weight="700" fill="#1e40af">① 运行时从哪来</text>
  <text x="44" y="142" font-size="10" fill="#334155">npm 全局</text>
  <text x="180" y="142" font-size="10" fill="#334155">Desktop 内置</text>
  <text x="330" y="142" font-size="10" fill="#334155">Python wheel</text>
  <text x="470" y="142" font-size="10" fill="#334155">源码树</text>
  <text x="570" y="142" font-size="10" fill="#334155">容器镜像</text>
  <text x="44" y="164" font-size="9.5" fill="#64748b">决定版本、签名、更新、是否需要 Node</text>
  <rect x="944" y="88" width="232" height="92" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="960" y="116" font-size="10" font-weight="700" fill="#3730a3">owner</text>
  <text x="960" y="140" font-size="9.5" fill="#334155">DSH / Desktop / 发行方</text>
  <text x="960" y="160" font-size="9.5" fill="#64748b">谁提供运行时，谁管版本</text>

  <!-- layer 2 -->
  <rect x="24" y="200" width="900" height="92" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="228" font-size="13" font-weight="700" fill="#1e40af">② profile</text>
  <text x="44" y="254" font-size="10" fill="#334155">$DSH_HOME/profiles/&lt;name&gt;</text>
  <text x="330" y="254" font-size="10" fill="#334155">package.json + dsh.profile.bundles</text>
  <text x="44" y="276" font-size="9.5" fill="#64748b">bundle patch → profile patch → home patch → CLI --patch</text>
  <rect x="944" y="200" width="232" height="92" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="960" y="228" font-size="10" font-weight="700" fill="#3730a3">owner</text>
  <text x="960" y="252" font-size="9.5" fill="#334155">用户 / 发行方 / Desktop</text>
  <text x="960" y="272" font-size="9.5" fill="#64748b">只能有一个写者</text>

  <!-- layer 3 -->
  <rect x="24" y="312" width="900" height="92" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="340" font-size="13" font-weight="700" fill="#1e40af">③ launcher</text>
  <text x="44" y="366" font-size="10" fill="#334155">dsh --profile &lt;name&gt; / dsh web</text>
  <text x="330" y="366" font-size="10" fill="#334155">薄 bootstrap：设置环境，exec dsh</text>
  <text x="44" y="388" font-size="9.5" fill="#64748b">不要第二 launcher；发行方只提供 profile 与 bundle</text>
  <rect x="944" y="312" width="232" height="92" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="960" y="340" font-size="10" font-weight="700" fill="#3730a3">owner</text>
  <text x="960" y="364" font-size="9.5" fill="#334155">DSH</text>
  <text x="960" y="384" font-size="9.5" fill="#64748b">launcher 归 DSH，外层只是 bootstrap</text>

  <!-- layer 4 -->
  <rect x="24" y="424" width="900" height="92" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="452" font-size="13" font-weight="700" fill="#1e40af">④ surface</text>
  <text x="44" y="478" font-size="10" fill="#334155">web</text>
  <text x="120" y="478" font-size="10" fill="#334155">desktop</text>
  <text x="220" y="478" font-size="10" fill="#334155">headless</text>
  <text x="330" y="478" font-size="10" fill="#334155">sdk</text>
  <text x="400" y="478" font-size="10" fill="#334155">acp</text>
  <text x="470" y="478" font-size="10" fill="#334155">tui</text>
    <text x="44" y="500" font-size="9.5" fill="#64748b">每个面的参数、生命周期、产物、认证都不同</text>
  <rect x="944" y="424" width="232" height="92" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="960" y="452" font-size="10" font-weight="700" fill="#3730a3">owner</text>
  <text x="960" y="476" font-size="9.5" fill="#334155">surface / 发行方</text>
  <text x="960" y="496" font-size="9.5" fill="#64748b">shipped vs product-owned</text>

  <!-- layer 5 -->
  <rect x="24" y="536" width="900" height="92" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="564" font-size="13" font-weight="700" fill="#1e40af">⑤ 设置与状态</text>
  <text x="44" y="590" font-size="10" fill="#334155">bundle defaults → profile → home → CLI → env/args → client/shell</text>
  <text x="44" y="612" font-size="9.5" fill="#b45309">陷阱：整份 config 替换、字面值让 --port 失效</text>
  <rect x="944" y="536" width="232" height="92" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="960" y="564" font-size="10" font-weight="700" fill="#3730a3">owner</text>
  <text x="960" y="588" font-size="9.5" fill="#334155">按层分</text>
  <text x="960" y="608" font-size="9.5" fill="#64748b">用户 / 发行方 / 部署 / 浏览器</text>

  <!-- arrows -->
  <path d="M 474 180 L 474 196" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 468 188 L 474 198 L 480 188" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 474 292 L 474 308" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 468 300 L 474 310 L 480 300" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 474 404 L 474 420" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 468 412 L 474 422 L 480 412" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 474 516 L 474 532" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 468 524 L 474 534 L 480 524" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <text x="24" y="660" font-size="9.5" fill="#64748b">C：只有 named profile 是受支持启动；发行版脚本可以包外层，但不能绕过 dsh。</text>
  <text x="24" y="680" font-size="9.5" fill="#64748b">T：隔离 home 实验见 90；社区 profile 交付的安装样本见 34/36。</text>
</svg>
