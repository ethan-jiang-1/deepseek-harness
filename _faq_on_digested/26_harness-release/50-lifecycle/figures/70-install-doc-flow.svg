<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>安装说明的十段流程</title>
  <desc>从“这是什么/前置条件/选运行时”到“验证/配置/升级/卸载/故障排查”的十段安装文档骨架。</desc>

  <rect width="1200" height="720" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">安装说明的十段流程</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">先写清受支持路径与边界，再给命令；每段都要有预期结果</text>

  <g>
    <rect x="24" y="88" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="116" font-size="12" font-weight="700" fill="#1e40af">① 这是什么</text>
    <text x="44" y="140" font-size="9.5" fill="#334155">发行版名、app surface、适用范围、不做什么</text>
    <text x="44" y="160" font-size="9.5" fill="#64748b">先让用户判断“是不是我要的”</text>

    <rect x="616" y="88" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="636" y="116" font-size="12" font-weight="700" fill="#1e40af">② 前置条件</text>
    <text x="636" y="140" font-size="9.5" fill="#334155">OS/架构、Node/pnpm、磁盘/内存、网络、端口</text>
    <text x="636" y="160" font-size="9.5" fill="#64748b">凭据、权限、Desktop/容器要求</text>

    <rect x="24" y="196" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="224" font-size="12" font-weight="700" fill="#1e40af">③ 选运行时</text>
    <text x="44" y="248" font-size="9.5" fill="#334155">npm / Desktop / 容器 / wheel；各给最短命令</text>
    <text x="44" y="268" font-size="9.5" fill="#64748b">写清适用场景与不能混用的地方</text>

    <rect x="616" y="196" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="636" y="224" font-size="12" font-weight="700" fill="#1e40af">④ 安装</text>
    <text x="636" y="248" font-size="9.5" fill="#334155">一条命令；会创建/修改什么；预期输出</text>
    <text x="636" y="268" font-size="9.5" fill="#64748b">不要教用户手改 profile manifest</text>

    <rect x="24" y="304" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="332" font-size="12" font-weight="700" fill="#1e40af">⑤ 首次启动</text>
    <text x="44" y="356" font-size="9.5" fill="#334155">profile 名、端口、token URL、浏览器/SSH</text>
    <text x="44" y="376" font-size="9.5" fill="#64748b">Desktop 欢迎页/登录；容器端口</text>

    <rect x="616" y="304" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="636" y="332" font-size="12" font-weight="700" fill="#1e40af">⑥ 验证</text>
    <text x="636" y="356" font-size="9.5" fill="#334155">version、dump-config、roster、页面能聊天</text>
    <text x="636" y="376" font-size="9.5" fill="#64748b">失败时看哪里：日志/诊断/端口</text>

    <rect x="24" y="412" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="440" font-size="12" font-weight="700" fill="#1e40af">⑦ 配置</text>
    <text x="44" y="464" font-size="9.5" fill="#334155">设置页 vs profile patch vs env</text>
    <text x="44" y="484" font-size="9.5" fill="#64748b">端口/TLS/代理/trusted-host；凭据位置</text>

    <rect x="616" y="412" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="636" y="440" font-size="12" font-weight="700" fill="#1e40af">⑧ 升级</text>
    <text x="636" y="464" font-size="9.5" fill="#334155">停/备份/更新/重启；回退=重装旧版</text>
    <text x="636" y="484" font-size="9.5" fill="#64748b">bundle 变化要重启；Desktop 会 drain</text>

    <rect x="24" y="520" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="548" font-size="12" font-weight="700" fill="#1e40af">⑨ 卸载与数据</text>
    <text x="44" y="572" font-size="9.5" fill="#334155">删什么、留什么、$DSH_HOME 哪些共享</text>
    <text x="44" y="592" font-size="9.5" fill="#64748b">Desktop profile 保留规则</text>

    <rect x="616" y="520" width="560" height="96" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="636" y="548" font-size="12" font-weight="700" fill="#1e40af">⑩ 故障排查</text>
    <text x="636" y="572" font-size="9.5" fill="#334155">缺 build、engines、端口、浏览器、凭据、权限</text>
    <text x="636" y="592" font-size="9.5" fill="#64748b">给诊断命令和“下一步找谁”</text>
  </g>

  <rect x="24" y="636" width="1152" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="44" y="658" font-size="10" font-weight="700" fill="#b45309">必须写清的边界</text>
  <text x="150" y="658" font-size="9.5" fill="#334155">受支持路径只有 dsh profile；--from-default-profile 是重置；desktop 是保留名；远程不要 wildcard bind；token 不截图。</text>
  <text x="44" y="676" font-size="9.5" fill="#64748b">文档与发布物同版本；升级写“从哪个版本到哪个版本”，不写“最新版”。</text>
</svg>
