<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>四种运行时来源与容器部署</title>
  <desc>npm、Desktop、Python wheel、源码树四种 dsh 运行时来源，加上容器部署包装；profile 位置、更新 owner 与代价。</desc>

  <rect width="1200" height="680" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">四种运行时来源与容器部署</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">四种 runtime 来源 + 容器部署包装；同一套 profile 组合</text>

  <rect x="24" y="84" width="180" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">来源</text>
  <rect x="204" y="84" width="230" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="220" y="105" font-size="11" font-weight="700" fill="#3730a3">dsh 运行时</text>
  <rect x="434" y="84" width="250" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="450" y="105" font-size="11" font-weight="700" fill="#3730a3">profile</text>
  <rect x="684" y="84" width="200" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="700" y="105" font-size="11" font-weight="700" fill="#3730a3">更新 owner</text>
  <rect x="884" y="84" width="292" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="900" y="105" font-size="11" font-weight="700" fill="#3730a3">代价 / 边界</text>

  <g>
    <rect x="24" y="120" width="1152" height="88" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="150" font-size="11" font-weight="700" fill="#1e40af">npm 全局</text>
    <text x="40" y="172" font-size="9.5" fill="#64748b">用户已有 Node</text>
    <text x="220" y="150" font-size="10" fill="#334155">@deepseek-ai/dsh</text>
    <text x="220" y="172" font-size="9.5" fill="#64748b">npm 全局 bin</text>
    <text x="450" y="150" font-size="10" fill="#334155">$DSH_HOME/profiles/&lt;name&gt;</text>
    <text x="450" y="172" font-size="9.5" fill="#64748b">dsh plugin add</text>
    <text x="700" y="150" font-size="10" fill="#334155">用户 / 发行版 updater</text>
    <text x="700" y="172" font-size="9.5" fill="#64748b">npm</text>
    <text x="900" y="150" font-size="9.5" fill="#334155">全局版本漂移、多副本、PATH</text>
    <text x="900" y="172" font-size="9.5" fill="#64748b">最接近默认路径</text>

    <rect x="24" y="216" width="1152" height="88" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="246" font-size="11" font-weight="700" fill="#1e40af">Desktop</text>
    <text x="40" y="268" font-size="9.5" fill="#64748b">官方安装包</text>
    <text x="220" y="246" font-size="10" fill="#334155">resources/app.asar/dsh</text>
    <text x="220" y="268" font-size="9.5" fill="#64748b">应用内置</text>
    <text x="450" y="246" font-size="10" fill="#334155">profiles/desktop</text>
    <text x="450" y="268" font-size="9.5" fill="#64748b">Electron 独占</text>
    <text x="700" y="246" font-size="10" fill="#334155">Desktop feed</text>
    <text x="700" y="268" font-size="9.5" fill="#64748b">签名安装器</text>
    <text x="900" y="246" font-size="9.5" fill="#334155">CLI 不能 boot；不能换 dsh 版本</text>
    <text x="900" y="268" font-size="9.5" fill="#64748b">单实例、OS 端口、更新 drain</text>

    <rect x="24" y="312" width="1152" height="88" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="342" font-size="11" font-weight="700" fill="#1e40af">Python wheel</text>
    <text x="40" y="364" font-size="9.5" fill="#64748b">SDK/ACP 客户端</text>
    <text x="220" y="342" font-size="10" fill="#334155">wheel 内置 dsh CLI</text>
    <text x="220" y="364" font-size="9.5" fill="#64748b">runtime-&lt;platform&gt;-&lt;arch&gt;</text>
    <text x="450" y="342" font-size="10" fill="#334155">显式 DSH_HOME</text>
    <text x="450" y="364" font-size="9.5" fill="#64748b">sdk / sdk-minimal</text>
    <text x="700" y="342" font-size="10" fill="#334155">Python 包</text>
    <text x="700" y="364" font-size="9.5" fill="#64748b">发行方/用户</text>
    <text x="900" y="342" font-size="9.5" fill="#334155">以 stdio 为主，不是 Web 发行版</text>
    <text x="900" y="364" font-size="9.5" fill="#64748b">同一 launcher，显式 home</text>

    <rect x="24" y="408" width="1152" height="88" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="438" font-size="11" font-weight="700" fill="#1e40af">源码树</text>
    <text x="40" y="460" font-size="9.5" fill="#64748b">开发/自部署</text>
    <text x="220" y="438" font-size="10" fill="#334155">pnpm dsh（tsx）</text>
    <text x="220" y="460" font-size="9.5" fill="#64748b">需要 build</text>
    <text x="450" y="438" font-size="10" fill="#334155">同一个 home</text>
    <text x="450" y="460" font-size="9.5" fill="#64748b">linked resolution</text>
    <text x="700" y="438" font-size="10" fill="#334155">开发者/发行方</text>
    <text x="700" y="460" font-size="9.5" fill="#64748b">build / git pull</text>
    <text x="900" y="438" font-size="9.5" fill="#334155">缺 host/前端产物会启动失败</text>
    <text x="900" y="460" font-size="9.5" fill="#64748b">旧 bundle 可能跑旧前端</text>

    <rect x="24" y="504" width="1152" height="88" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="534" font-size="11" font-weight="700" fill="#1e40af">容器部署</text>
    <text x="40" y="556" font-size="9.5" fill="#64748b">托管/内网</text>
    <text x="220" y="534" font-size="10" fill="#334155">镜像内 dsh（包装）</text>
    <text x="220" y="556" font-size="9.5" fill="#64748b">固定版本</text>
    <text x="450" y="534" font-size="10" fill="#334155">镜像内/挂载 home</text>
    <text x="450" y="556" font-size="9.5" fill="#64748b">数据卷</text>
    <text x="700" y="534" font-size="10" fill="#334155">镜像发布</text>
    <text x="700" y="556" font-size="9.5" fill="#64748b">滚动升级</text>
    <text x="900" y="534" font-size="9.5" fill="#334155">具体 IP + 反代 + TLS + trusted-host</text>
    <text x="900" y="556" font-size="9.5" fill="#64748b">wildcard bind 被拒；token 仍是认证</text>
  </g>

  <text x="24" y="628" font-size="9.5" fill="#64748b">四种 runtime + 容器部署共用同一套 profile 组合与 launcher；不要把“换运行环境”误当成“换产品架构”。</text>
  <text x="24" y="648" font-size="9.5" fill="#64748b">C：CLI/Desktop/app-boot 文档；T：隔离 home 实验见 90。</text>
</svg>
