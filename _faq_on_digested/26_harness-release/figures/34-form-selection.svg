<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>选形态：先看交付意图</title>
  <desc>八种 profile 产品形态按交付意图选择：多个自有插件、重做交互、重做观感、替换宿主、进口套件、一条闭环；每种给出判据和要先想清楚的状态。</desc>

  <rect width="1200" height="600" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">选形态：先看交付意图</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">八种形态不是八种技术，是八种产品承诺；先选意图，再设计状态</text>

  <rect x="24" y="84" width="276" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">交付意图</text>
  <rect x="300" y="84" width="340" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="316" y="105" font-size="11" font-weight="700" fill="#3730a3">形态</text>
  <rect x="640" y="84" width="260" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="656" y="105" font-size="11" font-weight="700" fill="#3730a3">判据</text>
  <rect x="900" y="84" width="276" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="916" y="105" font-size="11" font-weight="700" fill="#3730a3">先想清楚的状态</text>

  <g>
    <rect x="24" y="120" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="146" font-size="11" font-weight="700" fill="#1e40af">多个自有插件装成一件</text>
    <text x="40" y="166" font-size="9.5" fill="#64748b">成套交付，但形态不同</text>
    <text x="316" y="146" font-size="10" fill="#334155">全家桶 / 组合包 / 聚合补丁</text>
    <text x="316" y="166" font-size="9.5" fill="#64748b">自研广度 / 策展默认 / 最小装配</text>
    <text x="656" y="156" font-size="9.5" fill="#334155">自研包数、共享默认、版本策略</text>
    <text x="916" y="146" font-size="9.5" fill="#334155">四层状态、row namespace、</text>
    <text x="916" y="166" font-size="9.5" fill="#334155">重复安装冲突、退役出口</text>

    <rect x="24" y="186" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="212" font-size="11" font-weight="700" fill="#1e40af">重做交互</text>
    <text x="40" y="232" font-size="9.5" fill="#64748b">布局、侧栏、设置形态</text>
    <text x="316" y="212" font-size="10" fill="#334155">界面套件</text>
    <text x="316" y="232" font-size="9.5" fill="#64748b">单包多 rows，不改宿主行</text>
    <text x="656" y="222" font-size="9.5" fill="#334155">每 row 的探活/激活/清理</text>
    <text x="916" y="212" font-size="9.5" fill="#334155">禁用≠零残留；DOM 耦合；</text>
    <text x="916" y="232" font-size="9.5" fill="#334155">真实 host teardown</text>

    <rect x="24" y="252" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="278" font-size="11" font-weight="700" fill="#1e40af">重做观感</text>
    <text x="40" y="298" font-size="9.5" fill="#64748b">背景、玻璃、字体、吉祥物</text>
    <text x="316" y="278" font-size="10" fill="#334155">视觉资产</text>
    <text x="316" y="298" font-size="9.5" fill="#64748b">预设 + 可选资产</text>
    <text x="656" y="288" font-size="9.5" fill="#334155">格式准入、资源预算、预设 schema</text>
    <text x="916" y="278" font-size="9.5" fill="#334155">旧 schema 作废；零模型注册；</text>
    <text x="916" y="298" font-size="9.5" fill="#334155">资产与设置分开</text>

    <rect x="24" y="318" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="344" font-size="11" font-weight="700" fill="#1e40af">替换宿主内置</text>
    <text x="40" y="364" font-size="9.5" fill="#64748b">按 preset 换掉发现规则</text>
    <text x="316" y="344" font-size="10" fill="#334155">接管套件</text>
    <text x="316" y="364" font-size="9.5" fill="#64748b">owner-aware 覆盖</text>
    <text x="656" y="354" font-size="9.5" fill="#334155">target/scope/diff，只回滚自有行</text>
    <text x="916" y="344" font-size="9.5" fill="#334155">unset vs 显式默认；foreign edit；</text>
    <text x="916" y="364" font-size="9.5" fill="#334155">迁移幂等；session 快照</text>

    <rect x="24" y="384" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="410" font-size="11" font-weight="700" fill="#1e40af">进口别人的套件</text>
    <text x="40" y="430" font-size="9.5" fill="#64748b">把外部 suite 当分发单位</text>
    <text x="316" y="410" font-size="10" fill="#334155">套件市场</text>
    <text x="316" y="430" font-size="9.5" fill="#64748b">source / install / filter 分层</text>
    <text x="656" y="420" font-size="9.5" fill="#334155">lockCommit、失败粒度、删除所有权</text>
    <text x="916" y="410" font-size="9.5" fill="#334155">refresh ≠ 冻结；凭据状态机；</text>
    <text x="916" y="430" font-size="9.5" fill="#334155">dry-run ≠ sandbox</text>

    <rect x="24" y="450" width="1152" height="62" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="476" font-size="11" font-weight="700" fill="#1e40af">一条用户闭环</text>
    <text x="40" y="496" font-size="9.5" fill="#64748b">装完就能做完一件事</text>
    <text x="316" y="476" font-size="10" fill="#334155">闭环装配</text>
    <text x="316" y="496" font-size="9.5" fill="#64748b">依赖 + rows + 默认</text>
    <text x="656" y="486" font-size="9.5" fill="#334155">bundle 边界 = 一条闭环</text>
    <text x="916" y="476" font-size="9.5" fill="#334155">bundle 默认 vs effective；</text>
    <text x="916" y="496" font-size="9.5" fill="#334155">状态转换与外部副作用</text>
  </g>

  <text x="24" y="546" font-size="9.5" fill="#64748b">先选意图，再看 35 篇的四层状态与所有权；证据与未验证项见 36 篇。</text>
  <text x="24" y="566" font-size="9.5" fill="#64748b">样本固定版本见 34 篇“样本与来源”；README 主张与源码复核分开标注。</text>
</svg>
