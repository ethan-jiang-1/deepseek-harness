<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>五个家与一个只读层：内容、历史、状态、派生、客户端</title>
  <desc>内容家是用户拥有的工作区与用户全局文件；历史家是模型可见的会话日志；状态家是插件拥有的宿主域、配置与凭据；派生家是可重建的投影与索引；客户端家是浏览器 localStorage 或桌面 userData。只读层是随包发布、升级即替换的资源，不是用户数据。每个家有自己的权威、位置、可见性与生命周期。</desc>

  <rect width="1200" height="760" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">五个家，一个只读层</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">同一份事实只能有一个家；其他家只能存引用、哈希或可重建副本</text>

  <!-- 内容 -->
  <rect x="24" y="84" width="220" height="470" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="134" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">① 内容</text>
  <text x="134" y="132" text-anchor="middle" font-size="11" fill="#1e3a8a">用户拥有的字节</text>
  <line x1="44" y1="146" x2="224" y2="146" stroke="#bfdbfe"/>
  <text x="44" y="170" font-size="11" font-weight="700" fill="#1e40af">权威</text>
  <text x="44" y="190" fill="#334155">工作区 / 用户全局文件</text>
  <text x="44" y="208" fill="#64748b" font-size="10.5">DSH 不拥有、不代管</text>
  <text x="44" y="236" font-size="11" font-weight="700" fill="#1e40af">怎么碰</text>
  <text x="44" y="256" fill="#334155">ctx.fs.resolve / read / write</text>
  <text x="44" y="274" fill="#64748b" font-size="10.5">守卫：版本 CAS；不传即覆盖</text>
  <text x="44" y="302" font-size="11" font-weight="700" fill="#1e40af">可见性</text>
  <text x="44" y="322" fill="#334155">用户直接打开；模型经工具读</text>
  <text x="44" y="350" font-size="11" font-weight="700" fill="#1e40af">寿命</text>
  <text x="44" y="370" fill="#334155">跟目录/仓库；用户删就没了</text>
  <text x="44" y="398" font-size="11" font-weight="700" fill="#1e40af">典型</text>
  <rect x="44" y="410" width="180" height="66" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="56" y="432" font-size="10.5" fill="#1e3a8a">报告、代码、图片、AGENTS.md</text>
  <text x="56" y="452" font-size="10.5" fill="#1e3a8a">用户会编辑、提交、带走</text>
  <text x="56" y="470" font-size="10.5" fill="#1e3a8a">插件只写，不据为己有</text>
  <text x="44" y="506" fill="#1e40af" font-size="10.5">交付：present（路径引用）</text>
  <text x="44" y="526" fill="#991b1b" font-size="10.5">不要抄进 home 当真相</text>

  <!-- 历史 -->
  <rect x="254" y="84" width="220" height="470" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="364" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">② 历史</text>
  <text x="364" y="132" text-anchor="middle" font-size="11" fill="#14532d">这次对话发生过什么</text>
  <line x1="274" y1="146" x2="454" y2="146" stroke="#bbf7d0"/>
  <text x="274" y="170" font-size="11" font-weight="700" fill="#166534">权威</text>
  <text x="274" y="190" fill="#334155">会话日志（每会话一份）</text>
  <text x="274" y="208" fill="#64748b" font-size="10.5">$DSH_HOME/sessions/…</text>
  <text x="274" y="236" font-size="11" font-weight="700" fill="#166534">怎么碰</text>
  <text x="274" y="256" fill="#334155">已有事件 / 消费者渲染</text>
  <text x="274" y="274" fill="#64748b" font-size="10.5">派生值：sessionProjections</text>
  <text x="274" y="302" font-size="11" font-weight="700" fill="#166534">可见性</text>
  <text x="274" y="322" fill="#334155">模型可见 ⟺ 已记录</text>
  <text x="274" y="340" fill="#64748b" font-size="10.5">第三方不要新增事件类型</text>
  <text x="274" y="368" font-size="11" font-weight="700" fill="#166534">寿命</text>
  <text x="274" y="388" fill="#334155">跟会话；归档隐藏，不删除</text>
  <text x="274" y="416" font-size="11" font-weight="700" fill="#166534">典型</text>
  <rect x="274" y="428" width="180" height="66" rx="7" fill="#dcfce7" stroke="#4ade80"/>
  <text x="286" y="450" font-size="10.5" fill="#166534">用户消息、模型输出、工具结果</text>
  <text x="286" y="470" font-size="10.5" fill="#166534">标题、待办、沙箱模式等投影</text>
  <text x="286" y="488" font-size="10.5" fill="#166534">附件只存引用，不存字节</text>
  <text x="274" y="524" fill="#166534" font-size="10.5">默认 zstd 帧；</text>
  <text x="274" y="542" fill="#166534" font-size="10.5">compression:none 才是 JSONL</text>


  <!-- 状态 -->
  <rect x="484" y="84" width="220" height="470" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="594" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">③ 状态</text>
  <text x="594" y="132" text-anchor="middle" font-size="11" fill="#78350f">插件拥有的账本</text>
  <line x1="504" y1="146" x2="684" y2="146" stroke="#fde68a"/>
  <text x="504" y="170" font-size="11" font-weight="700" fill="#92400e">权威</text>
  <text x="504" y="190" fill="#334155">domain / Config / credentials</text>
  <text x="504" y="208" fill="#64748b" font-size="10.5">storages / profiles / .credentials</text>
  <text x="504" y="236" font-size="11" font-weight="700" fill="#92400e">怎么碰</text>
  <text x="504" y="256" fill="#334155">storageDomain.open(spec)</text>
  <text x="504" y="274" fill="#64748b" font-size="10.5">Config.volatile() → settings 表单</text>
  <text x="504" y="292" fill="#64748b" font-size="10.5">credentials 引用/记录</text>
  <text x="504" y="320" font-size="11" font-weight="700" fill="#92400e">可见性</text>
  <text x="504" y="340" fill="#334155">模型不可见（除非你渲染）</text>
  <text x="504" y="368" font-size="11" font-weight="700" fill="#92400e">寿命</text>
  <text x="504" y="388" fill="#334155">跟 $DSH_HOME / profile</text>
  <text x="504" y="406" fill="#64748b" font-size="10.5">换 home 或 profile 就没了</text>
  <text x="504" y="434" font-size="11" font-weight="700" fill="#92400e">典型</text>
  <rect x="504" y="446" width="180" height="56" rx="7" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="516" y="468" font-size="10.5" fill="#78350f">项目索引、游标、学到的事实</text>
  <text x="516" y="488" font-size="10.5" fill="#78350f">偏好、默认模型、API key 引用</text>
  <text x="504" y="524" fill="#92400e" font-size="10.5">schema + version 自己管</text>
  <text x="504" y="544" fill="#64748b" font-size="10.5">无自动迁移、无跨进程事件</text>

  <!-- 派生 -->
  <rect x="714" y="84" width="220" height="470" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="824" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">④ 派生</text>
  <text x="824" y="132" text-anchor="middle" font-size="11" fill="#475569">可以丢的加速层</text>
  <line x1="734" y1="146" x2="914" y2="146" stroke="#e2e8f0"/>
  <text x="734" y="170" font-size="11" font-weight="700" fill="#334155">权威</text>
  <text x="734" y="190" fill="#334155">没有；从上面几家算出来</text>
  <text x="734" y="208" fill="#64748b" font-size="10.5">丢了能重算，才叫派生</text>
  <text x="734" y="236" font-size="11" font-weight="700" fill="#334155">怎么碰</text>
  <text x="734" y="256" fill="#334155">projections / sessionQuery</text>
  <text x="734" y="274" fill="#64748b" font-size="10.5">projection cache / 索引 / 向量</text>
  <text x="734" y="302" font-size="11" font-weight="700" fill="#334155">可见性</text>
  <text x="734" y="322" fill="#334155">间接（渲染或查询时）</text>
  <text x="734" y="350" font-size="11" font-weight="700" fill="#334155">寿命</text>
  <text x="734" y="370" fill="#334155">随时可丢；重建成本要可接受</text>
  <text x="734" y="398" font-size="11" font-weight="700" fill="#334155">典型</text>
  <rect x="734" y="410" width="180" height="66" rx="7" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="746" y="432" font-size="10.5" fill="#334155">文件索引、向量、摘要、统计</text>
  <text x="746" y="452" font-size="10.5" fill="#334155">标题/待办/沙箱模式投影</text>
  <text x="746" y="470" font-size="10.5" fill="#334155">搜索索引、检查点</text>
  <text x="734" y="506" fill="#334155" font-size="10.5">判断：删掉它，用户会丢东西吗？</text>
  <text x="734" y="526" fill="#64748b" font-size="10.5">会 → 不是派生；不会 → 放这里</text>

  <!-- 客户端 -->
  <rect x="944" y="84" width="220" height="470" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1054" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">⑤ 客户端</text>
  <text x="1054" y="132" text-anchor="middle" font-size="11" fill="#4c1d95">设备本地的 UI 状态</text>
  <line x1="964" y1="146" x2="1144" y2="146" stroke="#ddd6fe"/>
  <text x="964" y="170" font-size="11" font-weight="700" fill="#5b21b6">权威</text>
  <text x="964" y="190" fill="#334155">浏览器 / 设备</text>
  <text x="964" y="208" fill="#64748b" font-size="10.5">按源（origin）或设备隔离</text>
  <text x="964" y="236" font-size="11" font-weight="700" fill="#5b21b6">怎么碰</text>
  <text x="964" y="256" fill="#334155">localStorage / userData</text>
  <text x="964" y="274" fill="#64748b" font-size="10.5">没有统一的 DSH 服务</text>
  <text x="964" y="302" font-size="11" font-weight="700" fill="#5b21b6">可见性</text>
  <text x="964" y="322" fill="#334155">用户/浏览器；Host 看不到</text>
  <text x="964" y="350" font-size="11" font-weight="700" fill="#5b21b6">寿命</text>
  <text x="964" y="370" fill="#334155">跟浏览器配置；卸载不自动清</text>
  <text x="964" y="398" font-size="11" font-weight="700" fill="#5b21b6">典型</text>
  <rect x="964" y="410" width="180" height="66" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="976" y="432" font-size="10.5" fill="#4c1d95">面板宽度、折叠状态</text>
  <text x="976" y="452" font-size="10.5" fill="#4c1d95">快捷键、最近时区/选择</text>
  <text x="976" y="470" font-size="10.5" fill="#4c1d95">按 session 键的 UI 草稿</text>
  <text x="964" y="506" fill="#5b21b6" font-size="10.5">换端口/浏览器就没了</text>
  <text x="964" y="526" fill="#991b1b" font-size="10.5">不要当共享状态或身份</text>

  <!-- read-only layer -->
  <rect x="24" y="572" width="1140" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="596" font-size="12" font-weight="700" fill="#334155">只读层：随包发布的提示词、技能、preset、工具定义、图标</text>
  <text x="44" y="618" fill="#334155" font-size="10.5">运行时只读；版本化交给 npm，升级整体替换。它不是用户数据：不要写包目录，不要把可变状态放进 import.meta.url 旁边。</text>

  <!-- footer -->
  <rect x="24" y="650" width="1140" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="674" font-size="12" font-weight="700" fill="#334155">跨家只存引用</text>
  <text x="44" y="696" fill="#334155" font-size="10.5">内容 → 历史：事件记录文件路径或附件引用；内容 → 状态：索引只存路径 + 哈希；历史 → 派生：投影从事件 fold，不反向写；状态 → 派生：缓存可重建，绝不回写权威。</text>
  <text x="44" y="718" fill="#64748b" font-size="10.5">判断顺序：先问“用户有没有 / 能不能重算”，再问“跟项目还是跟人”，最后才问“用哪个 API”。</text>
</svg>
