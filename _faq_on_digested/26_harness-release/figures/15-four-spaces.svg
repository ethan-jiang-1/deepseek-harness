<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>四类产品资产</title>
  <desc>产品资产分为发布 bundle、用户项目目录、产品状态和产品设置。DSH Workspace 只登记目录供 Host 导航与 Session 分组，不拥有目录或授权模型文件操作。</desc>
  <rect width="1200" height="370" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">四类资产按 owner 分开</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">bundle 是发布输入；用户内容、产品状态与产品设置各有不同生命周期</text>

  <rect x="28" y="82" width="270" height="198" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="112" font-size="13" font-weight="700" fill="#1e40af">发布 bundle</text>
  <text x="48" y="145" font-size="10.5" fill="#334155">默认 patch、preset、模板、Client 代码</text>
  <text x="48" y="176" font-size="10" font-weight="700" fill="#1e40af">Owner</text>
  <text x="48" y="196" font-size="10.5" fill="#334155">package 发布版本</text>
  <text x="48" y="231" font-size="10" font-weight="700" fill="#1e40af">生命周期</text>
  <text x="48" y="251" font-size="10.5" fill="#334155">bundle 升级替换发布资产</text>

  <rect x="318" y="82" width="270" height="198" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="338" y="112" font-size="13" font-weight="700" fill="#166534">用户项目目录</text>
  <text x="338" y="145" font-size="10.5" fill="#334155">项目文件、用户可编辑内容</text>
  <text x="338" y="176" font-size="10" font-weight="700" fill="#166534">Owner</text>
  <text x="338" y="196" font-size="10.5" fill="#334155">用户</text>
  <text x="338" y="231" font-size="10" font-weight="700" fill="#166534">访问方式</text>
  <text x="338" y="251" font-size="10.5" fill="#334155">产品工具或获准的模型工具</text>

  <rect x="608" y="82" width="270" height="198" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="628" y="112" font-size="13" font-weight="700" fill="#6b21a8">产品状态</text>
  <text x="628" y="145" font-size="10.5" fill="#334155">绑定、游标、索引与业务状态</text>
  <text x="628" y="176" font-size="10" font-weight="700" fill="#6b21a8">Owner</text>
  <text x="628" y="196" font-size="10.5" fill="#334155">产品 plugin</text>
  <text x="628" y="231" font-size="10" font-weight="700" fill="#6b21a8">位置</text>
  <text x="628" y="251" font-size="10.5" fill="#334155">storage domain 或产品自建存储</text>

  <rect x="898" y="82" width="274" height="198" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="918" y="112" font-size="13" font-weight="700" fill="#9f1239">产品设置</text>
  <text x="918" y="145" font-size="10.5" fill="#334155">运行选项与用户偏好</text>
  <text x="918" y="176" font-size="10" font-weight="700" fill="#9f1239">Scope</text>
  <text x="918" y="196" font-size="10.5" fill="#334155">当前 profile 或产品共享存储</text>
  <text x="918" y="231" font-size="10" font-weight="700" fill="#9f1239">注意</text>
  <text x="918" y="251" font-size="10.5" fill="#334155">profile-local 与 home-shared 不同</text>

  <rect x="28" y="300" width="1144" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="327" font-size="10.5" font-weight="700" fill="#334155">DSH Workspace 另是一条 Host 目录登记：用于导航与 Session 分组，不拥有目录，也不授予模型文件权限。</text>
</svg>
