<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>profile 装配：四层状态与所有权</title>
  <desc>包已安装、bundle 在 roster、row 存在、effective config 四层状态各有 owner、读回方式和失败模式；右侧是身份、更新、接管、进口、资产五个所有权问题。</desc>

  <rect width="1200" height="760" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">profile 装配：四层状态与所有权</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">装成功 ≠ 挂载成功；每层有不同 owner、读回方式和失败模式</text>

  <!-- left: four layers -->
  <text x="24" y="90" font-size="13" font-weight="700" fill="#334155">四层装配状态（从上到下读回）</text>

  <rect x="24" y="106" width="736" height="112" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="134" font-size="12" font-weight="700" fill="#1e40af">① 包已安装</text>
  <text x="44" y="158" font-size="9.5" fill="#64748b">owner：package manager（dependencies / lockfile）</text>
  <text x="44" y="180" font-size="9.5" fill="#334155">读回：版本、node_modules、lock</text>
  <text x="44" y="202" font-size="9.5" fill="#b45309">失败：解析成功，但没进 profile roster</text>

  <rect x="24" y="236" width="736" height="112" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="264" font-size="12" font-weight="700" fill="#1e40af">② bundle 在 roster</text>
  <text x="44" y="288" font-size="9.5" fill="#64748b">owner：profile 的 dsh.profile.bundles 有序列表</text>
  <text x="44" y="310" font-size="9.5" fill="#334155">读回：profile 目录、启动 dump</text>
  <text x="44" y="332" font-size="9.5" fill="#b45309">失败：exit 0，roster 为空</text>

  <rect x="24" y="366" width="736" height="112" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="394" font-size="12" font-weight="700" fill="#1e40af">③ row 存在</text>
  <text x="44" y="418" font-size="9.5" fill="#64748b">owner：bundle patch 的 insert / override / disabled</text>
  <text x="44" y="440" font-size="9.5" fill="#334155">读回：patch fold、row id 清单</text>
  <text x="44" y="462" font-size="9.5" fill="#b45309">失败：row 在，但 disabled: true</text>

  <rect x="24" y="496" width="736" height="112" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="44" y="524" font-size="12" font-weight="700" fill="#1e40af">④ effective enabled/config</text>
  <text x="44" y="548" font-size="9.5" fill="#64748b">owner：profile / home / CLI patch 的最高层</text>
  <text x="44" y="570" font-size="9.5" fill="#334155">读回：effective config dump</text>
  <text x="44" y="592" font-size="9.5" fill="#b45309">失败：默认值被覆盖，数据落点变了</text>

  <!-- down arrow -->

  <!-- right: ownership questions -->
  <text x="792" y="90" font-size="13" font-weight="700" fill="#334155">五个所有权问题</text>

  <rect x="784" y="106" width="392" height="96" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="804" y="134" font-size="12" font-weight="700" fill="#1e40af">身份</text>
  <text x="804" y="158" font-size="9.5" fill="#334155">row id / namespace / 重复安装</text>
  <text x="804" y="180" font-size="9.5" fill="#334155">tombstone 与退役过渡</text>

  <rect x="784" y="214" width="392" height="96" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="804" y="242" font-size="12" font-weight="700" fill="#1e40af">更新</text>
  <text x="804" y="266" font-size="9.5" fill="#334155">per-profile state / consent / idle 门</text>
  <text x="804" y="288" font-size="9.5" fill="#334155">补偿恢复与 crash window</text>

  <rect x="784" y="322" width="392" height="96" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="804" y="350" font-size="12" font-weight="700" fill="#1e40af">接管</text>
  <text x="804" y="374" font-size="9.5" fill="#334155">preset scope / unset / foreign edit</text>
  <text x="804" y="396" font-size="9.5" fill="#334155">只回滚自有行</text>

  <rect x="784" y="430" width="392" height="96" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="804" y="458" font-size="12" font-weight="700" fill="#1e40af">进口</text>
  <text x="804" y="482" font-size="9.5" fill="#334155">source / install / workspace filter</text>
  <text x="804" y="504" font-size="9.5" fill="#334155">lockCommit ≠ 内容冻结</text>

  <rect x="784" y="538" width="392" height="96" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="804" y="566" font-size="12" font-weight="700" fill="#1e40af">资产</text>
  <text x="804" y="590" font-size="9.5" fill="#334155">preset schema / absent·null 语义</text>
  <text x="804" y="612" font-size="9.5" fill="#334155">obsolete 不迁移 / 零模型注册</text>

  <text x="24" y="660" font-size="9.5" fill="#64748b">口径：8 个样本在 2026-10-31 固定版本复核（源码/测试/CI 已读，未安装、未运行）；README 主张单独标注。</text>
  <text x="24" y="680" font-size="9.5" fill="#64748b">四层状态必须分别读回，不能只看 CLI exit code；身份、更新、接管、进口与资产各有独立 owner。</text>
  <text x="24" y="700" font-size="9.5" fill="#64748b">样本：dsh-web、codex-ui、dsh-suite、dsh-all、plugins-plus、agent-plugins-market、better-session、wallpaper-engine。</text>
</svg>
