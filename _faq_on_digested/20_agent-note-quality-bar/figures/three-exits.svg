<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>该不该写 Agent Note：三个出口</title>
  <desc>从一个改动出发有三个出口。出口一不用写：改动没有产生新决定，包括局部 UI 呈现与机械编辑，理由进 PR 描述、行为由测试钉住。出口二更新已有 Note：决定已存在只是事实要跟上，例如路径、包名、默认值或 key 变化。出口三写一篇：出现了新的取舍，未来维护者可能踩错而代码、测试与现有文档都装不下它。入口处的判据是这次改动有没有产生新决定。</desc>
  <defs>
    <marker id="a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#15803d"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">该不该写一篇：三个出口</text>
  <text x="600" y="60" text-anchor="middle" fill="#64748b">唯一的问题不是「改动大不大、是不是 bug」，而是：这次改动有没有产生一个新决定？</text>

  <rect x="40" y="82" width="1120" height="52" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="600" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">你的改动　→　它是否产生了一个新的决定？</text>

  <line x1="600" y1="134" x2="600" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <line x1="230" y1="166" x2="230" y2="206" stroke="#15803d" stroke-width="2" marker-end="url(#aGreen)"/>
  <line x1="600" y1="166" x2="600" y2="206" stroke="#1d4ed8" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="970" y1="166" x2="970" y2="206" stroke="#b45309" stroke-width="2" marker-end="url(#aAmber)"/>
  <line x1="40" y1="160" x2="1160" y2="160" stroke="#cbd5e1" stroke-width="2"/>

  <text x="230" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">没有新决定（多数情况）</text>
  <text x="600" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">决定已有，只是事实过期</text>
  <text x="970" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">出现了新的取舍</text>

  <rect x="40" y="212" width="380" height="196" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="230" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">① 不用写</text>
  <text x="230" y="268" text-anchor="middle" fill="#334155">修的是既有决定覆盖下的缺陷、</text>
  <text x="230" y="288" text-anchor="middle" fill="#334155">文案、机械重构、局部 UI 呈现</text>
  <text x="230" y="318" text-anchor="middle" fill="#475569">理由进 PR 描述</text>
  <text x="230" y="338" text-anchor="middle" fill="#475569">行为由测试 / snapshot 钉住</text>
  <rect x="60" y="356" width="340" height="40" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="230" y="381" text-anchor="middle" font-size="11" fill="#166534">实例：PR #5004 改了模型列表呈现，未新增 Note</text>

  <rect x="450" y="212" width="300" height="196" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">② 更新已有 Note</text>
  <text x="600" y="268" text-anchor="middle" fill="#334155">决定本身没变，</text>
  <text x="600" y="288" text-anchor="middle" fill="#334155">只是事实要跟上：</text>
  <text x="600" y="316" text-anchor="middle" fill="#475569">路径、包名、默认值、key</text>
  <text x="600" y="336" text-anchor="middle" fill="#475569">改事实，不新建</text>
  <rect x="470" y="356" width="260" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="600" y="381" text-anchor="middle" font-size="11" fill="#1e40af">重复 Note 是明确禁止的</text>

  <rect x="780" y="212" width="380" height="196" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="970" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">③ 写一篇</text>
  <text x="970" y="268" text-anchor="middle" fill="#334155">说得出「未来谁会踩什么错」</text>
  <text x="970" y="288" text-anchor="middle" fill="#334155">而代码、测试、文档都装不下</text>
  <text x="970" y="318" text-anchor="middle" fill="#475569">进 proposed/ 或 implemented/</text>
  <text x="970" y="338" text-anchor="middle" fill="#475569">并在同 PR 做 supersession 检查</text>
  <rect x="800" y="356" width="340" height="40" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="970" y="381" text-anchor="middle" font-size="11" fill="#92400e">实例：重复沙箱模式 171 词，放宽了安全保证</text>

  <rect x="40" y="430" width="1120" height="66" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="456" font-size="12" font-weight="700" fill="#334155">反向提醒：实现很小，既不是不写的理由，也不是该删的理由</text>
  <text x="60" y="480" fill="#475569">「A local bug fix… does not qualify merely because its implementation is small.」——沙箱那篇就是 171 词的「小修复」，走的是出口 ③。</text>

  <rect x="40" y="512" width="1120" height="60" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="60" y="538" font-size="12" font-weight="700" fill="#991b1b">出口 ③ 之前先自检：这篇 Note 会不会刚落地就够格归档？</text>
  <text x="60" y="560" fill="#475569">会的话，现在就走出口 ①。旧标准「Every non-trivial change MUST…」已于 2026-09-17 收窄，不再是规则。</text>
</svg>
