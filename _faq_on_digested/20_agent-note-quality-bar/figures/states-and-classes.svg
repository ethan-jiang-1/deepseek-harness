<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>Agent Note 的三个状态、六个分类与一个冻结归档库</title>
  <desc>proposed 是待评审方案，implemented 是已交付决定，rejected 是保留下来防止重踩坑的否决记录；三者对应的状态行分别是 Status: proposed、Status: implemented 和 Status: rejected — 原因。implemented 中不再指导未来工作但仍有历史价值的记录移入 archived 并永久冻结，其 Status 行仍是 implemented。六个分类 feature、bug-fix、simplification、architecture、process、testing 是封闭的检索目录。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">三个状态 · 六个分类 · 一个冻结归档库</text>
  <text x="600" y="60" text-anchor="middle" fill="#64748b">状态目录回答「决定现在处于哪一步」，六个分类缩小检索范围，archived/ 是冻结存放处而非第四种状态。</text>

  <text x="30" y="96" font-size="12" font-weight="700" fill="#475569">活跃生命周期树（每篇在磁盘上为 .md + .zh.md + .i18n.yaml 三件套）</text>

  <rect x="30" y="110" width="250" height="132" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="155" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">proposed/</text>
  <text x="155" y="164" text-anchor="middle" fill="#334155">体量大、尚未动工</text>
  <text x="155" y="184" text-anchor="middle" fill="#334155">需要先评审设计方案</text>
  <text x="155" y="212" text-anchor="middle" font-weight="600" fill="#9a3412">Status: proposed</text>
  <text x="155" y="231" text-anchor="middle" fill="#64748b">骨架含 Proposal / Acceptance / Risks</text>

  <line x1="288" y1="176" x2="322" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="164" text-anchor="middle" font-size="11" fill="#64748b">同 PR 改写</text>

  <rect x="330" y="110" width="250" height="132" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="455" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">implemented/</text>
  <text x="455" y="164" text-anchor="middle" fill="#334155">方案已落地，现在时态</text>
  <text x="455" y="184" text-anchor="middle" fill="#334155">路径与默认值随代码同步</text>
  <text x="455" y="212" text-anchor="middle" font-weight="600" fill="#1e40af">Status: implemented</text>
  <text x="455" y="231" text-anchor="middle" fill="#64748b">严禁残留 Proposal / Plan 标题</text>

  <line x1="155" y1="250" x2="155" y2="292" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="163" y="276" text-anchor="start" font-size="11" fill="#b91c1c">被否决（单向）</text>

  <rect x="30" y="300" width="250" height="132" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="155" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">rejected/</text>
  <text x="155" y="354" text-anchor="middle" fill="#334155">仅在「后人仍易重踩此坑」</text>
  <text x="155" y="374" text-anchor="middle" fill="#334155">时保留；前提失效即删</text>
  <text x="155" y="402" text-anchor="middle" font-weight="600" fill="#991b1b">Status: rejected — 原因</text>
  <text x="155" y="421" text-anchor="middle" fill="#64748b">保留原提案正文，状态行写结论</text>

  <line x1="588" y1="176" x2="622" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="262" text-anchor="middle" font-size="11" fill="#64748b">不再指导后续改动</text>

  <rect x="630" y="110" width="540" height="132" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="900" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">archived/{class}/ — 冻结归档库（非第四种状态）</text>
  <text x="900" y="166" text-anchor="middle" fill="#334155">仅收容已完成使命但有历史备查价值的 implemented 记录（故路径省去 implemented 层）</text>
  <text x="900" y="190" text-anchor="middle" fill="#334155">保留 Status: implemented，下方紧接插入 Archived: YYYY-MM-DD</text>
  <text x="900" y="214" text-anchor="middle" font-weight="600" fill="#991b1b">Git 钩子与哈希清单永久锁死：禁改、禁译、禁删，不得当现行规范引用</text>
  <text x="900" y="233" text-anchor="middle" fill="#64748b">出站旧链接免检；入站链接归档时须同步修平</text>

  <rect x="30" y="456" width="1140" height="86" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="52" y="484" font-size="13" font-weight="700" fill="#166534">六个封闭领域分类（门禁拒绝名单外目录；禁止新建集中式 INDEX.md）</text>
  <text x="52" y="509" fill="#334155">architecture（交付源码结构）｜feature（面向用户/模型新能力）｜process（门禁/构建/协作工具链）｜testing（测试策略）｜simplification（删减代码与收敛表面）｜bug-fix（修缺陷或补复盘缺口）</text>
  <text x="52" y="531" fill="#475569">分界速记：改交付源码选 architecture，改外围工具流程选 process；故意不设 refactor——删减收敛归 simplification，无新决定的纯搬迁直接免写 Note。</text>
</svg>
