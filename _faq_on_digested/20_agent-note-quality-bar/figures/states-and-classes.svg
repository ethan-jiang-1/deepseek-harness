<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>Agent Note 的三个状态、六个分类、冻结归档库与整套删除闭环</title>
  <desc>活跃生命周期包含 proposed、implemented、rejected 三个目录；已想清的决定可直接写入 implemented，大体量方案先写 proposed 评审后同 PR 改写转正。已完成使命但留有历史备查价值的 implemented 记录迁入 archived 永久哈希冻结；完全被取代合并、旧规误建的局部 UI 或纯机械记录、以及诱惑前提已消失的 rejected 记录则整套删除三件套。底部以 3x2 卡片列出 architecture、feature、process、simplification、bug-fix、testing 六个封闭领域分类。</desc>
  <defs>
    <marker id="sc-arrow" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="sc-blue" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="sc-red" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">三个状态 · 六个分类 · 冻结归档与清退闭环</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">路径固定为 {生命周期}/{分类}/yyyy-mm-dd-topic.md（禁建 INDEX.md）；每篇落盘为 .md + .zh.md + .i18n.yaml 三件套</text>

  <rect x="65" y="76" width="180" height="24" rx="12" fill="#ffedd5" stroke="#fdba74"/>
  <text x="155" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">大体量方案：动工前先评审</text>
  <line x1="155" y1="100" x2="155" y2="114" stroke="#9a3412" stroke-width="1.5" marker-end="url(#sc-arrow)"/>

  <rect x="390" y="76" width="220" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="500" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">常规路径：已定方案随代码直写</text>
  <line x1="500" y1="100" x2="500" y2="114" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#sc-blue)"/>

  <rect x="30" y="118" width="250" height="130" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="155" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">proposed/{class}/</text>
  <text x="155" y="172" text-anchor="middle" font-size="11" fill="#334155">尚未动工或部分构建，允许将来时</text>
  <text x="155" y="200" text-anchor="middle" font-weight="700" fill="#9a3412">Status: proposed</text>
  <text x="155" y="224" text-anchor="middle" font-size="11" fill="#64748b">含 Proposal / Acceptance / Risks</text>

  <line x1="286" y1="183" x2="362" y2="183" stroke="#1d4ed8" stroke-width="2" marker-end="url(#sc-blue)"/>
  <text x="325" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">同 PR 转正</text>
  <text x="325" y="202" text-anchor="middle" font-size="11" fill="#64748b">改写成现在时</text>

  <rect x="370" y="118" width="260" height="130" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="500" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">implemented/{class}/</text>
  <text x="500" y="172" text-anchor="middle" font-size="11" fill="#334155">现在时态；事实随代码刷新，反悔另写互链</text>
  <text x="500" y="200" text-anchor="middle" font-weight="700" fill="#1e40af">Status: implemented</text>
  <text x="500" y="224" text-anchor="middle" font-size="11" fill="#64748b">禁留 Proposal / Plan / Acceptance</text>

  <line x1="636" y1="183" x2="712" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#sc-arrow)"/>
  <text x="675" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">使命已完成</text>
  <text x="675" y="202" text-anchor="middle" font-size="11" fill="#64748b">留历史备查</text>

  <rect x="720" y="118" width="450" height="130" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="945" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">archived/{class}/ · 冻结归档库</text>
  <text x="945" y="170" text-anchor="middle" font-size="11" fill="#334155">仅收容已交付 implemented（proposed 绝不归档）</text>
  <text x="945" y="192" text-anchor="middle" font-size="11" fill="#334155">保留 Status: implemented，下方紧插 Archived: YYYY-MM-DD</text>
  <text x="945" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">lefthook 与哈希清单永久锁死：禁改、禁译、不当现行规范</text>
  <text x="945" y="236" text-anchor="middle" font-size="11" fill="#64748b">单向修平入站链接；内部旧出站链接免检</text>

  <line x1="155" y1="252" x2="155" y2="290" stroke="#b91c1c" stroke-width="2" marker-end="url(#sc-red)"/>
  <text x="166" y="275" font-size="11" font-weight="600" fill="#b91c1c">否决但错路仍诱人</text>

  <rect x="30" y="296" width="250" height="122" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="155" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">rejected/{class}/</text>
  <text x="155" y="348" text-anchor="middle" font-size="11" fill="#334155">仅在后人易重踩同款老坑时保留</text>
  <text x="155" y="373" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Status: rejected — 一句话死因</text>
  <text x="155" y="396" text-anchor="middle" font-size="11" fill="#64748b">冻结原提案章节，状态行点明结论</text>

  <line x1="286" y1="357" x2="362" y2="357" stroke="#b91c1c" stroke-width="2" marker-end="url(#sc-red)"/>
  <text x="325" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">前提已消失</text>

  <line x1="500" y1="252" x2="500" y2="290" stroke="#b91c1c" stroke-width="2" marker-end="url(#sc-red)"/>
  <text x="510" y="275" font-size="11" font-weight="600" fill="#b91c1c">完全取代合并 / 旧规噪音</text>

  <rect x="370" y="296" width="456" height="122" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <text x="392" y="322" font-size="13" font-weight="700" fill="#991b1b">整套删除（git rm 三件套 + 修平入站链接）</text>
  <text x="392" y="346" font-size="11" fill="#334155">• 100% 被新篇吸收独有理由与验证缺口的旧 implemented</text>
  <text x="392" y="366" font-size="11" fill="#334155">• 旧规误建的局部 UI 微调与纯机械搬迁记录</text>
  <text x="392" y="386" font-size="11" fill="#334155">• 诱惑前提已消失的 rejected，或未落地即作废的提案</text>
  <text x="392" y="406" font-size="11" fill="#64748b">拒绝拿归档库当回收站；整单回滚时连封存条目一并移除</text>

  <rect x="844" y="296" width="326" height="122" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="864" y="322" font-size="13" font-weight="700" fill="#1e40af">implemented/ 必填四段骨架</text>
  <text x="864" y="346" font-size="11" fill="#334155">1. ## Problem（独立讲处境，不剧透方案）</text>
  <text x="864" y="366" font-size="11" fill="#334155">2. ## Decision（现在时陈述已交付规则）</text>
  <text x="864" y="386" font-size="11" font-weight="700" fill="#1e40af">3. ## Alternatives considered（灵魂必填）</text>
  <text x="864" y="406" font-size="11" fill="#334155">4. ## Consequences（代价、收益与测试证据）</text>

  <rect x="30" y="436" width="1140" height="184" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="52" y="462" font-size="13" font-weight="700" fill="#166534">六个封闭领域分类（门禁拒绝名单外目录；分界线：改交付源码选 architecture，改外围工具链选 process）</text>

  <rect x="50" y="476" width="356" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="68" y="499" font-size="12" font-weight="700" fill="#166534">architecture · 交付源码结构</text>
  <text x="68" y="520" font-size="11" fill="#334155">包职责边界、服务接口契约与运行时模型</text>

  <rect x="422" y="476" width="356" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="440" y="499" font-size="12" font-weight="700" fill="#166534">feature · 用户或模型新能力</text>
  <text x="440" y="520" font-size="11" fill="#334155">改变模型可见工具语义或产品可感知功能</text>

  <rect x="794" y="476" width="356" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="812" y="499" font-size="12" font-weight="700" fill="#166534">process · 外围工程与工作流</text>
  <text x="812" y="520" font-size="11" fill="#334155">门禁脚本、构建发布、vendoring 与 CI 治理</text>

  <rect x="50" y="544" width="356" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="68" y="567" font-size="12" font-weight="700" fill="#166534">simplification · 删减与表面收敛</text>
  <text x="68" y="588" font-size="11" fill="#334155">不增能力的删代码减配置（不设 refactor）</text>

  <rect x="422" y="544" width="356" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="440" y="567" font-size="12" font-weight="700" fill="#166534">bug-fix · 修缺陷或补复盘缺口</text>
  <text x="440" y="588" font-size="11" fill="#334155">修法确立新规则或补事故复盘缺口（普通修免写）</text>

  <rect x="794" y="544" width="356" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="812" y="567" font-size="12" font-weight="700" fill="#166534">testing · 测试基建与策略</text>
  <text x="812" y="588" font-size="11" fill="#334155">回放框架、覆盖率门禁与测试隔离约定</text>
</svg>
