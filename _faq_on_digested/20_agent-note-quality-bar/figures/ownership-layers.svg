<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>Agent Note 质量要求的三层治理分工</title>
  <desc>第一层是规则与门禁层，由 .agents/notes/README.md 与各子树 AGENTS.md 定义准入门槛和磁盘结构，并由 doc-sync 与 lefthook 中的四道校验脚本强制执行；第二层是语义流程层，由 dsh-archive-agent-notes、dsh-find-simplifications、dsh-prose-standard、dsh-trim-cot-leakage 四套专项技能与人工审查把关机器查不出的软判断；第三层是跨载体协作层，规定 docs/、PR 审查与破坏性变更升级指南如何同 Agent Note 分工交接。</desc>
  <defs>
    <marker id="ol-arrow" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">质量要求分三层治理，各管一摊不重复</text>
  <text x="600" y="60" text-anchor="middle" fill="#64748b">能靠机器死查的格式全收进门禁脚本，需要动脑权衡的语义才交给专项 Skill 与 Code Review——因此仓库里不设「怎么写 Note」技能</text>

  <rect x="30" y="82" width="1140" height="162" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="52" y="108" font-size="14" font-weight="700" fill="#1e40af">① 规则与门禁层 · 管准入红线、目录语法与必填骨架</text>
  <text x="1148" y="108" text-anchor="end" font-size="11" font-weight="600" fill="#1e40af">.agents/notes/README.md + 各子树 AGENTS.md</text>

  <rect x="52" y="122" width="536" height="104" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="70" y="144" font-size="12" font-weight="700" fill="#1e40af">文档明文立下的硬规矩</text>
  <text x="70" y="166" font-size="11" fill="#334155">• 仅持久设计取舍才写，局部 UI 与机械重构一律豁免</text>
  <text x="70" y="186" font-size="11" fill="#334155">• 路径 {lifecycle}/{class}/yyyy-mm-dd-topic.md，禁建 INDEX.md</text>
  <text x="70" y="206" font-size="11" fill="#334155">• 首节固定 ## Problem，强制必填 ## Alternatives considered</text>

  <rect x="612" y="122" width="536" height="104" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="630" y="144" font-size="12" font-weight="700" fill="#1e3a8a">机器脚本直接拦截（doc-sync / lefthook）</text>
  <text x="630" y="166" font-size="11" fill="#1e3a8a">• verify-agent-note-format：前四行头部语法、禁残留未来时标题</text>
  <text x="630" y="186" font-size="11" fill="#1e3a8a">• verify-agent-note-classification：锁死 3 状态 × 6 封闭分类目录</text>
  <text x="630" y="206" font-size="11" fill="#1e3a8a">• verify-translation-pairing + verify-archived-agent-notes：双语与归档哈希锁</text>

  <line x1="600" y1="244" x2="600" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#ol-arrow)"/>
  <text x="614" y="262" font-size="11" font-weight="600" fill="#64748b">格式全绿 ≠ 内容真有指导价值</text>

  <rect x="30" y="276" width="1140" height="192" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="52" y="302" font-size="14" font-weight="700" fill="#9a3412">② 语义流程层 · 四套专项 Skill 与人工 Review 把关软判断</text>

  <rect x="52" y="316" width="262" height="136" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="68" y="338" font-size="12" font-weight="700" fill="#9a3412">dsh-archive-agent-notes</text>
  <text x="68" y="360" font-size="11" fill="#334155">• 留活树 / 归档 / 直删语义判据</text>
  <text x="68" y="380" font-size="11" fill="#334155">• 新篇必查老记录取代关系</text>
  <text x="68" y="400" font-size="11" fill="#334155">• 禁按字数年龄或凑配额清理</text>
  <text x="68" y="420" font-size="11" fill="#334155">• 执行五步冻结封存流程</text>
  <text x="68" y="440" font-size="11" fill="#64748b">配正反校准样本防一刀切误删</text>

  <rect x="330" y="316" width="262" height="136" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="346" y="338" font-size="12" font-weight="700" fill="#9a3412">dsh-find-simplifications</text>
  <text x="346" y="360" font-size="11" fill="#334155">• 删减类提案必备四项硬证据：</text>
  <text x="346" y="380" font-size="11" fill="#334155">  调用方清点 · 省掉的维护税</text>
  <text x="346" y="400" font-size="11" fill="#334155">  放弃的能力 · 可观察验收条件</text>
  <text x="346" y="420" font-size="11" fill="#334155">• 已有拥主记录只原地更新</text>
  <text x="346" y="440" font-size="11" fill="#64748b">严禁为凑候选数重复新建 Note</text>

  <rect x="608" y="316" width="262" height="136" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="624" y="338" font-size="12" font-weight="700" fill="#9a3412">dsh-prose-standard</text>
  <text x="624" y="360" font-size="11" fill="#334155">• 提案转正改写成现在时事实</text>
  <text x="624" y="380" font-size="11" fill="#334155">• 删净施工待办清单</text>
  <text x="624" y="400" font-size="11" fill="#334155">• 保留测试钉死点与已知覆盖缺口</text>
  <text x="624" y="420" font-size="11" fill="#334155">• 源码须先就地写清行为保证</text>
  <text x="624" y="440" font-size="11" fill="#64748b">外链 Note 不能替代本地契约说明</text>

  <rect x="886" y="316" width="262" height="136" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="902" y="338" font-size="12" font-weight="700" fill="#9a3412">dsh-trim-cot-leakage</text>
  <text x="902" y="360" font-size="11" fill="#334155">• 剔除会话与评审推理残渣</text>
  <text x="902" y="380" font-size="11" fill="#334155">• 「评审被拒」提炼成客观死因</text>
  <text x="902" y="400" font-size="11" fill="#334155">• 禁写「本版修改 / v2 新增」</text>
  <text x="902" y="420" font-size="11" fill="#334155">• 文件修订史一律交给 Git</text>
  <text x="902" y="440" font-size="11" fill="#64748b">防止临时聊天上下文污染长期档案</text>

  <line x1="600" y1="468" x2="600" y2="494" stroke="#64748b" stroke-width="2" marker-end="url(#ol-arrow)"/>
  <text x="614" y="486" font-size="11" font-weight="600" fill="#64748b">与其他仓库载体的分工交接</text>

  <rect x="30" y="500" width="1140" height="138" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="52" y="526" font-size="14" font-weight="700" fill="#166534">③ 跨载体协作层 · 一个事实一个家，现状文档、升级指南与 PR 各自归位</text>

  <rect x="52" y="540" width="352" height="82" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="68" y="562" font-size="12" font-weight="700" fill="#166534">docs/AGENTS.md + dsh-doc</text>
  <text x="68" y="582" font-size="11" fill="#334155">docs/ 与包 README 只写当前 HEAD 接口；</text>
  <text x="68" y="600" font-size="11" fill="#475569">「为什么不选方案 B」统一分流至 Agent Note</text>

  <rect x="424" y="540" width="352" height="82" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="440" y="562" font-size="12" font-weight="700" fill="#166534">dsh-code-review + pre-push-checks</text>
  <text x="440" y="582" font-size="11" fill="#334155">实现提案的 PR 须同提交转正改写 implemented，</text>
  <text x="440" y="600" font-size="11" fill="#475569">推送前跑通 doc-sync 校验双语与链接</text>

  <rect x="796" y="540" width="352" height="82" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="812" y="562" font-size="12" font-weight="700" fill="#166534">dsh-create-upgrade-guide</text>
  <text x="812" y="582" font-size="11" fill="#334155">升级指南只写面向用户的迁移步骤（上限 500 词）；</text>
  <text x="812" y="600" font-size="11" fill="#475569">超长的深层架构权衡移入对应 Agent Note</text>
</svg>
