<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr24c" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="580" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">六种来源，同一个落点：profile 目录</text>
  <text x="480" y="55" text-anchor="middle" font-size="11" fill="#6b7280">渠道只改变“代码从哪来、版本怎么选、用户要批准什么”；安装与启动是同一套管道。</text>

  <rect x="40" y="76" width="262" height="112" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="100" font-size="12" font-weight="700" fill="#1e3a8a">npm registry</text>
  <text x="56" y="121" font-size="10" fill="#1e40af">作者发预构建产物；用户指定版本</text>
  <text x="56" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1e3a8a">add @acme/pack@1.2.3</text>
  <text x="56" y="159" font-size="9.5" fill="#1d4ed8">可回退版本；市场可列多版本</text>
  <text x="56" y="177" font-size="9.5" fill="#1d4ed8">默认渠道；需要完整 exports/files</text>

  <rect x="322" y="76" width="262" height="112" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="338" y="100" font-size="12" font-weight="700" fill="#166534">Git 托管</text>
  <text x="338" y="121" font-size="10" fill="#166534">拿到源码；prepare 装时构建</text>
  <text x="338" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#166534">add github:acme/pack#&lt;sha&gt;</text>
  <text x="338" y="159" font-size="9.5" fill="#15803d">用户要开 allowBuilds；固定 sha</text>
  <text x="338" y="177" font-size="9.5" fill="#15803d">脚本以宿主机权限执行，不是沙箱</text>

  <rect x="604" y="76" width="316" height="112" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="620" y="100" font-size="12" font-weight="700" fill="#334155">tarball / 本地 link</text>
  <text x="620" y="121" font-size="10" fill="#475569">tarball：pnpm pack，离线交付，不跑脚本</text>
  <text x="620" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#334155">add ./pack-1.0.0.tgz | link:/abs</text>
  <text x="620" y="159" font-size="9.5" fill="#475569">link 是开发形态：files 不过滤，路径机器相关</text>
  <text x="620" y="177" font-size="9.5" fill="#475569">tarball 是预构建、可归档的私有交付</text>

  <rect x="40" y="206" width="262" height="112" rx="9" fill="#fefce8" stroke="#fde68a"/>
  <text x="56" y="230" font-size="12" font-weight="700" fill="#854d0e">市场 index</text>
  <text x="56" y="251" font-size="10" fill="#854d0e">一份静态 JSON + 图标；不是插件</text>
  <text x="56" y="270" font-size="9.5" fill="#a16207">source: npm 或 git + 40-hex commit</text>
  <text x="56" y="289" font-size="9.5" fill="#a16207">DSH 只校验格式，不验证声明</text>
  <text x="56" y="307" font-size="9.5" fill="#a16207">跨网络必须 https；官方不带 index 源</text>

  <rect x="322" y="206" width="262" height="112" rx="9" fill="#fefce8" stroke="#fde68a"/>
  <text x="338" y="230" font-size="12" font-weight="700" fill="#854d0e">官方按需目录</text>
  <text x="338" y="251" font-size="10" fill="#854d0e">只收公开 @deepseek-ai/dsh-* bundle</text>
  <text x="338" y="270" font-size="9.5" fill="#a16207">必须 en + zh 的 meta 与图标</text>
  <text x="338" y="289" font-size="9.5" fill="#a16207">发布版装 package@运行中的 DSH 版本</text>
  <text x="338" y="307" font-size="9.5" fill="#a16207">外部作者不适用；走 npm / Git / 市场</text>

  <rect x="604" y="206" width="316" height="112" rx="9" fill="#fef2f2" stroke="#fecaca"/>
  <text x="620" y="230" font-size="12" font-weight="700" fill="#991b1b">版本判定统一</text>
  <text x="620" y="251" font-size="10" fill="#7f1d1d">有 engines.dsh → 只看它</text>
  <text x="620" y="270" font-size="9.5" fill="#b91c1c">没有 → 全部 @deepseek-ai/dsh* peer 都要满足</text>
  <text x="620" y="289" font-size="9.5" fill="#b91c1c">两者都无 → 不约束（但不推荐）</text>
  <text x="620" y="307" font-size="9.5" fill="#b91c1c">豁免是精确版本对，不继承，不是安全授权</text>

  <rect x="40" y="336" width="880" height="104" rx="9" fill="#ffffff" stroke="#d1d5db"/>
  <text x="56" y="360" font-size="12" font-weight="700" fill="#1f2937">落点：$DSH_HOME/profiles/&lt;name&gt;/</text>
  <text x="56" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#374151">package.json → dependencies + dsh.profile.bundles（有序）</text>
  <text x="56" y="401" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#374151">cordis.patch.yml → 用户自己的覆盖层，在 bundle 层之后</text>
  <text x="56" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#374151">node_modules/ → pnpm 装的包（含你的 bundle）</text>
  <text x="560" y="382" font-size="10" fill="#475569">启动：叠 bundle 层 → 应用用户层 → 解析行 → 激活插件</text>
  <text x="560" y="401" font-size="10" fill="#475569">安装与卸载都由 manager / CLI 维护，不手写 manifest</text>
  <text x="560" y="420" font-size="10" fill="#475569">重新启用 bundle 会排到列表末尾，优先级随之改变</text>

  <rect x="40" y="458" width="880" height="104" rx="9" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="56" y="482" font-size="12" font-weight="700" fill="#4c1d95">安全边界：安装可执行，激活在进程内</text>
  <text x="56" y="504" font-size="10.5" fill="#5b21b6">安装只跑 pnpm，不导入插件；被批准的构建脚本在安装时执行；激活后的 Host 代码在进程内、沙箱之外。</text>
  <text x="56" y="524" font-size="10.5" fill="#5b21b6">Git / tarball 的构建脚本以宿主机用户权限运行；allowBuilds 按包名持久化，失败也不撤销。</text>
  <text x="56" y="544" font-size="10.5" fill="#5b21b6">市场内容是第三方声明；安装确认框里的来源核对是最后一道人工防线。</text>
</svg>
