<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr24d" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
    <marker id="arr24dr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="620" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">三层分离：只读定义、可执行代码、运行数据</text>
  <text x="480" y="55" text-anchor="middle" font-size="11" fill="#6b7280">包只包含上两层；数据永远在包外，且各有唯一所有者。</text>

  <rect x="36" y="74" width="888" height="322" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="52" y="94" font-size="10.5" font-weight="700" fill="#475569">bundle 发布边界（版本化、可替换）</text>

  <rect x="56" y="104" width="848" height="126" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="76" y="128" font-size="13" font-weight="700" fill="#1e3a8a">① 定义层 · 运行时只读</text>
  <text x="76" y="147" font-size="10" fill="#1e40af">随包发布、随版本冻结；会话选中后不再改写；改它 = 换 revision：活着的 Agent 不变，新 Agent 用新定义，重启按当前定义。</text>
  <rect x="76" y="160" width="190" height="54" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="90" y="181" font-size="10.5" font-weight="700" fill="#1e3a8a">preset 声明</text>
  <text x="90" y="199" font-size="9.5" fill="#1d4ed8">id / plugins / order</text>
  <rect x="282" y="160" width="190" height="54" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="296" y="181" font-size="10.5" font-weight="700" fill="#1e3a8a">persona / prompt</text>
  <text x="296" y="199" font-size="9.5" fill="#1d4ed8">prefix、section、策略文本</text>
  <rect x="488" y="160" width="190" height="54" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="502" y="181" font-size="10.5" font-weight="700" fill="#1e3a8a">skills 资产</text>
  <text x="502" y="199" font-size="9.5" fill="#1d4ed8">SKILL.md + references</text>
  <rect x="694" y="160" width="193" height="54" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="708" y="181" font-size="10.5" font-weight="700" fill="#1e3a8a">工具边界</text>
  <text x="708" y="199" font-size="9.5" fill="#1d4ed8">行 + Config + restrict</text>

  <line x1="480" y1="230" x2="480" y2="252" stroke="#4b5563" marker-end="url(#arr24d)"/>
  <text x="492" y="246" font-size="9.5" fill="#4b5563">声明 → 激活</text>

  <rect x="56" y="258" width="848" height="126" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="76" y="282" font-size="13" font-weight="700" fill="#166534">② 代码层 · 执行</text>
  <text x="76" y="301" font-size="10" fill="#15803d">导出 apply / service；注册即 effect；不含业务数据、不含用户路径、不含 secret。</text>
  <rect x="76" y="314" width="190" height="54" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="90" y="335" font-size="10.5" font-weight="700" fill="#166534">Host 行</text>
  <text x="90" y="353" font-size="9.5" fill="#15803d">服务、工具、策略、适配器</text>
  <rect x="282" y="314" width="190" height="54" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="296" y="335" font-size="10.5" font-weight="700" fill="#166534">client 模块</text>
  <text x="296" y="353" font-size="9.5" fill="#15803d">dsh.client + ./client</text>
  <rect x="488" y="314" width="190" height="54" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="502" y="335" font-size="10.5" font-weight="700" fill="#166534">服务定义 / 适配</text>
  <text x="502" y="353" font-size="9.5" fill="#15803d">ctx.* 注册与消费</text>
  <rect x="694" y="314" width="193" height="54" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="708" y="335" font-size="10.5" font-weight="700" fill="#166534">资源解析</text>
  <text x="708" y="353" font-size="9.5" fill="#15803d">从安装包解析，不从 preset 目录</text>

  <line x1="480" y1="396" x2="480" y2="420" stroke="#4b5563" marker-end="url(#arr24d)"/>
  <text x="496" y="414" font-size="9.5" fill="#4b5563">只经 ctx.fs / ctx.storageDomain / ctx.sessionProjections 访问</text>

  <rect x="36" y="426" width="888" height="128" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="450" font-size="13" font-weight="700" fill="#78350f">③ 数据层 · 三种归属，都在包外（home 有两个根）</text>
  <rect x="56" y="462" width="272" height="78" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="70" y="483" font-size="10.5" font-weight="700" fill="#78350f">workspace · 当前项目</text>
  <text x="70" y="502" font-size="9.5" fill="#854d0e">会话工作目录、项目 AGENTS.md</text>
  <text x="70" y="519" font-size="9.5" fill="#854d0e">.dsh/skills、.agents/skills</text>
  <text x="70" y="536" font-size="9.5" fill="#854d0e">随项目走；换项目就换数据</text>
  <rect x="344" y="462" width="272" height="78" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="358" y="483" font-size="10.5" font-weight="700" fill="#78350f">home · 用户全局</text>
  <text x="358" y="502" font-size="9.5" fill="#854d0e">$DSH_HOME/AGENTS.md、skills/</text>
  <text x="358" y="519" font-size="9.5" fill="#854d0e">storages/、.credentials.yaml</text>
  <text x="358" y="536" font-size="9.5" fill="#854d0e">跨项目的经验与状态</text>
  <rect x="632" y="462" width="272" height="78" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="646" y="483" font-size="10.5" font-weight="700" fill="#78350f">session · 会话日志</text>
  <text x="646" y="502" font-size="9.5" fill="#854d0e">$DSH_HOME/sessions/--&lt;cwd&gt;--/</text>
  <text x="646" y="519" font-size="9.5" fill="#854d0e">模型可见 ⟺ 可从日志重建</text>
  <text x="646" y="536" font-size="9.5" fill="#854d0e">只追加；插件记忆是派生缓存</text>

  <rect x="40" y="572" width="420" height="34" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="594" font-size="10.5" fill="#991b1b">× 不把用户数据写进包目录：升级会替换它，files 会裁剪它。</text>
  <rect x="480" y="572" width="440" height="34" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="496" y="594" font-size="10.5" fill="#991b1b">× 不把数据塞进 preset/定义：定义是只读的，改它要换版本。</text>
</svg>
