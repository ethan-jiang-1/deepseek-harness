<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr24b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="570" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">发布六项检查：三种失败方式</text>
  <text x="480" y="55" text-anchor="middle" font-size="11" fill="#6b7280">会被拒绝的只是其中一部分；其余是“装完才坏”或“只降级”。别把三类混成一句“DSH 会拒绝”。</text>

  <rect x="36" y="78" width="150" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="111" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">插件包</text>
  <text x="111" y="114" text-anchor="middle" font-size="9.5" fill="#64748b">代码 + patch + 资源</text>
  <line x1="186" y1="100" x2="222" y2="100" stroke="#4b5563" marker-end="url(#arr24b)"/>

  <rect x="228" y="76" width="218" height="152" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <circle cx="252" cy="100" r="12" fill="#d97706"/>
  <text x="252" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="272" y="104" font-size="12" font-weight="700" fill="#78350f">入口 · 装载正确性</text>
  <text x="244" y="128" font-size="10.5" fill="#78350f">named apply 与 default service</text>
  <text x="244" y="146" font-size="10.5" fill="#78350f">不能混用；注册要有 disposer</text>
  <text x="244" y="168" font-size="9.5" fill="#a16207">坏法：命名空间被丢弃 / inject 失效</text>
  <text x="244" y="188" font-size="9.5" fill="#a16207">通常不在安装时拒绝，首次用才崩</text>
  <text x="244" y="208" font-size="9.5" fill="#a16207">检查者：Loader / 模块加载</text>

  <rect x="462" y="76" width="218" height="152" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="486" cy="100" r="12" fill="#dc2626"/>
  <text x="486" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="506" y="104" font-size="12" font-weight="700" fill="#991b1b">patch · 拒绝 / 跳过</text>
  <text x="478" y="128" font-size="10.5" fill="#7f1d1d">dsh.bundle.patch 存在、能解析</text>
  <text x="478" y="146" font-size="10.5" fill="#7f1d1d">行 name 能从安装位置解析</text>
  <text x="478" y="168" font-size="9.5" fill="#b91c1c">坏法：not-bundle / 安装警告 / 跳过</text>
  <text x="478" y="188" font-size="9.5" fill="#b91c1c">无 dsh.bundle：CLI 当依赖，服务端回滚</text>
  <text x="478" y="208" font-size="9.5" fill="#b91c1c">检查者：dsh plugin + profile 启动</text>

  <rect x="696" y="76" width="228" height="152" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <circle cx="720" cy="100" r="12" fill="#d97706"/>
  <text x="720" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="740" y="104" font-size="12" font-weight="700" fill="#78350f">自包含 · 装后坏</text>
  <text x="712" y="128" font-size="10.5" fill="#78350f">入口导出可解析；构建产物存在</text>
  <text x="712" y="146" font-size="10.5" fill="#78350f">npm 发构建产物；Git 要 prepare</text>
  <text x="712" y="168" font-size="9.5" fill="#a16207">坏法：模块找不到 / tarball 缺文件</text>
  <text x="712" y="188" font-size="9.5" fill="#a16207">检查者：Node 解析 + pnpm pack</text>
  <text x="712" y="208" font-size="9.5" fill="#a16207">link 不打包，files 漏项本地看不出来</text>

  <rect x="228" y="248" width="218" height="152" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="252" cy="272" r="12" fill="#dc2626"/>
  <text x="252" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="272" y="276" font-size="12" font-weight="700" fill="#991b1b">兼容 · 拒绝 / 跳过</text>
  <text x="244" y="300" font-size="10.5" fill="#7f1d1d">engines.dsh，或全部 DSH peer</text>
  <text x="244" y="318" font-size="10.5" fill="#7f1d1d">预发布参与匹配；workspace: 非法</text>
  <text x="244" y="340" font-size="9.5" fill="#b91c1c">坏法：拒绝安装 / 跳过 bundle / 拒行</text>
  <text x="244" y="360" font-size="9.5" fill="#b91c1c">检查者：安装预检 + 启动/重载</text>
  <text x="244" y="380" font-size="9.5" fill="#b91c1c">豁免：精确 package@version 对</text>

  <rect x="462" y="248" width="218" height="152" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <circle cx="486" cy="272" r="12" fill="#d97706"/>
  <text x="486" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="506" y="276" font-size="12" font-weight="700" fill="#78350f">Config · 条件门</text>
  <text x="478" y="300" font-size="10.5" fill="#78350f">声明了 Config 才校验行内 config</text>
  <text x="478" y="318" font-size="10.5" fill="#78350f">没声明 Config 的插件照样加载</text>
  <text x="478" y="340" font-size="9.5" fill="#a16207">坏法：激活失败（按行的重要性处理）</text>
  <text x="478" y="360" font-size="9.5" fill="#a16207">检查者：插件激活</text>
  <text x="478" y="380" font-size="9.5" fill="#a16207">可调值进 Config 是质量线，不是安装门禁</text>

  <rect x="696" y="248" width="228" height="152" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="720" cy="272" r="12" fill="#16a34a"/>
  <text x="720" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="740" y="276" font-size="12" font-weight="700" fill="#166534">元数据 · 只降级</text>
  <text x="712" y="300" font-size="10.5" fill="#166534">locale meta.title / description</text>
  <text x="712" y="318" font-size="10.5" fill="#166534">icon ≤256 KiB，留在包内</text>
  <text x="712" y="340" font-size="9.5" fill="#15803d">坏法：回退或诊断，插件仍可管理</text>
  <text x="712" y="360" font-size="9.5" fill="#15803d">检查者：Plugin Manager / Settings</text>
  <text x="712" y="380" font-size="9.5" fill="#15803d">不激活也能读：必须是导出资源</text>

  <rect x="36" y="424" width="288" height="44" rx="7" fill="#fef2f2" stroke="#fecaca"/>
  <text x="180" y="444" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">红：会被拒绝 / 跳过 / 拒行</text>
  <text x="180" y="460" text-anchor="middle" font-size="9.5" fill="#b91c1c">patch、版本</text>
  <rect x="336" y="424" width="288" height="44" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="480" y="444" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">黄：不拒绝，但装完会坏</text>
  <text x="480" y="460" text-anchor="middle" font-size="9.5" fill="#a16207">入口形式、构建产物、client 导出、Config 校验</text>
  <rect x="636" y="424" width="288" height="44" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="780" y="444" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">绿：只降级</text>
  <text x="780" y="460" text-anchor="middle" font-size="9.5" fill="#15803d">locale、icon、description</text>

  <rect x="36" y="490" width="888" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="56" y="512" font-size="11" font-weight="700" fill="#312e81">安装成功 ≠ 激活成功</text>
  <text x="56" y="532" font-size="10.5" fill="#4338ca">安装器保留依赖与选择并报告激活诊断；修包后重装，不要重复装成多份。</text>
  <text x="56" y="548" font-size="10.5" fill="#4338ca">README / 许可证 / SemVer / 测试 / 数据边界是质量线，不在这六项里。</text>
</svg>
