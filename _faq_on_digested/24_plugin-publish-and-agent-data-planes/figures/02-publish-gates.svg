<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr24b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">发布六道门：四道硬门禁，两道质量线</text>
  <text x="480" y="55" text-anchor="middle" font-size="11" fill="#6b7280">DSH 不会因为你没写 README 拒绝你；它会因为解析不了、装不上、版本不对、配置不过而拒绝或跳过。</text>

  <rect x="40" y="78" width="150" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="115" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">插件包</text>
  <text x="115" y="114" text-anchor="middle" font-size="9.5" fill="#64748b">代码 + patch + 资源</text>
  <line x1="190" y1="100" x2="226" y2="100" stroke="#4b5563" marker-end="url(#arr24b)"/>

  <rect x="232" y="76" width="218" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="256" cy="100" r="12" fill="#dc2626"/>
  <text x="256" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="276" y="104" font-size="12" font-weight="700" fill="#991b1b">入口门 · 硬</text>
  <text x="248" y="128" font-size="10.5" fill="#7f1d1d">named apply 与 default service</text>
  <text x="248" y="146" font-size="10.5" fill="#7f1d1d">不能混用；注册要有 disposer</text>
  <text x="248" y="168" font-size="9.5" fill="#b91c1c">失败：命名空间被丢弃 / 激活失败</text>
  <text x="248" y="188" font-size="9.5" fill="#b91c1c">检查者：模块加载 + Loader</text>
  <text x="248" y="208" font-size="9.5" fill="#b91c1c">风险：可能静默少一半行为</text>

  <rect x="466" y="76" width="218" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="490" cy="100" r="12" fill="#dc2626"/>
  <text x="490" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="510" y="104" font-size="12" font-weight="700" fill="#991b1b">打包门 · 硬</text>
  <text x="482" y="128" font-size="10.5" fill="#7f1d1d">dsh.bundle.patch 存在、能解析</text>
  <text x="482" y="146" font-size="10.5" fill="#7f1d1d">行 name 能从安装位置解析</text>
  <text x="482" y="168" font-size="9.5" fill="#b91c1c">失败：安装警告 / bundle 被跳过</text>
  <text x="482" y="188" font-size="9.5" fill="#b91c1c">检查者：dsh plugin + profile 启动</text>
  <text x="482" y="208" font-size="9.5" fill="#b91c1c">无 dsh.bundle：只装依赖，不激活</text>

  <rect x="700" y="76" width="218" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="724" cy="100" r="12" fill="#dc2626"/>
  <text x="724" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="744" y="104" font-size="12" font-weight="700" fill="#991b1b">自包含门 · 硬</text>
  <text x="716" y="128" font-size="10.5" fill="#7f1d1d">exports / files 覆盖运行所需</text>
  <text x="716" y="146" font-size="10.5" fill="#7f1d1d">npm 发构建产物；Git 要 prepare</text>
  <text x="716" y="168" font-size="9.5" fill="#b91c1c">失败：装完缺文件，模块找不到</text>
  <text x="716" y="188" font-size="9.5" fill="#b91c1c">检查者：Node 解析 + pnpm 打包</text>
  <text x="716" y="208" font-size="9.5" fill="#b91c1c">link 不过滤 files，本地能跑不算数</text>

  <rect x="232" y="246" width="218" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="256" cy="270" r="12" fill="#dc2626"/>
  <text x="256" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="276" y="274" font-size="12" font-weight="700" fill="#991b1b">兼容门 · 硬</text>
  <text x="248" y="298" font-size="10.5" fill="#7f1d1d">engines.dsh，或全部 DSH peer</text>
  <text x="248" y="316" font-size="10.5" fill="#7f1d1d">预发布参与匹配；workspace: 非法</text>
  <text x="248" y="338" font-size="9.5" fill="#b91c1c">失败：拒绝安装 / 跳过 bundle / 拒行</text>
  <text x="248" y="358" font-size="9.5" fill="#b91c1c">检查者：安装前预检 + 启动/重载</text>
  <text x="248" y="378" font-size="9.5" fill="#b91c1c">豁免：精确 package@version 对</text>

  <rect x="466" y="246" width="218" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="490" cy="270" r="12" fill="#dc2626"/>
  <text x="490" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="510" y="274" font-size="12" font-weight="700" fill="#991b1b">配置门 · 硬</text>
  <text x="482" y="298" font-size="10.5" fill="#7f1d1d">行内 config 过 Config 校验</text>
  <text x="482" y="316" font-size="10.5" fill="#7f1d1d">可调值全部进 Config</text>
  <text x="482" y="338" font-size="9.5" fill="#b91c1c">失败：激活失败（required 会升级）</text>
  <text x="482" y="358" font-size="9.5" fill="#b91c1c">检查者：插件激活</text>
  <text x="482" y="378" font-size="9.5" fill="#b91c1c">硬编码常量 = 用户只能改代码</text>

  <rect x="700" y="246" width="218" height="150" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="724" cy="270" r="12" fill="#16a34a"/>
  <text x="724" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="744" y="274" font-size="12" font-weight="700" fill="#166534">元数据门 · 质量线</text>
  <text x="716" y="298" font-size="10.5" fill="#166534">locale meta.title / description</text>
  <text x="716" y="316" font-size="10.5" fill="#166534">icon ≤256 KiB，留在包内</text>
  <text x="716" y="338" font-size="9.5" fill="#15803d">失败：只产生诊断，仍可管理</text>
  <text x="716" y="358" font-size="9.5" fill="#15803d">检查者：Plugin Manager / Settings</text>
  <text x="716" y="378" font-size="9.5" fill="#15803d">不激活也能读：必须是导出资源</text>

  <rect x="40" y="418" width="878" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="60" y="440" font-size="11" font-weight="700" fill="#78350f">两条容易被误当成门禁的质量线</text>
  <text x="60" y="459" font-size="10.5" fill="#854d0e">README / 许可证 / 仓库字段 / SemVer / 测试 / 数据边界：DSH 不检查，但决定可发现、可信任、可升级。</text>

  <rect x="40" y="488" width="878" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="510" font-size="11" font-weight="700" fill="#312e81">安装成功 ≠ 激活成功</text>
  <text x="60" y="529" font-size="10.5" fill="#4338ca">安装器保留依赖与选择并报告激活诊断；修包后重装，不要重复装成多份。</text>
</svg>
