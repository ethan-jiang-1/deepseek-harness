<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>一次探针运行掉出的五层资产：条件、判据、标本、入口、纯函数测试</title>
  <desc>图分三块。上半是一条从左到右的沉淀流水线：最左是一次探针运行，向右掉出五层沉淀物，每层一个方框并标注真实文件与行数：条件层是 patch.yml 十四行，判据层是 entry-probe.mjs 一百二十九行并特别标出它是纯函数可抽走，标本层是归档答卷加来源哈希，入口层是 smoke 一百六十三行标着状态常驻，纯函数测试层是一百八十九行十六个用例。五层之间用实线连接表示依赖顺序，其中判据层与标本层引出两个箭头汇入纯函数测试层，标出这是探针变成测试资产的分水岭。中间横贯一条红色虚线，左边写观测，右边写资产，线卡在判据被抽成纯函数那一刻。下半左侧是十六个用例全部来自失败事故的对照表，右侧是四道闸以及一道最致命的闸：真模型探针混进 keyless 门禁会开始随机红。底部一句话收束：探针跑完会掉出五样东西，捡起判据和标本它就成了资产，把整条脚本塞进 CI 只是造了一个会随机红的门。</desc>
  <defs>
    <marker id="dep-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0f766e"/></marker>
    <marker id="dep-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="dep-c" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#b91c1c"/></marker>
  </defs>

  <rect width="1200" height="880" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">一次探针运行，掉出五层资产</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">整条脚本搬进 CI = 造一个会随机红的门；把「判据」和「标本」捡起来，才是资产</text>

  <!-- ============ PART 1: the five layers ============ -->
  <text x="40" y="94" font-size="12" font-weight="700" fill="#334155">① 沉淀流水线：一次运行 → 五层，性质完全不同（真实文件与行数来自 ai_dsh_company 的 entry-probe）</text>

  <!-- source -->
  <rect x="40" y="108" width="118" height="150" rx="10" fill="#0f766e" stroke="#0f766e"/>
  <text x="99" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">一次探针</text>
  <text x="99" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">运行</text>
  <text x="99" y="196" text-anchor="middle" font-size="10" fill="#ccfbf1">真模型 · keyless 不可</text>
  <text x="99" y="214" text-anchor="middle" font-size="10" fill="#ccfbf1">一次跑 13 题</text>
  <text x="99" y="238" text-anchor="middle" font-size="10" fill="#ccfbf1">≈ 几分钟</text>

  <!-- layer 1 -->
  <rect x="190" y="108" width="178" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="212" cy="130" r="11" fill="#64748b"/>
  <text x="212" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="230" y="135" font-size="12" font-weight="700" fill="#334155">条件</text>
  <text x="206" y="158" font-size="10" fill="#334155">run/entry-probe</text>
  <text x="206" y="174" font-size="10" fill="#334155">.patch.yml</text>
  <text x="206" y="196" font-size="10" fill="#64748b">14 行</text>
  <text x="206" y="216" font-size="10" fill="#334155">read-only 沙箱</text>
  <text x="206" y="232" font-size="10" fill="#334155">approval: never</text>
  <text x="206" y="250" font-size="10" fill="#64748b">「在什么配置下跑」</text>

  <!-- layer 2 : decisive -->
  <rect x="390" y="100" width="196" height="166" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="412" cy="122" r="11" fill="#2563eb"/>
  <text x="412" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="430" y="127" font-size="12" font-weight="700" fill="#1d4ed8">判据（分水岭）</text>
  <text x="406" y="150" font-size="10" fill="#334155">tools/lib/entry-probe.mjs</text>
  <text x="406" y="166" font-size="10" fill="#64748b">129 行</text>
  <text x="406" y="188" font-size="10" fill="#1d4ed8">export const ENTRY_QUESTIONS</text>
  <text x="406" y="204" font-size="10" fill="#1d4ed8">export function evaluateProbe()</text>
  <text x="406" y="228" font-size="10" font-weight="700" fill="#991b1b">纯函数，不启动任何进程</text>
  <text x="406" y="250" font-size="10" fill="#64748b">「怎样算对」—— 可被抽走</text>

  <!-- layer 3 -->
  <rect x="608" y="108" width="178" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="630" cy="130" r="11" fill="#64748b"/>
  <text x="630" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="648" y="135" font-size="12" font-weight="700" fill="#334155">标本</text>
  <text x="624" y="158" font-size="10" fill="#334155">snapshots/probes/</text>
  <text x="624" y="174" font-size="10" fill="#334155">entry-probe/&lt;日期&gt;/</text>
  <text x="624" y="196" font-size="10" fill="#64748b">answer-*.md</text>
  <text x="624" y="216" font-size="10" fill="#334155">+ 来源 SHA-256</text>
  <text x="624" y="232" font-size="10" fill="#334155">+ session id</text>
  <text x="624" y="250" font-size="10" fill="#64748b">「冻住的是哪一版」</text>

  <!-- layer 4 -->
  <rect x="808" y="108" width="178" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="830" cy="130" r="11" fill="#64748b"/>
  <text x="830" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="848" y="135" font-size="12" font-weight="700" fill="#334155">入口</text>
  <text x="824" y="158" font-size="10" fill="#334155">checks/smoke/</text>
  <text x="824" y="174" font-size="10" fill="#334155">entry-probe-smoke.mjs</text>
  <text x="824" y="196" font-size="10" fill="#64748b">163 行 · 状态：常驻</text>
  <text x="824" y="216" font-size="10" fill="#334155">「何时跑」写进文件头</text>
  <text x="824" y="236" font-size="10" font-weight="700" fill="#991b1b">No keyless claim</text>
  <text x="824" y="252" font-size="10" font-weight="700" fill="#991b1b">不进 pnpm test</text>

  <!-- layer 5 -->
  <rect x="1008" y="100" width="152" height="166" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <circle cx="1030" cy="122" r="11" fill="#16a34a"/>
  <text x="1030" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="1048" y="127" font-size="12" font-weight="700" fill="#166534">纯函数测试</text>
  <text x="1024" y="150" font-size="10" fill="#334155">tests/harness/</text>
  <text x="1024" y="166" font-size="10" fill="#334155">session/</text>
  <text x="1024" y="182" font-size="10" fill="#334155">entry-probe.spec.ts</text>
  <text x="1024" y="204" font-size="10" fill="#64748b">189 行</text>
  <text x="1024" y="226" font-size="12" font-weight="700" fill="#166534">16 个用例</text>
  <text x="1024" y="248" font-size="10" fill="#166534">不需要真模型</text>
  <text x="1024" y="262" font-size="10" fill="#64748b">守的是尺子准不准</text>

  <!-- arrows -->
  <line x1="160" y1="183" x2="186" y2="183" stroke="#0f766e" stroke-width="2" marker-end="url(#dep-a)"/>
  <line x1="370" y1="183" x2="386" y2="183" stroke="#0f766e" stroke-width="2" marker-end="url(#dep-a)"/>
  <line x1="588" y1="183" x2="604" y2="183" stroke="#0f766e" stroke-width="2" marker-end="url(#dep-a)"/>
  <line x1="788" y1="183" x2="804" y2="183" stroke="#0f766e" stroke-width="2" marker-end="url(#dep-a)"/>

  <!-- the decisive join: 2 + 3 -> 5 -->
  <path d="M488 268 L488 282 Q488 290 496 290 L1084 290 Q1092 290 1092 282 L1092 270" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dep-b)"/>
  <path d="M697 262 L697 282 Q697 290 705 290" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="640" y="276" width="330" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="805" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">② 判据抽成纯函数 + ③ 标本冻住 → ⑤ 才第一次能进 pnpm test</text>

  <!-- ============ PART 2: the asset line ============ -->
  <line x1="40" y1="332" x2="1160" y2="332" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="170" y="318" width="120" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="230" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">观测（不是资产）</text>
  <rect x="900" y="318" width="150" height="28" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="975" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">资产（可进 CI）</text>
  <text x="530" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">界线卡在「判据抽成纯函数」那一刻 —— 不由跑过多少次决定</text>

  <!-- ============ PART 3 left: the 16 tests from failures ============ -->
  <text x="40" y="380" font-size="12" font-weight="700" fill="#334155">② 那 16 个用例，全部从失败里挖出来 —— 沉淀的是「尺子」，不是「产品」</text>

  <rect x="40" y="392" width="640" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="414" font-size="11" font-weight="700" fill="#334155">用例名</text>
  <text x="450" y="414" font-size="11" font-weight="700" fill="#991b1b">它从哪次事故来</text>
  <line x1="58" y1="422" x2="662" y2="422" stroke="#e2e8f0"/>

  <text x="58" y="442" font-size="10" fill="#334155">传入 expectedTag 时，旧 pin 的答案判红</text>
  <text x="450" y="442" font-size="10" fill="#991b1b">0.1.7 写死，pin 升到 0.2.1 后仍在教旧值</text>
  <line x1="58" y1="450" x2="662" y2="450" stroke="#f1f5f9"/>

  <text x="58" y="468" font-size="10" fill="#334155">缺题不能靠其他题或全文关键词蒙混通过</text>
  <text x="450" y="468" font-size="10" fill="#991b1b">有人用整体关键词蒙混</text>
  <line x1="58" y1="476" x2="662" y2="476" stroke="#f1f5f9"/>

  <text x="58" y="494" font-size="10" fill="#334155">证据中的关键词不能代替本题答案</text>
  <text x="450" y="494" font-size="10" fill="#991b1b">同上，更细的一层</text>
  <line x1="58" y1="502" x2="662" y2="502" stroke="#f1f5f9"/>

  <text x="58" y="520" font-size="10" fill="#334155">JSON 语法错误要报位置与附近片段</text>
  <text x="450" y="520" font-size="10" fill="#991b1b">12 题全对，一处未转义引号 ⇒ 判 0/12</text>
  <line x1="58" y1="528" x2="662" y2="528" stroke="#f1f5f9"/>

  <text x="58" y="546" font-size="10" fill="#334155">JSON 后多出内容：报错要标明可重跑</text>
  <text x="450" y="546" font-size="10" fill="#991b1b">模型格式抖动</text>

  <text x="58" y="562" font-size="10" fill="#64748b">……共 16 条，每一条都对应一次真实失手</text>

  <!-- ============ PART 3 right: four gates ============ -->
  <text x="720" y="380" font-size="12" font-weight="700" fill="#334155">③ 从「跑过一次」到「进 CI」的四道闸</text>

  <rect x="720" y="392" width="440" height="176" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <rect x="734" y="406" width="412" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="748" y="428" font-size="10" font-weight="700" fill="#166534">闸 1　判据可单测</text>
  <text x="900" y="428" font-size="10" fill="#334155">evaluateProbe() 是纯函数，不启动进程</text>

  <rect x="734" y="446" width="412" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="748" y="468" font-size="10" font-weight="700" fill="#166534">闸 2　标本带来源哈希</text>
  <text x="900" y="468" font-size="10" fill="#334155">能回答「当时读到哪一版」</text>

  <rect x="734" y="486" width="412" height="34" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="748" y="508" font-size="10" font-weight="700" fill="#166534">闸 3　声明它不是什么</text>
  <text x="900" y="508" font-size="10" fill="#334155">语义审阅未执行 / 不代表零过期</text>

  <rect x="734" y="526" width="412" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="748" y="548" font-size="10" font-weight="700" fill="#991b1b">闸 4　不冒充门禁 ★最致命</text>
  <text x="900" y="548" font-size="10" fill="#991b1b">真模型档写「不进 pnpm test」</text>

  <!-- ============ bottom ============ -->
  <rect x="40" y="592" width="532" height="152" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="58" y="616" font-size="12" font-weight="700" fill="#991b1b">什么时候不该沉淀</text>
  <text x="58" y="640" font-size="10" fill="#334155">▸ 一次性的排查 → 留证据目录就够</text>
  <text x="58" y="660" font-size="10" fill="#334155">▸ 判据还没校准 → 沉淀错判据 = 把 bug 固化成「正确」</text>
  <text x="58" y="680" font-size="10" fill="#334155">▸ 它探的是「这次部署」→ 部署状态不是代码资产</text>
  <text x="58" y="700" font-size="10" fill="#334155">▸ 只在你机器上有意义 → 缺前置就 BLOCKED，沉进 CI 只会长期红</text>
  <text x="58" y="726" font-size="10" fill="#991b1b">纪律反面：「能进基线的不另立脚本」—— 两个家就有两个真相</text>

  <rect x="608" y="592" width="552" height="152" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="626" y="616" font-size="12" font-weight="700" fill="#166534">为什么这一步值得做</text>
  <text x="626" y="640" font-size="10" fill="#334155">人手探索完，知识留在脑子里，出门就丢。</text>
  <text x="626" y="660" font-size="10" fill="#334155">探针探索完，五层里有两层能进 git：</text>
  <text x="626" y="682" font-size="10" fill="#166534">② 判据（129 行纯函数）＋ ⑤ 测试（16 个用例）</text>
  <text x="626" y="704" font-size="10" fill="#334155">下一个 agent 三十秒内就能读懂、决定跑不跑；</text>
  <text x="626" y="726" font-size="10" fill="#334155">同一次失手，不会再犯第二次。</text>

  <!-- ============ final line ============ -->
  <rect x="40" y="762" width="1120" height="96" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="60" y="788" font-size="13" font-weight="700" fill="#92400e">一句话：探针不是「一个东西」，是「一捆东西」</text>
  <text x="60" y="812" font-size="11" fill="#991b1b">✗ 整条脚本塞进 CI —— 你只是给自己造了一个会随机红的门</text>
  <text x="60" y="832" font-size="11" fill="#166534">✓ 把「判据」抽成纯函数、把「标本」冻住带哈希 —— 探针与测试就成了同一个判据的两个调用方</text>
  <text x="60" y="851" font-size="10" fill="#64748b">「是不是回归测试」由它有没有 keyless 的判据入口决定，不由它跑过多少次决定。</text>
</svg>
