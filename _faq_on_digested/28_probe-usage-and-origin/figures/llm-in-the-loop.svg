<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>Coding Agent 在探针闭环中的角色分工：负责读日志与校准尺子，绝不负责做 Pass/Fail 裁判</title>
  <desc>上半展示一次完整探针诊断的七个步骤及执行主体：Agent 负责读日志定位断点、提出假设、编写窄视口或多路并行构造条件；探针脚本机械运行取证；硬编码确定性判据负责裁决 Pass/Fail；Agent 协助校准过严或失准的旧判据；人工审阅 diff 后更新基线。下半左侧对比人工与 Agent 读取长轨迹的效率及 83 个真实探针统计（0 个调 LLM 做判定），右侧说明将判定交给大模型会因采样波动丧失可复现性。</desc>
  <defs>
    <marker id="llm-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="llm-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/></marker>
    <marker id="llm-c" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#ea580c"/></marker>
  </defs>

  <rect width="1200" height="660" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Coding Agent 在探针循环里的分工边界</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">让 Agent 读千行日志、写构造脚本、校准尺子；把 Pass / Fail 裁决严格留给确定性代码</text>

  <!-- Legend -->
  <rect x="40" y="72" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="60" y="83" font-size="11" fill="#1d4ed8">Coding Agent 擅长</text>
  <rect x="190" y="72" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="210" y="83" font-size="11" fill="#166534">探针脚本机械执行</text>
  <rect x="336" y="72" width="14" height="14" rx="3" fill="#ea580c"/>
  <text x="356" y="83" font-size="11" fill="#92400e">确定性代码判据（严禁调 LLM）</text>
  <rect x="548" y="72" width="14" height="14" rx="3" fill="#475569"/>
  <text x="568" y="83" font-size="11" fill="#334155">人类开发者把关</text>

  <!-- 7-step band -->
  <path d="M946 144 L946 124 Q946 118 938 118 L120 118 Q112 118 112 124 L112 142" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#llm-a)"/>
  <text x="530" y="110" text-anchor="middle" font-size="10" fill="#1d4ed8">发现旧判据过严或失准后，修正尺子重新验证 —— Agent 让多轮追问成本降了两个数量级</text>

  <rect x="40" y="146" width="146" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="113" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">① 读日志找断点</text>
  <text x="113" y="192" text-anchor="middle" font-size="10" fill="#334155">揪出缺失 tool/result</text>
  <text x="113" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Agent</text>

  <line x1="186" y1="190" x2="198" y2="190" stroke="#2563eb" stroke-width="1.8" marker-end="url(#llm-a)"/>

  <rect x="202" y="146" width="146" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="275" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">② 提出故障假设</text>
  <text x="275" y="192" text-anchor="middle" font-size="10" fill="#334155">定位窄屏折叠或配置漏挂</text>
  <text x="275" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Agent</text>

  <line x1="348" y1="190" x2="360" y2="190" stroke="#2563eb" stroke-width="1.8" marker-end="url(#llm-a)"/>

  <rect x="364" y="146" width="150" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="439" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">③ 构造复现条件</text>
  <text x="439" y="192" text-anchor="middle" font-size="10" fill="#334155">360px 窄视口 / 多路并行</text>
  <text x="439" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Agent</text>

  <line x1="514" y1="190" x2="526" y2="190" stroke="#2563eb" stroke-width="1.8" marker-end="url(#llm-a)"/>

  <rect x="530" y="146" width="146" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="603" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">④ 机械运行取证</text>
  <text x="603" y="192" text-anchor="middle" font-size="10" fill="#334155">采集日志、ARIA 与产物</text>
  <text x="603" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">探针脚本</text>

  <line x1="676" y1="190" x2="688" y2="190" stroke="#16a34a" stroke-width="1.8" marker-end="url(#llm-b)"/>

  <rect x="692" y="140" width="166" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="775" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">⑤ 确定性裁决</text>
  <text x="775" y="188" text-anchor="middle" font-size="10" fill="#334155">同输入 + 同判据 = 同退出码</text>
  <text x="775" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">严禁调模型拍脑袋</text>
  <text x="775" y="226" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">硬编码代码判据</text>

  <line x1="858" y1="190" x2="870" y2="190" stroke="#ea580c" stroke-width="1.8" marker-end="url(#llm-c)"/>

  <rect x="874" y="146" width="144" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="946" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">⑥ 校准误报尺子</text>
  <text x="946" y="192" text-anchor="middle" font-size="10" fill="#334155">修正过严或失准判据</text>
  <text x="946" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Agent</text>

  <line x1="1018" y1="190" x2="1030" y2="190" stroke="#2563eb" stroke-width="1.8" marker-end="url(#llm-a)"/>

  <rect x="1034" y="146" width="126" height="88" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="1097" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⑦ 审阅写基线</text>
  <text x="1097" y="192" text-anchor="middle" font-size="10" fill="#334155">人工逐行审 diff</text>
  <text x="1097" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">人类把关</text>

  <!-- Bottom Left: Efficiency + 83 stats -->
  <rect x="40" y="262" width="544" height="264" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="290" font-size="13" font-weight="700" fill="#0f172a">为什么有了 Coding Agent，探针工作法格外高效？</text>
  <text x="64" y="318" font-size="11" fill="#475569">▸ 人肉眼读日志：遇到两千行长轨迹极易漏看放弃，甚至只起裸前端误判正常（0003）。</text>
  <text x="64" y="344" font-size="11" fill="#1d4ed8">▸ Agent 辅助读日志：秒级通读数千行事件流，把后端 tool/call 与前端 ARIA 树逐条</text>
  <text x="64" y="366" font-size="11" fill="#1d4ed8">  交叉对账，还能识别惰性加载等合法行为、及时帮人修正写歪的旧判据。</text>

  <rect x="64" y="394" width="496" height="108" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="84" y="420" font-size="12" font-weight="700" fill="#166534">真实样本盘点：外部插件仓 83 个探针脚本实测统计</text>
  <text x="84" y="446" font-size="11" font-weight="700" fill="#991b1b">• 调用大模型做 Pass / Fail 裁决的脚本数：0 个（严格为零）</text>
  <text x="84" y="470" font-size="11" fill="#334155">• 文件头写清判据与适用边界：50 个 ｜ 严格区分 0 / 1 / 2 退出码：59 个</text>
  <text x="84" y="490" font-size="10.5" fill="#64748b">• 脚本内全部本地请求均指向 CDP 浏览器端口或本地宿主 RPC，无在线推理裁决</text>

  <!-- Bottom Right: Red line -->
  <rect x="604" y="262" width="556" height="264" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="628" y="290" font-size="13" font-weight="700" fill="#991b1b">绝对不能跨过的两条红线</text>

  <text x="628" y="320" font-size="11.5" font-weight="700" fill="#7f1d1d">红线一：绝不在探针内调大模型判断 Pass 或 Fail</text>
  <text x="628" y="346" font-size="11" fill="#334155">▸ 破坏唯一可复现性：同一份日志跑两次可能给出相反裁决，“同夹具 + 同判据 = 同结论”</text>
  <text x="628" y="368" font-size="11" fill="#334155">  的工程底线当场失效；</text>
  <text x="628" y="394" font-size="11" fill="#334155">▸ 污染排障信号：一旦报红，无法区分是插件真坏了还是模型采样波动导致评语变化。</text>

  <line x1="628" y1="418" x2="1136" y2="418" stroke="#fecaca"/>

  <text x="628" y="446" font-size="11.5" font-weight="700" fill="#7f1d1d">红线二：绝不让 Agent 未经人工审阅直接覆盖测试基线</text>
  <text x="628" y="472" font-size="11" fill="#334155">▸ 执行 refresh 刷新快照或更新 expected 基线前，必须由人逐行审阅 git diff，</text>
  <text x="628" y="494" font-size="11" fill="#334155">  防止把报错输出或残缺界面静默固化成新的“合法标准答案”。</text>

  <!-- Footer -->
  <rect x="40" y="548" width="1120" height="86" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="64" y="578" font-size="12.5" font-weight="700" fill="#92400e">一句话分清人机职责：探针把黑盒运行变成可读事实，Agent 帮你高效读完并改准尺子，确定性代码一锤定音</text>
  <text x="64" y="606" font-size="11" fill="#475569">复杂结构校验稳定后，把硬编码判据抽成纯函数配静态样本放进 pnpm test（毫秒级执行），再清理掉旧的临时探针脚本。</text>
</svg>
