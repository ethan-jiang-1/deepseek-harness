<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>标准场景目录结构、沉淀快照基线的四道安全门与三条去路</title>
  <desc>左列以 snapshots/web/minimal-preset/ 为例展示标准场景目录内的会话轨迹、系统提示词、工具 Schema、浏览器 ARIA 树与 snapshot.yml 契约文件；中列展示探针沉淀为快照基线前必须通过的四道安全门（显式 refresh 唯一写路径、动态字段令牌化、写入前运行健康检查、workspace.expected 独立维护不自动覆盖）；右列展示探针产出的三条去路（一次性排障即删、沉淀进 snapshots/、抽纯函数进 pnpm test）。</desc>
  <defs>
    <marker id="sg-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/></marker>
    <marker id="sg-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1200" height="650" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">从探针观察到快照基线：目录长相、四道门与三条去路</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">探针取回的原始产物与主仓 snapshots/ 同构；区别只在于是否经过归一化与安全校验锁入 Git 基线</text>

  <text x="40" y="88" font-size="12" font-weight="700" fill="#334155">① 毕业后的标准场景目录长什么样</text>
  <text x="436" y="88" font-size="12" font-weight="700" fill="#b45309">② 沉淀进基线前必须守住的四道门</text>
  <text x="864" y="88" font-size="12" font-weight="700" fill="#1d4ed8">③ 查清问题后探针的三条去路</text>

  <!-- Col 1: Directory -->
  <rect x="40" y="100" width="376" height="404" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="126" font-size="11.5" font-weight="700" fill="#0f172a">snapshots/web/minimal-preset/</text>

  <text x="60" y="156" font-size="11" font-weight="700" fill="#0f766e">├─ session.v4.jsonl</text>
  <text x="80" y="176" font-size="10.5" fill="#475569">归一化会话轨迹（含 {{system}} 与 {{tools}} 占位符）</text>

  <text x="60" y="206" font-size="11" font-weight="700" fill="#0f766e">├─ system-prompt.expected.md</text>
  <text x="80" y="226" font-size="10.5" fill="#475569">来自 system/message 的完整渲染后系统提示词</text>

  <text x="60" y="256" font-size="11" font-weight="700" fill="#0f766e">├─ tool-schemas.expected.json</text>
  <text x="80" y="276" font-size="10.5" fill="#475569">来自 request/header 的完整工具 JSON Schema 数组</text>

  <text x="60" y="306" font-size="11" font-weight="700" fill="#0f766e">├─ ui.expected.md</text>
  <text x="80" y="326" font-size="10.5" fill="#475569">真浏览器采集的 31 行 ARIA 可访问性语义节点树</text>

  <text x="60" y="356" font-size="11" font-weight="700" fill="#0f766e">└─ snapshot.yml</text>
  <text x="80" y="376" font-size="10.5" fill="#475569">声明 profile、录制策略与 header.pin: true 独占展开</text>
  <text x="80" y="394" font-size="10" fill="#64748b">（涉及副作用的场景另带独立 workspace.expected/）</text>

  <rect x="60" y="418" width="336" height="66" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="78" y="442" font-size="10.5" font-weight="700" fill="#0f766e">多切面证据彼此咬合对账：</text>
  <text x="78" y="462" font-size="10.5" fill="#334155">后端日志里的 tool/call ↔ 前端 ARIA 里的 Bash 展开卡片</text>

  <!-- Col 2: 4 Gates -->
  <rect x="436" y="100" width="404" height="404" rx="10" fill="#fffbeb" stroke="#fcd34d"/>

  <rect x="456" y="118" width="364" height="82" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="474" y="140" font-size="11" font-weight="700" fill="#92400e">门一 · 显式 refresh 是唯一写盘路径</text>
  <text x="474" y="160" font-size="10.5" fill="#334155">日常 replay 缺基线必须直接抛错，严禁悄悄自举生成；</text>
  <text x="474" y="180" font-size="10" font-family="ui-monospace, monospace" fill="#b45309">only DSH_SNAPSHOT=refresh | record writes golden</text>

  <rect x="456" y="212" width="364" height="66" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="474" y="234" font-size="11" font-weight="700" fill="#92400e">门二 · 动态字段彻底令牌化</text>
  <text x="474" y="254" font-size="10.5" fill="#334155">将时间、耗时、路径替换为 {{clock}} / {{duration}} / {{cwd}}</text>

  <rect x="456" y="290" width="364" height="82" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="474" y="312" font-size="11" font-weight="700" fill="#92400e">门三 · 刷新前先核实当次运行真没坏</text>
  <text x="474" y="332" font-size="10.5" fill="#334155">校验无 UNKNOWN_TOOL、无控制台报错与白屏，人工审 diff</text>
  <text x="474" y="352" font-size="10" fill="#b91c1c">警钟：postmortem 0002 险些把工具被禁的坏轨迹刷成新基线</text>

  <rect x="456" y="384" width="364" height="98" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="474" y="406" font-size="11" font-weight="700" fill="#991b1b">门四 · 外部副作用预期（workspace.expected/）独立锁死</text>
  <text x="474" y="428" font-size="10.5" fill="#334155">真实目录终态与审计计数由人工独立编写维护；</text>
  <text x="474" y="448" font-size="10.5" fill="#991b1b">record 与 refresh 命令永远不会自动覆盖重写它，</text>
  <text x="474" y="468" font-size="10" fill="#64748b">确保外部世界校验绝不被被测程序自己的输出带偏。</text>

  <!-- Col 3: 3 Destinations -->
  <rect x="864" y="100" width="296" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="884" y="126" font-size="12" font-weight="700" fill="#0f172a">去路 A · 排完即删</text>
  <text x="884" y="148" font-size="10.5" fill="#475569">针对一次性配置乌龙或第三方接口摸底</text>
  <text x="884" y="168" font-size="10.5" fill="#475569">修完 bug 直接清理，不进测试套件</text>
  <text x="884" y="196" font-size="10" fill="#64748b">维护成本：零</text>

  <rect x="864" y="236" width="296" height="128" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="884" y="262" font-size="12" font-weight="700" fill="#166534">去路 B · 毕业进 snapshots/</text>
  <text x="884" y="284" font-size="10.5" fill="#334155">适合高频迭代怕改坏的提示词拼装、</text>
  <text x="884" y="304" font-size="10.5" fill="#334155">工具暴露集合与关键前端卡片渲染</text>
  <text x="884" y="328" font-size="10" font-weight="700" fill="#166534">过完左侧四道门后入库，由 CI diff 守门</text>
  <text x="884" y="346" font-size="10" fill="#64748b">毕业后删除旧探针脚本，避免双份维护</text>

  <rect x="864" y="380" width="296" height="124" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="884" y="406" font-size="12" font-weight="700" fill="#1d4ed8">去路 C · 抽纯函数进 pnpm test</text>
  <text x="884" y="428" font-size="10.5" fill="#334155">若探针沉淀了复杂的结构或合规校验逻辑：</text>
  <text x="884" y="448" font-size="10.5" fill="#334155">抽成不启进程、不连网络的纯函数，</text>
  <text x="884" y="468" font-size="10.5" fill="#1d4ed8">把真实样本存为静态夹具，毫秒级跑单测</text>

  <line x1="842" y1="300" x2="860" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#sg-a)"/>

  <!-- Bottom takeaway -->
  <rect x="40" y="528" width="1120" height="96" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/>
  <text x="64" y="556" font-size="12.5" font-weight="700" fill="#0f766e">一句话记住四个文件各自替你盯住哪一层事实：</text>
  <text x="64" y="580" font-size="11" fill="#334155">session.v4.jsonl 记录「会话内部流转了什么」 · system-prompt / tool-schemas 记录「模型收到了什么」 · ui.expected.md 记录「用户眼睛看到了什么」</text>
  <text x="64" y="602" font-size="11" fill="#334155">workspace.expected/ 记录「外部真实世界被改成了什么样」—— 探针负责第一次看清真相，基线负责往后每一次改动不退步。</text>
</svg>
