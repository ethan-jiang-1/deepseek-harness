<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>六步探索的完整链条：每一步探针给你什么、没有它会怎样</title>
  <desc>纵向六条带，从上到下是探索的六个步骤。每条带分三列：左边是这一步你自己做的那件事，中间是探针在这一步交给你什么，右边是如果没有探针你会掉进哪个坑。第一步观察：探针给你一份不判的完整读数，没有它就只能靠肉眼看界面或读模型自述。第二步形成假设：探针只保证事实为真，没有它假设建立在流沙上。第三步造条件：探针让你在真系统里制造窄视口、真并发、注入挂起，没有它你只能在假世界里构造条件或者根本造不出来。第四步取证：探针给你 verdict 加截图加日志三件套，没有它知识留在脑子里出了门就丢。第五步校准判据：探针让尺子可以被推翻并记录在案，没有它你会把仪表反挂当成产品坏了。第六步毕业：探针配上基线从此由 diff 说话，没有它每一次探索都要重来。底部一条汇总：前四步决定你探得到什么，后两步决定探索成果能不能留下来。</desc>
  <defs>
    <marker id="steps-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0f766e"/></marker>
  </defs>

  <rect width="1200" height="820" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">六步探索：探针每一步交给你什么，没有它会掉进哪个坑</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">前四步决定你「探得到什么」，后两步决定探索成果「能不能留下来」</text>

  <!-- column headers -->
  <text x="60" y="92" font-size="11" font-weight="700" fill="#334155">这一步你自己做的</text>
  <text x="430" y="92" font-size="11" font-weight="700" fill="#0f766e">探针交给你什么</text>
  <text x="830" y="92" font-size="11" font-weight="700" fill="#b91c1c">没有探针会怎样</text>

  <!-- ============ step 1 ============ -->
  <rect x="40" y="102" width="1120" height="98" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <circle cx="70" cy="132" r="14" fill="#0f766e"/>
  <text x="70" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="96" y="137" font-size="13" font-weight="700" fill="#0f766e">观察 —— 先看，不判</text>
  <text x="60" y="164" font-size="10" fill="#334155">你还不知道哪里不对，</text>
  <text x="60" y="181" font-size="10" fill="#334155">所以先说「给我看看现在是什么样」</text>
  <line x1="410" y1="112" x2="410" y2="190" stroke="#5eead4"/>
  <text x="430" y="164" font-size="10" fill="#0f766e">一份不判的完整读数：</text>
  <text x="430" y="181" font-size="10" fill="#334155">visibleText / textOutline / controls / consoleErrors</text>
  <line x1="810" y1="112" x2="810" y2="190" stroke="#fca5a5"/>
  <text x="830" y="164" font-size="10" fill="#991b1b">只能肉眼看界面 + 读模型自述 ——</text>
  <text x="830" y="181" font-size="10" fill="#334155">那正是 postmortem 0003 栽的地方</text>

  <!-- ============ step 2 ============ -->
  <rect x="40" y="212" width="1120" height="98" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="70" cy="242" r="14" fill="#64748b"/>
  <text x="70" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="96" y="247" font-size="13" font-weight="700" fill="#334155">形成假设 —— 这一步是人的工作</text>
  <text x="60" y="274" font-size="10" fill="#334155">「controls 里少了那个按钮」</text>
  <text x="60" y="291" font-size="10" fill="#334155">→ 假设：窄视口下它没被渲染</text>
  <line x1="410" y1="222" x2="410" y2="300" stroke="#cbd5e1"/>
  <text x="430" y="274" font-size="10" fill="#64748b">探针自己不产出假设 ——</text>
  <text x="430" y="291" font-size="10" fill="#334155">它只保证你手上的事实是真的</text>
  <line x1="810" y1="222" x2="810" y2="300" stroke="#fca5a5"/>
  <text x="830" y="274" font-size="10" fill="#991b1b">假设建立在流沙上：</text>
  <text x="830" y="291" font-size="10" fill="#334155">你以为是 A，其实是读数本身就不对</text>

  <!-- ============ step 3 ============ -->
  <rect x="40" y="322" width="1120" height="98" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="70" cy="352" r="14" fill="#1d4ed8"/>
  <text x="70" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="96" y="357" font-size="13" font-weight="700" fill="#1d4ed8">造条件 —— 逼出那个状态</text>
  <text x="60" y="384" font-size="10" fill="#334155">setViewportSize({width:360})</text>
  <text x="60" y="401" font-size="10" fill="#334155">Promise.all([...]) / [{kind:'hang'}]</text>
  <line x1="410" y1="332" x2="410" y2="410" stroke="#93c5fd"/>
  <text x="430" y="384" font-size="10" fill="#1d4ed8">在真系统里制造那个条件 ——</text>
  <text x="430" y="401" font-size="10" fill="#334155">包括你根本写不出来的真时序</text>
  <line x1="810" y1="332" x2="810" y2="410" stroke="#fca5a5"/>
  <text x="830" y="384" font-size="10" fill="#991b1b">只能在假世界里构造条件，</text>
  <text x="830" y="401" font-size="10" fill="#334155">或者那个条件压根造不出来</text>

  <!-- ============ step 4 ============ -->
  <rect x="40" y="432" width="1120" height="98" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <circle cx="70" cy="462" r="14" fill="#b45309"/>
  <text x="70" y="467" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="96" y="467" font-size="13" font-weight="700" fill="#92400e">取证 —— 最大的浪费是没留下</text>
  <text x="60" y="494" font-size="10" fill="#334155">「这个现象我要留住」</text>
  <text x="60" y="511" font-size="10" fill="#334155">否则下次还得从头探一遍</text>
  <line x1="410" y1="442" x2="410" y2="520" stroke="#fcd34d"/>
  <text x="430" y="494" font-size="10" fill="#92400e">三件套：verdict.json + 截图 + console.log，</text>
  <text x="430" y="511" font-size="10" fill="#334155">判决带 sessionId，缺前置一律 BLOCKED</text>
  <line x1="810" y1="442" x2="810" y2="520" stroke="#fca5a5"/>
  <text x="830" y="494" font-size="10" fill="#991b1b">知识留在脑子里，出了门就丢 ——</text>
  <text x="830" y="511" font-size="10" fill="#334155">你探到的一切变成一次性的口头记忆</text>

  <!-- ============ step 5 ============ -->
  <rect x="40" y="542" width="1120" height="98" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <circle cx="70" cy="572" r="14" fill="#991b1b"/>
  <text x="70" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="96" y="577" font-size="13" font-weight="700" fill="#991b1b">校准判据 —— 你的尺子可能是错的</text>
  <text x="60" y="604" font-size="10" fill="#334155">探到的结果和你预期不一样，</text>
  <text x="60" y="621" font-size="10" fill="#334155">先怀疑尺子，别急着骂产品</text>
  <line x1="410" y1="552" x2="410" y2="630" stroke="#fca5a5"/>
  <text x="430" y="604" font-size="10" fill="#991b1b">判据可以被推翻，并记在案：</text>
  <text x="430" y="621" font-size="10" fill="#334155">日期 + 校准记录 + 被什么证据推翻</text>
  <line x1="810" y1="552" x2="810" y2="630" stroke="#fca5a5"/>
  <text x="830" y="604" font-size="10" fill="#991b1b">仪表反挂：旧判据「占位=PASS」</text>
  <text x="830" y="621" font-size="10" fill="#334155">把正确行为判红，你会去修好代码</text>

  <!-- ============ step 6 ============ -->
  <rect x="40" y="652" width="1120" height="98" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <circle cx="70" cy="682" r="14" fill="#166534"/>
  <text x="70" y="687" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <text x="96" y="687" font-size="13" font-weight="700" fill="#166534">毕业 —— 变成防线</text>
  <text x="60" y="714" font-size="10" fill="#334155">「这条以后别再犯了」</text>
  <text x="60" y="731" font-size="10" fill="#334155">DSH_SNAPSHOT=refresh 写基线</text>
  <line x1="410" y1="662" x2="410" y2="740" stroke="#86efac"/>
  <text x="430" y="714" font-size="10" fill="#166534">从今往后由 diff 说话，</text>
  <text x="430" y="731" font-size="10" fill="#334155">人再也不用读它（但必须先过语义断言）</text>
  <line x1="810" y1="662" x2="810" y2="740" stroke="#fca5a5"/>
  <text x="830" y="714" font-size="10" fill="#991b1b">每一次探索都要重来一遍，</text>
  <text x="830" y="731" font-size="10" fill="#334155">同一个 bug 可以犯第二次</text>

  <!-- vertical flow arrows -->
  <line x1="70" y1="190" x2="70" y2="208" stroke="#0f766e" stroke-width="2" marker-end="url(#steps-a)"/>
  <line x1="70" y1="300" x2="70" y2="318" stroke="#94a3b8" stroke-width="2" marker-end="url(#steps-a)"/>
  <line x1="70" y1="410" x2="70" y2="428" stroke="#2563eb" stroke-width="2" marker-end="url(#steps-a)"/>
  <line x1="70" y1="520" x2="70" y2="538" stroke="#b45309" stroke-width="2" marker-end="url(#steps-a)"/>
  <line x1="70" y1="630" x2="70" y2="648" stroke="#b91c1c" stroke-width="2" marker-end="url(#steps-a)"/>

  <!-- bottom summary -->
  <rect x="40" y="764" width="1120" height="44" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="60" y="784" font-size="11" font-weight="700" fill="#92400e">前四步（1–4）决定你「探得到什么」　·　后两步（5–6）决定探索成果「能不能留下来」</text>
  <text x="60" y="801" font-size="10" fill="#334155">只做 1–3 步，探索就只是调试；加上 4 才是探针；补齐 5–6 才变成资产。</text>
</svg>
