<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>五级台阶：从一句话爬到整套，每级只多一件事</title>
  <desc>阶梯图，从下往上五级加一级可选项。第一级一句话：探针就是让系统真跑一次，把跑出来的东西留下，然后你去看，两分钟。第二级读一份别人跑出来的现成证据，打开一份会话日志只读两行，十分钟，学到日志可读且工具调用与结果成对。第三级问模型收到了什么，多知道一件事：提示词住在 system/message，工具 schema 住在 request/header，两个地方，二十分钟。第四级自己跑一次并主动造条件：改视口、真并发、注入挂起或抛错，三十分钟，学到探针能逼出平常碰不到的状态，代价是更贵更不稳。第五级配基线让它以后自己红，一小时，学到探针和快照相隔的只是有没有 base。第六级可选，攒成一套组织纪律，半天到几天。最上方一个可跳过的分支标记原理与词源。右侧轴线标注时间和新增的一件事。</desc>
  <defs>
    <marker id="lad-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0f766e"/></marker>
    <marker id="lad-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1200" height="820" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">五级台阶：每级只多一件事，读完一级就能停</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">不要从最深的那篇开始读 —— 按台阶爬，每级都标着「什么时候该往下一级」</text>

  <!-- axis -->
  <line x1="70" y1="120" x2="70" y2="740" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">难</text>
  <text x="70" y="758" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">易</text>

  <!-- Step 6 (top) -->
  <rect x="100" y="120" width="700" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 3"/>
  <text x="118" y="144" font-size="13" font-weight="700" fill="#475569">第 6 级 · 攒成一套</text>
  <text x="118" y="166" font-size="11" fill="#334155">什么时候写一条新的、放哪、什么时候合并、什么时候删</text>
  <text x="118" y="186" font-size="10" fill="#64748b">三条经验：能进基线的不另立脚本 · 文件头必须写「证明什么 / 不证明什么 / 何时跑」 · 一次性探针要标一次性</text>
  <rect x="818" y="120" width="342" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="836" y="144" font-size="11" font-weight="700" fill="#475569">时间：半天 ~ 几天</text>
  <text x="836" y="166" font-size="10" fill="#334155">新增：组织纪律</text>
  <text x="836" y="186" font-size="10" fill="#64748b">不是技术问题 —— 探针目录会腐烂，靠纪律不靠热情</text>

  <!-- Step 5 -->
  <rect x="100" y="222" width="700" height="82" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="118" y="246" font-size="13" font-weight="700" fill="#166534">第 5 级 · 让它变成防线</text>
  <text x="118" y="268" font-size="11" fill="#334155">配上基线，以后它自己红；写之前要过四道门</text>
  <text x="118" y="288" font-size="10" fill="#64748b">DSH_SNAPSHOT=refresh 是唯一写路径 · replay 缺基线必须报错，绝不悄悄自举</text>
  <rect x="818" y="222" width="342" height="82" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="836" y="246" font-size="11" font-weight="700" fill="#166534">时间：1 小时</text>
  <text x="836" y="268" font-size="10" fill="#334155">新增：探针和快照是同一个东西的两个阶段</text>
  <text x="836" y="288" font-size="10" fill="#64748b">区别只在「有没有 base」</text>

  <!-- Step 4 -->
  <rect x="100" y="324" width="700" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="118" y="348" font-size="13" font-weight="700" fill="#1d4ed8">第 4 级 · 自己跑，并且主动造条件</text>
  <text x="118" y="370" font-size="11" fill="#334155">改视口看窄屏 · 同时开两扇门看撞不撞 · 让模型抛错或挂起看怎么收场</text>
  <text x="118" y="390" font-size="10" fill="#64748b">await page.setViewportSize({width:360,height:700}) ｜ Promise.all([openDoor('a'),openDoor('b')]) ｜ [{"kind":"hang"}]</text>
  <rect x="818" y="324" width="342" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="836" y="348" font-size="11" font-weight="700" fill="#1d4ed8">时间：30 分钟</text>
  <text x="836" y="370" font-size="10" fill="#334155">新增：探针能「造条件」，不只是观察</text>
  <text x="836" y="390" font-size="10" fill="#991b1b">代价：更贵、更不稳 —— 所以有成本次序</text>

  <!-- Step 3 -->
  <rect x="100" y="426" width="700" height="82" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="118" y="450" font-size="13" font-weight="700" fill="#0f766e">第 3 级 · 问「模型收到了什么」</text>
  <text x="118" y="472" font-size="11" fill="#334155">多知道一件事：该翻哪一页</text>
  <text x="118" y="492" font-size="10" fill="#991b1b">提示词住 system/message ｜ 工具 schema 住 request/header —— 去 header 里找 system 找不到 ≠ 提示词没进请求</text>
  <rect x="818" y="426" width="342" height="82" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="836" y="450" font-size="11" font-weight="700" fill="#0f766e">时间：20 分钟</text>
  <text x="836" y="472" font-size="10" fill="#334155">新增：请求侧有存档，且住在两个地方</text>
  <text x="836" y="492" font-size="10" fill="#64748b">读完能一句话回答「模型看没看到这段」</text>

  <!-- Step 2 -->
  <rect x="100" y="528" width="700" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="552" font-size="13" font-weight="700" fill="#334155">第 2 级 · 读一份现成的证据</text>
  <text x="118" y="574" font-size="11" fill="#334155">打开 snapshots/session/bash-tool-turn/session.v4.jsonl，只读两行</text>
  <text x="118" y="594" font-size="10" fill="#64748b">{"type":"tool/call","data":{"name":"bash","arguments":"{\"command\": \"echo TERMINAL_OK\"}"}}</text>
  <rect x="818" y="528" width="342" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="836" y="552" font-size="11" font-weight="700" fill="#334155">时间：10 分钟</text>
  <text x="836" y="574" font-size="10" fill="#334155">新增：日志可读；call 与 result 成对</text>
  <text x="836" y="594" font-size="10" fill="#64748b">= 工具真跑了，不是「模型说它跑了」</text>

  <!-- Step 1 -->
  <rect x="100" y="630" width="700" height="82" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="118" y="654" font-size="13" font-weight="700" fill="#334155">第 1 级 · 一句话</text>
  <text x="118" y="678" font-size="13" fill="#0f766e">探针 = 让系统真跑一次，把跑出来的东西原样留下，然后你去看。</text>
  <text x="118" y="698" font-size="10" fill="#64748b">先不要管它和测试的区别、要不要进 CI、该放哪个目录</text>
  <rect x="818" y="630" width="342" height="82" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="836" y="654" font-size="11" font-weight="700" fill="#0f766e">时间：2 分钟</text>
  <text x="836" y="678" font-size="10" fill="#334155">就读这一句就够</text>
  <text x="836" y="698" font-size="10" fill="#64748b">知道「遇到说不清的事，先跑一次」</text>

  <!-- connectors -->
  <line x1="450" y1="630" x2="450" y2="616" stroke="#0f766e" stroke-width="2" marker-end="url(#lad-a)"/>
  <line x1="450" y1="528" x2="450" y2="514" stroke="#0f766e" stroke-width="2" marker-end="url(#lad-a)"/>
  <line x1="450" y1="426" x2="450" y2="412" stroke="#0f766e" stroke-width="2" marker-end="url(#lad-a)"/>
  <line x1="450" y1="324" x2="450" y2="310" stroke="#16a34a" stroke-width="2" marker-end="url(#lad-a)"/>
  <line x1="450" y1="222" x2="450" y2="208" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#lad-b)"/>

  <!-- skip branches -->
  <rect x="100" y="742" width="1060" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="118" y="764" font-size="11" font-weight="700" fill="#92400e">两支可以先跳过的旁支（不是台阶，是参考答案）：</text>
  <text x="118" y="784" font-size="11" fill="#334155">「为什么这件不严谨的事成立」看 04 三条不变量　·　「这是不是 DSH 的官方术语」看 03 词源 —— 两者都不影响你会用探针；等有人问起时再翻。</text>

  <!-- right: what you can stop at -->
  <rect x="818" y="742" width="342" height="56" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="836" y="764" font-size="11" font-weight="700" fill="#0f766e">每级都能停</text>
  <text x="836" y="784" font-size="10" fill="#334155">停在哪一级，取决于你要回答哪一句</text>
</svg>
