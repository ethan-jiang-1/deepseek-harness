<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>一根会话日志与四个取证切面：探针解剖图</title>
  <desc>最上方为探针标准执行四步（真实 Profile 装配 → 驱动一轮交互 → 同步采集会话事件与 UI/产物快照 → 人工审阅或固化为快照断言）。中间为 bash-tool-turn/session.v4.jsonl 真实事件时间轴，标明 system/message 与 request/header 分离存储系统提示词与工具 Schema。下方并列四个取证切面卡片：只读会话轨迹、请求侧双存档、真浏览器 ARIA 树、故障注入与工作区独立校验。</desc>
  <defs>
    <marker id="ta-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0f766e"/></marker>
    <marker id="ta-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/></marker>
    <marker id="ta-c" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1d4ed8"/></marker>
    <marker id="ta-d" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#991b1b"/></marker>
    <marker id="ta-g" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1200" height="650" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">探针解剖图：四步实证闭环与四个取证切面</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">基于主仓真实夹具（bash-tool-turn · minimal-preset · background-confinement-failure）</text>

  <!-- Step flow bar -->
  <rect x="40" y="74" width="256" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="168" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">1. 真实 Profile 插件装配</text>
  <line x1="298" y1="96" x2="322" y2="96" stroke="#64748b" stroke-width="1.8" marker-end="url(#ta-g)"/>

  <rect x="326" y="74" width="256" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="454" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">2. 驱动最小单轮交互（回放/真跑）</text>
  <line x1="584" y1="96" x2="608" y2="96" stroke="#64748b" stroke-width="1.8" marker-end="url(#ta-g)"/>

  <rect x="612" y="74" width="268" height="44" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.6"/>
  <text x="746" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">3. 同步采集会话事件与 UI/产物</text>
  <line x1="882" y1="96" x2="906" y2="96" stroke="#64748b" stroke-width="1.8" marker-end="url(#ta-g)"/>

  <rect x="910" y="74" width="250" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
  <text x="1035" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">4. 审阅定位或固化为快照断言</text>

  <!-- Session timeline band -->
  <rect x="40" y="136" width="1120" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="160" font-size="11" font-weight="700" fill="#475569">session.v4.jsonl 只追加事件时间轴（24 行真实记录，一行一个强类型事件）</text>

  <rect x="60" y="174" width="108" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="114" y="194" text-anchor="middle" font-size="10" fill="#334155">turn/start</text>

  <rect x="180" y="174" width="144" height="30" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="252" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e">system/message</text>

  <rect x="336" y="174" width="124" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="398" y="194" text-anchor="middle" font-size="10" fill="#334155">user/message</text>

  <rect x="472" y="174" width="144" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="544" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">request/header</text>

  <rect x="628" y="174" width="106" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="681" y="194" text-anchor="middle" font-size="10" fill="#334155">tool/call</text>

  <rect x="746" y="174" width="116" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="804" y="194" text-anchor="middle" font-size="10" fill="#334155">tool/result</text>

  <rect x="874" y="174" width="152" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="950" y="194" text-anchor="middle" font-size="10" fill="#334155">assistant/message</text>

  <rect x="1038" y="174" width="102" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1089" y="194" text-anchor="middle" font-size="10" fill="#334155">turn/end</text>

  <text x="60" y="232" font-size="10.5" fill="#0f766e" font-weight="700">▲ 系统提示词存于 system/message（第 0 节点）</text>
  <text x="368" y="232" font-size="10.5" fill="#b45309" font-weight="700">▲ 工具 Schema 存于 request/header</text>
  <text x="644" y="232" font-size="10.5" fill="#b91c1c">两者分居两条事件——去 header 里找 system 必扑空！</text>

  <!-- Connector arrows down to 4 cards -->
  <line x1="114" y1="254" x2="168" y2="288" stroke="#0f766e" stroke-width="2" marker-end="url(#ta-a)"/>
  <line x1="252" y1="254" x2="430" y2="288" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ta-a)"/>
  <line x1="544" y1="254" x2="480" y2="288" stroke="#b45309" stroke-width="1.8" marker-end="url(#ta-b)"/>
  <line x1="804" y1="254" x2="746" y2="288" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ta-c)"/>
  <line x1="1089" y1="254" x2="1026" y2="288" stroke="#991b1b" stroke-width="2" marker-end="url(#ta-d)"/>

  <!-- 4 Facet cards -->
  <rect x="40" y="294" width="268" height="206" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
  <text x="60" y="320" font-size="12" font-weight="700" fill="#166534">切面一 · 只读会话轨迹</text>
  <text x="60" y="344" font-size="10.5" fill="#475569">零进程启动，直接解析 .jsonl</text>
  <text x="60" y="372" font-size="10.5" fill="#334155">• 24 行事件类型计数是否齐全</text>
  <text x="60" y="394" font-size="10.5" fill="#334155">• 同一 callId 是否成对结算</text>
  <text x="60" y="416" font-size="10.5" fill="#334155">• isError: false 与 completed</text>
  <text x="60" y="452" font-size="10" font-weight="700" fill="#166534">九成“工具调没调、死在哪一步”</text>
  <text x="60" y="470" font-size="10" font-weight="700" fill="#166534">几秒内读日志即可当场结案</text>

  <rect x="324" y="294" width="268" height="206" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/>
  <text x="344" y="320" font-size="12" font-weight="700" fill="#0f766e">切面二 · 请求侧双存档</text>
  <text x="344" y="344" font-size="10.5" fill="#475569">展开提示词全文与工具定义数组</text>
  <text x="344" y="372" font-size="10.5" fill="#334155">• system-prompt.expected.md</text>
  <text x="344" y="394" font-size="10.5" fill="#334155">• tool-schemas.expected.json</text>
  <text x="344" y="416" font-size="10.5" fill="#334155">• 不同预设间直接跑文本 diff</text>
  <text x="344" y="452" font-size="10" font-weight="700" fill="#0f766e">多插件叠合后到底塞进或挤掉了</text>
  <text x="344" y="470" font-size="10" font-weight="700" fill="#0f766e">哪几行规则一目了然</text>

  <rect x="608" y="294" width="268" height="206" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="628" y="320" font-size="12" font-weight="700" fill="#1d4ed8">切面三 · 真浏览器 ARIA 树</text>
  <text x="628" y="344" font-size="10.5" fill="#475569">无头 Chrome 抓取真实渲染节点</text>
  <text x="628" y="372" font-size="10.5" fill="#334155">• ui.expected.md 语义节点树</text>
  <text x="628" y="394" font-size="10.5" fill="#334155">• 展开卡片与退出码文本对齐</text>
  <text x="628" y="416" font-size="10.5" fill="#334155">• 隐藏或崩溃节点绝不混入树中</text>
  <text x="628" y="452" font-size="10" font-weight="700" fill="#1d4ed8">跟后端日志逐条交叉对账，</text>
  <text x="628" y="470" font-size="10" font-weight="700" fill="#1d4ed8">一次钉死前后端投影断层</text>

  <rect x="892" y="294" width="268" height="206" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="912" y="320" font-size="12" font-weight="700" fill="#991b1b">切面四 · 外部副作用独立校验</text>
  <text x="912" y="344" font-size="10.5" fill="#475569">replay.override 故障注入 + 磁盘核对</text>
  <text x="912" y="372" font-size="10.5" fill="#334155">• confinement-audit.json 计数</text>
  <text x="912" y="394" font-size="10.5" fill="#991b1b">  confineCalls:1, spawnCalls:0</text>
  <text x="912" y="416" font-size="10.5" fill="#334155">• 危险文件确实未出现在工作区</text>
  <text x="912" y="452" font-size="10" font-weight="700" fill="#991b1b">靠操作系统级外部铁证证明</text>
  <text x="912" y="470" font-size="10" font-weight="700" fill="#991b1b">fail-closed，不信模型自述</text>

  <!-- Bottom rule -->
  <rect x="40" y="522" width="1120" height="100" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="64" y="550" font-size="12.5" font-weight="700" fill="#92400e">排障下钩顺序：先读现成日志（秒级零成本） → 再查请求双存档 → 涉及前端再开真浏览器 → 涉及安全边界必验外部工作区</text>
  <text x="64" y="576" font-size="11" fill="#334155">贯穿四个切面的两条准则：① model-visible ⟺ logged 保证请求侧完整落盘；② 验证外部世界而非自我汇报（Verify the world, not the self-report）。</text>
  <text x="64" y="600" font-size="10.5" fill="#64748b">动态字段（如 {{clock}}、{{duration}}、{{throughput}}、{{cwd}}）在固化为快照基线时统一归一化，消除跨机与时间波动噪音。</text>
</svg>
