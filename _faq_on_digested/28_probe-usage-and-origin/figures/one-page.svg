<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>一条请求链上的五个探针取证位置与三种归宿</title>
  <desc>上半展示从插件源码、Cordis 装配、模型请求、会话日志落盘到界面渲染与工作区副作用的完整链路；中半按成本从低到高列出五个取证位置（只读现成日志、查请求侧存档、真进程加回放、真浏览器 ARIA 树、故障注入查外部状态）；下半展示产出的三种归宿（临时调试排完即删、本地证据归档、把探针沉淀成回归基线）。</desc>
  <defs>
    <marker id="one-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0f766e"/></marker>
    <marker id="one-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1200" height="690" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">探针工作法全景：五个取证位置与三种归宿</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">与其对着几十层动态插件源码盲猜拼装结果，不如按成本从低到高直接读取真实运行产物</text>

  <!-- Band 1: Chain -->
  <text x="40" y="88" font-size="12" font-weight="700" fill="#334155">① 为什么光读静态源码不够：从插件代码到最终效果隔着多段动态拼装</text>

  <rect x="40" y="100" width="168" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="124" y="129" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">插件源码与配置</text>

  <line x1="208" y1="125" x2="228" y2="125" stroke="#64748b" stroke-width="1.8" marker-end="url(#one-b)"/>

  <rect x="232" y="100" width="192" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="328" y="129" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Loader 合成提示词与工具</text>

  <line x1="424" y1="125" x2="444" y2="125" stroke="#64748b" stroke-width="1.8" marker-end="url(#one-b)"/>

  <rect x="448" y="100" width="184" height="50" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.8"/>
  <text x="540" y="129" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">模型请求 / llm-replay</text>

  <line x1="632" y1="125" x2="652" y2="125" stroke="#64748b" stroke-width="1.8" marker-end="url(#one-b)"/>

  <rect x="656" y="100" width="192" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="752" y="129" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">工具派发与 JSONL 落盘</text>

  <line x1="848" y1="125" x2="868" y2="125" stroke="#64748b" stroke-width="1.8" marker-end="url(#one-b)"/>

  <rect x="872" y="100" width="288" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1016" y="129" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Web 界面渲染 ＋ 工作区外部终态</text>

  <!-- Band 2: Five hooks -->
  <text x="40" y="186" font-size="12" font-weight="700" fill="#334155">② 五个取证位置（成本从左到右递增——永远先用最轻的一档，够回答问题就停）</text>

  <rect x="40" y="202" width="212" height="142" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
  <text x="58" y="226" font-size="12" font-weight="700" fill="#166534">① 只读现成日志</text>
  <text x="58" y="250" font-size="10.5" fill="#334155">查事件序列、callId 成对</text>
  <text x="58" y="268" font-size="10.5" fill="#334155">与 isError: false</text>
  <text x="58" y="298" font-size="10" fill="#64748b">成本：秒级 · 零进程启动</text>
  <text x="58" y="320" font-size="10" font-weight="700" fill="#166534">答：到底跑到哪一步断了</text>

  <rect x="267" y="202" width="212" height="142" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/>
  <text x="285" y="226" font-size="12" font-weight="700" fill="#0f766e">② 查请求侧存档</text>
  <text x="285" y="250" font-size="10.5" fill="#334155">system/message 提示词</text>
  <text x="285" y="268" font-size="10.5" fill="#334155">+ request/header 工具集</text>
  <text x="285" y="298" font-size="10" fill="#64748b">成本：秒级 · 纯文本 diff</text>
  <text x="285" y="320" font-size="10" font-weight="700" fill="#0f766e">答：模型实际收到了什么</text>

  <rect x="494" y="202" width="212" height="142" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="512" y="226" font-size="12" font-weight="700" fill="#1d4ed8">③ 真进程 + 录制回放</text>
  <text x="512" y="250" font-size="10.5" fill="#334155">dsh 真 Profile + llm-replay</text>
  <text x="512" y="268" font-size="10.5" fill="#334155">固定模型流重跑全套装配</text>
  <text x="512" y="298" font-size="10" fill="#64748b">成本：秒级 · 无密钥 keyless</text>
  <text x="512" y="320" font-size="10" font-weight="700" fill="#1d4ed8">答：改配置后装配对不对</text>

  <rect x="721" y="202" width="212" height="142" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.8"/>
  <text x="739" y="226" font-size="12" font-weight="700" fill="#92400e">④ 真浏览器 ARIA 树</text>
  <text x="739" y="250" font-size="10.5" fill="#334155">无头 Chrome 连真实后端</text>
  <text x="739" y="268" font-size="10.5" fill="#334155">采集可见语义树与控制台</text>
  <text x="739" y="298" font-size="10" fill="#64748b">成本：十余秒 · 需本地浏览器</text>
  <text x="739" y="320" font-size="10" font-weight="700" fill="#92400e">答：前端卡片真画出来了吗</text>

  <rect x="948" y="202" width="212" height="142" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="966" y="226" font-size="12" font-weight="700" fill="#991b1b">⑤ 注入异常查副作用</text>
  <text x="966" y="250" font-size="10.5" fill="#334155">构造断流或沙箱缺失，核对</text>
  <text x="966" y="268" font-size="10.5" fill="#334155">spawnCalls:0 与磁盘终态</text>
  <text x="966" y="298" font-size="10" fill="#64748b">成本：最高 · 独立外部预期</text>
  <text x="966" y="320" font-size="10" font-weight="700" fill="#991b1b">答：危险操作真没偷跑吗</text>

  <line x1="40" y1="368" x2="1160" y2="368" stroke="#cbd5e1"/>

  <!-- Band 3: Lifecycle -->
  <text x="40" y="396" font-size="12" font-weight="700" fill="#334155">③ 探针产出的三种归宿 —— 只有配齐基线沉淀入库，才能成为长期回归防线</text>

  <rect x="40" y="412" width="340" height="94" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="436" font-size="12" font-weight="700" fill="#0f172a">A · 临时调试：定位单次故障，排完即删</text>
  <text x="60" y="460" font-size="10.5" fill="#475569">排查偶发配置乌龙或摸底接口格式，看清即结案</text>
  <text x="60" y="484" font-size="10" fill="#64748b">寿命：分钟级 · 不留快照维护负担</text>

  <line x1="382" y1="459" x2="404" y2="459" stroke="#64748b" stroke-width="2" marker-end="url(#one-b)"/>

  <rect x="408" y="412" width="340" height="94" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="428" y="436" font-size="12" font-weight="700" fill="#0f172a">B · 本地证据归档：保留供开发期复核</text>
  <text x="428" y="460" font-size="10.5" fill="#475569">按 sessionId 存日志、verdict.json 与截图供对账</text>
  <text x="428" y="484" font-size="10" fill="#64748b">寿命：天至周级 · 按需手动复跑，不塞进日常 CI</text>

  <line x1="750" y1="459" x2="772" y2="459" stroke="#0f766e" stroke-width="2" marker-end="url(#one-a)"/>

  <rect x="776" y="412" width="384" height="94" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="796" y="436" font-size="12" font-weight="700" fill="#166534">C · 把探针沉淀成回归基线（毕业进门禁）</text>
  <text x="796" y="460" font-size="10.5" fill="#334155">经动态字段令牌化与健康校验后提交 snapshots/ 或单测</text>
  <text x="796" y="484" font-size="10" fill="#166534">寿命：长期 · 后续改动一旦漂移即刻由 diff 报警</text>

  <!-- Bottom summary -->
  <rect x="40" y="530" width="1120" height="132" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/>
  <text x="64" y="558" font-size="12.5" font-weight="700" fill="#0f766e">实操三条准则：怎么把“黑盒猜测”变成 10 秒铁证</text>
  <text x="64" y="584" font-size="11" fill="#334155">1. 先跑零网络开销的 pnpm dsh --profile ... --dump-config 确认插件行激活，再用最小单轮运行解剖落盘事件；</text>
  <text x="64" y="608" font-size="11" fill="#334155">2. 验证外部真实世界而非模型自我汇报（Verify the world, not the self-report），以磁盘终态与独立审计计数为准；</text>
  <text x="64" y="632" font-size="11" fill="#334155">3. 把探针沉淀成回归基线前，必须人工核实当次运行健康无报错（严防把 UNKNOWN_TOOL 坏轨迹刷入仓库），并清理旧探针脚本。</text>
</svg>
