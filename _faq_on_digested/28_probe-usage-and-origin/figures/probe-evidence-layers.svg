<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>探针与四层正式测试的分工、三大盲区及三条 DSH 底层不变量</title>
  <desc>左列展示单元测试、覆盖率门禁、录制会话快照与真 API e2e 四层正式测试各自验证的对象与局限；中列展示探针填补的三个盲区（尚无期望基线、验证多插件真实装配产物、排查某项缺席），强调探针跑在真实 Profile 插件组装之上而非手写裸脚本；右列展示支撑探针可信的三条 DSH 不变量（model-visible 与 logged 等价、结构化版本日志分离存储提示词与工具、llm-replay 固定模型流）。底部说明探针毕业为回归门禁的条件、三档机器退出码（0/1/2 BLOCKED）以及三类静默假绿防线。</desc>
  <defs>
    <marker id="pb-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#0f766e"/>
    </marker>
    <marker id="pb-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">探针在测试体系中的分工与三条底层不变量</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">探针跑在真实 Profile 插件组装之上，不是脱离宿主手写裸调用脚本——靠会话日志与外部产物拿铁证</text>

  <text x="40" y="88" font-size="12" font-weight="700" fill="#334155">① 四层正式测试：各管哪一段</text>
  <text x="430" y="88" font-size="12" font-weight="700" fill="#0f766e">② 探针（Probe）：填补三个测试盲区</text>
  <text x="820" y="88" font-size="12" font-weight="700" fill="#92400e">③ 支撑探针可信的三条 DSH 不变量</text>

  <!-- Col 1: 4 test tiers -->
  <rect x="40" y="100" width="356" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="122" font-size="12" font-weight="700" fill="#0f172a">单元测试（test）</text>
  <text x="58" y="142" font-size="10.5" fill="#475569">验单函数分支；盲区：抓不住多插件漏注入与装配错位</text>

  <rect x="40" y="172" width="356" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="194" font-size="12" font-weight="700" fill="#0f172a">覆盖率门禁（test:coverage）</text>
  <text x="58" y="214" font-size="10.5" fill="#475569">只证代码行跑过；100% 绿仍可能发布入口崩溃（0001）</text>

  <rect x="40" y="244" width="356" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="266" font-size="12" font-weight="700" fill="#0f172a">录制会话快照（test:snapshot · keyless）</text>
  <text x="58" y="286" font-size="10.5" fill="#475569">真进程 + 回放流比对基线；盲区：只覆盖已录制路径</text>

  <rect x="40" y="316" width="356" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="338" font-size="12" font-weight="700" fill="#0f172a">真模型端到端（test:e2e · with-key）</text>
  <text x="58" y="358" font-size="10.5" fill="#475569">验真模型决策；盲区：需 API Key 且采样措辞有波动</text>

  <!-- Col 2: Probe -->
  <rect x="430" y="100" width="356" height="278" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="608" y="126" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e">探针工作法（无预设基线的实证运行）</text>
  <text x="608" y="145" text-anchor="middle" font-size="10.5" fill="#115e59">可跑 keyless 回放或真模型，先把真实状态摊在桌面上</text>

  <rect x="450" y="158" width="316" height="62" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text x="468" y="180" font-size="11" font-weight="700" fill="#0f766e">盲区① 还不知道标准答案长什么样</text>
  <text x="468" y="200" font-size="10.5" fill="#334155">不靠盲猜写断言，先跑一遍真实装配拿到实际输出</text>

  <rect x="450" y="228" width="316" height="62" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text x="468" y="250" font-size="11" font-weight="700" fill="#0f766e">盲区② 待验对象是多插件叠合后的产物</text>
  <text x="468" y="270" font-size="10.5" fill="#334155">最终系统提示词与工具集只在完整 Profile 装配后成形</text>

  <rect x="450" y="298" width="316" height="62" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text x="468" y="320" font-size="11" font-weight="700" fill="#0f766e">盲区③ 排查“某项缺席”而非返回值不等</text>
  <text x="468" y="340" font-size="10.5" fill="#334155">快速定位规则段未注入、工具未暴露或前端卡片漏画</text>

  <line x1="398" y1="239" x2="424" y2="239" stroke="#0f766e" stroke-width="2" marker-end="url(#pb-a)"/>
  <line x1="788" y1="239" x2="814" y2="239" stroke="#b45309" stroke-width="2" marker-end="url(#pb-b)"/>

  <!-- Col 3: 3 invariants -->
  <rect x="820" y="100" width="340" height="84" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="838" y="122" font-size="12" font-weight="700" fill="#92400e">① model-visible ⟺ logged</text>
  <text x="838" y="142" font-size="10.5" fill="#334155">凡进入模型请求的内容均落盘，可离线完整重建</text>
  <text x="838" y="162" font-size="10.5" fill="#b45309">无需改框架源码打日志，也不用外挂抓包代理</text>

  <rect x="820" y="196" width="340" height="90" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="838" y="218" font-size="12" font-weight="700" fill="#92400e">② 带版本的公开日志（两处分离存储）</text>
  <text x="838" y="238" font-size="10.5" fill="#334155">system/message 存提示词；request/header 存工具集</text>
  <text x="838" y="258" font-size="10.5" fill="#b91c1c">切忌去 request/header 翻 system 字段误判漏挂</text>

  <rect x="820" y="298" width="340" height="80" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="838" y="320" font-size="12" font-weight="700" fill="#92400e">③ dsh-llm-replay 锁定模型输入流</text>
  <text x="838" y="340" font-size="10.5" fill="#334155">替换线上适配器，零密钥重现 100% 真实插件装配</text>
  <text x="838" y="360" font-size="10.5" fill="#64748b">异常分支可用 replay.override.json 精确注入故障</text>

  <!-- Graduation + Exit codes -->
  <rect x="40" y="398" width="1120" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="424" font-size="12.5" font-weight="700" fill="#0f172a">为什么探针本身不是 CI 门禁？—— 区别在于“有没有提交期望基线”，而非能不能 keyless</text>
  <text x="60" y="446" font-size="11" fill="#475569">回放探针与无头浏览器探针同样可以无密钥（keyless）运行；但未固化 *.expected.* 基线前，它只是探索性取证，配齐归一化基线与断言后即“毕业”为回归快照或单测。</text>

  <rect x="60" y="464" width="340" height="48" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="78" y="484" font-size="11" font-weight="700" fill="#166534">退出码 0 ＝ 环境正常且符合判据</text>
  <text x="78" y="501" font-size="10" fill="#475569">自动化或 Agent 可继续推进下一步</text>

  <rect x="420" y="464" width="340" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="438" y="484" font-size="11" font-weight="700" fill="#991b1b">退出码 1 ＝ 观测结果违背判据（抓到缺陷）</text>
  <text x="438" y="501" font-size="10" fill="#475569">立即保留现场日志与证据，停手定位</text>

  <rect x="780" y="464" width="360" height="48" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="798" y="484" font-size="11" font-weight="700" fill="#92400e">退出码 2 ＝ 环境未就绪（BLOCKED）</text>
  <text x="798" y="501" font-size="10" fill="#475569">缺 Chrome / Key / zstd 显式报错，严禁静默退 0</text>

  <!-- Guardrails against silent false greens -->
  <rect x="40" y="546" width="1120" height="110" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="572" font-size="12" font-weight="700" fill="#991b1b">动手写探针严防三类“静默假绿”</text>
  <text x="60" y="594" font-size="11" fill="#334155">1. --patch 写错目标条目 id 导致补丁未挂载、原装模型照常接管 → 动跑前先用 dsh --profile ... --dump-config 或查 request/header 核实；</text>
  <text x="60" y="616" font-size="11" fill="#334155">2. 测常驻提示词时未封死工具调用，模型顺手调 read / bash 现查文件答对 → 单轮指令必须写明“禁止调用任何工具，没看到直说 NONE”；</text>
  <text x="60" y="638" font-size="11" fill="#334155">3. 脱离真实 Profile 宿主手写裸调用脚本，漏掉配置层叠与插件冲突 → 探针必须经真实 dsh 入口或 Loader 装配拉起，并先故意改坏一次验红。</text>
</svg>
