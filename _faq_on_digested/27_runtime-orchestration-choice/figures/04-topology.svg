<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>两种协作拓扑：workflow 星形单向扇出 vs agent-team 网状通信加共享任务板</title>
  <desc>左面板：workflow 由发起 Agent 交给 Worker 脚本循环拉起多个独立 child，child 间无消息通道，结果经脚本变量单向汇总。右面板：agent-team 由根会话隐式担任 Lead 拉起具名队友，任意成员可互发消息并共享带无环校验与 CAS 乐观锁的任务板；依赖解开变 ready 不会自动唤醒负责人，须显式发消息派活。</desc>
  <defs>
    <marker id="m1" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="m2" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
    <marker id="m3" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">两种协作拓扑：星形单向扇出 vs 网状对等团队</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">核心差异不在子代理数量，而在成员之间能不能互发消息、协作状态能不能跨重启保留</text>

  <!-- Left: workflow -->
  <rect x="40" y="80" width="540" height="420" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="112" font-size="14" font-weight="700" fill="#1d4ed8">workflow：星形单向扇出</text>
  <text x="64" y="132" fill="#3b82f6" font-size="11">Worker 脚本掌握控制流，每个 child 跑完交回字符串即结束</text>

  <rect x="220" y="154" width="180" height="38" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="310" y="178" text-anchor="middle" font-size="11" fill="#1e3a8a">发起 Agent</text>
  <line x1="310" y1="192" x2="310" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="200" y="216" width="220" height="42" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="310" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Worker 脚本（持并发循环）</text>

  <line x1="290" y1="258" x2="110" y2="296" stroke="#93c5fd"/>
  <line x1="298" y1="258" x2="182" y2="296" stroke="#93c5fd"/>
  <line x1="306" y1="258" x2="256" y2="296" stroke="#93c5fd"/>
  <line x1="314" y1="258" x2="330" y2="296" stroke="#93c5fd"/>
  <line x1="322" y1="258" x2="404" y2="296" stroke="#93c5fd"/>
  <line x1="330" y1="258" x2="478" y2="296" stroke="#93c5fd"/>

  <circle cx="100" cy="318" r="22" fill="#ffffff" stroke="#93c5fd"/>
  <text x="100" y="322" text-anchor="middle" font-size="10.5" fill="#1e40af">c1</text>
  <circle cx="176" cy="318" r="22" fill="#ffffff" stroke="#93c5fd"/>
  <text x="176" y="322" text-anchor="middle" font-size="10.5" fill="#1e40af">c2</text>
  <circle cx="252" cy="318" r="22" fill="#ffffff" stroke="#93c5fd"/>
  <text x="252" y="322" text-anchor="middle" font-size="10.5" fill="#1e40af">c3</text>
  <circle cx="328" cy="318" r="22" fill="#ffffff" stroke="#93c5fd"/>
  <text x="328" y="322" text-anchor="middle" font-size="10.5" fill="#1e40af">c4</text>
  <circle cx="404" cy="318" r="22" fill="#ffffff" stroke="#93c5fd"/>
  <text x="404" y="322" text-anchor="middle" font-size="10.5" fill="#1e40af">c5</text>
  <circle cx="480" cy="318" r="22" fill="#ffffff" stroke="#93c5fd"/>
  <text x="480" y="322" text-anchor="middle" font-size="10.5" fill="#1e40af">c6</text>

  <text x="290" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">× 子代理之间完全隔离，无消息通道</text>
  <text x="290" y="392" text-anchor="middle" font-size="10.5" fill="#475569">中间过程对父会话不可见，仅脚本 return 值回到主对话</text>
  <text x="64" y="438" fill="#1d4ed8" font-size="10.5" font-weight="700">适合：彼此独立的同构批处理与分层过筛汇总。</text>
  <text x="64" y="464" fill="#64748b" font-size="10.5">容量：默认单次运行最多 1000 个 child，单次调用最多 4096 项。</text>

  <!-- Right: agent-team -->
  <rect x="620" y="80" width="540" height="420" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="644" y="112" font-size="14" font-weight="700" fill="#6d28d9">agent-team：网状通信 + 共享任务板（实验包）</text>
  <text x="644" y="132" fill="#7c3aed" font-size="11">启动前挂载 Profile（替换 subagent，可与 workflow 共存）</text>

  <rect x="800" y="154" width="180" height="38" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="890" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">根会话 = 隐式 Lead</text>

  <line x1="850" y1="192" x2="735" y2="248" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m3)"/>
  <line x1="890" y1="192" x2="885" y2="248" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m3)"/>
  <line x1="930" y1="192" x2="1035" y2="248" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m3)"/>

  <rect x="668" y="252" width="116" height="40" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="726" y="277" text-anchor="middle" font-size="10.5" fill="#5b21b6">reviewer</text>
  <rect x="826" y="252" width="116" height="40" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="884" y="277" text-anchor="middle" font-size="10.5" fill="#5b21b6">builder</text>
  <rect x="984" y="252" width="116" height="40" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1042" y="277" text-anchor="middle" font-size="10.5" fill="#5b21b6">tester</text>

  <line x1="786" y1="272" x2="822" y2="272" stroke="#7c3aed" stroke-width="1.6" marker-start="url(#m2)" marker-end="url(#m2)"/>
  <line x1="944" y1="272" x2="980" y2="272" stroke="#7c3aed" stroke-width="1.6" marker-start="url(#m2)" marker-end="url(#m2)"/>

  <line x1="726" y1="292" x2="790" y2="338" stroke="#a78bfa" stroke-dasharray="4 4"/>
  <line x1="884" y1="292" x2="884" y2="338" stroke="#a78bfa" stroke-dasharray="4 4"/>
  <line x1="1042" y1="292" x2="990" y2="338" stroke="#a78bfa" stroke-dasharray="4 4"/>

  <rect x="688" y="340" width="404" height="58" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="890" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">共享任务板（blocked_by 无环校验 + CAS 乐观锁）</text>
  <text x="890" y="384" text-anchor="middle" font-size="10" fill="#b91c1c">依赖解开变 ready 绝不自动唤醒负责人——必须显式 send_message 派活</text>

  <text x="644" y="438" fill="#6d28d9" font-size="10.5" font-weight="700">适合：具名角色边改边对表、任务带前置依赖、跨重启保留名册。</text>
  <text x="644" y="464" fill="#64748b" font-size="10.5">容量：包默认最多 16 名成员（官方 profile 钉为 8 名）、256 个任务。</text>

  <text x="600" y="532" text-anchor="middle" font-size="11" fill="#64748b">一句话：workflow 的边只从脚本单向发出；agent-team 允许任意成员点对点发消息，并把名册与任务板记入 Lead 持久会话日志</text>
</svg>
