<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>workflow 脚本的三种并发扇出形状：parallel、pipeline 与手写循环</title>
  <desc>左面板：parallel 并发拉起所有项，设全局同步屏障等最慢一项完成后统一汇总。中面板：pipeline 让每项独立依次穿过各阶段，无跨阶段屏障，多阶段批处理默认首选。右面板：手写 for 循环加 agent()，根据中间结果动态决定下一批节点。单分支报错均返回 null，聚合时需显式过滤或统计。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arb" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">workflow 脚本的三种扇出形状</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">在 Worker 线程里用 JS 代码接管并发与聚合——无需预先声明静态 DAG 图</text>

  <!-- Left: parallel -->
  <rect x="40" y="80" width="360" height="410" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="112" font-size="14" font-weight="700" fill="#1d4ed8">parallel（全局同步屏障）</text>
  <text x="64" y="132" fill="#3b82f6" font-size="11">并发拉起全部任务，等最慢一项跑完再往下走</text>

  <circle cx="115" cy="180" r="16" fill="#ffffff" stroke="#93c5fd"/>
  <text x="115" y="184" text-anchor="middle" font-size="11" fill="#1e3a8a">1</text>
  <circle cx="185" cy="180" r="16" fill="#ffffff" stroke="#93c5fd"/>
  <text x="185" y="184" text-anchor="middle" font-size="11" fill="#1e3a8a">2</text>
  <circle cx="255" cy="180" r="16" fill="#ffffff" stroke="#93c5fd"/>
  <text x="255" y="184" text-anchor="middle" font-size="11" fill="#1e3a8a">3</text>
  <circle cx="325" cy="180" r="16" fill="#ffffff" stroke="#93c5fd"/>
  <text x="325" y="184" text-anchor="middle" font-size="11" fill="#1e3a8a">4</text>

  <line x1="115" y1="196" x2="115" y2="230" stroke="#93c5fd"/>
  <line x1="185" y1="196" x2="185" y2="230" stroke="#93c5fd"/>
  <line x1="255" y1="196" x2="255" y2="230" stroke="#93c5fd"/>
  <line x1="325" y1="196" x2="325" y2="230" stroke="#93c5fd"/>
  <line x1="80" y1="230" x2="360" y2="230" stroke="#1d4ed8" stroke-width="3"/>
  <text x="220" y="250" text-anchor="middle" font-size="10.5" fill="#1d4ed8">同步屏障：耗时由最慢分支决定</text>

  <line x1="220" y1="258" x2="220" y2="278" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arb)"/>
  <rect x="144" y="282" width="152" height="36" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="220" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">统一汇总结果</text>

  <text x="64" y="362" fill="#475569" font-size="10.5">失败粒度：单分支普通抛错返回 null；</text>
  <text x="64" y="382" fill="#475569" font-size="10.5">选项非法或超出配额上限则终止整段脚本。</text>
  <text x="64" y="418" fill="#1d4ed8" font-size="10.5" font-weight="700">适合：平级分支独立执行、下一步依赖全量结果。</text>
  <text x="64" y="444" fill="#64748b" font-size="10.5">注意：聚合时务必检查 null 或 .filter(Boolean)。</text>

  <!-- Center: pipeline -->
  <rect x="420" y="80" width="360" height="410" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="444" y="112" font-size="14" font-weight="700" fill="#0f766e">pipeline（无跨阶段屏障 · 首选）</text>
  <text x="444" y="132" fill="#0d9488" font-size="11">每项独立穿过各阶段，慢文件不拖慢整批进度</text>

  <rect x="452" y="170" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="490" y="190" text-anchor="middle" font-size="11" fill="#0f766e">item 1</text>
  <line x1="528" y1="185" x2="552" y2="185" stroke="#64748b" marker-end="url(#ar)"/>
  <rect x="556" y="170" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="594" y="190" text-anchor="middle" font-size="11" fill="#0f766e">stage 2</text>
  <line x1="632" y1="185" x2="656" y2="185" stroke="#64748b" marker-end="url(#ar)"/>
  <rect x="660" y="170" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="698" y="190" text-anchor="middle" font-size="11" fill="#0f766e">stage 3</text>

  <rect x="466" y="232" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="504" y="252" text-anchor="middle" font-size="11" fill="#0f766e">item 2</text>
  <line x1="542" y1="247" x2="566" y2="247" stroke="#64748b" marker-end="url(#ar)"/>
  <rect x="570" y="232" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="608" y="252" text-anchor="middle" font-size="11" fill="#0f766e">stage 2</text>
  <line x1="646" y1="247" x2="670" y2="247" stroke="#64748b" marker-end="url(#ar)"/>
  <rect x="674" y="232" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="712" y="252" text-anchor="middle" font-size="11" fill="#0f766e">stage 3</text>

  <rect x="480" y="294" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="518" y="314" text-anchor="middle" font-size="11" fill="#0f766e">item 3</text>
  <line x1="556" y1="309" x2="580" y2="309" stroke="#64748b" marker-end="url(#ar)"/>
  <rect x="584" y="294" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="622" y="314" text-anchor="middle" font-size="11" fill="#0f766e">stage 2</text>
  <line x1="660" y1="309" x2="684" y2="309" stroke="#64748b" marker-end="url(#ar)"/>
  <rect x="688" y="294" width="76" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="726" y="314" text-anchor="middle" font-size="11" fill="#0f766e">stage 3</text>

  <text x="444" y="362" fill="#475569" font-size="10.5">失败粒度：某项某阶段抛错 → 该项置 null 并跳过后续；</text>
  <text x="444" y="382" fill="#475569" font-size="10.5">其余正常项照常流转，互不阻塞等待。</text>
  <text x="444" y="418" fill="#0f766e" font-size="10.5" font-weight="700">适合：“先粗筛、命中再精读”等多阶段批处理。</text>
  <text x="444" y="444" fill="#64748b" font-size="10.5">代价：中间阶段拿不到全量全局视图。</text>

  <!-- Right: manual loop -->
  <rect x="800" y="80" width="360" height="410" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="824" y="112" font-size="14" font-weight="700" fill="#b45309">手写循环（动态增减节点）</text>
  <text x="824" y="132" fill="#d97706" font-size="11">看完上一批发现，再用代码决定下一批派谁</text>

  <rect x="904" y="166" width="168" height="36" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="988" y="189" text-anchor="middle" font-size="11" fill="#92400e">第 1 批：agent() 探路</text>
  <line x1="988" y1="202" x2="988" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="904" y="234" width="168" height="36" rx="8" fill="#ffffff" stroke="#fbbf24"/>
  <text x="988" y="257" text-anchor="middle" font-size="11" fill="#92400e">JS 解析过滤中间结果</text>
  <line x1="988" y1="270" x2="988" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="888" y="302" width="200" height="42" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="988" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">按发现动态追加下一批</text>
  <text x="988" y="336" text-anchor="middle" font-size="10" fill="#b45309">if / for / 重试均由代码掌控</text>

  <path d="M888,323 C842,323 842,252 900,252" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text x="824" y="292" font-size="10" fill="#b45309">按需迭代</text>

  <text x="824" y="382" fill="#475569" font-size="10.5">失败粒度：异常捕获与有界重试由脚本自行控制；</text>
  <text x="824" y="402" fill="#475569" font-size="10.5">共享单次运行 1000 child 与并发槽位配额。</text>
  <text x="824" y="438" fill="#b45309" font-size="10.5" font-weight="700">适合：运行前未知依赖结构、需边探边扩的场景。</text>

  <text x="600" y="526" text-anchor="middle" font-size="11" fill="#64748b">多阶段批处理默认优先选 pipeline；确需等齐全部结果再选 parallel；三者均为纯内存一次性运行，无断点恢复日志</text>
</svg>
