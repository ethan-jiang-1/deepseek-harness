<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>spawn 与 fork 的上下文边界：什么过去、什么回来</title>
  <desc>左panel：subagent 是 fresh child。父会话的四个轮次留在原地，只有 prompt 穿过边界；child 从空上下文开始，回来时只有结果，中间步骤不回来。右panel：subagent_fork 把父的已完成轮次复制成快照带过去，创建之后父的新轮次进不来；回来时同样只有结果。两边的共同点是：父看不到 child 的过程，child 也拿不到父的后续。</desc>
  <defs>
    <marker id="a1" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="a2" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">上下文边界：什么过去，什么回来</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">两种委派都只回结果；差别在于父的历史要不要复制一份带过去</text>

  <rect x="40" y="80" width="540" height="420" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="112" font-size="14" font-weight="700" fill="#1d4ed8">subagent（fresh）</text>
  <text x="60" y="132" fill="#3b82f6" font-size="11">从零开始，只拿到你写的那段 prompt</text>

  <rect x="70" y="160" width="180" height="220" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="160" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">父会话</text>
  <rect x="90" y="200" width="140" height="24" rx="5" fill="#dbeafe"/>
  <text x="160" y="216" text-anchor="middle" font-size="10.5" fill="#1e40af">turn 1</text>
  <rect x="90" y="230" width="140" height="24" rx="5" fill="#dbeafe"/>
  <text x="160" y="246" text-anchor="middle" font-size="10.5" fill="#1e40af">turn 2</text>
  <rect x="90" y="260" width="140" height="24" rx="5" fill="#dbeafe"/>
  <text x="160" y="276" text-anchor="middle" font-size="10.5" fill="#1e40af">turn 3</text>
  <rect x="90" y="290" width="140" height="24" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="3 3"/>
  <text x="160" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">turn 4（进行中）</text>

  <rect x="350" y="160" width="180" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="440" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">子会话（新）</text>
  <rect x="370" y="210" width="140" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <text x="440" y="264" text-anchor="middle" font-size="11" fill="#94a3b8">空上下文</text>
  <text x="440" y="284" text-anchor="middle" font-size="10" fill="#94a3b8">没有父的历史</text>

  <line x1="250" y1="250" x2="344" y2="250" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a1)"/>
  <text x="297" y="240" text-anchor="middle" font-size="10.5" fill="#1d4ed8">只传 prompt</text>
  <line x1="350" y1="320" x2="256" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
  <text x="303" y="336" text-anchor="middle" font-size="10.5" fill="#64748b">只回结果</text>

  <text x="60" y="418" fill="#475569" font-size="10.5">父的 turn 1–4 都留在原地，不穿过边界；</text>
  <text x="60" y="436" fill="#475569" font-size="10.5">child 的中间步骤也不回来，只把最终答案带回父对话。</text>
  <text x="60" y="466" fill="#1d4ed8" font-size="10.5">适合：任务能一段话自包含，且你不需要看过程。</text>

  <rect x="620" y="80" width="540" height="420" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="640" y="112" font-size="14" font-weight="700" fill="#b45309">subagent_fork（继承）</text>
  <text x="640" y="132" fill="#d97706" font-size="11">把父的已完成轮次复制一份，带过边界</text>

  <rect x="650" y="160" width="180" height="220" rx="10" fill="#ffffff" stroke="#fbbf24"/>
  <text x="740" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">父会话</text>
  <rect x="670" y="200" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="740" y="216" text-anchor="middle" font-size="10.5" fill="#92400e">turn 1</text>
  <rect x="670" y="230" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="740" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">turn 2</text>
  <rect x="670" y="260" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="740" y="276" text-anchor="middle" font-size="10.5" fill="#92400e">turn 3</text>
  <rect x="670" y="290" width="140" height="24" rx="5" fill="#ffffff" stroke="#fbbf24" stroke-dasharray="3 3"/>
  <text x="740" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">turn 4（进行中）</text>

  <rect x="930" y="160" width="180" height="240" rx="10" fill="#ffffff" stroke="#fbbf24"/>
  <text x="1020" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">子会话（带快照）</text>
  <rect x="950" y="200" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="1020" y="216" text-anchor="middle" font-size="10.5" fill="#92400e">turn 1 快照</text>
  <rect x="950" y="230" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="1020" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">turn 2 快照</text>
  <rect x="950" y="260" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="1020" y="276" text-anchor="middle" font-size="10.5" fill="#92400e">turn 3 快照</text>
  <line x1="950" y1="300" x2="1090" y2="300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1020" y="318" text-anchor="middle" font-size="10" fill="#b91c1c">创建之后父的新轮次进不来</text>
  <text x="1020" y="340" text-anchor="middle" font-size="10" fill="#94a3b8">快照是创建时的一次性副本</text>

  <line x1="830" y1="250" x2="924" y2="250" stroke="#b45309" stroke-width="2" marker-end="url(#a2)"/>
  <text x="877" y="240" text-anchor="middle" font-size="10.5" fill="#b45309">复制已完成轮次</text>
  <line x1="930" y1="330" x2="836" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="883" y="346" text-anchor="middle" font-size="10.5" fill="#64748b">只回结果</text>

  <text x="640" y="414" fill="#475569" font-size="10.5">child 看到的是创建那一刻的父历史，之后父再发生什么它都不知道；</text>
  <text x="640" y="432" fill="#475569" font-size="10.5">它回来时同样只带结果，不带过程。</text>
  <text x="640" y="462" fill="#b45309" font-size="10.5">适合：子任务要接着这段对话做，且能接受快照边界。</text>

  <text x="600" y="532" text-anchor="middle" font-size="11" fill="#64748b">一句话：fresh 省 token，fork 省解释；两者都不把过程带回来</text>
</svg>
