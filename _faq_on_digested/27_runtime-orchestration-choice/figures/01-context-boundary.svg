<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>subagent 与 subagent_fork 的上下文边界：什么过去、什么回来</title>
  <desc>左面板：subagent 从空上下文起步，父会话的历史留在原地，只有自包含 prompt 穿过边界；可单独指定轻量预设或模型。右面板：subagent_fork 复制父会话截至目前已完成轮次的快照（不含进行中的当前轮），创建后父会话新事件不再同步。两边都只把最终结果带回父会话，中间试错步骤不回传。</desc>
  <defs>
    <marker id="a1" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="a2" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="8" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">委派上下文边界：什么穿过边界，什么留在原地</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">两种委派都只回传最终结果；核心差别在于要不要把父会话已完成轮次复制一份带过去</text>

  <!-- Left: subagent -->
  <rect x="40" y="80" width="540" height="424" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="112" font-size="14" font-weight="700" fill="#1d4ed8">subagent（空上下文 spawn · 默认首选）</text>
  <text x="64" y="132" fill="#3b82f6" font-size="11">从零起步，只看得到你写给它的自包含 prompt</text>

  <rect x="68" y="158" width="180" height="220" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="158" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">父会话</text>
  <rect x="88" y="198" width="140" height="24" rx="5" fill="#dbeafe"/>
  <text x="158" y="214" text-anchor="middle" font-size="10.5" fill="#1e40af">turn 1</text>
  <rect x="88" y="228" width="140" height="24" rx="5" fill="#dbeafe"/>
  <text x="158" y="244" text-anchor="middle" font-size="10.5" fill="#1e40af">turn 2</text>
  <rect x="88" y="258" width="140" height="24" rx="5" fill="#dbeafe"/>
  <text x="158" y="274" text-anchor="middle" font-size="10.5" fill="#1e40af">turn 3</text>
  <rect x="88" y="288" width="140" height="24" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="3 3"/>
  <text x="158" y="304" text-anchor="middle" font-size="10.5" fill="#64748b">turn 4（进行中）</text>

  <rect x="352" y="158" width="188" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="446" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">子会话（全新）</text>
  <rect x="372" y="208" width="148" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <text x="446" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">空上下文</text>
  <text x="446" y="280" text-anchor="middle" font-size="10" fill="#94a3b8">不携带父对话历史</text>
  <text x="446" y="298" text-anchor="middle" font-size="10" fill="#3b82f6">可单独选轻量预设 / 模型</text>

  <line x1="248" y1="248" x2="346" y2="248" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a1)"/>
  <text x="297" y="238" text-anchor="middle" font-size="10.5" fill="#1d4ed8">只传 prompt</text>
  <line x1="352" y1="318" x2="254" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
  <text x="303" y="336" text-anchor="middle" font-size="10.5" fill="#64748b">只回最终结果</text>

  <text x="64" y="412" fill="#475569" font-size="10.5">父会话历史与子代理中间工具步骤各自留在原地，互不污染；</text>
  <text x="64" y="432" fill="#475569" font-size="10.5">默认限制委派深度 maxDepth = 1，防止子代理继续无限套娃。</text>
  <text x="64" y="462" fill="#1d4ed8" font-size="10.5" font-weight="700">适合：目标与边界能用一段话写清的自包含调研或模块改动。</text>

  <!-- Right: subagent_fork -->
  <rect x="620" y="80" width="540" height="424" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="644" y="112" font-size="14" font-weight="700" fill="#b45309">subagent_fork（复制已完成轮次快照）</text>
  <text x="644" y="132" fill="#d97706" font-size="11">把父会话截至目前已完成轮次整包复制一份带过去</text>

  <rect x="648" y="158" width="180" height="220" rx="10" fill="#ffffff" stroke="#fbbf24"/>
  <text x="738" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">父会话</text>
  <rect x="668" y="198" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="738" y="214" text-anchor="middle" font-size="10.5" fill="#92400e">turn 1</text>
  <rect x="668" y="228" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="738" y="244" text-anchor="middle" font-size="10.5" fill="#92400e">turn 2</text>
  <rect x="668" y="258" width="140" height="24" rx="5" fill="#fef3c7"/>
  <text x="738" y="274" text-anchor="middle" font-size="10.5" fill="#92400e">turn 3</text>
  <rect x="668" y="288" width="140" height="24" rx="5" fill="#ffffff" stroke="#fbbf24" stroke-dasharray="3 3"/>
  <text x="738" y="304" text-anchor="middle" font-size="10.5" fill="#64748b">turn 4（进行中）</text>

  <rect x="932" y="158" width="192" height="220" rx="10" fill="#ffffff" stroke="#fbbf24"/>
  <text x="1028" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">子会话（带快照）</text>
  <rect x="954" y="198" width="148" height="24" rx="5" fill="#fef3c7"/>
  <text x="1028" y="214" text-anchor="middle" font-size="10.5" fill="#92400e">turn 1 快照</text>
  <rect x="954" y="228" width="148" height="24" rx="5" fill="#fef3c7"/>
  <text x="1028" y="244" text-anchor="middle" font-size="10.5" fill="#92400e">turn 2 快照</text>
  <rect x="954" y="258" width="148" height="24" rx="5" fill="#fef3c7"/>
  <text x="1028" y="274" text-anchor="middle" font-size="10.5" fill="#92400e">turn 3 快照</text>
  <line x1="954" y1="296" x2="1102" y2="296" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1028" y="316" text-anchor="middle" font-size="10" fill="#b91c1c">不含进行中的 turn 4</text>
  <text x="1028" y="336" text-anchor="middle" font-size="10" fill="#94a3b8">创建后父新轮次不再同步</text>

  <line x1="828" y1="248" x2="926" y2="248" stroke="#b45309" stroke-width="2" marker-end="url(#a2)"/>
  <text x="877" y="238" text-anchor="middle" font-size="10.5" fill="#b45309">复制已完成轮次</text>
  <line x1="932" y1="318" x2="834" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="883" y="336" text-anchor="middle" font-size="10.5" fill="#64748b">只回最终结果</text>

  <text x="644" y="412" fill="#475569" font-size="10.5">默认锁定父会话组合配置以保住历史前缀缓存命中，输入成本更高；</text>
  <text x="644" y="432" fill="#475569" font-size="10.5">子代理跑完同样只回传最终结论，不把中间工具记录倒回父会话。</text>
  <text x="644" y="462" fill="#b45309" font-size="10.5" font-weight="700">适合：重度依赖前几轮刚聊出的上下文细节、摘抄成本太高的子任务。</text>

  <text x="600" y="534" text-anchor="middle" font-size="11" fill="#64748b">一句话：subagent 省输入 token 且干净隔离，subagent_fork 省背景转述；两者都异步返回 childId 并在完成时投递通知</text>
</svg>
