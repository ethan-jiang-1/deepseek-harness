<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">方法怎样从 preset 配置到达模型，再进入真实执行？</title>
<desc id="desc">standard 声明选择插件；方法提供者发现与读取文件；skill 工具发布摘要并加载正文；loop 记录输入并发出请求；模型决策进入真实执行。下方测试分别检查输入、执行与独立结果。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="650" rx="20" fill="#f8fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#334155">
<text x="40" y="48" font-size="25" font-weight="700" fill="#0f172a">方法怎样从配置到达模型，再进入真实执行？</text>
<text x="40" y="82" font-size="16">沿内置 standard 理解配合代码；修改应落到真正拥有该行为的位置</text>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)">
<path d="M350 195L400 195"/><path d="M715 195L765 195"/>
<path d="M925 270L925 330"/><path d="M770 405L720 405"/><path d="M405 405L355 405"/>
</g>
<rect x="40" y="120" width="310" height="150" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<text x="60" y="154" font-size="19" font-weight="700" fill="#2563eb">1 声明与激活插件</text>
<text x="60" y="187" font-size="16">standard 选择 persona 和技能插件</text>
<text x="60" y="214" font-size="16">Loader 导入，registry 审计</text>
<text x="60" y="241" font-size="16">检查：真实组合与精确能力集合</text>
<rect x="405" y="120" width="310" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="425" y="154" font-size="19" font-weight="700" fill="#7c3aed">2 发现方法</text>
<text x="425" y="187" font-size="16">skill-filesystem 查找文件方法</text>
<text x="425" y="214" font-size="16">按 Agent 和工作目录选择可见项</text>
<text x="425" y="241" font-size="16">检查：根目录、同名覆盖、摘要</text>
<rect x="770" y="120" width="310" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="790" y="154" font-size="19" font-weight="700" fill="#7c3aed">3 提供目录与加载入口</text>
<text x="790" y="187" font-size="16">tool-skill 发布目录摘要</text>
<text x="790" y="214" font-size="16">skill 调用按需读取当前正文</text>
<text x="790" y="241" font-size="16">检查：摘要消息与实际返回正文</text>
<rect x="770" y="335" width="310" height="150" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<text x="790" y="369" font-size="19" font-weight="700" fill="#2563eb">4 组装并记录模型输入</text>
<text x="790" y="402" font-size="16">系统提示词、上下文、工具参数</text>
<text x="790" y="429" font-size="16">loop 记录到 Session 后发起请求</text>
<text x="790" y="456" font-size="16">检查：完整请求与持久化日志</text>
<rect x="405" y="335" width="310" height="150" rx="12" fill="#ecfdf5" stroke="#047857"/>
<text x="425" y="369" font-size="19" font-weight="700" fill="#047857">5 模型选择与工具执行</text>
<text x="425" y="402" font-size="16">模型选择方法、计算或请求资料</text>
<text x="425" y="429" font-size="16">工具策略和服务执行实际操作</text>
<text x="425" y="456" font-size="16">检查：调用、拒绝与外部副作用</text>
<rect x="40" y="335" width="310" height="150" rx="12" fill="#fff7ed" stroke="#c2410c"/>
<text x="60" y="369" font-size="19" font-weight="700" fill="#c2410c">6 独立判断交付结果</text>
<text x="60" y="402" font-size="16">独立计算、来源和文件期望</text>
<text x="60" y="429" font-size="16">正常任务与失败反例配对</text>
<text x="60" y="456" font-size="16">检查：结果正确而非自报完成</text>
<rect x="40" y="530" width="1040" height="74" rx="12" fill="#e2e8f0"/>
<text x="60" y="560" font-size="17" font-weight="700">两类开发反馈分别承担责任</text>
<text x="60" y="588" font-size="16">固定模型轨迹：当前实现能否正确执行？　真实模型任务：新输入能否引导可接受的决策与成果？</text>
</g>
</svg>
