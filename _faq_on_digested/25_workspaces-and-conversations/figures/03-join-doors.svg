<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>会话进入工作区的四道门与挂接校验</title>
  <desc>会话只有四种途径写入工作区的 sessionIds 名册：GUI 带 workspaceId 新建、从已归组父会话分叉、首次启动的一次性历史 bootstrap、外部集成显式调用 attachSession。每次挂接都必须通过五步目录校验。仅仅把会话建在同一路径下不会自动入组。</desc>

  <rect width="1200" height="640" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">入组只有四道门，校验门票只有一张</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">“会话目录碰巧与某个 Workspace 相同”不会自动入组；必须走显式挂接写进 sessionIds 名册</text>

  <!-- doors -->
  <text x="40" y="92" font-size="12" font-weight="700" fill="#334155">四道入组入口</text>

  <rect x="40" y="104" width="286" height="76" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="126" font-weight="700" fill="#1e40af">① GUI 在工作区下新建</text>
  <text x="56" y="146" fill="#334155" font-size="11">请求带 workspaceId，Host 取 workspace.path</text>
  <text x="56" y="163" fill="#334155" font-size="11">写入 header.cwd 后立即调 attachSession。</text>

  <rect x="40" y="192" width="286" height="76" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="214" font-weight="700" fill="#1e40af">② 会话分叉（Fork）</text>
  <text x="56" y="234" fill="#334155" font-size="11">子会话继承源会话 cwd；源会话（或 subagent</text>
  <text x="56" y="251" fill="#334155" font-size="11">最近的已归组祖先）在某工作区则自动挂入。</text>

  <rect x="40" y="280" width="286" height="76" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="302" font-weight="700" fill="#1e40af">③ 首次启动历史扫描（bootstrap）</text>
  <text x="56" y="322" fill="#334155" font-size="11">仅当 initialized = false 时按规范化 cwd</text>
  <text x="56" y="339" fill="#334155" font-size="11">把历史会话批量建组；一生只跑一次。</text>

  <rect x="40" y="368" width="286" height="76" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="390" font-weight="700" fill="#1e40af">④ 宿主集成显式调用 API</text>
  <text x="56" y="410" fill="#334155" font-size="11">如 webhook 等扩展：先 create(path) 拿到</text>
  <text x="56" y="427" fill="#334155" font-size="11">工作区，建好会话后再调 attachSession。</text>

  <defs>
    <marker id="arr25b2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#60a5fa"/></marker>
  </defs>
  <path d="M330 142 L360 142" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr25b2)"/>
  <path d="M330 230 L360 230" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr25b2)"/>
  <path d="M330 318 L360 318" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr25b2)"/>
  <path d="M330 406 L360 406" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr25b2)"/>

  <!-- gate -->
  <rect x="366" y="104" width="250" height="340" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="491" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">attachSession 五步校验</text>
  <text x="491" y="150" text-anchor="middle" font-size="10.5" fill="#14532d">packages/workspace/workspace/src/entity.ts</text>
  <line x1="384" y1="162" x2="598" y2="162" stroke="#bbf7d0"/>
  <text x="384" y="186" font-size="11" fill="#166534">1  会话存在（活会话或已落盘日志头）</text>
  <text x="384" y="212" font-size="11" fill="#166534">2  SessionHeader 中记有 cwd</text>
  <text x="384" y="238" font-size="11" fill="#166534">3  对 cwd 执行 fs.realpath 规范化</text>
  <text x="384" y="264" font-size="11" fill="#166534">4  规范化路径当前是真实存在的目录</text>
  <text x="384" y="290" font-size="11" fill="#166534">5  与 workspace.path 字符串完全相等</text>
  <rect x="384" y="308" width="214" height="46" rx="7" fill="#dcfce7" stroke="#4ade80"/>
  <text x="491" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">五步全过才写入名册</text>
  <text x="491" y="346" text-anchor="middle" font-size="10.5" fill="#166534">前插到 sessionIds 数组头部</text>
  <text x="384" y="378" font-size="10.5" fill="#166534">任一步不满足即拒绝写入，不产生半成品。</text>
  <text x="384" y="396" font-size="10.5" fill="#166534">若建会话成功但挂接失败，会话仍保留并</text>
  <text x="384" y="414" font-size="10.5" fill="#14532d">落入 Ungrouped（报 workspace-attach-failed）。</text>

  <!-- record -->
  <rect x="656" y="104" width="504" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="676" y="130" font-size="13" font-weight="700" fill="#334155">Workspace 实体记录（workspace.json）</text>
  <line x1="676" y1="142" x2="1140" y2="142" stroke="#e2e8f0"/>
  <text x="676" y="166" font-size="11" fill="#1e40af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">id: 1ae56e1b-…（稳定 UUID，不随路径改写）</text>
  <text x="676" y="188" font-size="11" fill="#1e40af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">path: /Users/…/deepseek-harness（创建时 realpath）</text>
  <text x="676" y="210" font-size="11" fill="#1e40af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">title: deepseek-harness（允许不同路径重名）</text>
  <text x="676" y="232" font-size="11" fill="#1e40af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">createdAt / updatedAt: ISO-8601</text>
  <text x="676" y="256" font-size="11" fill="#166534" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sessionIds: [ s9, s8, s7, … ]</text>
  <text x="676" y="276" font-size="10.5" fill="#64748b">名册即成员资格真相；GUI 默认按最近更新展示，手动拖拽顺序保存在浏览器本地。</text>

  <!-- array boxes -->
  <rect x="676" y="292" width="64" height="34" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="708" y="314" text-anchor="middle" font-size="11" fill="#166534">s9 新</text>
  <rect x="748" y="292" width="64" height="34" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="780" y="314" text-anchor="middle" font-size="11" fill="#166534">s8</text>
  <rect x="820" y="292" width="64" height="34" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="852" y="314" text-anchor="middle" font-size="11" fill="#166534">s7</text>
  <text x="900" y="314" font-size="11" fill="#64748b">… 新挂接会话前插在头部</text>

  <text x="676" y="356" font-size="10.5" fill="#64748b">读取过滤规则：若目录被临时挪走或删除（ENOENT），已入组老成员保留名册资格；</text>
  <text x="676" y="374" font-size="10.5" fill="#64748b">若 header 缺失或 cwd 与 path 不匹配，读取时剔除并在下次写入时落盘清理。</text>
  <text x="676" y="398" font-size="10.5" fill="#991b1b">单归属约束：一个会话最多属于一个 Workspace，过滤剔除不会自动转入其他组。</text>

  <!-- not a door -->
  <rect x="40" y="466" width="540" height="146" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="60" y="492" font-size="12" font-weight="700" fill="#991b1b">不是入组入口：仅仅目录路径相同</text>
  <text x="60" y="516" fill="#334155" font-size="11">通过 CLI、SDK 或插件测试直接创建会话时，哪怕传入的 cwd 与某个</text>
  <text x="60" y="534" fill="#334155" font-size="11">现存 Workspace 的 path 完全一致，只要没调用 attachSession，就不在名册里。</text>
  <text x="60" y="558" fill="#991b1b" font-size="11">宿主重启或刷新页面都不会重扫目录收编旧会话（initialized 已置为 true）。</text>
  <text x="60" y="584" fill="#64748b" font-size="10.5">案例印证：同一项目目录下既有已入组会话，也能同时存在数十条未分组会话。</text>

  <!-- proof -->
  <rect x="600" y="466" width="560" height="146" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="620" y="492" font-size="12" font-weight="700" fill="#92400e">为什么要设计成“显式挂接”而非“按目录自动收编”？</text>
  <text x="620" y="516" fill="#334155" font-size="11">为了保证“移除工作区”绝对安全无损：删工作区只删登记与名册，不动文件夹与会话。</text>
  <text x="620" y="534" fill="#334155" font-size="11">如果下次启动又按目录自动把旧会话扫回来，删掉的工作区就会莫名复活。</text>
  <text x="620" y="560" fill="#92400e" font-size="11">相应代价：删工作区再重加同一目录只会得到空名册；历史会话需显式补挂或用独立</text>
  <text x="620" y="578" fill="#92400e" font-size="11">DSH_HOME 隔离测试残留（排障与清理步骤见 02 篇）。</text>
</svg>
