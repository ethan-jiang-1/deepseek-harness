<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>会话进入工作区的四道门与五步挂接校验</title>
  <desc>会话只有通过 GUI 带 workspaceId 新建、从已归组会话分叉、首启一次性 bootstrap 或宿主扩展显式调 attachSession 四道门之一，并通过五步路径校验后，才会写入工作区 sessionIds 名册。</desc>
  <defs>
    <marker id="arr25c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">会话入组只有四道显式门，每次挂接必过五步目录校验</text>
  <text x="600" y="56" text-anchor="middle" font-size="11.5" fill="#475569">仅仅把会话建在与某个 Workspace 相同的目录路径下不会自动入组——必须调用 attachSession 写进 sessionIds 名册</text>

  <!-- Left: 4 Join Doors -->
  <text x="36" y="88" font-size="12" font-weight="700" fill="#334155">四道显式入组入口</text>

  <rect x="36" y="100" width="290" height="74" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="54" y="122" font-size="11.5" font-weight="700" fill="#1e3a8a">① GUI 在工作区下新建会话</text>
  <text x="54" y="142" font-size="10.5" fill="#334155">前端传 workspaceId（与显式 cwd 互斥），</text>
  <text x="54" y="160" font-size="10.5" fill="#334155">后端写 header.cwd 后立即调 attachSession</text>

  <rect x="36" y="186" width="290" height="74" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="54" y="208" font-size="11.5" font-weight="700" fill="#1e3a8a">② 从已归组会话分叉（Fork）</text>
  <text x="54" y="228" font-size="10.5" fill="#334155">子会话继承源 cwd，自动挂入源会话</text>
  <text x="54" y="246" font-size="10.5" fill="#334155">（或 subagent 最近已归组祖先）所在工作区</text>

  <rect x="36" y="272" width="290" height="74" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="54" y="294" font-size="11.5" font-weight="700" fill="#1e3a8a">③ 首启一次性扫描（bootstrap）</text>
  <text x="54" y="314" font-size="10.5" fill="#334155">仅 initialized = false 时按规范化 cwd 建组；</text>
  <text x="54" y="332" font-size="10.5" fill="#334155">置 true 后重启永远不再按目录自动补收</text>

  <rect x="36" y="358" width="290" height="74" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="54" y="380" font-size="11.5" font-weight="700" fill="#1e3a8a">④ 宿主集成扩展显式调用 API</text>
  <text x="54" y="400" font-size="10.5" fill="#334155">先调 workspaceRegistry.create(path)，</text>
  <text x="54" y="418" font-size="10.5" fill="#334155">建好会话后再显式调用 attachSession</text>

  <line x1="326" y1="137" x2="352" y2="137" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr25c)"/>
  <line x1="326" y1="223" x2="352" y2="223" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr25c)"/>
  <line x1="326" y1="309" x2="352" y2="309" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr25c)"/>
  <line x1="326" y1="395" x2="352" y2="395" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr25c)"/>

  <!-- Middle: 5-step validation gate -->
  <rect x="358" y="100" width="316" height="332" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="516" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">attachSession 五步校验门</text>
  <text x="516" y="145" text-anchor="middle" font-size="10" fill="#15803d">packages/workspace/workspace/src/entity.ts</text>
  <line x1="378" y1="158" x2="654" y2="158" stroke="#bbf7d0"/>
  <text x="380" y="182" font-size="11" fill="#14532d">1. 会话存在（内存活会话或磁盘日志头）</text>
  <text x="380" y="206" font-size="11" fill="#14532d">2. SessionHeader 中记录有初始 cwd</text>
  <text x="380" y="230" font-size="11" fill="#14532d">3. 对 cwd 执行 fs.realpath 解析成功</text>
  <text x="380" y="254" font-size="11" fill="#14532d">4. 解析目标当前是真实存在的目录</text>
  <text x="380" y="278" font-size="11" fill="#14532d">5. 与 workspace.path 字符串逐字相等</text>

  <rect x="380" y="296" width="272" height="46" rx="7" fill="#dcfce7" stroke="#4ade80"/>
  <text x="516" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">五步全过 → 前插进 sessionIds 头部</text>
  <text x="516" y="334" text-anchor="middle" font-size="10" fill="#15803d">任一步失败均拒绝写入名册</text>

  <text x="380" y="366" font-size="10" fill="#334155">注：若建会话成功但后续挂接失败，会话不销毁，</text>
  <text x="380" y="384" font-size="10" fill="#334155">而是保留在 Ungrouped 并返回错误码</text>
  <text x="380" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#166534">session/workspace-attach-failed</text>

  <line x1="674" y1="266" x2="700" y2="266" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr25c)"/>

  <!-- Right: Persisted Workspace Record -->
  <rect x="706" y="100" width="458" height="332" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="726" y="126" font-size="13" font-weight="700" fill="#0f172a">Workspace 实体记录（workspace.json）</text>
  <line x1="726" y1="140" x2="1144" y2="140" stroke="#e2e8f0"/>
  <text x="726" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1e40af">id:        "1ae56e1b-..."  // 稳定 UUID 主键</text>
  <text x="726" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1e40af">path:      "/Users/.../repo" // 创建时 realpath</text>
  <text x="726" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1e40af">title:     "repo"          // UI 改名禁重名冲突</text>
  <text x="726" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#166534">sessionIds: ["s9", "s8", "s7", ...]</text>

  <rect x="726" y="248" width="66" height="32" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="759" y="269" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">s9 新</text>
  <rect x="800" y="248" width="60" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="830" y="269" text-anchor="middle" font-size="10.5" fill="#166534">s8</text>
  <rect x="868" y="248" width="60" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="898" y="269" text-anchor="middle" font-size="10.5" fill="#166534">s7</text>
  <text x="940" y="269" font-size="10.5" fill="#64748b">← 新挂接会话前插在头部</text>

  <text x="726" y="310" font-size="10.5" font-weight="700" fill="#334155">老成员读取豁免 vs 失配剔除：</text>
  <text x="726" y="330" font-size="10" fill="#475569">· 目录临时移走或删除（ENOENT）：已入组老成员保留名册资格；</text>
  <text x="726" y="350" font-size="10" fill="#475569">· 软链改指其他目录导致 realpath 不等：读取隐藏，下次写入清理；</text>
  <text x="726" y="370" font-size="10" fill="#991b1b">· 单归属铁律：一个会话最多属于一个 Workspace 名册。</text>

  <!-- Bottom 2 explanation cards -->
  <rect x="36" y="452" width="550" height="146" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="56" y="478" font-size="12.5" font-weight="700" fill="#991b1b">常见误区：仅仅目录路径相同 ≠ 自动入组</text>
  <text x="56" y="502" font-size="10.5" fill="#334155">在首次 bootstrap 完成后，通过 CLI headless、SDK 脚本或共用 ~/.dsh 的测试直接传</text>
  <text x="56" y="522" font-size="10.5" fill="#334155">cwd 创建会话时，即便 cwd 与现有 Workspace 的 path 一字不差，因未调 attachSession</text>
  <text x="56" y="542" font-size="10.5" fill="#334155">也不会进名册；重启宿主或刷新网页同样不会重扫磁盘目录收编旧会话。</text>
  <text x="56" y="568" font-size="10" fill="#7f1d1d">实测印证：同一仓库目录下可同时存在数百条已入组会话与数十条未分组会话。</text>

  <rect x="614" y="452" width="550" height="146" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="634" y="478" font-size="12.5" font-weight="700" fill="#92400e">设计取舍：为什么不每次启动“按目录自动收编”？</text>
  <text x="634" y="502" font-size="10.5" fill="#334155">为了让“在侧栏移除工作区”绝对无损：移除操作只删登记记录与名册，保留源码与日志。</text>
  <text x="634" y="522" font-size="10.5" fill="#334155">若每次重启都按日志目录自动建组，用户刚删掉的工作区就会在下一次启动时幽灵般复活。</text>
  <text x="634" y="548" font-size="10.5" fill="#92400e">相应结果：删掉工作区再重加同一路径只会生成全新 UUID 的空名册；旧会话留在</text>
  <text x="634" y="568" font-size="10.5" fill="#92400e">Ungrouped 正常可用，确需归队须停机后经 ctx.workspaceRegistry 显式补挂。</text>
</svg>
