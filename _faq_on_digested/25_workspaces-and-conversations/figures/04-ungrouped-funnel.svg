<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>Ungrouped 是怎么被算出来的：漏斗与本机实测</title>
  <desc>左侧漏斗：磁盘上的全部会话日志先减去 subagent 子会话，再按列表可见性筛选，剩下的主会话分为已被工作区账户认领与被认领之外两类；后者就是 Ungrouped。右侧列出四种来源，以及不会进入这个桶的四类会话。数字来自本机 $DSH_HOME 的实测。</desc>

  <rect width="1200" height="680" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ungrouped 不是一条记录，是一个减法</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">可见会话 − 所有工作区账户里的会话 = Ungrouped；缺的任何一项都不会“自动归队”</text>

  <!-- funnel -->
  <text x="40" y="92" font-size="12" font-weight="700" fill="#334155">本机实测漏斗</text>

  <rect x="40" y="104" width="470" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="128" font-weight="700" fill="#334155">磁盘上的会话日志</text>
  <text x="60" y="150" fill="#64748b" font-size="11">$DSH_HOME/sessions/--&lt;cwd&gt;--/&lt;id&gt;/，共 35 个 cwd 分区</text>
  <text x="492" y="142" text-anchor="end" font-size="22" font-weight="700" fill="#0f172a">3864</text>

  <path d="M275 166 L275 186" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr25a)"/>
  <defs>
    <marker id="arr25a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="40" y="188" width="470" height="52" rx="9" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="210" fill="#991b1b" font-size="11">减去：subagent 子会话（origin=subagent，侧栏一律不显示）</text>
  <text x="60" y="228" fill="#64748b" font-size="10.5">其中 19 条仍占着某个工作区的账户名额，但不渲染成行</text>
  <text x="492" y="220" text-anchor="end" font-weight="700" fill="#991b1b">−2890</text>

  <path d="M275 240 L275 260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr25a)"/>

  <rect x="40" y="262" width="470" height="52" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="284" fill="#475569" font-size="11">减去：未选中的空白会话；没有 cwd 的冷会话不进列表</text>
  <text x="60" y="302" fill="#64748b" font-size="10.5">本机无 _no-cwd；空白是投影字段，这里按 0 计（可能低估）</text>
  <text x="492" y="294" text-anchor="end" font-weight="700" fill="#475569">−0</text>

  <path d="M275 314 L275 334" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr25a)"/>

  <rect x="40" y="336" width="470" height="56" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="358" font-weight="700" fill="#3730a3">主会话（非 subagent 的日志）</text>
  <text x="60" y="378" fill="#64748b" font-size="10.5">另有一批“空白”状态是投影缓存里的字段，不在日志头里</text>
  <text x="492" y="370" text-anchor="end" font-size="20" font-weight="700" fill="#3730a3">974</text>

  <path d="M275 392 L275 412" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr25a)"/>

  <rect x="40" y="414" width="226" height="82" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="56" y="436" font-size="11" fill="#166534">被某个工作区账户认领</text>
  <text x="153" y="468" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">916</text>
  <text x="153" y="486" text-anchor="middle" font-size="10" fill="#166534">画进对应的节</text>

  <rect x="284" y="414" width="226" height="82" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="300" y="436" font-size="11" fill="#92400e">没有任何账户认领</text>
  <text x="397" y="468" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309">58</text>
  <text x="397" y="486" text-anchor="middle" font-size="10" fill="#92400e">落到 Ungrouped</text>

  <!-- breakdown -->
  <rect x="40" y="514" width="470" height="132" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="538" font-size="11" font-weight="700" fill="#334155">这 58 条住在哪</text>
  <text x="60" y="560" fill="#334155" font-size="11">31 条  deepseek-harness（这个目录明明有工作区）</text>
  <text x="60" y="580" fill="#334155" font-size="11">25 条  ait_exam_4fun（这个目录没有工作区）</text>
  <text x="60" y="600" fill="#334155" font-size="11"> 2 条  两个 worktree / 其他目录</text>
  <text x="60" y="626" fill="#64748b" font-size="10.5">另外：31 个工作区共登记 935 个 id（含 19 个子会话）；归档 67；置顶 0。</text>

  <!-- origins -->
  <text x="560" y="92" font-size="12" font-weight="700" fill="#334155">四种来源</text>

  <rect x="560" y="104" width="600" height="72" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="578" y="126" font-weight="700" fill="#92400e">① 工作区被删了，会话没删</text>
  <text x="578" y="146" fill="#334155" font-size="11">删除只移除注册、顺序与账户；目录、文件、日志、正在跑的会话都不动；会话立刻失去归属。</text>
  <text x="578" y="164" fill="#64748b" font-size="10.5">再把同一目录加回来 = 一条新的空工作区，旧会话不会自动回来（见 05 篇）</text>

  <rect x="560" y="188" width="600" height="72" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="578" y="210" font-weight="700" fill="#92400e">② bootstrap 之后创建，却没经过 attach</text>
  <text x="578" y="230" fill="#334155" font-size="11">headless / SDK / 插件测试这类“只给 cwd”的创建方式，都属于这一类。</text>
  <text x="578" y="248" fill="#64748b" font-size="10.5">本机 58 条的主因：bootstrap 只跑一次，之后没有任何“按目录补收”的机制</text>

  <rect x="560" y="272" width="600" height="72" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="578" y="294" font-weight="700" fill="#475569">③ 会话的 cwd 失效，或与工作区路径不等</text>
  <text x="578" y="314" fill="#334155" font-size="11">目录被移走、临时目录被清、符号链接改写，都会让它读不到成员资格。</text>
  <text x="578" y="332" fill="#64748b" font-size="10.5">已入组的成员在 ENOENT 时会保留账户；但新 attach 一律拒绝</text>

  <rect x="560" y="356" width="600" height="72" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="578" y="378" font-weight="700" fill="#475569">④ 目录从来没有被登记成工作区</text>
  <text x="578" y="398" fill="#334155" font-size="11">首次启动时目录不存在、或首次之后才第一次使用的目录，都可能从未有过记录。</text>
  <text x="578" y="416" fill="#64748b" font-size="10.5">目录存在与否，不会触发自动登记</text>

  <!-- not here -->
  <rect x="560" y="442" width="600" height="204" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="578" y="466" font-size="12" font-weight="700" fill="#334155">不会出现在 Ungrouped 里的四类</text>
  <text x="578" y="490" fill="#334155" font-size="11">· subagent 子会话 — 侧栏可见性直接挡掉（tree.ts:244）</text>
  <text x="578" y="512" fill="#334155" font-size="11">· 未选中的空白会话 — 只保留当前那一条“新会话”占位</text>
  <text x="578" y="534" fill="#334155" font-size="11">· 没有 cwd 的冷会话 — 列表压根不取（list.ts:144）</text>
  <text x="578" y="556" fill="#334155" font-size="11">· 已归档会话 — 默认筛选隐藏；它仍保留账户名额</text>
  <text x="578" y="586" fill="#92400e" font-size="11">所以“我在 Ungrouped 看到插件测试”是准确的：插件测试通常非 subagent、</text>
  <text x="578" y="604" fill="#92400e" font-size="11">非空白、有 cwd、且没有 attach —— 四条都满足，就只剩这一种去处。</text>
  <text x="578" y="630" fill="#64748b" font-size="10.5">判定式：会话可见，且它不在任何 workspace.sessionIds 里。</text>
</svg>
