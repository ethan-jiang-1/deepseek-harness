<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>左侧边栏的数据来源与客户端分组投影</title>
  <desc>左侧边栏结构示意：工作区节按 Host 登记顺序排列，节内会话默认按最近更新排（手动排序保存在浏览器本地）；置顶行排在非空白行之前，空白会话只显示当前选中的那一条，已归档行默认隐藏；末尾的 Ungrouped 是 Client 用可见主会话减去所有工作区 sessionIds 算出来的差集。</desc>

  <rect width="1200" height="720" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">左侧边栏解剖：Host 提供登记名册，Client 实时算出分组</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">结构示意（非逐像素复刻）；颜色区分每一行数据的真实归属</text>

  <!-- mock sidebar -->
  <rect x="40" y="84" width="470" height="544" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="112" font-size="12" font-weight="700" fill="#334155">工作区</text>
  <rect x="400" y="98" width="90" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="445" y="112" text-anchor="middle" font-size="10" fill="#64748b">搜索 / 视图</text>

  <!-- workspace A -->
  <rect x="56" y="128" width="438" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="72" y="150" font-size="12" fill="#1e40af">▾</text>
  <path d="M88 141 h8 l3 3 h11 v10 h-22 z" fill="#93c5fd"/>
  <text x="112" y="150" font-size="12" fill="#1e40af">deepseek-harness</text>
  <text x="470" y="150" text-anchor="end" font-size="10" fill="#64748b">12</text>

  <!-- current blank -->
  <rect x="72" y="168" width="422" height="30" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="4 3"/>
  <text x="86" y="188" font-size="11" fill="#166534">新会话</text>
  <text x="486" y="188" text-anchor="end" font-size="9.5" fill="#166534">当前空白占位</text>

  <!-- pinned row -->
  <rect x="72" y="204" width="422" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="86" y="212" width="26" height="14" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="99" y="222" text-anchor="middle" font-size="8.5" fill="#1e40af">PIN</text>
  <text x="120" y="224" font-size="11" fill="#0f172a">修 snapshot 的 flaky</text>
  <text x="486" y="224" text-anchor="end" font-size="9.5" fill="#64748b">置顶领跑</text>

  <!-- ordinary running -->
  <rect x="72" y="240" width="422" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="86" y="260" font-size="11" fill="#0f172a">●  读 workspace 源码</text>
  <text x="486" y="260" text-anchor="end" font-size="9.5" fill="#64748b">运行中</text>

  <!-- archived -->
  <rect x="72" y="276" width="422" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="86" y="296" font-size="11" fill="#94a3b8">旧日志迁移</text>
  <text x="486" y="296" text-anchor="end" font-size="9.5" fill="#94a3b8">已归档（默认隐藏）</text>

  <!-- workspace B collapsed -->
  <rect x="56" y="318" width="438" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="340" font-size="12" fill="#334155">▸</text>
  <path d="M88 331 h8 l3 3 h11 v10 h-22 z" fill="#cbd5e1"/>
  <text x="112" y="340" font-size="12" fill="#334155">web-console</text>
  <text x="470" y="340" text-anchor="end" font-size="10" fill="#64748b">9</text>

  <!-- workspace C -->
  <rect x="56" y="358" width="438" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="380" font-size="12" fill="#334155">▸</text>
  <path d="M88 371 h8 l3 3 h11 v10 h-22 z" fill="#cbd5e1"/>
  <text x="112" y="380" font-size="12" fill="#334155">plugin-sandbox</text>
  <text x="470" y="380" text-anchor="end" font-size="10" fill="#64748b">7</text>

  <!-- ungrouped -->
  <rect x="56" y="400" width="438" height="34" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="72" y="422" font-size="12" font-weight="700" fill="#92400e">▾  未分组 / Ungrouped</text>
  <text x="470" y="422" text-anchor="end" font-size="10" fill="#92400e">12</text>
  <rect x="72" y="440" width="422" height="30" rx="5" fill="#ffffff" stroke="#fde68a"/>
  <text x="86" y="460" font-size="11" fill="#0f172a">插件测试残留</text>
  <rect x="72" y="476" width="422" height="30" rx="5" fill="#ffffff" stroke="#fde68a"/>
  <text x="86" y="496" font-size="11" fill="#0f172a">CLI 跑的一次任务</text>
  <text x="86" y="526" font-size="10.5" fill="#9a3412">没有“…”重命名/删除菜单，也没有路径悬浮卡片</text>
  <text x="86" y="546" font-size="10.5" fill="#9a3412">点右侧新建会话按钮无响应：没有绑定目录，不知道往哪建</text>

  <line x1="500" y1="112" x2="500" y2="612" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <text x="273" y="606" text-anchor="middle" font-size="10" fill="#94a3b8">Host 记录流 + Client 实时推导</text>

  <!-- legend right -->
  <text x="540" y="104" font-size="13" font-weight="700" fill="#334155">每一层数据的归属</text>

  <rect x="540" y="118" width="14" height="14" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="566" y="130" font-weight="700" fill="#1e40af">蓝色 = Host 的 Workspace 登记记录</text>
  <text x="566" y="150" fill="#334155">标题、路径、创建时间与置顶/归档集合来自 workspace.json。</text>
  <text x="566" y="168" fill="#334155">工作区节之间的顺序对应 Host 的 workspaceIds 数组。</text>
  <text x="566" y="186" fill="#64748b" font-size="10.5">packages/workspace/workspace/src/spec.ts</text>

  <rect x="540" y="208" width="14" height="14" rx="3" fill="#dcfce7" stroke="#4ade80"/>
  <text x="566" y="220" font-weight="700" fill="#166534">绿色 = 节内成员名册（sessionIds）与排序</text>
  <text x="566" y="240" fill="#334155">成员归属由 Host 的 sessionIds 决定；默认按最近更新排，</text>
  <text x="566" y="258" fill="#334155">手动拖拽会话顺序保存在当前浏览器本地存储，不回写 Host。</text>
  <text x="566" y="276" fill="#64748b" font-size="10.5">packages/client/ui-workspace/src/client/tree.ts</text>

  <rect x="540" y="298" width="14" height="14" rx="3" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="566" y="310" font-weight="700" fill="#92400e">琥珀 = Client 做减法算出的 Ungrouped</text>
  <text x="566" y="330" fill="#334155">把“不在任何活跃 Workspace 名册里”的可见主会话收进末尾分桶；</text>
  <text x="566" y="348" fill="#334155">Host 存储里根本没有 Ungrouped 这条记录（UNGROUPED_KEY = ''）。</text>
  <text x="566" y="366" fill="#64748b" font-size="10.5">packages/client/ui-workspace/src/client/tree.ts</text>

  <rect x="540" y="388" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="566" y="400" font-weight="700" fill="#475569">灰色 = 窗口本地视图状态</text>
  <text x="566" y="420" fill="#334155">展开折叠、排序方式、归档筛选、分组模式（按工作区 /</text>
  <text x="566" y="438" fill="#334155">按工作区树 / 平铺单列表）只存当前浏览器客户端。</text>
  <text x="566" y="456" fill="#64748b" font-size="10.5">packages/client/ui-workspace/src/client/stores.ts</text>

  <rect x="540" y="478" width="14" height="14" rx="3" fill="#fee2e2" stroke="#f87171"/>
  <text x="566" y="490" font-weight="700" fill="#991b1b">红色 = 在分组前就已过滤掉的会话</text>
  <text x="566" y="510" fill="#334155">subagent 子会话、未选中的空白会话不会进入侧栏；</text>
  <text x="566" y="528" fill="#334155">没有 cwd 的历史冷会话在列表查询阶段即被排除。</text>
  <text x="566" y="546" fill="#64748b" font-size="10.5">ui-workspace/src/client/tree.ts · session-controller/src/list.ts</text>

  <rect x="540" y="556" width="620" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="562" y="590" font-size="12" font-weight="700" fill="#334155">为什么 Ungrouped 不是故障也不是回收站</text>
  <text x="562" y="610" fill="#334155">只要会话没走显式 attach（如 CLI/SDK/测试创建，或原 Workspace 被删），就会落到这里。</text>
  <text x="562" y="628" fill="#334155">里面的会话完全正常：打开、继续对话、分叉、归档功能一应俱全。</text>
  <text x="562" y="646" fill="#64748b" font-size="10.5">不想在默认列表看到噪音时，直接归档即可隐藏，日志本身完好保留。</text>

  <!-- bottom -->
  <rect x="40" y="656" width="1120" height="48" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="678" fill="#3730a3" font-weight="700">核心分工：Host 负责持久化 Workspace 名册并通过 workspace/follow 推送；Client 的 deriveGroups 负责把会话列表投影成各节与 Ungrouped。</text>
  <text x="60" y="696" fill="#4338ca" font-size="11">左侧每一行代表一个 Session；Conversation 则是点开某一行后把事件流装配成聊天界面的视图层，不参与侧栏分组。</text>
</svg>
