<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>左侧边栏的数据来源与客户端分组投影</title>
  <desc>左侧示意边栏结构（工作区节、当前空白占位、置顶行、普通行、归档隐藏行与末尾 Ungrouped）；右侧拆解 Host 持久化名册、Client 实时差集计算与窗口本地偏好的归属分工。</desc>
  <rect width="1160" height="640" rx="8" fill="#f8fafc"/>
  <text x="580" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">左侧边栏解剖：Host 持久化名册，Client 实时投影分组与差集</text>
  <text x="580" y="56" text-anchor="middle" font-size="11.5" fill="#475569">边栏每一行是一个 Session（会话）；Conversation 是点开某行后将事件流渲染为聊天气泡的前端视图，不参与分组</text>

  <!-- Left: Sidebar schematic -->
  <rect x="36" y="80" width="450" height="486" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="108" font-size="12.5" font-weight="700" fill="#0f172a">侧栏视图结构示意</text>
  <rect x="372" y="92" width="94" height="22" rx="11" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="419" y="107" text-anchor="middle" font-size="10" fill="#475569">搜索 / 视图菜单</text>

  <!-- Workspace A expanded -->
  <rect x="52" y="124" width="418" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="68" y="145" font-size="12" font-weight="700" fill="#1e3a8a">▾  deepseek-harness</text>
  <text x="454" y="145" text-anchor="end" font-size="10.5" fill="#475569">12</text>

  <rect x="68" y="164" width="402" height="28" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="4 3"/>
  <text x="84" y="182" font-size="11" fill="#166534">新会话</text>
  <text x="456" y="182" text-anchor="end" font-size="9.5" fill="#166534">当前选中空白占位（排最前）</text>

  <rect x="68" y="198" width="402" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="216" font-size="11" font-weight="700" fill="#1e40af">[PIN] 修复快照偶发抖动</text>
  <text x="456" y="216" text-anchor="end" font-size="9.5" fill="#475569">全局置顶（次优先）</text>

  <rect x="68" y="232" width="402" height="28" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="250" font-size="11" fill="#0f172a">● 梳理工作区挂接源码</text>
  <text x="456" y="250" text-anchor="end" font-size="9.5" fill="#64748b">普通运行中（按更新降序）</text>

  <rect x="68" y="266" width="402" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="84" y="284" font-size="11" fill="#94a3b8">历史迁移排查</text>
  <text x="456" y="284" text-anchor="end" font-size="9.5" fill="#94a3b8">已归档（默认隐藏）</text>

  <!-- Workspace B collapsed -->
  <rect x="52" y="306" width="418" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="327" font-size="12" fill="#334155">▸  web-console</text>
  <text x="454" y="327" text-anchor="end" font-size="10.5" fill="#64748b">9</text>

  <!-- Ungrouped bucket -->
  <rect x="52" y="350" width="418" height="32" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="68" y="371" font-size="12" font-weight="700" fill="#92400e">▾  未分组 / Ungrouped</text>
  <text x="454" y="371" text-anchor="end" font-size="10.5" fill="#92400e">58</text>

  <rect x="68" y="390" width="402" height="28" rx="5" fill="#ffffff" stroke="#fde68a"/>
  <text x="84" y="408" font-size="11" fill="#0f172a">CLI headless 执行记录</text>

  <rect x="68" y="424" width="402" height="28" rx="5" fill="#ffffff" stroke="#fde68a"/>
  <text x="84" y="442" font-size="11" fill="#0f172a">共用 ~/.dsh 的插件测试会话</text>

  <text x="68" y="476" font-size="10.5" fill="#92400e">· 无绑定实体：不显示重命名/删除菜单与路径悬浮卡</text>
  <text x="68" y="496" font-size="10.5" fill="#92400e">· 点它的“新建会话”无响应，但内部会话聊天/分叉/归档全正常</text>
  <text x="68" y="516" font-size="10" fill="#64748b">· 选中未分组会话时自动展开此分桶，防止当前行折起丢失</text>

  <!-- Right: 4 Attribution Cards -->
  <rect x="514" y="80" width="610" height="108" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="534" y="106" font-size="12.5" font-weight="700" fill="#1e3a8a">① Host 权威持久层（workspace.json + workspace/follow 实时同步）</text>
  <text x="534" y="128" font-size="10.5" fill="#334155">· 工作区标题、规范化路径、节间顺序（workspaceIds）与各组已认领 sessionIds 名册</text>
  <text x="534" y="148" font-size="10.5" fill="#334155">· 全局置顶集合（pinnedSessionIds）与全局归档集合（archivedSessionIds，与置顶互斥）</text>
  <text x="534" y="168" font-size="10" fill="#1e40af">多开窗口实时同步：增删改排工作区、新建/分叉会话、置顶与归档均写回 Host</text>

  <rect x="514" y="200" width="610" height="108" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="534" y="226" font-size="12.5" font-weight="700" fill="#92400e">② Client 实时减法层（ui-workspace/src/client/tree.ts · deriveGroups）</text>
  <text x="534" y="248" font-size="10.5" fill="#334155">· 服务端根本不存在 Ungrouped 分组记录（前端内部键 UNGROUPED_KEY = ''）</text>
  <text x="534" y="268" font-size="10.5" fill="#334155">· 计算公式：侧栏可见主会话 − 全部活跃 Workspace 的 sessionIds 并集 = 末尾未分组桶</text>
  <text x="534" y="288" font-size="10" fill="#78350f">清理视觉噪音只需点“归档”隐藏，切勿进 sessions/ 强删目录或运行期手改 JSON</text>

  <rect x="514" y="320" width="610" height="108" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="534" y="346" font-size="12.5" font-weight="700" fill="#0f172a">③ 浏览器窗口本地层（dsh.workspace.view.v5，多窗口互不同步）</text>
  <text x="534" y="368" font-size="10.5" fill="#334155">· 展开折叠状态、是否显示已归档筛选、分组视图模式（工作区 / 路径树 / 平铺单列表）</text>
  <text x="534" y="388" font-size="10.5" fill="#334155">· 节内上下拖拽会话调整的手动顺序仅存当前浏览器（不调宿主 insertSessionBefore）</text>
  <text x="534" y="408" font-size="10" fill="#64748b">切到“平铺单列表”视图时不分节展示，Ungrouped 分桶也随之消失</text>

  <rect x="514" y="440" width="610" height="126" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="534" y="466" font-size="12.5" font-weight="700" fill="#991b1b">④ 在进入差集计算前就被直接过滤掉的三类会话（连 Ungrouped 都不进）</text>
  <text x="534" y="490" font-size="10.5" fill="#334155">· subagent 子会话（origin === 'subagent'）：哪怕跑出数千条子任务也不会撑爆侧栏</text>
  <text x="534" y="510" font-size="10.5" fill="#334155">· 未处于当前选中态的空白占位会话：仅保留用户当前点开的那一条空会话</text>
  <text x="534" y="530" font-size="10.5" fill="#334155">· 早期无 cwd 字段的历史冷会话：服务端 session-controller 列表查询阶段即跳过</text>

  <!-- Footer -->
  <rect x="36" y="582" width="1088" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="580" y="607" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">一句话排障：看到同一代码仓的新会话掉进 Ungrouped，不是缓存坏了，而是创建它的入口没调 attachSession（测试请配独立 DSH_HOME）。</text>
</svg>
