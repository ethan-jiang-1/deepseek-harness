<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>四个常被混为一谈的目录与归属概念</title>
  <desc>拆清四个独立概念：process.cwd() 仅作启动缺省兜底；SessionHeader.cwd 在创建时定死并锚定沙箱边界与入组门票；ctx.workingDirectory 决定当前轮工具目录且可中途切换；Workspace 登记记录靠 sessionIds 名册决定左侧分组。</desc>
  <rect width="1240" height="590" rx="8" fill="#f8fafc"/>
  <text x="620" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">四个“目录与归属”概念各司其职，只有第四列决定左侧边栏分组</text>
  <text x="620" y="56" text-anchor="middle" font-size="11.5" fill="#475569">启动目录只做无参兜底；会话中途切目录只改工具当前位置，既不扩大沙箱写边界，也不改变侧栏分组</text>

  <!-- Col 1: process.cwd() -->
  <rect x="28" y="82" width="280" height="372" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="168" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">① 进程启动目录</text>
  <text x="168" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7f1d1d">process.cwd()</text>
  <line x1="48" y1="144" x2="288" y2="144" stroke="#fecaca"/>
  <text x="48" y="168" font-size="11" font-weight="700" fill="#991b1b">何时确定</text>
  <text x="48" y="188" font-size="11" fill="#334155">启动 dsh 命令时由操作系统进程确定；</text>
  <text x="48" y="206" font-size="10.5" fill="#64748b">换终端目录重启进程才会改变</text>
  <text x="48" y="238" font-size="11" font-weight="700" fill="#991b1b">仅做三处缺省兜底</text>
  <text x="48" y="260" font-size="10.5" fill="#334155">· CLI / headless 新建会话的默认目录</text>
  <text x="48" y="282" font-size="10.5" fill="#334155">· API 建会话未传 workspaceId / cwd 时</text>
  <text x="48" y="304" font-size="10.5" fill="#334155">· 早期无 cwd 冷会话的工作目录兜底</text>
  <rect x="48" y="374" width="240" height="60" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="168" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">不参与左侧边栏分组</text>
  <text x="168" y="418" text-anchor="middle" font-size="10" fill="#7f1d1d">换目录敲 dsh web，侧栏列表丝毫不变</text>

  <!-- Col 2: SessionHeader.cwd -->
  <rect x="328" y="82" width="280" height="372" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="468" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">② 原始项目与沙箱可写根</text>
  <text x="468" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#14532d">SessionHeader.cwd + sandboxPolicy</text>
  <line x1="348" y1="144" x2="588" y2="144" stroke="#bbf7d0"/>
  <text x="348" y="168" font-size="11" font-weight="700" fill="#166534">何时确定</text>
  <text x="348" y="188" font-size="11" fill="#334155">创建会话时写入日志头；</text>
  <text x="348" y="206" font-size="10.5" fill="#64748b">一旦落盘终身不可修改</text>
  <text x="348" y="238" font-size="11" font-weight="700" fill="#166534">锚定三项硬边界</text>
  <text x="348" y="260" font-size="10.5" fill="#334155">· workspace-write 沙箱免审可写边界</text>
  <text x="348" y="282" font-size="10.5" fill="#334155">· 挂入 Workspace 时的 realpath 门票</text>
  <text x="348" y="304" font-size="10.5" fill="#334155">· 磁盘 sessions/--&lt;cwd&gt;--/ 分区目录名</text>
  <rect x="348" y="374" width="240" height="60" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="468" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">只当门票，不自动入组</text>
  <text x="468" y="418" text-anchor="middle" font-size="10" fill="#14532d">同路径但未调 attach 仍落入 Ungrouped</text>

  <!-- Col 3: ctx.workingDirectory -->
  <rect x="628" y="82" width="280" height="372" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="768" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">③ 会话当前有效工作目录</text>
  <text x="768" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#78350f">ctx.workingDirectory</text>
  <line x1="648" y1="144" x2="888" y2="144" stroke="#fde68a"/>
  <text x="648" y="168" font-size="11" font-weight="700" fill="#92400e">何时确定</text>
  <text x="648" y="188" font-size="11" fill="#334155">初始等于 SessionHeader.cwd；</text>
  <text x="648" y="206" font-size="10.5" fill="#64748b">对话中途可调 working_directory 切换</text>
  <text x="648" y="238" font-size="11" font-weight="700" fill="#92400e">决定本轮工具行为</text>
  <text x="648" y="260" font-size="10.5" fill="#334155">· 相对路径文件读写与补全基准</text>
  <text x="648" y="282" font-size="10.5" fill="#334155">· 新拉起子进程与 AGENTS.md / 技能扫描</text>
  <text x="648" y="304" font-size="10" fill="#64748b">（已打开的持久终端保留原进程目录）</text>
  <rect x="648" y="374" width="240" height="60" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="768" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">中途 cd 不扩沙箱不换组</text>
  <text x="768" y="418" text-anchor="middle" font-size="10" fill="#78350f">沙箱与侧栏归属仍钉在创建时的 ②</text>

  <!-- Col 4: Workspace entity -->
  <rect x="928" y="82" width="284" height="372" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1070" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">④ 侧栏工作区登记实体</text>
  <text x="1070" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1e40af">Workspace (workspace.json)</text>
  <line x1="948" y1="144" x2="1192" y2="144" stroke="#bfdbfe"/>
  <text x="948" y="168" font-size="11" font-weight="700" fill="#1e3a8a">何时确定</text>
  <text x="948" y="188" font-size="11" fill="#334155">保存在 $DSH_HOME/storages/ 下；</text>
  <text x="948" y="206" font-size="10.5" fill="#64748b">含稳定 UUID、realpath、标题与 sessionIds</text>
  <text x="948" y="238" font-size="11" font-weight="700" fill="#1e3a8a">三条核心规则</text>
  <text x="948" y="260" font-size="10.5" fill="#334155">· 同一规范化路径最多登记一条记录</text>
  <text x="948" y="282" font-size="10.5" fill="#334155">· 成员资格只认有序 sessionIds 名册</text>
  <text x="948" y="304" font-size="10.5" fill="#334155">· 模型零感知；首启空库建默认工作区</text>
  <rect x="948" y="374" width="244" height="60" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1070" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">直接决定左侧边栏分组</text>
  <text x="1070" y="418" text-anchor="middle" font-size="10" fill="#1e40af">切换 DSH_HOME 才会切换整套工作区</text>

  <!-- Footer comparison -->
  <rect x="28" y="472" width="1184" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="496" font-size="11.5" font-weight="700" fill="#0f172a">三条常见操作链的真实走向对比</text>
  <text x="48" y="520" font-size="11" fill="#1e3a8a">· GUI 在某工作区点新建：取 ④ workspace.path → 写入 ② SessionHeader.cwd（初始化 ③） → 调 attachSession 写入 ④ sessionIds 名册（入组）。</text>
  <text x="48" y="541" font-size="11" fill="#991b1b">· CLI / SDK / 插件测试建会话：取 ① process.cwd() 或显式 cwd → 写入 ②（初始化 ③） → 未调 attachSession → 在侧栏落入 Ungrouped。</text>
  <text x="48" y="562" font-size="11" fill="#475569">· 会话中途调用 working_directory({ cd })：仅更新 ③ ctx.workingDirectory 并记事件，② 沙箱边界与 ④ 侧栏归属均保持原样。</text>
</svg>
