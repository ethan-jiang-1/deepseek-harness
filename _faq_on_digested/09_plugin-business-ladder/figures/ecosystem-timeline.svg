<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title>生态是附件：别人替你踩过的路，不是你的生意</title>
  <desc>两条时间线。上：DSH 2026-08 发布两周内，第三方已占先分发层（awesome 列表、媒体报道、目录站快照 5,886 项目、imsai-sh 11,424 索引）。下：先例与反例——Koishi 上一轮 4 年长出 4,000+ 插件、官方市场是 npm 薄目录不碰支付、今天仍活；GPT Store 反例：无分成+无门禁沦为垃圾场。底部结论框：生态对 owner 的读法。</desc>
  <rect width="780" height="440" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">生态是附件：别人替你踩过的路，不是你的生意</text>
  <text x="390" y="46" text-anchor="middle" font-size="12" fill="#888">上：DSH 发布两周内的第三方分发层；下：上一轮胜仗与反例——目录不挣钱，信任靠 provenance</text>

  <!-- 上轨：DSH 当下 -->
  <text x="70" y="82" font-size="12.5" font-weight="700" fill="#2f4fa8">DSH 当下（2026-08，发布两周内）</text>
  <line x1="70" y1="120" x2="730" y2="120" stroke="#4a6fd4" stroke-width="2"/>
  <g fill="#4a6fd4">
    <circle cx="130" cy="120" r="5"/>
    <circle cx="320" cy="120" r="5"/>
    <circle cx="530" cy="120" r="5"/>
    <circle cx="700" cy="120" r="5"/>
  </g>
  <g font-size="10" fill="#2f4fa8">
    <text x="130" y="104" text-anchor="middle">08-13</text>
    <text x="320" y="104" text-anchor="middle">08-14</text>
    <text x="530" y="104" text-anchor="middle">08-27/28</text>
    <text x="700" y="104" text-anchor="middle">两周内</text>
  </g>
  <g font-size="10" fill="#555">
    <text x="130" y="140" text-anchor="middle">awesome 列表</text>
    <text x="130" y="153" text-anchor="middle">developer preview</text>
    <text x="320" y="140" text-anchor="middle">Gigazine 报道</text>
    <text x="320" y="153" text-anchor="middle">v0.1 MIT 发布</text>
    <text x="530" y="140" text-anchor="middle">目录站快照：5,886 项目 / 11 分类</text>
    <text x="530" y="166" text-anchor="middle">58% 落在"其他"——分类学没跟上</text>
    <text x="700" y="140" text-anchor="middle">imsai-sh 自报 11,424 索引</text>
    <text x="700" y="179" text-anchor="middle" font-weight="700" fill="#b03a3a">分发层被第三方占先</text>
  </g>

  <!-- 下轨：先例与反例 -->
  <text x="70" y="222" font-size="12" font-weight="700" fill="#a84f2f">先例与反例（Koishi / GPT Store）</text>
  <line x1="70" y1="252" x2="730" y2="252" stroke="#d0a53f" stroke-width="2"/>
  <g fill="#d0a53f">
    <circle cx="170" cy="252" r="5"/>
    <circle cx="420" cy="252" r="5"/>
    <circle cx="650" cy="252" r="5"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="170" y="236" text-anchor="middle" font-weight="700" fill="#a84f2f">上一轮胜仗</text>
    <text x="170" y="269" text-anchor="middle">4,000+ 社区插件</text>
    <text x="170" y="284" text-anchor="middle">官方市场 = npm 薄目录、</text>
    <text x="170" y="297" text-anchor="middle">不碰支付、~3 天同步</text>
    <text x="420" y="236" text-anchor="middle" font-weight="700" fill="#a84f2f">今天仍活</text>
    <text x="420" y="271" text-anchor="middle">v4.18.11 · ~23.9k 月下载</text>
    <text x="420" y="284" text-anchor="middle">GitHub 最后 push 2026-03</text>
    <text x="650" y="236" text-anchor="middle" font-weight="700" fill="#a33a3a">反面范本</text>
    <text x="650" y="271" text-anchor="middle">GPT Store：无分成+无门禁</text>
    <text x="650" y="284" text-anchor="middle">= 克隆垃圾刷爆；分成从未超</text>
    <text x="650" y="297" text-anchor="middle">试点；2026-08 收紧个人 GPT</text>
  </g>

  <!-- 结论框 -->
  <rect x="70" y="330" width="660" height="66" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="86" y="350" font-size="10.5" fill="#333" font-weight="700">对 owner 的读法：生态只回答"哪些方向被证明有用"——下载、复用、按需装。</text>
  <text x="86" y="368" font-size="10" fill="#555">Koishi 验证了"能长出可复用组件"；没验证"有人肯为治理付钱"——后者不在本题。</text>
  <text x="86" y="386" font-size="10" fill="#555">计数五读数 11,916 → 5,886 → 11,424 → ~3,300 → 306；压缩率 2.6% = 策展当前的市场价值量</text>

  <text x="70" y="428" font-size="10" fill="#888">目录站数字为站方自报（2026-08-27 快照）；来源与 live-check 清单见 research.md 与 01-生态证据与历史先例.md</text>
</svg>