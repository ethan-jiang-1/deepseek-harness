<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>插件安装的三条触发入口与落盘管道</title>
  <desc>不论从 Desktop 界面、Web 界面还是 dsh plugin 命令行发起安装，真正执行安装的都是对应宿主上的 pnpm，持久化落点都是目标 Profile 目录。</desc>
  <defs>
    <marker id="arr23c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="470" rx="8" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">插件安装的执行位置：三条触发通道，同一套落盘机制</text>
  <text x="500" y="56" text-anchor="middle" font-size="11.5" fill="#475569">关键不在“从哪个界面点按钮”，而在“哪套运行时的 pnpm 执行安装、写进哪个 Profile 目录”</text>

  <text x="40" y="88" font-size="11.5" font-weight="700" fill="#334155">① 触发入口</text>
  <text x="396" y="88" font-size="11.5" font-weight="700" fill="#334155">② 执行安装的包管理器</text>
  <text x="692" y="88" font-size="11.5" font-weight="700" fill="#334155">③ 持久化落点与生效方式</text>

  <!-- Row 1: Desktop -->
  <rect x="40" y="100" width="316" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="124" font-size="12" font-weight="700" fill="#1e3a8a">Desktop 窗口内的 Plugins 页</text>
  <text x="58" y="145" font-size="10.5" fill="#334155">Add plugin / Discover / 官方按需 / Creator 代装</text>
  <text x="58" y="165" font-size="10" fill="#475569">或退出应用后用桌面菜单导出的 dsh 命令操作</text>

  <line x1="356" y1="144" x2="390" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr23c)"/>

  <rect x="396" y="100" width="256" height="88" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="414" y="124" font-size="12" font-weight="700" fill="#1e3a8a">桌面壳内置 pnpm</text>
  <text x="414" y="145" font-size="10.5" fill="#334155">不依赖本机 PATH 上的 Node / pnpm</text>
  <text x="414" y="165" font-size="10" fill="#475569">自动探测 npm 官方源与镜像备用源</text>

  <line x1="652" y1="144" x2="686" y2="144" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr23c)"/>

  <rect x="692" y="100" width="268" height="88" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="710" y="124" font-size="12" font-weight="700" fill="#92400e">$DSH_HOME/profiles/desktop</text>
  <text x="710" y="145" font-size="10.5" fill="#334155">运行期由 Electron 独占写锁</text>
  <text x="710" y="165" font-size="10" fill="#78350f">支持 HMR 在线激活，否则提示重启生效</text>

  <!-- Row 2: Web UI -->
  <rect x="40" y="204" width="316" height="88" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="58" y="228" font-size="12" font-weight="700" fill="#166534">浏览器内的 Plugins 页（dsh web）</text>
  <text x="58" y="249" font-size="10.5" fill="#334155">与桌面端共用同一套前端界面与交互流程</text>
  <text x="58" y="269" font-size="10" fill="#475569">远程访问时，本地路径参数指服务器磁盘路径</text>

  <line x1="356" y1="248" x2="390" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr23c)"/>

  <rect x="396" y="204" width="256" height="88" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="414" y="228" font-size="12" font-weight="700" fill="#166534">Web Host 所在机器的 pnpm</text>
  <text x="414" y="249" font-size="10.5" fill="#334155">在运行 dsh web 的宿主机进程上执行</text>
  <text x="414" y="269" font-size="10" fill="#475569">浏览器仅做展示与指令下发</text>

  <line x1="652" y1="248" x2="686" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr23c)"/>

  <rect x="692" y="204" width="268" height="88" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="710" y="228" font-size="12" font-weight="700" fill="#92400e">$DSH_HOME/profiles/web</text>
  <text x="710" y="249" font-size="10.5" fill="#334155">（或当前启动所选的自命名 Profile）</text>
  <text x="710" y="269" font-size="10" fill="#78350f">依赖树、pnpm-lock.yaml 与桌面端完全独立</text>

  <!-- Row 3: CLI -->
  <rect x="40" y="308" width="316" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="332" font-size="12" font-weight="700" fill="#0f172a">终端命令行（dsh plugin）</text>
  <text x="58" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1e3a8a">dsh plugin --profile web add &lt;spec&gt;</text>
  <text x="58" y="373" font-size="10" fill="#475569">--profile 须写在 add / remove 等子命令之前</text>

  <line x1="356" y1="352" x2="390" y2="352" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr23c)"/>

  <rect x="396" y="308" width="256" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="414" y="332" font-size="12" font-weight="700" fill="#0f172a">当前 PATH 上的 pnpm</text>
  <text x="414" y="353" font-size="10.5" fill="#334155">原样转发参数至目标 Profile 目录</text>
  <text x="414" y="373" font-size="10" fill="#475569">npm 全局 CLI 禁止操作 --profile desktop</text>

  <line x1="652" y1="352" x2="686" y2="352" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr23c)"/>

  <rect x="692" y="308" width="268" height="88" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="710" y="332" font-size="12" font-weight="700" fill="#92400e">目标 profiles/&lt;name&gt;/</text>
  <text x="710" y="353" font-size="10.5" fill="#334155">自动将含 dsh.bundle 的包记入 bundles</text>
  <text x="710" y="373" font-size="10" fill="#78350f">后台运行中 Profile 需重载或重启生效</text>

  <!-- Footer -->
  <rect x="40" y="412" width="920" height="42" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="500" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">共同门禁：安装与启动均强校验 engines.dsh 兼容范围；pnpm 11 默认拦截 postinstall 等脚本（需用户显式批准后重试）。</text>
  <text x="500" y="446" text-anchor="middle" font-size="10" fill="#4338ca">下载失败会自动回滚 package.json 与锁文件；装上后激活抛错则会保留条目并展示报错堆栈以便排查。</text>
</svg>
