<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 550" width="1020" height="550" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>开发期四层配置叠加与免发版挂载手段</title>
  <desc>DSH 按固定顺序从底层 Bundle patch 向上叠加 Profile patch、Home patch 与命令行 --patch；开发期可结合本地 link/tgz、克隆测试 Profile 或源码热构建免发版验证。</desc>
  <defs>
    <marker id="arr23d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1020" height="550" rx="8" fill="#f8fafc"/>
  <text x="510" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">开发期免发版调试：四层配置叠加优先级 + 三种本地挂载法</text>
  <text x="510" y="56" text-anchor="middle" font-size="11.5" fill="#475569">自下而上依次覆盖（同名插件行的 config 为整块替换）；可用 dsh --profile &lt;name&gt; --dump-config 静态核对最终合成结果</text>

  <!-- Left: 4-layer stack -->
  <text x="44" y="88" font-size="12" font-weight="700" fill="#334155">四层配置叠加栈（越靠上优先级越高）</text>

  <rect x="44" y="102" width="536" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="64" y="126" font-size="12" font-weight="700" fill="#991b1b">第 4 层（最高）：命令行 --patch &lt;overlay.yml&gt;</text>
  <text x="64" y="148" font-size="10.5" fill="#7f1d1d">仅对当次启动进程生效，按参数顺序最后一个赢；退出进程立即恢复原状</text>

  <rect x="44" y="176" width="536" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="64" y="200" font-size="12" font-weight="700" fill="#92400e">第 3 层：Home 全局层 $DSH_HOME/cordis.patch.yml</text>
  <text x="64" y="222" font-size="10.5" fill="#78350f">跨该 Home 下全部 Profile 生效；注意它会压过第 2 层设置页保存并拦截 UI 改写</text>

  <rect x="44" y="250" width="536" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="64" y="274" font-size="12" font-weight="700" fill="#1e3a8a">第 2 层：Profile 用户层 profiles/&lt;name&gt;/cordis.patch.yml</text>
  <text x="64" y="296" font-size="10.5" fill="#1e40af">Web / Desktop 设置面板（configEditor）读写此层；开启 HMR 时保存即在线重载</text>

  <rect x="44" y="324" width="536" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="348" font-size="12" font-weight="700" fill="#334155">第 1 层（铺底）：Bundle 自带 patch</text>
  <text x="64" y="370" font-size="10.5" fill="#475569">按 profile package.json 中 dsh.profile.bundles 数组顺序依次铺底，提供出厂默认配置</text>

  <line x1="604" y1="376" x2="604" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#arr23d)"/>
  <text x="604" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">优先级递增</text>

  <!-- Right: 3 local mount methods -->
  <text x="636" y="88" font-size="12" font-weight="700" fill="#334155">三种免发 npm 包的本地调试手段</text>

  <rect x="636" y="102" width="344" height="92" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="656" y="126" font-size="12" font-weight="700" fill="#166534">A · 本地路径或 .tgz 装进测试 Profile</text>
  <text x="656" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#14532d">dsh plugin --profile web add link:/abs/pkg</text>
  <text x="656" y="168" font-size="10.5" fill="#334155">或 pnpm pack 后装 .tgz 冒烟检验 files 白名单；</text>
  <text x="656" y="184" font-size="10" fill="#475569">记得改完插件源码要先构建 exports 指向的产物</text>

  <rect x="636" y="206" width="344" height="86" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="656" y="230" font-size="12" font-weight="700" fill="#3730a3">B · 派生干净测试 Profile</text>
  <text x="656" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#312e81">dsh --profile lab --from-default-profile web</text>
  <text x="656" y="274" font-size="10" fill="#4338ca">注：复制内置出厂模板（重跑会重置同名 Profile！）</text>

  <rect x="636" y="304" width="344" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="656" y="328" font-size="12" font-weight="700" fill="#0f172a">C · 主仓源码级热开发</text>
  <text x="656" y="350" font-size="10.5" fill="#334155">pnpm run dev:web：持续增量重建前端客户端 bundle</text>
  <text x="656" y="370" font-size="10" fill="#475569">pnpm run dev:desktop：自动关进 .desktop-build/ 沙盒</text>

  <!-- Pitfalls box -->
  <rect x="44" y="404" width="936" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="428" font-size="12" font-weight="700" fill="#0f172a">最易踩空的三个调试边界</text>
  <text x="64" y="450" font-size="10.5" fill="#334155">1. 正式签名的 Desktop 安装包会忽略 DSH_DESKTOP_PNPM_ENTRY / _DSH_DIR / _PRIMARY_RUNTIME_DIR 等开发期底层路径覆盖变量。</text>
  <text x="64" y="470" font-size="10.5" fill="#334155">2. 第 3/4 层覆写某插件 config 后，设置界面会报 overridden by a home patch or command-line overlay 拒绝保存，防止高优先级规则被静默吞掉。</text>

  <!-- Bottom summary -->
  <rect x="44" y="500" width="936" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="512" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">推荐顺序：单次验证挂 --patch → 联调插件用 link: + 独立 Profile → 发版前必跑 pnpm pack + 干净 DSH_HOME 验收 .tgz。</text>
</svg>
