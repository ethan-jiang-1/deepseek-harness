<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Desktop 与全局 dsh：可执行侧天然隔离，数据侧默认共享</text>
  <text x="480" y="54" text-anchor="middle" font-size="11" fill="#6b7280">想“完全独立”，要动两个根：$DSH_HOME（数据）与 --user-data-dir（壳状态）；应用内没有开关。</text>

  <!-- left column -->
  <rect x="40" y="76" width="400" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="240" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">全局 npm dsh（nvm 里那个）</text>

  <rect x="40" y="134" width="400" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="156" font-size="11" fill="#334155">可执行：~/.nvm/.../node_modules/@deepseek-ai/dsh</text>
  <text x="56" y="176" font-size="11" fill="#334155">包管理：你自己的 npm / pnpm</text>

  <rect x="40" y="198" width="400" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="225" font-size="11" fill="#334155">profile：~/.dsh/profiles/web（dsh web 等）</text>

  <!-- right column -->
  <rect x="520" y="76" width="400" height="46" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="720" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Desktop 应用</text>

  <rect x="520" y="134" width="400" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="536" y="156" font-size="11" fill="#1e3a8a">自带 runtime：app.asar/dsh（不解析全局 dsh）</text>
  <text x="536" y="176" font-size="11" fill="#1e3a8a">包管理：bundled pnpm（不依赖系统 pnpm）</text>

  <rect x="520" y="198" width="400" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="536" y="225" font-size="11" fill="#1e3a8a">profile：profiles/desktop（壳写锁）</text>

  <!-- exclusive markers -->
  <text x="240" y="262" text-anchor="middle" font-size="10.5" fill="#64748b">↑ 这一侧完全独立：包、依赖、lockfile、node_modules 都不共享</text>
  <text x="720" y="262" text-anchor="middle" font-size="10.5" fill="#64748b">↑ 右侧同理：包、依赖、lockfile 都不共享</text>

  <!-- shared band -->
  <rect x="40" y="284" width="880" height="128" rx="10" fill="#fef9c3" stroke="#fde047"/>
  <text x="60" y="312" font-size="13" font-weight="700" fill="#713f12">$DSH_HOME（默认两边共享；默认 ~/.dsh）</text>
  <text x="60" y="332" font-size="10.5" fill="#854d0e">两边都能读写，所以“装 Desktop 会不会污染全局”要分两层看：可执行层不会，用户数据层会。</text>
  <rect x="60" y="346" width="160" height="34" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="140" y="368" text-anchor="middle" font-size="11" fill="#713f12">会话 sessions/</text>
  <rect x="232" y="346" width="160" height="34" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="312" y="368" text-anchor="middle" font-size="11" fill="#713f12">storages/ 工作区表</text>
  <rect x="404" y="346" width="160" height="34" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="484" y="368" text-anchor="middle" font-size="11" fill="#713f12">凭据 .credentials.yaml</text>
  <rect x="576" y="346" width="160" height="34" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="656" y="368" text-anchor="middle" font-size="11" fill="#713f12">附件 attachments/</text>
  <rect x="748" y="346" width="152" height="34" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="824" y="368" text-anchor="middle" font-size="11" fill="#713f12">.anonymous-user-id</text>
  <text x="60" y="400" font-size="10.5" fill="#854d0e">cache/ 与 logs/ 同样按 home。可执行包、插件激活、lockfile、node_modules 不共享；设置写在各自 profile 的 cordis.patch.yml，也不共享。</text>

  <!-- arrows from columns into band -->
  <line x1="60" y1="242" x2="60" y2="282" stroke="#4b5563" marker-end="url(#arr2)"/>
  <line x1="900" y1="242" x2="900" y2="282" stroke="#4b5563" marker-end="url(#arr2)"/>

  <!-- how to isolate -->
  <rect x="40" y="428" width="430" height="118" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="56" y="452" font-size="12" font-weight="700" fill="#065f46">要独立环境：给它一个独立 DSH_HOME</text>
  <text x="56" y="472" font-size="10.5" fill="#065f46">Desktop 继承进程环境，login shell 里的 DSH_* 不覆盖已继承值；</text>
  <text x="56" y="490" font-size="10.5" fill="#065f46">Finder 启动不继承你的 export，要从终端直接起二进制：</text>
  <text x="56" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#064e3b">DSH_HOME=$PWD/desk-home \</text>
  <text x="56" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#064e3b">  "/Applications/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness"</text>

  <rect x="490" y="428" width="430" height="118" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="506" y="452" font-size="12" font-weight="700" fill="#7f1d1d">做不到的部分</text>
  <text x="506" y="472" font-size="10.5" fill="#7f1d1d">Electron userData（键位、desktop/settings.json、浏览器数据）</text>
  <text x="506" y="490" font-size="10.5" fill="#7f1d1d">没有应用内开关，只能用 --user-data-dir 指到别处；</text>
  <text x="506" y="508" font-size="10.5" fill="#7f1d1d">DSH_DESKTOP_USER_DATA_DIR 仅开发态生效。</text>
  <text x="506" y="526" font-size="10.5" fill="#7f1d1d">单实例锁也按 userData：不换它就只能跑一个。</text>

  <!-- targets strip -->
  <rect x="40" y="556" width="212" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="52" y="576" font-size="10.5" fill="#065f46">mac-arm64 ✓ 0.2.1-rc.3</text>
  <rect x="262" y="556" width="212" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="274" y="576" font-size="10.5" fill="#78350f">mac-x64 ✓ feed 停在 rc.1</text>
  <rect x="484" y="556" width="212" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="496" y="576" font-size="10.5" fill="#065f46">win-x64 ✓ 0.2.1-rc.3</text>
  <rect x="706" y="556" width="214" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="718" y="576" font-size="10.5" fill="#7f1d1d">linux ✗ 无产物、无 feed</text>
</svg>
