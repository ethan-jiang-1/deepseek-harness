<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>$DSH_HOME 目录全景地图：Home 级共享项与 Profile 级独立项</title>
  <desc>拆解默认 ~/.dsh 内部结构：上半区会话、工作区注册表、凭据、附件、缓存与离线运行时按 Home 共享；下半区 profiles/&lt;name&gt; 下的插件依赖树与界面设置按 Profile 各自独立；工作区代码仓与 Electron userData 位于 Home 之外。</desc>
  <rect width="1000" height="630" rx="8" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">$DSH_HOME 全景地图：哪些按 Home 共享，哪些按 Profile 独立</text>
  <text x="500" y="54" text-anchor="middle" font-size="11.5" fill="#475569">默认“数据互通”仅指上半区；界面设置与第三方插件依赖在下半区本来就按 Profile 各存一份</text>

  <!-- Outer $DSH_HOME box -->
  <rect x="32" y="70" width="936" height="440" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="94" font-size="12.5" font-weight="700" fill="#0f172a">$DSH_HOME（默认 ~/.dsh，目录权限 0700）</text>

  <!-- Shared upper zone -->
  <rect x="48" y="106" width="904" height="178" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="66" y="128" font-size="12" font-weight="700" fill="#14532d">按 Home 共享：同一 $DSH_HOME 下的 web / desktop / headless 等所有 Profile 共同读写</text>

  <rect x="66" y="140" width="278" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="82" y="158" font-size="11" font-weight="700" fill="#166534">sessions/</text>
  <text x="82" y="174" font-size="10" fill="#475569">按工作区归档的压缩会话日志与锁</text>

  <rect x="361" y="140" width="278" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="377" y="158" font-size="11" font-weight="700" fill="#166534">storages/*.json</text>
  <text x="377" y="174" font-size="10" fill="#475569">workspace.json 工作区表及插件存储域</text>

  <rect x="656" y="140" width="278" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="672" y="158" font-size="11" font-weight="700" fill="#166534">.credentials.yaml</text>
  <text x="672" y="174" font-size="10" fill="#475569">API Key 与账号凭据（强制 0600 权限）</text>

  <rect x="66" y="190" width="278" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="82" y="208" font-size="11" font-weight="700" fill="#166534">attachments/ · cache/</text>
  <text x="82" y="224" font-size="10" fill="#475569">内容寻址二进制附件与可重建缓存</text>

  <rect x="361" y="190" width="278" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="377" y="208" font-size="11" font-weight="700" fill="#166534">dsh-runtimes/</text>
  <text x="377" y="224" font-size="10" fill="#475569">Desktop 离线解压的 Python/Node 载荷</text>

  <rect x="656" y="190" width="278" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="672" y="208" font-size="11" font-weight="700" fill="#166534">logs/ · .anonymous-user-id</text>
  <text x="672" y="224" font-size="10" fill="#475569">CLI 启动诊断日志与匿名统计标识</text>

  <rect x="66" y="240" width="868" height="32" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="82" y="260" font-size="10.5" fill="#166534">可选全局覆盖：.env（环境变量）与根级 cordis.patch.yml（跨该 Home 下全部 Profile 生效，优先级高于单 Profile 设置）</text>

  <!-- Per-profile lower zone -->
  <rect x="48" y="298" width="904" height="196" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="66" y="320" font-size="12" font-weight="700" fill="#1e3a8a">按 Profile 独立：profiles/&lt;name&gt;/，web 与 desktop 各管一摊、互不覆盖</text>

  <rect x="66" y="332" width="424" height="146" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="84" y="354" font-size="11.5" font-weight="700" fill="#1e3a8a">profiles/web/（及 headless 等 CLI Profile）</text>
  <text x="84" y="376" font-size="10.5" fill="#334155">· package.json + pnpm-lock.yaml + node_modules/</text>
  <text x="84" y="396" font-size="10.5" fill="#334155">· cordis.patch.yml：Web 端界面设置与插件启停开关</text>
  <text x="84" y="416" font-size="10.5" fill="#334155">· compatibility.json（精确版本豁免）与市场索引缓存</text>
  <text x="84" y="438" font-size="10" fill="#64748b">装坏插件或改设置只影响当前 Profile</text>

  <rect x="510" y="332" width="424" height="146" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="528" y="354" font-size="11.5" font-weight="700" fill="#1e3a8a">profiles/desktop/（桌面端专属 Profile）</text>
  <text x="528" y="376" font-size="10.5" fill="#334155">· 同构的独立依赖树、锁文件与已启用 bundles 列表</text>
  <text x="528" y="396" font-size="10.5" fill="#334155">· cordis.patch.yml：Desktop 界面设置（与 Web 不互通）</text>
  <text x="528" y="416" font-size="10.5" fill="#334155">· lock：运行期间由 Electron 壳独占持有 Profile 写锁</text>
  <text x="528" y="438" font-size="10" fill="#64748b">切换 DSH_HOME 后首次启动会自动初始化新目录</text>

  <!-- Outside $DSH_HOME -->
  <rect x="32" y="524" width="936" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="546" font-size="12" font-weight="700" fill="#334155">位于 $DSH_HOME 之外的三处关联状态</text>

  <rect x="52" y="556" width="288" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="68" y="574" font-size="10.5" font-weight="700" fill="#334155">工作区项目源码目录</text>
  <text x="68" y="591" font-size="10" fill="#64748b">硬盘上的真实代码库，实验请挂测试目录</text>

  <rect x="356" y="556" width="288" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="372" y="574" font-size="10.5" font-weight="700" fill="#334155">Electron userData 目录</text>
  <text x="372" y="591" font-size="10" fill="#64748b">快捷键、壳设置与单实例锁（--user-data-dir）</text>

  <rect x="660" y="556" width="288" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="676" y="574" font-size="10.5" font-weight="700" fill="#334155">跨工具共享 ~/.agents 与桌面日志</text>
  <text x="676" y="591" font-size="10" fill="#64748b">技能由 DSH_AGENTS_HOME 控制；系统日志共享</text>
</svg>
