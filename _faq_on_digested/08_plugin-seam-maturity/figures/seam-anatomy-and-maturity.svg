<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">DSH 插件接缝全景：三角色 Capability Seam 契约与 35 条接缝四档成熟度</title>
  <desc id="desc">左侧展示一条完整 capability seam 的 Service Definition、Provider、Consumer 三角色解耦关系（以 ctx.fs 为例）；右侧展示全仓 99 个 ctx 服务收敛到 35 条可替换 seam 后的四档成熟度（15、8、9、3）及高优外部生态缺口。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowSlate" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1180" height="660" rx="8" fill="#f8fafc"/>
  <text x="590" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">DSH 插件接缝全景：三角色契约与 35 条 Seam 四档成熟度</text>
  <text x="590" y="62" text-anchor="middle" font-size="12.5" fill="#475569">单个插件不叫 seam；左看“定义 + 实现 + 消费”解耦结构，右看全仓 99 个 ctx 服务的收敛漏斗与生态缺口</text>

  <!-- Left Half: 3-Role Seam Anatomy -->
  <rect x="36" y="88" width="520" height="446" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="116" font-size="15" font-weight="700" fill="#0f172a">一条完整 Capability Seam 的三角色契约（以 ctx.fs 为例）</text>

  <!-- Service Definition -->
  <rect x="116" y="138" width="360" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="296" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Service Definition（定义接口与契约）</text>
  <text x="296" y="188" text-anchor="middle" font-size="12" fill="#334155">例：@deepseek-ai/dsh-fs 声明 ctx.fs 服务类型</text>
  <text x="296" y="209" text-anchor="middle" font-size="11.5" fill="#475569">统一约束路径语义、读写签名与结构化错误码</text>

  <!-- Arrows from Provider & Consumer to Definition -->
  <line x1="171" y1="282" x2="232" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="166" y="254" text-anchor="end" font-size="11.5" font-weight="700" fill="#15803d">注册实现</text>

  <line x1="421" y1="282" x2="360" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="426" y="254" font-size="11.5" font-weight="700" fill="#92400e">只认接口</text>

  <!-- Provider -->
  <rect x="56" y="284" width="230" height="130" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="74" y="310" font-size="13.5" font-weight="700" fill="#166534">Provider（可替换实现）</text>
  <text x="74" y="334" font-size="12" fill="#334155">· fs-local（本机直连）</text>
  <text x="74" y="356" font-size="12" fill="#334155">· fs-sandbox（目录围栏）</text>
  <text x="74" y="378" font-size="12" fill="#334155">· fs-ssh（远端机器连接）</text>
  <text x="74" y="401" font-size="11" font-weight="700" fill="#15803d">按配置整行切换，上游零改动</text>

  <!-- Consumer -->
  <rect x="306" y="284" width="230" height="130" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="324" y="310" font-size="13.5" font-weight="700" fill="#92400e">Consumer（调用消费方）</text>
  <text x="324" y="334" font-size="12" fill="#334155">· tool-fs（注入 ctx.fs）</text>
  <text x="324" y="356" font-size="12" fill="#334155">提供 read / write / edit</text>
  <text x="324" y="378" font-size="12" fill="#334155">不感知底层跑在本机或远端</text>
  <text x="324" y="401" font-size="11" font-weight="700" fill="#92400e">消费面越广，接口越通用稳定</text>

  <!-- Companion note -->
  <rect x="56" y="430" width="480" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="74" y="454" font-size="13" font-weight="700" fill="#334155">伴随策略与成熟度判据</text>
  <text x="74" y="477" font-size="11.5" fill="#475569">· 伴随插件走事件门控（如 fs-observation-policy 监听 fs/* 守住先读后改）</text>
  <text x="74" y="499" font-size="11.5" fill="#475569">· 警惕同包自产自销（P=1, C=1 同包）与同质实现（能换 ≠ 换了有体验差异）</text>

  <!-- Right Half: Funnel & 4 Maturity Tiers -->
  <rect x="580" y="88" width="564" height="446" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="116" font-size="15" font-weight="700" fill="#1e3a8a">全仓收敛漏斗与 35 条 Seam 四档分布</text>

  <!-- Funnel Box -->
  <rect x="600" y="130" width="524" height="58" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="862" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">全仓 99 个 ctx 服务 = 58 core + 35 seam + 5 service + 1 bundle</text>
  <text x="862" y="175" text-anchor="middle" font-size="11.5" fill="#4338ca">筛除内部主干与独立服务后，设计用来插拔替换的 capability seam 共 35 条</text>

  <line x1="862" y1="188" x2="862" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- Tier 1 -->
  <rect x="600" y="214" width="524" height="68" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="618" y="238" font-size="13" font-weight="700" fill="#166534">1. 多实现已跑通（P ≥ 2）：15 条（占 42.9%，底层已饱和）</text>
  <text x="618" y="262" font-size="11.5" fill="#334155">shell · fs · subprocess · sandbox · subagents(6) · llm · web(5)</text>

  <!-- Tier 2 -->
  <rect x="600" y="290" width="524" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="618" y="314" font-size="13" font-weight="700" fill="#1e40af">2. 单实现挑大梁的核心底座（P = 1, C ≥ 2）：8 条</text>
  <text x="618" y="338" font-size="11.5" fill="#334155">sessionPersistence(1/7) · workingDirectory(1/6) · jobs(1/5)</text>

  <!-- Tier 3 -->
  <rect x="600" y="366" width="524" height="68" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="618" y="390" font-size="13" font-weight="700" fill="#92400e">3. 单点能力或演进中的单实现（P = 1, C ≤ 1）：9 条</text>
  <text x="618" y="414" font-size="11.5" fill="#334155">lsp · terminals · spillStore · compaction（同包自消费）· worktrees</text>

  <!-- Tier 4 -->
  <rect x="600" y="442" width="524" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="618" y="466" font-size="13" font-weight="700" fill="#334155">4. 零 Provider 特殊位（P = 0）：3 条</text>
  <text x="618" y="490" font-size="11.5" fill="#475569">approval（走 waterfall 监听）· userQuestions（前端）· authorization</text>

  <!-- Bottom Strip: Ecosystem Gaps -->
  <rect x="36" y="552" width="1108" height="84" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="56" y="580" font-size="14" font-weight="700" fill="#9a3412">生态判断：底层执行与模型路由重造收益极低，真正的高价值缺口在外围连接与上层治理</text>
  <text x="56" y="608" font-size="12" fill="#7c2d12">优先切入：① IM 与消息通知渠道（缺整条官方 seam） · ② 面向模型的长期记忆 · ③ 多渠道结构化审批流 · ④ 跨会话持久工作流</text>
</svg>
