<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>产物的四种引用：present、changes、附件、spill</title>
  <desc>DSH 没有通用 artifact store。present 记录工作区文件的路径给用户打开；workspace/changes 记录一轮改动的摘要；附件是不可变二进制，供模型输入；spill 保存大段文本供上下文检索。内容留在原处，DSH 只记录引用。</desc>

  <rect width="1200" height="620" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">产物不是副本，是四种引用</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">内容留在它该在的地方；DSH 只记录“怎么找到它”</text>

  <!-- content bar -->
  <rect x="40" y="84" width="300" height="84" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="60" y="108" font-size="12" font-weight="700" fill="#1e40af">内容的家：工作区文件</text>
  <text x="60" y="130" fill="#334155" font-size="11">用户拥有、可直接打开、可提交</text>
  <text x="60" y="150" fill="#64748b" font-size="10.5">插件经 ctx.fs 写；DSH 不复制</text>

  <path d="M345 126 L380 126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a26)"/>
  <defs>
    <marker id="a26" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- present -->
  <rect x="390" y="84" width="360" height="180" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="410" y="110" font-size="13" font-weight="700" fill="#1e40af">present · 交付声明</text>
  <text x="410" y="134" fill="#334155" font-size="11">记录：绝对路径 + 描述</text>
  <text x="410" y="156" fill="#334155" font-size="11">内容：原地不动</text>
  <text x="410" y="178" fill="#334155" font-size="11">读者：用户（默认应用打开）</text>
  <text x="410" y="200" fill="#64748b" font-size="10.5">事件：deliverables/presented</text>
  <text x="410" y="222" fill="#64748b" font-size="10.5">默认最多 8 个；只接受普通文件</text>
  <text x="410" y="244" fill="#991b1b" font-size="10.5">文件删了，交付就指向不存在</text>

  <!-- changes -->
  <rect x="770" y="84" width="390" height="180" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="790" y="110" font-size="13" font-weight="700" fill="#166534">workspace/changes · 改动摘要</text>
  <text x="790" y="134" fill="#334155" font-size="11">记录：这一轮改了哪些文件、增删行数</text>
  <text x="790" y="156" fill="#334155" font-size="11">内容：工作区（git 快照/整文件捕获）</text>
  <text x="790" y="178" fill="#334155" font-size="11">读者：用户 review</text>
  <text x="790" y="200" fill="#64748b" font-size="10.5">日志只有一条 workspace/changes {turn}</text>
  <text x="790" y="222" fill="#64748b" font-size="10.5">摘要留在 Host 内存，会话销毁即止</text>
  <text x="790" y="244" fill="#991b1b" font-size="10.5">不是可回放的补丁库</text>

  <!-- attachment -->
  <rect x="390" y="292" width="360" height="180" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <text x="410" y="318" font-size="13" font-weight="700" fill="#92400e">attachments · 给模型的字节</text>
  <text x="410" y="342" fill="#334155" font-size="11">记录：不可变引用 + 元数据</text>
  <text x="410" y="364" fill="#334155" font-size="11">内容：$DSH_HOME/attachments/v1</text>
  <text x="410" y="386" fill="#334155" font-size="11">读者：模型输入</text>
  <text x="410" y="408" fill="#64748b" font-size="10.5">内容寻址；ID 不透明，不拼路径</text>
  <text x="410" y="430" fill="#64748b" font-size="10.5">事件只带引用，不带 base64</text>
  <text x="410" y="452" fill="#991b1b" font-size="10.5">不是用户下载入口</text>

  <!-- spill -->
  <rect x="770" y="292" width="390" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="790" y="318" font-size="13" font-weight="700" fill="#334155">spill · 上下文里的文本</text>
  <text x="790" y="342" fill="#334155" font-size="11">记录：定位符 + 检索提示 + 字节数</text>
  <text x="790" y="364" fill="#334155" font-size="11">内容：spill 后端</text>
  <text x="790" y="386" fill="#334155" font-size="11">读者：模型与工具</text>
  <text x="790" y="408" fill="#64748b" font-size="10.5">owner = 会话；suggestedName 只是提示</text>
  <text x="790" y="430" fill="#64748b" font-size="10.5">可能被保留期清理</text>
  <text x="790" y="452" fill="#991b1b" font-size="10.5">不是长期归档，也不是交付物</text>

  <!-- flow arrows -->

  <!-- bottom -->
  <rect x="40" y="496" width="1120" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="520" font-size="12" font-weight="700" fill="#334155">一句话分工</text>
  <text x="60" y="544" fill="#1e40af" font-size="11">给用户看结果 → 写工作区 + present；给用户看改动 → workspace/changes；给模型看图/文件 → attachments；放不进上下文的长文本 → spill。</text>
  <text x="60" y="566" fill="#64748b" font-size="10.5">共同点：内容不搬家。把交付物写进 home 或附件库，用户就找不到它；“引用”才是 DSH 的产物模型。</text>

  <line x1="370" y1="84" x2="370" y2="296" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <text x="360" y="290" text-anchor="end" font-size="10" fill="#94a3b8">内容 → 引用</text>
</svg>
