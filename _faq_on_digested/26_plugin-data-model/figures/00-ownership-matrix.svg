<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>所有权 × 作用域：插件数据的四种落点</title>
  <desc>用户拥有的内容与插件拥有的状态，分别落在“关于项目”和“关于这个人/这台机器”两种作用域里，形成四种最常见的落点。会话日志、派生层与客户端本地状态与这张表正交。</desc>

  <rect width="1200" height="720" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">所有权 × 作用域：四种落点</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">“用户的东西”和“跟用户相关的东西”不是两种存储，而是两种所有权；再按“关于项目/关于人”切一次</text>

  <!-- column headers -->
  <rect x="230" y="84" width="460" height="34" rx="8" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="460" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">关于项目 / 工作区</text>
  <rect x="710" y="84" width="460" height="34" rx="8" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="940" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">关于这个人 / 这台机器</text>

  <!-- row labels -->
  <rect x="24" y="136" width="190" height="240" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="119" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">用户拥有内容</text>
  <text x="119" y="262" text-anchor="middle" font-size="10.5" fill="#1e3a8a">用户能打开、编辑、带走</text>
  <text x="119" y="282" text-anchor="middle" font-size="10.5" fill="#64748b">插件只读或只写，不据为己有</text>

  <rect x="24" y="392" width="190" height="240" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="119" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">插件拥有状态</text>
  <text x="119" y="518" text-anchor="middle" font-size="10.5" fill="#78350f">用户通常看不见</text>
  <text x="119" y="538" text-anchor="middle" font-size="10.5" fill="#64748b">要有 schema、版本、清理策略</text>

  <!-- top-left -->
  <rect x="230" y="136" width="460" height="240" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="246" y="150" width="42" height="20" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="267" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">P2</text>
  <text x="300" y="165" font-size="14" font-weight="700" fill="#1e40af">项目内文件</text>
  <text x="246" y="194" fill="#334155" font-size="11.5">位置：&lt;project&gt;/.agents/、.dsh/、报告、代码</text>
  <text x="246" y="218" fill="#334155" font-size="11.5">权威：用户/项目；删目录即删除，复制/提交/换机器都跟着走</text>
  <text x="246" y="242" fill="#334155" font-size="11.5">读者：用户可打开/编辑；模型经工具读</text>
  <text x="246" y="266" fill="#64748b" font-size="10.5">API：ctx.fs + present；项目内目录约定由你定</text>
  <text x="246" y="294" fill="#166534" font-size="10.5">适合：项目知识、配置、交付物、用户要 review 的东西</text>
  <text x="246" y="318" fill="#991b1b" font-size="10.5">代价：仓库污染、多人冲突、用户手改到坏、执行型配置的信任边界</text>
  <text x="246" y="346" fill="#64748b" font-size="10.5">社区：dsh-project-context（.agents/memory）、workspace-overlay（.dsh/cordis.yml）</text>

  <!-- top-right -->
  <rect x="710" y="136" width="460" height="240" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="726" y="150" width="42" height="20" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="747" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">P0</text>
  <text x="780" y="165" font-size="14" font-weight="700" fill="#1e40af">用户全局文件</text>
  <text x="726" y="194" fill="#334155" font-size="11.5">位置：$DSH_HOME/AGENTS.md、skills/、~/.agents</text>
  <text x="726" y="218" fill="#334155" font-size="11.5">权威：用户；插件主要只读，不静默改写</text>
  <text x="726" y="242" fill="#334155" font-size="11.5">读者：用户维护；模型经指令链/技能加载</text>
  <text x="726" y="266" fill="#64748b" font-size="10.5">API：Config 路径 + ctx.fs；技能根由 skill provider 管</text>
  <text x="726" y="294" fill="#166534" font-size="10.5">适合：跨项目规则、偏好、可复用流程</text>
  <text x="726" y="318" fill="#991b1b" font-size="10.5">代价：换机器不自动同步；插件写全局指令等于给未来所有会话注入提示词</text>
  <text x="726" y="346" fill="#64748b" font-size="10.5">社区：dsh-memory-snapshot（只引用，不写回）</text>

  <!-- bottom-left -->
  <rect x="230" y="392" width="460" height="240" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="246" y="406" width="42" height="20" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="267" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">P3</text>
  <text x="300" y="421" font-size="14" font-weight="700" fill="#92400e">宿主账本 + 项目键</text>
  <text x="246" y="450" fill="#334155" font-size="11.5">位置：$DSH_HOME/storages 的 domain + 记录键</text>
  <text x="246" y="474" fill="#334155" font-size="11.5">权威：插件；用户看不见，通过你的 UI 间接感知</text>
  <text x="246" y="498" fill="#334155" font-size="11.5">键：w_&lt;sha256(realpath)&gt;；per-record 必须路径安全</text>
  <text x="246" y="522" fill="#64748b" font-size="10.5">API：ctx.storageDomain.open(spec) → table.get/put/update</text>
  <text x="246" y="550" fill="#166534" font-size="10.5">适合：索引、同步游标、缓存、用户不必编辑的元数据</text>
  <text x="246" y="574" fill="#991b1b" font-size="10.5">代价：孤儿、目录移动失效、换 home 丢、没有跨进程事件</text>
  <text x="246" y="602" fill="#64748b" font-size="10.5">社区：workspace-memories（home 默认）、graphmemory（SQLite）</text>

  <!-- bottom-right -->
  <rect x="710" y="392" width="460" height="240" rx="10" fill="#ffffff" stroke="#fcd34d"/>
  <rect x="726" y="406" width="42" height="20" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="747" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">P4</text>
  <text x="780" y="421" font-size="14" font-weight="700" fill="#92400e">账号 / 安装配置</text>
  <text x="726" y="450" fill="#334155" font-size="11.5">位置：Config.volatile() → profile patch；home 域单例；credentials</text>
  <text x="726" y="474" fill="#334155" font-size="11.5">权威：用户配置 / 插件单例 / 凭据 provider</text>
  <text x="726" y="498" fill="#334155" font-size="11.5">读者：设置页；模型只看被插件使用的值</text>
  <text x="726" y="522" fill="#64748b" font-size="10.5">API：ctx.settings；ctx.storageDomain.global；ctx.credentials</text>
  <text x="726" y="550" fill="#166534" font-size="10.5">适合：偏好、默认工作区、API key、账号级开关</text>
  <text x="726" y="574" fill="#991b1b" font-size="10.5">代价：一个默认值套所有项目；profile 不是账号；秘密仍可能被工具进程读到</text>
  <text x="726" y="602" fill="#64748b" font-size="10.5">社区：渠道插件（defaultWorkspace + 凭据引用）</text>

  <!-- orthogonal band -->
  <rect x="24" y="648" width="1146" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="670" font-size="11" font-weight="700" fill="#334155">与这张表正交的另外三个家：</text>
  <text x="44" y="690" fill="#334155" font-size="10.5">会话日志（session，模型可见 ⟺ 已记录） · 派生层（无权威，可重建） · 客户端（localStorage/userData，按源或设备，Host 看不见）。</text>
</svg>
