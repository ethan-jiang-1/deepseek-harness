<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 932" width="1200" height="932" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
<title>DSH 原生数据时间线</title>
<desc>2026-06 到 2026-10 的关键数据决定与仍未解决的缺口。H=历史，C=当前合同，P=提案。</desc>
<rect width="1200" height="932" rx="8" fill="#f8fafc"/>
<text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">DSH 原生数据时间线（2026-06 → 2026-10）</text>
<text x="600" y="58" text-anchor="middle" fill="#64748b">H = 历史事实；C = 当前合同；P = 提案；红色 = 仍未解决的缺口</text>
<line x1="250" y1="78" x2="250" y2="846" stroke="#cbd5e1" stroke-width="2"/>
<text x="220" y="114" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-06-14</text>
<circle cx="250" cy="109" r="5" fill="#1e40af"/>
<text x="272" y="114" font-size="11" font-weight="700" fill="#1e40af">持久化抽象</text>
<text x="390" y="114" font-size="10" fill="#475569">SessionPersistence：追加日志 + 可恢复句柄</text>
<text x="1140" y="114" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="150" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-07-02</text>
<circle cx="250" cy="145" r="5" fill="#1e40af"/>
<text x="272" y="150" font-size="11" font-weight="700" fill="#1e40af">会话 cwd</text>
<text x="390" y="150" font-size="10" fill="#475569">工具按 session.header.cwd 解析相对路径</text>
<text x="1140" y="150" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="186" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-07-08</text>
<circle cx="250" cy="181" r="5" fill="#1e40af"/>
<text x="272" y="186" font-size="11" font-weight="700" fill="#1e40af">spill</text>
<text x="390" y="186" font-size="10" fill="#475569">大文本落私有文件，模型拿 locator</text>
<text x="1140" y="186" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="222" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-07-19</text>
<circle cx="250" cy="217" r="5" fill="#1e40af"/>
<text x="272" y="222" font-size="11" font-weight="700" fill="#1e40af">zstd 日志</text>
<text x="390" y="222" font-size="10" fill="#475569">默认 .jsonl.zstd；raw 可配；一 root 一编码</text>
<text x="1140" y="222" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="258" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-07-22</text>
<circle cx="250" cy="253" r="5" fill="#1e40af"/>
<text x="272" y="258" font-size="11" font-weight="700" fill="#1e40af">持久附件</text>
<text x="390" y="258" font-size="10" fill="#475569">内容寻址对象；不 GC 是刻意</text>
<text x="1140" y="258" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="294" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-07-24</text>
<circle cx="250" cy="289" r="5" fill="#1e40af"/>
<text x="272" y="294" font-size="11" font-weight="700" fill="#1e40af">单根 home</text>
<text x="390" y="294" font-size="10" fill="#475569">explicit > DSH_HOME > ~/.dsh；~/.agents 在外</text>
<text x="1140" y="294" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="330" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-07-24</text>
<circle cx="250" cy="325" r="5" fill="#5b21b6"/>
<text x="272" y="330" font-size="11" font-weight="700" fill="#5b21b6">domain KV 提案</text>
<text x="390" y="330" font-size="10" fill="#475569">非会话数据有通用 KV；scope/delete/migration 明确 out-of-scope</text>
<text x="1140" y="330" text-anchor="end" font-size="9.5" font-weight="700" fill="#5b21b6">P</text>
<text x="220" y="366" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-07-28</text>
<circle cx="250" cy="361" r="5" fill="#92400e"/>
<text x="272" y="366" font-size="11" font-weight="700" fill="#92400e">settings seam</text>
<text x="390" y="366" font-size="10" fill="#475569">settings.yaml + 文件 provider（后被取代）</text>
<text x="1140" y="366" text-anchor="end" font-size="9.5" font-weight="700" fill="#92400e">H</text>
<text x="220" y="402" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-08-13</text>
<circle cx="250" cy="397" r="5" fill="#1e40af"/>
<text x="272" y="402" font-size="11" font-weight="700" fill="#1e40af">凭据记录</text>
<text x="390" y="402" font-size="10" fill="#475569">CredentialRef + CredentialKey/grant；owner scope</text>
<text x="1140" y="402" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="438" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-08-19</text>
<circle cx="250" cy="433" r="5" fill="#1e40af"/>
<text x="272" y="438" font-size="11" font-weight="700" fill="#1e40af">per-record 缓存</text>
<text x="390" y="438" font-size="10" fill="#475569">每会话一档；键变 path-safe</text>
<text x="1140" y="438" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="474" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-08-27</text>
<circle cx="250" cy="469" r="5" fill="#1e40af"/>
<text x="272" y="474" font-size="11" font-weight="700" fill="#1e40af">handle 持久化</text>
<text x="390" y="474" font-size="10" fill="#475569">5 方法 + per-session handle；跨进程 lease</text>
<text x="1140" y="474" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="510" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-08-30</text>
<circle cx="250" cy="505" r="5" fill="#1e40af"/>
<text x="272" y="510" font-size="11" font-weight="700" fill="#1e40af">ignorable 事件</text>
<text x="390" y="510" font-size="10" fill="#475569">第三方未知事件可读；plugin 记录限 experimental</text>
<text x="1140" y="510" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="546" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-08-31</text>
<circle cx="250" cy="541" r="5" fill="#1e40af"/>
<text x="272" y="546" font-size="11" font-weight="700" fill="#1e40af">格式迁移</text>
<text x="390" y="546" font-size="10" fill="#475569">有状态流式 stage；不覆盖/删除已发布世代</text>
<text x="1140" y="546" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="582" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-09-08</text>
<circle cx="250" cy="577" r="5" fill="#1e40af"/>
<text x="272" y="582" font-size="11" font-weight="700" fill="#1e40af">present 路径</text>
<text x="390" y="582" font-size="10" fill="#475569">只记路径不复制；changes 内存/OS temp</text>
<text x="1140" y="582" text-anchor="end" font-size="9.5" font-weight="700" fill="#1e40af">H</text>
<text x="220" y="618" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-09-16</text>
<circle cx="250" cy="613" r="5" fill="#166534"/>
<text x="272" y="618" font-size="11" font-weight="700" fill="#166534">Session format V4</text>
<text x="390" y="618" font-size="10" fill="#475569">tool-role 结果、producer source、forked turn/end</text>
<text x="1140" y="618" text-anchor="end" font-size="9.5" font-weight="700" fill="#166534">C</text>
<text x="220" y="654" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-09-19</text>
<circle cx="250" cy="649" r="5" fill="#166534"/>
<text x="272" y="654" font-size="11" font-weight="700" fill="#166534">profile 配置</text>
<text x="390" y="654" font-size="10" fill="#475569">settings 并入 profile patch；旧文件一次性 import</text>
<text x="1140" y="654" text-anchor="end" font-size="9.5" font-weight="700" fill="#166534">C</text>
<text x="220" y="690" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-10-09</text>
<circle cx="250" cy="685" r="5" fill="#166534"/>
<text x="272" y="690" font-size="11" font-weight="700" fill="#166534">凭据优先</text>
<text x="390" y="690" font-size="10" fill="#475569">文件 > 启动环境 > 项目 .env > home .env</text>
<text x="1140" y="690" text-anchor="end" font-size="9.5" font-weight="700" fill="#166534">C</text>
<text x="220" y="726" text-anchor="end" font-size="10" font-weight="700" fill="#334155">2026-10-12</text>
<circle cx="250" cy="721" r="5" fill="#166534"/>
<text x="272" y="726" font-size="11" font-weight="700" fill="#166534">headless 凭据</text>
<text x="390" y="726" font-size="10" fill="#475569">headless 不挂持久 credential store</text>
<text x="1140" y="726" text-anchor="end" font-size="9.5" font-weight="700" fill="#166534">C</text>
<text x="220" y="762" text-anchor="end" font-size="10" font-weight="700" fill="#334155">缺口</text>
<circle cx="250" cy="757" r="5" fill="#991b1b"/>
<text x="272" y="762" font-size="11" font-weight="700" fill="#991b1b">session delete</text>
<text x="390" y="762" font-size="10" fill="#475569">SessionPersistence 仍只有 create/open/stat/list/flush</text>
<text x="1140" y="762" text-anchor="end" font-size="9.5" font-weight="700" fill="#991b1b">P</text>
<text x="220" y="798" text-anchor="end" font-size="10" font-weight="700" fill="#334155">缺口</text>
<circle cx="250" cy="793" r="5" fill="#991b1b"/>
<text x="272" y="798" font-size="11" font-weight="700" fill="#991b1b">attachment GC</text>
<text x="390" y="798" font-size="10" fill="#475569">引用感知 GC 未实现；删日志即孤儿</text>
<text x="1140" y="798" text-anchor="end" font-size="9.5" font-weight="700" fill="#991b1b">H</text>
<text x="220" y="834" text-anchor="end" font-size="10" font-weight="700" fill="#334155">缺口</text>
<circle cx="250" cy="829" r="5" fill="#5b21b6"/>
<text x="272" y="834" font-size="11" font-weight="700" fill="#5b21b6">workspace scope</text>
<text x="390" y="834" font-size="10" fill="#475569">DomainSpec 无 scope；proposed out-of-scope</text>
<text x="1140" y="834" text-anchor="end" font-size="9.5" font-weight="700" fill="#5b21b6">P</text>
<rect x="24" y="858" width="1152" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="878" font-size="10.5" fill="#334155">读法：前 14 条是“数据面/格式的建立”，后 7 条是合同收紧与缺口。DSH 的数据面不是一次设计出来的，而是从 session log 逐步分化出 side tables、objects、profile config。</text>
<text x="44" y="894" font-size="10" fill="#64748b">关键欠账：session delete、attachment GC、workspace scope、跨进程 domain change、迁移模板、卸载契约。</text>
</svg>
