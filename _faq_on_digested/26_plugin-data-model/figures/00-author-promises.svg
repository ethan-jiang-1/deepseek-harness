<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>插件作者的五种数据承诺</title>
  <desc>纯引用、会话派生、项目内文件、宿主账本、账号/安装配置。每种承诺决定数据在哪、用户能否看见、卸载后留下什么，以及对应的 DSH API 与社区样本。P5 的每项目运行时是缺口，社区用 workspace scope 自己补。</desc>

  <rect width="1200" height="680" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">先选“数据承诺”，再找 DSH 的平面</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">承诺决定用户看到什么、数据跟谁走、卸载后留下什么；API 只是兑现方式</text>

  <!-- P0 -->
  <rect x="24" y="84" width="220" height="470" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="40" y="98" width="38" height="20" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="59" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">P0</text>
  <text x="88" y="113" font-size="12.5" font-weight="700" fill="#1e40af">纯引用</text>
  <text x="40" y="140" font-size="10.5" fill="#334155">我不存，只读你已有的</text>
  <text x="40" y="156" font-size="10.5" fill="#334155">文件；没有写入通道。</text>
  <text x="40" y="186" font-size="10" font-weight="700" fill="#1e40af">数据在哪</text>
  <text x="40" y="204" font-size="10.5" fill="#334155">用户原文件，原地不动</text>
  <text x="40" y="232" font-size="10" font-weight="700" fill="#1e40af">DSH 材料</text>
  <text x="40" y="250" font-size="10.5" fill="#334155">Config 路径清单 +</text>
  <text x="40" y="266" font-size="10.5" fill="#334155">ctx.fs 读取</text>
  <text x="40" y="294" font-size="10" font-weight="700" fill="#1e40af">用户看见</text>
  <text x="40" y="312" font-size="10.5" fill="#334155">原文件；可能不知道</text>
  <text x="40" y="328" font-size="10.5" fill="#334155">插件存在</text>
  <text x="40" y="356" font-size="10" font-weight="700" fill="#1e40af">卸载后</text>
  <text x="40" y="374" font-size="10.5" fill="#334155">什么都不留</text>
  <rect x="40" y="396" width="188" height="70" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="52" y="416" font-size="10" font-weight="700" fill="#1e40af">社区样本</text>
  <text x="52" y="434" font-size="10" fill="#1e3a8a">dsh-memory-snapshot</text>
  <text x="52" y="450" font-size="9.5" fill="#1e3a8a">零依赖 / 文档原地不动</text>
  <text x="40" y="490" font-size="9.5" fill="#991b1b">坑：相对路径按启动目录</text>
  <text x="40" y="506" font-size="9.5" fill="#991b1b">解析，跨项目就散了</text>
  <text x="40" y="532" font-size="9.5" fill="#64748b">适合：规则、知识库、只读记忆</text>

  <!-- P1 -->
  <rect x="257" y="84" width="220" height="470" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="273" y="98" width="38" height="20" rx="10" fill="#dcfce7" stroke="#4ade80"/>
  <text x="292" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">P1</text>
  <text x="321" y="113" font-size="12.5" font-weight="700" fill="#166534">会话派生</text>
  <text x="273" y="140" font-size="10.5" fill="#334155">我不存聊天，只算统计</text>
  <text x="273" y="156" font-size="10.5" fill="#334155">或索引；丢了能重算。</text>
  <text x="273" y="186" font-size="10" font-weight="700" fill="#166534">数据在哪</text>
  <text x="273" y="204" font-size="10.5" fill="#334155">会话日志 + 可重建检查点</text>
  <text x="273" y="232" font-size="10" font-weight="700" fill="#166534">DSH 材料</text>
  <text x="273" y="250" font-size="10.5" fill="#334155">sessionProjections +</text>
  <text x="273" y="266" font-size="10.5" fill="#334155">sessionQuery / 检查点</text>
  <text x="273" y="294" font-size="10" font-weight="700" fill="#166534">用户看见</text>
  <text x="273" y="312" font-size="10.5" fill="#334155">面板/统计；看不到原文</text>
  <text x="273" y="356" font-size="10" font-weight="700" fill="#166534">卸载后</text>
  <text x="273" y="374" font-size="10.5" fill="#334155">检查点可丢，日志还在</text>
  <rect x="273" y="396" width="188" height="70" rx="7" fill="#dcfce7" stroke="#4ade80"/>
  <text x="285" y="416" font-size="10" font-weight="700" fill="#166534">社区样本</text>
  <text x="285" y="434" font-size="10" fill="#14532d">harness-insights</text>
  <text x="285" y="450" font-size="9.5" fill="#14532d">只折叠元数据，不存正文</text>
  <text x="273" y="490" font-size="9.5" fill="#991b1b">坑：投影 API 漂移，</text>
  <text x="273" y="506" font-size="9.5" fill="#991b1b">历史回填有成本</text>
  <text x="273" y="532" font-size="9.5" fill="#64748b">适合：用量面板、索引、总览</text>

  <!-- P2 -->
  <rect x="490" y="84" width="220" height="470" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="506" y="98" width="38" height="20" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="525" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">P2</text>
  <text x="554" y="113" font-size="12.5" font-weight="700" fill="#92400e">项目内文件</text>
  <text x="506" y="140" font-size="10.5" fill="#334155">数据跟项目走，删项目</text>
  <text x="506" y="156" font-size="10.5" fill="#334155">就没；用户可见可改。</text>
  <text x="506" y="186" font-size="10" font-weight="700" fill="#92400e">数据在哪</text>
  <text x="506" y="204" font-size="10.5" fill="#334155">&lt;workspace&gt;/.plugin/…</text>
  <text x="506" y="232" font-size="10" font-weight="700" fill="#92400e">DSH 材料</text>
  <text x="506" y="250" font-size="10.5" fill="#334155">ctx.fs 写会话 cwd；</text>
  <text x="506" y="266" font-size="10.5" fill="#334155">present / changes</text>
  <text x="506" y="294" font-size="10" font-weight="700" fill="#92400e">用户看见</text>
  <text x="506" y="312" font-size="10.5" fill="#334155">能打开、编辑、提交</text>
  <text x="506" y="356" font-size="10" font-weight="700" fill="#92400e">卸载后</text>
  <text x="506" y="374" font-size="10.5" fill="#334155">文件还在（属于用户）</text>
  <rect x="506" y="396" width="188" height="70" rx="7" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="518" y="416" font-size="10" font-weight="700" fill="#92400e">社区样本</text>
  <text x="518" y="434" font-size="10" fill="#78350f">workspace-overlay</text>
  <text x="518" y="450" font-size="9.5" fill="#78350f">&lt;workspace&gt;/.dsh/cordis.yml</text>
  <text x="506" y="490" font-size="9.5" fill="#991b1b">坑：仓库污染；执行项目</text>
  <text x="506" y="506" font-size="9.5" fill="#991b1b">配置的信任边界</text>
  <text x="506" y="532" font-size="9.5" fill="#64748b">适合：项目知识/配置/交付</text>

  <!-- P3 -->
  <rect x="723" y="84" width="220" height="470" rx="10" fill="#fdf2f8" stroke="#f9a8d4"/>
  <rect x="739" y="98" width="38" height="20" rx="10" fill="#fce7f3" stroke="#f472b6"/>
  <text x="758" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#9d174d">P3</text>
  <text x="787" y="113" font-size="12.5" font-weight="700" fill="#9d174d">宿主账本</text>
  <text x="739" y="140" font-size="10.5" fill="#334155">按项目记，但东西在</text>
  <text x="739" y="156" font-size="10.5" fill="#334155">我这；换机器不带走。</text>
  <text x="739" y="186" font-size="10" font-weight="700" fill="#9d174d">数据在哪</text>
  <text x="739" y="204" font-size="10.5" fill="#334155">$DSH_HOME + 项目键</text>
  <text x="739" y="232" font-size="10" font-weight="700" fill="#9d174d">DSH 材料</text>
  <text x="739" y="250" font-size="10.5" fill="#334155">storageDomain（single /</text>
  <text x="739" y="266" font-size="10.5" fill="#334155">per-record）</text>
  <text x="739" y="294" font-size="10" font-weight="700" fill="#9d174d">用户看见</text>
  <text x="739" y="312" font-size="10.5" fill="#334155">通常看不见；通过你的</text>
  <text x="739" y="328" font-size="10.5" fill="#334155">UI 间接感知</text>
  <text x="739" y="356" font-size="10" font-weight="700" fill="#9d174d">卸载后</text>
  <text x="739" y="374" font-size="10.5" fill="#334155">可能留孤儿，需清理</text>
  <rect x="739" y="396" width="188" height="70" rx="7" fill="#fce7f3" stroke="#f472b6"/>
  <text x="751" y="416" font-size="10" font-weight="700" fill="#9d174d">社区样本</text>
  <text x="751" y="434" font-size="10" fill="#831843">dsh-custom-workspace</text>
  <text x="751" y="450" font-size="9.5" fill="#831843">按 workspace 持久化外观</text>
  <text x="739" y="490" font-size="9.5" fill="#991b1b">坑：workspaceId 短命；</text>
  <text x="739" y="506" font-size="9.5" fill="#991b1b">目录移动变孤儿</text>
  <text x="739" y="532" font-size="9.5" fill="#64748b">适合：索引/游标/元数据</text>

  <!-- P4 -->
  <rect x="956" y="84" width="220" height="470" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="972" y="98" width="38" height="20" rx="10" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="991" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">P4</text>
  <text x="1020" y="113" font-size="12.5" font-weight="700" fill="#5b21b6">账号/安装配置</text>
  <text x="972" y="140" font-size="10.5" fill="#334155">关于这个人/账号/安装；配</text>
  <text x="972" y="156" font-size="10.5" fill="#334155">一次，所有项目生效。</text>
  <text x="972" y="186" font-size="10" font-weight="700" fill="#5b21b6">数据在哪</text>
  <text x="972" y="204" font-size="10.5" fill="#334155">profile 配置 / home / 凭据</text>
  <text x="972" y="232" font-size="10" font-weight="700" fill="#5b21b6">DSH 材料</text>
  <text x="972" y="250" font-size="10.5" fill="#334155">Config.volatile() +</text>
  <text x="972" y="266" font-size="10.5" fill="#334155">settings；credentials</text>
  <text x="972" y="294" font-size="10" font-weight="700" fill="#5b21b6">用户看见</text>
  <text x="972" y="312" font-size="10.5" fill="#334155">设置页；凭据只显示</text>
  <text x="972" y="328" font-size="10.5" fill="#334155">“已配置/未配置”</text>
  <text x="972" y="356" font-size="10" font-weight="700" fill="#5b21b6">卸载后</text>
  <text x="972" y="374" font-size="10.5" fill="#334155">随 profile；数据不带走</text>
  <rect x="972" y="396" width="188" height="70" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="984" y="416" font-size="10" font-weight="700" fill="#5b21b6">社区样本</text>
  <text x="984" y="434" font-size="10" fill="#4c1d95">渠道插件</text>
  <text x="984" y="450" font-size="9.5" fill="#4c1d95">defaultWorkspace + 凭据</text>
  <text x="972" y="490" font-size="9.5" fill="#991b1b">坑：一个默认值套所有</text>
  <text x="972" y="506" font-size="9.5" fill="#991b1b">项目；秘密泄漏</text>
  <text x="972" y="532" font-size="9.5" fill="#64748b">适合：偏好/默认工作区/密钥</text>

  <!-- bottom -->
  <rect x="24" y="572" width="1152" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="596" font-size="12" font-weight="700" fill="#334155">P5 每项目一套运行时：不是数据承诺，是缺口</text>
  <text x="44" y="618" fill="#334155" font-size="10.5">核心插件在 Host 启动时挂载一次，没有“打开项目 → 实例化 → 关闭 → 销毁”的生命周期；社区用 canonical path 做 lease + scope 自己补（dsh-workspace-overlay）。</text>
  <text x="44" y="640" fill="#64748b" font-size="10.5">选择顺序：先问“用户已经有吗 / 能不能重算”，再问“跟项目还是跟人”，最后才问“用哪个 API”。承诺定了，平面和键基本就定了。</text>
</svg>
