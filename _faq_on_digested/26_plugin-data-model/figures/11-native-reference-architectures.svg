<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
<title>10 个 archetype 的参考架构路线</title>
<desc>每个 archetype 给三条都成立的路线：A 默认、B 结构化/外部、C 最安全但受限。没有唯一正确答案，按承诺与代价选。</desc>
<rect width="1200" height="850" rx="8" fill="#f8fafc"/>
<text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">原生优先：10 个 archetype 的三条路线</text>
<text x="600" y="58" text-anchor="middle" fill="#64748b">原生优先：N0/N1 首选，N+ 借模式，E 仅参考；A/B/C 每格给出代价</text>
<rect x="24" y="86" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="40" y="110" font-size="13" font-weight="700" fill="#0f172a">1 项目记忆</text>
<rect x="40" y="122" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="125" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A journal+render</text>
<rect x="220" y="122" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="305" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B 纯 Markdown</text>
<rect x="400" y="122" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="488" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 项目 DB</text>
<text x="40" y="170" font-size="9.4" fill="#64748b">用户可改/崩溃安全</text>
<text x="40" y="188" font-size="9.4" fill="#64748b">简单但冲突</text>
<text x="40" y="206" font-size="9.4" fill="#64748b">查询强但不可读</text>
<rect x="608" y="86" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="624" y="110" font-size="13" font-weight="700" fill="#0f172a">2 个人长期记忆</text>
<rect x="624" y="122" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="709" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A 文件树+条目 id</text>
<rect x="804" y="122" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="889" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B SQLite+迁移</text>
<rect x="984" y="122" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="1072" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 外部服务</text>
<text x="624" y="170" font-size="9.4" fill="#64748b">可读/可同步</text>
<text x="624" y="188" font-size="9.4" fill="#64748b">查询/召回</text>
<text x="624" y="206" font-size="9.4" fill="#64748b">跨设备但运维</text>
<rect x="24" y="226" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="40" y="250" font-size="13" font-weight="700" fill="#0f172a">3 会话归档</text>
<rect x="40" y="262" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="125" y="278" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A 保留期+审计</text>
<rect x="220" y="262" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="305" y="278" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B 只归档不删</text>
<rect x="400" y="262" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="488" y="278" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 等核心 delete</text>
<text x="40" y="310" font-size="9.4" fill="#64748b">可清理但靠目录</text>
<text x="40" y="328" font-size="9.4" fill="#64748b">合规但占盘</text>
<text x="40" y="346" font-size="9.4" fill="#64748b">最安全但受限</text>
<rect x="608" y="226" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="624" y="250" font-size="13" font-weight="700" fill="#0f172a">4 知识库/RAG</text>
<rect x="624" y="262" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="709" y="278" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A 每 KB SQLite</text>
<rect x="804" y="262" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="889" y="278" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B 外部 RAG</text>
<rect x="984" y="262" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="1072" y="278" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 原文件+按需读</text>
<text x="624" y="310" font-size="9.4" fill="#64748b">自包含/可导出</text>
<text x="624" y="328" font-size="9.4" fill="#64748b">强检索但运维</text>
<text x="624" y="346" font-size="9.4" fill="#64748b">轻但无索引</text>
<rect x="24" y="366" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="40" y="390" font-size="13" font-weight="700" fill="#0f172a">5 任务/目标</text>
<rect x="40" y="402" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="125" y="418" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A session 投影</text>
<rect x="220" y="402" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="305" y="418" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B home 域+项目键</text>
<rect x="400" y="402" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="488" y="418" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 项目内文件</text>
<text x="40" y="450" font-size="9.4" fill="#64748b">会话内/零存储</text>
<text x="40" y="468" font-size="9.4" fill="#64748b">跨会话/可查询</text>
<text x="40" y="486" font-size="9.4" fill="#64748b">用户可见/会冲突</text>
<rect x="608" y="366" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="624" y="390" font-size="13" font-weight="700" fill="#0f172a">6 交付物</text>
<rect x="624" y="402" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="709" y="418" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A 工作区+present</text>
<rect x="804" y="402" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="889" y="418" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B 项目导出目录</text>
<rect x="984" y="402" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="1072" y="418" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C artifact 服务</text>
<text x="624" y="450" font-size="9.4" fill="#64748b">默认/引用</text>
<text x="624" y="468" font-size="9.4" fill="#64748b">批量/需清理</text>
<text x="624" y="486" font-size="9.4" fill="#64748b">跨设备但链接寿命</text>
<rect x="24" y="506" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="40" y="530" font-size="13" font-weight="700" fill="#0f172a">7 渠道/账号</text>
<rect x="40" y="542" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="125" y="558" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A profile+credentials</text>
<rect x="220" y="542" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="305" y="558" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B 外部账号 DB</text>
<rect x="400" y="542" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="488" y="558" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 每账号 profile</text>
<text x="40" y="590" font-size="9.4" fill="#64748b">简单/单账号</text>
<text x="40" y="608" font-size="9.4" fill="#64748b">多租户/运维</text>
<text x="40" y="626" font-size="9.4" fill="#64748b">强隔离/切换贵</text>
<rect x="608" y="506" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="624" y="530" font-size="13" font-weight="700" fill="#0f172a">8 每项目运行时</text>
<rect x="624" y="542" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="709" y="558" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A 只读配置+lease</text>
<rect x="804" y="542" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="889" y="558" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B 自己解析</text>
<rect x="984" y="542" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="1072" y="558" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 等核心 scope</text>
<text x="624" y="590" font-size="9.4" fill="#64748b">每项目 MCP/preset</text>
<text x="624" y="608" font-size="9.4" fill="#64748b">简单但重复</text>
<text x="624" y="626" font-size="9.4" fill="#64748b">最干净但受限</text>
<rect x="24" y="646" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="40" y="670" font-size="13" font-weight="700" fill="#0f172a">9 客户端状态</text>
<rect x="40" y="682" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="125" y="698" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A localStorage</text>
<rect x="220" y="682" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="305" y="698" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B host 文件</text>
<rect x="400" y="682" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="488" y="698" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 混合迁移</text>
<text x="40" y="730" font-size="9.4" fill="#64748b">纯 UI/换源丢</text>
<text x="40" y="748" font-size="9.4" fill="#64748b">跨源稳定/要 RPC</text>
<text x="40" y="766" font-size="9.4" fill="#64748b">迁移期双写</text>
<rect x="608" y="646" width="568" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="624" y="670" font-size="13" font-weight="700" fill="#0f172a">10 同步/备份</text>
<rect x="624" y="682" width="170" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="709" y="698" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">A 用户 git</text>
<rect x="804" y="682" width="170" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="889" y="698" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">B 导出 ZIP</text>
<rect x="984" y="682" width="176" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="1072" y="698" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">C 外部同步服务</text>
<text x="624" y="730" font-size="9.4" fill="#64748b">已有仓库/冲突自定</text>
<text x="624" y="748" font-size="9.4" fill="#64748b">手动/不实时</text>
<text x="624" y="766" font-size="9.4" fill="#64748b">多设备/运维</text>
<rect x="24" y="806" width="1152" height="24" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="823" font-size="10" fill="#334155">选型顺序：先填八格画布（权威/作用域/寿命/读写者/敏感性/规模/可移植/可重建），再看哪条路线的代价你能维护。</text>
</svg>
