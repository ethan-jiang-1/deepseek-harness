<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>别人家的插件数据模型：作用域是一等 API</title>
  <desc>VS Code、Obsidian、Claude Code、Codex、MCP、Chrome、Figma 的插件数据家对照。成熟生态的共同点不是“有一个数据库”，而是把用户/项目/会话/秘密/只读资源分别命名，并给出同步与卸载契约。</desc>

  <rect width="1200" height="780" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">别人家的插件数据模型</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">作用域是一等 API；秘密、只读资源、同步与卸载各有名字</text>

  <!-- header -->
  <rect x="24" y="84" width="150" height="34" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="99" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">生态</text>
  <rect x="180" y="84" width="210" height="34" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="285" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">每用户 / 全局</text>
  <rect x="396" y="84" width="220" height="34" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="506" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">每项目 / 工作区</text>
  <rect x="622" y="84" width="150" height="34" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="697" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">每会话</text>
  <rect x="778" y="84" width="180" height="34" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="868" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">秘密</text>
  <rect x="964" y="84" width="212" height="34" rx="7" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="1070" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">只读资源 / 清理</text>

  <!-- rows -->
  <!-- VS Code -->
  <rect x="24" y="124" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="148" font-size="12" font-weight="700" fill="#1e40af">VS Code</text>
  <text x="40" y="168" font-size="9.5" fill="#64748b">扩展宿主按窗口</text>
  <text x="196" y="148" font-size="10" fill="#334155">globalState</text>
  <text x="196" y="168" font-size="9.5" fill="#64748b">globalStorageUri / logUri</text>
  <text x="412" y="148" font-size="10" fill="#334155">workspaceState</text>
  <text x="412" y="168" font-size="9.5" fill="#64748b">storageUri（无文件夹时 undefined）</text>
  <text x="638" y="154" font-size="10" fill="#64748b">无专用</text>
  <text x="794" y="148" font-size="10" fill="#334155">secrets</text>
  <text x="794" y="168" font-size="9.5" fill="#64748b">加密、不同步；memento 明文</text>
  <text x="980" y="148" font-size="10" fill="#334155">extensionUri</text>
  <text x="980" y="168" font-size="9.5" fill="#64748b">卸载脚本可选；存储删除未明说</text>

  <!-- Obsidian -->
  <rect x="24" y="188" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="212" font-size="12" font-weight="700" fill="#1e40af">Obsidian</text>
  <text x="40" y="232" font-size="9.5" fill="#64748b">vault 是项目</text>
  <text x="196" y="212" font-size="10" fill="#334155">OS 设置目录</text>
  <text x="196" y="232" font-size="9.5" fill="#64748b">应用级 SecretStorage</text>
  <text x="412" y="212" font-size="10" fill="#334155">.obsidian/plugins/&lt;id&gt;/</text>
  <text x="412" y="232" font-size="9.5" fill="#64748b">data.json（loadData/saveData）</text>
  <text x="638" y="218" font-size="10" fill="#64748b">内存 / IndexedDB</text>
  <text x="794" y="212" font-size="10" fill="#334155">SecretStorage</text>
  <text x="794" y="232" font-size="9.5" fill="#64748b">设置只存 secret 名字</text>
  <text x="980" y="212" font-size="10" fill="#334155">插件目录</text>
  <text x="980" y="232" font-size="9.5" fill="#64748b">随 vault 走；卸载删除推断</text>

  <!-- Claude Code -->
  <rect x="24" y="252" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="276" font-size="12" font-weight="700" fill="#1e40af">Claude Code</text>
  <text x="40" y="296" font-size="9.5" fill="#64748b">coding agent</text>
  <text x="196" y="276" font-size="10" fill="#334155">~/.claude/settings.json</text>
  <text x="196" y="296" font-size="9.5" fill="#64748b">~/.claude/plugins/</text>
  <text x="412" y="276" font-size="10" fill="#334155">.claude/*.json；CLAUDE.md</text>
  <text x="412" y="296" font-size="9.5" fill="#64748b">settings.local 自动 gitignore</text>
  <text x="638" y="282" font-size="10" fill="#334155">transcript JSONL</text>
  <text x="638" y="302" font-size="9.5" fill="#64748b">默认 30 天清理</text>
  <text x="794" y="276" font-size="10" fill="#334155">userConfig sensitive</text>
  <text x="794" y="296" font-size="9.5" fill="#64748b">→ 平台安全存储</text>
  <text x="980" y="276" font-size="10" fill="#334155">PLUGIN_ROOT vs DATA</text>
  <text x="980" y="296" font-size="9.5" fill="#64748b">last-scope 删 + 14 天 orphan GC</text>

  <!-- Codex -->
  <rect x="24" y="316" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="340" font-size="12" font-weight="700" fill="#1e40af">Codex</text>
  <text x="40" y="360" font-size="9.5" fill="#64748b">CLI / IDE</text>
  <text x="196" y="340" font-size="10" fill="#334155">~/.codex/config.toml</text>
  <text x="196" y="360" font-size="9.5" fill="#64748b">CODEX_HOME；auth.json</text>
  <text x="412" y="340" font-size="10" fill="#334155">.codex/*（仅受信项目）</text>
  <text x="412" y="360" font-size="9.5" fill="#64748b">AGENTS.md 链，32 KiB 上限</text>
  <text x="638" y="346" font-size="10" fill="#334155">sessions / history</text>
  <text x="794" y="340" font-size="10" fill="#334155">auth.json / OS keychain</text>
  <text x="980" y="340" font-size="10" fill="#334155">插件 bundle</text>
  <text x="980" y="360" font-size="9.5" fill="#64748b">卸载移除 bundle；MCP 连接保留</text>

  <!-- MCP -->
  <rect x="24" y="380" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="404" font-size="12" font-weight="700" fill="#1e40af">MCP</text>
  <text x="40" y="424" font-size="9.5" fill="#64748b">协议，不是产品</text>
  <text x="196" y="410" font-size="10" fill="#64748b">未定义</text>
  <text x="412" y="410" font-size="10" fill="#64748b">未定义（roots 已弃用）</text>
  <text x="638" y="404" font-size="10" fill="#334155">requestState</text>
  <text x="638" y="424" font-size="9.5" fill="#64748b">请求自包含</text>
  <text x="794" y="410" font-size="10" fill="#64748b">未定义</text>
  <text x="980" y="404" font-size="10" fill="#334155">resources by URI</text>
  <text x="980" y="424" font-size="9.5" fill="#64748b">客户端配置作用域由宿主定</text>

  <!-- Chrome -->
  <rect x="24" y="444" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="468" font-size="12" font-weight="700" fill="#1e40af">Chrome</text>
  <text x="40" y="488" font-size="9.5" fill="#64748b">扩展</text>
  <text x="196" y="468" font-size="10" fill="#334155">storage.local</text>
  <text x="196" y="488" font-size="9.5" fill="#64748b">约 10 MB；移除时清除</text>
  <text x="412" y="474" font-size="10" fill="#64748b">无</text>
  <text x="638" y="468" font-size="10" fill="#334155">storage.session</text>
  <text x="638" y="488" font-size="9.5" fill="#64748b">内存；重载即清</text>
  <text x="794" y="468" font-size="10" fill="#334155">storage.session</text>
  <text x="794" y="488" font-size="9.5" fill="#64748b">官方建议存临时秘密</text>
  <text x="980" y="468" font-size="10" fill="#334155">storage.sync</text>
  <text x="980" y="488" font-size="9.5" fill="#64748b">约 100 KB；同步清理未明说</text>

  <!-- Figma -->
  <rect x="24" y="508" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="532" font-size="12" font-weight="700" fill="#1e40af">Figma</text>
  <text x="40" y="552" font-size="9.5" fill="#64748b">设计工具</text>
  <text x="196" y="532" font-size="10" fill="#334155">clientStorage</text>
  <text x="196" y="552" font-size="9.5" fill="#64748b">每插件 5 MB；不同步</text>
  <text x="412" y="532" font-size="10" fill="#334155">pluginData / sharedPluginData</text>
  <text x="412" y="552" font-size="9.5" fill="#64748b">挂在文档节点；100 KB/条</text>
  <text x="638" y="538" font-size="10" fill="#64748b">无</text>
  <text x="794" y="538" font-size="10" fill="#991b1b">“stability, not security”</text>
  <text x="980" y="532" font-size="10" fill="#334155">插件资源</text>
  <text x="980" y="552" font-size="9.5" fill="#64748b">卸载清理未文档化；ID 变就丢</text>

  <!-- ideas -->
  <rect x="24" y="580" width="1152" height="184" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="606" font-size="13" font-weight="700" fill="#334155">六个可以迁移的想法</text>
  <text x="44" y="632" font-size="11" fill="#1e40af">1. 作用域写进 API 名字：workspaceState / globalState / secrets，作者不用自己发明“算全局还是项目”。</text>
  <text x="44" y="654" font-size="11" fill="#1e40af">2. 同步按 key opt-in，且 setKeysForSync 是整集合替换：空数组停同步，非空替换全部键。</text>
  <text x="44" y="676" font-size="11" fill="#1e40af">3. 秘密是独立服务：加密、不同步、和普通状态分开；引用而不是字节。</text>
  <text x="44" y="698" font-size="11" fill="#1e40af">4. 版本化安装根 vs 稳定数据根：CLAUDE_PLUGIN_ROOT 升级会换，CLAUDE_PLUGIN_DATA 跨版本稳定。</text>
  <text x="44" y="720" font-size="11" fill="#1e40af">5. 卸载契约：last-scope 删除、--keep-data、.orphaned_at + 14 天 GC；不假设卸载钩子会跑。</text>
  <text x="44" y="742" font-size="11" fill="#1e40af">6. 状态记录与缓存分开：installed_plugins.json vs cache/；缓存可重建，坏了不拖垮状态。</text>
</svg>
