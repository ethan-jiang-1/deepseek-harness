<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">窄证据切片闭环：六步流程</title>
  <desc id="desc">内圈六步闭环：核对现场、圈定窄 diff、改源头并重生成派生物、只跑最小匹配检查、把新判断沉淀对地方、如实只报跑过的命令。走完一圈即交付一个包含代码、当前文档与行为证据的垂直切片。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="580" rx="8" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">窄证据切片闭环：内圈六步流程</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#475569">每一步都对准“会为这次回归报红”的最小证据；走完一圈，同步交付一个完整垂直切片</text>

  <!-- Connectors -->
  <line x1="384" y1="166" x2="431" y2="166" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="765" y1="166" x2="812" y2="166" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="986" y1="232" x2="986" y2="306" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="816" y1="378" x2="769" y2="378" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="378" x2="388" y2="378" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M54,378 L24,378 L24,166 L50,166" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="20" y="276" font-size="11" fill="#475569" transform="rotate(-90 20 276)">下一切片</text>

  <!-- Step 1 -->
  <rect x="54" y="100" width="330" height="132" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="80" cy="130" r="13" fill="#2563eb"/>
  <text x="80" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="102" y="136" font-size="15.5" font-weight="700" fill="#1e40af">核对现场，不信记忆</text>
  <text x="74" y="170" font-size="12.5" fill="#334155">先跑 change-scope 核对当前分支与基准</text>
  <text x="74" y="198" font-size="11.5" fill="#475569">变基或重写历史后，旧提交哈希不再作数</text>

  <!-- Step 2 -->
  <rect x="435" y="100" width="330" height="132" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <circle cx="461" cy="130" r="13" fill="#4f46e5"/>
  <text x="461" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="483" y="136" font-size="15.5" font-weight="700" fill="#3730a3">圈定窄 diff</text>
  <text x="455" y="170" font-size="12.5" fill="#334155">一笔变更只专注解决一个独立问题</text>
  <text x="455" y="198" font-size="11.5" fill="#475569">动工前先摸清触达的包、配置与外部表面</text>

  <!-- Step 3 -->
  <rect x="816" y="100" width="340" height="132" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <circle cx="842" cy="130" r="13" fill="#0f766e"/>
  <text x="842" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="864" y="136" font-size="15.5" font-weight="700" fill="#115e59">改源头，重生成派生物</text>
  <text x="836" y="170" font-size="12.5" fill="#334155">同步更新代码、JSDoc 与包 README</text>
  <text x="836" y="198" font-size="11.5" fill="#475569">生成目录一律跑脚本刷新，绝不手改派生物</text>

  <!-- Step 4 -->
  <rect x="816" y="312" width="340" height="132" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="842" cy="342" r="13" fill="#15803d"/>
  <text x="842" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="864" y="348" font-size="15.5" font-weight="700" fill="#166534">只跑最小匹配检查</text>
  <text x="836" y="382" font-size="12.5" fill="#334155">只挑会为本次回归报红的定向测试与门禁</text>
  <text x="836" y="410" font-size="11.5" fill="#475569">本地绝不默认跑全套；全量与多平台交 CI</text>

  <!-- Step 5 -->
  <rect x="435" y="312" width="330" height="132" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="461" cy="342" r="13" fill="#c2410c"/>
  <text x="461" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="483" y="348" font-size="15.5" font-weight="700" fill="#9a3412">把新判断沉淀对地方</text>
  <text x="455" y="382" font-size="12" fill="#334155">硬规则进门禁 · 持久取舍进 Note · 局部免写</text>
  <text x="455" y="410" font-size="11.5" fill="#7c2d12">不写清替代了哪个备选方案，后人迟早把弯路重走一遍</text>

  <!-- Step 6 -->
  <rect x="54" y="312" width="330" height="132" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="80" cy="342" r="13" fill="#475569"/>
  <text x="80" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="102" y="348" font-size="15.5" font-weight="700" fill="#334155">如实只报跑过的命令</text>
  <text x="74" y="382" font-size="12.5" fill="#334155">PR 报告与实际执行过的命令一一对应</text>
  <text x="74" y="410" font-size="11.5" fill="#475569">没跑的标待定，绝不随口写“已全面测试”</text>

  <!-- Bottom Bar -->
  <rect x="54" y="470" width="1102" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="605" y="500" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">走完一圈 = 原子交付一个完整垂直切片</text>
  <text x="605" y="528" text-anchor="middle" font-size="12.5" fill="#334155">实现代码 · 当前状态文档 · 会报红的行为证据同一 PR 落地（跨切面持久取舍按需补 Agent Note，可见行为变更同步更新快照）</text>
</svg>
