<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>窄证据切片闭环：六步</title>
  <desc>六步闭环：核对现场、判定窄 diff、原子修改 owner 面、最小匹配证据、沉淀判断为 gate 或 Note、只报告实际跑过的检查。蛇形流程，右端折回。底部是每次交付的完整垂直切片。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="8" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">窄证据切片闭环：六步</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#64748b">每一步都对准"会为这次回归而失败"的那一个证据；走完一圈，交付一个完整垂直切片。</text>

  <line x1="355" y1="165" x2="438" y2="165" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="165" x2="845" y2="165" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1005" y1="234" x2="1005" y2="314" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1003" y1="385" x2="760" y2="385" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="443" y1="385" x2="358" y2="385" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M40,385 L20,385 L20,165 L38,165" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="24" y="285" font-size="11" fill="#475569" transform="rotate(-90 24 285)">回到①</text>

  <rect x="40" y="100" width="310" height="130" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="66" cy="130" r="13" fill="#2563eb"/>
  <text x="66" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="88" y="136" font-size="16" font-weight="700" fill="#1e40af">核对现场——不信任记忆</text>
  <text x="88" y="168" font-size="13.5" fill="#334155">先验 checkout、分支、base</text>
  <text x="88" y="196" font-size="12" fill="#64748b">重写后旧 hash 不是证据</text>

  <rect x="445" y="100" width="310" height="130" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <circle cx="471" cy="130" r="13" fill="#4f46e5"/>
  <text x="471" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="493" y="136" font-size="16" font-weight="700" fill="#3730a3">判定窄 diff</text>
  <text x="493" y="168" font-size="13.5" fill="#334155">只看这次改到什么</text>
  <text x="493" y="196" font-size="12" fill="#64748b">change-scope 分四层输出</text>

  <rect x="850" y="100" width="310" height="130" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
  <circle cx="876" cy="130" r="13" fill="#0f766e"/>
  <text x="876" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="898" y="136" font-size="16" font-weight="700" fill="#115e59">原子修改 owner 面</text>
  <text x="898" y="168" font-size="13.5" fill="#334155">改源头，不改编生物</text>
  <text x="898" y="196" font-size="12" fill="#64748b">"A move is atomic"</text>

  <rect x="850" y="320" width="310" height="130" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="876" cy="350" r="13" fill="#15803d"/>
  <text x="876" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="898" y="356" font-size="16" font-weight="700" fill="#166534">最小匹配证据</text>
  <text x="898" y="388" font-size="13.5" fill="#334155">只跑会为回归而失败的那个</text>
  <text x="898" y="416" font-size="12" fill="#64748b">"Never default to the full suite"</text>

  <rect x="445" y="320" width="310" height="130" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="471" cy="350" r="13" fill="#c2410c"/>
  <text x="471" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="493" y="356" font-size="16" font-weight="700" fill="#9a3412">沉淀判断</text>
  <text x="493" y="388" font-size="13.5" fill="#334155">gate / Note / 什么都不加</text>
  <text x="493" y="416" font-size="12" fill="#64748b">"without what it beat invites…"</text>

  <rect x="40" y="320" width="310" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="66" cy="350" r="13" fill="#475569"/>
  <text x="66" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
  <text x="88" y="356" font-size="16" font-weight="700" fill="#334155">只报告实际跑过的</text>
  <text x="88" y="388" font-size="13.5" fill="#334155">报告与证据一一对应</text>
  <text x="88" y="416" font-size="12" fill="#64748b">"report only commands run"</text>

  <rect x="24" y="478" width="1152" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="508" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">一次交付 = 完整垂直切片</text>
  <text x="600" y="536" text-anchor="middle" font-size="13" fill="#334155">代码 · 测试 · 文档 · Note · 快照 同 PR —— 写作基线 0a53fb55be：88% 的 PR 触及 .agents/notes/，Note 文件数中位数 ~9、众数 3（本次复算 12 / 6）</text>
</svg>
