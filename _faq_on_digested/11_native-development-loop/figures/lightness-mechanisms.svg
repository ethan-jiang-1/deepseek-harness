<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">仓库研发“顺手敢改”的三个机制来源</title>
  <desc id="desc">三个机制来源：记忆外包（门禁替人盯住死规矩）、反馈延迟分层（本地只跑最小检查，全量交 CI）、试错代价低（同 PR 原子回退，不背历史兼容包袱）。三者合流让正确路径成为阻力最小的默认路径。</desc>

  <rect width="1200" height="620" rx="8" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">仓库研发“顺手、敢改”的三个机制来源</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#475569">顺手不是因为没有规矩，而是工程制度把“正确的做法”铺成了阻力最小的默认路径</text>

  <!-- Column 1: Memory Outsourcing -->
  <rect x="40" y="94" width="360" height="414" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <path d="M40,134 L40,104 Q40,94 50,94 L390,94 Q400,94 400,104 L400,134 Z" fill="#2563eb"/>
  <text x="220" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1. 记忆外包 · 门禁替你记死规矩</text>

  <text x="62" y="172" font-size="13.5" font-weight="700" fill="#1d4ed8">一个事实一个家</text>
  <text x="62" y="194" font-size="12" fill="#475569">每条规范只有一个权威出处，根入口只负责指路。</text>

  <text x="62" y="238" font-size="13.5" font-weight="700" fill="#1d4ed8">黑白底线变成机器检查</text>
  <text x="62" y="260" font-size="12" fill="#475569">死链、双语配对与归档冻结踩线即报错并给提示。</text>

  <text x="62" y="304" font-size="13.5" font-weight="700" fill="#1d4ed8">复杂流程按需加载</text>
  <text x="62" y="326" font-size="12" fill="#475569">平时只驻留简短技能摘要，命中任务再读完整步骤。</text>

  <text x="62" y="370" font-size="13.5" font-weight="700" fill="#1d4ed8">护栏防越界，但不绑死具体解法</text>
  <text x="62" y="392" font-size="12" fill="#475569">底线要么进门禁要么进决策记录，绝不靠猜潜规则。</text>

  <text x="62" y="450" font-size="12" font-weight="700" fill="#1e40af">不必靠人脑背诵几百条项目约定；</text>
  <text x="62" y="470" font-size="12" font-weight="700" fill="#1e40af">该拦的由机器秒级拦下。</text>

  <!-- Column 2: Layered Feedback Latency -->
  <rect x="420" y="94" width="360" height="414" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <path d="M420,134 L420,104 Q420,94 430,94 L770,94 Q780,94 780,104 L780,134 Z" fill="#15803d"/>
  <text x="600" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2. 反馈分层 · 单步验证足够轻</text>

  <text x="442" y="172" font-size="13.5" font-weight="700" fill="#166534">本地钩子只拦高频硬伤</text>
  <text x="442" y="194" font-size="12" fill="#475569">提交时秒查格式与配对；推送前执行类型检查。</text>

  <text x="442" y="238" font-size="13.5" font-weight="700" fill="#166534">定向单测秒级验证回归</text>
  <text x="442" y="260" font-size="12" fill="#475569">只挑会为本次改动报红的测试，几秒内拿到结果。</text>

  <text x="442" y="304" font-size="13" font-weight="700" fill="#166534">本地只跑改动相关最小检查，全量矩阵交给 CI</text>
  <text x="442" y="326" font-size="12" fill="#475569">单文件 100% 覆盖率与跨平台构建统一交远端兜底。</text>

  <text x="442" y="370" font-size="13.5" font-weight="700" fill="#166534">验证足够快，才没人跳过检查</text>
  <text x="442" y="392" font-size="12" fill="#475569">笨重的全套本地仪式反而会诱导开发者心存侥幸。</text>

  <text x="442" y="450" font-size="12" font-weight="700" fill="#166534">压低单步反馈成本，用高频小步换整体稳健</text>
  <text x="442" y="470" font-size="12" font-weight="700" fill="#166534">（与 FAQ 10 快模型多轮接力同源）。</text>

  <!-- Column 3: Low Cost of Reversal -->
  <rect x="800" y="94" width="360" height="414" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <path d="M800,134 L800,104 Q800,94 810,94 L1150,94 Q1160,94 1160,104 L1160,134 Z" fill="#c2410c"/>
  <text x="980" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3. 犯错代价低 · 不对就整包撤回</text>

  <text x="822" y="172" font-size="13.5" font-weight="700" fill="#9a3412">同 PR 原子回退，不用跨提交翻旧账</text>
  <text x="822" y="194" font-size="12" fill="#475569">如 PR #2903 将 #2608 的 67 个文件整包退回。</text>

  <text x="822" y="238" font-size="13.5" font-weight="700" fill="#9a3412">未覆盖代码优先删死分支</text>
  <text x="822" y="260" font-size="12" fill="#475569">100% 覆盖率抓出死代码时优先精简而非硬凑测试。</text>

  <text x="822" y="304" font-size="13.5" font-weight="700" fill="#9a3412">测试与决策记录随演进更新</text>
  <text x="822" y="326" font-size="12" fill="#475569">行为变了同步改断言；旧决定被替代就明确标记。</text>

  <text x="822" y="370" font-size="13.5" font-weight="700" fill="#9a3412">pre-stable 阶段轻装演进</text>
  <text x="822" y="392" font-size="12" fill="#475569">仓内消费方一次性同步更新，不背旧兼容包袱。</text>

  <text x="822" y="450" font-size="12" font-weight="700" fill="#9a3412">每次变更都控制在可独立撤回的窄切片内，</text>
  <text x="822" y="470" font-size="12" font-weight="700" fill="#9a3412">试错方向歪了也能干净归零。</text>

  <!-- Bottom Convergence Box -->
  <rect x="40" y="528" width="1120" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">三者合流 → 正确的工程路径 = 阻力最小的默认路径</text>
  <text x="600" y="581" text-anchor="middle" font-size="12.5" fill="#334155">执行内圈按 Coding Agent 的快反馈节奏消化合规细节；指挥外圈让维护者把精力集中花在切窄片与审关键证据上。</text>
</svg>
