<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>Session、目录、Workspace 与产品项目身份</title>
  <desc>SessionId、初始 cwd、WorkspaceId、产品 project ID、profile 和 home 分别标识不同对象。WorkspaceId 引用 DSH registration；cwd 表示初始工作目录。</desc>
  <rect width="1200" height="360" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">先问“这个 key 标识什么”</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">路径可以是输入；ID 用于引用有生命周期的记录</text>

  <rect x="30" y="86" width="350" height="92" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="112" font-size="12" font-weight="700" fill="#1e40af">SessionId</text>
  <text x="50" y="138" font-size="10.5" fill="#334155">标识一条会话，用于会话历史与 Session 绑定。</text>
  <text x="50" y="159" font-size="9.5" fill="#64748b">它不表示目录或 Workspace。</text>

  <rect x="425" y="86" width="350" height="92" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="445" y="112" font-size="12" font-weight="700" fill="#166534">`cwd` / `header.cwd`</text>
  <text x="445" y="138" font-size="10.5" fill="#334155">`cwd` 可设置 Session 初始目录；header.cwd 固定保存</text>
  <text x="445" y="159" font-size="9.5" fill="#64748b">原始目录，不等于后续 working directory。</text>

  <rect x="820" y="86" width="350" height="92" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="840" y="112" font-size="12" font-weight="700" fill="#92400e">`WorkspaceId`</text>
  <text x="840" y="138" font-size="10.5" fill="#334155">引用 DSH Host 的 Workspace registration。</text>
  <text x="840" y="159" font-size="9.5" fill="#64748b">重建 registration 会产生新 ID；不表示文件权限。</text>

  <rect x="30" y="196" width="555" height="92" rx="8" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="50" y="222" font-size="12" font-weight="700" fill="#9d174d">产品 project ID</text>
  <text x="50" y="248" font-size="10.5" fill="#334155">由产品定义；只有产品需要跨目录移动、复制或 Workspace</text>
  <text x="50" y="269" font-size="9.5" fill="#64748b">registration 生命周期追踪同一业务项目时，才需要单独保存。</text>

  <rect x="615" y="196" width="555" height="92" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="635" y="222" font-size="12" font-weight="700" fill="#334155">Profile 与 home</text>
  <text x="635" y="248" font-size="10.5" fill="#334155">Profile 是 plugin composition；`$DSH_HOME` 是多项 DSH 状态的 home。</text>
  <text x="635" y="269" font-size="9.5" fill="#64748b">换 profile 不自动隔离同一 home 的数据。</text>

  <text x="600" y="326" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">只需设 Session 目录 → 传 `cwd`；还需进入 DSH 项目分组 → 先有 Workspace registration，再传 `WorkspaceId`。</text>
</svg>
