<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>四个空间：插件包、workspace、账本、全局设置</title>
  <desc>插件包只读、随版本；workspace 可写、用户拥有；账本可重建、在 dataRoot；全局设置跟 home、dataRoot 稳定时跨 profile 一致。workspace 只提供 cwd 与沙箱根，模型能否读写由 preset 工具面决定。</desc>

  <rect width="1200" height="470" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">四个空间：谁拥有、谁能写、换机器还在不在</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">插件包只读，workspace 可写，账本记插件记录，全局设置跟 home</text>

  <!-- 插件包 -->
  <rect x="40" y="88" width="250" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="60" y="116" font-size="13.5" font-weight="700" fill="#1e40af">插件包（只读）</text>
  <text x="60" y="140" font-size="10" fill="#334155">模板、种子、预设、客户端 bundle</text>
  <text x="60" y="166" font-size="9.5" font-weight="700" fill="#1e40af">权威</text>
  <text x="60" y="183" font-size="10" fill="#334155">发布版本（npm）</text>
  <text x="60" y="209" font-size="9.5" font-weight="700" fill="#1e40af">谁读</text>
  <text x="60" y="226" font-size="10" fill="#334155">宿主 node:fs；模型经工具</text>
  <text x="60" y="252" font-size="9.5" font-weight="700" fill="#1e40af">升级</text>
  <text x="60" y="269" font-size="10" fill="#334155">bootstrap 只复制缺失项</text>

  <!-- arrow -->
  <path d="M298 188 L342 188" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M342 188 L334 183 L334 193 Z" fill="#94a3b8"/>
  <text x="320" y="176" text-anchor="middle" font-size="9" fill="#64748b">复制/读取</text>

  <!-- workspace -->
  <rect x="350" y="88" width="290" height="200" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="370" y="116" font-size="13.5" font-weight="700" fill="#166534">workspace（可写）</text>
  <text x="370" y="140" font-size="10" fill="#334155">用户的项目目录：默认或指定</text>
  <text x="370" y="166" font-size="9.5" font-weight="700" fill="#166534">DSH 里的三个身份</text>
  <text x="370" y="183" font-size="10" fill="#334155">侧栏一行 + 会话 cwd + 沙箱根</text>
  <text x="370" y="209" font-size="9.5" font-weight="700" fill="#166534">谁写</text>
  <text x="370" y="226" font-size="10" fill="#334155">有通用工具时是模型；否则插件工具</text>
  <text x="370" y="252" font-size="9.5" font-weight="700" fill="#166534">删除</text>
  <text x="370" y="269" font-size="10" fill="#334155">删登记，不删目录与会话</text>

  <!-- arrow -->
  <path d="M648 188 L692 188" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M692 188 L684 183 L684 193 Z" fill="#94a3b8"/>
  <text x="670" y="176" text-anchor="middle" font-size="9" fill="#64748b">派生</text>

  <!-- 账本 -->
  <rect x="700" y="88" width="250" height="200" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="720" y="116" font-size="13.5" font-weight="700" fill="#6b21a8">账本（插件记录）</text>
  <text x="720" y="140" font-size="10" fill="#334155">索引、绑定、游标</text>
  <text x="720" y="166" font-size="9.5" font-weight="700" fill="#6b21a8">两类事实</text>
  <text x="720" y="183" font-size="10" fill="#334155">索引可重建；绑定/游标不可</text>
  <text x="720" y="209" font-size="9.5" font-weight="700" fill="#6b21a8">位置</text>
  <text x="720" y="226" font-size="10" fill="#334155">默认 $DSH_HOME/&lt;plugin&gt;/</text>
  <text x="720" y="252" font-size="9.5" font-weight="700" fill="#6b21a8">键</text>
  <text x="720" y="269" font-size="10" fill="#334155">w_&lt;sha256(realpath)&gt;</text>

  <!-- 全局设置 -->
  <rect x="350" y="322" width="290" height="104" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="370" y="348" font-size="13.5" font-weight="700" fill="#9f1239">全局设置（跟 home）</text>
  <text x="370" y="370" font-size="10" fill="#334155">渲染节点、默认风格、品牌素材</text>
  <text x="370" y="392" font-size="9.5" font-weight="700" fill="#9f1239">dataRoot 稳定时一致</text>
  <text x="370" y="409" font-size="10" fill="#334155">dataRoot 下的 settings.json；不进 git</text>

  <text x="662" y="362" font-size="9.5" fill="#9f1239">账本与全局设置同属 home 作用域：</text>
  <text x="662" y="380" font-size="9.5" fill="#9f1239">换 home 就丢，换 profile 不受影响。</text>

  <text x="600" y="456" text-anchor="middle" font-size="9.5" fill="#334155">workspace 只给 cwd 与沙箱根；能不能 read/write/bash，由 preset 的工具面决定</text>
</svg>
