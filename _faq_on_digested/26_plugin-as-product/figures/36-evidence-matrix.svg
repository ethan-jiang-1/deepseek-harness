<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>八个样本的证据覆盖</title>
  <desc>dsh-web、codex-ui、dsh-suite、dsh-all、plugins-plus、market、better-session、wallpaper-engine 的版本 pin、源码阅读、测试/CI、README-only 与主要未验证项。</desc>

  <rect width="1200" height="700" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">八个样本的证据覆盖</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">● 已读 · ◐ 部分/读过未跑 · ○ 未验证；TEST/CI 只读未执行，没有 RUN</text>

  <rect x="24" y="84" width="220" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">样本</text>
  <rect x="244" y="84" width="240" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="260" y="105" font-size="11" font-weight="700" fill="#3730a3">版本 pin</text>
  <rect x="484" y="84" width="120" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="500" y="105" font-size="11" font-weight="700" fill="#3730a3">源码</text>
  <rect x="604" y="84" width="120" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="620" y="105" font-size="11" font-weight="700" fill="#3730a3">测试/CI</text>
  <rect x="724" y="84" width="160" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="740" y="105" font-size="11" font-weight="700" fill="#3730a3">README-only</text>
  <rect x="884" y="84" width="292" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="900" y="105" font-size="11" font-weight="700" fill="#3730a3">主要未验证</text>

  <g>
    <rect x="24" y="120" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="145" font-size="10" font-weight="700" fill="#1e40af">dsh-web</text>
    <text x="260" y="151" font-size="9.5" fill="#64748b">v0.4.13 / 88409fb</text>
    <text x="500" y="151" font-size="9.5" fill="#15803d">● 已读</text>
    <text x="620" y="151" font-size="9.5" fill="#b45309">◐ 已读未跑</text>
    <text x="740" y="151" font-size="9.5" fill="#b45309">◐ 部分</text>
    <text x="900" y="151" font-size="9.5" fill="#334155">add/boot/upgrade；satellite</text>

    <rect x="24" y="182" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="207" font-size="10" font-weight="700" fill="#1e40af">dsh-codex-ui</text>
    <text x="260" y="213" font-size="9.5" fill="#64748b">2.0.9 / 29a999e</text>
    <text x="500" y="213" font-size="9.5" fill="#15803d">● 已读</text>
    <text x="620" y="213" font-size="9.5" fill="#b45309">◐ 已读未跑</text>
    <text x="740" y="213" font-size="9.5" fill="#b45309">◐ 部分</text>
    <text x="900" y="213" font-size="9.5" fill="#334155">真实 disable 残留；peer range</text>

    <rect x="24" y="244" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="269" font-size="10" font-weight="700" fill="#1e40af">dsh-suite</text>
    <text x="260" y="275" font-size="9.5" fill="#64748b">0.9.1 / b904373</text>
    <text x="500" y="275" font-size="9.5" fill="#15803d">● 已读</text>
    <text x="620" y="275" font-size="9.5" fill="#b45309">◐ 已读未跑</text>
    <text x="740" y="275" font-size="9.5" fill="#b45309">◐ 部分</text>
    <text x="900" y="275" font-size="9.5" fill="#334155">upgrade/restore；transitive lock</text>

    <rect x="24" y="306" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="331" font-size="10" font-weight="700" fill="#1e40af">dsh-all</text>
    <text x="260" y="337" font-size="9.5" fill="#64748b">0.1.73 / 2c6b35b</text>
    <text x="500" y="337" font-size="9.5" fill="#15803d">● 已读</text>
    <text x="620" y="337" font-size="9.5" fill="#b45309">◐ 已读未跑</text>
    <text x="740" y="337" font-size="9.5" fill="#b45309">◐ 部分</text>
    <text x="900" y="337" font-size="9.5" fill="#334155">重复安装；profile CRUD OS 行为</text>

    <rect x="24" y="368" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="393" font-size="10" font-weight="700" fill="#1e40af">dsh-plugins-plus</text>
    <text x="260" y="399" font-size="9.5" fill="#64748b">0.2.0 / 未对齐</text>
    <text x="500" y="399" font-size="9.5" fill="#94a3b8">○ 未读</text>
    <text x="620" y="399" font-size="9.5" fill="#94a3b8">○ 无</text>
    <text x="740" y="399" font-size="9.5" fill="#15803d">● 主要</text>
    <text x="900" y="399" font-size="9.5" fill="#334155">接管/回滚/迁移实现；source pin</text>

    <rect x="24" y="430" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="455" font-size="10" font-weight="700" fill="#1e40af">dsh-agent-plugins-market</text>
    <text x="260" y="461" font-size="9.5" fill="#64748b">0.13.0 / d3364da</text>
    <text x="500" y="461" font-size="9.5" fill="#15803d">● 已读</text>
    <text x="620" y="461" font-size="9.5" fill="#b45309">◐ 已读未跑</text>
    <text x="740" y="461" font-size="9.5" fill="#b45309">◐ 部分</text>
    <text x="900" y="461" font-size="9.5" fill="#334155">OAuth/hook/filter 运行时；state 恢复</text>

    <rect x="24" y="492" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="517" font-size="10" font-weight="700" fill="#1e40af">better-session</text>
    <text x="260" y="523" font-size="9.5" fill="#64748b">0.1.10 / 发布物</text>
    <text x="500" y="523" font-size="9.5" fill="#b45309">◐ 发布 patch</text>
    <text x="620" y="523" font-size="9.5" fill="#94a3b8">○ 无</text>
    <text x="740" y="523" font-size="9.5" fill="#15803d">● 主要</text>
    <text x="900" y="523" font-size="9.5" fill="#334155">schema/事务/副作用；source pin</text>

    <rect x="24" y="554" width="1152" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="579" font-size="10" font-weight="700" fill="#1e40af">dsh-wallpaper-engine</text>
    <text x="260" y="585" font-size="9.5" fill="#64748b">1.4.0 / 3b0103b</text>
    <text x="500" y="585" font-size="9.5" fill="#15803d">● 已读</text>
    <text x="620" y="585" font-size="9.5" fill="#b45309">◐ 已读未跑</text>
    <text x="740" y="585" font-size="9.5" fill="#b45309">◐ 部分</text>
    <text x="900" y="585" font-size="9.5" fill="#334155">GPU/OS、sandbox、unload teardown</text>
  </g>

  <text x="24" y="640" font-size="9.5" fill="#64748b">● = 固定版本源码已读；◐ = 读过但未执行，或来源只覆盖一部分；○ = 没有该层证据。README-only 表示机制主要来自作者描述。</text>
  <text x="24" y="660" font-size="9.5" fill="#64748b">八个样本都没有安装/启动；“未验证”不是否定，只是本轮没有运行时观察。逐样本细节见 36 篇正文。</text>
</svg>
