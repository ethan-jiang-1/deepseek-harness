<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>产品运行组合与数据卡</title>
  <desc>Profile 决定 bundles 的启动组合。数据卡分别记录 Fact/Authority、Owner/Source、Mechanism/Scope/Key 和 Readers/Writers/Rebuildability/Retention。Workspace 导航和工具权限另行决定。</desc>
  <rect width="1200" height="420" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Profile 定组合；数据卡逐条记录事实</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">产品 profile 可以包含不同 owner、存储机制和 scope 的数据</text>

  <rect x="40" y="82" width="1120" height="58" rx="8" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="60" y="106" font-size="12" font-weight="700" fill="#075985">运行组合</text>
  <text x="180" y="106" font-size="11" fill="#334155">普通 plugin：扩展现有 profile</text>
  <text x="450" y="106" font-size="11" fill="#334155">产品 profile：组合 bundles、plugins 和 presets，由 dsh 启动</text>
  <text x="60" y="126" font-size="9.5" fill="#475569">Profile 名不隔离同一 $DSH_HOME 的数据</text>

  <rect x="40" y="162" width="260" height="152" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="188" font-size="12" font-weight="700" fill="#1e40af">Fact + authority</text>
  <text x="58" y="214" font-size="10" fill="#334155">这是什么事实？</text>
  <text x="58" y="233" font-size="10" fill="#334155">哪份数据决定真值？</text>
  <text x="58" y="270" font-size="9.5" fill="#64748b">用户 / Session / 产品</text>
  <text x="58" y="286" font-size="9.5" fill="#64748b">provider / 外部服务</text>

  <path d="M306 238 L328 238" stroke="#94a3b8" stroke-width="2"/>
  <path d="M328 238 L320 233 L320 243 Z" fill="#94a3b8"/>

  <rect x="334" y="162" width="260" height="152" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="352" y="188" font-size="12" font-weight="700" fill="#166534">Owner + source</text>
  <text x="352" y="214" font-size="10" fill="#334155">谁维护记录的生命周期？</text>
  <text x="352" y="233" font-size="10" fill="#334155">什么输入或操作产生它？</text>
  <text x="352" y="270" font-size="9.5" fill="#64748b">Owner 不一定是 Authority</text>
  <text x="352" y="286" font-size="9.5" fill="#64748b">Source 也不一定是 Writer</text>

  <path d="M600 238 L622 238" stroke="#94a3b8" stroke-width="2"/>
  <path d="M622 238 L614 233 L614 243 Z" fill="#94a3b8"/>

  <rect x="628" y="162" width="260" height="152" rx="8" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="646" y="188" font-size="12" font-weight="700" fill="#9d174d">Mechanism + scope/key</text>
  <text x="646" y="214" font-size="10" fill="#334155">用哪个 API/文件？路径在哪？</text>
  <text x="646" y="233" font-size="10" fill="#334155">跟哪个对象走？用什么 key？</text>
  <text x="646" y="270" font-size="9.5" fill="#64748b">Session / project / Workspace /</text>
  <text x="646" y="286" font-size="9.5" fill="#64748b">profile / home / device</text>

  <path d="M894 238 L916 238" stroke="#94a3b8" stroke-width="2"/>
  <path d="M916 238 L908 233 L908 243 Z" fill="#94a3b8"/>

  <rect x="922" y="162" width="238" height="152" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="940" y="188" font-size="12" font-weight="700" fill="#9f1239">Access + lifecycle</text>
  <text x="940" y="214" font-size="10" fill="#334155">谁能读？谁能写？可重建吗？</text>
  <text x="940" y="233" font-size="10" fill="#334155">谁备份、迁移或删除？</text>
  <text x="940" y="270" font-size="9.5" fill="#64748b">用户 / 模型工具 / 产品</text>
  <text x="940" y="286" font-size="9.5" fill="#64748b">保留 / 重建 / 恢复</text>

  <rect x="40" y="336" width="1120" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="360" font-size="11" font-weight="700" fill="#0f172a">另行决定</text>
  <text x="220" y="360" font-size="10" fill="#334155">Workspace 导航</text>
  <text x="440" y="360" font-size="10" fill="#334155">Session cwd</text>
  <text x="620" y="360" font-size="10" fill="#334155">Preset 工具和 sandbox policy</text>
  <text x="970" y="360" font-size="10" fill="#334155">Profile/home 隔离</text>
  <text x="60" y="382" font-size="9.5" fill="#64748b">数据卡描述事实；这些运行决定会影响事实，但不能互相替代。</text>
</svg>
