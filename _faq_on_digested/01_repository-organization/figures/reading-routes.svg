<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 710" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>按目标选择 DSH 代码阅读路线</title>
  <desc>先花 15 分钟读完五个全局锚点建立坐标，再按四个具体目标选路线：一、搞懂一轮对话怎么跑通；二、查某个工具怎么实现与默认值在哪配；三、写外部插件或加扩展；四、看 Web 前后端怎么通信。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1180" height="710" rx="8" fill="#f8fafc"/>
  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">按目标选阅读路线：别按字母序硬啃三百多个包</text>
  <text x="590" y="56" text-anchor="middle" font-size="12.5" fill="#475569">先用 15 分钟建立全局坐标，再顺着你手头的具体问题挑一条路线追到底。</text>

  <!-- 零：前 15 分钟五步坐标 -->
  <rect x="36" y="76" width="1108" height="72" rx="10" fill="#1e293b"/>
  <text x="590" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">前 15 分钟建立全局感（五步只认地图，不陷进单包细节）</text>
  <text x="590" y="128" text-anchor="middle" font-size="12" fill="#cbd5e1">① 根 AGENTS.md  →  ② docs/architecture.md  →  ③ packages/README.md  →  ④ bundle/base/cordis.patch.yml  →  ⑤ dsh --profile web --dump-config</text>

  <line x1="590" y1="148" x2="590" y2="166" stroke="#64748b" stroke-width="1.5"/>
  <line x1="304" y1="166" x2="876" y2="166" stroke="#64748b" stroke-width="1.5"/>
  <line x1="304" y1="166" x2="304" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="876" y1="166" x2="876" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 路线一 -->
  <rect x="36" y="190" width="536" height="186" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="62" y="220" font-size="15" font-weight="700" fill="#1e40af">路线一：想搞懂“一轮对话怎么跑通”</text>
  <rect x="62" y="236" width="484" height="52" rx="7" fill="#ffffff" stroke="#60a5fa"/>
  <text x="80" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">apps/cli + bundle/headless → core/agent → core/agent-loop</text>
  <text x="80" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2563eb">→ core/session（SessionEventMap + deriveMessages 日志重建）</text>
  <text x="62" y="314" fill="#1e3a8a">适用：摸清 Turn / Step 边界、流式输出、上下文投影与断点重连恢复。</text>
  <text x="62" y="336" fill="#475569">关键铁律：模型可见输入必进会话日志（model-visible ⟺ logged）。</text>
  <text x="62" y="358" font-size="11" fill="#64748b">配套索引：docs/event-producer-consumer.md · docs/persistence-catalog.md</text>

  <!-- 路线二 -->
  <rect x="608" y="190" width="536" height="186" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="634" y="220" font-size="15" font-weight="700" fill="#166534">路线二：想查“某个工具怎么实现、默认值在哪配”</text>
  <rect x="634" y="236" width="484" height="52" rx="7" fill="#ffffff" stroke="#4ade80"/>
  <text x="652" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#14532d">docs/tool-catalog.md → 组 README → Definition → tool-*</text>
  <text x="652" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803d">→ Policy → Provider → bundle / presets/*.patch.yml</text>
  <text x="634" y="314" fill="#14532d">适用：查文件编辑、Bash、子智能体细节，或排查某模式下工具显隐与超时。</text>
  <text x="634" y="336" fill="#475569">关键铁律：执行函数内严禁藏匿硬编码阈值，可调项一律进插件 Config。</text>
  <text x="634" y="358" font-size="11" fill="#64748b">配套索引：docs/config-catalog.md · packages/bundle/web-app/presets/</text>

  <!-- 路线三 -->
  <rect x="36" y="396" width="536" height="186" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#9a3412">路线三：想写外部插件，或给现有能力加扩展</text>
  <rect x="62" y="442" width="484" height="52" rx="7" fill="#ffffff" stroke="#fb923c"/>
  <text x="80" y="463" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#9a3412">docs/capability-seams.md → docs/cookbook/adding-a-*.md</text>
  <text x="80" y="483" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2410c">→ cordis-primer + defensive-patterns → 隔离 $DSH_HOME 实测</text>
  <text x="62" y="520" fill="#7c2d12">适用：开发新工具、接入第三方后端、加审批拦截钩子或排查热重载泄漏。</text>
  <text x="62" y="542" fill="#475569">关键红线：注册必走 ctx.effect() / ctx.on()；瀑布流委托必调 next()。</text>
  <text x="62" y="564" font-size="11" fill="#64748b">隔离纪律：挂入会话级 preset 且对外提供服务时，必须配好 isolate 作用域。</text>

  <!-- 路线四 -->
  <rect x="608" y="396" width="536" height="186" rx="12" fill="#fdf4ff" stroke="#e879f9"/>
  <text x="634" y="426" font-size="15" font-weight="700" fill="#86198f">路线四：想看“Web 前后端怎么通信、卡片数据从哪来”</text>
  <rect x="634" y="442" width="484" height="52" rx="7" fill="#ffffff" stroke="#d946ef"/>
  <text x="652" y="463" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#701a75">packages/client/ui-*（插槽组件）→ ctx.remote 或 ctx.resources</text>
  <text x="652" y="483" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a21caf">→ api/* · host/* 控制器 → 会话日志 / sessionProjections / settings</text>
  <text x="634" y="520" fill="#701a75">适用：调试聊天卡片、右侧面板或设置项，打通从 React 组件到宿主的链路。</text>
  <text x="634" y="542" fill="#475569">两条通路：会话流走 session-controller follow；其余事件走白名单转发。</text>
  <text x="634" y="564" font-size="11" fill="#64748b">联调验证：跑 apps/web/tests/ 真实组装测试，单包单测不覆盖跨端接线。</text>

  <!-- 底部收束 -->
  <rect x="36" y="604" width="1108" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="590" y="632" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">无论从哪条路线切入，最终都要补齐同一条核验闭环</text>
  <text x="590" y="655" text-anchor="middle" fill="#334155">触发入口  →  YAML 组装行  →  Service Definition 契约  →  Provider / Consumer / Policy  →  权威状态源  →  真实组装测试</text>
  <text x="590" y="674" text-anchor="middle" font-size="11.5" fill="#64748b">动手改代码前记住：凡是想往 apps/ 或 agent-loop 里塞普通业务逻辑，大概率都找错了落点。</text>
</svg>
