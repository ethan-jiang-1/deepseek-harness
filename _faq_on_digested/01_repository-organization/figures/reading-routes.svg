<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 750" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="750" rx="8" fill="#fafafa"/>
  <text x="560" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">不要按目录顺序读：先问“我在追什么？”</text>
  <text x="560" y="54" text-anchor="middle" font-size="11" fill="#64748b">每条路线从不同入口开始，最后都要闭环到 owner、运行时组合、事实来源和验证。</text>

  <rect x="420" y="76" width="280" height="56" rx="10" fill="#1e293b"/>
  <text x="560" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">你正在追哪一种问题？</text>
  <text x="560" y="120" text-anchor="middle" fill="#cbd5e1">选路线，不要遍历整个 packages/</text>

  <rect x="32" y="164" width="512" height="126" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="190" font-size="14" font-weight="700" fill="#1e40af">A · 命令 / 产品 surface</text>
  <text x="56" y="217" fill="#1e3a8a">apps entry</text><text x="154" y="217" fill="#64748b">→</text>
  <text x="178" y="217" fill="#1e3a8a">profile-boot</text><text x="276" y="217" fill="#64748b">→</text>
  <text x="300" y="217" fill="#1e3a8a">bundle rows</text><text x="392" y="217" fill="#64748b">→</text>
  <text x="416" y="217" fill="#1e3a8a">package</text>
  <text x="56" y="247" fill="#2563eb">适合：dsh web、headless、ACP、JSON-RPC 怎样启动；桌面另走 Electron 入口。</text>
  <text x="56" y="270" font-size="11" fill="#64748b">不要从 app package.json 的依赖闭包猜活插件树。</text>

  <rect x="576" y="164" width="512" height="126" rx="11" fill="#f0fdf4" stroke="#86efac"/>
  <text x="600" y="190" font-size="14" font-weight="700" fill="#166534">B · Capability / Tool</text>
  <text x="600" y="217" fill="#14532d">group README</text><text x="701" y="217" fill="#64748b">→</text>
  <text x="725" y="217" fill="#14532d">Definition</text><text x="807" y="217" fill="#64748b">→</text>
  <text x="831" y="217" fill="#14532d">Provider / Consumer</text>
  <text x="600" y="247" fill="#15803d">适合：文件系统、LLM、subagent、shell、web search。</text>
  <text x="600" y="270" font-size="11" fill="#64748b">最后搜 bundle/preset row，确认本次到底挂了哪个实现。</text>

  <rect x="32" y="312" width="512" height="126" rx="11" fill="#fdf4ff" stroke="#e879f9"/>
  <text x="56" y="338" font-size="14" font-weight="700" fill="#86198f">C · Web UI</text>
  <text x="56" y="365" fill="#701a75">ui-* plugin</text><text x="146" y="365" fill="#64748b">→</text>
  <text x="170" y="365" fill="#701a75">client service / Remote</text><text x="318" y="365" fill="#64748b">→</text>
  <text x="342" y="365" fill="#701a75">Host owner</text>
  <text x="56" y="395" fill="#a21caf">适合：组件数据来源、UI action、settings、session cards。</text>
  <text x="56" y="418" font-size="11" fill="#64748b">穿过 transport，找到 Session、registry 或 store 等权威状态。</text>

  <rect x="576" y="312" width="512" height="126" rx="11" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="338" font-size="14" font-weight="700" fill="#9a3412">D · Session / 模型上下文</text>
  <text x="600" y="365" fill="#7c2d12">EventMap</text><text x="677" y="365" fill="#64748b">→</text>
  <text x="701" y="365" fill="#7c2d12">producer</text><text x="767" y="365" fill="#64748b">→</text>
  <text x="791" y="365" fill="#7c2d12">surface/header fold</text><text x="914" y="365" fill="#64748b">→</text>
  <text x="938" y="365" fill="#7c2d12">consumer</text>
  <text x="600" y="395" fill="#c2410c">适合：模型为何看见、resume、UI 回放、compaction。</text>
  <text x="600" y="418" font-size="11" fill="#64748b">分别确认 raw log、模型投影和人类 transcript。</text>

  <rect x="32" y="460" width="512" height="126" rx="11" fill="#fefce8" stroke="#fde047"/>
  <text x="56" y="486" font-size="14" font-weight="700" fill="#854d0e">E · 配置 / 默认值</text>
  <text x="56" y="513" fill="#713f12">Config schema</text><text x="155" y="513" fill="#64748b">→</text>
  <text x="179" y="513" fill="#713f12">catalog</text><text x="238" y="513" fill="#64748b">→</text>
  <text x="262" y="513" fill="#713f12">bundle/profile layers</text><text x="400" y="513" fill="#64748b">→</text>
  <text x="424" y="513" fill="#713f12">dump/runtime</text>
  <text x="56" y="543" fill="#a16207">适合：timeout、Provider 参数、工具是否启用、平台差异。</text>
  <text x="56" y="566" font-size="11" fill="#64748b">实现拥有可配置项；组合拥有部署默认和覆盖。</text>

  <rect x="576" y="460" width="512" height="126" rx="11" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="600" y="486" font-size="14" font-weight="700" fill="#334155">F · 生命周期 / HMR / teardown</text>
  <text x="600" y="513" fill="#334155">apply / Service</text><text x="702" y="513" fill="#64748b">→</text>
  <text x="726" y="513" fill="#334155">effect + inject</text><text x="824" y="513" fill="#64748b">→</text>
  <text x="848" y="513" fill="#334155">Fiber</text><text x="890" y="513" fill="#64748b">→</text>
  <text x="914" y="513" fill="#334155">Loader / HMR</text>
  <text x="600" y="543" fill="#475569">适合：重复注册、资源泄漏、启动失败、配置 reload。</text>
  <text x="600" y="566" font-size="11" fill="#64748b">先找 ownership，再进入 vendor lifecycle；不要跳过同步纪律。</text>

  <line x1="560" y1="132" x2="560" y2="148" stroke="#64748b"/>
  <line x1="288" y1="148" x2="832" y2="148" stroke="#64748b"/>
  <line x1="288" y1="148" x2="288" y2="156" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="832" y1="148" x2="832" y2="156" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="80" y="622" width="960" height="92" rx="12" fill="#1e293b"/>
  <text x="560" y="648" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">无论从哪条路线进入，最后都补齐同一个闭环</text>
  <text x="560" y="676" text-anchor="middle" fill="#e2e8f0">触发者 → 组合选择 → 公共合同 → Provider / Consumer / Policy → 权威事实 → 对外呈现 → real-composition 验证</text>
  <text x="560" y="698" text-anchor="middle" font-size="11" fill="#94a3b8">缺哪一段，就用 ctx key、事件名、package 名或 stable row id 搜索；不要用目录相邻关系猜。</text>

  <text x="560" y="736" text-anchor="middle" font-size="11" fill="#64748b">“读完项目”不是遍历文件，而是能为一个问题画出这条完整链。</text>
</svg>
