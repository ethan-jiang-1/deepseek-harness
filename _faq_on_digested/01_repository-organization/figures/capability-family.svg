<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1080" height="610" rx="8" fill="#fafafa"/>
  <text x="540" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">一个 capability family：Definition 在中间，Provider 与 Consumer 分开</text>
  <text x="540" y="54" text-anchor="middle" font-size="11" fill="#64748b">以文件系统为例；组合层选择本次 Provider、Policy 和模型呈现。</text>

  <rect x="390" y="76" width="300" height="62" rx="10" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="540" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Composition</text>
  <text x="540" y="122" text-anchor="middle" fill="#7c3aed">bundle · profile · agent preset</text>
  <path d="M450,138 C390,150 285,148 240,164" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>
  <path d="M630,138 C700,150 815,148 850,164" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>
  <path d="M540,138 C540,240 490,315 520,378" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>

  <rect x="35" y="170" width="310" height="286" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="190" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Service Providers</text>
  <text x="190" y="218" text-anchor="middle" fill="#2563eb">实现同一个 ctx.fs 合同</text>
  <rect x="62" y="240" width="256" height="54" rx="7" fill="#fff" stroke="#60a5fa"/>
  <text x="82" y="263" font-weight="700" fill="#1e3a8a">packages/fs/fs-local</text>
  <text x="82" y="282" fill="#2563eb">本地文件系统 Provider</text>
  <rect x="62" y="308" width="256" height="62" rx="7" fill="#fff" stroke="#60a5fa"/>
  <text x="82" y="331" font-weight="700" fill="#1e3a8a">packages/fs/fs-sandbox</text>
  <text x="82" y="350" fill="#2563eb">本地 IO + sandbox mode/workspace fence</text>
  <text x="82" y="365" font-size="10" fill="#64748b">仍提供 ctx.fs</text>
  <rect x="62" y="384" width="256" height="54" rx="7" fill="#fff" stroke="#60a5fa"/>
  <text x="82" y="407" font-weight="700" fill="#1e3a8a">packages/e2b/fs-e2b</text>
  <text x="82" y="426" fill="#2563eb">共享 ctx.e2b 的远程 Provider</text>

  <rect x="390" y="172" width="300" height="160" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Service Definition</text>
  <text x="540" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">packages/fs/fs</text>
  <rect x="424" y="247" width="232" height="62" rx="7" fill="#fff" stroke="#86efac"/>
  <text x="540" y="269" text-anchor="middle" fill="#15803d">ctx.fs · targets · results</text>
  <text x="540" y="289" text-anchor="middle" fill="#15803d">atomic mutation · fs/* policy events</text>
  <line x1="345" y1="310" x2="382" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364" y="297" text-anchor="middle" font-size="10" fill="#475569">implements</text>

  <rect x="735" y="170" width="310" height="176" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="890" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Consumer</text>
  <rect x="762" y="222" width="256" height="92" rx="7" fill="#fff" stroke="#fb923c"/>
  <text x="890" y="245" text-anchor="middle" font-weight="700" fill="#9a3412">packages/fs/tool-fs</text>
  <text x="890" y="267" text-anchor="middle" fill="#c2410c">注册 read / read_image / write / edit</text>
  <text x="890" y="287" text-anchor="middle" fill="#c2410c">向 ctx.fs 发请求，向 ctx.tools 注册</text>
  <line x1="735" y1="278" x2="698" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="717" y="265" text-anchor="middle" font-size="10" fill="#475569">consumes</text>

  <rect x="390" y="386" width="300" height="116" rx="12" fill="#fefce8" stroke="#fde047"/>
  <text x="540" y="413" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">Policy plugin</text>
  <text x="540" y="438" text-anchor="middle" font-weight="700" fill="#854d0e">packages/fs/fs-observation-policy</text>
  <text x="540" y="461" text-anchor="middle" fill="#a16207">监听 fs/*：observed state · read-before-edit</text>
  <text x="540" y="482" text-anchor="middle" fill="#a16207">不提供另一个 service，不绑死 Consumer</text>
  <line x1="540" y1="386" x2="540" y2="340" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="552" y="365" font-size="10" fill="#ea580c">attaches policy</text>

  <rect x="735" y="386" width="310" height="116" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="890" y="413" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">相邻 Consumer，不扩张 Definition</text>
  <text x="890" y="438" text-anchor="middle" font-weight="700" fill="#334155">packages/fs/tool-fs-search</text>
  <text x="890" y="461" text-anchor="middle" fill="#475569">glob / grep 通过 ctx.subprocess 运行 ripgrep</text>
  <text x="890" y="482" text-anchor="middle" fill="#64748b">搜索工作流不强迫所有 ctx.fs Provider 实现</text>

  <rect x="35" y="535" width="1010" height="48" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="540" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">目录组织表达依赖方向：Provider → Definition ← Consumer；Composition 才依赖具体选择。</text>
  <text x="540" y="575" text-anchor="middle" font-size="11" fill="#64748b">同组表示共同领域，不表示互相直接 import；跨组 Provider 可以跟随其真正的 runtime owner。</text>
</svg>
