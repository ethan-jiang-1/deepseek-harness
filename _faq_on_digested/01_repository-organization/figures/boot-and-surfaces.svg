<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1120" height="700" rx="8" fill="#fafafa"/>
  <text x="560" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">从 dsh 命令到 Host 与 Browser 插件树</text>
  <text x="560" y="54" text-anchor="middle" font-size="11" fill="#64748b">入口解析 profile，组合层选择 package，Loader 才把静态 rows 变成活贡献。</text>

  <rect x="32" y="86" width="146" height="68" rx="9" fill="#1e293b"/>
  <text x="105" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">dsh command</text>
  <text x="105" y="134" text-anchor="middle" fill="#cbd5e1">web / headless / custom</text>
  <line x1="178" y1="120" x2="213" y2="120" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="220" y="86" width="170" height="68" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="305" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">apps/cli</text>
  <text x="305" y="132" text-anchor="middle" fill="#2563eb">args + profile-boot + shutdown</text>
  <line x1="390" y1="120" x2="425" y2="120" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="432" y="72" width="256" height="96" rx="9" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="560" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">有效 patch stack</text>
  <text x="560" y="120" text-anchor="middle" fill="#7c3aed">bundles → profile → home</text>
  <text x="560" y="140" text-anchor="middle" fill="#7c3aed">→ --patch → launcher switch</text>
  <text x="560" y="157" text-anchor="middle" font-size="10" fill="#6b21a8">从空 entry list 合成</text>
  <line x1="688" y1="120" x2="723" y2="120" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="730" y="86" width="170" height="68" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="815" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">packages/boot/app-boot</text>
  <text x="815" y="132" text-anchor="middle" fill="#15803d">Context + Loader + settlement</text>
  <line x1="900" y1="120" x2="935" y2="120" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="942" y="78" width="146" height="84" rx="9" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1015" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Host Cordis tree</text>
  <text x="1015" y="126" text-anchor="middle" fill="#c2410c">Fibers · services</text>
  <text x="1015" y="145" text-anchor="middle" fill="#c2410c">events · effects</text>

  <line x1="1015" y1="162" x2="1015" y2="194" stroke="#475569"/>
  <line x1="240" y1="194" x2="1015" y2="194" stroke="#475569"/>
  <line x1="240" y1="194" x2="240" y2="222" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="710" y1="194" x2="710" y2="222" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="42" y="230" width="396" height="230" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="240" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Headless profile 示例</text>
  <rect x="70" y="282" width="340" height="92" rx="8" fill="#fff" stroke="#4ade80"/>
  <text x="240" y="306" text-anchor="middle" font-weight="700" fill="#14532d">共享 Host spine</text>
  <text x="240" y="329" text-anchor="middle" fill="#15803d">session · agent · llm · tools · providers</text>
  <text x="240" y="350" text-anchor="middle" fill="#15803d">同一套日志和 capability contracts</text>
  <rect x="70" y="388" width="340" height="50" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="240" y="409" text-anchor="middle" font-weight="700" fill="#166534">headless startup plugin</text>
  <text x="240" y="428" text-anchor="middle" fill="#15803d">读 app args → 驱动 session → stdout → exit</text>

  <rect x="478" y="230" width="464" height="230" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="710" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Web profile · Host 示例</text>
  <rect x="506" y="282" width="408" height="92" rx="8" fill="#fff" stroke="#60a5fa"/>
  <text x="710" y="306" text-anchor="middle" font-weight="700" fill="#1e3a8a">共享 Host spine + Web Host packages</text>
  <text x="710" y="329" text-anchor="middle" fill="#2563eb">host/webserver · api gateway/remotes</text>
  <text x="710" y="350" text-anchor="middle" fill="#2563eb">frontend-static · client entry graph</text>
  <rect x="506" y="388" width="408" height="50" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="710" y="409" text-anchor="middle" font-weight="700" fill="#1e40af">HTTP / typed Remote / session event projections</text>
  <text x="710" y="428" text-anchor="middle" fill="#2563eb">连接浏览器环境中的 Browser tree</text>

  <line x1="942" y1="345" x2="982" y2="345" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="990" y="230" width="104" height="230" rx="12" fill="#fdf4ff" stroke="#e879f9"/>
  <text x="1042" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#86198f">Browser</text>
  <text x="1042" y="278" text-anchor="middle" fill="#a21caf">apps/web</text>
  <line x1="1042" y1="290" x2="1042" y2="315" stroke="#a21caf" marker-end="url(#arrow)"/>
  <text x="1042" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#86198f">client-web</text>
  <text x="1042" y="358" text-anchor="middle" fill="#a21caf">module graph</text>
  <text x="1042" y="376" text-anchor="middle" fill="#a21caf">Client Loader</text>
  <line x1="1042" y1="389" x2="1042" y2="410" stroke="#a21caf" marker-end="url(#arrow)"/>
  <text x="1042" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="#86198f">ui-* plugins</text>
  <text x="1042" y="449" text-anchor="middle" fill="#a21caf">slots + React</text>

  <rect x="42" y="492" width="1052" height="142" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="68" y="521" font-size="14" font-weight="700" fill="#334155">组合层的分工</text>
  <rect x="68" y="542" width="235" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="185" y="566" text-anchor="middle" font-weight="700" fill="#334155">package</text>
  <text x="185" y="588" text-anchor="middle" fill="#475569">拥有行为、Config 与生命周期</text>
  <rect x="319" y="542" width="235" height="64" rx="8" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="436" y="566" text-anchor="middle" font-weight="700" fill="#6d28d9">bundle</text>
  <text x="436" y="588" text-anchor="middle" fill="#7c3aed">发布可复用默认 rows</text>
  <rect x="570" y="542" width="235" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="687" y="566" text-anchor="middle" font-weight="700" fill="#9a3412">profile / overlay</text>
  <text x="687" y="588" text-anchor="middle" fill="#c2410c">部署与单次调用覆盖</text>
  <rect x="821" y="542" width="245" height="64" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="943" y="566" text-anchor="middle" font-weight="700" fill="#854d0e">agent preset</text>
  <text x="943" y="588" text-anchor="middle" fill="#a16207">选择每个 agent 的 scoped 贡献</text>

  <text x="560" y="671" text-anchor="middle" font-size="11" fill="#64748b">Web 与 Headless 不是两套 Agent：它们选择不同 surface plugins，复用同一 Host contracts 与 session 语义。</text>
</svg>
