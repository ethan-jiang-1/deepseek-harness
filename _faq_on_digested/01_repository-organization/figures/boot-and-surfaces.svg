<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>从 CLI 与 Desktop 入口到 Host 与 Client 插件树</title>
  <desc>apps/cli（web / headless / sdk / acp / sdk-minimal）与 apps/desktop（Electron + desktop-host）两条受支持启动入口汇入同一套 runProfile 补丁合成与 app-boot，在 Node 侧构建 Host 插件树，并在 Web/Desktop 形态下驱动浏览器侧 Client 插件树。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">薄入口装配全景：从 CLI / Desktop 到宿主与前端插件树</text>
  <text x="600" y="56" text-anchor="middle" font-size="12.5" fill="#475569">启动器只管参数解析与进程拉起；无论命令行还是 Electron 桌面版，底层都走同一套 runProfile 补丁合成与 Cordis 加载器。</text>

  <!-- 左上：两条启动入口 -->
  <rect x="30" y="80" width="264" height="58" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="162" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">CLI 入口 · apps/cli</text>
  <text x="162" y="124" text-anchor="middle" font-size="10.5" fill="#1e3a8a">web · headless · sdk · acp · sdk-minimal</text>

  <rect x="30" y="150" width="264" height="58" rx="9" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="162" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">桌面入口 · apps/desktop</text>
  <text x="162" y="194" text-anchor="middle" font-size="11" fill="#312e81">Electron 主进程 → desktop-host</text>

  <line x1="294" y1="109" x2="310" y2="109" stroke="#475569" stroke-width="1.5"/>
  <line x1="294" y1="179" x2="310" y2="179" stroke="#475569" stroke-width="1.5"/>
  <line x1="310" y1="109" x2="310" y2="179" stroke="#475569" stroke-width="1.5"/>
  <line x1="310" y1="144" x2="328" y2="144" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 补丁合成 -->
  <rect x="334" y="84" width="296" height="120" rx="9" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="482" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">五层配置补丁合成（runProfile）</text>
  <text x="482" y="133" text-anchor="middle" fill="#7c3aed">1. bundles → 2. profile 用户补丁</text>
  <text x="482" y="153" text-anchor="middle" fill="#7c3aed">→ 3. $DSH_HOME 全局层 → 4. --patch</text>
  <text x="482" y="173" text-anchor="middle" fill="#7c3aed">→ 5. 启动器开关（从空列表 [] 叠加）</text>
  <text x="482" y="193" text-anchor="middle" font-size="11" fill="#5b21b6">可用 dsh --dump-config 直接预览合成结果</text>

  <line x1="630" y1="144" x2="660" y2="144" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- app-boot -->
  <rect x="666" y="96" width="224" height="96" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="778" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">packages/boot/app-boot</text>
  <text x="778" y="146" text-anchor="middle" fill="#15803d">创建根 Context + 安装 Loader</text>
  <text x="778" y="168" text-anchor="middle" fill="#15803d">校验并激活各插件行 Fiber</text>

  <line x1="890" y1="144" x2="920" y2="144" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Host Cordis tree -->
  <rect x="926" y="96" width="238" height="96" rx="9" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1045" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Host Cordis 插件树</text>
  <text x="1045" y="146" text-anchor="middle" fill="#c2410c">Node 进程级服务与注册表</text>
  <text x="1045" y="168" text-anchor="middle" fill="#c2410c">事件瀑布流 · 会话作用域隔离</text>

  <!-- 分支连线到下方两种表面形态 -->
  <line x1="1045" y1="192" x2="1045" y2="218" stroke="#475569" stroke-width="1.5"/>
  <line x1="238" y1="218" x2="1045" y2="218" stroke="#475569" stroke-width="1.5"/>
  <line x1="238" y1="218" x2="238" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="686" y1="218" x2="686" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 左：单轮与协议表面 -->
  <rect x="36" y="248" width="404" height="236" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="238" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">命令行与协议形态（headless · sdk · acp）</text>

  <rect x="58" y="294" width="360" height="86" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="238" y="318" text-anchor="middle" font-weight="700" fill="#14532d">共享 dsh-base 宿主底座</text>
  <text x="238" y="340" text-anchor="middle" fill="#15803d">session · agent-loop · llm · tools · 沙箱与审批</text>
  <text x="238" y="361" text-anchor="middle" font-size="11" fill="#475569">（注：sdk-minimal 不叠 dsh-base，单用最精简显式树）</text>

  <rect x="58" y="394" width="360" height="72" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="238" y="418" text-anchor="middle" font-weight="700" fill="#166534">表面入口插件接管进程生命周期</text>
  <text x="238" y="440" text-anchor="middle" font-size="11.5" fill="#15803d">headless 跑完单轮即退出 · sdk 供 TS/Python JSON-RPC</text>
  <text x="238" y="458" text-anchor="middle" font-size="11.5" fill="#15803d">acp 面向外部自动化客户端提供标准协议服务</text>

  <!-- 中：Web 与 Desktop 宿主表面 -->
  <rect x="468" y="248" width="436" height="236" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="686" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">图形界面宿主形态（web 与 desktop 共用）</text>

  <rect x="490" y="294" width="392" height="86" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="686" y="318" text-anchor="middle" font-weight="700" fill="#1e3a8a">共享 dsh-base + dsh-web-app</text>
  <text x="686" y="340" text-anchor="middle" fill="#2563eb">host/webserver · api/gateway · session-controller</text>
  <text x="686" y="361" text-anchor="middle" font-size="11" fill="#475569">Desktop 仅由 desktop-host 绑定本地随机端口跑同一套 Web 宿主</text>

  <rect x="490" y="394" width="392" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="686" y="418" text-anchor="middle" font-weight="700" fill="#1e40af">跨进程 / 跨端通信通道</text>
  <text x="686" y="440" text-anchor="middle" font-size="11.5" fill="#1e3a8a">HTTP 静态资源 + 类型化 Remote 调用</text>
  <text x="686" y="458" text-anchor="middle" font-size="11.5" fill="#1e3a8a">会话 follow 流 + 白名单宿主事件转发</text>

  <!-- 箭头到 Client Cordis 树 -->
  <line x1="904" y1="366" x2="938" y2="366" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 右：浏览器 / Electron 窗口内的 Client 树 -->
  <rect x="944" y="248" width="220" height="236" rx="12" fill="#fdf4ff" stroke="#e879f9"/>
  <text x="1054" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#86198f">Client Cordis 插件树</text>
  <text x="1054" y="296" text-anchor="middle" font-size="11" fill="#a21caf">浏览器页面 / Electron 窗口</text>

  <rect x="964" y="312" width="180" height="44" rx="7" fill="#ffffff" stroke="#d946ef"/>
  <text x="1054" y="331" text-anchor="middle" font-weight="700" fill="#86198f">apps/web 薄挂载壳</text>
  <text x="1054" y="348" text-anchor="middle" font-size="11" fill="#a21caf">定位 DOM 节点并启动前端壳</text>

  <line x1="1054" y1="356" x2="1054" y2="374" stroke="#a21caf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="964" y="378" width="180" height="88" rx="7" fill="#fae8ff" stroke="#d946ef"/>
  <text x="1054" y="400" text-anchor="middle" font-weight="700" fill="#86198f">client-web + ui-* 插件</text>
  <text x="1054" y="421" text-anchor="middle" font-size="11" fill="#701a75">独立浏览器侧 Loader</text>
  <text x="1054" y="439" text-anchor="middle" font-size="11" fill="#701a75">插槽组件（slots）+ React</text>
  <text x="1054" y="457" text-anchor="middle" font-size="11" fill="#701a75">资源模型 ctx.resources</text>

  <!-- 底部：四层组合分工 -->
  <rect x="36" y="508" width="1128" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="536" font-size="14" font-weight="700" fill="#0f172a">四级组装单元的职责边界</text>

  <rect x="60" y="554" width="256" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="188" y="578" text-anchor="middle" font-weight="700" fill="#0f172a">package（能力包）</text>
  <text x="188" y="600" text-anchor="middle" fill="#475569">实现具体服务、工具、Config</text>
  <text x="188" y="618" text-anchor="middle" font-size="11" fill="#64748b">与 ctx.effect 生命周期</text>

  <rect x="334" y="554" width="256" height="74" rx="8" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="462" y="578" text-anchor="middle" font-weight="700" fill="#6d28d9">bundle（默认组合包）</text>
  <text x="462" y="600" text-anchor="middle" fill="#7c3aed">用 cordis.patch.yml 选定</text>
  <text x="462" y="618" text-anchor="middle" font-size="11" fill="#6d28d9">可复用的默认插件行列表</text>

  <rect x="608" y="554" width="256" height="74" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="736" y="578" text-anchor="middle" font-weight="700" fill="#9a3412">profile / --patch（部署层）</text>
  <text x="736" y="600" text-anchor="middle" fill="#c2410c">承载用户已装扩展、机器级覆盖</text>
  <text x="736" y="618" text-anchor="middle" font-size="11" fill="#9a3412">与单次命令行的临时开关</text>

  <rect x="882" y="554" width="258" height="74" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="1011" y="578" text-anchor="middle" font-weight="700" fill="#854d0e">agent preset（会话预设）</text>
  <text x="1011" y="600" text-anchor="middle" fill="#a16207">在单个会话 scope 内按模式</text>
  <text x="1011" y="618" text-anchor="middle" font-size="11" fill="#854d0e">组装工具集、提示词与 isolate</text>

  <text x="600" y="684" text-anchor="middle" font-size="12" fill="#475569">Web、Headless、SDK、ACP 与 Desktop 并非五套独立 Agent：它们只是在不同入口表面上复用同一套 packages/ 核心实现。</text>
</svg>
