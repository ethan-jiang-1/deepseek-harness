<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 690" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>DSH 仓库顶层职责分区</title>
  <desc>DSH 顶层目录按维护归属与发版边界划为六块：框架与原生底座、可复用产品能力、薄入口与默认组装、跨语言发行与性能门禁、文档与工程治理、录制快照与可选配置。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1160" height="690" rx="8" fill="#f8fafc"/>
  <text x="580" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">DSH 仓库顶层分区：按维护归属与发版边界切分</text>
  <text x="580" y="56" text-anchor="middle" font-size="12.5" fill="#475569">顶层十几个目录不是从下往上的调用分层，而是分别承载底座框架、业务能力、薄启动壳、跨语言包与工程门禁。</text>

  <rect x="430" y="74" width="300" height="54" rx="10" fill="#1e293b"/>
  <text x="580" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">deepseek-harness/</text>
  <text x="580" y="117" text-anchor="middle" font-size="11.5" fill="#cbd5e1">单一工作区仓库 · 多重发布与维护边界</text>

  <line x1="580" y1="128" x2="580" y2="148" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="148" x2="860" y2="148" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="148" x2="300" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="148" x2="860" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 1. 框架与原生底座 -->
  <rect x="40" y="174" width="520" height="136" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="64" y="202" font-size="14" font-weight="700" fill="#9a3412">1. 框架与原生底座</text>
  <rect x="64" y="216" width="120" height="32" rx="6" fill="#ffedd5" stroke="#fb923c"/>
  <text x="124" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#9a3412">vendor/</text>
  <rect x="196" y="216" width="120" height="32" rx="6" fill="#ffedd5" stroke="#fb923c"/>
  <text x="256" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#9a3412">native/</text>
  <text x="64" y="272" fill="#7c2d12">钉死版本的 Cordis 框架源码，以及 Landlock / flock 原生扩展。</text>
  <text x="64" y="293" fill="#c2410c">有独立同步台账与跨平台发版流程，不能当普通业务包随手重构。</text>

  <!-- 2. 可复用产品能力 -->
  <rect x="600" y="174" width="520" height="136" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="624" y="202" font-size="14" font-weight="700" fill="#1e40af">2. 可复用产品能力</text>
  <rect x="624" y="216" width="236" height="32" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="742" y="237" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e40af">packages/&lt;group&gt;/&lt;pkg&gt;/</text>
  <text x="624" y="272" fill="#1e3a8a">五十多个业务领域组：承载接口定义、后端实现、模型工具、策略与前端插件。</text>
  <text x="624" y="293" fill="#2563eb">唯一按成熟度划分的特区是 experimental/（评估期能力，无长期兼容承诺）。</text>

  <!-- 3. 薄入口与默认组装 -->
  <rect x="40" y="328" width="520" height="136" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="64" y="356" font-size="14" font-weight="700" fill="#166534">3. 薄入口与默认组装</text>
  <rect x="64" y="370" width="110" height="32" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="119" y="391" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#166534">apps/</text>
  <rect x="186" y="370" width="186" height="32" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="279" y="391" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#166534">packages/bundle/</text>
  <text x="64" y="426" fill="#14532d">apps/ 只保留 CLI、Web、Desktop 启动壳，不承载可复用业务逻辑。</text>
  <text x="64" y="447" fill="#15803d">默认加载哪些插件全部声明在 packages/bundle/*/cordis.patch.yml。</text>

  <!-- 4. 跨语言发行与性能门禁 -->
  <rect x="600" y="328" width="520" height="136" rx="12" fill="#fdf4ff" stroke="#e879f9"/>
  <text x="624" y="356" font-size="14" font-weight="700" fill="#86198f">4. 跨语言发行与性能门禁</text>
  <rect x="624" y="370" width="116" height="32" rx="6" fill="#fae8ff" stroke="#d946ef"/>
  <text x="682" y="391" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#86198f">python/</text>
  <rect x="752" y="370" width="146" height="32" rx="6" fill="#fae8ff" stroke="#d946ef"/>
  <text x="825" y="391" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#86198f">benchmarks/</text>
  <text x="624" y="426" fill="#701a75">python/ 提供 Python SDK 与捆绑运行时（底层经 stdio JSON-RPC 调 dsh）。</text>
  <text x="624" y="447" fill="#a21caf">benchmarks/ 存放由根 vitest.bench.config.ts 编排的全仓性能门禁。</text>

  <!-- 5. 文档与工程治理 -->
  <rect x="40" y="482" width="520" height="136" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="510" font-size="14" font-weight="700" fill="#0f172a">5. 文档与工程治理</text>
  <text x="64" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#334155">docs/ · website/ · scripts/ · .agents/ · .github/</text>
  <text x="64" y="566" fill="#475569">docs/ 只写系统当前状态；website/ 仅把文档与包 README 投影为网页路由。</text>
  <text x="64" y="587" fill="#64748b">scripts/ 管目录生成与校验门禁；.agents/ 存架构决策记录与仓内技能。</text>

  <!-- 6. 录制快照与可选配置 -->
  <rect x="600" y="482" width="520" height="136" rx="12" fill="#fefce8" stroke="#fde047"/>
  <text x="624" y="510" font-size="14" font-weight="700" fill="#854d0e">6. 录制快照与可选配置</text>
  <text x="624" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#854d0e">snapshots/ · apps/cli/config/examples/ · patches/</text>
  <text x="624" y="566" fill="#713f12">snapshots/ 存无密钥端到端会话回放快照；examples/ 存 --patch 示例层。</text>
  <text x="624" y="587" fill="#a16207">patches/ 仅放第三方依赖小补丁；长线维护的框架源码一律进 vendor/。</text>

  <!-- 底部总结 -->
  <rect x="40" y="636" width="1080" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="659" text-anchor="middle" font-size="12" fill="#334155">顶层目录回答“归谁维护、怎么发版”；要追运行时的真实调用关系，请接着看包依赖图与 Cordis 插件组装树。</text>
</svg>
