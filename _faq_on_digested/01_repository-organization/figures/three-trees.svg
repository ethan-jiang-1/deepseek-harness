<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>同一个 DSH 的三张结构图</title>
  <desc>阅读 DSH 需要区分三张图：仓库目录树（维护归属）、包依赖图（静态接口契约）与运行时插件树（Context 作用域与 Effect 清理生命周期）。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1160" height="620" rx="8" fill="#f8fafc"/>
  <text x="580" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">同一个 DSH，脑子里要同时分开三张结构图</text>
  <text x="580" y="56" text-anchor="middle" font-size="12.5" fill="#475569">目录树回答“在哪维护”，包依赖图回答“谁认识谁的接口”，运行时插件树回答“这次实际挂了谁、怎么隔离与清理”。</text>

  <!-- ① 仓库目录树 -->
  <rect x="36" y="78" width="336" height="440" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="204" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">① 仓库目录树（静态目录）</text>
  <text x="204" y="130" text-anchor="middle" fill="#2563eb">代码归属 · 领域分组 · 发版单元</text>

  <rect x="60" y="152" width="288" height="50" rx="7" fill="#ffffff" stroke="#60a5fa"/>
  <text x="78" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">vendor/ · native/</text>
  <text x="78" y="192" fill="#2563eb">Cordis 框架源码与原生系统扩展</text>

  <rect x="60" y="214" width="288" height="68" rx="7" fill="#ffffff" stroke="#60a5fa"/>
  <text x="78" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">packages/&lt;group&gt;/&lt;pkg&gt;/</text>
  <text x="78" y="255" fill="#2563eb">第一层按业务分家，第二层按角色拆包</text>
  <text x="78" y="273" font-size="11" fill="#475569">定义 · 实现 · 消费方 · 策略 · 前端插件</text>

  <rect x="60" y="294" width="288" height="50" rx="7" fill="#ffffff" stroke="#60a5fa"/>
  <text x="78" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">apps/ · python/ · benchmarks/</text>
  <text x="78" y="334" fill="#2563eb">薄启动壳、跨语言载体与性能门禁</text>

  <rect x="60" y="356" width="288" height="50" rx="7" fill="#ffffff" stroke="#60a5fa"/>
  <text x="78" y="377" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1e3a8a">docs/ · scripts/ · website/</text>
  <text x="78" y="396" fill="#2563eb">权威文档、生成门禁与站点路由投影</text>

  <text x="204" y="442" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">权威线索</text>
  <text x="204" y="464" text-anchor="middle" fill="#334155">pnpm-workspace.yaml</text>
  <text x="204" y="484" text-anchor="middle" fill="#334155">packages/&lt;group&gt;/README.md</text>

  <!-- 箭头 1 -> 2 -->
  <line x1="372" y1="292" x2="404" y2="292" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="388" y="278" text-anchor="middle" font-size="10.5" fill="#2563eb">清单声明</text>

  <!-- ② 包依赖图 -->
  <rect x="412" y="78" width="336" height="440" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="580" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">② 包依赖图（静态契约）</text>
  <text x="580" y="130" text-anchor="middle" fill="#16a34a">import 方向 · 接口解耦 · 发布闭包</text>

  <rect x="436" y="156" width="132" height="52" rx="7" fill="#ffffff" stroke="#4ade80"/>
  <text x="502" y="178" text-anchor="middle" font-weight="700" fill="#166534">实现方 Provider</text>
  <text x="502" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803d">fs-sandbox</text>

  <rect x="592" y="156" width="132" height="52" rx="7" fill="#ffffff" stroke="#4ade80"/>
  <text x="658" y="178" text-anchor="middle" font-weight="700" fill="#166534">消费方 Consumer</text>
  <text x="658" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803d">tool-fs</text>

  <line x1="522" y1="208" x2="552" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="638" y1="208" x2="608" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="484" y="236" width="192" height="76" rx="9" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="580" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">服务定义 Definition</text>
  <text x="580" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15803d">packages/fs/fs</text>
  <text x="580" y="300" text-anchor="middle" fill="#15803d">声明 ctx.fs 与 fs/* 事件</text>

  <line x1="580" y1="312" x2="580" y2="340" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="444" y="346" width="272" height="60" rx="7" fill="#ffffff" stroke="#4ade80"/>
  <text x="580" y="370" text-anchor="middle" font-weight="700" fill="#166534">package.json · peerDependencies</text>
  <text x="580" y="392" text-anchor="middle" fill="#15803d">自动生成 docs/module-graph.md</text>

  <text x="580" y="442" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">边界提醒</text>
  <text x="580" y="464" text-anchor="middle" fill="#334155">同组相邻 ≠ 互相直接 import</text>
  <text x="580" y="484" text-anchor="middle" fill="#334155">“静态可依赖” ≠ “本次进程已加载”</text>

  <!-- 箭头 2 -> 3 -->
  <line x1="748" y1="292" x2="780" y2="292" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="764" y="278" text-anchor="middle" font-size="10.5" fill="#2563eb">补丁合成</text>

  <!-- ③ 运行时树 -->
  <rect x="788" y="78" width="336" height="440" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="956" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">③ 运行时树（作用域与清理）</text>
  <text x="956" y="130" text-anchor="middle" fill="#ea580c">Host / Client 树 · 会话隔离 · 副作用回收</text>

  <rect x="836" y="152" width="240" height="54" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="956" y="175" text-anchor="middle" font-weight="700" fill="#9a3412">根 Context + Cordis Loader</text>
  <text x="956" y="195" text-anchor="middle" fill="#c2410c">按合成后的配置行激活插件 Fiber</text>

  <line x1="956" y1="206" x2="956" y2="228" stroke="#475569" stroke-width="1.5"/>
  <line x1="854" y1="228" x2="1058" y2="228" stroke="#475569" stroke-width="1.5"/>
  <line x1="854" y1="228" x2="854" y2="246" stroke="#475569" stroke-width="1.5"/>
  <line x1="956" y1="228" x2="956" y2="246" stroke="#475569" stroke-width="1.5"/>
  <line x1="1058" y1="228" x2="1058" y2="246" stroke="#475569" stroke-width="1.5"/>

  <rect x="808" y="246" width="92" height="72" rx="7" fill="#ffffff" stroke="#fb923c"/>
  <text x="854" y="268" text-anchor="middle" font-weight="700" fill="#9a3412">进程底座</text>
  <text x="854" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2410c">ctx.fs</text>
  <text x="854" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2410c">ctx.llm</text>

  <rect x="910" y="246" width="92" height="72" rx="7" fill="#ffffff" stroke="#fb923c"/>
  <text x="956" y="268" text-anchor="middle" font-weight="700" fill="#9a3412">作用域树</text>
  <text x="956" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2410c">preset</text>
  <text x="956" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2410c">isolate</text>

  <rect x="1012" y="246" width="92" height="72" rx="7" fill="#ffffff" stroke="#fb923c"/>
  <text x="1058" y="268" text-anchor="middle" font-weight="700" fill="#9a3412">Effect 树</text>
  <text x="1058" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2410c">effect()</text>
  <text x="1058" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2410c">ctx.on()</text>

  <line x1="956" y1="318" x2="956" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="816" y="346" width="280" height="60" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="956" y="370" text-anchor="middle" font-weight="700" fill="#9a3412">挂载 · 热重载 · 卸载</text>
  <text x="956" y="392" text-anchor="middle" fill="#c2410c">按 Fiber 树自动撤销注册表与监听副作用</text>

  <text x="956" y="442" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9a3412">权威线索</text>
  <text x="956" y="464" text-anchor="middle" fill="#334155">bundle / profile / preset 补丁链</text>
  <text x="956" y="484" text-anchor="middle" fill="#334155">pnpm dsh --profile web --dump-config</text>

  <!-- 底部总结 -->
  <rect x="36" y="536" width="1088" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">核心认知：磁盘上有目录 ≠ 静态有依赖 ≠ 当前进程已挂载</text>
  <text x="580" y="584" text-anchor="middle" fill="#475569">追任何功能时，依次对齐它的维护目录（①）、抽象接口定义包（②）与实际挂载它的 YAML 配置行（③）。</text>
</svg>
