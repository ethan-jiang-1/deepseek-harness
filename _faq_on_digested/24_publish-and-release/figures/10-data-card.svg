<svg width="960" height="620" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>数据卡：一块事实一张卡</title>
  <desc>左边是空白数据卡的十个字段，右边是“项目评审状态”的填写示例；底部是三条写作纪律。</desc>
  <defs>
    <marker id="arr24card" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="620" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">数据卡：先填这十个问题，再选 API</text>
  <text x="480" y="55" text-anchor="middle" font-size="11" fill="#6b7280">一块事实一张卡；填不完不是格式问题，是承诺还没想清楚。</text>

  <rect x="36" y="80" width="432" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="106" font-size="13" font-weight="700" fill="#334155">空白卡</text>
  <text x="54" y="126" font-size="10" fill="#64748b">按“用户会怎么描述它”写，不按文件/表写。</text>

  <g font-size="10.5">
    <text x="54" y="158" font-weight="700" fill="#475569">1 事实</text><line x1="150" y1="160" x2="446" y2="160" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="190" font-weight="700" fill="#475569">2 谁拥有</text><line x1="150" y1="192" x2="446" y2="192" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="222" font-weight="700" fill="#475569">3 关于谁</text><line x1="150" y1="224" x2="446" y2="224" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="254" font-weight="700" fill="#475569">4 活多久</text><line x1="150" y1="256" x2="446" y2="256" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="286" font-weight="700" fill="#475569">5 谁必须看见</text><line x1="172" y1="288" x2="446" y2="288" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="318" font-weight="700" fill="#475569">6 权威</text><line x1="150" y1="320" x2="446" y2="320" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="350" font-weight="700" fill="#475569">7 落点 / API</text><line x1="176" y1="352" x2="446" y2="352" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="382" font-weight="700" fill="#475569">8 键</text><line x1="150" y1="384" x2="446" y2="384" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="414" font-weight="700" fill="#475569">9 删除 / 保留</text><line x1="176" y1="416" x2="446" y2="416" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="54" y="446" font-weight="700" fill="#475569">10 迁移 / 测试</text><line x1="190" y1="448" x2="446" y2="448" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  </g>
  <text x="54" y="478" font-size="10" fill="#94a3b8">如果第 5、6、9 格答不出，先别写代码。</text>

  <rect x="492" y="80" width="432" height="420" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="510" y="106" font-size="13" font-weight="700" fill="#166534">填好的例子：项目评审状态</text>
  <text x="510" y="126" font-size="10" fill="#15803d">@acme/dsh-review-pack 记录“这个项目评审到哪个提交”。</text>

  <g font-size="10.5">
    <text x="510" y="158" font-weight="700" fill="#166534">1 事实</text><text x="640" y="158" fill="#14532d">项目评审到哪个提交</text>
    <text x="510" y="190" font-weight="700" fill="#166534">2 谁拥有</text><text x="640" y="190" fill="#14532d">项目</text>
    <text x="510" y="222" font-weight="700" fill="#166534">3 关于谁</text><text x="640" y="222" fill="#14532d">这个项目</text>
    <text x="510" y="254" font-weight="700" fill="#166534">4 活多久</text><text x="640" y="254" fill="#14532d">跟项目走</text>
    <text x="510" y="286" font-weight="700" fill="#166534">5 谁看见</text><text x="640" y="286" fill="#14532d">用户可见；模型经工具读</text>
    <text x="510" y="318" font-weight="700" fill="#166534">6 权威</text><text x="640" y="318" fill="#14532d">.acme/review.json</text>
    <text x="510" y="350" font-weight="700" fill="#166534">7 落点</text><text x="640" y="350" fill="#14532d">ctx.fs（项目文件）</text>
    <text x="510" y="382" font-weight="700" fill="#166534">8 键</text><text x="640" y="382" fill="#14532d">项目根 + 固定相对路径</text>
    <text x="510" y="414" font-weight="700" fill="#166534">9 删除</text><text x="640" y="414" fill="#14532d">用户删；卸载不动</text>
    <text x="510" y="446" font-weight="700" fill="#166534">10 迁移</text><text x="640" y="446" fill="#14532d">文件内 version；T5 测试</text>
  </g>
  <text x="510" y="478" font-size="10" fill="#15803d">同一份事实不要再复制进 home 域当真相。</text>

  <rect x="36" y="522" width="888" height="72" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="54" y="548" font-size="12" font-weight="700" fill="#312e81">三条写作纪律</text>
  <text x="54" y="570" font-size="10.5" fill="#4338ca">一个事实一个权威 · 用户内容不搬家（只存路径/哈希） · 模型可见 ⟺ 已记录</text>
  <text x="54" y="588" font-size="10" fill="#6366f1">剩下的只是：选原生能力、定稳定键、写清删除/迁移，然后测试。</text>
</svg>
