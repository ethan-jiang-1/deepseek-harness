<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>把发行版安排进 named profile</title>
  <desc>选模板、bundle 集、默认值、安装器、更新；右侧是不要做的启动方式。</desc>

  <rect width="1200" height="720" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">把发行版安排进 named profile</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">发行版 = 六轴各定一次；不是新可执行文件</text>

  <g>
    <rect x="24" y="88" width="700" height="84" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="116" font-size="12" font-weight="700" fill="#1e40af">① 选模板</text>
    <text x="44" y="140" font-size="9.5" fill="#334155">web / headless / sdk / sdk-minimal / acp；TUI 用自定义 + terminal app bundle</text>
    <text x="44" y="160" font-size="9.5" fill="#64748b">desktop 保留给官方 Electron；发行版不要占用</text>

    <rect x="24" y="188" width="700" height="84" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="216" font-size="12" font-weight="700" fill="#1e40af">② 选 bundle 集</text>
    <text x="44" y="240" font-size="9.5" fill="#334155">base → app bundle → 发行版 bundle；发行版 bundle 在 app 之后</text>
    <text x="44" y="260" font-size="9.5" fill="#64748b">发行版 bundle 自包含、声明 dsh.bundle.patch、engines/peer</text>

    <rect x="24" y="288" width="700" height="84" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="316" font-size="12" font-weight="700" fill="#1e40af">③ 默认值</text>
    <text x="44" y="340" font-size="9.5" fill="#334155">发行版默认值写 bundle patch；首启/用户设置写 profile patch</text>
    <text x="44" y="360" font-size="9.5" fill="#64748b">机器级偏好 home patch；密钥走 env/credentials</text>

    <rect x="24" y="388" width="700" height="84" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="416" font-size="12" font-weight="700" fill="#1e40af">④ 安装器</text>
    <text x="44" y="440" font-size="9.5" fill="#334155">确保 dsh 版本 → 首次建 profile → dsh plugin add → dump → exec dsh</text>
    <text x="44" y="460" font-size="9.5" fill="#64748b">幂等；已有 profile 不重置；不手写 manifest</text>

    <rect x="24" y="488" width="700" height="84" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="44" y="516" font-size="12" font-weight="700" fill="#1e40af">⑤ 更新</text>
    <text x="44" y="540" font-size="9.5" fill="#334155">dsh plugin update / add 新版本；重启 profile；保留旧 exact version</text>
    <text x="44" y="560" font-size="9.5" fill="#64748b">bundle membership 变化必须重启；数据清理单独说明</text>
  </g>

  <path d="M 374 172 L 374 184" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 368 176 L 374 186 L 380 176" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 374 272 L 374 284" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 368 276 L 374 286 L 380 276" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 374 372 L 374 384" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 368 376 L 374 386 L 380 376" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 374 472 L 374 484" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 368 476 L 374 486 L 380 476" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <rect x="752" y="88" width="424" height="232" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="772" y="116" font-size="12" font-weight="700" fill="#991b1b">不要做</text>
  <text x="772" y="142" font-size="9.5" fill="#334155">· 新 bin / node dist/server.js / package bin</text>
  <text x="772" y="166" font-size="9.5" fill="#334155">· 自建第二层 launcher/桌面壳</text>
  <text x="772" y="190" font-size="9.5" fill="#334155">· 发布 profile 目录</text>
  <text x="772" y="214" font-size="9.5" fill="#334155">· 手写 dsh.profile.bundles</text>
  <text x="772" y="238" font-size="9.5" fill="#334155">· base-only profile 期待 Web</text>
  <text x="772" y="262" font-size="9.5" fill="#334155">· config 写成字面值 / wildcard bind</text>
  <text x="772" y="288" font-size="9.5" fill="#64748b">这些都会绕开 named profile 或制造第二写者。</text>

  <rect x="752" y="336" width="424" height="236" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="772" y="364" font-size="12" font-weight="700" fill="#3730a3">发行方只拥有</text>
  <text x="772" y="390" font-size="9.5" fill="#334155">· bundle 与默认值</text>
  <text x="772" y="414" font-size="9.5" fill="#334155">· 安装器、首启、升级说明</text>
  <text x="772" y="438" font-size="9.5" fill="#334155">· 设置页（写 profile patch）</text>
  <text x="772" y="462" font-size="9.5" fill="#334155">· 文档与校验命令</text>
  <text x="772" y="494" font-size="9.5" fill="#64748b">launcher、profile 组合、端口/token、兼容性归 DSH。</text>
  <text x="772" y="518" font-size="9.5" fill="#64748b">更新走 dsh plugin；不要第二套更新器。</text>

  <text x="24" y="620" font-size="9.5" fill="#64748b">C：CLI/app-boot/plugin-manager 合同；T：隔离 home 实验见 90。</text>
  <text x="24" y="640" font-size="9.5" fill="#64748b">流程：模板 → bundle → 默认值 → 安装 → 更新；每一步都能用 dump/boot 验证。</text>
</svg>
