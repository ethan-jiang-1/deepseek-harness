<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>决策：模板 → bundle → 设置 → 启动</title>
  <desc>浏览器、一次性任务、自动化/IDE、ACP、TUI、官方 Desktop、内网/远程七种目标对应的模板、profile 内容、启动方式与风险。</desc>

  <rect width="1200" height="760" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">决策：模板 → bundle → 设置 → 启动</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">只走 named profile；没有第二层 launcher/桌面壳这一行</text>

  <rect x="24" y="84" width="200" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">目标</text>
  <rect x="224" y="84" width="200" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="240" y="105" font-size="11" font-weight="700" fill="#3730a3">模板</text>
  <rect x="424" y="84" width="300" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="440" y="105" font-size="11" font-weight="700" fill="#3730a3">profile 内容</text>
  <rect x="724" y="84" width="240" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="740" y="105" font-size="11" font-weight="700" fill="#3730a3">启动</text>
  <rect x="964" y="84" width="212" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="980" y="105" font-size="11" font-weight="700" fill="#3730a3">风险</text>

  <g>
    <rect x="24" y="120" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="148" font-size="10" font-weight="700" fill="#1e40af">浏览器发行版</text>
    <text x="40" y="168" font-size="9.5" fill="#64748b">Web GUI</text>
    <text x="240" y="148" font-size="9.5" fill="#334155">web</text>
    <text x="240" y="168" font-size="9.5" fill="#64748b">base + web-app</text>
    <text x="440" y="148" font-size="9.5" fill="#334155">base + web-app + 发行版 bundle</text>
    <text x="440" y="168" font-size="9.5" fill="#64748b">发行版默认值在 bundle patch</text>
    <text x="740" y="148" font-size="9.5" fill="#334155">dsh --profile / dsh web</text>
    <text x="740" y="168" font-size="9.5" fill="#64748b">--port/--no-open</text>
    <text x="980" y="148" font-size="9.5" fill="#334155">版本、端口、代理</text>

    <rect x="24" y="200" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="228" font-size="10" font-weight="700" fill="#1e40af">一次性任务</text>
    <text x="40" y="248" font-size="9.5" fill="#64748b">脚本/CI</text>
    <text x="240" y="228" font-size="9.5" fill="#334155">headless</text>
    <text x="240" y="248" font-size="9.5" fill="#64748b">base + headless</text>
    <text x="440" y="228" font-size="9.5" fill="#334155">base + headless + 发行版 bundle</text>
    <text x="440" y="248" font-size="9.5" fill="#64748b">无端口/无 Web</text>
    <text x="740" y="228" font-size="9.5" fill="#334155">dsh --profile "task"</text>
    <text x="740" y="248" font-size="9.5" fill="#64748b">stdout/stderr 0/1</text>
    <text x="980" y="228" font-size="9.5" fill="#334155">一次性生命周期</text>

    <rect x="24" y="280" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="308" font-size="10" font-weight="700" fill="#1e40af">自动化/IDE</text>
    <text x="40" y="328" font-size="9.5" fill="#64748b">程序驱动</text>
    <text x="240" y="308" font-size="9.5" fill="#334155">sdk / sdk-minimal</text>
    <text x="240" y="328" font-size="9.5" fill="#64748b">base + sdk-app</text>
    <text x="440" y="308" font-size="9.5" fill="#334155">base + sdk-app + 发行版 bundle</text>
    <text x="440" y="328" font-size="9.5" fill="#64748b">或 standalone minimal</text>
    <text x="740" y="308" font-size="9.5" fill="#334155">client spawn dsh</text>
    <text x="740" y="328" font-size="9.5" fill="#64748b">stdio JSON-RPC</text>
    <text x="980" y="308" font-size="9.5" fill="#334155">stdio 生命周期</text>

    <rect x="24" y="360" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="388" font-size="10" font-weight="700" fill="#1e40af">ACP 客户端</text>
    <text x="40" y="408" font-size="9.5" fill="#64748b">自动化</text>
    <text x="240" y="388" font-size="9.5" fill="#334155">acp</text>
    <text x="240" y="408" font-size="9.5" fill="#64748b">base + acp-app</text>
    <text x="440" y="388" font-size="9.5" fill="#334155">base + acp-app + 发行版 bundle</text>
    <text x="440" y="408" font-size="9.5" fill="#64748b">权限/会话</text>
    <text x="740" y="388" font-size="9.5" fill="#334155">dsh --profile acp</text>
    <text x="740" y="408" font-size="9.5" fill="#64748b">stdio ACP</text>
    <text x="980" y="388" font-size="9.5" fill="#334155">权限/取消</text>

    <rect x="24" y="440" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="468" font-size="10" font-weight="700" fill="#1e40af">TUI/自定义</text>
    <text x="40" y="488" font-size="9.5" fill="#64748b">终端</text>
    <text x="240" y="468" font-size="9.5" fill="#334155">自定义</text>
    <text x="240" y="488" font-size="9.5" fill="#64748b">不是 shipped</text>
    <text x="440" y="468" font-size="9.5" fill="#334155">自定义 + terminal app bundle</text>
    <text x="440" y="488" font-size="9.5" fill="#64748b">参数由 app 解析</text>
    <text x="740" y="468" font-size="9.5" fill="#334155">dsh --profile &lt;tui&gt;</text>
    <text x="980" y="468" font-size="9.5" fill="#334155">非 shipped 契约</text>

    <rect x="24" y="520" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="548" font-size="10" font-weight="700" fill="#1e40af">官方 Desktop</text>
    <text x="40" y="568" font-size="9.5" fill="#64748b">消费桌面</text>
    <text x="240" y="548" font-size="9.5" fill="#334155">desktop（保留）</text>
    <text x="240" y="568" font-size="9.5" fill="#64748b">Electron 独占</text>
    <text x="440" y="548" font-size="9.5" fill="#334155">内置 dsh + profile</text>
    <text x="440" y="568" font-size="9.5" fill="#64748b">核心包在 asar</text>
    <text x="740" y="548" font-size="9.5" fill="#334155">双击/内置命令</text>
    <text x="980" y="548" font-size="9.5" fill="#334155">不能换版本；CLI 不能 boot</text>

    <rect x="24" y="600" width="1152" height="72" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="628" font-size="10" font-weight="700" fill="#1e40af">内网/远程</text>
    <text x="40" y="648" font-size="9.5" fill="#64748b">托管</text>
    <text x="240" y="628" font-size="9.5" fill="#334155">web + 容器/反代</text>
    <text x="240" y="648" font-size="9.5" fill="#64748b">固定版本</text>
    <text x="440" y="628" font-size="9.5" fill="#334155">base + web-app + 发行版 bundle</text>
    <text x="440" y="648" font-size="9.5" fill="#64748b">具体 IP，不 wildcard</text>
    <text x="740" y="628" font-size="9.5" fill="#334155">反代后的 dsh web</text>
    <text x="740" y="648" font-size="9.5" fill="#64748b">TLS/trusted-host</text>
    <text x="980" y="628" font-size="9.5" fill="#334155">token/公网暴露</text>
  </g>

  <rect x="24" y="692" width="1152" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="712" font-size="10" font-weight="700" fill="#3730a3">默认建议</text>
  <text x="140" y="712" font-size="9.5" fill="#334155">一个 shipped 模板 + base/app/发行版 bundle；默认值在 bundle patch；安装器只创建 profile、装 bundle、exec dsh。</text>
  <text x="44" y="730" font-size="9.5" fill="#64748b">C：CLI/app-boot 合同；T：隔离 home 实验见 90；不要自建 launcher/桌面壳作为主路径。</text>
</svg>
