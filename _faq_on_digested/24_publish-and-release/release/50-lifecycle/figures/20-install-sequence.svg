<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title>安装状态机：五个检查点</title>
  <desc>运行时、profile、bundle、dump、boot 五个检查点；每步的读回证据与典型失败。</desc>

  <rect width="1200" height="700" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">安装状态机：五个检查点</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b">每一步都要有读回；不要用一个 exit code 代表装好了</text>

  <rect x="24" y="84" width="150" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#3730a3">检查点</text>
  <rect x="174" y="84" width="330" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="190" y="105" font-size="11" font-weight="700" fill="#3730a3">做什么</text>
  <rect x="504" y="84" width="330" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="520" y="105" font-size="11" font-weight="700" fill="#3730a3">读回 / 证据</text>
  <rect x="834" y="84" width="342" height="32" rx="6" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="850" y="105" font-size="11" font-weight="700" fill="#3730a3">典型失败</text>

  <g>
    <rect x="24" y="120" width="1152" height="86" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="150" font-size="11" font-weight="700" fill="#1e40af">① 运行时</text>
    <text x="40" y="170" font-size="9.5" fill="#64748b">dsh 从哪来</text>
    <text x="190" y="150" font-size="9.5" fill="#334155">npm 全局 / 官方 Desktop / Python wheel / 源码树</text>
    <text x="190" y="170" font-size="9.5" fill="#64748b">安装或选择，不要混用多副本</text>
    <text x="520" y="150" font-size="9.5" fill="#334155">dsh --version；Desktop 版本</text>
    <text x="520" y="170" font-size="9.5" fill="#64748b">Node/pnpm 是否满足</text>
    <text x="850" y="150" font-size="9.5" fill="#334155">版本不一致、无 Node、PATH 指向旧副本</text>

    <rect x="24" y="214" width="1152" height="86" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="244" font-size="11" font-weight="700" fill="#1e40af">② profile</text>
    <text x="40" y="264" font-size="9.5" fill="#64748b">选模板/初始化</text>
    <text x="190" y="244" font-size="9.5" fill="#334155">shipped 模板（web/headless/sdk/acp）或首次自定义</text>
    <text x="190" y="264" font-size="9.5" fill="#64748b">--from-default-profile 只用于首次/救援</text>
    <text x="520" y="244" font-size="9.5" fill="#334155">profiles/&lt;name&gt;/（manifest + patch + workspace）</text>
    <text x="520" y="264" font-size="9.5" fill="#64748b">bundles 列表、patch 为空</text>
    <text x="850" y="244" font-size="9.5" fill="#334155">自定义名只得到 base；Web 发行版没有 web-app</text>

    <rect x="24" y="308" width="1152" height="86" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="338" font-size="11" font-weight="700" fill="#1e40af">③ bundle</text>
    <text x="40" y="358" font-size="9.5" fill="#64748b">装发行版包</text>
    <text x="190" y="338" font-size="9.5" fill="#334155">dsh plugin --profile &lt;name&gt; add &lt;spec&gt;</text>
    <text x="190" y="358" font-size="9.5" fill="#64748b">本地/registry/git；不手写 manifest</text>
    <text x="520" y="338" font-size="9.5" fill="#334155">dependency 出现；dsh.profile.bundles 含 bundle</text>
    <text x="520" y="358" font-size="9.5" fill="#64748b">有 dsh.bundle.patch 才自动启用</text>
    <text x="850" y="338" font-size="9.5" fill="#334155">engines/peer 不匹配；git 源 build 未允许</text>

    <rect x="24" y="402" width="1152" height="86" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="432" font-size="11" font-weight="700" fill="#1e40af">④ dump</text>
    <text x="40" y="452" font-size="9.5" fill="#64748b">看组合</text>
    <text x="190" y="432" font-size="9.5" fill="#334155">--dump-default-config / --dump-config</text>
    <text x="190" y="452" font-size="9.5" fill="#64748b">需要 schema 时 --dump-config-schema</text>
    <text x="520" y="432" font-size="9.5" fill="#334155">row 来源、overlay 顺序、unmatched target</text>
    <text x="520" y="452" font-size="9.5" fill="#64748b">dump 会初始化缺失 profile</text>
    <text x="850" y="432" font-size="9.5" fill="#334155">组合/解析错误；dump 不接受 app 参数</text>

    <rect x="24" y="496" width="1152" height="86" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="526" font-size="11" font-weight="700" fill="#1e40af">⑤ boot</text>
    <text x="40" y="546" font-size="9.5" fill="#64748b">启动</text>
    <text x="190" y="526" font-size="9.5" fill="#334155">dsh --profile &lt;name&gt; [app-args]</text>
    <text x="190" y="546" font-size="9.5" fill="#64748b">Web 打印 token URL；headless 一次性</text>
    <text x="520" y="526" font-size="9.5" fill="#334155">启动日志、URL、roster、页面/任务</text>
    <text x="520" y="546" font-size="9.5" fill="#64748b">required/skip/诊断日志</text>
    <text x="850" y="526" font-size="9.5" fill="#334155">required plugin 失败；前端未 build；端口占用</text>
  </g>

  <rect x="24" y="604" width="1152" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="626" font-size="10" font-weight="700" fill="#3730a3">四层状态</text>
  <text x="140" y="626" font-size="9.5" fill="#334155">包已安装 / bundle 在 roster / row 存在 / effective enabled·config；每层都要读回。</text>
  <text x="44" y="648" font-size="9.5" fill="#64748b">C：CLI/app-boot/plugin-manager 合同；T：隔离 home 实验见 90。</text>

  <text x="24" y="684" font-size="9.5" fill="#64748b">安装器的责任到 ⑤ 为止：确保运行时、建 profile、装 bundle、dump 校验、exec dsh；不接管 launcher。</text>
</svg>
