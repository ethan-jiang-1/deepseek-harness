<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="940" height="500" fill="#fafafa" rx="6"/>
  <text x="470" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">一份插件 README 的两个读者</text>
  <text x="470" y="51" text-anchor="middle" font-size="11" fill="#6b7280">人读散文，宿主读字段；后者是机械的，没写就是空的</text>

  <text x="24" y="86" font-size="11" font-weight="700" fill="#374151">你写的地方</text>
  <text x="332" y="86" font-size="11" font-weight="700" fill="#374151">谁读它</text>
  <text x="706" y="86" font-size="11" font-weight="700" fill="#374151">不写的后果</text>

  <rect x="24" y="98" width="288" height="44" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="40" y="118" font-size="10.5" font-family="ui-monospace, monospace" fill="#166534">dsh.bundle.patch</text>
  <text x="40" y="134" font-size="9.5" fill="#15803d">贡献哪一层配置</text>

  <rect x="24" y="150" width="288" height="44" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="40" y="170" font-size="10.5" font-family="ui-monospace, monospace" fill="#166534">engines.dsh / dsh peers</text>
  <text x="40" y="186" font-size="9.5" fill="#15803d">支持的 DSH 版本范围</text>

  <rect x="24" y="202" width="288" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="40" y="222" font-size="10.5" font-family="ui-monospace, monospace" fill="#1e40af">package.json.description</text>
  <text x="40" y="238" font-size="9.5" fill="#2563eb">卡片上的一句话</text>

  <rect x="24" y="254" width="288" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="40" y="274" font-size="10.5" font-family="ui-monospace, monospace" fill="#1e40af">导出 locale meta / icon</text>
  <text x="40" y="290" font-size="9.5" fill="#2563eb">标题、描述、图标的本地化</text>

  <rect x="24" y="306" width="288" height="44" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="40" y="326" font-size="10.5" font-family="ui-monospace, monospace" fill="#92400e">Config 的 .volatile()</text>
  <text x="40" y="342" font-size="9.5" fill="#a16207">哪些字段能进设置页</text>

  <rect x="24" y="358" width="288" height="44" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="40" y="378" font-size="10.5" font-family="ui-monospace, monospace" fill="#374151">README 骨架与前置字段</text>
  <text x="40" y="394" font-size="9.5" fill="#6b7280">装 / 验 / 配 / 升 / 卸 / 数据</text>

  <line x1="312" y1="120" x2="330" y2="120" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="312" y1="172" x2="330" y2="172" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="312" y1="224" x2="330" y2="224" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="312" y1="276" x2="330" y2="276" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="312" y1="328" x2="330" y2="328" stroke="#64748b" marker-end="url(#a)"/>
  <line x1="312" y1="380" x2="330" y2="380" stroke="#64748b" marker-end="url(#a)"/>

  <rect x="332" y="98" width="358" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="348" y="118" font-size="10.5" fill="#334155">profile 组合 / Plugins 页</text>
  <text x="348" y="134" font-size="9.5" fill="#64748b">没有这一层，包只是普通依赖</text>

  <rect x="332" y="150" width="358" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="348" y="170" font-size="10.5" fill="#334155">安装前准入 + 启动准入</text>
  <text x="348" y="186" font-size="9.5" fill="#64748b">两处都查，不导入代码就能判定</text>

  <rect x="332" y="202" width="358" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="348" y="222" font-size="10.5" fill="#334155">Plugins 页卡片</text>
  <text x="348" y="238" font-size="9.5" fill="#64748b">列表里的一句话描述</text>

  <rect x="332" y="254" width="358" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="348" y="274" font-size="10.5" fill="#334155">Plugins 页标题与图标</text>
  <text x="348" y="290" font-size="9.5" fill="#64748b">按界面语言切换；子路径插件只认自己的导出</text>

  <rect x="332" y="306" width="358" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="348" y="326" font-size="10.5" fill="#334155">设置表单</text>
  <text x="348" y="342" font-size="9.5" fill="#64748b">按 entry id 寻址，拒绝过期写入</text>

  <rect x="332" y="358" width="358" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="348" y="378" font-size="10.5" fill="#334155">读者本人</text>
  <text x="348" y="394" font-size="9.5" fill="#64748b">决定装不装、装完怎么确认、怎么退</text>

  <text x="706" y="118" font-size="9.5" fill="#b91c1c">不是插件；列表见不到</text>
  <text x="706" y="134" font-size="9.5" fill="#b91c1c">安装以 not-bundle 失败</text>
  <text x="706" y="170" font-size="9.5" fill="#b91c1c">没有约束</text>
  <text x="706" y="186" font-size="9.5" fill="#b91c1c">装完才发现跑不起来</text>
  <text x="706" y="222" font-size="9.5" fill="#b91c1c">卡片没有描述</text>
  <text x="706" y="238" font-size="9.5" fill="#b91c1c">只剩包名</text>
  <text x="706" y="274" font-size="9.5" fill="#b91c1c">不随语言切换</text>
  <text x="706" y="290" font-size="9.5" fill="#b91c1c">用默认图形</text>
  <text x="706" y="326" font-size="9.5" fill="#b91c1c">配置只能改文件</text>
  <text x="706" y="342" font-size="9.5" fill="#b91c1c">设置页里没有它</text>
  <text x="706" y="378" font-size="9.5" fill="#b91c1c">只能读源码</text>
  <text x="706" y="394" font-size="9.5" fill="#b91c1c">或直接不敢装</text>

  <rect x="24" y="424" width="892" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="42" y="446" font-size="10.5" fill="#1e3a8a">判据不是文风，是接口：照 DSH 自家 343 个包的 README 写（description + kind 前置字段，加固定小节），</text>
  <text x="42" y="464" font-size="10.5" fill="#1e3a8a">就被同一批工具接住；自己另造一套，宿主读不到，用户也只能读源码。</text>
</svg>
