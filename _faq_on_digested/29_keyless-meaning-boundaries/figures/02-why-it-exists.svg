<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>为什么把“跑一遍”切开：真实装配、零密钥可跑与结果确定的三难拆解</title>
  <desc>上半对比两条传统单选路径的短板：只跑真模型 API 虽然组装真实，但外部 PR 无密钥会触发跳过，且模型采样有波动；只靠手搭单测与 mock 虽然人人零密钥可跑且结果确定，但脱离真实发布入口（postmortem 0001 中 178 个单测全绿仍崩溃）。下半展示 DSH 将运行拆成有密钥的 record（跑一次入库）与无密钥的 replay（每个 PR 无限次重演真实装配），同时满足三项工程要求，并标明仍需真模型兜底的边界。</desc>
  <defs>
    <marker id="wy-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6d28d9"/>
    </marker>
    <marker id="wy-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">为什么要把“跑一遍”切开：破解测试三难困局</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">测试全插件 Agent 运行时同时想要「真实装配 × 零密钥人人可跑 × 结果确定可比」—— 单选传统路径总有短板</text>

  <text x="40" y="88" font-size="12.5" font-weight="700" fill="#334155">① 单选一条传统路径：各自卡在哪里？</text>

  <!-- Left: Real API only -->
  <rect x="40" y="102" width="544" height="164" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="312" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">方案 A：只跑真模型 API（with-key）</text>

  <rect x="64" y="142" width="152" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="140" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">✓ 真实装配与模型</text>

  <rect x="232" y="142" width="156" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="310" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">✗ 缺 Key 即跳过</text>

  <rect x="404" y="142" width="156" height="30" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="482" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">⚠ 采样有波动</text>

  <text x="64" y="198" font-size="11" fill="#334155">▸ 凭据受安全隔离，无法下发给外部贡献者、fork PR 与无密钥 CI；</text>
  <text x="64" y="220" font-size="11" fill="#991b1b">▸ 一旦触发 self-skip，对外部提交就等于零回归覆盖；</text>
  <text x="64" y="242" font-size="11" fill="#b45309">▸ 在线模型每次采样措辞不完全固定，无法逐字节锁死组装输出。</text>

  <!-- Right: Hand-built mocks only -->
  <rect x="616" y="102" width="544" height="164" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="888" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">方案 B：只靠手搭单测与假桩（mock）</text>

  <rect x="640" y="142" width="156" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="718" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">✗ 脱离真实入口</text>

  <rect x="812" y="142" width="156" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="890" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">✓ 人人零密钥可跑</text>

  <rect x="984" y="142" width="152" height="30" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1060" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">✓ 结果完全确定</text>

  <text x="640" y="198" font-size="11" fill="#334155">▸ 手工 ctx.plugin(...) 假管道绕开了真实发布的 Cordis Loader；</text>
  <text x="640" y="220" font-size="11" fill="#991b1b">▸ 历史真事故（postmortem 0001）：包内 178 个单测全绿、行覆盖率</text>
  <text x="640" y="242" font-size="11" fill="#991b1b">  100%，但真实加载时丢掉 inject 服务声明，Zed 编辑器一连即崩。</text>

  <!-- Divider & Split arrow -->
  <line x1="600" y1="274" x2="600" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#wy-b)"/>
  <text x="616" y="293" font-size="12" font-weight="700" fill="#0f172a">DSH 解法：把一次端到端运行拆成「生产资产」与「消费验证」两半</text>

  <!-- Bottom Split Solution -->
  <rect x="40" y="314" width="484" height="186" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="282" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">前半步：record（with-key · 跑一次入库）</text>
  <text x="64" y="368" font-size="11" fill="#334155">▸ 持密钥维护者启动真实 Profile 连真模型跑通场景；</text>
  <text x="64" y="390" font-size="11" fill="#334155">▸ 将真实模型流与会话事件去噪归一化，提交进 snapshots/；</text>
  <text x="64" y="412" font-size="11" font-weight="700" fill="#5b21b6">▸ 锁住「✓ 真实模型亲口产出的交互轨迹」。</text>
  <rect x="64" y="430" width="436" height="28" rx="6" fill="#6d28d9"/>
  <text x="282" y="449" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">pnpm run test:snapshot:record（需密钥，按需执行）</text>
  <text x="64" y="482" font-size="10.5" fill="#991b1b">注：生产快照资产的 record 本身调了真模型，属于 with-key 而非 keyless。</text>

  <line x1="528" y1="407" x2="628" y2="407" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#wy-a)"/>
  <text x="578" y="394" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">资产入库</text>
  <text x="578" y="426" text-anchor="middle" font-size="10" fill="#64748b">snapshots/</text>

  <rect x="636" y="314" width="524" height="186" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="898" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">后半步：replay（keyless · 无限次重演）</text>
  <text x="660" y="368" font-size="11" fill="#334155">▸ 用当前代码启动真实 headless / sdk / acp / web Profile；</text>
  <text x="660" y="390" font-size="11" fill="#334155">▸ 真插件装配、真沙箱与工具执行，仅模型流由 llm-replay 按序喂回；</text>
  <text x="660" y="412" font-size="11" font-weight="700" fill="#1d4ed8">▸ 同时锁住「✓ 真实装配」＋「✓ 零密钥人人可跑」＋「✓ 逐字节确定可比」。</text>
  <rect x="660" y="430" width="476" height="28" rx="6" fill="#2563eb"/>
  <text x="898" y="449" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">pnpm run test:snapshot（默认只读档，每个 PR 必跑）</text>
  <text x="660" y="482" font-size="10.5" fill="#475569">额外红利：提示词与工具 Schema 固定为仓库文件，任何意外漂移在 PR diff 原形毕露。</text>

  <!-- Summary & Boundary -->
  <rect x="40" y="520" width="1120" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
  <text x="600" y="544" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">三难合解：一次真模型录制入库，摊薄为往后无数次零密钥、全真实装配、100% 确定的端到端回归</text>
  <text x="600" y="564" text-anchor="middle" font-size="10.5" fill="#15803d">外部贡献者无需任何云端凭据，检出仓库即可在本地完整验证四套发布级 Profile</text>

  <rect x="40" y="588" width="1120" height="48" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/>
  <text x="600" y="617" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">诚实边界：replay 证明管道没坏，但「面对真模型能否完成任务 · 新提示词是否更优 · 线上模型升级后是否仍准」必须由 with-key 真跑兜底</text>
</svg>
