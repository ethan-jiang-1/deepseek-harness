<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>录制会话回放机制拆解：用当前代码重演全套链路，而非静态读取旧日志</title>
  <desc>上半对比静态看旧日志（无法验证今天的新代码）与 replay 重演（用当前工作区代码启动真实 dsh Profile、Cordis Loader、工具注册表与沙箱，仅由 dsh-llm-replay 拦截模型调用按序返回历史流）；中半列出回放期间真实执行与核对的五类产物（session.v4.jsonl、system-prompt.expected.md、tool-schemas.expected.json、ui.expected.md/协议流、workspace.expected/）；下半澄清 session log、snapshot、replay 三者的角色与因果关系。</desc>
  <defs>
    <marker id="rp-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="rp-b" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">replay 底层运转拆解：用今天的代码重演，不是静态读录像</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">除了“模型吐出什么流式块”按历史剧本喂回，其余进程、Loader、沙箱、工具执行与落盘全部真刀真枪重跑</text>

  <!-- Top contrast -->
  <rect x="40" y="78" width="536" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="308" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">✗ 常见误解：静态读取上次存下的旧日志</text>
  <rect x="64" y="120" width="488" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="308" y="141" text-anchor="middle" font-size="11" fill="#64748b">历史快照文件 → 静态解析文本 → 根本没有运行今天的工作区代码</text>
  <text x="64" y="176" font-size="11" fill="#475569">▸ 如果真是静态读旧文件，你今天改坏了一行工具派发或插件注入声明，</text>
  <text x="64" y="198" font-size="11" font-weight="700" fill="#334155">  旧日志里压根没有今天的新代码，读一万遍也抓不住任何回归缺陷。</text>

  <rect x="604" y="78" width="556" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="882" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">✓ 真实机制：拿快照当剧本，驱动当前代码全链路重跑</text>
  <rect x="628" y="120" width="508" height="32" rx="6" fill="#ffffff" stroke="#60a5fa"/>
  <text x="882" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">当前代码 → 真 Loader 装配 → dsh-llm-replay 喂流 → 真跑工具 → 比对新日志</text>
  <text x="628" y="176" font-size="11" fill="#1e3a8a">▸ 在隔离临时目录里启动真实 dsh Profile（headless / sdk / acp / web）；</text>
  <text x="628" y="198" font-size="11" font-weight="700" fill="#1e40af">▸ 任何拼装、派发、权限、沙箱或落盘改动都会写进新产物，当场触发逐行比对。</text>

  <!-- Middle: What runs & what gets checked -->
  <rect x="40" y="246" width="1120" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="64" y="274" font-size="13" font-weight="700" fill="#0f172a">一次 dsh-session-snapshot 回放中：替掉哪一格，严格核对哪五份产物？</text>
  <text x="64" y="296" font-size="11" fill="#475569">唯一替换：dsh-llm-replay 拦截模型请求并按会话首次调用顺序推进剧本游标（pre-2xx 断流或挂起由可选的 replay.override.json 注入）；多发未录制请求立即报错。</text>

  <rect x="64" y="314" width="200" height="80" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="164" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">session[.vN].jsonl</text>
  <text x="164" y="358" text-anchor="middle" font-size="10" fill="#475569">核对归一化后的父子会话</text>
  <text x="164" y="376" text-anchor="middle" font-size="10" fill="#475569">完整事件序列与结算状态</text>

  <rect x="278" y="314" width="208" height="80" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="382" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">system-prompt.expected.md</text>
  <text x="382" y="358" text-anchor="middle" font-size="10" fill="#475569">pinsHeader 代表场景锁死</text>
  <text x="382" y="376" text-anchor="middle" font-size="10" fill="#475569">system/message 完整提示词</text>

  <rect x="500" y="314" width="212" height="80" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="606" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">tool-schemas.expected.json</text>
  <text x="606" y="358" text-anchor="middle" font-size="10" fill="#475569">锁死 request/header 里组装</text>
  <text x="606" y="376" text-anchor="middle" font-size="10" fill="#475569">暴露给模型的工具参数定义</text>

  <rect x="726" y="314" width="200" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="826" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">ui.expected.md / 协议流</text>
  <text x="826" y="358" text-anchor="middle" font-size="10" fill="#475569">核对真浏览器渲染 ARIA 树</text>
  <text x="826" y="376" text-anchor="middle" font-size="10" fill="#475569">及 SDK / ACP 标准输出期望</text>

  <rect x="940" y="314" width="196" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1038" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">workspace.expected/</text>
  <text x="1038" y="358" text-anchor="middle" font-size="10" fill="#475569">核对临时工作区最终文件树</text>
  <text x="1038" y="376" text-anchor="middle" font-size="10" fill="#991b1b">record / refresh 绝不覆盖</text>

  <!-- Bottom: 3 concepts & causal direction -->
  <text x="40" y="444" font-size="12.5" font-weight="700" fill="#334155">分清三个概念的角色与因果顺序（正因为日常会话日志本来完备，快照机制才立得住）</text>

  <rect x="40" y="458" width="344" height="122" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="212" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">session log（日常运行产物）</text>
  <text x="212" y="508" text-anchor="middle" font-size="10.5" fill="#334155">得益于 model-visible ⟺ logged 架构铁律，</text>
  <text x="212" y="528" text-anchor="middle" font-size="10.5" fill="#334155">单次运行落盘的 JSONL 已完整包含请求与事件</text>
  <rect x="112" y="544" width="200" height="22" rx="5" fill="#f5f3ff"/>
  <text x="212" y="559" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">角色：单次运行的原始记录</text>

  <line x1="388" y1="519" x2="420" y2="519" stroke="#64748b" stroke-width="2" marker-end="url(#rp-a)"/>

  <rect x="428" y="458" width="344" height="122" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
  <text x="600" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">snapshot（归一化入库夹具）</text>
  <text x="600" y="508" text-anchor="middle" font-size="10.5" fill="#334155">不是另造的新格式——就是剥离 seq/time、替换</text>
  <text x="600" y="528" text-anchor="middle" font-size="10.5" fill="#334155">{{cwd}}、抽离提示词与工具 sidecar 后的日志</text>
  <rect x="500" y="544" width="200" height="22" rx="5" fill="#dcfce7"/>
  <text x="600" y="559" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">角色：跨机器可比的版本化剧本</text>

  <line x1="776" y1="519" x2="808" y2="519" stroke="#2563eb" stroke-width="2" marker-end="url(#rp-b)"/>

  <rect x="816" y="458" width="344" height="122" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="988" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">replay（无密钥重演动作）</text>
  <text x="988" y="508" text-anchor="middle" font-size="10.5" fill="#334155">严校验夹具版本与完整性（拒绝残损夹具），</text>
  <text x="988" y="528" text-anchor="middle" font-size="10.5" fill="#334155">合成确定性时钟，驱动今天的代码重跑并验真</text>
  <rect x="888" y="544" width="200" height="22" rx="5" fill="#dbeafe"/>
  <text x="988" y="559" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">角色：产生今日新证据的执行动作</text>

  <!-- Footer -->
  <rect x="40" y="600" width="1120" height="54" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.6"/>
  <text x="600" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">一句话总结：模型念的那句台词是录制的，但搭台、挂载插件、开沙箱、跑工具的演员全是今天的工作区真代码</text>
  <text x="600" y="644" text-anchor="middle" font-size="10.5" fill="#475569">旧模型流仍有效而期望有意变化时跑 test:snapshot:refresh（keyless）；交互轮次或工具名改变时跑 test:snapshot:record（with-key）</text>
</svg>
