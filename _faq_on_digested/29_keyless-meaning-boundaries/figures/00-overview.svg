<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>keyless 核心机制全貌：唯一判据、反直觉现象、三档流转与证明边界</title>
  <desc>左上说明 keyless 的唯一判据（单次运行未向真实服务商发起网络请求）及主力录制回放做法（只替换模型请求一格）；右上解释四个反直觉现象（哨兵假 Key、refresh 写盘、低档 mock 含金量差异、record 属 with-key）；中间展示 record、snapshot、replay/refresh 的流转关系；底部基于仓库定义（docs/testing.md）划清 keyless 能证明与不能证明的边界。</desc>
  <defs>
    <marker id="ov-a" viewBox="0 0 9 7" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="8" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">keyless 核心机制全貌：一条判据看懂用法与边界</text>
  <text x="600" y="56" text-anchor="middle" fill="#64748b">唯一判据：这一遍测试运行下来，有没有向真实模型（或外部搜索等）服务商发起网络请求</text>

  <!-- Card 1: Core criterion & replay -->
  <rect x="40" y="78" width="548" height="202" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="64" y="106" font-size="13.5" font-weight="700" fill="#1d4ed8">① 包含关系与主力做法（replay ⊂ keyless）</text>
  <text x="64" y="130" font-size="11" fill="#1e3a8a">不发真实服务商请求即为 keyless；其中证据最强的主力是录制会话回放：</text>

  <rect x="64" y="146" width="500" height="36" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="314" y="169" text-anchor="middle" font-size="11" fill="#334155">真跑（with-key）：当前代码 → 真插件装配 → 【真实模型 API】 → 真工具 → 落盘</text>

  <rect x="64" y="192" width="500" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="314" y="215" text-anchor="middle" font-size="11" fill="#1d4ed8">回放（keyless）：当前代码 → 真插件装配 → 【已入库模型流】 → 真工具 → 落盘</text>

  <text x="64" y="256" font-size="10.5" fill="#475569">整条执行链只换掉中间“模型网络请求”一格，Loader、沙箱、工具派发与持久化全部真跑。</text>

  <!-- Card 2: 4 counter-intuitive facts -->
  <rect x="612" y="78" width="548" height="202" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="636" y="106" font-size="13.5" font-weight="700" fill="#0f172a">② 顺着唯一判据，解开四个常见疑惑</text>
  <text x="636" y="134" font-size="11" fill="#334155">▸ 塞了 'keyless-*-no-call' 哨兵假 Key 仍是 keyless：既防缺变量触发</text>
  <text x="636" y="154" font-size="10.5" fill="#64748b">  self-skip 静默跳过，又保证一旦误发线上请求立即因鉴权失败暴露。</text>
  <text x="636" y="180" font-size="11" fill="#334155">▸ test:snapshot:refresh 会改写仓库快照文件，仍是 keyless：全程只消费</text>
  <text x="636" y="200" font-size="10.5" fill="#64748b">  已入库模型流、不读 .env 不联网（keyless 衡量是否联网，不等于只读）。</text>
  <text x="636" y="226" font-size="11" fill="#334155">▸ 手写 mock、loader-smoke、test:expected 也都算 keyless，但证据含金量</text>
  <text x="636" y="246" font-size="10.5" fill="#b91c1c">  低于录制回放；切勿拿低档假桩绿灯宣称“模型交互已验证”。</text>

  <!-- Card 3: 3-stage workflow -->
  <rect x="40" y="298" width="1120" height="170" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="64" y="326" font-size="13.5" font-weight="700" fill="#5b21b6">③ 录制快照三步闭环：生产一次资产（with-key），消费无限次验证（keyless）</text>

  <rect x="64" y="342" width="312" height="108" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="220" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">1. record（生产新剧本）</text>
  <text x="220" y="388" text-anchor="middle" font-size="10.5" fill="#b91c1c" font-weight="700">with-key · 读取 .env 调真模型</text>
  <text x="220" y="408" text-anchor="middle" font-size="10.5" fill="#475569">新增场景或旧模型流对不上时串行录制</text>
  <text x="220" y="430" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#6d28d9">pnpm run test:snapshot:record</text>

  <line x1="380" y1="396" x2="432" y2="396" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#ov-a)"/>

  <rect x="440" y="342" width="312" height="108" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="596" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">2. snapshots/（入库资产）</text>
  <text x="596" y="388" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="700">本质就是去噪归一化后的会话日志</text>
  <text x="596" y="408" text-anchor="middle" font-size="10.5" fill="#475569">剥离时间戳、替换 {{cwd}}、拆出提示词</text>
  <text x="596" y="428" text-anchor="middle" font-size="10.5" fill="#475569">与工具 Schema sidecar 提交进 Git</text>

  <line x1="756" y1="396" x2="808" y2="396" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#ov-a)"/>

  <rect x="816" y="342" width="320" height="108" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="976" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">3. replay / refresh（无密钥重跑）</text>
  <text x="976" y="388" text-anchor="middle" font-size="10.5" fill="#166534" font-weight="700">keyless · 零外部请求 · 用当前代码真跑</text>
  <text x="976" y="408" text-anchor="middle" font-size="10.5" fill="#475569">replay 并发只读守门；refresh 重算期望</text>
  <text x="976" y="430" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#1d4ed8">test:snapshot / test:snapshot:refresh</text>

  <!-- Card 4: Proof boundary -->
  <rect x="40" y="486" width="1120" height="168" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.8"/>
  <text x="64" y="514" font-size="13.5" font-weight="700" fill="#92400e">④ 证明边界 —— 仓库定义（docs/testing.md）：无密钥测试只证管道，真模型运行才证智能体能干活</text>
  <text x="64" y="538" font-size="11" font-family="ui-monospace, monospace" fill="#b45309">"A no-key test proves plumbing; only a with-key run proves the agent works against a real model."</text>

  <rect x="64" y="554" width="528" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="84" y="578" font-size="11.5" font-weight="700" fill="#166534">✅ keyless 足够锁死的问题（管道与契约回归）</text>
  <text x="84" y="600" font-size="10.5" fill="#334155">• 真实 Loader 装配与插件依赖注入是否完好（防 postmortem 0001）</text>
  <text x="84" y="618" font-size="10.5" fill="#334155">• 系统提示词、工具 Schema、沙箱拦截、会话持久化与 Web ARIA 渲染是否漂移</text>

  <rect x="608" y="554" width="528" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="628" y="578" font-size="11.5" font-weight="700" fill="#991b1b">❌ keyless 绝对证不了的问题（必须跑 with-key test:e2e）</text>
  <text x="628" y="600" font-size="10.5" fill="#334155">• 智能体面对真实在线模型能否自主选对工具并把任务干成</text>
  <text x="628" y="618" font-size="10.5" fill="#334155">• 新提示词语义效果是否更好，以及线上模型版本升级后旧提示词是否已失效</text>
</svg>
