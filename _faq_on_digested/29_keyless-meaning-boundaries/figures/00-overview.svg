<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <rect width="1020" height="700" fill="#fafafa" rx="6"/>
  <text x="510" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">keyless 是什么：一页看完</text>
  <text x="510" y="60" text-anchor="middle" font-size="12" fill="#6b7280">四步从零建立概念。不需要先懂任何术语。</text>

  <!-- ① 主力做法 -->
  <rect x="40" y="86" width="458" height="176" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.8"/>
  <text x="60" y="112" font-size="14" font-weight="700" fill="#1d4ed8">① 主力做法：录制回放</text>
  <text x="60" y="136" font-size="12" fill="#1e3a8a">让真模型跑<tspan font-weight="700">一次</tspan>，把它的回答录下来；</text>
  <text x="60" y="156" font-size="12" fill="#1e3a8a">以后每次都放这段录像，其余全部照跑。</text>

  <rect x="60" y="172" width="418" height="34" rx="6" fill="#fff" stroke="#1677ff"/>
  <text x="269" y="194" text-anchor="middle" font-size="11" fill="#4b5563">代码 → 组装请求 → 【<tspan fill="#a8071a" font-weight="700">模型</tspan>】→ 调工具 → 落盘</text>

  <rect x="60" y="214" width="418" height="34" rx="6" fill="#fff" stroke="#1677ff"/>
  <text x="269" y="236" text-anchor="middle" font-size="11" fill="#4b5563">代码 → 组装请求 → 【<tspan fill="#1d4ed8" font-weight="700">录像</tspan>】→ 调工具 → 落盘</text>

  <text x="60" y="264" font-size="10.5" fill="#6b7280">只有中间一格换了，其他一个都没动</text>

  <!-- ② 为什么 -->
  <rect x="522" y="86" width="458" height="176" rx="10" fill="#fff1f0" stroke="#d4380d" stroke-width="1.8"/>
  <text x="542" y="112" font-size="14" font-weight="700" fill="#a8071a">② 为什么非得这样</text>
  <text x="542" y="136" font-size="11.5" fill="#7c2d12">两条路都走不通：</text>
  <text x="542" y="160" font-size="11.5" fill="#7c2d12"><tspan font-weight="700">真调模型</tspan> → 要有 key。外部贡献者、机器人一个都没有</text>
  <text x="542" y="180" font-size="11.5" fill="#7c2d12"><tspan font-weight="700">换成假的</tspan> → 假管道永远不会说真管道错了</text>

  <rect x="542" y="196" width="418" height="52" rx="6" fill="#fff" stroke="#d4380d"/>
  <text x="751" y="216" text-anchor="middle" font-size="11" fill="#a8071a">真实事故：178 个测试全绿 · 覆盖率 100% · 功能全崩</text>
  <text x="751" y="236" text-anchor="middle" font-size="10.5" fill="#9a3412">（postmortem 0001：测试走的是手搭路径，绕开了真实加载）</text>

  <!-- ③ 怎么运转 -->
  <rect x="40" y="278" width="940" height="176" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.8"/>
  <text x="60" y="304" font-size="14" font-weight="700" fill="#531dab">③ 怎么运转：录制一次，验证无限次</text>

  <!-- record -->
  <rect x="60" y="318" width="248" height="118" rx="8" fill="#fff" stroke="#722ed1" stroke-width="1.5"/>
  <text x="184" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#531dab">record</text>
  <text x="184" y="362" text-anchor="middle" font-size="10.5" fill="#6b21a8">真调模型跑一次</text>
  <text x="184" y="382" text-anchor="middle" font-size="10.5" fill="#a8071a" font-weight="700">要 key · 花钱 · 只做一次</text>
  <text x="184" y="406" text-anchor="middle" font-size="10.5" fill="#6b21a8">产出：一份记录</text>
  <text x="184" y="424" text-anchor="middle" font-size="10" fill="#9ca3af">谁做：有 key 的人 / 夜间任务</text>

  <!-- 箭头 -->
  <path d="M316 377 L382 377" stroke="#722ed1" stroke-width="2.5"/>
  <path d="M372 368 L386 377 L372 386" fill="none" stroke="#722ed1" stroke-width="2.5"/>

  <!-- snapshot -->
  <rect x="394" y="318" width="232" height="118" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="510" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#38761c">snapshot</text>
  <text x="510" y="362" text-anchor="middle" font-size="10.5" fill="#4d7c0f">那份记录去噪后提交进仓库</text>
  <text x="510" y="382" text-anchor="middle" font-size="10.5" fill="#166534">它<tspan font-weight="700">就是</tspan>一份 session log</text>
  <text x="510" y="406" text-anchor="middle" font-size="10.5" fill="#4d7c0f">步骤：去噪 · 拆模型流 · 进 git</text>
  <text x="510" y="424" text-anchor="middle" font-size="10" fill="#9ca3af">不是「比日志更多的东西」</text>

  <!-- 箭头 -->
  <path d="M634 377 L700 377" stroke="#722ed1" stroke-width="2.5"/>
  <path d="M690 368 L704 377 L690 386" fill="none" stroke="#722ed1" stroke-width="2.5"/>

  <!-- replay -->
  <rect x="712" y="318" width="248" height="118" rx="8" fill="#fff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="836" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">replay</text>
  <text x="836" y="362" text-anchor="middle" font-size="10.5" fill="#1e40af">拿它当剧本，<tspan font-weight="700">用今天的代码</tspan>重跑</text>
  <text x="836" y="382" text-anchor="middle" font-size="10.5" fill="#38761c" font-weight="700">不要 key · 无限次</text>
  <text x="836" y="406" text-anchor="middle" font-size="10.5" fill="#1e40af">真 profile · 真插件 · 真落盘</text>
  <text x="836" y="424" text-anchor="middle" font-size="10" fill="#9ca3af">谁做：每个提交 PR 的人</text>

  <!-- ④ 边界 -->
  <rect x="40" y="470" width="940" height="130" rx="10" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.8"/>
  <text x="60" y="496" font-size="14" font-weight="700" fill="#ad6800">④ 它到哪为止：只证管道，不证智能体能干活</text>
  <text x="60" y="520" font-size="11.5" fill="#7c2d12">原话（docs/testing.md:25）：<tspan font-family="ui-monospace, monospace" font-size="11">A no-key test proves plumbing; only a with-key run proves the agent works against a real model.</tspan></text>

  <text x="60" y="550" font-size="11.5" fill="#166534" font-weight="700">✅ 它够用：</text>
  <text x="60" y="570" font-size="11.5" fill="#166534">代码有没有搞坏组装 / 派发 / 落盘；模型有没有看到我新加的工具描述</text>

  <text x="60" y="592" font-size="11.5" fill="#a8071a" font-weight="700">❌ 它不够（必须真调）：智能体能不能完成任务 · 新 prompt 是不是更好了 · 模型升级后还准不准</text>

  <!-- 底注 -->
  <rect x="40" y="616" width="940" height="62" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="60" y="640" font-size="12" font-weight="700" fill="#374151">最容易误会的三件事</text>
  <text x="60" y="662" font-size="11.5" fill="#4b5563">① 不是「在底层简化地做」——跑同一个 profile、同一套真插件，只省一次网络请求</text>
  <text x="60" y="678" font-size="11.5" fill="#4b5563">② 不是「看日志」——必须用今天的代码重新执行 ｜ ③ 不是「免费」——record 要花钱花 key，摊到无数次验证上</text>
</svg>
