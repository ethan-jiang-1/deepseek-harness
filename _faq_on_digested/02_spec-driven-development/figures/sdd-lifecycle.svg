<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" letter-spacing="0">
  <title>DSH 推定的 Spec-Driven Development 生命周期</title>
  <desc>从 Issue、proposed Agent Note、Plan Mode、用户审批、实现、证据和门禁到 Review 的主路径。提案可以被拒绝，审批反馈返回 Plan Mode，Review 可以打回实现，成功交付后 Agent Note 改写为 implemented 当前态记录。图中也说明已定决策和机械改动的合法旁路。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="8" fill="#f8fafc"/>
  <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">DSH 推定的 SDD 生命周期</text>
  <text x="600" y="59" text-anchor="middle" fill="#64748b">规格不是单一文档，而是在意图、决策、计划、实现合同与可执行证据之间逐步收敛。</text>

  <text x="30" y="92" font-size="11" font-weight="700" fill="#475569">主路径</text>
  <line x1="170" y1="186" x2="186" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="186" x2="346" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="186" x2="506" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="186" x2="666" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="186" x2="826" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="186" x2="986" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="30" y="110" width="140" height="152" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="52" cy="132" r="12" fill="#2563eb"/>
  <text x="52" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  <text x="100" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Issue</text>
  <text x="100" y="166" text-anchor="middle" font-weight="700" fill="#1d4ed8">意图规格</text>
  <text x="100" y="194" text-anchor="middle" fill="#334155">可观察结果</text>
  <text x="100" y="216" text-anchor="middle" fill="#334155">验收条件</text>
  <text x="100" y="238" text-anchor="middle" fill="#334155">测试证据目标</text>

  <rect x="190" y="110" width="140" height="152" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="212" cy="132" r="12" fill="#c2410c"/>
  <text x="212" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <text x="260" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Proposed</text>
  <text x="260" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Agent Note</text>
  <text x="260" y="178" text-anchor="middle" font-weight="700" fill="#c2410c">决策规格</text>
  <text x="260" y="204" text-anchor="middle" fill="#334155">方案 · 备选</text>
  <text x="260" y="226" text-anchor="middle" fill="#334155">验收 · 风险</text>
  <text x="260" y="248" text-anchor="middle" fill="#334155">重大未来工作</text>

  <rect x="350" y="110" width="140" height="152" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <circle cx="372" cy="132" r="12" fill="#0f766e"/>
  <text x="372" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
  <text x="420" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">Plan Mode</text>
  <text x="420" y="166" text-anchor="middle" font-weight="700" fill="#0f766e">实现规格</text>
  <text x="420" y="194" text-anchor="middle" fill="#334155">只读勘察</text>
  <text x="420" y="216" text-anchor="middle" fill="#334155">decision-complete</text>
  <text x="420" y="238" text-anchor="middle" fill="#334155">边界 · 失败 · 测试</text>

  <rect x="510" y="110" width="140" height="152" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="532" cy="132" r="12" fill="#475569"/>
  <text x="532" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
  <text x="580" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">用户审批</text>
  <text x="580" y="166" text-anchor="middle" font-weight="700" fill="#475569">Plan Review</text>
  <text x="580" y="194" text-anchor="middle" fill="#334155">精确 Approve</text>
  <text x="580" y="216" text-anchor="middle" fill="#334155">才退出模式</text>
  <text x="580" y="238" text-anchor="middle" fill="#334155">批准前不实施</text>

  <rect x="670" y="110" width="140" height="152" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <circle cx="692" cy="132" r="12" fill="#4f46e5"/>
  <text x="692" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>
  <text x="740" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">实现</text>
  <text x="740" y="166" text-anchor="middle" font-weight="700" fill="#4f46e5">当前合同</text>
  <text x="740" y="194" text-anchor="middle" fill="#334155">代码 · 类型 · 配置</text>
  <text x="740" y="216" text-anchor="middle" fill="#334155">事件 · README</text>
  <text x="740" y="238" text-anchor="middle" fill="#334155">JSDoc · 示例</text>

  <rect x="830" y="110" width="140" height="152" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="852" cy="132" r="12" fill="#15803d"/>
  <text x="852" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>
  <text x="900" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Evidence</text>
  <text x="900" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">+ Gates</text>
  <text x="900" y="178" text-anchor="middle" font-weight="700" fill="#15803d">可执行验收</text>
  <text x="900" y="204" text-anchor="middle" fill="#334155">unit · 真实组合</text>
  <text x="900" y="226" text-anchor="middle" fill="#334155">snapshot · invariant</text>
  <text x="900" y="248" text-anchor="middle" fill="#334155">生成检查 · CI</text>

  <rect x="990" y="110" width="140" height="152" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
  <circle cx="1012" cy="132" r="12" fill="#0e7490"/>
  <text x="1012" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text>
  <text x="1060" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">Review</text>
  <text x="1060" y="166" text-anchor="middle" font-weight="700" fill="#0e7490">语义一致性</text>
  <text x="1060" y="194" text-anchor="middle" fill="#334155">对照 Issue / Note</text>
  <text x="1060" y="216" text-anchor="middle" fill="#334155">真实入口 · 负例</text>
  <text x="1060" y="238" text-anchor="middle" fill="#334155">可见 transcript</text>

  <path d="M260 262 L260 326" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="274" y="302" font-size="11" fill="#991b1b">提案被否决</text>
  <rect x="155" y="336" width="210" height="86" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="260" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Rejected Agent Note</text>
  <text x="260" y="384" text-anchor="middle" fill="#7f1d1d">不实施；保留否决理由</text>
  <text x="260" y="405" text-anchor="middle" fill="#7f1d1d">防止重复走向同一错误方案</text>

  <path d="M580 262 L580 326" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="594" y="302" font-size="11" fill="#92400e">反馈或未批准</text>
  <rect x="455" y="336" width="250" height="86" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="580" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">继续规划</text>
  <text x="580" y="384" text-anchor="middle" fill="#78350f">吸收反馈，修订 plan</text>
  <text x="580" y="405" text-anchor="middle" fill="#78350f">再次提交 Plan Review</text>
  <path d="M455 379 C390 379 386 307 420 270" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <path d="M1060 262 L1060 326" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1074" y="302" font-size="11" fill="#166534">符合规格</text>
  <rect x="950" y="336" width="220" height="86" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1060" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Implemented Agent Note</text>
  <text x="1060" y="384" text-anchor="middle" fill="#14532d">Decision · Consequences</text>
  <text x="1060" y="405" text-anchor="middle" fill="#14532d">Verification；保持当前态</text>

  <path d="M1000 262 C935 302 910 484 742 484 C684 484 686 316 738 270" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
  <text x="820" y="506" text-anchor="middle" font-size="11" fill="#92400e">Review 发现偏离 → 修改实现；必要时回到 plan</text>

  <rect x="30" y="535" width="1140" height="60" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="54" y="558" font-size="12" font-weight="700" fill="#334155">合法旁路与限制</text>
  <text x="54" y="580" fill="#475569">已定决策可由实现与 implemented Note 同 PR 交付 · 机械或局部改动可豁免 Agent Note · Plan Mode 是可选 guidance，不是写权限执行器</text>
</svg>
