<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b42318"/></marker>
  </defs>
  <rect width="1000" height="520" rx="6" fill="#fafafa"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Agent Note lifecycle：状态由事实决定，不是固定晋级阶梯</text>
  <text x="500" y="51" text-anchor="middle" font-size="11" fill="#667085">每个非平凡变更要覆盖一个 decision owner；proposal 只属于实现前需要评审的重大工作。</text>

  <rect x="42" y="83" width="200" height="74" rx="8" fill="#edf2f7" stroke="#94a3b8"/>
  <text x="142" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">决定尚未做出？</text>
  <text x="142" y="135" text-anchor="middle" fill="#475569">先判断工作所处事实</text>

  <rect x="320" y="78" width="260" height="98" rx="8" fill="#f7ecda" stroke="#c68b2c"/>
  <text x="450" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#744d0f">proposed</text>
  <text x="450" y="132" text-anchor="middle" fill="#805915">Proposal · Alternatives · Acceptance · Risks</text>
  <text x="450" y="154" text-anchor="middle" font-size="11" fill="#916d32">未构建或只部分构建</text>

  <rect x="700" y="78" width="260" height="98" rx="8" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="830" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#245d35">implemented</text>
  <text x="830" y="132" text-anchor="middle" fill="#326c42">Decision · Alternatives · Consequences</text>
  <text x="830" y="154" text-anchor="middle" font-size="11" fill="#4f775a">shipped rationale owner，随事实保持 current</text>

  <line x1="242" y1="108" x2="316" y2="108" stroke="#475569" marker-end="url(#arr)"/>
  <text x="278" y="97" text-anchor="middle" font-size="11" fill="#667085">需要先评审</text>
  <path d="M142 157 L142 378 L648 378 L648 154 L696 154" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="500" y="373" text-anchor="middle" font-size="11" fill="#667085">决定已做出，直接交付</text>
  <line x1="580" y1="127" x2="696" y2="127" stroke="#15803d" marker-end="url(#arr)"/>
  <text x="638" y="117" text-anchor="middle" font-size="11" fill="#245d35">实现并改写正文</text>

  <rect x="320" y="258" width="260" height="96" rx="8" fill="#fdecec" stroke="#d96c65"/>
  <text x="450" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#8f241d">rejected</text>
  <text x="450" y="312" text-anchor="middle" fill="#9f332b">保留 proposal + 一行拒绝原因</text>
  <text x="450" y="334" text-anchor="middle" font-size="11" fill="#aa514a">仅在仍能阻止可信错误时保留</text>
  <line x1="450" y1="176" x2="450" y2="254" stroke="#b42318" marker-end="url(#arr-red)"/>
  <text x="463" y="220" font-size="11" fill="#8f241d">决定不做</text>

  <rect x="700" y="258" width="260" height="96" rx="8" fill="#ede9f7" stroke="#8b7bb8"/>
  <text x="830" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#554879">archived</text>
  <text x="830" y="312" text-anchor="middle" fill="#665a87">完整 triplet + append-only hash</text>
  <text x="830" y="334" text-anchor="middle" font-size="11" fill="#746894">永久冻结；只作历史引用</text>
  <line x1="830" y1="176" x2="830" y2="254" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="843" y="220" font-size="11" fill="#667085">未来决策价值低</text>

  <rect x="42" y="399" width="918" height="82" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="64" y="425" font-size="12" font-weight="700" fill="#334155">Supersession 发生在活动树内</text>
  <text x="64" y="450" fill="#475569">部分取代：旧 Note 继续活动，双方 cross-link。完整取代：新 owner 先吸收独有 rationale / alternative / consequence / verification，再删除旧 triplet。</text>
  <text x="64" y="470" font-size="11" fill="#667085">禁止路径：proposed → archived；sealed archive → edit / translate / move / delete；只改 Status 而不改 lifecycle skeleton。</text>
</svg>
