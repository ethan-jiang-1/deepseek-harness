<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title id="title">从 outgoing diff 到本地证据、PR CI 与语义 review</title>
  <desc id="desc">展示待推送差异如何路由到聚焦本地证据和普通 push，PR CI 提供远端矩阵，semantic review 检查机械证据之外的语义。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1080" height="640" rx="6" fill="#fafafa"/>
  <text x="540" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">证据路由：先覆盖 outgoing diff，再由 PR CI 承担远端矩阵</text>
  <text x="540" y="51" text-anchor="middle" font-size="11" fill="#667085">检查必须会在目标 regression 上失败；通过一个命令只证明该命令实际验证的属性。</text>

  <rect x="40" y="88" width="210" height="104" rx="8" fill="#edf2f7" stroke="#94a3b8"/>
  <text x="145" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">live outgoing scope</text>
  <text x="145" y="143" text-anchor="middle" fill="#475569">verified base + merge-base</text>
  <text x="145" y="165" text-anchor="middle" font-size="11" fill="#475569">committed / staged / dirty / untracked</text>
  <text x="145" y="184" text-anchor="middle" font-size="11" fill="#64748b">change-scope 不猜 base</text>

  <rect x="310" y="78" width="460" height="240" rx="10" fill="#e8f1fb" stroke="#6b9ac4"/>
  <text x="540" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#244e73">按改动面选择本地相关证据</text>
  <rect x="336" y="129" width="196" height="70" rx="6" fill="#fff" stroke="#8ab0d2"/>
  <text x="434" y="153" text-anchor="middle" font-weight="700" fill="#244e73">package / script behavior</text>
  <text x="434" y="176" text-anchor="middle" font-size="11" fill="#54748f">focused tests + affected coverage include</text>
  <rect x="548" y="129" width="196" height="70" rx="6" fill="#fff" stroke="#8ab0d2"/>
  <text x="646" y="153" text-anchor="middle" font-weight="700" fill="#244e73">docs / Agent Notes</text>
  <text x="646" y="176" text-anchor="middle" font-size="11" fill="#54748f">doc-sync + required lint</text>
  <rect x="336" y="216" width="196" height="70" rx="6" fill="#fff" stroke="#8ab0d2"/>
  <text x="434" y="240" text-anchor="middle" font-weight="700" fill="#244e73">visible output</text>
  <text x="434" y="263" text-anchor="middle" font-size="11" fill="#54748f">keyless snapshot / runnable scenario</text>
  <rect x="548" y="216" width="196" height="70" rx="6" fill="#fff" stroke="#8ab0d2"/>
  <text x="646" y="240" text-anchor="middle" font-weight="700" fill="#244e73">published / real provider</text>
  <text x="646" y="263" text-anchor="middle" font-size="11" fill="#54748f">build smoke / hygiene / credentialed e2e</text>
  <line x1="250" y1="140" x2="306" y2="140" stroke="#475569" marker-end="url(#arr)"/>

  <rect x="830" y="88" width="210" height="104" rx="8" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="935" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#245d35">ordinary push</text>
  <text x="935" y="143" text-anchor="middle" fill="#326c42">selected evidence passed</text>
  <text x="935" y="165" text-anchor="middle" fill="#326c42">pre-push incremental typecheck</text>
  <text x="935" y="184" text-anchor="middle" font-size="11" fill="#4f775a">remote ref = local HEAD</text>
  <line x1="770" y1="140" x2="826" y2="140" stroke="#15803d" marker-end="url(#arrg)"/>

  <line x1="935" y1="192" x2="935" y2="348" stroke="#475569" marker-end="url(#arr)"/>
  <rect x="40" y="352" width="1000" height="190" rx="12" fill="#f5f3ff" stroke="#8b7bb8"/>
  <text x="64" y="381" font-size="13" font-weight="700" fill="#554879">Pull request remote evidence · .github/workflows/ci.yml</text>
  <rect x="70" y="406" width="168" height="76" rx="6" fill="#fff" stroke="#a89bc9"/>
  <text x="154" y="432" text-anchor="middle" font-weight="700" fill="#554879">static</text>
  <text x="154" y="454" text-anchor="middle" font-size="11" fill="#746894">type · lint · docs · hygiene</text>
  <text x="154" y="471" text-anchor="middle" font-size="11" fill="#746894">owned by run-gates</text>
  <rect x="262" y="406" width="168" height="76" rx="6" fill="#fff" stroke="#a89bc9"/>
  <text x="346" y="432" text-anchor="middle" font-weight="700" fill="#554879">coverage</text>
  <text x="346" y="454" text-anchor="middle" font-size="11" fill="#746894">exhaustive per-file 100%</text>
  <text x="346" y="471" text-anchor="middle" font-size="11" fill="#746894">instrumented partitions</text>
  <rect x="454" y="406" width="168" height="76" rx="6" fill="#fff" stroke="#a89bc9"/>
  <text x="538" y="432" text-anchor="middle" font-weight="700" fill="#554879">consumers</text>
  <text x="538" y="454" text-anchor="middle" font-size="11" fill="#746894">build · snapshots · artifacts</text>
  <text x="538" y="471" text-anchor="middle" font-size="11" fill="#746894">real published paths</text>
  <rect x="646" y="406" width="168" height="76" rx="6" fill="#fff" stroke="#a89bc9"/>
  <text x="730" y="432" text-anchor="middle" font-weight="700" fill="#554879">compatibility</text>
  <text x="730" y="454" text-anchor="middle" font-size="11" fill="#746894">Node · Python SDK/runtime</text>
  <text x="730" y="471" text-anchor="middle" font-size="11" fill="#746894">supported engines</text>
  <rect x="838" y="406" width="168" height="76" rx="6" fill="#fff" stroke="#a89bc9"/>
  <text x="922" y="432" text-anchor="middle" font-weight="700" fill="#554879">Windows</text>
  <text x="922" y="454" text-anchor="middle" font-size="11" fill="#746894">native build · tests</text>
  <text x="922" y="471" text-anchor="middle" font-size="11" fill="#746894">required · Wine on master</text>
  <text x="540" y="520" text-anchor="middle" font-size="11" fill="#746894">all checks passed 聚合 required jobs；real API e2e 使用独立 secret-backed workflow。</text>

  <rect x="170" y="575" width="260" height="42" rx="7" fill="#f7ecda" stroke="#c68b2c"/>
  <text x="300" y="601" text-anchor="middle" font-weight="700" fill="#744d0f">semantic review：意图与证据是否匹配</text>
  <rect x="650" y="575" width="260" height="42" rx="7" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="780" y="601" text-anchor="middle" font-size="11" font-weight="700" fill="#245d35">merge：required checks + review state 满足</text>
  <line x1="430" y1="596" x2="646" y2="596" stroke="#15803d" marker-end="url(#arrg)"/>
  <path d="M540 542 L540 596 L434 596" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="540" y="633" text-anchor="middle" font-size="11" fill="#667085">Base 变化或 branch rewrite 会使部分证据失效：重新解析 scope，只重跑受影响的检查。</text>
</svg>
