<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title id="title">Plan guidance、用户审批与权限执行彼此独立</title>
  <desc id="desc">上半部分展示 Plan Mode 日志、guidance、退出工具和用户 review，下半部分展示 sandbox 与 approval 独立执行操作权限。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1040" height="580" rx="6" fill="#fafafa"/>
  <text x="520" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Plan Mode 管协作状态；sandbox 与 approval policy 管操作许可</text>
  <text x="520" y="51" text-anchor="middle" font-size="11" fill="#667085">Prompt guidance 可以影响模型选择，但不会自行拒绝文件、网络或进程操作。</text>

  <rect x="38" y="76" width="964" height="288" rx="12" fill="#f5f3ff" stroke="#8b7bb8"/>
  <text x="62" y="104" font-size="13" font-weight="700" fill="#554879">Plan collaboration plane</text>

  <rect x="66" y="128" width="190" height="80" rx="7" fill="#fff" stroke="#a89bc9"/>
  <text x="161" y="155" text-anchor="middle" font-weight="700" fill="#554879">plan/mode log</text>
  <text x="161" y="178" text-anchor="middle" fill="#665a87">{ active: boolean }</text>
  <text x="161" y="197" text-anchor="middle" font-size="11" fill="#746894">resume / fork / compaction 可 fold</text>

  <rect x="304" y="128" width="190" height="80" rx="7" fill="#fff" stroke="#a89bc9"/>
  <text x="399" y="155" text-anchor="middle" font-weight="700" fill="#554879">plan:policy</text>
  <text x="399" y="178" text-anchor="middle" fill="#665a87">active 时进入模型请求</text>
  <text x="399" y="197" text-anchor="middle" font-size="11" fill="#746894">deployment-owned guidance</text>

  <rect x="542" y="128" width="190" height="80" rx="7" fill="#fff" stroke="#a89bc9"/>
  <text x="637" y="155" text-anchor="middle" font-weight="700" fill="#554879">exit_plan_mode</text>
  <text x="637" y="178" text-anchor="middle" fill="#665a87">完整 Markdown plan</text>
  <text x="637" y="197" text-anchor="middle" font-size="11" fill="#746894">tool schema 始终稳定</text>

  <rect x="780" y="128" width="190" height="80" rx="7" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="875" y="155" text-anchor="middle" font-weight="700" fill="#245d35">plan-review</text>
  <text x="875" y="178" text-anchor="middle" fill="#326c42">Approve / Keep planning</text>
  <text x="875" y="197" text-anchor="middle" font-size="11" fill="#4f775a">用户作出选择</text>

  <line x1="256" y1="168" x2="300" y2="168" stroke="#475569" marker-end="url(#arr)"/>
  <line x1="494" y1="168" x2="538" y2="168" stroke="#475569" marker-end="url(#arr)"/>
  <line x1="732" y1="168" x2="776" y2="168" stroke="#475569" marker-end="url(#arr)"/>

  <rect x="304" y="252" width="428" height="76" rx="7" fill="#fff" stroke="#a89bc9"/>
  <text x="518" y="278" text-anchor="middle" font-weight="700" fill="#554879">批准后：silent pending exit</text>
  <text x="518" y="301" text-anchor="middle" fill="#665a87">下一次 accepted in-turn pre-step 才 append active: false</text>
  <text x="518" y="319" text-anchor="middle" font-size="11" fill="#746894">当前 tool batch 继续使用原 plan guidance</text>
  <path d="M875 208 L875 290 L736 290" fill="none" stroke="#15803d" marker-end="url(#arrg)"/>
  <path d="M304 290 L161 290 L161 212" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <rect x="38" y="400" width="964" height="132" rx="12" fill="#fff7ed" stroke="#d48b45"/>
  <text x="62" y="429" font-size="13" font-weight="700" fill="#7a4313">Operation enforcement plane · 独立配置</text>
  <rect x="76" y="451" width="240" height="55" rx="7" fill="#fff" stroke="#dda66f"/>
  <text x="196" y="474" text-anchor="middle" font-weight="700" fill="#7a4313">模型提出 operation</text>
  <text x="196" y="493" text-anchor="middle" font-size="11" fill="#9a5c25">file · network · process · external state</text>
  <rect x="400" y="451" width="240" height="55" rx="7" fill="#fff" stroke="#dda66f"/>
  <text x="520" y="474" text-anchor="middle" font-weight="700" fill="#7a4313">sandbox policy</text>
  <text x="520" y="493" text-anchor="middle" font-size="11" fill="#9a5c25">文件效果（file effects）是否允许</text>
  <rect x="724" y="451" width="240" height="55" rx="7" fill="#fff" stroke="#dda66f"/>
  <text x="844" y="474" text-anchor="middle" font-weight="700" fill="#7a4313">approval policy</text>
  <text x="844" y="493" text-anchor="middle" font-size="11" fill="#9a5c25">网络/进程等受限操作是否授权</text>
  <line x1="316" y1="478" x2="396" y2="478" stroke="#475569" marker-end="url(#arr)"/>
  <line x1="640" y1="478" x2="720" y2="478" stroke="#475569" marker-end="url(#arr)"/>

  <line x1="520" y1="364" x2="520" y2="396" stroke="#b42318" stroke-dasharray="5 4"/>
  <text x="536" y="386" font-size="11" fill="#8f241d">不读写 plan state</text>
  <text x="520" y="558" text-anchor="middle" font-size="11" fill="#667085">Plan approval 是设计协作；operation approval 是执行授权。两者都可能问用户，但不是同一个状态机。</text>
</svg>
