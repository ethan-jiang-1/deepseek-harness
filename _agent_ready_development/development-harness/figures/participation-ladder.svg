<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">从配置组合到核心 loop，并横切 session 持久化义务的参与阶梯</title>
  <desc id="desc">四级阶梯展示配置组合、扩展点、capability seam 和核心 loop，修改半径与同步义务逐级增加；session 持久化是横切各级的独立义务。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#b45353"/></marker>
  </defs>
  <rect width="1120" height="650" fill="#ffffff"/>
  <text x="560" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">参与阶梯：先选最小可表达入口</text>
  <text x="560" y="64" text-anchor="middle" font-size="12" fill="#5f6b7a">升级不是奖励；它表示现有层级无法表达需求，并带来更大同步范围</text>
  <rect x="172" y="82" width="776" height="28" rx="6" fill="#f7f9fc" stroke="#98a6b8"/>
  <text x="560" y="101" text-anchor="middle" font-size="10" fill="#475569">横切义务：任何层级新增模型可见事实 → SessionEventMap → 从日志投影与重建</text>

  <rect x="72" y="450" width="250" height="126" rx="8" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <text x="96" y="480" font-size="15" font-weight="700" fill="#173f67">L0 · 配置组合</text>
  <text x="96" y="506" font-size="11" fill="#526175">Profile · Bundle · Patch · Preset</text>
  <text x="96" y="530" font-size="11" fill="#39709f">换 provider、参数或会话能力</text>
  <rect x="96" y="546" width="202" height="18" rx="6" fill="#ffffff" stroke="#8bb3d7"/>
  <text x="197" y="559" text-anchor="middle" font-size="9" fill="#244e73">升级：配置无法表达新行为</text>

  <rect x="322" y="342" width="250" height="234" rx="8" fill="#edf8f1" stroke="#55a36f" stroke-width="1.5"/>
  <text x="346" y="372" font-size="15" font-weight="700" fill="#1f6139">L1 · 扩展点</text>
  <text x="346" y="398" font-size="11" fill="#526175">tool · command · prompt section</text>
  <text x="346" y="420" font-size="11" fill="#526175">typed event listener</text>
  <text x="346" y="450" font-size="11" fill="#397a50">新增局部行为或拦截策略</text>
  <rect x="346" y="474" width="202" height="46" rx="7" fill="#ffffff" stroke="#87bd99"/>
  <text x="447" y="493" text-anchor="middle" font-size="9" fill="#245d35">证据：unit · lifecycle</text>
  <text x="447" y="508" text-anchor="middle" font-size="9" fill="#245d35">model-visible snapshot</text>
  <rect x="346" y="538" width="202" height="26" rx="6" fill="#ffffff" stroke="#87bd99"/>
  <text x="447" y="555" text-anchor="middle" font-size="9" fill="#245d35">升级：需要可替换完整能力</text>

  <rect x="572" y="234" width="250" height="342" rx="8" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <text x="596" y="264" font-size="15" font-weight="700" fill="#744408">L2 · Capability seam</text>
  <text x="596" y="290" font-size="11" fill="#526175">Service Definition</text>
  <text x="596" y="312" font-size="11" fill="#526175">Provider · Consumer</text>
  <text x="596" y="342" font-size="11" fill="#805915">新增或替换一项系统能力</text>
  <rect x="596" y="368" width="202" height="68" rx="7" fill="#ffffff" stroke="#d9ad65"/>
  <text x="697" y="389" text-anchor="middle" font-size="9" fill="#744408">证据：三角色完整</text>
  <text x="697" y="405" text-anchor="middle" font-size="9" fill="#744408">真实组合 · provider swap</text>
  <text x="697" y="421" text-anchor="middle" font-size="9" fill="#744408">必要时 SDK / snapshot</text>
  <rect x="596" y="464" width="202" height="46" rx="7" fill="#ffffff" stroke="#d9ad65"/>
  <text x="697" y="483" text-anchor="middle" font-size="9" fill="#744408">设计面向全部 Consumer</text>
  <text x="697" y="498" text-anchor="middle" font-size="9" fill="#744408">不泄漏具体 Provider</text>
  <rect x="596" y="538" width="202" height="26" rx="6" fill="#ffffff" stroke="#d9ad65"/>
  <text x="697" y="555" text-anchor="middle" font-size="9" fill="#744408">升级：无法表达 loop 驱动</text>

  <rect x="822" y="126" width="226" height="450" rx="8" fill="#f3efff" stroke="#8269bd" stroke-width="1.5"/>
  <text x="846" y="156" font-size="15" font-weight="700" fill="#513b85">L3 · Core loop</text>
  <text x="846" y="182" font-size="11" fill="#526175">agent-loop</text>
  <text x="846" y="212" font-size="11" fill="#675293">改变默认循环驱动</text>
  <rect x="846" y="238" width="178" height="88" rx="7" fill="#ffffff" stroke="#a89bc9"/>
  <text x="935" y="260" text-anchor="middle" font-size="9" fill="#513b85">证据：runtime invariant</text>
  <text x="935" y="277" text-anchor="middle" font-size="9" fill="#513b85">双 SDK projection</text>
  <text x="935" y="294" text-anchor="middle" font-size="9" fill="#513b85">keyless snapshots</text>
  <text x="935" y="311" text-anchor="middle" font-size="9" fill="#513b85">architecture 同步</text>
  <rect x="846" y="350" width="178" height="78" rx="7" fill="#ffffff" stroke="#a89bc9"/>
  <text x="935" y="372" text-anchor="middle" font-size="9" fill="#513b85">只处理 loop 驱动变化</text>
  <text x="935" y="390" text-anchor="middle" font-size="9" fill="#513b85">持久事实走横切路径</text>
  <text x="935" y="408" text-anchor="middle" font-size="9" fill="#513b85">不因日志义务直接升级</text>
  <rect x="846" y="468" width="178" height="64" rx="7" fill="#fff0f0" stroke="#c86b6b"/>
  <text x="935" y="491" text-anchor="middle" font-size="9" font-weight="700" fill="#8f3535">最后入口</text>
  <text x="935" y="509" text-anchor="middle" font-size="9" fill="#8f3535">先证明 L0-L2 均不适用</text>

  <path d="M298 440 L338 398" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M548 332 L588 290" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M798 224 L838 182" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M1048 540 H1080 V132" fill="none" stroke="#b45353" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="1092" y="344" text-anchor="middle" font-size="10" fill="#8f3535" transform="rotate(-90 1092 344)">影响半径与同步义务增加</text>
  <text x="560" y="616" text-anchor="middle" font-size="11" fill="#526175">每层都有完整价值；只在当前层无法表达需求时升级</text>
</svg>
