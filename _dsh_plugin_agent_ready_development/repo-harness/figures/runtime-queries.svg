<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">Coding Agent 动态可观测性的四面镜</title>
  <desc id="desc">展示合成配置转储、源码生成目录、只读活状态自省和仅追加事件日志四面镜各自回答的问题与安全边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2f8550"/></marker>
  </defs>
  <rect width="1120" height="630" fill="#ffffff"/>
  <text x="560" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">不要从静态源码硬猜实际运行状态：动态可观测四面镜</text>
  <text x="560" y="64" text-anchor="middle" font-size="12" fill="#5f6b7a">合成配置、全仓声明、活服务树与模型真实可见历史各自拥有只读确定性查询入口</text>

  <rect x="52" y="106" width="310" height="284" rx="8" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <circle cx="88" cy="142" r="17" fill="#276da8"/>
  <text x="88" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="216" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#173f67">合成配置镜</text>
  <text x="216" y="172" text-anchor="middle" font-size="11" fill="#39709f">What will boot?</text>
  <rect x="78" y="200" width="258" height="62" rx="7" fill="#ffffff" stroke="#8bb3d7"/>
  <text x="207" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#244e73">dsh --profile ... --dump-config</text>
  <text x="207" y="247" text-anchor="middle" font-size="10.5" fill="#526175">Profile + Bundle + Patch 合成结果</text>
  <text x="78" y="294" font-size="11" fill="#526175">回答：哪些插件行与最终参数将挂载</text>
  <text x="78" y="320" font-size="11" fill="#526175">适用：启动前排错、覆盖优先级核验</text>
  <rect x="78" y="346" width="258" height="26" rx="6" fill="#dcecff" stroke="#8bb3d7"/>
  <text x="207" y="363" text-anchor="middle" font-size="10" fill="#244e73">不启动进程；不反映运行期动态挂载</text>

  <rect x="405" y="106" width="310" height="284" rx="8" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <circle cx="441" cy="142" r="17" fill="#b66d12"/>
  <text x="441" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="569" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#744408">声明目录镜</text>
  <text x="569" y="172" text-anchor="middle" font-size="11" fill="#805915">What is declared in code?</text>
  <rect x="431" y="200" width="258" height="62" rx="7" fill="#ffffff" stroke="#d9ad65"/>
  <text x="560" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#744408">Generated catalogs</text>
  <text x="560" y="247" text-anchor="middle" font-size="10.5" fill="#526175">tools · config · persistence · module-graph</text>
  <text x="431" y="294" font-size="11" fill="#526175">回答：全仓 Schema、类型签名与依赖关系</text>
  <text x="431" y="320" font-size="11" fill="#526175">适用：一次读取完整注册面，省去全仓 grep</text>
  <rect x="431" y="346" width="258" height="26" rx="6" fill="#ffead0" stroke="#d9ad65"/>
  <text x="560" y="363" text-anchor="middle" font-size="10" fill="#744408">Freshness 保同步；不证明当前已启用</text>

  <rect x="758" y="106" width="310" height="284" rx="8" fill="#edf8f1" stroke="#55a36f" stroke-width="1.5"/>
  <circle cx="794" cy="142" r="17" fill="#2f8550"/>
  <text x="794" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="922" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6139">活状态自省镜</text>
  <text x="922" y="172" text-anchor="middle" font-size="11" fill="#397a50">What is active right now?</text>
  <rect x="784" y="200" width="258" height="62" rx="7" fill="#ffffff" stroke="#87bd99"/>
  <text x="913" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#245d35">cordis_inspect_*</text>
  <text x="913" y="247" text-anchor="middle" font-size="10.5" fill="#526175">list · query（只读自省，无热改写入口）</text>
  <text x="784" y="294" font-size="11" fill="#526175">回答：活 Fiber 树、已就绪 Service 与插件状态</text>
  <text x="784" y="320" font-size="11" fill="#526175">适用：只读核实运行期装配与 PENDING 诊断</text>
  <rect x="784" y="346" width="258" height="26" rx="6" fill="#dff2e5" stroke="#87bd99"/>
  <text x="913" y="363" text-anchor="middle" font-size="10" fill="#245d35">按需 opt-in 暴露；不是安全隔离边界</text>

  <path d="M362 248 H401" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M715 248 H754" stroke="#475569" marker-end="url(#arrow)"/>

  <path d="M207 390 V434 H496" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M560 390 V434" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
  <path d="M913 390 V434 H624" fill="none" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="276" y="438" width="568" height="104" rx="8" fill="#f3efff" stroke="#8269bd" stroke-width="1.5"/>
  <circle cx="312" cy="472" r="17" fill="#6950a4"/>
  <text x="312" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="576" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#513b85">因果事件日志镜：模型实际看到了什么？</text>
  <text x="576" y="501" text-anchor="middle" font-size="11" fill="#526175">Append-only Session JSONL + request/header 确定性折叠投影</text>
  <text x="576" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#675293">model-visible ⟺ logged（无密钥精确回放每一轮模型请求）</text>

  <path d="M560 542 V572" stroke="#2f8550" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="346" y="576" width="428" height="32" rx="7" fill="#edf8f1" stroke="#55a36f"/>
  <text x="560" y="597" text-anchor="middle" font-size="11" fill="#1f6139">每一类动态状态都有确定性只读观测面，把排查从“盲改重试”变成“一次核实”</text>
</svg>
