<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">零历史 Coding Agent 从任务进入仓库反馈回路</title>
  <desc id="desc">六个步骤展示零历史 agent 从读取仓库地图、路由行为 owner、按需加载 Skill、完成原子交付组合、运行聚焦证据到进入远端协作，并把结果沉淀回仓库记忆。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2f8550"/></marker>
  </defs>
  <rect width="1120" height="650" fill="#ffffff"/>
  <text x="540" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">一个零历史 Coding Agent 怎样走完仓库闭环</text>
  <text x="540" y="64" text-anchor="middle" font-size="12" fill="#5f6b7a">每一步都有仓库内权威入口；旧会话聊天记录不是下一轮继续工作的状态载体</text>

  <rect x="396" y="88" width="288" height="58" rx="8" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <text x="540" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#744408">任务输入：可观察行为与验收条件</text>
  <text x="540" y="133" text-anchor="middle" font-size="11" fill="#805915">例：新增一项模型可见能力或修复边界回归</text>
  <path d="M540 146 V176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="36" y="180" width="296" height="116" rx="8" fill="#edf5ff" stroke="#5791c9"/>
  <circle cx="66" cy="210" r="16" fill="#276da8"/>
  <text x="66" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="192" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#173f67">建立最小地图</text>
  <text x="192" y="240" text-anchor="middle" font-size="11" fill="#526175">root / subtree AGENTS.md</text>
  <text x="192" y="261" text-anchor="middle" font-size="11" fill="#526175">architecture · glossary</text>
  <text x="192" y="282" text-anchor="middle" font-size="11" fill="#39709f">秒级定位下一份必读文件</text>

  <rect x="392" y="180" width="296" height="116" rx="8" fill="#f3efff" stroke="#8269bd"/>
  <circle cx="422" cy="210" r="16" fill="#6950a4"/>
  <text x="422" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="548" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#513b85">路由到唯一 Owner</text>
  <text x="548" y="240" text-anchor="middle" font-size="11" fill="#526175">扩展点映射表 · cookbook</text>
  <text x="548" y="261" text-anchor="middle" font-size="11" fill="#526175">README · source · ADR / Note</text>
  <text x="548" y="282" text-anchor="middle" font-size="11" fill="#675293">分清当前事实与历史取舍理由</text>

  <rect x="748" y="180" width="296" height="116" rx="8" fill="#eaf7f6" stroke="#3b9a91"/>
  <circle cx="778" cy="210" r="16" fill="#237a72"/>
  <text x="778" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="904" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5f59">按需加载匹配 Skill</text>
  <text x="904" y="240" text-anchor="middle" font-size="11" fill="#526175">doc · pre-push · code-review</text>
  <text x="904" y="261" text-anchor="middle" font-size="11" fill="#526175">命中任务时展开专门 SOP</text>
  <text x="904" y="282" text-anchor="middle" font-size="11" fill="#2f7770">避免无关规程污染常驻上下文</text>

  <path d="M332 238 H388" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M688 238 H744" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M896 296 V332" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="748" y="336" width="296" height="116" rx="8" fill="#edf8f1" stroke="#55a36f"/>
  <circle cx="778" cy="366" r="16" fill="#2f8550"/>
  <text x="778" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="904" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6139">完成原子交付组合</text>
  <text x="904" y="396" text-anchor="middle" font-size="11" fill="#526175">source · owning docs · tests</text>
  <text x="904" y="417" text-anchor="middle" font-size="11" fill="#526175">snapshot · 决策记录（有持久取舍时）</text>
  <text x="904" y="438" text-anchor="middle" font-size="11" fill="#397a50">同一提交面保持自洽</text>

  <rect x="392" y="336" width="296" height="116" rx="8" fill="#fff5e6" stroke="#d99939"/>
  <circle cx="422" cy="366" r="16" fill="#b66d12"/>
  <text x="422" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="548" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#744408">运行聚焦本地证据</text>
  <text x="548" y="396" text-anchor="middle" font-size="11" fill="#526175">types · lint · 归属单测与负例</text>
  <text x="548" y="417" text-anchor="middle" font-size="11" fill="#526175">真实入口组装冒烟 / 回放</text>
  <text x="548" y="438" text-anchor="middle" font-size="11" fill="#805915">按确定性报错就地闭环</text>

  <rect x="36" y="336" width="296" height="116" rx="8" fill="#f3efff" stroke="#8269bd"/>
  <circle cx="66" cy="366" r="16" fill="#6950a4"/>
  <text x="66" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <text x="192" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#513b85">远端 CI 与语义评审</text>
  <text x="192" y="396" text-anchor="middle" font-size="11" fill="#526175">穷举矩阵 · 打包安装预演</text>
  <text x="192" y="417" text-anchor="middle" font-size="11" fill="#526175">意图对齐与边界语义审查</text>
  <text x="192" y="438" text-anchor="middle" font-size="11" fill="#675293">共享可验证合并状态</text>

  <path d="M748 394 H692" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M392 394 H336" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M184 452 V492" stroke="#2f8550" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="36" y="496" width="1008" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="540" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#27364a">沉淀给下一位零历史 Agent 的仓库记忆</text>
  <rect x="74" y="546" width="284" height="40" rx="7" fill="#edf5ff" stroke="#8bb3d7"/>
  <text x="216" y="571" text-anchor="middle" font-size="11" fill="#244e73">当前行为：source · README · JSDoc</text>
  <rect x="398" y="546" width="284" height="40" rx="7" fill="#fff5e6" stroke="#d99939"/>
  <text x="540" y="571" text-anchor="middle" font-size="11" fill="#744408">取舍理由：ADR / Agent Notes</text>
  <rect x="722" y="546" width="284" height="40" rx="7" fill="#edf8f1" stroke="#55a36f"/>
  <text x="864" y="571" text-anchor="middle" font-size="11" fill="#1f6139">可重复防线：tests · gates · CI</text>
  <path d="M1044 566 H1072 V117 H688" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1094" y="342" text-anchor="middle" font-size="10.5" fill="#64748b" transform="rotate(-90 1094 342)">下一项任务重新从仓库入口开始</text>
</svg>
