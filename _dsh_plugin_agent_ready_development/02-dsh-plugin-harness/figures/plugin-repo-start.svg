<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">新建独立 DSH 插件仓的起步路径</title>
  <desc id="desc">四层路径展示从官方最小插件和真实 profile 组合开始，逐步确定行为 owner、建立真实组合证据、验证打包安装形态，并由插件仓自行决定治理和发布方式。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">新建独立 DSH 插件仓：从能加载到可交付</text>
  <text x="600" y="65" text-anchor="middle" font-size="13" fill="#5f6b7a">运行时接口、仓库结构、发布物和治理规则是四个不同的问题</text>

  <rect x="72" y="115" width="240" height="190" rx="12" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <circle cx="112" cy="155" r="18" fill="#276da8"/><text x="112" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="204" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#173f67">能加载</text>
  <text x="192" y="193" text-anchor="middle" font-size="12" fill="#526175">apply(ctx, config)</text>
  <text x="192" y="216" text-anchor="middle" font-size="12" fill="#526175">cordis.yml + profile</text>
  <text x="192" y="239" text-anchor="middle" font-size="12" fill="#526175">inject / ctx.effect 清退</text>
  <text x="192" y="274" text-anchor="middle" font-size="12" fill="#39709f">真实装配启动零 PENDING</text>

  <path d="M312 210 H340" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="344" y="115" width="240" height="190" rx="12" fill="#f3efff" stroke="#8269bd" stroke-width="1.5"/>
  <circle cx="384" cy="155" r="18" fill="#6950a4"/><text x="384" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="476" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#513b85">有 Owner</text>
  <text x="464" y="193" text-anchor="middle" font-size="12" fill="#526175">AGENTS.md 与 README 契约</text>
  <text x="464" y="216" text-anchor="middle" font-size="12" fill="#526175">插件 / Service / Config</text>
  <text x="464" y="239" text-anchor="middle" font-size="12" fill="#526175">Model Experience 预算</text>
  <text x="464" y="274" text-anchor="middle" font-size="12" fill="#634a99">明确改哪里、证据归谁</text>

  <path d="M584 210 H612" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="616" y="115" width="240" height="190" rx="12" fill="#e8f7f3" stroke="#319795" stroke-width="1.5"/>
  <circle cx="656" cy="155" r="18" fill="#0f766e"/><text x="656" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="748" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#125f5b">可证明</text>
  <text x="736" y="193" text-anchor="middle" font-size="12" fill="#3f5f62">静态门禁 + Loader/HMR 组合</text>
  <text x="736" y="216" text-anchor="middle" font-size="12" fill="#3f5f62">无密钥 ScriptedLlm 回放</text>
  <text x="736" y="239" text-anchor="middle" font-size="12" fill="#3f5f62">独立 workspace.expected/</text>
  <text x="736" y="274" text-anchor="middle" font-size="12" fill="#18766f">目标回归出现必变红</text>

  <path d="M856 210 H884" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="888" y="115" width="240" height="190" rx="12" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <circle cx="928" cy="155" r="18" fill="#b7791f"/><text x="928" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <text x="1020" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#744408">可交付</text>
  <text x="1008" y="193" text-anchor="middle" font-size="12" fill="#665a3e">build / pack / 干净安装</text>
  <text x="1008" y="216" text-anchor="middle" font-size="12" fill="#665a3e">dsh --dump-config + 冒烟</text>
  <text x="1008" y="239" text-anchor="middle" font-size="12" fill="#665a3e">peerDependencies 精确对齐</text>
  <text x="1008" y="274" text-anchor="middle" font-size="12" fill="#8a6d25">真实外部消费者安装成立</text>

  <rect x="72" y="360" width="1056" height="235" rx="12" fill="#fafafa" stroke="#cbd5e1"/>
  <text x="600" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">四个边界：不要把它们混成一件事</text>
  <line x1="108" y1="422" x2="1092" y2="422" stroke="#e2e8f0"/>
  <text x="128" y="458" font-size="13" font-weight="700" fill="#173f67">运行时协议</text>
  <text x="128" y="483" font-size="12" fill="#526175">apply / inject / effects / Loader</text>
  <text x="384" y="458" font-size="13" font-weight="700" fill="#513b85">仓库拓扑</text>
  <text x="384" y="483" font-size="12" fill="#526175">单包、双树全栈或 Seam 多包</text>
  <text x="648" y="458" font-size="13" font-weight="700" fill="#125f5b">发布单元</text>
  <text x="648" y="483" font-size="12" fill="#526175">package、bundle 与宿主 profile 层</text>
  <text x="900" y="458" font-size="13" font-weight="700" fill="#744408">协作治理</text>
  <text x="900" y="483" font-size="12" fill="#526175">Issue、评审、CI 与发版由插件仓自决</text>
  <text x="600" y="542" text-anchor="middle" font-size="13" fill="#64748b">DSH 定义运行时协议与组合面；仓库拓扑、验证门禁和发版流程由独立插件仓自主拥有</text>
  <text x="600" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">能加载 ≠ 有行为证据 ≠ 打包能安装 ≠ 已获交付批准</text>
</svg>
