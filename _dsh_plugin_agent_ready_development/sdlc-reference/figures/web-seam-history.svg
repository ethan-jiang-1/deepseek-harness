<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="475" viewBox="0 0 1080 475" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title id="title">Web seam 记录从 proposal 到现行 Agent Note 的四个 commit</title>
  <desc id="desc">时间线展示 Web seam 从 proposed RFC、实现交付、格式统一到 Agent Note 迁移，并区分 commit tree 能证明与不能证明的事实。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1080" height="475" rx="6" fill="#fafafa"/>
  <text x="540" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Web seam 历史：四个 commit 证明核心交付段，不证明完整协作流程</text>
  <text x="540" y="51" text-anchor="middle" font-size="11" fill="#667085">现行规则从当前 Agent Note 的决定与 gates 读取；历史 commit 只证明其 tree 中可观察到的事实。</text>

  <line x1="118" y1="152" x2="968" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="150" cy="152" r="7.5" fill="#c68b2c"/>
  <circle cx="407" cy="152" r="7.5" fill="#58a36d"/>
  <circle cx="674" cy="152" r="7.5" fill="#8b7bb8"/>
  <circle cx="941" cy="152" r="7.5" fill="#6b9ac4"/>

  <rect x="40" y="72" width="220" height="54" rx="7" fill="#f7ecda" stroke="#c68b2c"/>
  <text x="150" y="95" text-anchor="middle" font-weight="700" fill="#744d0f">2026-06-25 · 提案</text>
  <text x="150" y="115" text-anchor="middle" font-size="11" fill="#916d32">proposed Web RFC</text>
  <line x1="150" y1="126" x2="150" y2="142" stroke="#475569" marker-end="url(#arr)"/>

  <rect x="297" y="176" width="220" height="86" rx="7" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="407" y="199" text-anchor="middle" font-weight="700" fill="#245d35">2026-06-25 · 交付</text>
  <text x="407" y="219" text-anchor="middle" font-size="11" fill="#4f775a">packages/web + tests + READMEs</text>
  <text x="407" y="237" text-anchor="middle" font-size="11" fill="#4f775a">architecture + implemented RFC</text>
  <text x="407" y="253" text-anchor="middle" font-size="10" fill="#4f775a">但正文仍是 Proposal / Migration plan</text>
  <line x1="407" y1="176" x2="407" y2="162" stroke="#475569" marker-end="url(#arr)"/>

  <rect x="564" y="72" width="220" height="54" rx="7" fill="#ede9f7" stroke="#8b7bb8"/>
  <text x="674" y="95" text-anchor="middle" font-weight="700" fill="#554879">2026-07-05 · 格式统一</text>
  <text x="674" y="115" text-anchor="middle" font-size="11" fill="#746894">Decision / Testing / Consequences</text>
  <line x1="674" y1="126" x2="674" y2="142" stroke="#475569" marker-end="url(#arr)"/>

  <rect x="831" y="176" width="220" height="86" rx="7" fill="#e8f1fb" stroke="#6b9ac4"/>
  <text x="941" y="199" text-anchor="middle" font-weight="700" fill="#244e73">2026-07-19 · 迁移</text>
  <text x="941" y="219" text-anchor="middle" font-size="11" fill="#54748f">RFC → Agent Note</text>
  <text x="941" y="237" text-anchor="middle" font-size="11" fill="#54748f">docs/rfc → .agents/notes</text>
  <text x="941" y="253" text-anchor="middle" font-size="10" fill="#54748f">当前 rationale owner 路径形成</text>
  <line x1="941" y1="176" x2="941" y2="162" stroke="#475569" marker-end="url(#arr)"/>

  <rect x="40" y="296" width="482" height="124" rx="9" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="64" y="324" font-size="13" font-weight="700" fill="#245d35">Commit tree 能证明</text>
  <text x="64" y="351" fill="#326c42">✓ 实现前存在 proposal</text>
  <text x="64" y="375" fill="#326c42">✓ 代码、当前文档、tests 与 implemented record 同 commit 交付</text>
  <text x="64" y="399" fill="#326c42">✓ 格式统一与 Agent Note migration 分属后续 commit</text>

  <rect x="558" y="296" width="482" height="124" rx="9" fill="#fdecec" stroke="#d96c65"/>
  <text x="582" y="324" font-size="13" font-weight="700" fill="#8f241d">Commit tree 不能证明</text>
  <text x="582" y="351" fill="#9f332b">× 是否有关联 Issue 或使用 Plan Mode</text>
  <text x="582" y="375" fill="#9f332b">× GitHub review thread、当时的 PR checks 与本地命令</text>
  <text x="582" y="399" fill="#9f332b">× 每一种现行 snapshot / pairing / gate 义务当时已存在</text>

  <text x="540" y="453" text-anchor="middle" font-size="11" fill="#667085">案例覆盖“proposal → delivery bundle → implemented rationale”核心段；本卷 01–12 各页定义现行机制。</text>
</svg>
