<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title id="title">红灯的三种情况</title>
  <desc id="desc">改行为、修 bug、新守卫都要求检查能在目标失误时变红。前两种不必先看见红。新守卫必须亲手造出错误，看检查变红，再把错误撤掉。覆盖率变红常常表示有一行代码该删。</desc>
  <rect width="1120" height="640" rx="6" fill="#fafafa"/>
  <text x="560" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">红灯的三种情况</text>
  <text x="560" y="60" text-anchor="middle" font-size="12" fill="#667085">检查都要能在目标失误出现时变红。要不要先看见那次红，三种情况不同。</text>

  <rect x="32" y="84" width="340" height="380" rx="10" fill="#e8f1fb" stroke="#6b9ac4"/>
  <rect x="108" y="108" width="188" height="32" rx="16" fill="#244e73"/>
  <text x="202" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">不必先看见红</text>
  <text x="202" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#244e73">改行为，或加新行为</text>
  <line x1="64" y1="198" x2="340" y2="198" stroke="#8ab0d2"/>
  <text x="202" y="236" text-anchor="middle" font-size="13" fill="#244e73">同一个 PR 里有一条检查</text>
  <text x="202" y="262" text-anchor="middle" font-size="13" fill="#244e73">行为退回去或做错了</text>
  <text x="202" y="288" text-anchor="middle" font-size="13" fill="#244e73">这条检查会失败</text>
  <text x="202" y="340" text-anchor="middle" font-size="12" fill="#54748f">代码和检查谁先写</text>
  <text x="202" y="362" text-anchor="middle" font-size="12" fill="#54748f">没有成文顺序</text>
  <text x="202" y="420" text-anchor="middle" font-size="12" fill="#54748f">dsh-pre-push-checks</text>

  <rect x="390" y="84" width="340" height="380" rx="10" fill="#e8f5ed" stroke="#58a36d"/>
  <rect x="466" y="108" width="188" height="32" rx="16" fill="#245d35"/>
  <text x="560" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">不必先看见红</text>
  <text x="560" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#245d35">修一个已经出现的 bug</text>
  <line x1="422" y1="198" x2="698" y2="198" stroke="#8fbf9c"/>
  <text x="560" y="236" text-anchor="middle" font-size="13" fill="#245d35">坏行为还在时，检查失败</text>
  <text x="560" y="262" text-anchor="middle" font-size="13" fill="#245d35">修好之后，检查通过</text>
  <text x="560" y="288" text-anchor="middle" font-size="13" fill="#245d35">同样的 bug 再出现，会再红</text>
  <text x="560" y="340" text-anchor="middle" font-size="12" fill="#4f775a">成文标准是</text>
  <text x="560" y="362" text-anchor="middle" font-size="12" fill="#4f775a">会为这次回归失败</text>
  <text x="560" y="420" text-anchor="middle" font-size="12" fill="#4f775a">没有「改之前必须先盯红灯」</text>

  <rect x="748" y="84" width="340" height="380" rx="10" fill="#fbf3e4" stroke="#c4a36b"/>
  <rect x="812" y="108" width="212" height="32" rx="16" fill="#9a3412"/>
  <text x="918" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">必须看见这一次红</text>
  <text x="918" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4e24">新加一条自动守卫</text>
  <line x1="780" y1="198" x2="1056" y2="198" stroke="#d4bc90"/>
  <text x="918" y="236" text-anchor="middle" font-size="13" fill="#6b4e24">亲手造出那个错误</text>
  <text x="918" y="262" text-anchor="middle" font-size="13" fill="#6b4e24">看检查变红</text>
  <text x="918" y="288" text-anchor="middle" font-size="13" fill="#6b4e24">再把错误撤掉</text>
  <text x="918" y="340" text-anchor="middle" font-size="12" fill="#8a6840">否则不知道这条守卫</text>
  <text x="918" y="362" text-anchor="middle" font-size="12" fill="#8a6840">是不是永远绿</text>
  <text x="918" y="420" text-anchor="middle" font-size="12" fill="#8a6840">introduce the regression, watch red, revert</text>

  <rect x="32" y="484" width="1056" height="124" rx="8" fill="#172033"/>
  <text x="560" y="528" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">覆盖率变红是另一种信号</text>
  <text x="560" y="556" text-anchor="middle" font-size="13" fill="#cbd5e1">没跑到的行经常是该死的代码，先看要不要删，不是先补一条测试。</text>
  <text x="560" y="580" text-anchor="middle" font-size="13" fill="#cbd5e1">任何一种绿都只说明已经跑过的检查通过了。</text>
</svg>
