<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">Plugin、bundle 与 profile 的三层关系</title>
  <desc id="desc">独立插件仓里的 TypeScript plugin 由 bundle manifest 引用并分发，profile manifest 再组合 bundle，DSH loader 启动最终 profile；三者不是同一个结构。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">Plugin → Bundle → Profile：三个不同层次</text>
  <text x="600" y="65" text-anchor="middle" font-size="13" fill="#5f6b7a">运行时模块、分发配置层和可启动组合不能互相推导</text>

  <rect x="55" y="110" width="300" height="260" rx="12" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <text x="205" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#173f67">Plugin module</text>
  <text x="205" y="175" text-anchor="middle" font-size="12" fill="#39709f">独立仓源码 / 构建产物</text>
  <rect x="95" y="205" width="220" height="110" rx="8" fill="#ffffff" stroke="#91b9dc"/>
  <text x="205" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#173f67">apply(ctx)</text>
  <text x="205" y="263" text-anchor="middle" font-size="12" fill="#526175">inject / events / tools</text>
  <text x="205" y="287" text-anchor="middle" font-size="12" fill="#526175">effects / disposer</text>

  <path d="M355 240 H415" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="385" y="220" text-anchor="middle" font-size="11" fill="#64748b">引用</text>

  <rect x="415" y="110" width="300" height="260" rx="12" fill="#f3efff" stroke="#8269bd" stroke-width="1.5"/>
  <text x="565" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#513b85">Bundle</text>
  <text x="565" y="175" text-anchor="middle" font-size="12" fill="#634a99">npm package + dsh.bundle</text>
  <rect x="455" y="205" width="220" height="110" rx="8" fill="#ffffff" stroke="#a99ad1"/>
  <text x="565" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#513b85">package.json</text>
  <text x="565" y="263" text-anchor="middle" font-size="12" fill="#634a99">cordis.patch.yml</text>
  <text x="565" y="287" text-anchor="middle" font-size="12" fill="#634a99">贡献 configuration layer</text>

  <path d="M715 240 H775" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="745" y="220" text-anchor="middle" font-size="11" fill="#64748b">组合</text>

  <rect x="775" y="110" width="300" height="260" rx="12" fill="#e8f7f3" stroke="#319795" stroke-width="1.5"/>
  <text x="925" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#125f5b">Profile</text>
  <text x="925" y="175" text-anchor="middle" font-size="12" fill="#18766f">用户可启动的 composition</text>
  <rect x="815" y="205" width="220" height="110" rx="8" fill="#ffffff" stroke="#7fc7bd"/>
  <text x="925" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#125f5b">dsh.profile</text>
  <text x="925" y="263" text-anchor="middle" font-size="12" fill="#3f5f62">ordered bundles</text>
  <text x="925" y="287" text-anchor="middle" font-size="12" fill="#3f5f62">user patch layer</text>

  <path d="M925 370 V425" fill="none" stroke="#0f766e" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="415" y="425" width="370" height="78" rx="11" fill="#fff8e8" stroke="#d6a636" stroke-width="1.5"/>
  <text x="600" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#76530a">DSH Loader / app</text>
  <text x="600" y="480" text-anchor="middle" font-size="12" fill="#665a3e">boot profile → load bundle layer → apply plugin</text>

  <text x="600" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#8b3030">注意：scratch 例子、DSH packages/ 拓扑或 bundle 形态都不是独立插件仓唯一模板</text>
</svg>
