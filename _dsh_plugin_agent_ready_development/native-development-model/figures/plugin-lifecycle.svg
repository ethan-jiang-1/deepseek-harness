<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">DSH 插件生命周期与资源清理</title>
  <desc id="desc">从 Loader 加载插件开始，经过依赖注入、注册能力和运行阶段，最后在卸载或 HMR 时通过 effect disposer 清理资源。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#475569"/></marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">插件先按生命周期构造，再添加能力</text>
  <text x="600" y="65" text-anchor="middle" font-size="13" fill="#5f6b7a">Loader 保证依赖准备；plugin effect 拥有注册和资源的清理路径</text>

  <rect x="55" y="125" width="190" height="130" rx="11" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <text x="150" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#173f67">Loader 加载</text>
  <text x="150" y="190" text-anchor="middle" font-size="12" fill="#526175">cordis.yml / profile</text>
  <text x="150" y="214" text-anchor="middle" font-size="12" fill="#39709f">找到 plugin module</text>

  <path d="M245 190 H285" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="285" y="125" width="190" height="130" rx="11" fill="#f3efff" stroke="#8269bd" stroke-width="1.5"/>
  <text x="380" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#513b85">依赖注入</text>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#526175">inject 声明</text>
  <text x="380" y="214" text-anchor="middle" font-size="12" fill="#634a99">所需 service 已准备</text>

  <path d="M475 190 H515" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="515" y="125" width="190" height="130" rx="11" fill="#e8f7f3" stroke="#319795" stroke-width="1.5"/>
  <text x="610" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#125f5b">apply(ctx)</text>
  <text x="610" y="190" text-anchor="middle" font-size="12" fill="#3f5f62">注册 tools / events</text>
  <text x="610" y="214" text-anchor="middle" font-size="12" fill="#18766f">ctx.effect() 绑定 disposer</text>

  <path d="M705 190 H745" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="745" y="125" width="190" height="130" rx="11" fill="#fff8e8" stroke="#d6a636" stroke-width="1.5"/>
  <text x="840" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#76530a">运行</text>
  <text x="840" y="190" text-anchor="middle" font-size="12" fill="#665a3e">用户请求 / event</text>
  <text x="840" y="214" text-anchor="middle" font-size="12" fill="#8a6d25">行为证据观察这里</text>

  <path d="M935 190 H975" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="975" y="125" width="170" height="130" rx="11" fill="#fff0f0" stroke="#d26a6a" stroke-width="1.5"/>
  <text x="1060" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#8b3030">卸载 / HMR</text>
  <text x="1060" y="190" text-anchor="middle" font-size="12" fill="#6d4d4d">自动撤销注册</text>
  <text x="1060" y="214" text-anchor="middle" font-size="12" fill="#9b4545">执行 disposer</text>

  <path d="M1060 255 V360 H610 V405" fill="none" stroke="#0f766e" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/>

  <rect x="370" y="405" width="480" height="120" rx="12" fill="#f0fdfa" stroke="#2c9c91" stroke-width="1.5"/>
  <text x="610" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#125f5b">资源所有权随生命周期闭合</text>
  <text x="610" y="468" text-anchor="middle" font-size="12" fill="#3f5f62">监听器、工具、定时器和连接不能只创建不清理</text>
  <text x="610" y="493" text-anchor="middle" font-size="12" fill="#18766f">register / effect 的 owner 也拥有 teardown 责任</text>

  <text x="600" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#8b3030">注意：先确认 documented extension point，再决定是否需要 host 或 agent-loop 变更</text>
</svg>
