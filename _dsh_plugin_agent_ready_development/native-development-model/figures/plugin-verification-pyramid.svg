<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">独立 DSH 插件仓的四级可执行验证阶梯</title>
  <desc id="desc">自上而下展示静态契约门禁、真实 Loader 与热重载测试、无密钥脚本化会话回放加独立外部世界校验、以及干净消费者打包安装预演四级门禁。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1120" height="690" fill="#ffffff"/>
  <text x="560" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">独立 DSH 插件仓：四级无密钥可执行验证阶梯</text>
  <text x="560" y="61" text-anchor="middle" font-size="12" fill="#5f6b7a">不需要 DEEPSEEK_API_KEY 即可在本地与每次 PR CI 跑完完整契约闭环；真模型冒烟作为可选第五层按需触发</text>

  <line x1="82" y1="132" x2="82" y2="546" stroke="#94a3b8" stroke-width="2"/>

  <rect x="124" y="88" width="952" height="106" rx="10" fill="#edf5ff" stroke="#5791c9" stroke-width="1.5"/>
  <circle cx="82" cy="141" r="19" fill="#276da8"/>
  <text x="82" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L1</text>
  <text x="150" y="118" font-size="15.5" font-weight="700" fill="#173f67">静态契约门禁 · node scripts/verify-plugin.mjs（&lt; 1s）</text>
  <text x="150" y="144" font-size="12" fill="#334155">核验对象：peerDependencies 范围 · exports 真文件存在 · 禁全局单例/裸定时器/as unknown · README Model Experience 节</text>
  <text x="150" y="169" font-size="11.5" fill="#244e73">防作弊底线：新增门禁规则必须亲手造一处违规看红灯（Prove-Red），再撤回违规代码</text>

  <rect x="124" y="212" width="952" height="106" rx="10" fill="#f3efff" stroke="#8269bd" stroke-width="1.5"/>
  <circle cx="82" cy="265" r="19" fill="#6950a4"/>
  <text x="82" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L2</text>
  <text x="150" y="242" font-size="15.5" font-weight="700" fill="#513b85">真实 Loader 装配与热重载测试 · loader-composition.spec.ts（1–3s）</text>
  <text x="150" y="268" font-size="12" fill="#334155">核验对象：真实 Loader 读取仓库 cordis.yml 启动 · 遍历 Fiber 树断言零 FiberState.PENDING · 连续卸载重载两次</text>
  <text x="150" y="293" font-size="11.5" fill="#513b85">防作弊底线：禁止只手写 ctx.plugin(MyPlugin) 绕过 YAML 解析、inject 依赖顺序与 dispose 静默排空</text>

  <rect x="124" y="336" width="952" height="106" rx="10" fill="#edf8f1" stroke="#55a36f" stroke-width="1.5"/>
  <circle cx="82" cy="389" r="19" fill="#2f8550"/>
  <text x="82" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L3</text>
  <text x="150" y="366" font-size="15.5" font-weight="700" fill="#1f6139">无密钥脚本化会话回放与外部世界校验 · session-replay.spec.ts（2–5s）</text>
  <text x="150" y="392" font-size="12" fill="#334155">核验对象：真 AgentLoop + 真 SessionStore + 唯一替身 ScriptedLlmAdapter · 校验会话事件链与工具输出截断</text>
  <text x="150" y="417" font-size="11.5" fill="#1f6139">防作弊底线：不信模型自报“修改成功”；重读磁盘字节对比独立预言机 workspace.expected/</text>

  <rect x="124" y="460" width="952" height="106" rx="10" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <circle cx="82" cy="513" r="19" fill="#b66d12"/>
  <text x="82" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L4</text>
  <text x="150" y="490" font-size="15.5" font-weight="700" fill="#744408">干净消费者打包安装预演 · npm pack + 临时目录真实安装冒烟（5–15s）</text>
  <text x="150" y="516" font-size="12" fill="#334155">核验对象：每个 PR 无凭据打真 tarball 装入隔离目录 · 实测外部 import() 入口与 dsh --dump-config 合成通过</text>
  <text x="150" y="541" font-size="11.5" fill="#744408">防作弊底线：把漏发 files、残缺 .d.ts 与幽灵依赖挡在合并前；正式 publish 仅限 tag 人工触发</text>

  <rect x="44" y="590" width="1032" height="72" rx="9" fill="#172033"/>
  <text x="560" y="618" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f8fafc">可选第五层（With-Key Smoke）：有 DEEPSEEK_API_KEY 时驱动真实模型端到端冒烟，无密钥时显式 self-skip</text>
  <text x="560" y="643" text-anchor="middle" font-size="11.5" fill="#cbd5e1">本地开发按改动面挑最窄层级快速闭环；PR CI 跑满 L1–L4 全量门禁 + 100% 增量覆盖率，任何一层绿灯不跨层替代</text>
</svg>
