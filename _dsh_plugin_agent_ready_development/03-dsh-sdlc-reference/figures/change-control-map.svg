<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <title id="title">条件入口、共享交付核心与远端协作状态</title>
  <desc id="desc">Issue、proposed Note 与 Plan Mode 是条件入口，源码、文档、证据和 owning Note 组成共享交付核心；交付后的决定由 implemented Note 记录，再进入 PR、review、merge 与 archive 条件。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="1120" height="710" rx="6" fill="#fafafa"/>
  <text x="560" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">一次变更：三个条件入口汇入同一个交付核心</text>
  <text x="560" y="51" text-anchor="middle" font-size="11" fill="#667085">条件入口各有适用范围；承载持久决定理由的变更必须有 owning Agent Note（机械/局部编辑豁免）。</text>

  <text x="52" y="91" font-size="12" font-weight="700" fill="#475569">条件入口</text>
  <rect x="52" y="108" width="300" height="112" rx="8" fill="#e8f1fb" stroke="#6b9ac4"/>
  <text x="202" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#244e73">Issue / task context</text>
  <text x="202" y="162" text-anchor="middle" fill="#355f82">外部结果 · 复现 · 交付物</text>
  <text x="202" y="184" text-anchor="middle" font-size="11" fill="#54748f">human-authored PR 进入 review policy 时强制引用</text>
  <text x="202" y="203" text-anchor="middle" font-size="11" fill="#54748f">否则按协作需要出现</text>

  <rect x="410" y="108" width="300" height="112" rx="8" fill="#f7ecda" stroke="#c68b2c"/>
  <text x="560" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#744d0f">proposed Agent Note</text>
  <text x="560" y="162" text-anchor="middle" fill="#805915">问题 · 提案 · alternatives · 验收 · 风险</text>
  <text x="560" y="184" text-anchor="middle" font-size="11" fill="#916d32">重大未来工作在实现前需要评审时出现</text>
  <text x="560" y="203" text-anchor="middle" font-size="11" fill="#916d32">已做出的决定可直接从 implemented 开始</text>

  <rect x="768" y="108" width="300" height="112" rx="8" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="918" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#245d35">Plan Mode</text>
  <text x="918" y="162" text-anchor="middle" fill="#326c42">只读探索 · decision-complete plan · 用户审批</text>
  <text x="918" y="184" text-anchor="middle" font-size="11" fill="#4f775a">部署启用且用户选择规划时出现</text>
  <text x="918" y="203" text-anchor="middle" font-size="11" fill="#4f775a">sandbox / approval policy 独立执行权限</text>

  <line x1="202" y1="220" x2="384" y2="270" stroke="#64748b" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="560" y1="220" x2="560" y2="268" stroke="#64748b" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="918" y1="220" x2="736" y2="270" stroke="#64748b" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="84" y="272" width="952" height="184" rx="12" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="560" y="301" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">共享交付核心 · 同一变更保持一致</text>
  <rect x="108" y="322" width="208" height="106" rx="7" fill="#edf2f7" stroke="#94a3b8"/>
  <text x="212" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">实现</text>
  <text x="212" y="375" text-anchor="middle" fill="#475569">source · types · config</text>
  <text x="212" y="398" text-anchor="middle" font-size="11" fill="#64748b">实际改变系统</text>

  <rect x="340" y="322" width="208" height="106" rx="7" fill="#e8f1fb" stroke="#6b9ac4"/>
  <text x="444" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#244e73">当前接口与行为</text>
  <text x="444" y="375" text-anchor="middle" fill="#355f82">docs · README · JSDoc</text>
  <text x="444" y="398" text-anchor="middle" font-size="11" fill="#54748f">只写 shipped state</text>

  <rect x="572" y="322" width="208" height="106" rx="7" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="676" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#245d35">行为证据</text>
  <text x="676" y="375" text-anchor="middle" font-size="11" fill="#326c42">tests · snapshots · Loader 组合</text>
  <text x="676" y="398" text-anchor="middle" font-size="11" fill="#4f775a">正例、负例与真实入口</text>

  <rect x="804" y="322" width="208" height="106" rx="7" fill="#f7ecda" stroke="#c68b2c"/>
  <text x="908" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#744d0f">owning Agent Note</text>
  <text x="908" y="375" text-anchor="middle" fill="#805915">decision · alternatives</text>
  <text x="908" y="398" text-anchor="middle" font-size="11" fill="#916d32">持久决定理由变更必须覆盖</text>

  <line x1="316" y1="375" x2="336" y2="375" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="548" y1="375" x2="568" y2="375" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="780" y1="375" x2="800" y2="375" stroke="#475569" marker-end="url(#arrow)"/>

  <line x1="560" y1="456" x2="560" y2="495" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="52" y="498" width="976" height="126" rx="12" fill="#f5f3ff" stroke="#8b7bb8"/>
  <text x="78" y="524" font-size="12" font-weight="700" fill="#554879">本地证据与 .github/ 远端协作</text>
  <rect x="78" y="540" width="212" height="62" rx="7" fill="#fff" stroke="#a89bc9"/>
  <text x="184" y="565" text-anchor="middle" font-weight="700" fill="#554879">本地相关证据</text>
  <text x="184" y="586" text-anchor="middle" font-size="11" fill="#746894">按 outgoing diff 选择</text>
  <rect x="316" y="540" width="212" height="62" rx="7" fill="#fff" stroke="#a89bc9"/>
  <text x="422" y="565" text-anchor="middle" font-weight="700" fill="#554879">PR policy + CI</text>
  <text x="422" y="586" text-anchor="middle" font-size="11" fill="#746894">metadata · matrix · platforms</text>
  <rect x="554" y="540" width="212" height="62" rx="7" fill="#fff" stroke="#a89bc9"/>
  <text x="660" y="565" text-anchor="middle" font-weight="700" fill="#554879">语义 review</text>
  <text x="660" y="586" text-anchor="middle" font-size="11" fill="#746894">意图 · owner · failure · prose</text>
  <rect x="792" y="540" width="212" height="62" rx="7" fill="#e8f5ed" stroke="#58a36d"/>
  <text x="898" y="565" text-anchor="middle" font-weight="700" fill="#245d35">merge / delivery state</text>
  <text x="898" y="586" text-anchor="middle" font-size="11" fill="#4f775a">checks 与 review 均满足</text>
  <line x1="290" y1="571" x2="312" y2="571" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="528" y1="571" x2="550" y2="571" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="766" y1="571" x2="788" y2="571" stroke="#15803d" marker-end="url(#arrow-green)"/>

  <path d="M908 428 L908 476 L1060 476 L1060 652 L858 652" fill="none" stroke="#c68b2c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="984" y="470" text-anchor="middle" font-size="10.5" fill="#805915">未来决策价值变低时</text>
  <rect x="536" y="638" width="316" height="28" rx="6" fill="#f7ecda" stroke="#c68b2c"/>
  <text x="694" y="656" text-anchor="middle" font-size="11" fill="#744d0f">archived/（冻结历史，不是每次 merge 的步骤）</text>
  <text x="560" y="692" text-anchor="middle" font-size="11" fill="#667085">每层只证明自己实际检查的属性；任何一层都不能替代其它 owner。</text>
</svg>
