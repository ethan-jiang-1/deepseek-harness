<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="monospace" font-size="11">
  <rect width="960" height="400" fill="#fafafa" rx="4"/>
  <text x="480" y="20" text-anchor="middle" font-weight="700" font-size="14">Boot Sequence: RunProfile -> Boot()</text>

  <!-- 阶段 1 -->
  <rect x="20" y="40" width="280" height="340" fill="#f0fdf4" stroke="#22c55e" rx="4"/>
  <text x="30" y="60" font-weight="700" fill="#166534">1. prepareProfile</text>
  <text x="30" y="80" fill="#15803d">Target: profiles/&lt;name&gt;/cordis.yml</text>
  <text x="30" y="100" fill="#15803d">Action: writeFileSync([])</text>
  <text x="30" y="120" fill="#14532d">Entry: loadProfileDirectory</text>
  <text x="30" y="140" fill="#14532d">Path: apps/cli/src/profile-boot.ts</text>
  <text x="30" y="160" fill="red" font-weight="700">W: 是否被旧root覆盖?</text>

  <!-- 阶段 2 -->
  <rect x="340" y="40" width="280" height="340" fill="#eff6ff" stroke="#3b82f6" rx="4"/>
  <text x="350" y="60" font-weight="700" fill="#1e40af">2. composeProfile</text>
  <text x="350" y="80" fill="#2563eb">Sequence: Bundle -> Profile -> Home -> Argv</text>
  <text x="350" y="100" fill="#1e40af">Apply: applyEntryPatches()</text>
  <text x="350" y="120" fill="#2563eb">Telemetry: DSH_TELEMETRY_DISABLED</text>
  <text x="350" y="140" fill="#1e3a8a" font-weight="700">W: 冲突覆盖策略: ID匹配?</text>

  <!-- 阶段 3 -->
  <rect x="660" y="40" width="280" height="340" fill="#fff7ed" stroke="#f97316" rx="4"/>
  <text x="670" y="60" font-weight="700" fill="#9a3412">3. boot()</text>
  <text x="670" y="80" fill="#c2410c">Ctx: provide('dshHomePath')</text>
  <text x="670" y="100" fill="#c2410c">Loader: mountRootInclude()</text>
  <text x="670" y="120" fill="#c2410c">Audit: auditStartupEntries()</text>
  <text x="670" y="140" fill="#7c2d12" font-weight="700">W: Fiber 状态 (Active/Failed?)</text>
  <text x="670" y="160" fill="#7c2d12">Stage: plugin tree failed to load</text>

</svg>
