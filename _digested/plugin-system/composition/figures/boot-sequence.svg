<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="550" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">一次 dsh --profile 怎么变成一棵活树</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#6b7280">apps/cli/src/profile-boot.ts runProfile · packages/boot/app-boot/src/index.ts boot()</text>

  <rect x="40" y="64" width="280" height="200" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="180" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">1. prepareProfile</text>
  <text x="56" y="118" font-size="11" fill="#15803d">loadProfile（缺模板则 init）</text>
  <text x="56" y="136" font-size="11" fill="#15803d">重写 profiles/&lt;name&gt;/cordis.yml</text>
  <text x="56" y="154" font-size="11" fill="#15803d">成空列表 []</text>
  <text x="56" y="182" font-size="11" fill="#14532d">Watcher: 是否覆盖旧root?</text>

  <line x1="320" y1="164" x2="358" y2="164" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="360" y="64" width="280" height="200" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="500" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">2. composeProfile</text>
  <text x="376" y="118" font-size="11" fill="#2563eb">removeLinkProjections</text>
  <text x="376" y="136" font-size="11" fill="#1e40af">bundle patches（声明顺序）</text>
  <text x="376" y="154" font-size="11" fill="#2563eb">+ profile cordis.patch.yml</text>
  <text x="376" y="172" font-size="11" fill="#2563eb">+ home cordis.patch.yml</text>
  <text x="376" y="190" font-size="11" fill="#2563eb">+ --patch 文件</text>
  <text x="376" y="218" font-size="11" fill="#1e3a8a">Watcher: 冲突覆盖策略?</text>

  <line x1="640" y1="164" x2="678" y2="164" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="680" y="64" width="240" height="200" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="800" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">3. boot()</text>
  <text x="696" y="118" font-size="11" fill="#9a3412">new Context</text>
  <text x="696" y="136" font-size="11" fill="#c2410c">provide dshHomePath</text>
  <text x="696" y="154" font-size="11" fill="#c2410c">plugin(Loader)</text>
  <text x="696" y="172" font-size="11" fill="#c2410c">prepare</text>
  <text x="696" y="190" font-size="11" fill="#c2410c">mountRootInclude</text>
  <text x="696" y="208" font-size="11" fill="#c2410c">loader.await()</text>
  <text x="696" y="226" font-size="11" fill="#c2410c">auditStartupEntries</text>
  <text x="696" y="248" font-size="11" fill="#7c2d12">Watcher: Fiber状态?</text>

  <rect x="40" y="288" width="880" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="316" font-size="13" font-weight="700" fill="#111827">两段失败标签</text>
  <text x="60" y="340" font-size="12" fill="#374151">1. prepare 之前：host preparation failed。</text>
  <text x="60" y="362" font-size="12" fill="#374151">2. mountRootInclude 之后：plugin tree failed to load。</text>
  <text x="60" y="390" font-size="12" fill="#374151">Watcher: 最深 cause stack追踪?</text>
  <text x="60" y="420" font-size="12" fill="#374151">auditStartupEntries：disabled 跳过；FAILED 等原错误保留；PENDING 点名。</text>
  <text x="60" y="450" font-size="12" fill="#374151">Loader 失败：dispose 树后抛异常。</text>
</svg>
