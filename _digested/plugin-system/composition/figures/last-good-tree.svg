<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">上一代保留与应用后失败的区别</title>
  <desc id="desc">解析或准备候选失败，未开始 Include 更新时保留原 patch 集并恢复预先停止的条目。Include 更新开始后，激活失败不会全局恢复原树。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="490" fill="#fafafa" rx="6"/>
  <text x="500" y="29" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">上一代能否继续：先确认 Include 更新是否已开始</text>
  <text x="500" y="52" text-anchor="middle" fill="#64748b">保留当前树不表示它一定健康；它也可能包含之前已经应用的失败配置。</text>

  <rect x="25" y="83" width="180" height="75" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="115" y="112" text-anchor="middle" font-weight="700" fill="#1e40af">当前 Loader 树</text>
  <text x="115" y="136" text-anchor="middle" fill="#1e3a8a">旧 patch 集</text>
  <line x1="205" y1="120" x2="252" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="255" y="83" width="310" height="75" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="410" y="112" text-anchor="middle" font-weight="700" fill="#92400e">读取 / 解析 / 准备候选失败</text>
  <text x="410" y="136" text-anchor="middle" fill="#78350f">尚未 entry.update · applying = false</text>
  <line x1="565" y1="120" x2="612" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="615" y="77" width="360" height="91" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="795" y="103" text-anchor="middle" font-weight="700" fill="#166534">不应用候选 patch 集</text>
  <text x="795" y="128" text-anchor="middle" fill="#14532d">恢复预先移除的行 / 停止的条目</text>
  <text x="795" y="150" text-anchor="middle" fill="#14532d">原有组合继续；恢复失败另记 warning</text>

  <rect x="25" y="220" width="180" height="75" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="115" y="249" text-anchor="middle" font-weight="700" fill="#1e40af">当前 Loader 树</text>
  <text x="115" y="273" text-anchor="middle" fill="#1e3a8a">进入应用阶段</text>
  <line x1="205" y1="258" x2="252" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="255" y="214" width="310" height="91" rx="8" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="410" y="240" text-anchor="middle" font-weight="700" fill="#9f1239">applying = true → entry.update</text>
  <text x="410" y="265" text-anchor="middle" fill="#881337">更新后发现新增 / 变化的激活失败</text>
  <text x="410" y="287" text-anchor="middle" fill="#881337">或此前运行的条目无法重启</text>
  <line x1="565" y1="258" x2="612" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="615" y="214" width="360" height="91" rx="8" fill="#fff1f2" stroke="#fb7185"/>
  <text x="795" y="240" text-anchor="middle" font-weight="700" fill="#9f1239">抛错，但不全局恢复旧树</text>
  <text x="795" y="265" text-anchor="middle" fill="#881337">新配置与其他已应用变化可能保留</text>
  <text x="795" y="287" text-anchor="middle" fill="#881337">已停止的旧插件不保证仍在运行</text>

  <rect x="25" y="345" width="950" height="117" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="43" y="372" font-weight="700" fill="#334155">诊断点：查看失败阶段和当前条目，不用异常本身判断树是否已恢复。</text>
  <text x="43" y="399" fill="#475569">成功审计后才 emit app-boot/config-reload；未变化的旧失败可以 warning 保留。</text>
  <text x="43" y="423" fill="#475569">删除用户 patch 是合法新组合；启动时的坏文件则阻止启动，均不同于上面两种热更新失败。</text>
  <text x="43" y="447" fill="#475569">Settings 的旧文件恢复与再次协调由配置编辑器负责，也可能失败；外部副作用不在全局恢复保证内。</text>
</svg>
