<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="monospace" font-size="11">
  <rect width="960" height="400" fill="#fafafa" rx="4"/>
  <text x="480" y="20" text-anchor="middle" font-weight="700" font-size="14">Config Fidelity: Dump vs Boot</text>

  <rect x="20" y="40" width="450" height="340" fill="#f0fdf4" stroke="#22c55e" rx="4"/>
  <text x="30" y="60" font-weight="700" fill="#166534">--dump-config</text>
  <text x="30" y="80" fill="#15803d">Target: 展平所有 patch 语义</text>
  <text x="30" y="100" fill="#15803d">Action: applyEntryPatches()</text>
  <text x="30" y="120" fill="#15803d">Behavior: 不求值 !!js, 原文输出</text>
  <text x="30" y="140" fill="#14532d">Scope: Bundle+Profile+Home+Patch</text>
  <text x="30" y="200" fill="red" font-weight="700">W: 冲突覆盖策略 (ID命中)</text>

  <rect x="490" y="40" width="450" height="340" fill="#eff6ff" stroke="#3b82f6" rx="4"/>
  <text x="500" y="60" font-weight="700" fill="#1e40af">runProfile / boot</text>
  <text x="500" y="80" fill="#2563eb">Target: 运行时活树</text>
  <text x="500" y="100" fill="#2563eb">Action: applyEntryPatches() + runtime</text>
  <text x="500" y="120" fill="#2563eb">Behavior: 求值 !!js (inject后)</text>
  <text x="500" y="140" fill="#1e3a8a">额外层: DSH_TELEMETRY_DISABLED</text>
  <text x="500" y="200" fill="red" font-weight="700">W: 运行时注入(派生层)</text>
</svg>
