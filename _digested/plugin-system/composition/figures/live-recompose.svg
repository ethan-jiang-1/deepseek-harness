<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="monospace" font-size="11">
  <rect width="800" height="300" fill="#fafafa" rx="4"/>
  <text x="400" y="20" text-anchor="middle" font-weight="700" font-size="14">HMR: 原子重组合流</text>

  <rect x="20" y="50" width="200" height="200" fill="#fef3c7" stroke="#fbbf24" rx="4"/>
  <text x="30" y="70" font-weight="700">File Watcher</text>
  <text x="30" y="90">Patches: .patch.yml</text>
  <text x="30" y="110">Manifest: package.json</text>

  <line x1="230" y1="150" x2="280" y2="150" stroke="#666" marker-end="url(#arr)"/>

  <rect x="290" y="50" width="200" height="200" fill="#dcfce7" stroke="#22c55e" rx="4"/>
  <text x="300" y="70" font-weight="700">HMR Service</text>
  <text x="300" y="90">reconcileProfile()</text>
  <text x="300" y="110">SerialQueue: 排队重算</text>
  <text x="300" y="180" fill="red" font-weight="700">W: 竞态锁定超时?</text>

  <line x1="500" y1="150" x2="550" y2="150" stroke="#666" marker-end="url(#arr)"/>

  <rect x="560" y="50" width="200" height="200" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
  <text x="570" y="70" font-weight="700">Active Tree</text>
  <text x="570" y="90">recomposeProfile()</text>
  <text x="570" y="110">Result: 原子换入</text>
  <text x="570" y="160" fill="red" font-weight="700">W: 上一棵树回滚?</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4 Z" fill="#666"/></marker>
  </defs>
</svg>
