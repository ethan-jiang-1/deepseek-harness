<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="system-ui" font-size="12">
  <rect width="700" height="400" fill="#fafafa" rx="6"/>
  <text x="350" y="30" text-anchor="middle" font-weight="700">Harness Home &amp; Profile 管理</text>

  <rect x="50" y="70" width="200" height="250" fill="#fff" stroke="#333"/>
  <text x="150" y="90" text-anchor="middle" font-weight="700">Harness Home (~/.dsh)</text>
  <text x="70" y="120">profiles/</text>
  <text x="80" y="140">  - desktop (reserved)</text>
  <text x="80" y="160">  - web (shipped)</text>
  <text x="80" y="180">  - custom/</text>

  <rect x="350" y="70" width="250" height="250" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="475" y="90" text-anchor="middle" font-weight="700">创建流</text>
  <text x="370" y="120">1. Template copy</text>
  <text x="370" y="140">2. Staging (原子切换)</text>
  <text x="370" y="160">3. initProfile()</text>

  <circle cx="475" cy="200" r="10" fill="red"/>
  <text x="475" y="230" text-anchor="middle" font-size="11">Watcher: 原子替换一致性?</text>

  <line x1="250" y1="195" x2="350" y2="195" stroke="#666" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker>
  </defs>
</svg>
