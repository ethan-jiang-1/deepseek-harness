<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="monospace" font-size="11">
  <rect width="800" height="400" fill="#fafafa" rx="4"/>
  <text x="400" y="20" text-anchor="middle" font-weight="700" font-size="14">Profile Home Structure</text>

  <rect x="20" y="40" width="300" height="340" fill="#fff" stroke="#333" rx="4"/>
  <text x="30" y="60" font-weight="700">Harness Home (~/.dsh)</text>
  <text x="30" y="80">/profiles/&lt;name&gt;/</text>
  <text x="40" y="100"> - package.json (manifest)</text>
  <text x="40" y="120"> - cordis.patch.yml (用户层)</text>
  <text x="40" y="140"> - cordis.yml (root - 自动覆盖)</text>
  <text x="30" y="180">/staging/ (原子替换空间)</text>

  <rect x="350" y="40" width="400" height="340" fill="#eff6ff" stroke="#3b82f6" rx="4"/>
  <text x="360" y="60" font-weight="700">Initialization Workflow</text>
  <text x="360" y="90">1. Template Copy (Init)</text>
  <text x="360" y="110">2. Staging Atomic Swap</text>
  <text x="360" y="130">3. initProfile() 清理</text>
  <text x="360" y="250" fill="red" font-weight="700">W: 并发重建冲突检测?</text>
  <text x="360" y="270" fill="red" font-weight="700">W: Staging 目录清理失败?</text>
</svg>
