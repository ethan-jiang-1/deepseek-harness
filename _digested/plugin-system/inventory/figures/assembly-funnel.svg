<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="monospace" font-size="11">
  <rect width="600" height="450" fill="#ffffff" rx="4"/>
  <text x="300" y="20" text-anchor="middle" font-weight="700" font-size="14">Capability Assembly Funnel</text>

  <rect x="100" y="50" width="400" height="80" fill="#f0fdf4" stroke="#22c55e" rx="4"/>
  <text x="110" y="70" font-weight="700">1. Bundle (打包)</text>
  <text x="110" y="90">资产: package.json / patch</text>
  <text x="110" y="110" fill="red" font-weight="700">W: 依赖版本是否匹配?</text>

  <rect x="100" y="180" width="400" height="80" fill="#eff6ff" stroke="#3b82f6" rx="4"/>
  <text x="110" y="200" font-weight="700">2. Profile (组装)</text>
  <text x="110" y="220">配置层叠: patch 索引合并</text>
  <text x="110" y="240" fill="red" font-weight="700">W: 补丁ID冲突/跳过?</text>

  <rect x="100" y="310" width="400" height="80" fill="#fff7ed" stroke="#f97316" rx="4"/>
  <text x="110" y="330" font-weight="700">3. Preset (会话模式)</text>
  <text x="110" y="350">会话声明: standard/ptc/cordis</text>
  <text x="110" y="370" fill="red" font-weight="700">W: Persona 与工具绑定?</text>
</svg>
