<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="monospace" font-size="11">
  <rect width="800" height="400" fill="#fafafa" rx="4"/>
  <text x="400" y="20" text-anchor="middle" font-weight="700" font-size="14">Reuse Decision Tree</text>

  <rect x="20" y="50" width="180" height="300" fill="#fff" stroke="#333" rx="4"/>
  <text x="30" y="70" font-weight="700">1. 配置调整</text>
  <text x="30" y="90">ENV / YAML PATCH</text>
  <text x="30" y="110">成本: 最低</text>

  <rect x="220" y="50" width="180" height="300" fill="#fff" stroke="#333" rx="4"/>
  <text x="230" y="70" font-weight="700">2. Provider 替换</text>
  <text x="230" y="90">Disable + Insert</text>
  <text x="230" y="110">成本: 低</text>
  <text x="230" y="130" fill="red" font-weight="700">W: 索引覆盖冲突?</text>

  <rect x="420" y="50" width="180" height="300" fill="#fff" stroke="#333" rx="4"/>
  <text x="430" y="70" font-weight="700">3. 挂现成包</text>
  <text x="430" y="90">dsh plugin add</text>
  <text x="430" y="110">成本: 中</text>

  <rect x="620" y="50" width="160" height="300" fill="#fff" stroke="#333" rx="4"/>
  <text x="630" y="70" font-weight="700">4. 自写胶水</text>
  <text x="630" y="90">Consumer 逻辑</text>
  <text x="630" y="110">成本: 最高</text>
  <text x="630" y="250" fill="red" font-weight="700">W: 违背分装纪律?</text>
</svg>
