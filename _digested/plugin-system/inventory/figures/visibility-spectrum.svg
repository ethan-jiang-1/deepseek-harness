<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="monospace" font-size="11">
  <rect width="800" height="200" fill="#fafafa" rx="4"/>
  <text x="400" y="20" text-anchor="middle" font-weight="700" font-size="14">Visibility Spectrum</text>

  <rect x="50" y="60" width="200" height="100" fill="#dcfce7" stroke="#166534" rx="4"/>
  <text x="60" y="80" font-weight="700">Base (出厂默认)</text>
  <text x="60" y="100">Visible: 所有 launcher</text>

  <rect x="300" y="60" width="200" height="100" fill="#fff7ed" stroke="#9a3412" rx="4"/>
  <text x="310" y="80" font-weight="700">Optional (Opt-in)</text>
  <text x="310" y="100">Action: 安装即用, 默认关</text>

  <rect x="550" y="60" width="200" height="100" fill="#fef2f2" stroke="#991b1b" rx="4"/>
  <text x="560" y="80" font-weight="700">On-demand (按需)</text>
  <text x="560" y="100">Action: 运行时自动下载</text>

  <text x="50" y="180" fill="red" font-weight="700">W: 门控逻辑是否准确?</text>
</svg>
