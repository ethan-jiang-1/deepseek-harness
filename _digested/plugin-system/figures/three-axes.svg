<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="system-ui, -apple-system, sans-serif" font-size="11">
  <rect width="1000" height="450" fill="#ffffff" rx="10"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">DSH 插件系统：三维架构诊断视图</text>

  <!-- Inventory -->
  <rect x="30" y="60" width="300" height="300" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="180" y="90" text-anchor="middle" font-weight="700" fill="#4338ca" font-size="14">1. Inventory (库存)</text>
  <text x="180" y="115" text-anchor="middle" fill="#6366f1">能力与工具现货库</text>
  <text x="50" y="150" fill="#312e81" font-weight="600">Watchpoints:</text>
  <text x="50" y="170" fill="#475569">• 概念是否已归档?</text>
  <text x="50" y="190" fill="#475569">• Provider 是否被 Consumer 显式依赖?</text>
  <text x="50" y="210" fill="#475569">• 能力定义(Definition)是否过具体?</text>

  <!-- Composition -->
  <rect x="350" y="60" width="300" height="300" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="90" text-anchor="middle" font-weight="700" fill="#15803d" font-size="14">2. Composition (组装)</text>
  <text x="500" y="115" text-anchor="middle" fill="#22c55e">运行时的插件树计算</text>
  <text x="370" y="150" fill="#14532d" font-weight="600">Watchpoints:</text>
  <text x="370" y="170" fill="#475569">• 层叠(Layers)优先级逻辑?</text>
  <text x="370" y="190" fill="#475569">• HMR 事务是否原子?</text>
  <text x="370" y="210" fill="#475569">• 启动窗口(Readiness)锁定?</text>

  <!-- Lifecycle -->
  <rect x="670" y="60" width="300" height="300" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="820" y="90" text-anchor="middle" font-weight="700" fill="#9a3412" font-size="14">3. Lifecycle (生命周期)</text>
  <text x="820" y="115" text-anchor="middle" fill="#f97316">插件的七段不可逆边界</text>
  <text x="690" y="150" fill="#7c2d12" font-weight="600">Watchpoints:</text>
  <text x="690" y="170" fill="#475569">• 显式状态转移语义?</text>
  <text x="690" y="190" fill="#475569">• 防御性资源清理契约?</text>
  <text x="690" y="210" fill="#475569">• 失败回滚的原子性?</text>

  <!-- Invariants Box -->
  <rect x="50" y="380" width="900" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="500" y="410" text-anchor="middle" fill="#334155" font-weight="600">核心架构不变量: 计算确定性 (Composition) · 宿主所有权边界 (Permission) · 数据担保一次性 (Statelessness)</text>
</svg>
