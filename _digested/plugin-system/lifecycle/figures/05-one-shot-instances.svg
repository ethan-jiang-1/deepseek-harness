<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1180" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">四个一次性实例：凭据不同，判据相同</text>
  <text x="40" y="68" font-size="13" fill="#6e7781">只跑一次、留可判定凭据、失败保留旧状态——三种写法，一条纪律</text>

  <rect x="40" y="96" width="210" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="126" font-size="12.5" font-weight="700" fill="#1f2328">实例</text>
  <rect x="262" y="96" width="270" height="48" rx="8" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="280" y="126" font-size="12.5" font-weight="700" fill="#0969da">一次性凭据</text>
  <rect x="544" y="96" width="270" height="48" rx="8" fill="#e8f5ec" stroke="#8fd19e"/>
  <text x="562" y="126" font-size="12.5" font-weight="700" fill="#1a7f37">幂等靠什么</text>
  <rect x="826" y="96" width="314" height="48" rx="8" fill="#fff8e5" stroke="#eac54f"/>
  <text x="844" y="126" font-size="12.5" font-weight="700" fill="#9a6700">失败处置</text>

  <rect x="40" y="156" width="210" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="184" font-size="12" fill="#1f2328">profile 首建</text>
  <text x="58" y="202" font-size="11" fill="#6e7781">initProfile</text>
  <rect x="262" y="156" width="270" height="64" rx="8" fill="#eef6ff" stroke="#9ecbff"/><text x="280" y="192" font-size="11.5" fill="#0969da">文件是否存在</text>
  <rect x="544" y="156" width="270" height="64" rx="8" fill="#e8f5ec" stroke="#8fd19e"/><text x="562" y="192" font-size="11.5" fill="#1a7f37">已有文件一律不写</text>
  <rect x="826" y="156" width="314" height="64" rx="8" fill="#fff8e5" stroke="#eac54f"/><text x="844" y="192" font-size="11.5" fill="#9a6700">保留旧文件</text>

  <rect x="40" y="232" width="210" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="260" font-size="12" fill="#1f2328">settings.yaml 导入</text>
  <text x="58" y="278" font-size="11" fill="#6e7781">settings</text>
  <rect x="262" y="232" width="270" height="64" rx="8" fill="#eef6ff" stroke="#9ecbff"/><text x="280" y="268" font-size="11.5" fill="#0969da">文件已改名成 .imported</text>
  <rect x="544" y="232" width="270" height="64" rx="8" fill="#e8f5ec" stroke="#8fd19e"/><text x="562" y="268" font-size="11.5" fill="#1a7f37">先改名，再写</text>
  <rect x="826" y="232" width="314" height="64" rx="8" fill="#fff8e5" stroke="#eac54f"/><text x="844" y="268" font-size="11.5" fill="#9a6700">被拒段落留在改名文件里</text>

  <rect x="40" y="308" width="210" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="336" font-size="12" fill="#1f2328">存储版本戳</text>
  <text x="58" y="354" font-size="11" fill="#6e7781">storage-sqlite / domain</text>
  <rect x="262" y="308" width="270" height="64" rx="8" fill="#eef6ff" stroke="#9ecbff"/><text x="280" y="344" font-size="11.5" fill="#0969da">PRAGMA user_version / 域版本</text>
  <rect x="544" y="308" width="270" height="64" rx="8" fill="#e8f5ec" stroke="#8fd19e"/><text x="562" y="344" font-size="11.5" fill="#1a7f37">user_version 必须等于；域版本按接受集</text>
  <rect x="826" y="308" width="314" height="64" rx="8" fill="#fff8e5" stroke="#eac54f"/><text x="844" y="344" font-size="11.5" fill="#9a6700">集外记录丢弃；不迁移</text>

  <rect x="40" y="384" width="210" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="412" font-size="12" fill="#1f2328">desktop 运行树</text>
  <text x="58" y="430" font-size="11" fill="#6e7781">runtime-tree</text>
  <rect x="262" y="384" width="270" height="64" rx="8" fill="#eef6ff" stroke="#9ecbff"/><text x="280" y="420" font-size="11.5" fill="#0969da">desktop-runtime.json 校验</text>
  <rect x="544" y="384" width="270" height="64" rx="8" fill="#e8f5ec" stroke="#8fd19e"/><text x="562" y="420" font-size="11.5" fill="#1a7f37">校验通过才用</text>
  <rect x="826" y="384" width="314" height="64" rx="8" fill="#fff8e5" stroke="#eac54f"/><text x="844" y="420" font-size="11.5" fill="#9a6700">进原生恢复</text>

  <text x="40" y="466" font-size="11.5" fill="#6e7781">共同点：凭据都是「一个可判定的持久事实」，而不是「某个回调被调用过」。</text>
</svg>
