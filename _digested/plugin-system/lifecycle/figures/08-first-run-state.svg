<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#cf222e"/></marker>
  </defs>
  <rect width="1180" height="560" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">首启状态机：没有钩子，就自己造一个可判定的一次性</text>
  <text x="40" y="68" font-size="13" fill="#6e7781">判据不是「怎么只跑一次」，而是「跑两次会发生什么」</text>

  <rect x="40" y="96" width="640" height="210" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="124" font-size="14" font-weight="700" fill="#1f2328">状态机</text>

  <rect x="62" y="146" width="130" height="46" rx="8" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="127" y="174" text-anchor="middle" font-size="12.5" fill="#0969da">no-marker</text>

  <line x1="192" y1="169" x2="216" y2="169" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="218" y="146" width="150" height="46" rx="8" fill="#fff8e5" stroke="#eac54f"/>
  <text x="293" y="174" text-anchor="middle" font-size="12.5" fill="#9a6700">bootstrap</text>

  <line x1="368" y1="169" x2="392" y2="169" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="394" y="146" width="130" height="46" rx="8" fill="#e8f5ec" stroke="#8fd19e"/>
  <text x="459" y="174" text-anchor="middle" font-size="12.5" fill="#1a7f37">verified</text>

  <line x1="524" y1="169" x2="548" y2="169" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="550" y="146" width="108" height="46" rx="8" fill="#e8f5ec" stroke="#8fd19e"/>
  <text x="604" y="174" text-anchor="middle" font-size="12.5" fill="#1a7f37">steady</text>

  <line x1="293" y1="192" x2="293" y2="222" stroke="#cf222e" marker-end="url(#arr)"/>
  <rect x="218" y="226" width="150" height="46" rx="8" fill="#ffebe9" stroke="#ffcecb"/>
  <text x="293" y="254" text-anchor="middle" font-size="12.5" fill="#cf222e">failed</text>
  <text x="380" y="246" font-size="11.5" fill="#57606a">保留旧状态；下次启动重试</text>
  <text x="380" y="264" font-size="11.5" fill="#57606a">不写「已完成」凭据</text>

  <text x="62" y="298" font-size="11.5" fill="#6e7781">凭据放在你自己的存储域，带 schema 版本；不放 profile patch，不放内存。</text>

  <rect x="704" y="96" width="436" height="210" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="726" y="124" font-size="14" font-weight="700" fill="#1f2328">四个必须自己实现的点</text>
  <text x="726" y="152" font-size="12" fill="#1a7f37">标记</text>
  <text x="800" y="152" font-size="12" fill="#424a53">持久、带版本；内存变量等于没有</text>
  <text x="726" y="178" font-size="12" fill="#1a7f37">原子性</text>
  <text x="800" y="178" font-size="12" fill="#424a53">临时文件 + rename；崩溃不留半个文件</text>
  <text x="726" y="204" font-size="12" fill="#1a7f37">串行化</text>
  <text x="800" y="204" font-size="12" fill="#424a53">自建 lease；两个进程不能同时初始化</text>
  <text x="726" y="230" font-size="12" fill="#1a7f37">校验</text>
  <text x="800" y="230" font-size="12" fill="#424a53">写完回读并抽样；写成功 ≠ 读得回来</text>
  <rect x="726" y="248" width="392" height="40" rx="6" fill="#ffebe9"/>
  <text x="740" y="273" font-size="12" fill="#cf222e">没有 exactly once：每一步都要可重入</text>

  <rect x="40" y="330" width="350" height="150" rx="10" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="62" y="358" font-size="13.5" font-weight="700" fill="#1f2328">作用域</text>
  <text x="62" y="386" font-size="12" fill="#0969da">home</text>
  <text x="120" y="386" font-size="12" fill="#424a53">机器偏好、凭据引用、跨项目设置</text>
  <text x="62" y="412" font-size="12" fill="#0969da">workspace</text>
  <text x="160" y="412" font-size="12" fill="#424a53">项目索引、绑定、每项目游标</text>
  <text x="62" y="442" font-size="11.5" fill="#6e7781">没有 per-plugin 数据根：路径是你自己的 Config</text>
  <text x="62" y="462" font-size="11.5" fill="#6e7781">放错作用域 = 项目间串味，或换项目就丢</text>

  <rect x="410" y="330" width="350" height="150" rx="10" fill="#fff8e5" stroke="#eac54f"/>
  <text x="432" y="358" font-size="13.5" font-weight="700" fill="#1f2328">首启之后要变，三条路</text>
  <text x="432" y="386" font-size="12" fill="#9a6700">profile-as-mode</text>
  <text x="570" y="386" font-size="12" fill="#424a53">重启，最稳，能改一切</text>
  <text x="432" y="412" font-size="12" fill="#9a6700">config</text>
  <text x="570" y="412" font-size="12" fill="#424a53">配置层热更，改不了代码路径</text>
  <text x="432" y="438" font-size="12" fill="#9a6700">client 引导</text>
  <text x="570" y="438" font-size="12" fill="#424a53">不重启，但只能改 UI</text>
  <text x="432" y="464" font-size="11.5" fill="#6e7781">判断：需要在 Host 侧生效吗？</text>

  <rect x="780" y="330" width="360" height="150" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="802" y="358" font-size="13.5" font-weight="700" fill="#1f2328">workspace 两条路线</text>
  <text x="802" y="386" font-size="12" fill="#0969da">boot-scoped</text>
  <text x="906" y="386" font-size="12" fill="#424a53">启动定盘，换项目要重启</text>
  <text x="802" y="412" font-size="12" fill="#0969da">follow</text>
  <text x="906" y="412" font-size="12" fill="#424a53">按会话 cwd / 懒初始化</text>
  <text x="802" y="440" font-size="11.5" fill="#6e7781">换盘是三件事：注册、归属、选中</text>
  <text x="802" y="460" font-size="11.5" fill="#6e7781">三者不会自动同步</text>

  <rect x="40" y="500" width="1100" height="40" rx="8" fill="#eef6ff"/>
  <text x="62" y="525" font-size="12" fill="#0969da">自证：连跑两次比较数据目录应零变更；kill -9 后重跑应收敛；两个进程同时启动应只有一个赢家。</text>
</svg>
