<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
    <marker id="arrr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="900" height="430" fill="#fafafa" rx="6"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">安装写盘面：改两个文件，其余一概不动</text>
  <text x="450" y="51" text-anchor="middle" font-size="11" fill="#6b7280">四个入口落到同一个 PluginManager；包操作在 profile 写锁下进行</text>

  <text x="28" y="80" font-size="11" font-weight="700" fill="#374151">四个入口</text>

  <rect x="28" y="90" width="176" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="116" y="110" text-anchor="middle" font-size="10.5" fill="#1e40af">Web Plugins 页</text>
  <text x="116" y="125" text-anchor="middle" font-size="9.5" fill="#6b7280">web 与 Desktop 共用</text>

  <rect x="28" y="142" width="176" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="116" y="162" text-anchor="middle" font-size="10.5" fill="#1e40af">plugin_manager 工具</text>
  <text x="116" y="177" text-anchor="middle" font-size="9.5" fill="#6b7280">需 full-access 或批准</text>

  <rect x="28" y="194" width="176" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="116" y="214" text-anchor="middle" font-size="10.5" fill="#1e40af">dsh plugin</text>
  <text x="116" y="229" text-anchor="middle" font-size="9.5" fill="#6b7280">转发 pnpm，拒 desktop</text>

  <rect x="28" y="246" width="176" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="116" y="266" text-anchor="middle" font-size="10.5" fill="#1e40af">Desktop 安装的命令</text>
  <text x="116" y="281" text-anchor="middle" font-size="9.5" fill="#6b7280">应用退出后管理</text>

  <line x1="204" y1="112" x2="228" y2="120" stroke="#9ca3af" marker-end="url(#arr)"/>
  <line x1="204" y1="224" x2="228" y2="200" stroke="#9ca3af" marker-end="url(#arr)"/>

  <rect x="232" y="90" width="316" height="60" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="390" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">版本门：engines.dsh，否则 dsh peers</text>
  <text x="390" y="130" text-anchor="middle" font-size="10" fill="#a16207">本地路径 / registry 名：在 pnpm 之前拒绝，什么都没下载</text>
  <text x="390" y="144" text-anchor="middle" font-size="10" fill="#a16207">git / tarball：装完再判，撤销并恢复两个快照文件</text>

  <line x1="390" y1="150" x2="390" y2="168" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="232" y="172" width="316" height="62" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="390" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">PluginManager</text>
  <text x="390" y="212" text-anchor="middle" font-size="10" fill="#2563eb">profile 写锁 lockWaitMs 默认 120000ms</text>
  <text x="390" y="226" text-anchor="middle" font-size="10" fill="#2563eb">与 dsh plugin 共享同一把锁</text>

  <line x1="390" y1="234" x2="390" y2="252" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="232" y="256" width="316" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="390" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">pnpm add / pnpm remove</text>
  <text x="390" y="296" text-anchor="middle" font-size="10" fill="#6b7280">构建批准 = 安装期在本机执行该包代码，不属 sandbox</text>

  <line x1="548" y1="284" x2="576" y2="200" stroke="#16a34a" marker-end="url(#arr)"/>

  <rect x="580" y="90" width="292" height="150" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="596" y="114" font-size="12" font-weight="700" fill="#166534">写</text>
  <text x="616" y="114" font-size="10" fill="#15803d">（只这三个位置）</text>
  <text x="596" y="140" font-size="10.5" font-family="ui-monospace, monospace" fill="#14532d">package.json</text>
  <text x="700" y="140" font-size="10" fill="#15803d">依赖 + bundles 列表</text>
  <text x="596" y="166" font-size="10.5" font-family="ui-monospace, monospace" fill="#14532d">pnpm-lock.yaml</text>
  <text x="700" y="166" font-size="10" fill="#15803d">由 pnpm 写</text>
  <text x="596" y="192" font-size="10.5" font-family="ui-monospace, monospace" fill="#14532d">.plugin-manager/logs</text>
  <text x="596" y="214" font-size="10" fill="#15803d">诊断日志追加，不覆盖</text>

  <rect x="580" y="252" width="292" height="160" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="596" y="276" font-size="12" font-weight="700" fill="#991b1b">不写</text>
  <text x="596" y="302" font-size="10.5" font-family="ui-monospace, monospace" fill="#7f1d1d">cordis.patch.yml</text>
  <text x="700" y="302" font-size="10" fill="#b91c1c">只记录与 bundle 的偏离</text>
  <text x="596" y="328" font-size="10.5" font-family="ui-monospace, monospace" fill="#7f1d1d">compatibility.json</text>
  <text x="700" y="328" font-size="10" fill="#b91c1c">只由豁免写入</text>
  <text x="596" y="354" font-size="10.5" fill="#7f1d1d">插件数据</text>
  <text x="700" y="354" font-size="10" fill="#b91c1c">没有统一契约</text>
  <text x="596" y="380" font-size="10.5" fill="#7f1d1d">Harness home 其它层</text>
  <text x="700" y="380" font-size="10" fill="#b91c1c">卸载也不碰</text>
  <text x="596" y="402" font-size="10" fill="#6b7280">安装完成 = pnpm 与 bundle 校验都通过；之后的发布或启用失败不撤销安装</text>
</svg>
