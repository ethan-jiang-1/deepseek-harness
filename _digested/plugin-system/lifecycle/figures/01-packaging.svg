<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui" font-size="12">
  <rect width="800" height="600" fill="#fafafa" rx="6"/>
  <text x="400" y="30" text-anchor="middle" font-weight="700" font-size="16">插件打包逻辑与清单映射</text>

  <rect x="50" y="60" width="200" height="400" fill="#fef2f2" stroke="#ef4444" rx="6"/>
  <text x="150" y="85" text-anchor="middle" font-weight="700">1. 仓库源码 (Manifest)</text>
  <text x="60" y="110" font-size="11">packages/<group>/<pkg>/package.json</text>
  <text x="60" y="140" fill="#b91c1c" font-size="11">{"dsh": { "bundle": { "patch": "..." }}}</text>
  <text x="60" y="170" fill="#b91c1c" font-size="11">peerDependencies: @deepseek-ai/cordis</text>
  <text x="60" y="250" font-weight="700">Watchpoint:</text>
  <text x="60" y="270" font-size="11">- 必须含 dsh.bundle 声明</text>
  <text x="60" y="290" font-size="11">- 避免 CJS-only exports</text>

  <path d="M 260 260 L 320 260" stroke="#666" marker-end="url(#arr)"/>

  <rect x="330" y="60" width="200" height="400" fill="#eff6ff" stroke="#3b82f6" rx="6"/>
  <text x="430" y="85" text-anchor="middle" font-weight="700">2. dsh plugin add</text>
  <text x="340" y="110" font-size="11">CLI 解析 (apps/cli/src/plugin.ts)</text>
  <text x="340" y="140" font-size="11">Dependency Check: @deepseek-ai/cordis</text>
  <text x="340" y="170" fill="#1e40af" font-weight="700">ErrorCode: ERR_MANIFEST_MISSING</text>
  <text x="340" y="250" font-weight="700">Watchpoint:</text>
  <text x="340" y="270" font-size="11">- 核查 peers 兼容性</text>
  <text x="340" y="290" font-size="11">- 是否已存在该 bundle 条目?</text>

  <path d="M 540 260 L 600 260" stroke="#666" marker-end="url(#arr)"/>

  <rect x="610" y="60" width="160" height="400" fill="#f0fdf4" stroke="#22c55e" rx="6"/>
  <text x="690" y="85" text-anchor="middle" font-weight="700">3. 系统状态</text>
  <text x="620" y="110" font-size="11">profiles/<name>/package.json</text>
  <text x="620" y="140" fill="#166534" font-size="11">dsh.profile.bundles 列表</text>
  <text x="620" y="250" font-weight="700">Watchpoint:</text>
  <text x="620" y="270" font-size="11">- 校验清单一致性</text>
  <text x="620" y="290" font-size="11">- 启动清单是否被锁?</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker>
  </defs>
</svg>
