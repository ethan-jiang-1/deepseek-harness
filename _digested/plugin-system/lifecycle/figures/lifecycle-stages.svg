<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="monospace" font-size="11">
  <rect width="960" height="500" fill="#fafafa" rx="4"/>
  <text x="480" y="20" text-anchor="middle" font-weight="700" font-size="14">Plugin Lifecycle Stages (Dense Diagnostic)</text>

  <rect x="20" y="50" width="120" height="400" fill="#fff" stroke="#333" rx="4"/>
  <text x="30" y="70" font-weight="700">1. Packing</text>

  <rect x="150" y="50" width="120" height="400" fill="#fff" stroke="#333" rx="4"/>
  <text x="160" y="70" font-weight="700">2. Dist</text>

  <rect x="280" y="50" width="120" height="400" fill="#fff" stroke="#333" rx="4"/>
  <text x="290" y="70" font-weight="700">3. Install</text>
  <text x="290" y="90">Check: Peer Deps</text>
  <text x="290" y="110" fill="red" font-weight="700">W: 写入权限?</text>

  <rect x="410" y="50" width="120" height="400" fill="#fff" stroke="#333" rx="4"/>
  <text x="420" y="70" font-weight="700">4. Startup</text>
  <text x="420" y="90">Audit: Failed</text>

  <rect x="540" y="50" width="120" height="400" fill="#fff" stroke="#333" rx="4"/>
  <text x="550" y="70" font-weight="700">5. Init</text>

  <rect x="670" y="50" width="120" height="400" fill="#fff" stroke="#333" rx="4"/>
  <text x="680" y="70" font-weight="700">6. Update</text>

  <rect x="800" y="50" width="120" height="400" fill="#fff" stroke="#333" rx="4"/>
  <text x="810" y="70" font-weight="700">7. Uninst</text>
  <text x="810" y="90">Keep Data</text>
</svg>
