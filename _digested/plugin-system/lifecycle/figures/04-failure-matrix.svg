<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1180" height="560" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">失败矩阵：一行坏了，进程会怎样</text>
  <text x="40" y="68" font-size="13" fill="#6e7781">三列是三种处境；底部的游离异常行与 entry id 无关，永远致命</text>

  <rect x="40" y="96" width="240" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="128" font-size="13" font-weight="700" fill="#1f2328">失败形态</text>

  <rect x="300" y="96" width="240" height="52" rx="8" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="320" y="120" font-size="12.5" font-weight="700" fill="#0969da">optional 启动</text>
  <text x="320" y="138" font-size="11" fill="#57606a">失败只是警告</text>

  <rect x="560" y="96" width="240" height="52" rx="8" fill="#fff8e5" stroke="#eac54f"/>
  <text x="580" y="120" font-size="12.5" font-weight="700" fill="#9a6700">required 启动</text>
  <text x="580" y="138" font-size="11" fill="#57606a">失败停止启动</text>

  <rect x="820" y="96" width="320" height="52" rx="8" fill="#e8f5ec" stroke="#8fd19e"/>
  <text x="840" y="120" font-size="12.5" font-weight="700" fill="#1a7f37">运行期配置重载</text>
  <text x="840" y="138" font-size="11" fill="#57606a">候选失败不提交</text>

  <rect x="40" y="160" width="240" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="186" font-size="12" fill="#1f2328">根配置 / 必需覆盖层</text>
  <text x="60" y="204" font-size="11" fill="#6e7781">缺失、不可读、非法</text>
  <rect x="300" y="160" width="240" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/><text x="320" y="196" font-size="12" fill="#cf222e">停止启动</text>
  <rect x="560" y="160" width="240" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/><text x="580" y="196" font-size="12" fill="#cf222e">停止启动</text>
  <rect x="820" y="160" width="320" height="64" rx="8" fill="#e8f5ec" stroke="#8fd19e"/><text x="840" y="196" font-size="12" fill="#1a7f37">拒绝这次改动，旧树继续跑</text>

  <rect x="40" y="236" width="240" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="262" font-size="12" fill="#1f2328">行自身失败</text>
  <text x="60" y="280" font-size="11" fill="#6e7781">import / schema / !!js / apply</text>
  <rect x="300" y="236" width="240" height="64" rx="8" fill="#fff8e5" stroke="#eac54f"/><text x="320" y="272" font-size="12" fill="#9a6700">警告，继续</text>
  <rect x="560" y="236" width="240" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/><text x="580" y="272" font-size="12" fill="#cf222e">停止启动</text>
  <rect x="820" y="236" width="320" height="64" rx="8" fill="#e8f5ec" stroke="#8fd19e"/><text x="840" y="272" font-size="12" fill="#1a7f37">报告错误，兄弟行照常</text>

  <rect x="40" y="312" width="240" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="338" font-size="12" fill="#1f2328">注入的服务不可用</text>
  <text x="60" y="356" font-size="11" fill="#6e7781">fiber 停在 PENDING</text>
  <rect x="300" y="312" width="240" height="64" rx="8" fill="#fff8e5" stroke="#eac54f"/><text x="320" y="348" font-size="12" fill="#9a6700">继续等依赖</text>
  <rect x="560" y="312" width="240" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/><text x="580" y="348" font-size="12" fill="#cf222e">停止启动</text>
  <rect x="820" y="312" width="320" height="64" rx="8" fill="#e8f5ec" stroke="#8fd19e"/><text x="840" y="348" font-size="12" fill="#1a7f37">保持等待，补上 provider 即可激活</text>

  <rect x="40" y="388" width="240" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/>
  <text x="60" y="414" font-size="12" fill="#cf222e">游离 async / 未捕获同步异常</text>
  <text x="60" y="432" font-size="11" fill="#b91c1c">与 entry id 无关</text>
  <rect x="300" y="388" width="240" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/><text x="320" y="424" font-size="12" font-weight="700" fill="#cf222e">致命</text>
  <rect x="560" y="388" width="240" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/><text x="580" y="424" font-size="12" font-weight="700" fill="#cf222e">致命</text>
  <rect x="820" y="388" width="320" height="64" rx="8" fill="#ffebe9" stroke="#ffcecb"/><text x="840" y="424" font-size="12" font-weight="700" fill="#cf222e">致命</text>

  <rect x="40" y="468" width="1100" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="494" font-size="12.5" fill="#1f2328">读法：先看自己是 optional 还是 required，再看失败发生在启动还是重载。</text>
  <text x="62" y="516" font-size="12" fill="#424a53">最后一行（游离 async / 未捕获同步异常）没有归属，所以三列一样致命——进程不会假装它还健康。</text>
</svg>
