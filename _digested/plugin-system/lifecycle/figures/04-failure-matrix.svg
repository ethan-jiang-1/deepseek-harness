<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="monospace" font-size="11">
  <rect width="800" height="400" fill="#fafafa" rx="4"/>
  <text x="400" y="20" text-anchor="middle" font-weight="700" font-size="14">Failure Matrix (Startup vs Runtime)</text>

  <rect x="20" y="50" width="370" height="300" fill="#fee2e2" stroke="#dc2626" rx="4"/>
  <text x="30" y="70" font-weight="700">Startup Stage</text>
  <text x="30" y="90">1. Bundle Skip (Log warn)</text>
  <text x="30" y="110">2. Preflight Denial (Exit 1)</text>
  <text x="30" y="130">3. Required Row Fail (Abort)</text>
  <text x="30" y="200" fill="red" font-weight="700">W: 追踪最深 Cause Stack</text>

  <rect x="410" y="50" width="370" height="300" fill="#fef3c7" stroke="#d97706" rx="4"/>
  <text x="420" y="70" font-weight="700">Runtime (HMR/Async)</text>
  <text x="420" y="90">1. Async Rejection (Log)</text>
  <text x="420" y="110">2. New Row Fail (Exit 1)</text>
  <text x="420" y="130">3. Old Fail (Warn only)</text>
  <text x="420" y="200" fill="red" font-weight="700">W: 上一棵树状态保持?</text>
</svg>
