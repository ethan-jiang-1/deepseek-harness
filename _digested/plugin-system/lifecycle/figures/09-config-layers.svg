<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="1180" height="520" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">配置：五个层，两个消费者</text>
  <text x="40" y="68" font-size="13" fill="#6e7781">写错层的症状，比写错值常见：值对了，但它不在该在的层</text>

  <rect x="40" y="96" width="520" height="330" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="124" font-size="14" font-weight="700" fill="#1f2328">五个层（后层压前层）</text>

  <rect x="62" y="140" width="476" height="46" rx="8" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="78" y="160" font-size="12.5" fill="#0969da">① Config schema 默认值</text>
  <text x="78" y="177" font-size="11" fill="#57606a">作者声明；字段、默认值、必填</text>

  <rect x="82" y="194" width="456" height="46" rx="8" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="98" y="214" font-size="12.5" fill="#0969da">② bundle patch</text>
  <text x="98" y="231" font-size="11" fill="#57606a">作者 / 部署：出厂组合与产品默认值</text>

  <rect x="102" y="248" width="436" height="46" rx="8" fill="#fff8e5" stroke="#eac54f"/>
  <text x="118" y="268" font-size="12.5" fill="#9a6700">③ profile patch（cordis.patch.yml）</text>
  <text x="118" y="285" font-size="11" fill="#57606a">用户：本 profile 的偏离；设置页写这里</text>

  <rect x="122" y="302" width="416" height="46" rx="8" fill="#fff8e5" stroke="#eac54f"/>
  <text x="138" y="322" font-size="12.5" fill="#9a6700">④ home patch</text>
  <text x="138" y="339" font-size="11" fill="#57606a">用户 / 机器：跨 profile 的偏好</text>

  <rect x="142" y="356" width="396" height="46" rx="8" fill="#e8f5ec" stroke="#8fd19e"/>
  <text x="158" y="376" font-size="12.5" fill="#1a7f37">⑤ --patch</text>
  <text x="158" y="393" font-size="11" fill="#57606a">调用方：本次启动 / 诊断，不持久</text>

  <line x1="560" y1="240" x2="620" y2="240" stroke="#57606a" marker-end="url(#a)"/>

  <rect x="624" y="96" width="516" height="150" rx="10" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="646" y="124" font-size="13.5" font-weight="700" fill="#1f2328">消费者 A：启动参数</text>
  <text x="646" y="150" font-size="12" fill="#424a53">只有 row 保留 !!js ctx.&lt;svc&gt;.&lt;field&gt; 时，</text>
  <text x="646" y="170" font-size="12" fill="#424a53">--port 这类参数才压过配置</text>
  <text x="646" y="196" font-size="12" fill="#cf222e">写成字面值后：参数永远失效，且不报错</text>
  <text x="646" y="222" font-size="11.5" fill="#6e7781">求值点：挂树时的 internal/config waterfall</text>

  <rect x="624" y="262" width="516" height="164" rx="10" fill="#e8f5ec" stroke="#8fd19e"/>
  <text x="646" y="290" font-size="13.5" font-weight="700" fill="#1f2328">消费者 B：设置表单</text>
  <text x="646" y="316" font-size="12" fill="#424a53">只有 .volatile() 的字段进表单；</text>
  <text x="646" y="336" font-size="12" fill="#424a53">没有 volatile 字段的插件报 has no volatile fields</text>
  <text x="646" y="362" font-size="12" fill="#424a53">写入落当前 profile patch（原子写 + 文件锁）</text>
  <text x="646" y="388" font-size="12" fill="#cf222e">另建一份真值 = 两处冲突，改哪都不算数</text>

  <rect x="40" y="444" width="1100" height="56" rx="10" fill="#fff8e5" stroke="#eac54f"/>
  <text x="62" y="468" font-size="12.5" fill="#9a6700">判断：先问「谁该改它」，再决定放哪层；先看 --dump-config 的层注释，再改值。</text>
  <text x="62" y="488" font-size="12" fill="#424a53">反过来做，得到的永远是「改了但没生效」。</text>
</svg>
