<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13">
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect width="1120" height="570" rx="8" fill="#f8fafc"/>
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">配置生命周期：来源、运行引用、操作参数与保存</text>
  <rect x="30" y="65" width="300" height="265" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="50" y="94" font-weight="700" fill="#1e40af">组合输入（后层覆盖前层）</text>
  <text x="50" y="128">bundle → profile → home → --patch</text>
  <text x="50" y="160">行的 config 整份替换</text>
  <text x="50" y="192">原始值仍可包含 !!js 表达式</text>
  <text x="50" y="230" fill="#9a3412">诊断：哪个来源最终覆盖了值？</text>
  <text x="50" y="260" fill="#475569">schema 默认值属于解析步骤，</text>
  <text x="50" y="282" fill="#475569">不属于 patch 层叠。</text>
  <path d="M330 177 H390" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="395" y="65" width="315" height="265" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="415" y="94" font-weight="700" fill="#166534">插值、Config 校验与实例</text>
  <text x="415" y="128">普通字段变化 → 重挂载</text>
  <text x="415" y="160">合格 volatile 更新 → 保持引用</text>
  <text x="415" y="192">完整候选有效后才提交引用</text>
  <text x="415" y="230" fill="#9a3412">诊断：当前实例与原始候选一致吗？</text>
  <text x="415" y="260" fill="#475569">无效候选可能留在原始配置，</text>
  <text x="415" y="282" fill="#475569">运行引用仍保持旧值。</text>
  <path d="M710 177 H770" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="775" y="65" width="315" height="265" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="795" y="94" font-weight="700" fill="#9a3412">操作开始时读取 .get()</text>
  <text x="795" y="128">操作 A 捕获旧参数并继续执行</text>
  <text x="795" y="160">保存新值后，引用更新</text>
  <text x="795" y="192">操作 B 读取新参数</text>
  <text x="795" y="230" fill="#9a3412">诊断：是否在构造时永久缓存？</text>
  <text x="795" y="260" fill="#475569">引用可长期持有，读取出的值</text>
  <text x="795" y="282" fill="#475569">只代表一次操作的快照。</text>
  <rect x="30" y="365" width="1060" height="170" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="50" y="397" font-weight="700" fill="#0f172a">Settings → config-editor → 当前 profile patch → Loader 调和</text>
  <text x="50" y="428" fill="#334155">核对 revision 和高层遮蔽；合入原始配置以保留密钥与表达式；原子写文件后应用。</text>
  <text x="50" y="458" fill="#9a3412">诊断：编辑一项也可能固定完整配置；单字段 reset 与移除整份覆盖具有不同的未来继承效果。</text>
  <text x="50" y="488" fill="#334155">调和失败时 editor 尝试恢复文件与配置；这不构成插件树和外部副作用的全局回滚。</text>
  <text x="50" y="514" fill="#475569">分别核对：磁盘 patch、原始 entry、运行引用、插件激活状态和本次操作参数。</text>
</svg>
