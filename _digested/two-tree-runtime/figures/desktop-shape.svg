<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">桌面的三个进程与两棵树</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">形状和 Web 一样：一棵 Host 树、一棵 Client 树；不同的是宿主、注入方式与产物来源。</text>

  <rect x="40" y="78" width="260" height="210" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="58" y="106" font-size="13" font-weight="700" fill="#374151">Electron 主进程</text>
  <text x="58" y="134" font-size="10.5" fill="#6b7280">窗口 · 菜单 · 打包资源</text>
  <text x="58" y="156" font-size="10.5" fill="#6b7280">启动私有 Desktop Host</text>
  <text x="58" y="178" font-size="10.5" fill="#6b7280">Node IPC 端点：</text>
  <text x="58" y="196" font-size="10.5" fill="#6b7280">boot injections · ready</text>
  <text x="58" y="214" font-size="10.5" fill="#6b7280">fatal · shutdown</text>

  <rect x="350" y="78" width="260" height="210" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="368" y="106" font-size="13" font-weight="700" fill="#166534">desktop-host（Node）</text>
  <text x="368" y="134" font-size="10.5" fill="#15803d">runProfile → 完整 web 应用</text>
  <text x="368" y="156" font-size="10.5" fill="#15803d">--host 127.0.0.1 --port 0</text>
  <text x="368" y="178" font-size="10.5" fill="#15803d">Host 树：service + session log</text>
  <text x="368" y="200" font-size="10.5" fill="#15803d">authenticatedUrl(...)</text>
  <text x="368" y="222" font-size="10.5" fill="#15803d">collectIndexInjections()</text>

  <rect x="660" y="78" width="260" height="210" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="678" y="106" font-size="13" font-weight="700" fill="#9a3412">渲染器（Chromium）</text>
  <text x="678" y="134" font-size="10.5" fill="#c2410c">加载打包后的 web 资源</text>
  <text x="678" y="156" font-size="10.5" fill="#c2410c">等 boot injections 到齐</text>
  <text x="678" y="178" font-size="10.5" fill="#c2410c">Client 树：modules → slots</text>
  <text x="678" y="200" font-size="10.5" fill="#c2410c">RPC 与流仍由 Web 拥有</text>
  <text x="678" y="222" font-size="10.5" fill="#c2410c">没有第二份 session log</text>

  <line x1="300" y1="120" x2="348" y2="120" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="324" y="112" text-anchor="middle" font-size="9.5" fill="#4b5563">启动</text>
  <line x1="610" y1="160" x2="658" y2="160" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="634" y="152" text-anchor="middle" font-size="9.5" fill="#4b5563">IPC</text>
  <line x1="658" y1="240" x2="610" y2="240" stroke="#b91c1c" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <text x="634" y="232" text-anchor="middle" font-size="9.5" fill="#b91c1c">/api</text>

  <rect x="40" y="312" width="880" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="58" y="336" font-size="11" font-weight="700" fill="#374151">与 Web 的三处差别：</text>
  <text x="58" y="356" font-size="10.5" fill="#4b5563">① boot injections 走 Node IPC 而不是 HTTP 响应体；② URL 由 OS 分配端口 + 一次性 token；③ profile 是保留的 $DSH_HOME/profiles/desktop，CLI 拒绝 dsh --profile desktop。</text>
  <text x="58" y="376" font-size="10.5" fill="#6b7280">树形状不变：Host 树 + Client 树；插件装在哪一侧，取决于它在哪个 profile 的安装闭包里（docs/architecture.md:51、:53）。</text>
</svg>
