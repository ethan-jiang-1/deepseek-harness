<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="960" height="340" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">资源地址的四态与 holder 生命周期</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">第一个 holder 打开 provider 的流；最后一个 holder 释放时 abort 并丢弃值。</text>

  <rect x="40" y="76" width="200" height="62" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="140" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">none</text>
  <text x="140" y="124" text-anchor="middle" font-size="10.5" fill="#6b7280">无 provider，或地址不是资源地址</text>

  <rect x="270" y="76" width="200" height="62" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="370" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">loading</text>
  <text x="370" y="124" text-anchor="middle" font-size="10.5" fill="#2563eb">流已打开，还没有帧</text>

  <rect x="500" y="76" width="200" height="62" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="600" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">live</text>
  <text x="600" y="124" text-anchor="middle" font-size="10.5" fill="#15803d">最新帧成功，value 为最新 ok 值</text>

  <rect x="730" y="76" width="190" height="62" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="825" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">failed</text>
  <text x="825" y="124" text-anchor="middle" font-size="10.5" fill="#b91c1c">最新帧报错，value 保留上一个 ok 值</text>

  <line x1="240" y1="107" x2="268" y2="107" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="254" y="99" text-anchor="middle" font-size="9.5" fill="#4b5563">有 holder</text>
  <line x1="470" y1="107" x2="498" y2="107" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="484" y="99" text-anchor="middle" font-size="9.5" fill="#4b5563">首帧</text>
  <line x1="700" y1="107" x2="728" y2="107" stroke="#b91c1c" marker-end="url(#arrRed)"/>
  <text x="714" y="99" text-anchor="middle" font-size="9.5" fill="#b91c1c">失败帧</text>

  <line x1="460" y1="176" x2="460" y2="140" stroke="#b91c1c" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <text x="470" y="164" font-size="10" fill="#b91c1c">release 到 0 → 回到 loading（有 provider）或 none</text>

  <rect x="40" y="196" width="880" height="118" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="58" y="220" font-size="11" font-weight="700" fill="#374151">生命周期只有一条规则：有 holder 就活着。</text>
  <text x="58" y="244" font-size="10.5" fill="#4b5563">holder = 订阅中的 useResource，或一次 ctx.resources.pin(address, signal)。第一个 holder 打开 provider 的流；后来的 holder 直接读最新值。</text>
  <text x="58" y="266" font-size="10.5" fill="#4b5563">最后一个 holder 释放时 abort 流并丢弃值：有 provider 回到 loading，没有则回到 none。右栏给每个开着的 tab 记录 pin 住的地址，所以切 tab 会卸载 body 但不关流。</text>
  <text x="58" y="288" font-size="10.5" fill="#6b7280">帧流结束保留最后状态；失败是 ok:false 帧而不是抛出；provider 忽略 signal 会一直跑到下一帧（docs/subsystems/client-resources.md:86、:90-92）。</text>
</svg>
