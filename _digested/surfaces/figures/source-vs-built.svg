<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="300" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">pnpm dsh 走 tsx ESM；发行 bin 跑 apps/cli/lib/bin.js</text>
  <rect x="40" y="56" width="430" height="110" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="255" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">源码启动</text>
  <text x="56" y="110" font-size="12" fill="#1e40af">node --import tsx/esm apps/cli/src/bin.ts</text>
  <text x="56" y="132" font-size="12" fill="#2563eb">tsconfig paths → packages/*/src</text>
  <text x="56" y="154" font-size="12" fill="#1e3a8a">碰到的模块必须保持 ESM</text>
  <rect x="490" y="56" width="430" height="110" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="705" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">built bin</text>
  <text x="506" y="110" font-size="12" fill="#166534">package.json bin: lib/bin.js</text>
  <text x="506" y="132" font-size="12" fill="#15803d">普通 Node 解析 lib/</text>
  <text x="506" y="154" font-size="12" fill="#14532d">不要混用两条启动面的假设</text>
  <rect x="40" y="186" width="880" height="88" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="60" y="214" font-size="12" fill="#9a3412">两条路径都进同一个 runProfile / runDumpConfig。dump 与 boot 的层差见 composition 专题，不是入口差异。</text>
  <text x="60" y="238" font-size="12" fill="#7c2d12">ACP 也是 launcher profile（dsh --profile acp），没有独立的 demo 入口；stdout 留给协议帧。</text>
</svg>
