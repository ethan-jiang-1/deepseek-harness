<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="360" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">从「一个 loop + tools 数组」迁过来时，东西分别落在哪</text>
  <rect x="40" y="56" width="430" height="280" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="255" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">那边常见的写法</text>
  <text x="56" y="114" font-size="12" fill="#4b5563">while (true) { llm(); runTools() }</text>
  <text x="56" y="138" font-size="12" fill="#4b5563">tools: [{ name, fn }]</text>
  <text x="56" y="162" font-size="12" fill="#4b5563">messages[] 既是 UI 又是请求</text>
  <text x="56" y="186" font-size="12" fill="#4b5563">systemPrompt 字符串常量</text>
  <text x="56" y="210" font-size="12" fill="#4b5563">if (sandbox) wrapBash()</text>
  <text x="56" y="234" font-size="12" fill="#4b5563">CLI 里直接调 loop</text>
  <text x="56" y="258" font-size="12" fill="#4b5563">加功能 = 改 loop 文件</text>
  <text x="56" y="290" font-size="11" fill="#6b7280">换模型 = 换那个 llm() 调用</text>
  <rect x="490" y="56" width="430" height="280" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="705" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">在 dsh 落点</text>
  <text x="506" y="114" font-size="12" fill="#166534">插件 ReactLoopAgent，可换 Factory</text>
  <text x="506" y="138" font-size="12" fill="#15803d">ctx.tools 作用域注册表 + 管道</text>
  <text x="506" y="162" font-size="12" fill="#15803d">session log → deriveMessages</text>
  <text x="506" y="186" font-size="12" fill="#15803d">ctx.systemPrompt.section(order)</text>
  <text x="506" y="210" font-size="12" fill="#15803d">换 ctx.subprocess / ctx.fs 世界</text>
  <text x="506" y="234" font-size="12" fill="#15803d">表面驱动 ctx.agents</text>
  <text x="506" y="258" font-size="12" fill="#14532d">挂插件到 ctx 或事件</text>
  <text x="506" y="290" font-size="11" fill="#166534">ctx.llm.registerAdapter adapter</text>
</svg>
