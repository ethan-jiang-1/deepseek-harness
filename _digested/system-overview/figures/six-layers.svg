<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <rect width="960" height="620" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">一套运行中的 dsh 由六层叠加</text>
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="#6b7280">从 Cordis 生命周期到对外入口；每层都有独立职责。</text>
  <rect x="48" y="72" width="864" height="76" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <circle cx="84" cy="110" r="16" fill="#334155"/><text x="84" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
  <text x="116" y="100" font-size="15" font-weight="700" fill="#1e293b">Surfaces · 人和自动化的入口</text>
  <text x="116" y="122" fill="#334155">CLI / Web / ACP / JSON-RPC / 桌面 复用 ctx.agents 与 session 语义</text>
  <text x="116" y="140" font-size="11" fill="#64748b">不同入口可以启动不同进程和插件组合</text>
  <rect x="48" y="156" width="864" height="76" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <circle cx="84" cy="194" r="16" fill="#0f766e"/><text x="84" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
  <text x="116" y="184" font-size="15" font-weight="700" fill="#134e4a">Turn loop · 默认驱动</text>
  <text x="116" y="206" fill="#115e59">领取 inbox、组装请求、流式调用模型、执行工具并关闭 turn</text>
  <text x="116" y="224" font-size="11" fill="#0f766e">实现 Agent 接口；不是整台机器的特权内核</text>
  <rect x="48" y="240" width="864" height="76" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <circle cx="84" cy="278" r="16" fill="#6d28d9"/><text x="84" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="116" y="268" font-size="15" font-weight="700" fill="#4c1d95">Capability seams · 可替换能力</text>
  <text x="116" y="290" fill="#5b21b6">Service Definition + Service Provider + Consumer</text>
  <text x="116" y="308" font-size="11" fill="#7c3aed">文件系统与进程 provider 共同决定执行世界</text>
  <rect x="48" y="324" width="864" height="76" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <circle cx="84" cy="362" r="16" fill="#1d4ed8"/><text x="84" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="116" y="352" font-size="15" font-weight="700" fill="#1e3a8a">Product spine · 产品 API 主干</text>
  <text x="116" y="374" fill="#1e40af">ctx.sessions · ctx.systemPrompt · ctx.tools · ctx.agents · ctx.llm</text>
  <text x="116" y="392" font-size="11" fill="#2563eb">会话、提示词、工具和模型请求各有自己的所有者</text>
  <rect x="48" y="408" width="864" height="76" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <circle cx="84" cy="446" r="16" fill="#15803d"/><text x="84" y="451" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="116" y="436" font-size="15" font-weight="700" fill="#14532d">Composition · 启动组合</text>
  <text x="116" y="458" fill="#166534">空 entry list + bundle + profile + home + --patch</text>
  <text x="116" y="476" font-size="11" fill="#16a34a">profile 决定一次进程实际挂载的插件树</text>
  <rect x="48" y="492" width="864" height="76" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="84" cy="530" r="16" fill="#c2410c"/><text x="84" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="116" y="520" font-size="15" font-weight="700" fill="#7c2d12">Cordis runtime · 插件生命周期</text>
  <text x="116" y="542" fill="#9a3412">Context / plugin / inject / event / effect / fiber / Loader</text>
  <text x="116" y="560" font-size="11" fill="#ea580c">vendor/cordis · loader · include · group · hmr</text>
  <text x="480" y="598" text-anchor="middle" font-size="11" fill="#6b7280">新行为挂到拥有它的服务或事件；循环只负责驱动已组合的能力。</text>
</svg>
