<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <rect width="960" height="430" fill="#fafafa" rx="6"/>
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">扩展事件分成三个域</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#6b7280">先判断事实是否需要持久化，再选择实时扩展点和派发模式。</text>
  <rect x="28" y="72" width="288" height="320" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="172" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Session events</text>
  <text x="172" y="124" text-anchor="middle" font-size="11" fill="#c2410c">写入 append-only log</text>
  <text x="44" y="158" font-weight="700" fill="#7c2d12">生命周期</text>
  <text x="44" y="180" fill="#9a3412">活过 reload、resume 与 fork</text>
  <text x="44" y="210" font-weight="700" fill="#7c2d12">代表事件</text>
  <text x="44" y="234" fill="#9a3412">turn/* · step/* · system/message</text>
  <text x="44" y="256" fill="#9a3412">user/message · assistant/message</text>
  <text x="44" y="278" fill="#9a3412">assistant/attempt · tool/*</text>
  <text x="44" y="316" font-weight="700" fill="#7c2d12">消费方式</text>
  <text x="44" y="340" fill="#9a3412">deriveMessages() 投影模型历史</text>
  <text x="44" y="362" fill="#9a3412">session/event 通知实时观察者</text>
  <rect x="336" y="72" width="288" height="320" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="480" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Agent events</text>
  <text x="480" y="124" text-anchor="middle" font-size="11" fill="#2563eb">拦截一个活着的 Agent</text>
  <text x="352" y="158" font-weight="700" fill="#1e3a8a">职责</text>
  <text x="352" y="180" fill="#1e40af">请求配置、step 与停止的实时策略</text>
  <text x="352" y="210" font-weight="700" fill="#1e3a8a">代表事件</text>
  <text x="352" y="234" fill="#1e40af">agent/pre-step · waterfall</text>
  <text x="352" y="256" fill="#1e40af">agent/request · waterfall</text>
  <text x="352" y="278" fill="#1e40af">agent/turn-stopping · serial</text>
  <text x="352" y="300" fill="#1e40af">agent/request-error · waterfall</text>
  <text x="352" y="338" font-weight="700" fill="#1e3a8a">派发规则</text>
  <text x="352" y="362" fill="#1e40af">next() 委托；直接返回会短路</text>
  <rect x="644" y="72" width="288" height="320" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="788" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">Capability events</text>
  <text x="788" y="124" text-anchor="middle" font-size="11" fill="#7c3aed">某项能力自己的策略</text>
  <text x="660" y="158" font-weight="700" fill="#4c1d95">职责</text>
  <text x="660" y="180" fill="#5b21b6">把政策挂在能力边界上</text>
  <text x="660" y="210" font-weight="700" fill="#4c1d95">代表事件</text>
  <text x="660" y="234" fill="#5b21b6">llm/stream · waterfall</text>
  <text x="660" y="256" fill="#5b21b6">tools/pre-execute</text>
  <text x="660" y="278" fill="#5b21b6">tools/execute · tools/post-execute</text>
  <text x="660" y="300" fill="#5b21b6">fs/* · session-telemetry/record</text>
  <text x="660" y="334" font-weight="700" fill="#4c1d95">归属</text>
  <text x="660" y="356" fill="#5b21b6">能力定义包声明并派发</text>
  <text x="660" y="376" fill="#5b21b6">provider / policy / Consumer 参与</text>
</svg>
