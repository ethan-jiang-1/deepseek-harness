<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fafafa" rx="6"/>
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">运行时同时维护活插件图与耐久事件流</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#6b7280">一个描述当前可见能力，一个记录已经发生的事实。</text>

  <rect x="36" y="76" width="330" height="330" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="201" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">活插件图 · Cordis</text>
  <text x="201" y="126" text-anchor="middle" font-size="11" fill="#2563eb">当前组成与可见性</text>
  <rect x="68" y="150" width="266" height="48" rx="7" fill="#fff" stroke="#60a5fa"/>
  <text x="201" y="171" text-anchor="middle" font-weight="700" fill="#1e3a8a">Fiber / Context</text>
  <text x="201" y="188" text-anchor="middle" fill="#2563eb">插件挂载、依赖与 isolate</text>
  <rect x="68" y="216" width="266" height="66" rx="7" fill="#fff" stroke="#60a5fa"/>
  <text x="201" y="239" text-anchor="middle" font-weight="700" fill="#1e3a8a">当前贡献</text>
  <text x="201" y="259" text-anchor="middle" fill="#2563eb">services · registries · listeners</text>
  <text x="201" y="276" text-anchor="middle" fill="#2563eb">effects · scoped policy</text>
  <rect x="68" y="300" width="266" height="70" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="201" y="324" text-anchor="middle" font-weight="700" fill="#1e3a8a">mount / reload / unload</text>
  <text x="201" y="346" text-anchor="middle" fill="#2563eb">改变后续可见贡献</text>
  <text x="201" y="363" text-anchor="middle" fill="#2563eb">卸载时撤销所属 effect</text>

  <rect x="408" y="174" width="144" height="132" rx="10" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="480" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">Agent loop</text>
  <text x="480" y="230" text-anchor="middle" fill="#7c3aed">每个 step 读取</text>
  <text x="480" y="248" text-anchor="middle" fill="#7c3aed">当前模型、提示词</text>
  <text x="480" y="266" text-anchor="middle" fill="#7c3aed">工具与策略</text>
  <text x="480" y="290" text-anchor="middle" font-size="11" fill="#6d28d9">默认驱动插件</text>
  <line x1="366" y1="240" x2="400" y2="240" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="383" y="228" text-anchor="middle" font-size="10" fill="#4b5563">读取</text>

  <rect x="594" y="76" width="330" height="330" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="759" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">耐久事件流 · Session</text>
  <text x="759" y="126" text-anchor="middle" font-size="11" fill="#c2410c">仅追加的已发生事实</text>
  <rect x="626" y="150" width="266" height="42" rx="6" fill="#fff" stroke="#fb923c"/>
  <text x="759" y="176" text-anchor="middle" fill="#9a3412">turn/start · user/message</text>
  <rect x="626" y="204" width="266" height="42" rx="6" fill="#fff" stroke="#fb923c"/>
  <text x="759" y="230" text-anchor="middle" fill="#9a3412">request/header · request/context</text>
  <rect x="626" y="258" width="266" height="42" rx="6" fill="#fff" stroke="#fb923c"/>
  <text x="759" y="284" text-anchor="middle" fill="#9a3412">assistant/* · tool/* · step/end</text>
  <rect x="626" y="318" width="266" height="52" rx="7" fill="#ffedd5" stroke="#fb923c"/>
  <text x="759" y="340" text-anchor="middle" font-weight="700" fill="#9a3412">resume · fork · 请求重建</text>
  <text x="759" y="359" text-anchor="middle" fill="#c2410c">transcript · UI · telemetry</text>
  <line x1="560" y1="240" x2="586" y2="240" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="573" y="218" text-anchor="middle" font-size="10" fill="#4b5563">记录请求</text>
  <text x="573" y="230" text-anchor="middle" font-size="10" fill="#4b5563">事实与结果</text>

  <rect x="36" y="430" width="888" height="42" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="480" y="456" text-anchor="middle" font-size="11" fill="#374151">reload 改变下一 step 读取的活贡献；已经写入 session log 的事实保持不变。</text>
</svg>
