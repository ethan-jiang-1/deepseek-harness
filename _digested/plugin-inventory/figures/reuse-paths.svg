<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="570" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">复用决策树：四条出路按代价排序，写新插件是最后一条</text>

  <rect x="380" y="46" width="200" height="38" rx="19" fill="#1f2937"/>
  <text x="480" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">我要一个能力 X</text>

  <line x1="480" y1="84" x2="480" y2="106" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="310" y="108" width="340" height="42" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="480" y="127" text-anchor="middle" font-weight="700" fill="#374151">① 查货架（01 按组）＋ ② 对横切清单（02 按 profile 暴露）</text>
  <text x="480" y="144" text-anchor="middle" fill="#6b7280">316 包 / 92 个 ctx 服务 / 30 个工具包——先假设它已存在</text>

  <line x1="180" y1="150" x2="180" y2="176" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="150" x2="480" y2="176" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="150" x2="780" y2="176" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="168" fill="#374151">现货＋默认可见</text>
  <text x="520" y="168" fill="#374151">现货但层不对 / 要换实现</text>
  <text x="800" y="168" fill="#374151">没现货</text>

  <rect x="60" y="178" width="240" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="180" y="200" text-anchor="middle" font-weight="700" fill="#166534">直接用，先调配置</text>
  <text x="180" y="218" text-anchor="middle" fill="#14532d">Config 字段就解决的问题别写代码</text>

  <rect x="360" y="178" width="240" height="52" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="480" y="200" text-anchor="middle" font-weight="700" fill="#1e40af">选出路二或三</text>
  <text x="480" y="218" text-anchor="middle" fill="#1e3a8a">换实现不改调用方 / 挂现货包</text>

  <rect x="660" y="178" width="240" height="52" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="780" y="200" text-anchor="middle" font-weight="700" fill="#991b1b">对照缺口清单（03 末节）</text>
  <text x="780" y="218" text-anchor="middle" fill="#7f1d1d">零 Provider seam 与 experimental 面</text>

  <text x="480" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">四条出路（代价从低到高，全部有带行号的真实例子，见 03 页）</text>

  <rect x="36" y="272" width="216" height="130" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="144" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">出路一 · 调配置</text>
  <text x="52" y="318" fill="#14532d">全文搜索：openAt 改 first-search</text>
  <text x="52" y="336" fill="#14532d">溢出：spill-policy.maxInlineTokens</text>
  <text x="52" y="354" fill="#14532d">权限：DSH_PERMISSION_MODE 三档</text>
  <text x="144" y="384" text-anchor="middle" fill="#16a34a">代价：一个字段（L0）</text>

  <rect x="268" y="272" width="216" height="130" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="376" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">出路二 · patch 换 Provider</text>
  <text x="284" y="318" fill="#1e3a8a">搜索换 Exa：disabled＋insert 一对行</text>
  <text x="284" y="336" fill="#1e3a8a">模型可见名不变（web_search 仍叫 web_search）</text>
  <text x="284" y="354" fill="#1e3a8a">llm-pi-ai 休眠挂载，settings 给 routes</text>
  <text x="376" y="384" text-anchor="middle" fill="#2563eb">代价：一两行 patch（L0-L1）</text>

  <rect x="500" y="272" width="216" height="130" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="608" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">出路三 · 挂现成包</text>
  <text x="516" y="318" fill="#78350f">tool-lsp、tool-terminal、</text>
  <text x="516" y="336" fill="#78350f">tool-session-query、mcp-client、</text>
  <text x="516" y="354" fill="#78350f">hooks-codex……货架现货</text>
  <text x="608" y="384" text-anchor="middle" fill="#b45309">代价：一条 add 命令（L1）</text>

  <rect x="732" y="272" width="216" height="130" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="840" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">出路四 · 写胶水插件</text>
  <text x="748" y="318" fill="#4c1d95">样本：tool-present（109 行）</text>
  <text x="748" y="336" fill="#4c1d95">inject 现成服务 ＋ defineTool</text>
  <text x="748" y="354" fill="#4c1d95">name / Config / inject / apply 四件套</text>
  <text x="840" y="384" text-anchor="middle" fill="#7c3aed">代价：一个小模块（L2）</text>

  <line x1="780" y1="230" x2="780" y2="268" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="36" y="426" width="890" height="64" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="52" y="450" font-weight="700" fill="#991b1b">最后一条：自写新插件。先确认真的在缺口清单里——</text>
  <text x="52" y="470" fill="#7f1d1d">ctx.approval / ctx.userQuestions / ctx.authorization 零 Provider；browserUse / computerUse / speechToText 只有 experimental 实现；第三家 LLM 要自写 adapter。写法遵循 capability-seams/00-map 的三角色分装。</text>

  <text x="480" y="520" text-anchor="middle" font-size="11" fill="#6b7280">四条出路正好对齐自用参与阶梯 L0 调配置 → L1 挂现货 → L2 写胶水 → L3 写新 Provider（_faq_on_digested/09）。</text>
  <text x="480" y="544" text-anchor="middle" font-size="11" fill="#9ca3af">例证来源：base/web-app patch 行号、packages/deliverables/tool-present/src/index.ts:23-39、docs/capability-seams.md:617/:633/:652</text>
</svg>
