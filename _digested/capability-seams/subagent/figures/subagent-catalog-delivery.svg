<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Parent Event Log -->
  <rect x="20" y="50" width="200" height="150" fill="#fff9c4" stroke="#333"/>
  <text x="120" y="40" text-anchor="middle" font-weight="bold">Parent Event Log</text>
  <rect x="30" y="70" width="180" height="30" fill="#fff" stroke="#333"/>
  <text x="40" y="90">subagent/catalog (v0/v1/v2)</text>

  <!-- Projection -->
  <rect x="300" y="50" width="150" height="150" fill="#e1f5fe" stroke="#333"/>
  <text x="375" y="40" text-anchor="middle" font-weight="bold">Projection (subagentCatalog)</text>
  <text x="375" y="100" text-anchor="middle">State: dsh-chunked-list</text>
  <text x="375" y="130" text-anchor="middle" font-size="12">权威目录恢复</text>

  <!-- Delivery Routes -->
  <rect x="20" y="250" width="600" height="100" fill="#f0f0f0" stroke="#333"/>
  <text x="320" y="240" text-anchor="middle" font-weight="bold">Host Delivery (Private Protocol)</text>
  <rect x="100" y="270" width="150" height="50" fill="#fff" stroke="#333"/>
  <text x="175" y="300" text-anchor="middle">Queue (New Turn)</text>
  <rect x="450" y="270" width="150" height="50" fill="#fff" stroke="#333"/>
  <text x="525" y="300" text-anchor="middle">Steer (Inject Step)</text>

  <!-- Connections -->
  <line x1="220" y1="125" x2="300" y2="125" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
</svg>
