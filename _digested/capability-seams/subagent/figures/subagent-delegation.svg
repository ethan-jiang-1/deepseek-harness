<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Harness -->
  <rect x="20" y="50" width="120" height="200" fill="#f0f0f0" stroke="#333"/>
  <text x="80" y="40" text-anchor="middle" font-weight="bold">Parent Harness</text>
  <rect x="30" y="100" width="100" height="60" fill="#fff" stroke="#333"/>
  <text x="80" y="135" text-anchor="middle" font-weight="bold">ctx.subagents</text>

  <!-- Delegation -->
  <line x1="140" y1="130" x2="250" y2="130" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="195" y="120" text-anchor="middle">startActivation()</text>

  <!-- Provider Path A -->
  <rect x="250" y="50" width="150" height="80" fill="#e8f5e9" stroke="#333"/>
  <text x="325" y="70" text-anchor="middle" font-weight="bold">Local Child Process</text>
  <text x="325" y="100" text-anchor="middle" font-size="12">Continuable via send_message</text>

  <!-- Provider Path B -->
  <rect x="250" y="170" width="150" height="80" fill="#fff3e0" stroke="#333"/>
  <text x="325" y="190" text-anchor="middle" font-weight="bold">External Provider</text>
  <text x="325" y="220" text-anchor="middle" font-size="12">Execute-once (e.g. CLI)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
</svg>
