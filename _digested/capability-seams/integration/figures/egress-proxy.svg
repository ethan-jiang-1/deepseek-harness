<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Harness -->
  <rect x="20" y="50" width="120" height="200" fill="#f0f0f0" stroke="#333"/>
  <text x="80" y="40" text-anchor="middle" font-weight="bold">Local Harness</text>
  <rect x="30" y="80" width="100" height="100" fill="#fff" stroke="#333"/>
  <text x="80" y="135" text-anchor="middle" font-weight="bold">Global Fetch</text>

  <!-- Dispatcher (The Proxy Library) -->
  <rect x="250" y="100" width="200" height="100" fill="#fff9c4" stroke="#333"/>
  <text x="350" y="145" text-anchor="middle" font-weight="bold">Global Dispatcher (Proxy Lib)</text>
  <text x="350" y="165" text-anchor="middle" font-size="12">解析环境变量 &amp; 选路</text>

  <!-- Outside -->
  <rect x="550" y="100" width="100" height="100" fill="#e8f5e9" stroke="#333"/>
  <text x="600" y="155" text-anchor="middle">Internet / Proxy</text>

  <!-- Connections -->
  <line x1="130" y1="130" x2="250" y2="130" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="450" y1="130" x2="550" y2="130" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Watchpoint -->
  <circle cx="350" cy="190" r="10" fill="red"/>
  <text x="350" y="230" text-anchor="middle" font-size="12">Watchpoint: 代理配置校验</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
</svg>
