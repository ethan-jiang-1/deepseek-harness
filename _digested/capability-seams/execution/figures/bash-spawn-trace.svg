<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="system-ui, -apple-system, sans-serif" font-size="11">
  <rect width="1000" height="450" fill="#ffffff" rx="10"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bash 架构防御链：深度诊断视图</text>

  <!-- Layer 1: 准入 -->
  <rect x="30" y="60" width="180" height="350" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="120" y="90" text-anchor="middle" font-weight="700" fill="#9a3412">1. 准入</text>
  <text x="120" y="110" text-anchor="middle" fill="#c2410c">tools/pre-execute</text>
  <text x="40" y="140" fill="#9a3412" font-weight="600">Watchpoints:</text>
  <text x="40" y="160" fill="#475569">• 谁拒绝了? (Allow/Deny)</text>
  <text x="40" y="180" fill="#475569">• 审批是否挂在该层?</text>
  <text x="40" y="200" fill="#475569">• Pipeline 委托逻辑?</text>

  <!-- Layer 2: 审批 -->
  <rect x="220" y="60" width="180" height="350" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="310" y="90" text-anchor="middle" font-weight="700" fill="#9a3412">2. 审批</text>
  <text x="310" y="110" text-anchor="middle" fill="#c2410c">ctx.approval</text>
  <text x="230" y="140" fill="#9a3412" font-weight="600">Watchpoints:</text>
  <text x="230" y="160" fill="#475569">• 升权 targets 是否匹配?</text>
  <text x="230" y="180" fill="#475569">• 审批链条是否中断?</text>

  <!-- Layer 3: 解析 -->
  <rect x="410" y="60" width="180" height="350" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="500" y="90" text-anchor="middle" font-weight="700" fill="#1e40af">3. 解析</text>
  <text x="500" y="110" text-anchor="middle" fill="#2563eb">ctx.shell.resolve</text>
  <text x="420" y="140" fill="#1e40af" font-weight="600">Watchpoints:</text>
  <text x="420" y="160" fill="#475569">• Spec 生成是否合法?</text>
  <text x="420" y="180" fill="#475569">• 默认化(Defaulting)逻辑?</text>

  <!-- Layer 4: 遏制 -->
  <rect x="600" y="60" width="180" height="350" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="690" y="90" text-anchor="middle" font-weight="700" fill="#166534">4. 遏制</text>
  <text x="690" y="110" text-anchor="middle" fill="#15803d">ctx.sandbox.confine</text>
  <text x="610" y="140" fill="#166534" font-weight="600">Watchpoints:</text>
  <text x="610" y="160" fill="#475569">• 策略(Policy)是否注入?</text>
  <text x="610" y="180" fill="#475569">• 平台 native 实现?</text>

  <!-- Layer 5: 执行 -->
  <rect x="790" y="60" width="180" height="350" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="880" y="90" text-anchor="middle" font-weight="700" fill="#374151">5. 执行</text>
  <text x="880" y="110" text-anchor="middle" fill="#4b5563">ctx.subprocess.spawn</text>
  <text x="800" y="140" fill="#374151" font-weight="600">Watchpoints:</text>
  <text x="800" y="160" fill="#475569">• 退出码语义(Logical/Fatal)?</text>
  <text x="800" y="180" fill="#475569">• 资源清理时序(Race)?</text>
  <text x="800" y="200" fill="#475569">• 僵尸进程(Orphan)?</text>
</svg>
