<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="460" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">远程执行世界与本地 argv confinement 是两种机制</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Consumer 依赖 Definition；组合层选择相互一致的 provider。</text>

  <rect x="30" y="72" width="435" height="306" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="247" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">E2B：共享远程生命周期 owner</text>
  <rect x="150" y="120" width="195" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="247" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">ctx.e2b</text>
  <text x="247" y="164" text-anchor="middle" font-size="11" fill="#2563eb">同一个 SDK sandbox handle</text>
  <line x1="205" y1="178" x2="140" y2="210" stroke="#4b5563" marker-end="url(#arr)"/>
  <line x1="290" y1="178" x2="355" y2="210" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="52" y="214" width="175" height="70" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="139" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">fs-e2b → ctx.fs</text>
  <text x="139" y="262" text-anchor="middle" font-size="11" fill="#15803d">远程 Linux 目录树</text>
  <rect x="267" y="214" width="175" height="70" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="354" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">subprocess-e2b</text>
  <text x="354" y="262" text-anchor="middle" font-size="11" fill="#15803d">→ ctx.subprocess</text>
  <text x="247" y="316" text-anchor="middle" font-size="12" fill="#1e3a8a">两者等待同一 handle，因而共享目录与进程世界。</text>
  <text x="247" y="342" text-anchor="middle" font-size="11" fill="#2563eb">Host 上的 agent、session、LLM 与日志不会迁入 E2B。</text>

  <rect x="495" y="72" width="435" height="306" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="712" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">本地 confinement：只包装一次 spawn</text>
  <rect x="592" y="120" width="240" height="54" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="712" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">ctx.shell（sandbox provider）</text>
  <text x="712" y="161" text-anchor="middle" font-size="11" fill="#7c3aed">已解析的 ShellExecSpec</text>
  <line x1="712" y1="174" x2="712" y2="202" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="592" y="206" width="240" height="58" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="712" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">ctx.sandbox.confine(argv, policy)</text>
  <text x="712" y="250" text-anchor="middle" font-size="11" fill="#991b1b">bwrap / Landlock / Seatbelt / ACL argv</text>
  <line x1="712" y1="264" x2="712" y2="292" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="592" y="296" width="240" height="54" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="712" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">ctx.subprocess.spawn(wrapped)</text>
  <text x="712" y="338" text-anchor="middle" font-size="11" fill="#15803d">创建受约束的本地进程</text>
  <text x="712" y="366" text-anchor="middle" font-size="11" fill="#9a3412">它不绑定或迁移 ctx.fs，也不等于远程执行世界。</text>

  <rect x="30" y="398" width="900" height="38" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="422" text-anchor="middle" font-size="12" fill="#374151">远程组合换 fs + subprocess provider；本地 sandbox 只改变 shell spawn 的 argv。两者都不要求 Consumer fork 实现。</text>
</svg>
