<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">执行世界：fs 与 subprocess 绑在一起。换沙箱，Bash / PTY / LSP 一起走</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">不要为远程环境再 fork 一份 bash provider。指向同一个执行世界即可。</text>

  <rect x="80" y="80" width="800" height="70" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="480" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">Consumers（模型看见的工具，不关心人在哪）</text>
  <text x="480" y="132" text-anchor="middle" font-size="12" fill="#7c3aed">Bash tool · 文件 tools · 终端 tools · lsp tool</text>

  <line x1="240" y1="150" x2="240" y2="178" stroke="#4b5563" marker-end="url(#arr)"/>
  <line x1="480" y1="150" x2="480" y2="178" stroke="#4b5563" marker-end="url(#arr)"/>
  <line x1="720" y1="150" x2="720" y2="178" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="80" y="182" width="230" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="195" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">ctx.shell</text>
  <text x="195" y="232" text-anchor="middle" font-size="11" fill="#2563eb">本地实现经 ctx.subprocess spawn</text>
  <rect x="365" y="182" width="230" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="480" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">ctx.fs</text>
  <text x="480" y="232" text-anchor="middle" font-size="11" fill="#2563eb">同一棵目录树 / 同一沙箱</text>
  <rect x="650" y="182" width="230" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="765" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">ctx.terminals / ctx.lsp</text>
  <text x="765" y="232" text-anchor="middle" font-size="11" fill="#2563eb">PTY 与语言服务跟过去</text>

  <line x1="480" y1="252" x2="480" y2="280" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="200" y="284" width="560" height="80" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="480" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">一个执行世界</text>
  <text x="480" y="336" text-anchor="middle" font-size="12" fill="#15803d">本地机器  ·  或  bwrap/Landlock/Seatbelt  ·  或  远程 sandbox / E2B</text>
  <text x="480" y="354" text-anchor="middle" font-size="11" fill="#14532d">ctx.sandbox 在 spawn 前包装 argv。Consumer 不为每种后端各写一份。</text>

  <text x="480" y="392" text-anchor="middle" font-size="12" fill="#374151">subagent 同样：一个接口后面可以是进程内 child，也可以把一轮委托给另一个产品。</text>
</svg>
