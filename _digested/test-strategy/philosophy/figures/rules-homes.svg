<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">测试规则、执行与证据的归属</title>
  <desc id="desc">政策说明所需证据，脚本与工作流执行检查，树内指令维护资产，技能指导选择和可靠性。评审仍需检查需求及独立结果。</desc>
  <rect width="960" height="530" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">测试规则按职责维护，引用指向各自的家</text>
  <text x="480" y="56" text-anchor="middle" fill="#4b5563">政策、实际执行、场景资产与评审分别取证；规则写在文档里不代表已经运行。</text>

  <rect x="35" y="80" width="280" height="150" rx="10" fill="#e6f4ff" stroke="#1677ff"/>
  <text x="55" y="107" font-size="14" font-weight="700" fill="#1d4ed8">政策与常备指令</text>
  <text x="55" y="135" fill="#374151">docs/testing.md：分层与必需证据</text>
  <text x="55" y="159" fill="#374151">root / packages AGENTS.md：</text>
  <text x="55" y="181" fill="#374151">范围内要求，链接详细维护处</text>
  <text x="55" y="209" fill="#4b5563">回答：什么结论需要什么证据？</text>

  <rect x="340" y="80" width="280" height="150" rx="10" fill="#f6ffed" stroke="#52c41a"/>
  <text x="360" y="107" font-size="14" font-weight="700" fill="#38761c">实际执行</text>
  <text x="360" y="135" fill="#374151">package.json：命令入口</text>
  <text x="360" y="159" fill="#374151">scripts/run-gates.ts：依赖与结果</text>
  <text x="360" y="181" fill="#374151">workflows：平台、条件与凭据</text>
  <text x="360" y="209" fill="#4b5563">回答：检查是否选中并真正运行？</text>

  <rect x="645" y="80" width="280" height="150" rx="10" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="665" y="107" font-size="14" font-weight="700" fill="#ad6800">场景资产与局部行为</text>
  <text x="665" y="135" fill="#374151">snapshots/AGENTS.md：资产归属</text>
  <text x="665" y="159" fill="#374151">包 README / owning tests：</text>
  <text x="665" y="181" fill="#374151">具体行为、场景和独立期望</text>
  <text x="665" y="209" fill="#4b5563">回答：期望由谁维护，比较什么？</text>

  <rect x="35" y="252" width="430" height="124" rx="10" fill="#fff" stroke="#9ca3af"/>
  <text x="55" y="280" font-size="14" font-weight="700" fill="#374151">按需读取的操作方法</text>
  <text x="55" y="309" fill="#374151">dsh-pre-push-checks：按变更选择本地检查</text>
  <text x="55" y="333" fill="#374151">dsh-ci-test-reliability：资源、并发与清理</text>
  <text x="55" y="357" fill="#4b5563">cookbook 提供操作步骤；不复制完整政策和清单。</text>

  <rect x="490" y="252" width="435" height="124" rx="10" fill="#fff" stroke="#9ca3af"/>
  <text x="510" y="280" font-size="14" font-weight="700" fill="#374151">设计与事故依据</text>
  <text x="510" y="309" fill="#374151">Agent Notes：设计取舍及理由</text>
  <text x="510" y="333" fill="#374151">postmortem：故障、证据与防止复发的要求</text>
  <text x="510" y="357" fill="#4b5563">当前行为与已执行检查，仍回到政策和实现核对。</text>

  <rect x="35" y="401" width="890" height="99" rx="10" fill="#fff" stroke="#d4380d" stroke-dasharray="6 3"/>
  <text x="55" y="429" font-size="13" font-weight="700" fill="#a8071a">诊断点：规则存在、检查通过和成果合格是不同事实</text>
  <text x="55" y="454" fill="#374151">漏跑检查查执行入口；快照归属查树内指令；需求与领域结果由独立验收判断。</text>
  <text x="55" y="478" fill="#374151">页内导航见 execution/06-dsh-testing-rules-ownership.md；机制细节链接各自维护处。</text>
</svg>
