<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">固定模型决策，重新执行并独立比较</title>
  <desc id="desc">replay 只读比较；refresh 保留模型流并更新当前期望；record 获取新模型流。两种写模式遵守世代所有权，均不改写独立工作区期望。回放不验证当前模型的新选择。</desc>
  <defs>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="690" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">会话快照：模型流固定，当前应用重新执行</text>
  <text x="480" y="55" text-anchor="middle" fill="#4b5563">已录制的选择用于回归；当前模型怎样理解新 prompt / skill，仍需真实模型任务。</text>

  <rect x="40" y="77" width="880" height="116" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="103" font-size="13" font-weight="700" fill="#374151">场景资产与比较</text>
  <text x="60" y="127" fill="#374151">Session 提供任务与模型流 → dsh profile 重跑 loop、工具、输入装配、日志和工作区操作</text>
  <text x="60" y="151" fill="#374151">实际请求 ↔ prompt / schema sidecar；当前日志与接口输出 ↔ 规范化期望</text>
  <text x="60" y="175" font-weight="700" fill="#a8071a">外部最终树 ↔ 独立 workspace.expected/；工具返回成功不能代替文件结果</text>

  <line x1="190" y1="194" x2="190" y2="224" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="480" y1="194" x2="480" y2="224" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="770" y1="194" x2="770" y2="224" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-s)"/>

  <rect x="40" y="230" width="280" height="224" rx="10" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="180" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#38761c">replay · 比较</text>
  <text x="60" y="290" fill="#374151">默认模式，不请求模型 API</text>
  <text x="60" y="316" fill="#374151">录制流中的工具名称、参数固定</text>
  <text x="60" y="342" fill="#374151">当前工具真实运行，比较实际输入、</text>
  <text x="60" y="364" fill="#374151">日志、接口输出与工作区</text>
  <text x="60" y="396" font-weight="700" fill="#1d4e13">不写提交期望，可受控并发</text>
  <text x="60" y="426" fill="#4b5563">通过范围：这一条已知决策轨迹</text>

  <rect x="340" y="230" width="280" height="224" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="480" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">refresh · 生产期望</text>
  <text x="360" y="290" fill="#374151">使用原模型流，不请求模型 API</text>
  <text x="360" y="316" fill="#374151">用于决策轨迹仍然有效的变化</text>
  <text x="360" y="342" fill="#374151">可按政策更新当前 writer 日志、</text>
  <text x="360" y="364" fill="#374151">sidecar 和对应输出</text>
  <text x="360" y="396" font-weight="700" fill="#1e3a8a">串行写入，每个差异都要审查</text>
  <text x="360" y="426" fill="#4b5563">不建立新的模型行为结论</text>

  <rect x="640" y="230" width="280" height="224" rx="10" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="780" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#ad6800">record · 获取新模型流</text>
  <text x="660" y="290" fill="#374151">可录制场景调用真实 provider</text>
  <text x="660" y="316" fill="#374151">需要凭据，串行使用模型 API</text>
  <text x="660" y="342" fill="#374151">按政策写当前格式录制与期望</text>
  <text x="660" y="364" fill="#374151">编写场景与显式历史输入不重录</text>
  <text x="660" y="396" font-weight="700" fill="#7c2d12">新输出仍需独立验收和审查</text>
  <text x="660" y="426" fill="#4b5563">录制成功不等于任务合格</text>

  <rect x="40" y="478" width="880" height="86" rx="10" fill="#fff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="60" y="503" font-size="13" font-weight="700" fill="#374151">世代与所有权</text>
  <text x="60" y="526" fill="#374151">选择数值最高的保留世代；普通 owner 可更新当前 writer 输出，前代文件保留。</text>
  <text x="60" y="549" fill="#374151">显式历史 Session 输入冻结；共享引用只读。写新代不能重命名或删除前代。</text>

  <rect x="40" y="586" width="880" height="78" rx="10" fill="#fff" stroke="#d4380d" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="60" y="611" font-size="13" font-weight="700" fill="#a8071a">诊断点：刷新变绿之前，先判断变化是否符合需求</text>
  <text x="60" y="634" fill="#374151">record / refresh 都不改写 workspace.expected/；独立判据由需求拥有者审查。</text>
  <text x="60" y="654" fill="#374151">工具缺失查装配与输入；文件错误查外部树；新方法是否有效查当前模型任务。</text>
</svg>
