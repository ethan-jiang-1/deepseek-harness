<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">CI 结果必须区分不同跳过和失败</title>
  <desc id="desc">缺凭据的本地跳过、可信事件的凭据预检失败、gate 依赖跳过、必需 job 聚合和观察性结果具有不同含义。自动化不捕获所有遗漏。</desc>
  <rect width="960" height="470" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">CI 结果的含义取决于执行条件与聚合范围</text>
  <text x="480" y="56" text-anchor="middle" fill="#4b5563">未运行不构成行为证据；各检查只执行已登记的判据，不能自动发现全部遗漏。</text>

  <rect x="25" y="80" width="170" height="238" rx="10" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="110" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#ad6800">允许的无 key 跳过</text>
  <text x="40" y="140" fill="#374151">本地 / secretless</text>
  <text x="40" y="164" fill="#374151">真实 API suite 可跳过</text>
  <text x="40" y="194" fill="#374151">不可信 PR 的模型 job</text>
  <text x="40" y="218" fill="#374151">可按条件不运行</text>
  <text x="40" y="263" fill="#7c2d12">结论：未获模型证据</text>
  <text x="40" y="290" fill="#4b5563">来源：e2e 配置与 workflow</text>

  <rect x="210" y="80" width="170" height="238" rx="10" fill="#fff1f0" stroke="#d4380d"/>
  <text x="295" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#a8071a">可信 job 缺 key</text>
  <text x="225" y="140" fill="#374151">job 应获授权凭据</text>
  <text x="225" y="164" fill="#374151">预检发现凭据缺失</text>
  <text x="225" y="194" fill="#374151">使 job 明确失败</text>
  <text x="225" y="218" fill="#374151">避免全跳过后报成功</text>
  <text x="225" y="263" fill="#a8071a">结论：配置未满足</text>
  <text x="225" y="290" fill="#4b5563">来源：e2e.yml preflight</text>

  <rect x="395" y="80" width="170" height="238" rx="10" fill="#e6f4ff" stroke="#1677ff"/>
  <text x="480" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">gate 依赖跳过</text>
  <text x="410" y="140" fill="#374151">依赖失败或 fail-fast</text>
  <text x="410" y="164" fill="#374151">会记录 gate 为 skipped</text>
  <text x="410" y="194" fill="#374151">阻塞 gate 失败 / 跳过</text>
  <text x="410" y="218" fill="#374151">使 aggregate 失败</text>
  <text x="410" y="263" fill="#1d4ed8">结论：检查未完成</text>
  <text x="410" y="290" fill="#4b5563">来源：run-gates.ts</text>

  <rect x="580" y="80" width="170" height="238" rx="10" fill="#f6ffed" stroke="#52c41a"/>
  <text x="665" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#38761c">PR 必需 job 聚合</text>
  <text x="595" y="140" fill="#374151">verdict 检查 needs</text>
  <text x="595" y="164" fill="#374151">列出的失败 / 取消 /</text>
  <text x="595" y="194" fill="#374151">跳过使 verdict 失败</text>
  <text x="595" y="218" fill="#374151">依其运行条件执行</text>
  <text x="595" y="263" fill="#38761c">范围：已列依赖 job</text>
  <text x="595" y="290" fill="#4b5563">来源：ci.yml</text>

  <rect x="765" y="80" width="170" height="238" rx="10" fill="#f9f0ff" stroke="#722ed1"/>
  <text x="850" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#531dab">显式观察性结果</text>
  <text x="780" y="140" fill="#374151">gate 声明 allowFailure</text>
  <text x="780" y="164" fill="#374151">保留失败结果</text>
  <text x="780" y="194" fill="#374151">不使所属聚合失败</text>
  <text x="780" y="218" fill="#374151">不能算阻塞验收通过</text>
  <text x="780" y="263" fill="#531dab">范围：显式允许项</text>
  <text x="780" y="290" fill="#4b5563">来源：run-gates.ts</text>

  <rect x="25" y="346" width="910" height="96" rx="10" fill="#fff" stroke="#d4380d" stroke-dasharray="6 3"/>
  <text x="45" y="374" font-size="13" font-weight="700" fill="#a8071a">诊断点：成功退出后，仍核对目标用例是否实际执行、结果由什么判据决定</text>
  <text x="45" y="400" fill="#374151">名称过滤、平台条件和缺依赖可能留下空缺；报告实际运行与跳过，需求和成果另行验收。</text>
  <text x="45" y="423" fill="#374151">完整语义见 execution/07-dsh-ci-gates-and-reliability.md；本图不承诺全部漏测自动判红。</text>
</svg>
