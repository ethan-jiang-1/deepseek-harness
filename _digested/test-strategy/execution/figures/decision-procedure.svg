<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" role="img" aria-labelledby="title desc">
  <title id="title">按改变的行为选择测试证据</title>
  <desc id="desc">先定位消费者，再选择检查，核对独立判据，检查实际效果，报告已获与缺失证据。负控用于相关守卫和回归，无需每次破坏全部测试。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">从改变的行为出发，选择能观察目标失败的检查</text>
  <text x="480" y="57" text-anchor="middle" fill="#4b5563">代码、YAML、persona 和 skill Markdown 都可能改变产品；文件后缀不能决定证据层级。</text>

  <rect x="20" y="94" width="168" height="191" rx="10" fill="#e6f4ff" stroke="#1677ff"/>
  <text x="104" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">定位消费者</text>
  <text x="35" y="153" fill="#374151">配置、Loader、更新</text>
  <text x="35" y="177" fill="#374151">模型输入、工具执行</text>
  <text x="35" y="201" fill="#374151">持久化与领域交付</text>
  <text x="35" y="244" fill="#4b5563">写清预期与失败状态</text>

  <line x1="190" y1="185" x2="204" y2="185" stroke="#6b7280" marker-end="url(#arrow)"/>
  <rect x="208" y="94" width="168" height="191" rx="10" fill="#e6f4ff" stroke="#1677ff"/>
  <text x="292" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">选择观察方式</text>
  <text x="223" y="153" fill="#374151">最低且看得见失败</text>
  <text x="223" y="177" fill="#374151">局部 / 真实组合 / 产物</text>
  <text x="223" y="201" fill="#374151">回放 / 真实模型</text>
  <text x="223" y="244" fill="#4b5563">补齐政策要求的层</text>

  <line x1="378" y1="185" x2="392" y2="185" stroke="#6b7280" marker-end="url(#arrow)"/>
  <rect x="396" y="94" width="168" height="191" rx="10" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="480" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#ad6800">核对独立判据</text>
  <text x="411" y="153" fill="#374151">需求、外部规则、计算</text>
  <text x="411" y="177" fill="#374151">不能仅从实现生成期望</text>
  <text x="411" y="201" fill="#374151">守卫以拒绝样例取证</text>
  <text x="411" y="244" fill="#4b5563">针对目标回归验证会红</text>

  <line x1="566" y1="185" x2="580" y2="185" stroke="#6b7280" marker-end="url(#arrow)"/>
  <rect x="584" y="94" width="168" height="191" rx="10" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="668" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#ad6800">检查实际效果</text>
  <text x="599" y="153" fill="#374151">真实请求、外部文件</text>
  <text x="599" y="177" fill="#374151">协议、持久化和成果</text>
  <text x="599" y="201" fill="#374151">核对来源与领域计算</text>
  <text x="599" y="244" fill="#4b5563">完成自述不代替结果</text>

  <line x1="754" y1="185" x2="768" y2="185" stroke="#6b7280" marker-end="url(#arrow)"/>
  <rect x="772" y="94" width="168" height="191" rx="10" fill="#f6ffed" stroke="#52c41a"/>
  <text x="856" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#38761c">报告证据与空缺</text>
  <text x="787" y="153" fill="#374151">命令、版本、运行模式</text>
  <text x="787" y="177" fill="#374151">实际通过、过滤与跳过</text>
  <text x="787" y="201" fill="#374151">未测条件及原因</text>
  <text x="787" y="244" fill="#4b5563">分清源码与产物入口</text>

  <rect x="20" y="310" width="920" height="140" rx="10" fill="#fff" stroke="#d4380d" stroke-dasharray="6 3"/>
  <text x="40" y="338" font-size="13" font-weight="700" fill="#a8071a">诊断点：通过的那一层，是否足以支持所声称的结论？</text>
  <text x="40" y="364" fill="#374151">方法到达、运行执行、模型选择和成果质量分别观察；内部 verifier 也是被测产品的一部分。</text>
  <text x="40" y="389" fill="#374151">负控用于相关守卫和目标回归，不要求每次变更都重新破坏全部已有测试。</text>
  <text x="40" y="414" fill="#374151">建议成对检查缺资料时不编造、资料齐全时能完成；回放不能证明新模型决策。</text>
  <text x="40" y="436" fill="#4b5563">完整决策说明见 execution/05-dsh-testing-decision-procedure.md。</text>
</svg>
