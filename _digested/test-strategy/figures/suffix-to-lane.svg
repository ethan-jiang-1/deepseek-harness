<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">后缀即层：文件名 + 目录唯一决定一个测试文件属于哪条车道</text>
  <text x="480" y="54" text-anchor="middle" font-size="11" fill="#6b7280">8 份根部 vitest 配置各自认领自己的 include 模式；层的边界在 include/exclude 文法里互斥。</text>

  <text x="180" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">文件名后缀（+ 所在目录）</text>
  <text x="510" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">选中它的配置</text>
  <text x="800" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">宪法层</text>

  <!-- row 1 -->
  <rect x="30" y="98" width="300" height="50" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="46" y="119" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.spec.{ts,tsx}</text>
  <text x="46" y="137" fill="#666">packages · apps · scripts · website</text>
  <line x1="332" y1="123" x2="392" y2="123" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="98" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.config.ts</text>
  <line x1="628" y1="123" x2="688" y2="123" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="98" width="240" height="50" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="812" y="128" text-anchor="middle" font-weight="700" fill="#1677ff">Unit + 覆盖率</text>

  <!-- row 2 -->
  <rect x="30" y="158" width="300" height="50" rx="8" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="46" y="179" fill="#ad6800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.e2e.ts</text>
  <text x="46" y="197" fill="#666">packages/*/*/tests · apps/{cli,desktop}/tests</text>
  <line x1="332" y1="183" x2="392" y2="183" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="158" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="188" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.e2e.config.ts</text>
  <line x1="628" y1="183" x2="688" y2="183" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="158" width="240" height="50" rx="8" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="812" y="188" text-anchor="middle" font-weight="700" fill="#fa8c16">Real-API e2e</text>

  <!-- row 3 -->
  <rect x="30" y="218" width="300" height="50" rx="8" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.5"/>
  <text x="46" y="239" fill="#531dab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.expected.e2e.ts</text>
  <text x="46" y="257" fill="#666">apps/cli/tests（18 个驱动）</text>
  <line x1="332" y1="243" x2="392" y2="243" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="218" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.expected.config.ts</text>
  <line x1="628" y1="243" x2="688" y2="243" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="218" width="240" height="50" rx="8" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.5"/>
  <text x="812" y="248" text-anchor="middle" font-weight="700" fill="#722ed1">Owner-local expected</text>

  <!-- row 4 -->
  <rect x="30" y="278" width="300" height="50" rx="8" fill="#fff1f0" stroke="#d4380d" stroke-width="1.5"/>
  <text x="46" y="299" fill="#a8071a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.snapshot.ts + *.corpus.ts</text>
  <text x="46" y="317" fill="#666">snapshots/** · scripts/session-snapshot-corpus</text>
  <line x1="332" y1="303" x2="392" y2="303" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="278" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.snapshot.config.ts</text>
  <line x1="628" y1="303" x2="688" y2="303" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="278" width="240" height="50" rx="8" fill="#fff1f0" stroke="#d4380d" stroke-width="1.5"/>
  <text x="812" y="308" text-anchor="middle" font-weight="700" fill="#d4380d">Snapshot（keyless 回放）</text>

  <!-- row 5 -->
  <rect x="30" y="338" width="300" height="50" rx="8" fill="#f5f5f5" stroke="#595959" stroke-width="1.5"/>
  <text x="46" y="359" fill="#434343" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.e2e.ts / *.snapshot.ts</text>
  <text x="46" y="377" fill="#666">apps/web/tests + inspector client-browser</text>
  <line x1="332" y1="363" x2="392" y2="363" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="338" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="368" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.web.config.ts</text>
  <line x1="628" y1="363" x2="688" y2="363" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="338" width="240" height="50" rx="8" fill="#f5f5f5" stroke="#595959" stroke-width="1.5"/>
  <text x="812" y="368" text-anchor="middle" font-weight="700" fill="#434343">Web 浏览器快照</text>

  <!-- row 6 -->
  <rect x="30" y="398" width="300" height="50" rx="8" fill="#e6fffb" stroke="#13c2c2" stroke-width="1.5"/>
  <text x="46" y="419" fill="#006d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.perf.ts / *.perf.client.ts</text>
  <text x="46" y="437" fill="#666">apps/web/tests · packages/client/ui-conversation</text>
  <line x1="332" y1="423" x2="392" y2="423" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="398" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="428" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.web.perf.config.ts</text>
  <line x1="628" y1="423" x2="688" y2="423" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="398" width="240" height="50" rx="8" fill="#e6fffb" stroke="#13c2c2" stroke-width="1.5"/>
  <text x="812" y="428" text-anchor="middle" font-weight="700" fill="#13c2c2">Web perf（手动诊断）</text>

  <!-- row 7 -->
  <rect x="30" y="458" width="300" height="50" rx="8" fill="#fffbe6" stroke="#fadb14" stroke-width="1.5"/>
  <text x="46" y="479" fill="#854a0e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.stress.ts</text>
  <text x="46" y="497" fill="#666">apps/web/stress-tests（1 个）</text>
  <line x1="332" y1="483" x2="392" y2="483" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="458" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="488" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.web-stress.config.ts</text>
  <line x1="628" y1="483" x2="688" y2="483" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="458" width="240" height="50" rx="8" fill="#fffbe6" stroke="#fadb14" stroke-width="1.5"/>
  <text x="812" y="488" text-anchor="middle" font-weight="700" fill="#854a0e">Web stress（opt-in）</text>

  <!-- row 8 -->
  <rect x="30" y="518" width="300" height="50" rx="8" fill="#fff0f6" stroke="#eb2f96" stroke-width="1.5"/>
  <text x="46" y="539" fill="#c41d7f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">*.bench.ts / *.bench.client.ts</text>
  <text x="46" y="557" fill="#666">benchmarks/**（5 Host + 2 Client）</text>
  <line x1="332" y1="543" x2="392" y2="543" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="518" width="230" height="50" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="511" y="548" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">vitest.bench.config.ts</text>
  <line x1="628" y1="543" x2="688" y2="543" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="692" y="518" width="240" height="50" rx="8" fill="#fff0f6" stroke="#eb2f96" stroke-width="1.5"/>
  <text x="812" y="548" text-anchor="middle" font-weight="700" fill="#c41d7f">CI 性能门禁</text>

  <!-- exclusions + harness note -->
  <rect x="30" y="584" width="902" height="40" rx="8" fill="#fff" stroke="#d4380d" stroke-dasharray="5 3"/>
  <text x="46" y="609" fill="#a8071a">互斥标注：e2e 配置显式 exclude *.expected.e2e.ts（归 expected 层）与 inspector 的 client-browser.e2e.ts（归 web 层）</text>
  <rect x="30" y="632" width="902" height="36" rx="8" fill="#f5f5f5" stroke="#9ca3af" stroke-dasharray="5 3"/>
  <text x="46" y="655" fill="#4b5563">特例：各包的 tests/harness.ts（8 个共享 fixture）刻意不被任何 include 选中——import 它不会重复注册别人的 describe 或重复真实 API 调用</text>
</svg>
