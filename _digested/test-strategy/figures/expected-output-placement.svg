<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">期望输出放哪：一条判定链</text>
  <text x="480" y="54" text-anchor="middle" font-size="11" fill="#6b7280">规则的家：snapshots/AGENTS.md 与 apps/cli/tests/profiles/AGENTS.md；分界线是"证据是否由录制会话驱动"。</text>

  <!-- root question -->
  <rect x="330" y="72" width="300" height="56" rx="10" fill="#fff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1677ff">这份期望输出由什么驱动？</text>
  <text x="480" y="116" text-anchor="middle" fill="#666">（提交前先回答这一问）</text>

  <!-- branch elbows -->
  <polyline points="480,128 480,152 240,152 240,176" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow-p)"/>
  <polyline points="480,128 480,152 720,152 720,176" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow-p)"/>
  <polyline points="480,128 480,352" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow-p)"/>

  <!-- left child: recorded session -->
  <rect x="48" y="180" width="384" height="128" rx="10" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="64" y="206" font-weight="700" fill="#38761c">是 —— 录制 Session 双角色场景（无 key 回放往返）</text>
  <text x="64" y="230" fill="#333">→ 顶层 snapshots/ 树（唯一收留形态）</text>
  <text x="64" y="250" fill="#333">四面：session 122 · sdk 24 · acp 9 · web 55</text>
  <text x="64" y="270" fill="#333">committed JSONL 身兼回放输入与预期输出</text>
  <text x="64" y="292" fill="#666" font-size="11">CI 统一回放=全局门；record/refresh 只有 owner 本人才写</text>

  <!-- right child: no round trip -->
  <rect x="528" y="180" width="384" height="128" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.5"/>
  <text x="544" y="206" font-weight="700" fill="#531dab">否 —— 无录制往返：按期望的 owner 落位</text>
  <text x="544" y="230" fill="#333">跨包 profile 行为 → apps/cli/tests/profiles/</text>
  <text x="544" y="250" fill="#333">包特定组装 → 该包 tests/fixtures/</text>
  <text x="544" y="270" fill="#333">其他组装期望（CLI/进程）→ owner 的 tests/expected/</text>
  <text x="544" y="292" fill="#666" font-size="11">*.expected.e2e.ts 驱动；跑在 owner 自己的 lane</text>

  <!-- third child: user overlay -->
  <rect x="252" y="352" width="456" height="76" rx="10" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="268" y="378" font-weight="700" fill="#ad6800">用户可选 overlay —— 产品资产，不是测试夹具</text>
  <text x="268" y="400" fill="#333">→ apps/cli/config/examples/ —— 须配 docs/user/ 使用指南</text>
  <text x="268" y="420" fill="#666" font-size="11">（走产品文档面，不进任何测试树）</text>

  <!-- footer -->
  <rect x="48" y="452" width="864" height="88" rx="10" fill="#fff" stroke="#d4380d" stroke-dasharray="6 3"/>
  <text x="64" y="478" font-weight="700" fill="#a8071a">分界线：证据是否由录制会话驱动 —— 这条分界同时决定 CI 成本归属</text>
  <text x="64" y="502" fill="#333">顶层 snapshots/ 的回放是全局门（每个 PR 无 key 跑）；owner-local 期望跑在 owner 自己的 lane</text>
  <text x="64" y="524" fill="#333">命名即所有权：文件名带 golden 会触发 expected-filenames.yml 强制改名 expected</text>
</svg>
