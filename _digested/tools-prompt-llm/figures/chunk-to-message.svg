<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="340" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">流：llm.stream → assistant/chunk* → BlockAssembler → assistant/message</text>
  <rect x="30" y="56" width="170" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="115" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">agent/request</text>
  <text x="115" y="106" text-anchor="middle" font-size="11" fill="#2563eb">waterfall 改请求</text>
  <line x1="200" y1="91" x2="228" y2="91" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="230" y="56" width="170" height="70" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="315" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">llm.stream</text>
  <text x="315" y="106" text-anchor="middle" font-size="11" fill="#4338ca">adapter 流出 chunk</text>
  <line x1="400" y1="91" x2="428" y2="91" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="430" y="56" width="200" height="70" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="530" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">每 chunk append</text>
  <text x="530" y="106" text-anchor="middle" font-size="11" fill="#15803d">assistant/chunk · 记 seq</text>
  <line x1="630" y1="91" x2="658" y2="91" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="660" y="56" width="270" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="795" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">assistant/message</text>
  <text x="795" y="106" text-anchor="middle" font-size="11" fill="#c2410c">surfaceOp append · sourceEventSeqs=chunk seqs</text>
  <rect x="40" y="148" width="880" height="164" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="176" text-anchor="middle" font-size="12" fill="#374151">deriveMessages 使用 assembled message；raw chunk 用于 UI 与回放。</text>
  <text x="480" y="198" text-anchor="middle" font-size="12" fill="#374151">空 content 的 assistant/message（例如仅带 usage 的 max-tokens）投影为 null。</text>
  <text x="480" y="226" text-anchor="middle" font-size="12" fill="#374151">tool timeout 挂在 tools/execute；审批走 approval/request。</text>
  <text x="480" y="248" text-anchor="middle" font-size="12" fill="#374151">pre-execute 的 ask 缺少 answerer 时否决。</text>
  <text x="480" y="276" text-anchor="middle" font-size="12" fill="#374151">agent/request-error 返回 retry：同一 step 再 stream，不新开 step。</text>
  <text x="480" y="298" text-anchor="middle" font-size="11" fill="#6b7280">ACP 只发 committed message；usage 跟 assistant/message 走。</text>
</svg>
