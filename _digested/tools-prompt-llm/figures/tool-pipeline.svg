<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="340" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">工具执行管道：守卫在管道上，不散落在每个 tool 里</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">管道上的三条都是 waterfall。审批、超时、策略监听器挂在这里，tool 实现只做自己的事。</text>

  <rect x="40" y="80" width="170" height="80" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="125" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">tool/call</text>
  <text x="125" y="136" text-anchor="middle" font-size="11" fill="#c2410c">写入 session log</text>
  <line x1="210" y1="120" x2="248" y2="120" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="250" y="80" width="190" height="80" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="345" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">tools/pre-execute</text>
  <text x="345" y="130" text-anchor="middle" font-size="11" fill="#2563eb">waterfall · allow / deny / ask</text>
  <text x="345" y="146" text-anchor="middle" font-size="11" fill="#2563eb">next() 委托；也可直接决策</text>
  <line x1="440" y1="120" x2="478" y2="120" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="480" y="80" width="190" height="80" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="575" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">tools/execute</text>
  <text x="575" y="130" text-anchor="middle" font-size="11" fill="#7c3aed">waterfall · 包住 tool body</text>
  <text x="575" y="146" text-anchor="middle" font-size="11" fill="#7c3aed">timeout / checkpoint 挂在这</text>
  <line x1="670" y1="120" x2="708" y2="120" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="710" y="80" width="210" height="80" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="815" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">tools/post-execute</text>
  <text x="815" y="130" text-anchor="middle" font-size="11" fill="#16a34a">waterfall · 结果包装</text>
  <text x="815" y="146" text-anchor="middle" font-size="11" fill="#16a34a">然后 tool/result 入 log</text>

  <rect x="40" y="190" width="880" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="220" font-size="12" fill="#334155">packages/guard/：循环卫生提醒（repeat-tool-reminder）+ execute 截止时间。策略在管道上统一执行，测试拒绝路径也走执行器，而不是只靠 schema 省略。</text>
  <text x="60" y="244" font-size="12" fill="#334155">interaction：人的审批、permission preset、ask-user。人发的 slash command 走 ctx.commands，不经过模型 turn。</text>
  <text x="60" y="268" font-size="12" fill="#334155">tool 的 UI 渲染意图是设计的一部分（generic / terminal / diff）。展示方法是 args 的纯函数。</text>
  <text x="60" y="288" font-size="11" fill="#64748b">详情：docs/tool-execution-pipeline.md · docs/cookbook/adding-a-tool.md</text>
</svg>
