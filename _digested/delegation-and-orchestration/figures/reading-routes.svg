<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" width="1080" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#595959"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/>
    </marker>
  </defs>
<rect x="0" y="0" width="1080" height="452" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">四条读法：按你手上的时间选一条，不用从头读到尾</text>
  <text x="40" y="54" font-size="12" font-weight="normal" fill="#8c8c8c">每条读法都是一个可执行的顺序；终点是你拿到的东西，不是「读完了」</text>
  <text x="40" y="122" font-size="12.5" font-weight="bold" fill="#1677ff">10 分钟</text>
  <text x="40" y="140" font-size="9.5" font-weight="normal" fill="#8c8c8c">拿到：一个选择</text>
  <rect x="210" y="104" width="118" height="48" rx="6" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="269" y="124" font-size="10" font-weight="bold" fill="#1677ff" text-anchor="middle">01</text>
  <text x="269" y="141" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">五种交付</text>
  <line x1="332" y1="128" x2="342" y2="128" stroke="#1677ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="348" y="104" width="118" height="48" rx="6" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="407" y="124" font-size="10" font-weight="bold" fill="#1677ff" text-anchor="middle">selection/02</text>
  <text x="407" y="141" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">路由表</text>
  <line x1="470" y1="128" x2="480" y2="128" stroke="#1677ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="486" y="104" width="118" height="48" rx="6" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="545" y="124" font-size="10" font-weight="bold" fill="#1677ff" text-anchor="middle">目标原语页</text>
  <text x="545" y="141" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">心智模型</text>
  <line x1="608" y1="128" x2="618" y2="128" stroke="#1677ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="624" y="104" width="118" height="48" rx="6" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="683" y="124" font-size="10" font-weight="bold" fill="#1677ff" text-anchor="middle">本页不变量</text>
  <text x="683" y="141" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">确认边界</text>
  <line x1="40" y1="172" x2="1040" y2="172" stroke="#f0f0f0" stroke-width="1"/>
  <text x="40" y="204" font-size="12.5" font-weight="bold" fill="#52c41a">半天</text>
  <text x="40" y="222" font-size="9.5" font-weight="normal" fill="#8c8c8c">拿到：能写插件</text>
  <rect x="210" y="186" width="118" height="48" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="269" y="206" font-size="10" font-weight="bold" fill="#52c41a" text-anchor="middle">02</text>
  <text x="269" y="223" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">词与平面</text>
  <line x1="332" y1="210" x2="342" y2="210" stroke="#52c41a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="348" y="186" width="118" height="48" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="407" y="206" font-size="10" font-weight="bold" fill="#52c41a" text-anchor="middle">primitives/00</text>
  <text x="407" y="223" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">维度矩阵</text>
  <line x1="470" y1="210" x2="480" y2="210" stroke="#52c41a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="486" y="186" width="118" height="48" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="545" y="206" font-size="10" font-weight="bold" fill="#52c41a" text-anchor="middle">composition/01</text>
  <text x="545" y="223" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">通道差异</text>
  <line x1="608" y1="210" x2="618" y2="210" stroke="#52c41a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="624" y="186" width="118" height="48" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="683" y="206" font-size="10" font-weight="bold" fill="#52c41a" text-anchor="middle">composition/03</text>
  <text x="683" y="223" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">收窄杠杆</text>
  <line x1="746" y1="210" x2="756" y2="210" stroke="#52c41a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="762" y="186" width="118" height="48" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="821" y="206" font-size="10" font-weight="bold" fill="#52c41a" text-anchor="middle">composition/06</text>
  <text x="821" y="223" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">深度与容量</text>
  <line x1="884" y1="210" x2="894" y2="210" stroke="#52c41a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="900" y="186" width="118" height="48" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="959" y="206" font-size="10" font-weight="bold" fill="#52c41a" text-anchor="middle">observation/07</text>
  <text x="959" y="223" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">证据分层</text>
  <line x1="40" y1="254" x2="1040" y2="254" stroke="#f0f0f0" stroke-width="1"/>
  <text x="40" y="286" font-size="12.5" font-weight="bold" fill="#fa8c16">一小时</text>
  <text x="40" y="304" font-size="9.5" font-weight="normal" fill="#8c8c8c">拿到：一条判定</text>
  <rect x="210" y="268" width="118" height="48" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="269" y="288" font-size="10" font-weight="bold" fill="#fa8c16" text-anchor="middle">症状 → 页</text>
  <text x="269" y="305" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">先定位</text>
  <line x1="332" y1="292" x2="342" y2="292" stroke="#fa8c16" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="348" y="268" width="118" height="48" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="407" y="288" font-size="10" font-weight="bold" fill="#fa8c16" text-anchor="middle">机制页</text>
  <text x="407" y="305" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">读结论</text>
  <line x1="470" y1="292" x2="480" y2="292" stroke="#fa8c16" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="486" y="268" width="118" height="48" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="545" y="288" font-size="10" font-weight="bold" fill="#fa8c16" text-anchor="middle">源码入口</text>
  <text x="545" y="305" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">对锚点</text>
  <line x1="608" y1="292" x2="618" y2="292" stroke="#fa8c16" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="624" y="268" width="118" height="48" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="683" y="288" font-size="10" font-weight="bold" fill="#fa8c16" text-anchor="middle">ref-sweep</text>
  <text x="683" y="305" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">扫漂移</text>
  <line x1="746" y1="292" x2="756" y2="292" stroke="#fa8c16" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="762" y="268" width="118" height="48" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="821" y="288" font-size="10" font-weight="bold" fill="#fa8c16" text-anchor="middle">三态分诊</text>
  <text x="821" y="305" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">真失效/历史/误报</text>
  <line x1="40" y1="336" x2="1040" y2="336" stroke="#f0f0f0" stroke-width="1"/>
  <text x="40" y="368" font-size="12.5" font-weight="bold" fill="#722ed1">只想知道选哪个</text>
  <text x="40" y="386" font-size="9.5" font-weight="normal" fill="#8c8c8c">拿到：六句话</text>
  <rect x="210" y="350" width="118" height="48" rx="6" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.5"/>
  <text x="269" y="370" font-size="10" font-weight="bold" fill="#722ed1" text-anchor="middle">六条不变量</text>
  <text x="269" y="387" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">一句话一条</text>
  <line x1="332" y1="374" x2="342" y2="374" stroke="#722ed1" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="348" y="350" width="118" height="48" rx="6" fill="#f9f0ff" stroke="#722ed1" stroke-width="1.5"/>
  <text x="407" y="370" font-size="10" font-weight="bold" fill="#722ed1" text-anchor="middle">阶梯图</text>
  <text x="407" y="387" font-size="9" font-weight="normal" fill="#8c8c8c" text-anchor="middle">全景</text>
  <text x="40" y="428" font-size="11.5" font-weight="normal" fill="#595959">四条路线共用同一批页面：路线只是入口顺序，不是不同的语料。</text>
</svg>
