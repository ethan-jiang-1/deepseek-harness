<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#595959"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="700" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">工作编排原语阶梯：拆解 → 委派 → 编排 → 跨时间推进</text>
  <text x="40" y="54" font-size="12" font-weight="normal" fill="#8c8c8c">右上承诺越深：上下文越独立、时间跨度越长。卡片按「循环归谁 + 承诺多深」排列，不是能力总序。</text>
  <line x1="80" y1="620" x2="1020" y2="620" stroke="#595959" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="80" y1="620" x2="80" y2="110" stroke="#595959" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="600" y="654" font-size="12" font-weight="normal" fill="#595959" text-anchor="middle">上下文隔离与扇出规模 →（同上下文 → 独立子上下文 → 独立持久会话）</text>
  <text x="58" y="380" font-size="12" font-weight="normal" fill="#595959" text-anchor="middle" transform="rotate(-90 58 380)">时间跨度 →（单 turn → 前台多轮 → 跨自动续轮 → 后台 / 定时）</text>
  <rect x="104" y="540" width="140" height="62" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="174" y="566" font-size="12" font-weight="bold" fill="#1677ff" text-anchor="middle">todo_write / plan</text>
  <text x="174" y="585" font-size="9.5" font-weight="normal" fill="#595959" text-anchor="middle">计划留痕（同上下文）</text>
  <rect x="254" y="470" width="140" height="62" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="324" y="496" font-size="12" font-weight="bold" fill="#1677ff" text-anchor="middle">subagent / fork</text>
  <text x="324" y="515" font-size="9.5" font-weight="normal" fill="#595959" text-anchor="middle">一两个独立子任务</text>
  <rect x="404" y="400" width="140" height="62" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="474" y="426" font-size="12" font-weight="bold" fill="#1677ff" text-anchor="middle">workflow</text>
  <text x="474" y="445" font-size="9.5" font-weight="normal" fill="#595959" text-anchor="middle">脚本扇出与聚合</text>
  <rect x="554" y="330" width="140" height="62" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="624" y="356" font-size="12" font-weight="bold" fill="#1677ff" text-anchor="middle">ralph</text>
  <text x="624" y="375" font-size="9.5" font-weight="normal" fill="#595959" text-anchor="middle">固定脚本 · fresh 循环</text>
  <rect x="704" y="260" width="140" height="62" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="774" y="286" font-size="12" font-weight="bold" fill="#1677ff" text-anchor="middle">goal</text>
  <text x="774" y="305" font-size="9.5" font-weight="normal" fill="#595959" text-anchor="middle">跨轮目标 + 自动续跑</text>
  <rect x="854" y="190" width="140" height="62" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="924" y="216" font-size="12" font-weight="bold" fill="#1677ff" text-anchor="middle">agent-teams *</text>
  <text x="924" y="235" font-size="9.5" font-weight="normal" fill="#595959" text-anchor="middle">Lead + 持久任务板</text>
  <rect x="104" y="150" width="190" height="76" rx="8" fill="#fafafa" stroke="#bfbfbf" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="114" y="176" font-size="11.5" font-weight="bold" fill="#595959">jobs / schedule（正交）</text>
  <text x="114" y="195" font-size="9.5" font-weight="normal" fill="#8c8c8c">只改变「何时发生」，</text>
  <text x="114" y="211" font-size="9.5" font-weight="normal" fill="#8c8c8c">不改变循环归谁</text>
  <line x1="294" y1="188" x2="420" y2="188" stroke="#bfbfbf" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="430" y="192" font-size="9.5" font-weight="normal" fill="#8c8c8c">可以叠在任一格上：后台化 / 定时跟进</text>
  <text x="40" y="676" font-size="10" font-weight="normal" fill="#8c8c8c">* experimental：无稳定合同承诺，随时可能改名或消失。卡片位置表示相对承诺深度，不表示能力大小；depth 与并发上限见 composition/06。</text>
</svg>
