<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="1040" height="770" fill="#f8fafc"/>
  <text x="40" y="35" font-size="18" font-weight="700" fill="#0f172a">委派证据：组合、请求、行为与成果分别验收</text>
  <text x="40" y="60" font-size="13" fill="#475569">诊断点：前一项通过，不能自动推出后一项；完整轨迹也需要独立结果判断。</text>
  <rect x="60" y="85" width="920" height="85" rx="9" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="80" y="112" font-size="15" font-weight="700" fill="#1e40af">1 声明：preset YAML / --dump-config</text>
  <text x="80" y="138" font-size="13" fill="#334155">核对插件行、配置和顺序；描述性清单可从声明生成。</text>
  <text x="80" y="158" font-size="12" fill="#9a3412">不能据此确认实际工具注册；必需能力的验收期望独立维护。</text>
  <path d="M520 170 V185" stroke="#64748b" marker-end="url(#a6)"/>
  <rect x="60" y="190" width="920" height="85" rx="9" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="80" y="217" font-size="15" font-weight="700" fill="#166534">2 装配：注册激活 / 真入口创建 Agent</text>
  <text x="80" y="243" font-size="13" fill="#334155">核对组合能否激活、依赖能否解析；检查 broken 和失败诊断。</text>
  <text x="80" y="263" font-size="12" fill="#9a3412">不能据此确认每个 Agent 请求实际使用的工具集合或模型行为。</text>
  <path d="M520 275 V290" stroke="#64748b" marker-end="url(#a6)"/>
  <rect x="60" y="295" width="920" height="85" rx="9" fill="#fff7ed" stroke="#fb923c"/>
  <text x="80" y="322" font-size="15" font-weight="700" fill="#9a3412">3 实际工具：沿请求前缀重建最近 request/header.tools</text>
  <text x="80" y="348" font-size="13" fill="#334155">核对发送给模型的工具 schema；相同 header 不必每次重复写入。</text>
  <text x="80" y="368" font-size="12" fill="#9a3412">请求输入可在回放中比较；回放固定的选择不能评价当前模型的新决策。</text>
  <path d="M520 380 V395" stroke="#64748b" marker-end="url(#a6)"/>
  <rect x="60" y="400" width="920" height="85" rx="9" fill="#fdf2f8" stroke="#f472b6"/>
  <text x="80" y="427" font-size="15" font-weight="700" fill="#9d174d">4 行为：真实模型的工具选择、参数与调用顺序</text>
  <text x="80" y="453" font-size="13" fill="#334155">强制输入检查链路，自然输入观察选择；分别报告样本和条件。</text>
  <text x="80" y="473" font-size="12" fill="#9a3412">一次选择正确不能证明成果正确或多次稳定；凭据和执行环境须明确。</text>
  <rect x="60" y="510" width="920" height="105" rx="9" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <text x="80" y="538" font-size="15" font-weight="700" fill="#6d28d9">成果验收：独立文件期望、领域计算、来源与人工判据</text>
  <text x="80" y="564" font-size="13" fill="#334155">核对被审产物的版本与外部结果；内部 verifier 也需要发现错误的证据。</text>
  <text x="80" y="590" font-size="12" fill="#9a3412">诊断：同时检查资料不足时避免编造，以及资料充分时能完成；不要奖励一律拒绝。</text>
  <rect x="60" y="635" width="920" height="85" rx="9" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="80" y="663" font-size="15" font-weight="700" fill="#334155">呈现验收：持久数据投影与真页面分别检查</text>
  <text x="80" y="689" font-size="13" fill="#334155">金样检查布局与状态显示；数据来源和领域结论需要其他证据。</text>
  <text x="80" y="709" font-size="12" fill="#9a3412">fake 可验证接线与映射；真实 provider 能力须经真实入口检验。</text>
  <text x="60" y="750" font-size="12" fill="#64748b">每项证据说明输入、版本、观察和限制，不把单一绿灯推广成全部保证。</text>
</svg>
