<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#595959"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="17" font-weight="bold" fill="#262626">四层证据：每层只证明自己</text>
  <text x="40" y="60" font-size="12" fill="#8c8c8c">“挂了组合”“跑起来了”“模型照着做了”是三件事；上一层证明不了下一层，混成一句“测试通过”就是假绿</text>

  <rect x="70" y="92" width="900" height="88" rx="9" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="92" y="120" font-size="14" font-weight="bold" fill="#0958d9">1 声明面 · preset YAML / --dump-config</text>
  <text x="92" y="144" font-size="11" fill="#0958d9">证明：你写下了哪些插件行、配置、顺序。</text>
  <text x="92" y="164" font-size="11" fill="#cf1322">不能证明：会话实际拿到的工具面；模型会不会用。零模型，可进 pnpm test。</text>

  <rect x="70" y="196" width="900" height="88" rx="9" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <text x="92" y="224" font-size="14" font-weight="bold" fill="#237804">2 装配 · 注册激活 / session-create 真挂载</text>
  <text x="92" y="248" font-size="11" fill="#237804">证明：这棵子树能立起来，依赖在场，服务能解析（失败会收敛成 broken）。</text>
  <text x="92" y="268" font-size="11" fill="#cf1322">不能证明：每个 Agent 的实际工具面；模型行为。零模型，但要真入口。</text>

  <rect x="70" y="300" width="900" height="88" rx="9" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
  <text x="92" y="328" font-size="14" font-weight="bold" fill="#ad4e00">3 实际工具面 · request/header.tools</text>
  <text x="92" y="352" font-size="11" fill="#ad4e00">证明：这次请求真实发给模型的工具 schema 集合（能发现“声明了但没注册/被遮蔽”）。</text>
  <text x="92" y="372" font-size="11" fill="#cf1322">不能证明：模型选得对不对、用得好不好。需要一次真实请求（可录制回放）。</text>

  <rect x="70" y="404" width="900" height="88" rx="9" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="92" y="432" font-size="14" font-weight="bold" fill="#9d174d">4 行为 · 真模型探针 / 会话</text>
  <text x="92" y="456" font-size="11" fill="#9d174d">证明：模型在给定提示下会怎么选、怎么用（一次只证一个假设）。</text>
  <text x="92" y="476" font-size="11" fill="#cf1322">不能证明：稳定性（单次 ≠ 稳定）、生产分布。真模型按次计费，不进 CI。</text>

  <path d="M520 180 L520 196" stroke="#595959" stroke-width="1.5" marker-end="url(#a6)"/>
  <path d="M520 284 L520 300" stroke="#595959" stroke-width="1.5" marker-end="url(#a6)"/>
  <path d="M520 388 L520 404" stroke="#595959" stroke-width="1.5" marker-end="url(#a6)"/>

  <rect x="70" y="516" width="900" height="58" rx="8" fill="#fafafa" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="92" y="540" font-size="12" font-weight="bold" fill="#595959">产品层 · 呈现（真页面 / 金样 / 客户端投影）</text>
  <text x="92" y="560" font-size="11" fill="#595959">证明：用户看到的布局与状态；不证明数据来源正确——数据要靠第 3 层，行为要靠第 4 层。</text>

  <text x="40" y="596" font-size="11" fill="#8c8c8c">fake 只证明 fake：它验证接线与映射，不证明真实 provider 在场；断言里若有“真实存在”的前提，就必须加真入口证据。</text>
</svg>
