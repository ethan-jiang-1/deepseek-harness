<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 726" width="1080" height="726" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="726" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">五终态各走哪条重试路径：引擎不重试，重试是父代理的有界策略</text>
  <text x="40" y="54" font-size="12" font-weight="normal" fill="#8c8c8c">左边是子代理 run 的终态；右边是父代理该采取的动作。只有 error 有重试窗口，其余都不自动重试。</text>
  <rect x="40" y="92" width="190" height="58" rx="6" fill="#fff1f0" stroke="#d4380d" stroke-width="1.2"/>
  <text x="56" y="118" font-size="12.5" font-weight="bold" fill="#d4380d">error</text>
  <text x="56" y="137" font-size="9.5" font-weight="normal" fill="#8c8c8c">模型 / 传输失败</text>
  <text x="250" y="118" font-size="14" font-weight="normal" fill="#595959">→</text>
  <rect x="290" y="92" width="750" height="58" rx="6" fill="#ffffff" stroke="#d4380d" stroke-width="1.4"/>
  <text x="306" y="116" font-size="12" font-weight="bold" fill="#d4380d">最多再试一次（仅幂等任务）</text>
  <text x="306" y="136" font-size="10" font-weight="normal" fill="#8c8c8c">带 attempt: 2 可见标记；成功按结果继续；仍失败记 exhausted，不启动第三次。</text>
  <text x="700" y="116" font-size="10" font-weight="normal" fill="#52c41a">成功 → 按结果继续</text>
  <text x="700" y="136" font-size="10" font-weight="normal" fill="#d4380d">仍失败 → exhausted</text>
  <rect x="40" y="170" width="190" height="58" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.2"/>
  <text x="56" y="196" font-size="12.5" font-weight="bold" fill="#fa8c16">aborted</text>
  <text x="56" y="215" font-size="9.5" font-weight="normal" fill="#8c8c8c">含 interrupted</text>
  <text x="250" y="196" font-size="14" font-weight="normal" fill="#595959">→</text>
  <rect x="290" y="170" width="750" height="58" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="306" y="194" font-size="12" font-weight="bold" fill="#333">不自动重试</text>
  <text x="306" y="214" font-size="10" font-weight="normal" fill="#8c8c8c">它是取消意图；先确认 child 已停，再由人或父决定后续。</text>
  <rect x="40" y="248" width="190" height="58" rx="6" fill="#fafafa" stroke="#595959" stroke-width="1.2"/>
  <text x="56" y="274" font-size="12.5" font-weight="bold" fill="#595959">refusal</text>
  <text x="56" y="293" font-size="9.5" font-weight="normal" fill="#8c8c8c">拒绝任务</text>
  <text x="250" y="274" font-size="14" font-weight="normal" fill="#595959">→</text>
  <rect x="290" y="248" width="750" height="58" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="306" y="272" font-size="12" font-weight="bold" fill="#333">不重试</text>
  <text x="306" y="292" font-size="10" font-weight="normal" fill="#8c8c8c">拒绝是合法回答或边界，不是故障；重试只会被再拒绝一次。</text>
  <rect x="40" y="326" width="190" height="58" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.2"/>
  <text x="56" y="352" font-size="12.5" font-weight="bold" fill="#fa8c16">max-tokens</text>
  <text x="56" y="371" font-size="9.5" font-weight="normal" fill="#8c8c8c">预算耗尽</text>
  <text x="250" y="352" font-size="14" font-weight="normal" fill="#595959">→</text>
  <rect x="290" y="326" width="750" height="58" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="306" y="350" font-size="12" font-weight="bold" fill="#333">不自动重试</text>
  <text x="306" y="370" font-size="10" font-weight="normal" fill="#8c8c8c">重试大概率再撞；缩任务、提预算或换模型。</text>
  <rect x="40" y="404" width="190" height="58" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.2"/>
  <text x="56" y="430" font-size="12.5" font-weight="bold" fill="#52c41a">completed</text>
  <text x="56" y="449" font-size="9.5" font-weight="normal" fill="#8c8c8c">正常结束</text>
  <text x="250" y="430" font-size="14" font-weight="normal" fill="#595959">→</text>
  <rect x="290" y="404" width="750" height="58" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="306" y="428" font-size="12" font-weight="bold" fill="#333">不重试</text>
  <text x="306" y="448" font-size="10" font-weight="normal" fill="#8c8c8c">已完成；后续问题属于验收，不属于重试。</text>
  <rect x="40" y="482" width="190" height="58" rx="6" fill="#fafafa" stroke="#595959" stroke-width="1.2"/>
  <text x="56" y="508" font-size="12.5" font-weight="bold" fill="#595959">基础设施 reject</text>
  <text x="56" y="527" font-size="9.5" font-weight="normal" fill="#8c8c8c">run 发布前失败</text>
  <text x="250" y="508" font-size="14" font-weight="normal" fill="#595959">→</text>
  <rect x="290" y="482" width="750" height="58" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="306" y="506" font-size="12" font-weight="bold" fill="#333">不自动重试</text>
  <text x="306" y="526" font-size="10" font-weight="normal" fill="#8c8c8c">先修环境；盲目重试会重复副作用。</text>
  <rect x="40" y="566" width="1000" height="112" rx="6" fill="#fafafa" stroke="#d9d9d9" stroke-width="1.2"/>
  <text x="56" y="590" font-size="11.5" font-weight="bold" fill="#333">四条纪律（父代理侧）</text>
  <text x="56" y="612" font-size="10.5" font-weight="normal" fill="#595959">1 一次上限：同一任务最多再派一次；仍失败记 exhausted，不启动第三次。</text>
  <text x="56" y="629" font-size="10.5" font-weight="normal" fill="#595959">2 幂等门：只有可重复执行的任务才重试；非幂等写操作先对账。</text>
  <text x="56" y="646" font-size="10.5" font-weight="normal" fill="#595959">3 可见：两次 attempt 在通知、图与 UI 里可分辨，不能静默合并。</text>
  <text x="56" y="663" font-size="10.5" font-weight="normal" fill="#595959">4 可靠通道：批量、必须成功、要聚合的活走 workflow，脚本内显式处理 null 与 missing。</text>
  <text x="40" y="688" font-size="10" font-weight="normal" fill="#8c8c8c">引擎侧事实：subagent 启动即返回 child id、不 await；终态经一条持久 user/message 通知（idle → queue，busy → steer，父 teardown → inject）。</text>
  <text x="40" y="706" font-size="10" font-weight="normal" fill="#8c8c8c">subagent / workflow / jobs 都没有自动重试；模型请求自身的 retry policy 属于 provider 层。</text>
</svg>
