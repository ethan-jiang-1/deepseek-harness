<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#595959"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#389e0d"/></marker>
  </defs>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#262626">Session 谱系 ≠ Agent 实例 ≠ Activation epoch</text>
  <text x="40" y="62" font-size="13" fill="#8c8c8c">持久边负责恢复与追溯；活体身份负责授权；Activation 负责进程内驻留和处置</text>

  <rect x="70" y="110" width="1040" height="170" rx="12" fill="#fafafa" stroke="#d9d9d9" stroke-width="2"/>
  <text x="95" y="142" font-size="16" font-weight="700" fill="#333">持久层：Session event log / header</text>
  <rect x="105" y="170" width="260" height="70" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="235" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#1677ff">Parent Session</text>
  <text x="235" y="222" text-anchor="middle" font-size="12" fill="#333">id = P · durable history</text>
  <rect x="505" y="170" width="260" height="70" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="635" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#1677ff">Child Session</text>
  <text x="635" y="222" text-anchor="middle" font-size="12" fill="#333">id = C · parentSession = P</text>
  <line x1="365" y1="205" x2="505" y2="205" stroke="#1677ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="190" text-anchor="middle" font-size="11" fill="#1677ff">持久谱系边</text>

  <rect x="70" y="330" width="1040" height="220" rx="12" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
  <text x="95" y="362" font-size="16" font-weight="700" fill="#333">活体层：process-local runtime</text>
  <rect x="105" y="398" width="230" height="86" rx="8" fill="#fff1f0" stroke="#d4380d" stroke-width="2"/>
  <text x="220" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#cf1322">Agent P₁</text>
  <text x="220" y="452" text-anchor="middle" font-size="12" fill="#333">live identity / inbox</text>
  <text x="220" y="470" text-anchor="middle" font-size="11" fill="#8c8c8c">旧 incarnation</text>
  <rect x="470" y="398" width="230" height="86" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <text x="585" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#389e0d">Activation C₁</text>
  <text x="585" y="452" text-anchor="middle" font-size="12" fill="#333">AgentHandle / ownedChildren</text>
  <text x="585" y="470" text-anchor="middle" font-size="11" fill="#8c8c8c">resident epoch</text>
  <rect x="835" y="398" width="230" height="86" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <text x="950" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#389e0d">Activation C₂</text>
  <text x="950" y="452" text-anchor="middle" font-size="12" fill="#333">same Session id C</text>
  <text x="950" y="470" text-anchor="middle" font-size="11" fill="#8c8c8c">cold-resumed epoch</text>
  <line x1="335" y1="441" x2="470" y2="441" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="441" x2="835" y2="441" stroke="#389e0d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#green-arrow)"/>
  <text x="768" y="425" text-anchor="middle" font-size="11" fill="#389e0d">settle → resume</text>

  <text x="95" y="600" font-size="13" fill="#333">授权：durable parentSession 用于冷恢复；exact live Agent ancestry 用于 interrupt；两者都不等于“只要 Session 存在就能执行”。</text>
</svg>
