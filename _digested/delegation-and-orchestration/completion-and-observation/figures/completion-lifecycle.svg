<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 612" width="1080" height="612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="612" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">「完成」不是一个时刻：四个机制时刻，各自被不同组件确认</text>
  <text x="40" y="54" font-size="12" font-weight="normal" fill="#8c8c8c">每一步都可能停住；四步都走完也只说明机制收尾，业务完成仍要人或合同判定。</text>
  <rect x="40" y="84" width="214" height="96" rx="6" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.4"/>
  <text x="147" y="110" font-size="13" font-weight="bold" fill="#1677ff" text-anchor="middle">accepted</text>
  <text x="147" y="132" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">取得 id / handle</text>
  <text x="147" y="149" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">消息或 job 被接纳</text>
  <text x="147" y="170" font-size="9.5" font-weight="normal" fill="#1677ff" text-anchor="middle">≠ 已执行</text>
  <text x="276" y="137" font-size="16" font-weight="normal" fill="#595959" text-anchor="middle">→</text>
  <rect x="298" y="84" width="214" height="96" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="1.4"/>
  <text x="405" y="110" font-size="13" font-weight="bold" fill="#52c41a" text-anchor="middle">model-visible</text>
  <text x="405" y="132" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">进入模型请求或上下文</text>
  <text x="405" y="149" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">工具结果已回到模型</text>
  <text x="405" y="170" font-size="9.5" font-weight="normal" fill="#52c41a" text-anchor="middle">≠ 已理解 / 已验证</text>
  <text x="534" y="137" font-size="16" font-weight="normal" fill="#595959" text-anchor="middle">→</text>
  <rect x="556" y="84" width="214" height="96" rx="6" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.4"/>
  <text x="663" y="110" font-size="13" font-weight="bold" fill="#fa8c16" text-anchor="middle">quiescent</text>
  <text x="663" y="132" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">没有正在执行的 turn</text>
  <text x="663" y="149" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">没有竞争性输入</text>
  <text x="663" y="170" font-size="9.5" font-weight="normal" fill="#fa8c16" text-anchor="middle">≠ 已释放资源</text>
  <text x="792" y="137" font-size="16" font-weight="normal" fill="#595959" text-anchor="middle">→</text>
  <rect x="814" y="84" width="214" height="96" rx="6" fill="#fff1f0" stroke="#d4380d" stroke-width="1.4"/>
  <text x="921" y="110" font-size="13" font-weight="bold" fill="#d4380d" text-anchor="middle">disposed</text>
  <text x="921" y="132" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">child / producer / handle</text>
  <text x="921" y="149" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">释放资源并完成收尾</text>
  <text x="921" y="170" font-size="9.5" font-weight="normal" fill="#d4380d" text-anchor="middle">≠ 用户目标满足</text>
  <text x="40" y="206" font-size="12" font-weight="bold" fill="#333">不同组件确认不同事实</text>
  <rect x="40" y="216" width="1000" height="34" rx="4" fill="#fafafa" stroke="none" stroke-width="1.2"/>
  <text x="56" y="238" font-size="10.5" font-weight="bold" fill="#333">JobRegistry</text>
  <text x="230" y="238" font-size="10" font-weight="normal" fill="#595959">注册 id、终态、输出 ring 与读取游标；awaited 说明是否已有 waiter 收集结算（≠ 模型已读）</text>
  <text x="56" y="272" font-size="10.5" font-weight="bold" fill="#333">Subagent manager</text>
  <text x="230" y="272" font-size="10" font-weight="normal" fill="#595959">childId / messageId、settle notice、Activation 释放；冷恢复重建运行但不再调用 provider</text>
  <rect x="40" y="284" width="1000" height="34" rx="4" fill="#fafafa" stroke="none" stroke-width="1.2"/>
  <text x="56" y="306" font-size="10.5" font-weight="bold" fill="#333">Teams inbox</text>
  <text x="230" y="306" font-size="10" font-weight="normal" fill="#595959">被接纳的 inbox MessageId；不投递、不重试、不去重（≠ 模型已处理）</text>
  <text x="56" y="340" font-size="10.5" font-weight="bold" fill="#333">Schedule Host</text>
  <text x="230" y="340" font-size="10" font-weight="normal" fill="#595959">Session flush 成功后 retire / advance 任务；两套存储更新不是原子操作</text>
  <rect x="40" y="352" width="1000" height="34" rx="4" fill="#fafafa" stroke="none" stroke-width="1.2"/>
  <text x="56" y="374" font-size="10.5" font-weight="bold" fill="#333">Goal driver</text>
  <text x="230" y="374" font-size="10" font-weight="normal" fill="#595959">checkpoint、round reservation、wrapup；flush 抛错即 disarm</text>
  <text x="56" y="408" font-size="10.5" font-weight="bold" fill="#333">Workflow recorder</text>
  <text x="230" y="408" font-size="10" font-weight="normal" fill="#595959">观察日志：append 失败只停记录，不升级为执行失败，也不是恢复 checkpoint</text>
  <rect x="40" y="442" width="1000" height="150" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2"/>
  <text x="56" y="466" font-size="11.5" font-weight="bold" fill="#333">崩溃窗口不是一个窗口：每条链都有自己的半提交状态</text>
  <text x="56" y="490" font-size="10" font-weight="normal" fill="#595959">Schedule：inbox 已 flush、task 仍 active → 重启后可能再次扫描并投递；这是允许的重复，不是 exactly-once。</text>
  <text x="56" y="514" font-size="10" font-weight="normal" fill="#595959">Workflow：run-start 或成员事件已写 → 记录可观察、可审计，但不会恢复 PTC 脚本或 child run。</text>
  <text x="56" y="538" font-size="10" font-weight="normal" fill="#595959">Job：job 已终态、模型尚未读取 → completion notice 或后续 job_output 仍是消费入口；awaited 的结算不重复播报。</text>
  <text x="56" y="562" font-size="10" font-weight="normal" fill="#595959">Goal：durable phase 已终态、最终回复未生成 → 恢复只保留 phase；activation 不因 durable active 自动恢复。</text>
</svg>
