<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 652" width="1080" height="652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#595959"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52c41a"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="652" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">workflow 编排栈：模型可见工具 → 单例引擎 → PTC fresh Node 进程</text>
  <text x="40" y="54" font-size="12" font-weight="normal" fill="#8c8c8c">三层分离：工具拥有模型可见面，引擎拥有解析/上限/取消，进程持有隔离。右侧是它挂到的两个外部面。</text>
  <rect x="40" y="78" width="620" height="100" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.4"/>
  <text x="58" y="102" font-size="12.5" font-weight="bold" fill="#1677ff">tool-workflow（模型可见工具）</text>
  <text x="58" y="124" font-size="10.5" font-weight="normal" fill="#333">参数：script / meta / args / run_in_background</text>
  <text x="58" y="143" font-size="10.5" font-weight="normal" fill="#333">拥有：结果 envelope、`tool:workflow` prompt 段</text>
  <text x="58" y="162" font-size="10.5" font-weight="normal" fill="#333">Config：toolName / maxResultChars / enableRunInBackground</text>
  <rect x="40" y="210" width="620" height="104" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="1.4"/>
  <text x="58" y="234" font-size="12.5" font-weight="bold" fill="#52c41a">ctx.workflowEngine（Service Definition · 单例 seam）</text>
  <text x="58" y="256" font-size="10.5" font-weight="normal" fill="#333">一个上下文一个引擎；同 scope 第二次 provide 直接 throw</text>
  <text x="58" y="275" font-size="10.5" font-weight="normal" fill="#333">拥有脚本解析、执行上限与取消；result 永不 reject</text>
  <text x="58" y="294" font-size="10.5" font-weight="normal" fill="#333">workflow/* 事件是 observe-only 数据快照，订阅者拿不到 cancel</text>
  <rect x="40" y="346" width="620" height="104" rx="8" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.4"/>
  <text x="58" y="370" font-size="12.5" font-weight="bold" fill="#fa8c16">workflow-ptc（执行 provider）</text>
  <text x="58" y="392" font-size="10.5" font-weight="normal" fill="#333">脚本解析 SCRIPT_PARSE / meta 校验 META_INVALID / 五个钩子实现</text>
  <text x="58" y="411" font-size="10.5" font-weight="normal" fill="#333">caps：AGENT_CAP 1000 总子代理、ITEM_CAP 4096 单次条目</text>
  <text x="58" y="430" font-size="10.5" font-weight="normal" fill="#333">fatal 纪律：WorkflowError re-throw 杀脚本；逐 item null 只留给局部失败</text>
  <rect x="40" y="482" width="620" height="104" rx="8" fill="#fff1f0" stroke="#d4380d" stroke-width="1.4"/>
  <text x="58" y="506" font-size="12.5" font-weight="bold" fill="#d4380d">PTC fresh Node 进程（每次 run 一个新进程）</text>
  <text x="58" y="528" font-size="10.5" font-weight="normal" fill="#333">VM 只注入五个冻结钩子与 args；没有 fs / network / timer / Node API</text>
  <text x="58" y="547" font-size="10.5" font-weight="normal" fill="#333">按调用方 Session 的文件沙箱与 cwd；VM 不是安全边界</text>
  <text x="58" y="566" font-size="10.5" font-weight="normal" fill="#333">取消立即中止进程，并为残余 liveAgents 合成 cancelled 结局</text>
  <line x1="350" y1="180" x2="350" y2="206" stroke="#595959" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="364" y="198" font-size="9.5" font-weight="normal" fill="#8c8c8c">ctx.workflowEngine.start(request)</text>
  <line x1="350" y1="316" x2="350" y2="342" stroke="#595959" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="364" y="334" font-size="9.5" font-weight="normal" fill="#8c8c8c">PtcWorkflowEngine extends WorkflowEngine</text>
  <line x1="350" y1="452" x2="350" y2="478" stroke="#595959" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="364" y="470" font-size="9.5" font-weight="normal" fill="#8c8c8c">ctx.ptcRuntime.run(program, bindings, sandboxPolicy, timeouts)</text>
  <line x1="660" y1="128" x2="690" y2="128" stroke="#1677ff" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <rect x="690" y="78" width="350" height="100" rx="8" fill="#ffffff" stroke="#1677ff" stroke-width="1.2"/>
  <text x="706" y="100" font-size="11.5" font-weight="bold" fill="#1677ff">后台分支（jobs 体系）</text>
  <text x="706" y="120" font-size="9.5" font-weight="normal" fill="#333">run_in_background → jobs.start({ kind, owner, run })</text>
  <text x="706" y="137" font-size="9.5" font-weight="normal" fill="#333">进度进 job 的 log channel，模型看不到</text>
  <text x="706" y="154" font-size="9.5" font-weight="normal" fill="#333">取消：job_kill / 列表停止控件 / owner teardown</text>
  <line x1="660" y1="262" x2="690" y2="262" stroke="#52c41a" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <rect x="690" y="210" width="350" height="104" rx="8" fill="#ffffff" stroke="#52c41a" stroke-width="1.2"/>
  <text x="706" y="232" font-size="11.5" font-weight="bold" fill="#52c41a">subagent seam 扇出</text>
  <text x="706" y="252" font-size="9.5" font-weight="normal" fill="#333">每个 agent() 经 startActivation({ provider, delivery })</text>
  <text x="706" y="269" font-size="9.5" font-weight="normal" fill="#333">child 全部归属 caller（depth + 1）</text>
  <text x="706" y="286" font-size="9.5" font-weight="normal" fill="#333">durable 记录写进 child 的 Session</text>
  <text x="706" y="303" font-size="9.5" font-weight="normal" fill="#333">只有顶层调用才在父会话留记录</text>
  <text x="40" y="612" font-size="10.5" font-weight="normal" fill="#595959">ralph 是同一栈上的固定脚本消费方（注入 workflowEngine + subagents，不改引擎）；换引擎 = 在组合里换加载哪一行引擎插件。</text>
  <text x="40" y="632" font-size="10" font-weight="normal" fill="#8c8c8c">源码核验：tool-workflow/src/index.ts · workflow/src/index.ts · workflow-ptc/src/{index,runtime,host}.ts · docs/subsystems/workflow.md</text>
</svg>
