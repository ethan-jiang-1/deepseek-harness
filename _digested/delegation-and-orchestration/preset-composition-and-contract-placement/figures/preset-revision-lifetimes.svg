<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Preset 定义更新与 Agent 修订保留</title>
  <desc id="desc">定义从 v1 更新为 v2 后，已有 Agent 继续保留 v1。省略 preset 的子代理加入父代的同一份 v1，父代退出后仍可保留旧组合。显式选择与冷恢复使用当前 v2。只有退役 v1 的最后一个引用释放后才卸载。文件系统 skill 正文独立读取。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2574a8"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147d64"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c2413b"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="36" y="38" font-size="23" font-weight="700" fill="#17212b">定义更新影响新绑定；已有 Agent 继续持有原修订</text>
  <text x="36" y="64" font-size="14" fill="#52606d">横向表示时间。v1 / v2 仅用于区分修订；注册表保留内存引用，没有公开版本号。</text>

  <text x="36" y="112" font-size="15" font-weight="700" fill="#17212b">Preset 定义：standard</text>
  <line x1="280" y1="107" x2="1150" y2="107" stroke="#c8d0d7" stroke-width="2"/>
  <rect x="340" y="86" width="174" height="42" rx="5" fill="#e7f2ff" stroke="#2574a8" stroke-width="2"/>
  <text x="427" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#174f74">v1 · 插件组合 A</text>
  <line x1="526" y1="107" x2="666" y2="107" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="94" text-anchor="middle" font-size="13" fill="#52606d">替换定义</text>
  <rect x="680" y="86" width="174" height="42" rx="5" fill="#e6f5ef" stroke="#147d64" stroke-width="2"/>
  <text x="767" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#11634f">v2 · 插件组合 B</text>
  <line x1="526" y1="77" x2="526" y2="475" stroke="#c2413b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="526" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#a93632">v1 退役，引用仍可保留</text>

  <text x="36" y="196" font-size="15" font-weight="700" fill="#174f74">已有 Agent A</text>
  <line x1="280" y1="190" x2="998" y2="190" stroke="#2574a8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <rect x="350" y="169" width="164" height="42" rx="5" fill="#e7f2ff" stroke="#2574a8" stroke-width="2"/>
  <text x="432" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#174f74">保留 v1</text>
  <text x="1010" y="195" font-size="13" fill="#52606d">Agent A 退出</text>

  <text x="36" y="254" font-size="15" font-weight="700" fill="#174f74">子代理 B · 省略 preset</text>
  <path d="M432 212 L432 248 L696 248" fill="none" stroke="#2574a8" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <rect x="710" y="227" width="224" height="42" rx="5" fill="#e7f2ff" stroke="#2574a8" stroke-width="2"/>
  <text x="822" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#174f74">加入父代的同一份 v1</text>
  <line x1="934" y1="248" x2="1070" y2="248" stroke="#2574a8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="1002" y="236" text-anchor="middle" font-size="12" fill="#52606d">继续持有 v1</text>
  <text x="1080" y="253" font-size="13" fill="#52606d">子代理退出</text>

  <text x="36" y="366" font-size="15" font-weight="700" fill="#11634f">新 Agent C · 显式选择 preset</text>
  <text x="605" y="366" font-size="13" fill="#11634f">select('standard')</text>
  <path d="M739 361 L778 361" fill="none" stroke="#147d64" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  <rect x="790" y="340" width="192" height="42" rx="5" fill="#e6f5ef" stroke="#147d64" stroke-width="2"/>
  <text x="886" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#11634f">加入当前 v2</text>

  <text x="36" y="436" font-size="15" font-weight="700" fill="#59636e">进程重启后的冷恢复</text>
  <text x="605" y="436" font-size="13" fill="#52606d">resolve('standard')</text>
  <path d="M739 431 L778 431" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790" y="410" width="192" height="42" rx="5" fill="#f1f3f5" stroke="#78838e" stroke-width="1.5"/>
  <text x="886" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#39434d">使用当前 v2</text>
  <text x="996" y="436" font-size="13" fill="#52606d">不复原内存中的 v1</text>

  <rect x="36" y="490" width="1128" height="78" rx="5" fill="#f6f8fa" stroke="#aab4be" stroke-width="1.5"/>
  <text x="56" y="516" font-size="15" font-weight="700" fill="#17212b">修订保留与释放</text>
  <text x="56" y="541" font-size="14" fill="#39434d">只要 Agent、子代理或临时读取仍持有 v1，退役组合就继续挂载；最后一个引用释放后才 dispose。</text>
  <path d="M1070 248 L1070 290 L1178 290 L1178 553 L1140 553" fill="none" stroke="#c2413b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#red-arrow)"/>
  <text x="914" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#a93632">最后一个 v1 引用释放 → 卸载旧组合</text>

  <rect x="36" y="588" width="1128" height="112" rx="5" fill="#fff7e8" stroke="#cf8b24" stroke-width="1.5"/>
  <text x="56" y="616" font-size="15" font-weight="700" fill="#70480d">独立输入：文件系统中的 skill 正文</text>
  <text x="56" y="643" font-size="14" fill="#70480d">保留组合中的 skill 在加载时读取当前文件正文；修订保留不会冻结外部文件。</text>
  <text x="56" y="671" font-size="13" fill="#70480d">目录摘要不变，也不能保证稍后加载到相同正文。</text>
  <text x="1140" y="671" text-anchor="end" font-size="13" fill="#70480d">目录摘要 ≠ 已加载正文</text>
  <text x="36" y="734" font-size="14" font-weight="700" fill="#a93632">Watchpoints：同一 preset id 可有并存修订 · 省略 preset 的子代理加入父代修订 · 冷恢复解析当前定义</text>
</svg>
