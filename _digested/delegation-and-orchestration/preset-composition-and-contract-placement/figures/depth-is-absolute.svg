<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#595959"/>
    </marker>
    <marker id="a7red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cf1322"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="17" font-weight="bold" fill="#262626">深度是绝对量：从根往下数，不是每跳预算</text>
  <text x="40" y="60" font-size="12" fill="#8c8c8c">child 深度 = parent 深度 + 1；持久 header 是单调 floor。maxDepth 是上限，不是分配给某一跳的额度。</text>

  <line x1="70" y1="250" x2="990" y2="250" stroke="#cf1322" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="990" y="240" font-size="11" fill="#cf1322" text-anchor="end">maxDepth = 2 的拒绝线（绝对深度）</text>

  <rect x="70" y="96" width="180" height="54" rx="8" fill="#f5f5f5" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="160" y="118" font-size="13" font-weight="bold" fill="#262626" text-anchor="middle">Root / CEO</text>
  <text x="160" y="138" font-size="11" fill="#595959" text-anchor="middle">depth 0</text>

  <rect x="310" y="170" width="200" height="54" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="410" y="192" font-size="13" font-weight="bold" fill="#237804" text-anchor="middle">spawn child（vp）</text>
  <text x="410" y="212" font-size="11" fill="#237804" text-anchor="middle">depth 1 · 行上 maxDepth 2</text>

  <rect x="570" y="234" width="200" height="54" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="670" y="256" font-size="13" font-weight="bold" fill="#0958d9" text-anchor="middle">workflow 分支 child</text>
  <text x="670" y="276" font-size="11" fill="#0958d9" text-anchor="middle">depth 2 · workflow 自身无闸</text>

  <rect x="570" y="320" width="200" height="54" rx="8" fill="#fff1f0" stroke="#cf1322" stroke-width="2"/>
  <text x="670" y="342" font-size="13" font-weight="bold" fill="#a8071a" text-anchor="middle">分支里再 spawn</text>
  <text x="670" y="362" font-size="11" fill="#a8071a" text-anchor="middle">depth 3 → 被拒</text>

  <path d="M250 128 L310 186" stroke="#595959" stroke-width="1.5" marker-end="url(#a7)"/>
  <path d="M510 200 L570 250" stroke="#595959" stroke-width="1.5" marker-end="url(#a7)"/>
  <path d="M670 288 L670 320" stroke="#cf1322" stroke-width="2" marker-end="url(#a7red)"/>

  <text x="262" y="150" font-size="10.5" fill="#8c8c8c">+1</text>
  <text x="522" y="222" font-size="10.5" fill="#8c8c8c">+1</text>
  <text x="682" y="308" font-size="10.5" fill="#cf1322">+1 超过 2</text>

  <rect x="70" y="330" width="430" height="150" rx="9" fill="#fafafa" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="90" y="356" font-size="13" font-weight="bold" fill="#262626">三句话记住</text>
  <text x="90" y="382" font-size="11" fill="#595959">1. resolveChildDepth(parent) = parent.depth + 1，绝对量。</text>
  <text x="90" y="404" font-size="11" fill="#595959">2. delegationDepthOf 取 max(header, runtime)：恢复不会把深度清零。</text>
  <text x="90" y="426" font-size="11" fill="#595959">3. workflow 的 agent() 不收 maxDepth，但分支 child 仍带深度；</text>
  <text x="90" y="446" font-size="11" fill="#595959">   分支里再 spawn 继续 +1，撞的是同一个绝对上限。</text>
  <text x="90" y="468" font-size="11" fill="#8c8c8c">“没有闸” ≠ “不计数”。</text>

  <rect x="570" y="400" width="420" height="80" rx="9" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="590" y="426" font-size="12" font-weight="bold" fill="#ad4e00">maxDepth 的来源与优先级</text>
  <text x="590" y="448" font-size="11" fill="#ad4e00">工具行显式值（含 'provider-managed'）优先；</text>
  <text x="590" y="466" font-size="11" fill="#ad4e00">省略时用 subagent 服务默认 1；0 表示禁止委派。</text>

  <text x="40" y="530" font-size="11" fill="#8c8c8c">源码：subagent/src/child-agent.ts:49-58、depth.ts:20-35、index.ts:242-248；workflow-ptc/src/host.ts:203-219。</text>
</svg>
