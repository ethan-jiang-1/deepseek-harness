<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="960" height="400" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">三件必须分开的事：上游原语 · 本地修改 · 产品用法</text>
  <rect x="40" y="56" width="280" height="300" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="180" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">上游 Cordis</text>
  <text x="56" y="120" font-size="12" fill="#9a3412">cordiverse/cordis</text>
  <text x="56" y="140" font-size="12" fill="#c2410c">钉在 vendor/README.md</text>
  <text x="56" y="172" font-size="12" fill="#9a3412">cordis / loader / include</text>
  <text x="56" y="190" font-size="12" fill="#9a3412">group / hmr / timer …</text>
  <text x="56" y="222" font-size="12" fill="#7c2d12">rescoped 为</text>
  <text x="56" y="240" font-size="12" fill="#7c2d12">@deepseek-ai/cordis</text>
  <text x="56" y="272" font-size="11" fill="#c2410c">每个 harness 包把它</text>
  <text x="56" y="290" font-size="11" fill="#c2410c">当 peerDependency</text>
  <text x="56" y="320" font-size="11" fill="#9a3412">改 vendor = 改全产品运行时</text>

  <rect x="340" y="56" width="280" height="300" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="480" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">本仓库本地修改</text>
  <text x="356" y="120" font-size="12" fill="#991b1b">记在 vendor/README.md</text>
  <text x="356" y="148" font-size="12" fill="#7f1d1d">fiber 卸载加固</text>
  <text x="356" y="166" font-size="12" fill="#7f1d1d">Loader 事务性调和</text>
  <text x="356" y="184" font-size="12" fill="#7f1d1d">applyEntryPatches 导出</text>
  <text x="356" y="202" font-size="12" fill="#7f1d1d">insert 行可被后续 patch</text>
  <text x="356" y="220" font-size="12" fill="#7f1d1d">!!js 惰性求值</text>
  <text x="356" y="238" font-size="12" fill="#7f1d1d">disabled 插值</text>
  <text x="356" y="270" font-size="11" fill="#b91c1c">这些不是洁癖。</text>
  <text x="356" y="288" font-size="11" fill="#b91c1c">profile 叠层、dump-config</text>
  <text x="356" y="306" font-size="11" fill="#b91c1c">保真，都靠它们。</text>
  <text x="356" y="330" font-size="11" fill="#991b1b">同步上游时必须重放或退役</text>

  <rect x="640" y="56" width="280" height="300" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="780" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">产品如何使用</text>
  <text x="656" y="120" font-size="12" fill="#1e40af">packages/* 全是插件</text>
  <text x="656" y="148" font-size="12" fill="#1d4ed8">boot() 安装 Loader</text>
  <text x="656" y="166" font-size="12" fill="#1d4ed8">Include 挂 entry 树</text>
  <text x="656" y="184" font-size="12" fill="#1d4ed8">composeEntries 走</text>
  <text x="656" y="202" font-size="12" fill="#1d4ed8">同一套 patch 算法</text>
  <text x="656" y="230" font-size="12" fill="#1e3a8a">dsh --dump-config</text>
  <text x="656" y="248" font-size="12" fill="#1e3a8a">必须等于 boot 结果</text>
  <text x="656" y="280" font-size="11" fill="#2563eb">不要在产品里再写一份</text>
  <text x="656" y="298" font-size="11" fill="#2563eb">「类似 Include 的 patch」</text>
  <text x="656" y="330" font-size="11" fill="#1d4ed8">那会和真树立刻漂移</text>
</svg>
