<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
  </defs>
  <rect width="960" height="380" fill="#fafafa" rx="6"/>
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">waterfall 是 around-middleware：必须调用 next() 才能传下去</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#6b7280">agent/pre-step、agent/request、llm/stream、tools/pre-execute · execute · post-execute 都是这种模式。</text>

  <rect x="40" y="80" width="160" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="120" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">监听器 A</text>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="#2563eb">改写 / 注解</text>
  <line x1="200" y1="115" x2="248" y2="115" stroke="#1d4ed8" marker-end="url(#arrBlue)"/>
  <text x="224" y="104" text-anchor="middle" font-size="10" fill="#1d4ed8">next()</text>

  <rect x="250" y="80" width="160" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="330" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">监听器 B</text>
  <text x="330" y="130" text-anchor="middle" font-size="11" fill="#2563eb">策略 / 审批</text>
  <line x1="410" y1="115" x2="458" y2="115" stroke="#1d4ed8" marker-end="url(#arrBlue)"/>
  <text x="434" y="104" text-anchor="middle" font-size="10" fill="#1d4ed8">next()</text>

  <rect x="460" y="80" width="160" height="70" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="540" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">默认实现</text>
  <text x="540" y="130" text-anchor="middle" font-size="11" fill="#16a34a">真正做事的那一层</text>
  <line x1="620" y1="115" x2="668" y2="115" stroke="#15803d" marker-end="url(#arrGreen)"/>

  <rect x="670" y="80" width="250" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="795" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">返回值沿 next() 传回</text>
  <text x="795" y="130" text-anchor="middle" font-size="11" fill="#c2410c">上游看到的是包装后的结果</text>

  <rect x="40" y="190" width="880" height="150" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="480" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">不调用 next() = 短路整条链</text>
  <text x="480" y="248" text-anchor="middle" font-size="12" fill="#991b1b">这是设计，不是 bug。单点决策事件就该由拥有决策的监听器直接返回。</text>
  <text x="480" y="272" text-anchor="middle" font-size="12" fill="#991b1b">只做注解或观察的监听器必须委托。pre-step 拒绝消息，就是这种短路：后面的模型请求根本不会发生。</text>
  <text x="480" y="304" text-anchor="middle" font-size="12" fill="#7f1d1d">对照：agent/turn-stopping 是 serial，没有 next()。不要用 waterfall 的直觉去读它。</text>
  <text x="480" y="324" text-anchor="middle" font-size="11" fill="#dc2626">prepend: true 只在必须排到普通注册之前时才用。</text>
</svg>
