<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">五条原语对到 vendor/cordis/src/</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">commit 47f94385 · 读插件时按这条图找文件，不要在 packages/ 里找框架原语。</text>

  <rect x="30" y="68" width="175" height="150" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="117" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Plugin</text>
  <text x="44" y="122" font-size="11" fill="#9a3412">registry.ts</text>
  <text x="44" y="140" font-size="11" fill="#c2410c">Plugin.Function</text>
  <text x="44" y="156" font-size="11" fill="#c2410c">Plugin.Constructor</text>
  <text x="44" y="172" font-size="11" fill="#c2410c">Plugin.Object.apply</text>
  <text x="44" y="196" font-size="11" fill="#7c2d12">resolve() 取出 callback</text>

  <rect x="220" y="68" width="175" height="150" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="307" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Context</text>
  <text x="234" y="122" font-size="11" fill="#1e40af">context.ts</text>
  <text x="234" y="140" font-size="11" fill="#2563eb">Proxy + ReflectService</text>
  <text x="234" y="156" font-size="11" fill="#2563eb">isolate() / intercept()</text>
  <text x="234" y="172" font-size="11" fill="#2563eb">fiber / events / registry</text>
  <text x="234" y="196" font-size="11" fill="#1e3a8a">ctx.&lt;key&gt; 不是普通属性</text>

  <rect x="410" y="68" width="175" height="150" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="497" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">inject</text>
  <text x="424" y="122" font-size="11" fill="#166534">registry.ts Inject</text>
  <text x="424" y="140" font-size="11" fill="#16a34a">fiber.ts _refresh()</text>
  <text x="424" y="156" font-size="11" fill="#16a34a">缺服务 → epoch INACTIVE</text>
  <text x="424" y="172" font-size="11" fill="#16a34a">齐了 → _reload()</text>
  <text x="424" y="196" font-size="11" fill="#14532d">ctx.inject = 短写 plugin</text>

  <rect x="600" y="68" width="155" height="150" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="677" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Events</text>
  <text x="614" y="122" font-size="11" fill="#6d28d9">events.ts</text>
  <text x="614" y="140" font-size="11" fill="#7c3aed">EventsService</text>
  <text x="614" y="156" font-size="11" fill="#7c3aed">declare module 合并</text>
  <text x="614" y="172" font-size="11" fill="#7c3aed">on() → fiber.effect</text>
  <text x="614" y="196" font-size="11" fill="#5b21b6">监听器跟 fiber 走</text>

  <rect x="770" y="68" width="160" height="150" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="850" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#115e59">Effects</text>
  <text x="784" y="122" font-size="11" fill="#115e59">fiber.ts effect()</text>
  <text x="784" y="140" font-size="11" fill="#0d9488">先登记 wrapper</text>
  <text x="784" y="156" font-size="11" fill="#0d9488">再跑 execute()</text>
  <text x="784" y="172" font-size="11" fill="#0d9488">卸载倒序 disposer</text>
  <text x="784" y="196" font-size="11" fill="#134e4a">UNLOADING 拒新 effect</text>

  <rect x="30" y="240" width="900" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="270" font-size="13" font-weight="700" fill="#111827">旁边两份，不是第五条原语的一部分</text>
  <text x="50" y="300" font-size="12" fill="#374151">service.ts  Service 子类：构造里 reflect.provide(name, this)，fiber 卸掉时服务一起撤。</text>
  <text x="50" y="324" font-size="12" fill="#374151">fiber.ts    Fiber = 一次 ctx.plugin() 的运行实例。PENDING 等 inject，LOADING 跑插件，ACTIVE 提供服务，UNLOADING 跑 disposer，DISPOSED 不能重启。</text>
  <text x="50" y="348" font-size="12" fill="#374151">一个 plugin callback 可以有多条 fiber（Registry.Runtime.fibers）。HMR / 配置更新卸的是 fiber，不一定删 runtime。</text>
  <text x="50" y="380" font-size="12" fill="#374151">函数插件不要 default export：Loader 认 named export 的 name/inject/apply。混用会丢掉 namespace（postmortem 0001）。</text>
  <text x="50" y="412" font-size="12" fill="#374151">可选服务用 ctx.get(name)。ctx.&lt;key&gt; 走 Proxy，拓扑敏感；get 读全局服务表。</text>
  <text x="50" y="436" font-size="11" fill="#6b7280">隔离：ctx.isolate(name) 给某个服务换 label；cordis:group 的 isolate realm 就是它。</text>
</svg>
