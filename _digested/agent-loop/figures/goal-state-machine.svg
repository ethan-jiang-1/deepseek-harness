<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#595959"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fa8c16"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d4380d"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52c41a"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">Goal 状态机：phase 持久化于 log × activation 仅进程内</text>
  <text x="40" y="54" font-size="12" fill="#8c8c8c">activation 从不写入 session log，重启后一律 disarmed（goal/src/types.ts:97）；变化时发进程内 goal/activation-changed（goal/src/index.ts:495-516）</text>

  <circle cx="460" cy="72" r="5" fill="#333"/>
  <line x1="460" y1="78" x2="460" y2="96" stroke="#595959" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="90" font-size="12" fill="#595959">create()</text>

  <rect x="360" y="100" width="200" height="52" rx="8" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="460" y="124" font-size="15" font-weight="bold" fill="#1677ff" text-anchor="middle">active · armed</text>
  <text x="460" y="144" font-size="10.5" fill="#8c8c8c" text-anchor="middle">round driver 唯一会自动续轮的状态</text>

  <rect x="680" y="100" width="210" height="52" rx="8" fill="#f5faff" stroke="#1677ff" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="785" y="124" font-size="15" font-weight="bold" fill="#1677ff" text-anchor="middle">active · disarmed</text>
  <text x="785" y="144" font-size="10.5" fill="#8c8c8c" text-anchor="middle">goal 仍在进行，自动续轮已关</text>

  <line x1="564" y1="118" x2="676" y2="118" stroke="#595959" stroke-width="2" marker-end="url(#a)"/>
  <text x="620" y="110" font-size="10.5" fill="#595959" text-anchor="middle">disarm</text>
  <line x1="676" y1="140" x2="564" y2="140" stroke="#595959" stroke-width="2" marker-end="url(#a)"/>
  <text x="620" y="160" font-size="10.5" fill="#595959" text-anchor="middle">resume() 重武装</text>

  <line x1="380" y1="154" x2="200" y2="298" stroke="#fa8c16" stroke-width="2" marker-end="url(#ao)"/>
  <text x="290" y="224" font-size="12" fill="#d46b08" text-anchor="end">pause()</text>
  <line x1="260" y1="298" x2="440" y2="154" stroke="#52c41a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="365" y="224" font-size="12" fill="#389e0d">resume()</text>
  <text x="52" y="240" font-size="10.5" fill="#d4380d">paused 只能由 human 恢复：</text>
  <text x="52" y="256" font-size="10.5" fill="#d4380d">模型 update_goal resume 抛</text>
  <text x="52" y="272" font-size="10.5" fill="#d4380d">GOAL_TOOL_RESUME_PAUSED</text>

  <line x1="540" y1="154" x2="720" y2="298" stroke="#d4380d" stroke-width="2" marker-end="url(#ar)"/>
  <text x="630" y="224" font-size="12" fill="#d4380d">block(reason)</text>
  <line x1="660" y1="298" x2="480" y2="154" stroke="#52c41a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="555" y="224" font-size="12" fill="#389e0d" text-anchor="end">resume()</text>

  <rect x="120" y="300" width="180" height="52" rx="8" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
  <text x="210" y="322" font-size="15" font-weight="bold" fill="#d46b08" text-anchor="middle">paused</text>
  <text x="210" y="340" font-size="10.5" fill="#8c8c8c" text-anchor="middle">自动续轮关</text>

  <rect x="620" y="300" width="180" height="52" rx="8" fill="#fff1f0" stroke="#d4380d" stroke-width="2"/>
  <text x="710" y="322" font-size="15" font-weight="bold" fill="#d4380d" text-anchor="middle">blocked</text>
  <text x="710" y="340" font-size="10.5" fill="#8c8c8c" text-anchor="middle">必须携带 blockedReason</text>

  <line x1="460" y1="154" x2="460" y2="496" stroke="#595959" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="320" font-size="12" fill="#595959">complete()</text>

  <line x1="210" y1="354" x2="400" y2="496" stroke="#595959" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="354" x2="520" y2="496" stroke="#595959" stroke-width="2" marker-end="url(#a)"/>

  <line x1="372" y1="498" x2="372" y2="448" stroke="#d4380d" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="380" y="466" font-size="11" font-weight="bold" fill="#d4380d">resume ✗（无此转换）</text>

  <rect x="370" y="500" width="180" height="52" rx="8" fill="#fafafa" stroke="#8c8c8c" stroke-width="2"/>
  <text x="460" y="522" font-size="15" font-weight="bold" fill="#595959" text-anchor="middle">complete</text>
  <text x="460" y="540" font-size="10.5" fill="#8c8c8c" text-anchor="middle">终态：不可 resume，仅可被替换</text>

  <rect x="580" y="470" width="290" height="84" rx="6" fill="#fafafa" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="594" y="490" font-size="11" font-weight="bold" fill="#595959">resume 允许集（goal/src/index.ts:368）：</text>
  <text x="594" y="506" font-size="11" fill="#595959">['active', 'paused', 'blocked']</text>
  <text x="594" y="522" font-size="11" fill="#595959">严格 fold 同样校验（goal/src/fold.ts:225-236）</text>
  <text x="594" y="538" font-size="11" fill="#595959">complete 只能被 create() 替换（新 goal id）</text>

  <polyline points="370,526 48,526 48,126 356,126" fill="none" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="60" y="548" font-size="11" fill="#1677ff">create() 替换（蓝色回边）：</text>
  <text x="60" y="564" font-size="11" fill="#1677ff">旧 goal 已 complete → 新 goal 新 id、revision=1</text>

  <rect x="60" y="600" width="470" height="56" rx="6" fill="#fff" stroke="#bfbfbf" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="76" y="622" font-size="11.5" fill="#595959">任意当前状态 → /goal clear → 墓碑 tombstone（revision+1，历史保留）</text>
  <text x="76" y="640" font-size="11.5" fill="#595959">clear 后 currentGoal() = undefined，round driver 静默停止</text>

  <text x="560" y="592" font-size="10.5" fill="#8c8c8c">disarm 触发：turn/end max-tokens · agent/error · 持久化失败 ·</text>
  <text x="560" y="608" font-size="10.5" fill="#8c8c8c">driver 卸载/重载 · session-start（重启/恢复）</text>
  <text x="560" y="624" font-size="10.5" fill="#8c8c8c">blocked codes：model-reported · round-limit ·</text>
  <text x="560" y="640" font-size="10.5" fill="#8c8c8c">prompt-rejected · queue-failed</text>
  <text x="560" y="660" font-size="10.5" fill="#8c8c8c">权限：create_goal / edit / pause 需 direct-human；模型 resume 仅限</text>
  <text x="560" y="676" font-size="10.5" fill="#8c8c8c">active-disarmed 与 blocked（paused 只由 human）；complete / blocked</text>
  <text x="560" y="692" font-size="10.5" fill="#8c8c8c">在匹配的 goal-round 中亦被授权（tool-goal/authority.ts · completionAuthority）</text>
</svg>
