<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fa8c16"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">Agent Loop ↔ Goal Round Driver：实际通信通道（≥ 6 条）</text>
  <text x="40" y="54" font-size="12" fill="#8c8c8c">followup + status 只是其中两条：pre-step 拦截是 round 消息的准入闸，其余是事件簿记</text>

  <rect x="50" y="90" width="240" height="380" rx="10" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
  <text x="170" y="120" font-size="15" font-weight="bold" fill="#d46b08" text-anchor="middle">goal-round-driver</text>
  <text x="170" y="140" font-size="11" fill="#8c8c8c" text-anchor="middle">串行调度状态机 + 竞态栅栏</text>
  <text x="170" y="446" font-size="10.5" fill="#8c8c8c" text-anchor="middle">全部状态可从 session log 重建</text>

  <rect x="670" y="90" width="240" height="380" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="790" y="120" font-size="15" font-weight="bold" fill="#1677ff" text-anchor="middle">agent-loop</text>
  <text x="790" y="140" font-size="11" fill="#8c8c8c" text-anchor="middle">ReactLoopAgent：turn / step / inbox</text>
  <text x="790" y="446" font-size="10.5" fill="#8c8c8c" text-anchor="middle">不感知 goal，只发事件、开扩展点</text>

  <line x1="294" y1="170" x2="666" y2="170" stroke="#fa8c16" stroke-width="2" marker-end="url(#ar)"/>
  <text x="480" y="160" font-size="10.5" fill="#d46b08" text-anchor="middle">followup(message)：round 消息入 inbox</text>

  <line x1="666" y1="214" x2="294" y2="214" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="204" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/status 'idle' → requestDrive</text>

  <line x1="666" y1="258" x2="294" y2="258" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="248" font-size="10.5" fill="#1677ff" text-anchor="middle">goal/changed → needsCheckpoint + 排程</text>

  <line x1="666" y1="302" x2="294" y2="302" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="292" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/pre-step：验证 reservation，可 reject（准入闸）</text>

  <line x1="666" y1="346" x2="294" y2="346" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="336" font-size="10.5" fill="#1677ff" text-anchor="middle">turn/end：max-tokens→disarm · aborted→cancelled</text>

  <line x1="666" y1="390" x2="294" y2="390" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="380" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/error → disarm</text>

  <line x1="666" y1="434" x2="294" y2="434" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="424" font-size="10.5" fill="#1677ff" text-anchor="middle">inbox/inserted·claimed·discarded → 竞争/过期簿记</text>

  <rect x="50" y="496" width="860" height="52" rx="8" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <text x="66" y="516" font-size="11.5" font-weight="bold" fill="#722ed1">session log（append-only）—— 两边共同的持久化与回放基底</text>
  <text x="66" y="534" font-size="11" fill="#722ed1">goal/change 由 GoalService 写入；fold.ts 严格回放校验 revision 与 round 归属</text>

  <text x="50" y="574" font-size="12" fill="#389e0d">「无直接耦合」成立 —— driver 不 import loop 内部，只经由事件与扩展点交互。</text>
</svg>
