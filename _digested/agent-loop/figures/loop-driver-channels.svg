<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fa8c16"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#722ed1"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="16" font-weight="bold" fill="#333">Agent Loop 与 Goal Round Driver：实际通信通道（8 条）</text>
  <text x="40" y="54" font-size="12" fill="#8c8c8c">followup + status 只是其中两条：pre-step 是 round 消息的准入闸，其余是事件簿记；goal/activation-changed 不在此列，见下方单独说明</text>

  <rect x="50" y="90" width="240" height="400" rx="10" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
  <text x="170" y="120" font-size="15" font-weight="bold" fill="#d46b08" text-anchor="middle">goal-round-driver</text>
  <text x="170" y="140" font-size="11" fill="#8c8c8c" text-anchor="middle">串行调度状态机 + 竞态栅栏</text>
  <text x="170" y="450" font-size="10.5" fill="#8c8c8c" text-anchor="middle">phase / revision / round 计数可重建</text>
  <text x="170" y="466" font-size="10.5" fill="#8c8c8c" text-anchor="middle">activation 与排程状态进程内</text>

  <rect x="670" y="90" width="240" height="400" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="790" y="120" font-size="15" font-weight="bold" fill="#1677ff" text-anchor="middle">agent-loop</text>
  <text x="790" y="140" font-size="11" fill="#8c8c8c" text-anchor="middle">ReactLoopAgent：turn / step / inbox</text>
  <text x="790" y="450" font-size="10.5" fill="#8c8c8c" text-anchor="middle">不感知 goal，只发事件、开扩展点</text>

  <line x1="294" y1="164" x2="666" y2="164" stroke="#fa8c16" stroke-width="2" marker-end="url(#ar)"/>
  <text x="480" y="155" font-size="10.5" fill="#d46b08" text-anchor="middle">followup(message)：round 消息入 inbox</text>

  <line x1="666" y1="204" x2="294" y2="204" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="195" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/status 'idle' → requestDrive</text>

  <line x1="666" y1="244" x2="294" y2="244" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="235" font-size="10.5" fill="#1677ff" text-anchor="middle">goal/changed（GoalService 落 log 后回调）→ needsCheckpoint + 排程</text>

  <line x1="666" y1="284" x2="294" y2="284" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="275" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/pre-step：验证 reservation，可 reject（准入闸）</text>

  <line x1="666" y1="324" x2="294" y2="324" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="315" font-size="10.5" fill="#1677ff" text-anchor="middle">turn/end：max-tokens→disarm · aborted→cancelled</text>

  <line x1="666" y1="364" x2="294" y2="364" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="355" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/error → disarm</text>

  <line x1="666" y1="404" x2="294" y2="404" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="395" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/inbox/inserted·claimed·discarded → 竞争/过期簿记</text>

  <line x1="666" y1="440" x2="294" y2="440" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="431" font-size="10.5" fill="#1677ff" text-anchor="middle">agent/session-start → 清空 attempt / competingQueued / needsCheckpoint</text>
  <text x="480" y="458" font-size="10.5" fill="#722ed1" text-anchor="middle">goal/activation-changed：GoalService 进程内广播</text>
  <text x="480" y="472" font-size="10.5" fill="#722ed1" text-anchor="middle">driver 不消费；Web goal bar 订阅（不是 loop↔driver 通道）</text>

  <rect x="50" y="506" width="860" height="52" rx="8" fill="#fff1f0" stroke="#d4380d" stroke-width="2"/>
  <text x="66" y="526" font-size="11.5" font-weight="bold" fill="#d4380d">host pause（Web 按钮，在 agent initiator 边界之外）：goal/changed 让 driver 调</text>
  <text x="66" y="544" font-size="11" fill="#d4380d">agent.cancel({ kind: 'user' }, { keepInbox: true }) 中止在跑的 turn；模型自己的 pause 在 turn 内，正常跑完</text>

  <rect x="50" y="572" width="860" height="52" rx="8" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <text x="66" y="592" font-size="11.5" font-weight="bold" fill="#722ed1">session log（append-only）—— 两边共同的持久化与回放基底</text>
  <text x="66" y="610" font-size="11" fill="#722ed1">goal/change 由 GoalService 写入；fold.ts 严格回放校验 revision 与 round 归属</text>

  <text x="50" y="650" font-size="12" fill="#389e0d">「无直接耦合」成立 —— driver 不 import loop 内部，只经由事件与扩展点交互。</text>
</svg>
