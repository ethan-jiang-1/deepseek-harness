<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="400" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">initiator 边界：因果归属，不是存活证明也不是授权</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">currentInitiator() 只回答「这段操作继承自谁」；谁在边界内、谁在边界外，决定 pause 等判据怎么分。</text>

  <rect x="30" y="70" width="560" height="250" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="310" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">withInitiator(agent, …) — 边界内</text>
  <rect x="55" y="112" width="510" height="56" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="310" y="136" text-anchor="middle" font-size="12" fill="#1e40af">loop 的 wakeDriver()：withInitiator(this, () =&gt; kick())</text>
  <text x="310" y="156" text-anchor="middle" font-size="11" fill="#2563eb">整段 activity（若干 turn / step / 工具执行）都算该 agent 的因果延续</text>
  <rect x="55" y="182" width="510" height="56" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="#166534">模型的 update_goal pause：跑在自己的 turn 内</text>
  <text x="310" y="226" text-anchor="middle" font-size="11" fill="#15803d">currentInitiator() === agent → 正常跑完当前 turn，pause 下轮生效</text>
  <rect x="55" y="252" width="510" height="50" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="310" y="273" text-anchor="middle" font-size="11" fill="#374151">显式身份传递：AgentSetup(agentCtx, agent) · CreateAgentOptions.parentAgent ·</text>
  <text x="310" y="291" text-anchor="middle" font-size="11" fill="#374151">wire 字段 agentId 解析（不再有 ctx.agent 反向属性）</text>

  <rect x="620" y="70" width="310" height="250" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="775" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">withoutInitiator(…) — 边界外</text>
  <rect x="645" y="112" width="260" height="56" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="775" y="136" text-anchor="middle" font-size="12" fill="#9a3412">driver 的调度任务</text>
  <text x="775" y="156" text-anchor="middle" font-size="11" fill="#c2410c">后台调度不属于任何 agent 的 turn</text>
  <rect x="645" y="182" width="260" height="56" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="775" y="206" text-anchor="middle" font-size="12" fill="#b91c1c">host 的 Pause（Web 按钮等）</text>
  <text x="775" y="226" text-anchor="middle" font-size="11" fill="#991b1b">currentInitiator() ≠ agent → agent.cancel 中止在跑的 turn</text>
  <text x="775" y="262" text-anchor="middle" font-size="11" fill="#7c2d12">「现在停下」，keepInbox 保留待处理输入；</text>
  <text x="775" y="280" text-anchor="middle" font-size="11" fill="#7c2d12">pause → 立即 resume 的竞态由 revision 栅栏挡住</text>

  <rect x="30" y="344" width="900" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="362" text-anchor="middle" font-size="11" fill="#374151">同一 API 区分两个都合法的发起者（host 与 model），据此决定是否中止在跑的 turn；</text>
  <text x="480" y="378" text-anchor="middle" font-size="11" fill="#374151">goal 工具授权（requireDirectHuman / completionAuthority）仍基于 live agent 与 initiator，是另一层判据。</text>
</svg>
