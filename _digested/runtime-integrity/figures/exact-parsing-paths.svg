<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">精确解析的分流：缺省、类型错误和额外字段</title>
  <desc id="desc">普通非 lazy 节点先处理 undefined 和 null。number 默认 5 时，缺省克隆默认值后仍须通过数字校验；字符串 5 不进入缺省分支。required 在默认值之前拒绝缺省。普通 object 保留未声明键，因此拼错 prto 不会设置 port，也不会自动报错。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; font-size: 15px; fill: #1e293b; }
      .title { font-size: 23px; font-weight: 700; }
      .heading { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .watch { font-size: 14px; fill: #9a3412; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="700" rx="12" fill="#f8fafc"/>
  <text x="560" y="37" text-anchor="middle" class="title">先识别缺省，再看类型；未知键另作处理</text>
  <text x="560" y="64" text-anchor="middle" class="small">number / object 简写 Schema.number / Schema.object；普通非 lazy 路径，不启用 loose 或 autofix。</text>

  <text x="30" y="107" class="heading">输入与声明</text>
  <text x="332" y="107" class="heading">解析动作</text>
  <text x="775" y="107" class="heading">结果与观察点</text>

  <rect x="30" y="123" width="280" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="152" class="mono">number().default(5)</text>
  <text x="48" y="184">输入 undefined 或 null</text>
  <path d="M310 168H324" class="line"/>
  <rect x="332" y="123" width="400" height="90" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="350" y="152">克隆默认值 5 → 再检查数字类型</text>
  <text x="350" y="184" class="small">默认值若是 'bad'，仍会解析失败</text>
  <path d="M732 168H767" class="line"/>
  <rect x="775" y="123" width="315" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="793" y="152" class="heading">返回数字 5</text>
  <text x="793" y="184" class="watch">默认值也必须满足声明</text>

  <rect x="30" y="233" width="280" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="262" class="mono">number().default(5)</text>
  <text x="48" y="294">输入字符串 '5'</text>
  <path d="M310 278H324" class="line"/>
  <rect x="332" y="233" width="400" height="90" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="350" y="262">已有值 → 不取默认值 → 检查类型</text>
  <text x="350" y="294" class="small">普通 number 不执行字符串转数字</text>
  <path d="M732 278H767" class="line"/>
  <rect x="775" y="233" width="315" height="90" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="793" y="262" class="mono">expected number</text>
  <text x="793" y="294" class="watch">类型错误不是缺省</text>

  <rect x="30" y="343" width="280" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="372" class="mono">number().required().default(5)</text>
  <text x="48" y="404">输入 undefined 或 null</text>
  <path d="M310 388H324" class="line"/>
  <rect x="332" y="343" width="400" height="90" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="350" y="372">required 先拒绝缺省</text>
  <text x="350" y="404" class="small">调换 required / default 的书写次序也一样</text>
  <path d="M732 388H767" class="line"/>
  <rect x="775" y="343" width="315" height="90" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="793" y="372" class="mono">missing required value</text>
  <text x="793" y="404" class="watch">不会用默认值补救</text>

  <rect x="30" y="453" width="280" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="48" y="482">object 的 port 默认 80</text>
  <text x="48" y="514" class="mono">输入 { prto: 90 }</text>
  <path d="M310 498H324" class="line"/>
  <rect x="332" y="453" width="400" height="90" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="350" y="482">port 缺省 → 80；未声明的 prto 保留</text>
  <text x="350" y="514" class="small">object({ ... }) 默认不把字段表当白名单</text>
  <path d="M732 498H767" class="line"/>
  <rect x="775" y="453" width="315" height="90" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="793" y="482" class="mono">{ port: 80, prto: 90 }</text>
  <text x="793" y="514" class="watch">解析通过，错字仍存在</text>

  <rect x="30" y="578" width="514" height="92" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="49" y="607" class="heading">没有默认值、也没有 required？</text>
  <text x="49" y="635">number()(null) → null；缺省可直接返回。</text>
  <text x="49" y="657" class="small">容器自带 {} / [] 默认值；子字段仍须分别通过解析。</text>
  <rect x="566" y="578" width="524" height="92" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="585" y="607" class="heading">诊断：比对原始输入与完整输出</text>
  <text x="585" y="635" class="watch">先区分缺省、错误类型、拼错的键，再查显式容错。</text>
  <text x="585" y="657" class="small">默认值不会自动修正错字；严格字段策略要由作者明确提供。</text>
</svg>
