<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="380" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">信封：type / seq / time / data，另加 ignorable 与 surface 字段</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#6b7280">packages/core/session/src/types.ts · SESSION_FORMAT_VERSION = 3</text>
  <rect x="40" y="64" width="280" height="140" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="180" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">每个事件都有</text>
  <text x="56" y="118" font-size="12" fill="#1e40af">type · seq · time · data</text>
  <text x="56" y="140" font-size="12" fill="#2563eb">data 由 SessionEventMap[type] 决定</text>
  <text x="56" y="162" font-size="12" fill="#2563eb">append 时 isJsonValue</text>
  <text x="56" y="184" font-size="12" fill="#1e3a8a">seq 连续（事件身份）</text>
  <rect x="340" y="64" width="280" height="140" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="480" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">surface 四类才有</text>
  <text x="356" y="116" font-size="12" fill="#9a3412">system/message</text>
  <text x="356" y="136" font-size="12" fill="#c2410c">user/message</text>
  <text x="356" y="156" font-size="12" fill="#c2410c">assistant/message</text>
  <text x="356" y="176" font-size="12" fill="#c2410c">tool/result</text>
  <text x="356" y="196" font-size="12" fill="#7c2d12">surfaceOp + sourceEventSeqs</text>
  <rect x="640" y="64" width="280" height="140" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="780" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">读未知 type</text>
  <text x="656" y="118" font-size="12" fill="#b91c1c">无 ignorable → 拒绝整份 log</text>
  <text x="656" y="140" font-size="12" fill="#991b1b">ignorable: true → 可跳过</text>
  <text x="656" y="162" font-size="12" fill="#991b1b">默认 required：忘标宁可拒</text>
  <text x="656" y="184" font-size="11" fill="#7f1d1d">KNOWN_SESSION_EVENT_TYPES</text>
  <rect x="40" y="224" width="880" height="128" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="250" font-size="12" fill="#374151">普通事件类型不 bump；header、信封、核心语义或 surface 机制的结构变化才 bump。</text>
  <text x="60" y="274" font-size="12" fill="#374151">deriveMessages() 只折叠有序 surface。</text>
  <text x="60" y="296" font-size="12" fill="#374151">request/header 单独重建 config / system / tools；request/context 只记录路由容量。</text>
  <text x="60" y="320" font-size="12" fill="#374151">未知类型守卫在读侧；append 不查词汇表，避免活会话中途拒写。</text>
  <text x="60" y="340" font-size="11" fill="#6b7280">仓外插件事件默认不在 KNOWN 集合里；预发布接受拒 resume，而不是静默掏空。</text>
</svg>
