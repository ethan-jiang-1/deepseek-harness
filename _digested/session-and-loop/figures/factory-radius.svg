<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="340" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">产品面对 ctx.agents；换 loop = 换 AgentFactory，不是换注册表</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#6b7280">dsh-agent 拥有接口；dsh-agent-loop 的 ReactLoopAgent 是默认实现</text>
  <rect x="40" y="68" width="420" height="150" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="250" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">只该依赖 dsh-agent</text>
  <text x="56" y="122" font-size="12" fill="#166534">UI、ACP 桥、多数 tool、commands</text>
  <text x="56" y="144" font-size="12" fill="#15803d">ctx.agents.create / resume</text>
  <text x="56" y="166" font-size="12" fill="#15803d">agent.followup / inject / cancel</text>
  <text x="56" y="188" font-size="12" fill="#14532d">session/event 渲染</text>
  <rect x="500" y="68" width="420" height="150" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="710" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">默认实现的组合职责</text>
  <text x="516" y="122" font-size="12" fill="#b91c1c">profile 选择一个 AgentFactory provider</text>
  <text x="516" y="144" font-size="12" fill="#991b1b">默认 provider 是 dsh-agent-loop</text>
  <text x="516" y="166" font-size="12" fill="#991b1b">替换时更新插件行与可解析依赖</text>
  <text x="516" y="188" font-size="12" fill="#7f1d1d">Consumer import 仍停在 dsh-agent</text>
  <rect x="40" y="238" width="880" height="72" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="60" y="266" font-size="12" fill="#9a3412">换 loop 的真实半径：Agent / AgentFactory 接口、session 生命周期与日志、agent/* 的 mode 和 scope。</text>
  <text x="60" y="290" font-size="11" fill="#7c2d12">组合层另负责替换默认 provider 行；私有 loop 方法和手写包依赖清单都不是兼容接口。</text>
</svg>
