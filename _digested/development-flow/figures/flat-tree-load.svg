<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <rect width="980" height="560" fill="#fafafa" rx="6"/>
  <text x="490" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">树固定为三层：24 个叶子目录，1271 篇正文全平摊在里面</text>
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#6b7280">walkAgentNoteTree 第 68 行：深度不等于 3 一律拒绝 —— expected {lifecycle}/{class}/file.md</text>

  <text x="60" y="84" font-weight="700" fill="#1f2937">实际形状（基线 b830ec95，只数英文正文）</text>

  <rect x="60" y="96" width="230" height="120" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="72" y="118" font-weight="700" fill="#374151">第 1 层 · lifecycle</text>
  <text x="72" y="138" font-size="11" fill="#4b5563">proposed / implemented</text>
  <text x="72" y="154" font-size="11" fill="#4b5563">rejected / archived</text>
  <text x="72" y="178" font-size="10" fill="#6b7280">闭集 4 个，等于状态</text>
  <text x="72" y="194" font-size="10" fill="#6b7280">顶层多一个目录即报错：</text>
  <text x="72" y="208" font-size="10" fill="#6b7280">unknown lifecycle folder</text>

  <rect x="320" y="96" width="230" height="120" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="332" y="118" font-weight="700" fill="#374151">第 2 层 · class</text>
  <text x="332" y="138" font-size="11" fill="#4b5563">feature / bug-fix /</text>
  <text x="332" y="154" font-size="11" fill="#4b5563">simplification / architecture</text>
  <text x="332" y="170" font-size="11" fill="#4b5563">/ process / testing</text>
  <text x="332" y="194" font-size="10" fill="#6b7280">闭集 6 个，且**原生槽位**</text>
  <text x="332" y="208" font-size="10" fill="#6b7280">既不能分叉也不能细分</text>

  <rect x="580" y="96" width="150" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="592" y="118" font-weight="700" fill="#7f1d1d">第 3 层 · 文件</text>
  <text x="592" y="140" font-size="10" fill="#991b1b">yyyy-mm-dd-</text>
  <text x="592" y="154" font-size="10" fill="#991b1b">topic.md</text>
  <text x="592" y="176" font-size="10" fill="#b91c1c">第 4 层？</text>
  <text x="592" y="192" font-size="10" fill="#b91c1c">深度 4 直接报错</text>
  <text x="592" y="208" font-size="10" fill="#b91c1c">（无此可能）</text>

  <rect x="760" y="96" width="168" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="772" y="118" font-weight="700" fill="#0c4a6e">叶子总数</text>
  <text x="772" y="142" font-size="22" font-weight="700" fill="#0369a1">4 × 6</text>
  <text x="772" y="166" font-size="11" fill="#0369a1">= 24 个目录</text>
  <text x="772" y="190" font-size="10" fill="#0369a1">1271 篇英文正文</text>
  <text x="772" y="206" font-size="10" fill="#0369a1">全部平摊在这里</text>

  <text x="60" y="252" font-weight="700" fill="#1f2937">负载集中在四个目录（每列长度正比于篇数）</text>

  <rect x="60" y="266" width="890" height="130" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/>

  <text x="80" y="290" font-size="11" fill="#374151">archived/feature</text>
  <rect x="240" y="280" width="306" height="14" rx="3" fill="#dc2626"/>
  <text x="556" y="291" font-size="11" font-weight="700" fill="#7f1d1d">306</text>

  <text x="80" y="314" font-size="11" fill="#374151">archived/architecture</text>
  <rect x="240" y="304" width="185" height="14" rx="3" fill="#f97316"/>
  <text x="435" y="315" font-size="11" font-weight="700" fill="#9a3412">185</text>

  <text x="80" y="338" font-size="11" fill="#374151">archived/bug-fix</text>
  <rect x="240" y="328" width="182" height="14" rx="3" fill="#f97316"/>
  <text x="432" y="339" font-size="11" font-weight="700" fill="#9a3412">182</text>

  <text x="80" y="362" font-size="11" fill="#374151">implemented/architecture</text>
  <rect x="240" y="352" width="180" height="14" rx="3" fill="#dc2626"/>
  <text x="430" y="363" font-size="11" font-weight="700" fill="#7f1d1d">180</text>

  <text x="620" y="290" font-size="11" fill="#374151">archived/process</text>
  <text x="800" y="290" font-size="11" font-weight="700" fill="#9a3412">120</text>
  <text x="620" y="314" font-size="11" fill="#374151">implemented/feature</text>
  <text x="800" y="314" font-size="11" font-weight="700" fill="#4b5563">40</text>
  <text x="620" y="338" font-size="11" fill="#374151">implemented/process</text>
  <text x="800" y="338" font-size="11" font-weight="700" fill="#4b5563">34</text>
  <text x="620" y="362" font-size="10" fill="#374151">rejected/simplification</text>
  <text x="800" y="362" font-size="11" font-weight="700" fill="#4b5563">7</text>

  <text x="80" y="384" font-size="10" fill="#6b7280">前四项占全树 853/1271 ≈ 67%。其余 16 个叶子目录合计 418 篇，单个最多 39 篇。</text>

  <rect x="60" y="410" width="430" height="112" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="76" y="434" font-weight="700" fill="#92400e">为什么能这么平摊：两条红利</text>
  <text x="76" y="456" font-size="11" fill="#78350f">① 路径即元数据 —— 状态和种类都在地址里，无需索引</text>
  <text x="76" y="476" font-size="11" fill="#78350f">② 命名即摘要 —— 文件名是一个行为（07 篇），</text>
  <text x="76" y="494" font-size="11" fill="#78350f">    所以 ls 的输出本身就是一份可读目录</text>
  <text x="76" y="514" font-size="11" fill="#78350f">两条合起来：搜索取代浏览，平摊不成为问题</text>

  <rect x="510" y="410" width="440" height="112" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="526" y="434" font-weight="700" fill="#7f1d1d">代价：到某个量级，两条红利同时失效</text>
  <text x="526" y="456" font-size="11" fill="#991b1b">· implemented/architecture 按月 8 / 26 / 28 / 88 / 30</text>
  <text x="526" y="476" font-size="11" fill="#991b1b">· 180 篇里 session 开头 8 篇、desktop 7、client 7 ——</text>
  <text x="526" y="494" font-size="11" fill="#991b1b">  同一主题被日期打散到目录各处</text>
  <text x="526" y="512" font-size="11" fill="#991b1b">· 而 INDEX.md 被明文禁止（有专用报错）</text>

  <rect x="60" y="534" width="890" height="18" rx="4" fill="#f3f4f6"/>
  <text x="76" y="547" font-size="10" fill="#374151">结论：不是「平摊错了」，是 6 个 class 是原生的槽位、写入量按月线性增长 —— 分类的基数固定而条目数不固定，迟早交账。</text>
</svg>
