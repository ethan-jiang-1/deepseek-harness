<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="580" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">class：先问「这条决定改变的是什么」</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">闭集 6 个，编码在路径第二层。引入决定：2026-06-20-agent-note-classification（已归档，现行合同在 .agents/notes/README.md Classification 节）。</text>

  <rect x="290" y="68" width="380" height="30" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="88" text-anchor="middle" font-size="12" fill="#374151">这条 Agent Note 记的是什么性质的决定？</text>

  <line x1="380" y1="98" x2="250" y2="124" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="98" x2="710" y2="124" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="128" width="440" height="388" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="250" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">改的是交付源码（shipped source）</text>
  <text x="250" y="170" text-anchor="middle" font-size="11" fill="#2563eb">影响运行时行为或产品结构</text>

  <rect x="46" y="184" width="200" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="146" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">feature</text>
  <text x="146" y="222" text-anchor="middle" font-size="11" fill="#1e3a8a">新的用户 / 模型可见能力</text>
  <text x="146" y="242" text-anchor="middle" font-size="10" fill="#3b5bdb">例：approval-seam、pty-sessions</text>

  <rect x="254" y="184" width="200" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="354" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">bug-fix</text>
  <text x="354" y="222" text-anchor="middle" font-size="11" fill="#1e3a8a">修正缺陷 / 补复盘暴露缺口</text>
  <text x="354" y="242" text-anchor="middle" font-size="10" fill="#3b5bdb">例：session-open-read-coord</text>

  <rect x="46" y="266" width="200" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="146" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">simplification</text>
  <text x="146" y="304" text-anchor="middle" font-size="11" fill="#1e3a8a">删代码 / 收面，不加能力</text>
  <text x="146" y="324" text-anchor="middle" font-size="10" fill="#3b5bdb">例：jsonl-only-persistence</text>

  <rect x="254" y="266" width="200" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="354" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">architecture</text>
  <text x="354" y="304" text-anchor="middle" font-size="11" fill="#1e3a8a">包关联与运行时词汇结构</text>
  <text x="354" y="324" text-anchor="middle" font-size="10" fill="#3b5bdb">例：capability-seams、sessions</text>

  <rect x="46" y="350" width="408" height="58" rx="8" fill="#fef9c3" stroke="#eab308" stroke-dasharray="5 3"/>
  <text x="250" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">refactor 故意不在闭集里</text>
  <text x="250" y="392" text-anchor="middle" font-size="11" fill="#a16207">与 simplification 几乎重合；「行为是否改变」后者已编码。</text>

  <text x="250" y="432" text-anchor="middle" font-size="11" fill="#1e3a8a">feature 的合并特判：只有功能从生产代码、配置、schema、</text>
  <text x="250" y="450" text-anchor="middle" font-size="11" fill="#1e3a8a">持久化/wire、迁移、兼容行为里全部消失，才可被移除 note 吸收。</text>
  <text x="250" y="478" text-anchor="middle" font-size="11" fill="#6b7280">rejected/ 8 篇中 7 篇在 simplification，仅 1 篇在 architecture。</text>

  <rect x="490" y="128" width="440" height="218" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="710" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">围绕代码的工装（around the code）</text>
  <text x="710" y="170" text-anchor="middle" font-size="11" fill="#c2410c">不改变产品运行时行为</text>

  <rect x="506" y="184" width="200" height="72" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="606" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">process</text>
  <text x="606" y="222" text-anchor="middle" font-size="11" fill="#7c2d12">门禁、包管理、vendoring 等</text>
  <text x="606" y="242" text-anchor="middle" font-size="10" fill="#9a3412">例：node-engine-floor</text>

  <rect x="714" y="184" width="200" height="72" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="814" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">testing</text>
  <text x="814" y="222" text-anchor="middle" font-size="11" fill="#7c2d12">测试基础设施与测试策略</text>
  <text x="814" y="242" text-anchor="middle" font-size="10" fill="#9a3412">例：real-api-e2e-ci</text>

  <text x="710" y="286" text-anchor="middle" font-size="11" fill="#7c2d12">本分类决定自己就是一篇 process note——</text>
  <text x="710" y="304" text-anchor="middle" font-size="11" fill="#7c2d12">它改的是仓库怎么组织，不是 harness 运行时做什么。</text>

  <rect x="490" y="362" width="440" height="154" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="710" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">architecture / process 的分界线</text>
  <text x="510" y="412" font-size="11" fill="#374151">「architecture is about the source we ship;</text>
  <text x="510" y="430" font-size="11" fill="#374151">process is the surrounding tooling and workflow.」</text>
  <text x="710" y="458" text-anchor="middle" font-size="11" fill="#6b7280">拿不准时问：改动落在产品本身，还是围绕产品的工装？</text>
  <text x="710" y="480" text-anchor="middle" font-size="11" fill="#6b7280">新增 class 是 deliberate act：须同改 agent-note-tree.ts 与 README。</text>

  <rect x="30" y="532" width="900" height="32" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="480" y="553" text-anchor="middle" font-size="11" fill="#3730a3">闭集由 scripts/agent-note-tree.ts 的 AGENT_NOTE_CLASSES 与 README 双份维护；verify-agent-note-classification 拒绝未知目录。</text>
</svg>
