<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#fafafa" rx="6"/>
  <text x="490" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">忘记的纪律：四分法、判据、校准样例</text>
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#6b7280">判据只有两句英文明文，而方法被明文否定：rather than word count, age, or a target quota</text>

  <rect x="40" y="72" width="216" height="118" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.4"/>
  <text x="148" y="94" text-anchor="middle" font-weight="700" fill="#111827">implemented/</text>
  <text x="148" y="112" text-anchor="middle" font-size="11" fill="#6b7280">条目：296 篇（英文正文）</text>
  <text x="56" y="140" font-size="11" fill="#374151">先问：只描述小 UI 调整</text>
  <text x="56" y="156" font-size="11" fill="#374151">或纯机械改动吗？</text>
  <text x="56" y="176" font-size="11" fill="#b91c1c">本地 bug fix / 性能 / 新能力 / 实质</text>

  <rect x="286" y="72" width="216" height="118" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="394" y="96" text-anchor="middle" font-weight="700" fill="#991b1b">① 删除</text>
  <text x="302" y="120" font-size="11" fill="#7f1d1d">三件套连根删除</text>
  <text x="302" y="138" font-size="11" fill="#7f1d1d">并修好入站链接</text>
  <text x="302" y="162" font-size="11" fill="#7f1d1d">判定讲的是「记录价值」，</text>
  <text x="302" y="178" font-size="11" fill="#7f1d1d">不因实现小而降格</text>

  <rect x="532" y="72" width="196" height="118" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="630" y="96" text-anchor="middle" font-weight="700" fill="#065f46">② 保留</text>
  <text x="548" y="120" font-size="11" fill="#047857">alternatives / 所有权边界 /</text>
  <text x="548" y="136" font-size="11" fill="#047857">负向保证 / durable-wire 语义 /</text>
  <text x="548" y="152" font-size="11" fill="#047857">安全规则 / 重新引入条件</text>
  <text x="548" y="174" font-size="11" fill="#047857">仍可能指导未来工作</text>

  <rect x="758" y="72" width="182" height="118" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.4"/>
  <text x="849" y="96" text-anchor="middle" font-weight="700" fill="#111827">③ 归档</text>
  <text x="774" y="120" font-size="11" fill="#374151">决策已完成、不再指导</text>
  <text x="774" y="136" font-size="11" fill="#374151">工作，但仍有历史价值</text>
  <text x="774" y="160" font-size="11" fill="#374151">整只三件套搬 + 一行</text>
  <text x="774" y="176" font-size="11" fill="#374151">Archived: 日期</text>

  <line x1="256" y1="112" x2="280" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="502" y1="112" x2="526" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="728" y1="112" x2="752" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#a1)"/>

  <text x="40" y="216" font-weight="700" fill="#1f2937">proposed/ 与 rejected/ 不服这套判据</text>
  <rect x="40" y="226" width="450" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="56" y="248" font-weight="700" fill="#92400e">④ 拒绝（proposed 的唯一出路）</text>
  <text x="56" y="268" font-size="11" fill="#92400e">Never archive a proposed note —— 前提消失就驳回，并写理由</text>
  <text x="56" y="288" font-size="11" fill="#92400e">理由写在 Status 行（岔折号后一句话），无门禁</text>

  <rect x="510" y="226" width="430" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="526" y="248" font-weight="700" fill="#7f1d1d">⑤ 保留/删除（rejected 的两种命运）</text>
  <text x="526" y="268" font-size="11" fill="#7f1d1d">只有仍能阻止一个可信错误时才留（8 篇里 7 篇是 simplification）</text>
  <text x="526" y="288" font-size="11" fill="#7f1d1d">不再阻止任何重提的可能 → 整只三件套删除</text>

  <rect x="40" y="318" width="900" height="126" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="56" y="342" font-weight="700" fill="#1f2937">校准样例：让字数与判定方向交叉，证明体积不是判据</text>
  <rect x="56" y="354" width="200" height="26" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="66" y="372" font-size="11" fill="#7f1d1d">删除：collapsed sidebar control rail</text>
  <text x="264" y="372" font-size="11" font-weight="700" fill="#7f1d1d">533 词</text>
  <rect x="56" y="386" width="200" height="26" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="66" y="404" font-size="11" fill="#047857">保留：event-sourced sessions</text>
  <text x="264" y="404" font-size="11" font-weight="700" fill="#047857">248 词</text>
  <rect x="470" y="354" width="200" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="480" y="372" font-size="11" fill="#7f1d1d">删（rejected）：streaming workflow…</text>
  <text x="678" y="372" font-size="11" font-weight="700" fill="#7f1d1d">972 词</text>
  <rect x="470" y="386" width="200" height="26" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="480" y="404" font-size="11" fill="#047857">留（rejected）：fold compaction split</text>
  <text x="678" y="404" font-size="11" font-weight="700" fill="#047857">426 词</text>
  <text x="56" y="432" font-size="11" fill="#6b7280">短的可留、长的一删，两两交叉 —— 这就是「校准」在此处的确切含义：给出能把两个方向都走通的样例，而不是给出阈值。</text>

  <rect x="40" y="456" width="900" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="56" y="476" font-weight="700" fill="#0c4a6e">批量归档后两个数字同时变，而且方向相反</text>
  <text x="56" y="494" font-size="11" fill="#0369a1">note 总数上升，而活跃 implemented/ 显著下降 —— 所以「删了多少文档」是一个问错的题。产物不是更少的文档，而是分层更清楚的文档。</text>
</svg>
