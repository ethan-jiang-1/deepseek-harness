<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <rect width="980" height="460" fill="#fafafa" rx="6"/>
  <text x="490" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">五条缺口，逐条配一个能把它推翻的观察</text>
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#6b7280">说不出「哪份文件改掉后这句话变假」的判断，不该以肯定语气写出来</text>

  <rect x="40" y="76" width="580" height="70" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="56" y="98" font-weight="700" fill="#111827">① 分类门禁不读 README</text>
  <text x="56" y="118" font-size="11" fill="#374151">闭集是两份人肉副本：AGENT_NOTE_CLASSES ↔ README 的 Classification 表</text>
  <text x="56" y="136" font-size="11" fill="#6b7280">推翻它：让门禁比对 Markdown 表格的行与源码数组</text>
  <rect x="640" y="76" width="300" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="656" y="98" font-weight="700" fill="#166534">严重度 低</text>
  <text x="656" y="118" font-size="11" fill="#166534">加 class 是 deliberate act，</text>
  <text x="656" y="136" font-size="11" fill="#166534">一年可能零次</text>

  <rect x="40" y="158" width="580" height="70" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="56" y="180" font-weight="700" fill="#111827">② 口径缺口：同一批文件的两个计数</text>
  <text x="56" y="200" font-size="11" fill="#374151">2546 / 594 / 1849（含 .zh.md） vs 42 / 296 / 8 / 924（只数英文正文）</text>
  <text x="56" y="218" font-size="11" fill="#6b7280">推翻它：claims.json 新增显式口径的 notes-*-english-md 指标</text>
  <rect x="640" y="158" width="300" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="656" y="180" font-weight="700" fill="#92400e">严重度 中</text>
  <text x="656" y="200" font-size="11" fill="#92400e">写作时真实踩到的坑：</text>
  <text x="656" y="218" font-size="11" fill="#92400e">旧叙述与矩阵在同一基线差一倍</text>

  <rect x="40" y="240" width="580" height="70" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="56" y="262" font-weight="700" fill="#111827">③ 改写纪律没有内容检查</text>
  <text x="56" y="282" font-size="11" fill="#374151">README 说 made mechanical，实际只机械化了四个标题的禁行</text>
  <text x="56" y="300" font-size="11" fill="#6b7280">推翻它：format 门禁增加任何形式的内容检查</text>
  <rect x="640" y="240" width="300" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="656" y="262" font-weight="700" fill="#92400e">严重度 中低</text>
  <text x="656" y="282" font-size="11" fill="#92400e">最常见偷懒形态已被挡住，</text>
  <text x="656" y="300" font-size="11" fill="#92400e">剩下的靠 review</text>

  <rect x="40" y="322" width="580" height="70" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="56" y="344" font-weight="700" fill="#111827">④ 没有存在性门禁，也没有质量门禁</text>
  <text x="56" y="364" font-size="11" fill="#374151">没有门禁检查「该带 note 而没带」，也检查不了「理由是否成立」</text>
  <text x="56" y="382" font-size="11" fill="#6b7280">推翻它：出现能对「改了公开接口却没 note」红灯的 CI 步骤</text>
  <rect x="640" y="322" width="300" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="656" y="344" font-weight="700" fill="#166534">严重度 低（设计如此）</text>
  <text x="656" y="364" font-size="11" fill="#166534">代价：时序控制权在作者手里，</text>
  <text x="656" y="382" font-size="11" fill="#166534">可以永远不写而系统不提醒</text>

  <rect x="40" y="404" width="580" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="56" y="424" font-weight="700" fill="#7f1d1d">⑤ 执法者是六类，而前几篇只数了一类</text>
  <text x="56" y="442" font-size="11" fill="#991b1b">推翻它：去掉 lefthook 的归档 job，并让三处前缀判断共用一个实现</text>
  <rect x="640" y="404" width="300" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="656" y="424" font-weight="700" fill="#92400e">严重度 中（本专题自己的叙述缺口）</text>
  <text x="656" y="442" font-size="11" fill="#92400e">把「最多的那一类」当成了「全部」</text>
</svg>
