<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <rect width="960" height="610" fill="#fafafa" rx="6"/>
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">六条缺口，逐条配一个能把它推翻的观察</text>
  <text x="480" y="54" text-anchor="middle" font-size="11" fill="#6b7280">说不出「哪份文件改掉后这句话变假」的判断，不该以肯定语气写出来</text>

  <rect x="30" y="76" width="580" height="72" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="46" y="98" font-weight="700" fill="#111827">① 分类门禁不读 README</text>
  <text x="46" y="118" font-size="11" fill="#374151">闭集是两份人工副本：AGENT_NOTE_CLASSES ↔ README Classification 表</text>
  <text x="46" y="136" font-size="11" fill="#6b7280">推翻它：让门禁比对 Markdown 表格的行与源码数组</text>
  <rect x="630" y="76" width="300" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="646" y="98" font-weight="700" fill="#166534">严重度 低</text>
  <text x="646" y="118" font-size="11" fill="#166534">加 class 是 deliberate act，</text>
  <text x="646" y="136" font-size="11" fill="#166534">一年可能零次</text>

  <rect x="30" y="160" width="580" height="72" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="46" y="182" font-weight="700" fill="#111827">② 口径缺口：同一批文件的两个计数</text>
  <text x="46" y="202" font-size="11" fill="#374151">2546 / 594 / 1849（含 .zh.md） vs 42 / 296 / 8 / 924（只数英文正文）</text>
  <text x="46" y="220" font-size="11" fill="#6b7280">推翻它：claims.json 新增显式口径的 notes-*-english-md 指标</text>
  <rect x="630" y="160" width="300" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="646" y="182" font-weight="700" fill="#92400e">严重度 中</text>
  <text x="646" y="202" font-size="11" fill="#92400e">写作时真实踩到的坑：</text>
  <text x="646" y="220" font-size="11" fill="#92400e">旧叙述与矩阵在同一基线差一倍</text>

  <rect x="30" y="244" width="580" height="72" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="46" y="266" font-weight="700" fill="#111827">③ 改写纪律没有内容检查</text>
  <text x="46" y="286" font-size="11" fill="#374151">README 说 made mechanical，实际只机械化了四个标题的禁行</text>
  <text x="46" y="304" font-size="11" fill="#6b7280">推翻它：format 门禁增加任何形式的内容检查</text>
  <rect x="630" y="244" width="300" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="646" y="266" font-weight="700" fill="#92400e">严重度 中低</text>
  <text x="646" y="286" font-size="11" fill="#92400e">最常见偷懒形态已被挡住，</text>
  <text x="646" y="304" font-size="11" fill="#92400e">剩下的靠 review</text>

  <rect x="30" y="328" width="580" height="72" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="46" y="350" font-weight="700" fill="#111827">④ 没有存在性门禁，也没有质量门禁</text>
  <text x="46" y="370" font-size="11" fill="#374151">没有门禁检查「该带 note 而没带」，也检查不了「理由是否成立」</text>
  <text x="46" y="388" font-size="11" fill="#6b7280">推翻它：出现能对「改了公开接口却没 note」红灯的 CI 步骤</text>
  <rect x="630" y="328" width="300" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="646" y="350" font-weight="700" fill="#166534">严重度 低（设计如此）</text>
  <text x="646" y="370" font-size="11" fill="#166534">代价：时序控制权在作者手里，</text>
  <text x="646" y="388" font-size="11" fill="#166534">可以永远不写而系统不提醒</text>

  <rect x="30" y="412" width="580" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="46" y="434" font-weight="700" fill="#7f1d1d">⑤ 执法者是六类，而前几篇只数了一类</text>
  <text x="46" y="454" font-size="11" fill="#991b1b">冻结层另有独立 git 钩子门禁，且归档层被十余道门禁主动排除</text>
  <text x="46" y="472" font-size="11" fill="#6b7280">推翻它：去掉 lefthook 归档 job，并让五处写死前缀改用共享谓词</text>
  <rect x="630" y="412" width="300" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="646" y="434" font-weight="700" fill="#92400e">严重度 中</text>
  <text x="646" y="454" font-size="11" fill="#92400e">本专题自己的叙述缺口：</text>
  <text x="646" y="472" font-size="11" fill="#92400e">把「最多的那一类」当成了「全部」</text>

  <rect x="30" y="498" width="580" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="46" y="520" font-weight="700" fill="#7f1d1d">⑥ 改过口径的规则，旧引文的逐字门禁只覆盖 canon 标注引文</text>
  <text x="46" y="540" font-size="11" fill="#991b1b">「Every non-trivial change MUST add or update at least one Agent Note」</text>
  <text x="46" y="556" font-size="11" fill="#991b1b">已被 730bcc7c85 收窄为 only-for，旧文仍在四处被当现行规则引用</text>
  <text x="46" y="576" font-size="11" fill="#6b7280">推翻它：将逐字引文校验扩到其余语料及按行号锚定的非标注引文</text>
  <rect x="630" y="498" width="300" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="646" y="520" font-weight="700" fill="#92400e">严重度 中</text>
  <text x="646" y="540" font-size="11" fill="#92400e">canon 标注引文已有 checkCanonQuotes；</text>
  <text x="646" y="558" font-size="11" fill="#92400e">其余引文仍只验文件与行号存在，</text>
  <text x="646" y="576" font-size="11" fill="#92400e">抓不到改口径后的语义陈旧</text>
</svg>
