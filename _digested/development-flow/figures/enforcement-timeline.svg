<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <rect width="980" height="470" fill="#fafafa" rx="6"/>
  <text x="490" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">六类执法者，按「什么时候会响」重排</text>
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#6b7280">按「管什么」排会看不出形状；按时机排，编辑期那一格是空的</text>

  <text x="120" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563">写的时候</text>
  <text x="305" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563">git commit 前</text>
  <text x="490" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563">git commit 时</text>
  <text x="675" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563">push / CI</text>
  <text x="860" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563">PR review</text>

  <line x1="60" y1="96" x2="920" y2="96" stroke="#d1d5db" stroke-width="1.4"/>

  <rect x="45" y="112" width="150" height="196" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="120" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#9ca3af">空</text>
  <text x="57" y="166" font-size="10" fill="#9ca3af">没有任何工具在</text>
  <text x="57" y="180" font-size="10" fill="#9ca3af">编辑期介入</text>
  <text x="57" y="206" font-size="10" fill="#9ca3af">所以「该不该写」</text>
  <text x="57" y="220" font-size="10" fill="#9ca3af">永远不会被提醒</text>
  <text x="57" y="252" font-size="10" fill="#6b7280">这就是缺口四</text>
  <text x="57" y="266" font-size="10" fill="#6b7280">在时机维度上</text>
  <text x="57" y="280" font-size="10" fill="#6b7280">的显影</text>

  <rect x="215" y="112" width="180" height="196" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="227" y="136" font-size="11" font-weight="700" fill="#92400e">doc-sync（若跑）</text>
  <text x="227" y="160" font-size="10" fill="#78350f">· 三个 leaf 门禁</text>
  <text x="227" y="178" font-size="10" fill="#78350f">  classification</text>
  <text x="227" y="196" font-size="10" fill="#78350f">· format · archived</text>
  <text x="227" y="220" font-size="10" fill="#78350f">· translation-pairing</text>
  <text x="227" y="238" font-size="10" fill="#78350f">  （全仓口径）</text>
  <text x="227" y="268" font-size="10" fill="#b45309">管形状，不管判断</text>

  <rect x="415" y="112" width="150" height="196" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="427" y="136" font-size="11" font-weight="700" fill="#7f1d1d">lefthook</text>
  <text x="427" y="160" font-size="10" fill="#991b1b">· 归档封印门禁</text>
  <text x="427" y="178" font-size="10" fill="#991b1b">  当场拒绝提交</text>
  <text x="427" y="202" font-size="10" fill="#991b1b">· staged 配对</text>
  <text x="427" y="220" font-size="10" fill="#991b1b">  （缩水版）</text>
  <text x="427" y="250" font-size="10" fill="#b91c1c">唯一进 git 钩子</text>
  <text x="427" y="264" font-size="10" fill="#b91c1c">的 note 层：</text>
  <text x="427" y="278" font-size="10" fill="#b91c1c">冻结层比活跃区硬</text>

  <rect x="585" y="112" width="180" height="196" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="597" y="136" font-size="11" font-weight="700" fill="#92400e">同样的门禁，再跑一遍</text>
  <text x="597" y="160" font-size="10" fill="#78350f">· 全量 doc-sync</text>
  <text x="597" y="184" font-size="10" fill="#78350f">· 归档门禁换基线：</text>
  <text x="597" y="202" font-size="10" fill="#78350f">  DSH_ARCHIVE_BASE_REF</text>
  <text x="597" y="232" font-size="10" fill="#b45309">基线不同 → 本地绿</text>
  <text x="597" y="246" font-size="10" fill="#b45309">而 CI 红是可能的，</text>
  <text x="597" y="260" font-size="10" fill="#b45309">方向是本地更松</text>
  <text x="597" y="284" font-size="10" fill="#b45309">（HEAD 已含本改动）</text>

  <rect x="785" y="112" width="150" height="196" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="797" y="136" font-size="11" font-weight="700" fill="#3730a3">人 + skill</text>
  <text x="797" y="160" font-size="10" fill="#3730a3">· dsh-code-review</text>
  <text x="797" y="178" font-size="10" fill="#3730a3">  proposed→implemented</text>
  <text x="797" y="196" font-size="10" fill="#3730a3">  改写检查</text>
  <text x="797" y="220" font-size="10" fill="#3730a3">· 归档判据、四分法</text>
  <text x="797" y="250" font-size="10" fill="#4338ca">判据本身在这里，</text>
  <text x="797" y="264" font-size="10" fill="#4338ca">但它按需加载，</text>
  <text x="797" y="278" font-size="10" fill="#4338ca">不常驻上下文</text>

  <rect x="45" y="330" width="890" height="52" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="60" y="352" font-weight="700" fill="#1f2937">写的时候那一格为什么一定是空的</text>
  <text x="60" y="372" font-size="11" fill="#374151">「这次改动是否非平凡」与「这条理由值不值得记」都是语义判断。系统只能在落盘之后看形状，参与不了「写不写」的决定。</text>

  <rect x="45" y="396" width="890" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="60" y="418" font-weight="700" fill="#0c4a6e">于是「硬」有两层，而且方向相反</text>
  <text x="60" y="438" font-size="11" fill="#0369a1">冻结层硬在时机（当场拒绝提交），活跃区硬在覆盖面（三个门禁逐条细查）。把两者混成一句「doc-sync 管 note」，两层都读错。</text>
</svg>
