<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#fafafa" rx="6"/>
  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Agent Note 的两个轴：路径就是状态</text>
  <text x="490" y="52" text-anchor="middle" font-size="11" fill="#6b7280">{lifecycle}/{class}/yyyy-mm-dd-topic.md —— 一级目录是状态，二级目录是决策种类；没有 INDEX.md</text>

  <text x="40" y="88" font-size="12" font-weight="700" fill="#4b5563">纵轴 · class（闭集 6 个）</text>
  <rect x="40" y="100" width="150" height="32" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="115" y="121" text-anchor="middle" font-weight="700" fill="#3730a3">architecture</text>
  <rect x="40" y="138" width="150" height="32" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="115" y="159" text-anchor="middle" font-weight="700" fill="#3730a3">process</text>
  <rect x="40" y="176" width="150" height="32" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="115" y="197" text-anchor="middle" font-weight="700" fill="#3730a3">simplification</text>
  <rect x="40" y="214" width="150" height="32" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="115" y="235" text-anchor="middle" font-weight="700" fill="#3730a3">feature</text>
  <rect x="40" y="252" width="150" height="32" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="115" y="273" text-anchor="middle" font-weight="700" fill="#3730a3">bug-fix</text>
  <rect x="40" y="290" width="150" height="32" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="115" y="311" text-anchor="middle" font-weight="700" fill="#3730a3">testing</text>
  <text x="40" y="346" font-size="11" fill="#6b7280">refactor 故意缺席：与</text>
  <text x="40" y="362" font-size="11" fill="#6b7280">simplification 重合，判别式</text>
  <text x="40" y="378" font-size="11" fill="#6b7280">「可观察行为是否改变」已覆盖。</text>
  <text x="40" y="406" font-size="11" fill="#6b7280">六个类各自的判定问题</text>
  <text x="40" y="422" font-size="11" fill="#6b7280">与真实样本，见 09 页。</text>

  <text x="215" y="88" font-size="11" fill="#6b7280">横轴 · lifecycle（主线在上，两个出口在下）</text>

  <rect x="215" y="100" width="200" height="212" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="315" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">proposed/</text>
  <text x="315" y="146" text-anchor="middle" fill="#92400e">将来时 · 允许 Plan</text>
  <text x="315" y="166" text-anchor="middle" fill="#92400e">## Problem（必需，永远第一节）</text>
  <text x="315" y="184" text-anchor="middle" fill="#92400e">## Proposal · Acceptance criteria · Risks</text>
  <text x="315" y="214" text-anchor="middle" font-size="11" fill="#92400e">义务：无，可以放着</text>
  <text x="315" y="232" text-anchor="middle" font-size="11" fill="#92400e">尽头：过时就拒绝，永不归档</text>
  <text x="315" y="272" text-anchor="middle" font-size="11" fill="#a16207">门禁：状态行 + 必需章节</text>
  <text x="315" y="290" text-anchor="middle" font-size="11" fill="#a16207">（classification / format）</text>

  <rect x="475" y="100" width="200" height="212" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="575" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">implemented/</text>
  <text x="575" y="146" text-anchor="middle" fill="#14532d">现在时 · 事实实时更新</text>
  <text x="575" y="166" text-anchor="middle" fill="#14532d">## Problem → ## Decision</text>
  <text x="575" y="184" text-anchor="middle" fill="#14532d">→ … → ## Consequences</text>
  <text x="575" y="214" text-anchor="middle" font-size="11" fill="#14532d">义务：随代码保持事实最新</text>
  <text x="575" y="232" text-anchor="middle" font-size="11" fill="#b91c1c">但不得改写决策本身</text>
  <text x="575" y="272" text-anchor="middle" font-size="11" fill="#166534">门禁：四条提案期标题禁行</text>
  <text x="575" y="290" text-anchor="middle" font-size="11" fill="#166534">Proposal · Plan · Migration plan</text>

  <rect x="735" y="100" width="200" height="212" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="835" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">archived/</text>
  <text x="835" y="146" text-anchor="middle" fill="#374151">永久冻结（终态）</text>
  <text x="835" y="166" text-anchor="middle" font-size="11" fill="#374151">Status: implemented（不变）</text>
  <text x="835" y="184" text-anchor="middle" font-size="11" fill="#374151">+ Archived: YYYY-MM-DD</text>
  <text x="835" y="214" text-anchor="middle" font-size="11" fill="#374151">目录里没有 implemented/ 层</text>
  <text x="835" y="232" text-anchor="middle" font-size="11" fill="#b91c1c">不是现行权威</text>
  <text x="835" y="272" text-anchor="middle" font-size="11" fill="#374151">门禁：三件套 + sha256 封印，</text>
  <text x="835" y="290" text-anchor="middle" font-size="11" fill="#374151">git commit 当场拒绝篡改</text>

  <line x1="415" y1="170" x2="469" y2="170" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="442" y="156" text-anchor="middle" font-size="10" fill="#4b5563">改写整篇</text>
  <line x1="675" y1="170" x2="729" y2="170" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702" y="156" text-anchor="middle" font-size="10" fill="#4b5563">搬三件套 + 加一行</text>

  <rect x="215" y="368" width="200" height="118" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="315" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">rejected/</text>
  <text x="315" y="414" text-anchor="middle" font-size="11" fill="#7f1d1d">冻结的提案快照，正文一字不改</text>
  <text x="315" y="434" text-anchor="middle" font-size="11" fill="#7f1d1d">Status: rejected — &lt;一句话理由&gt;</text>
  <text x="315" y="454" text-anchor="middle" font-size="11" fill="#7f1d1d">保留提案期章节（含 Plan）</text>
  <text x="315" y="474" text-anchor="middle" font-size="11" fill="#7f1d1d">尽头：不再阻止可信错误就删</text>
  <line x1="315" y1="312" x2="315" y2="362" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="327" y="342" font-size="10" fill="#4b5563">加一句理由，动作最小化</text>

  <rect x="475" y="368" width="200" height="118" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="575" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">删除（三件套连根）</text>
  <text x="575" y="414" text-anchor="middle" font-size="11" fill="#4b5563">修好或移除入站链接</text>
  <text x="575" y="434" text-anchor="middle" font-size="11" fill="#4b5563">判据：只描述小 UI 调整</text>
  <text x="575" y="454" text-anchor="middle" font-size="11" fill="#4b5563">或纯机械改动</text>
  <text x="575" y="474" text-anchor="middle" font-size="11" fill="#4b5563">历史只剩 git</text>
  <line x1="575" y1="312" x2="575" y2="362" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="587" y="342" font-size="10" fill="#6b7280">不进 archived</text>

  <rect x="40" y="520" width="900" height="100" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="56" y="544" font-weight="700" fill="#1f2937">每个 class 里住着同一篇 note 的三个侧面（不是第四个轴）</text>
  <text x="56" y="568" font-size="11" fill="#374151">2026-06-13-capability-seams.md　→　英文正文，权威；文件名日期 = 主题首次被提出（per git history），归档不改名</text>
  <text x="56" y="588" font-size="11" fill="#374151">2026-06-13-capability-seams.zh.md　→　中文对照；分类/格式门禁跳过它，但归档门禁反过来要求它必须存在</text>
  <text x="56" y="608" font-size="11" fill="#374151">2026-06-13-capability-seams.i18n.yaml　→　按小节存哈希的一致性记录；改一侧不重录 = verify-translation-pairing 红</text>
</svg>
