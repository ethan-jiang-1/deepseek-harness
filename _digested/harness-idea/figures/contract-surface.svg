<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="40" y="24" width="740" height="150" rx="10" fill="#fdf6ec" stroke="#b07818"/>
  <text x="70" y="52" font-size="16" font-weight="bold" fill="#5c3a08">合同面（系统的一部分）：同一面被多个消费者同时消费</text>

  <rect x="70" y="70" width="105" height="86" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="122" y="96" text-anchor="middle" font-size="13">词汇</text>
  <text x="122" y="116" text-anchor="middle" font-size="11" fill="#555">glossary</text>
  <text x="122" y="132" text-anchor="middle" font-size="11" fill="#555">一词一义</text>
  <rect x="190" y="70" width="105" height="86" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="242" y="96" text-anchor="middle" font-size="13">类型与事件</text>
  <text x="242" y="116" text-anchor="middle" font-size="11" fill="#555">required-on-read</text>
  <text x="242" y="132" text-anchor="middle" font-size="11" fill="#555">SessionEventMap</text>
  <rect x="305" y="70" width="105" height="86" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="357" y="96" text-anchor="middle" font-size="13">决策表</text>
  <text x="357" y="116" text-anchor="middle" font-size="11" fill="#555">20 行</text>
  <text x="357" y="132" text-anchor="middle" font-size="11" fill="#555">新行为去哪</text>
  <rect x="420" y="70" width="105" height="86" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="472" y="96" text-anchor="middle" font-size="13">范本</text>
  <text x="472" y="116" text-anchor="middle" font-size="11" fill="#555">shell 三包</text>
  <text x="472" y="132" text-anchor="middle" font-size="11" fill="#555">cookbook</text>
  <rect x="535" y="70" width="105" height="86" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="587" y="96" text-anchor="middle" font-size="13">门禁</text>
  <text x="587" y="116" text-anchor="middle" font-size="11" fill="#555">verify-*</text>
  <text x="587" y="132" text-anchor="middle" font-size="11" fill="#555">coverage</text>
  <rect x="650" y="70" width="105" height="86" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="702" y="96" text-anchor="middle" font-size="13">Agent Notes</text>
  <text x="702" y="116" text-anchor="middle" font-size="11" fill="#555">为什么</text>
  <text x="702" y="132" text-anchor="middle" font-size="11" fill="#555">放弃了什么</text>

  <line x1="99" y1="246" x2="99" y2="178" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="223" y1="246" x2="223" y2="178" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="347" y1="246" x2="347" y2="178" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="471" y1="246" x2="471" y2="178" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="595" y1="246" x2="595" y2="178" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="719" y1="246" x2="719" y2="178" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="250" width="118" height="120" rx="8" fill="#f2f6fc" stroke="#4a6fa5"/>
  <text x="99" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#24364d">编译器</text>
  <text x="99" y="302" text-anchor="middle" font-size="10" fill="#333">类型、assertNever、</text>
  <text x="99" y="318" text-anchor="middle" font-size="10" fill="#333">declaration merging</text>
  <text x="99" y="342" text-anchor="middle" font-size="11" fill="#555">编译期拒绝</text>
  <rect x="164" y="250" width="118" height="120" rx="8" fill="#f2f6fc" stroke="#4a6fa5"/>
  <text x="223" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#24364d">门禁与生成器</text>
  <text x="223" y="302" text-anchor="middle" font-size="10" fill="#333">verify-*、freshness</text>
  <text x="223" y="318" text-anchor="middle" font-size="10" fill="#333">gates、目录生成</text>
  <text x="223" y="342" text-anchor="middle" font-size="11" fill="#555">提交前红灯</text>
  <rect x="288" y="250" width="118" height="120" rx="8" fill="#f2f6fc" stroke="#4a6fa5"/>
  <text x="347" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#24364d">双 SDK</text>
  <text x="347" y="302" text-anchor="middle" font-size="10" fill="#333">TypeScript + Python</text>
  <text x="347" y="318" text-anchor="middle" font-size="10" fill="#333">投影同一个 loop</text>
  <text x="347" y="342" text-anchor="middle" font-size="11" fill="#555">不同步即出错</text>
  <rect x="412" y="250" width="118" height="120" rx="8" fill="#f0f7f0" stroke="#2f6b3a"/>
  <text x="471" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e4026">harness 自身</text>
  <text x="471" y="302" text-anchor="middle" font-size="10" fill="#333">自修改：检视、</text>
  <text x="471" y="318" text-anchor="middle" font-size="10" fill="#333">挂载自己的插件</text>
  <text x="471" y="342" text-anchor="middle" font-size="11" fill="#555">dsh-tool-cordis</text>
  <rect x="536" y="250" width="118" height="120" rx="8" fill="#fdf6ec" stroke="#b07818"/>
  <text x="595" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c3a08">LLM reader</text>
  <text x="595" y="302" text-anchor="middle" font-size="10" fill="#333">只读、不能问</text>
  <text x="595" y="318" text-anchor="middle" font-size="10" fill="#333">没有部落知识通道</text>
  <text x="595" y="342" text-anchor="middle" font-size="11" fill="#555">探针之一</text>
  <rect x="660" y="250" width="118" height="120" rx="8" fill="#f2f6fc" stroke="#4a6fa5"/>
  <text x="719" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#24364d">人类读者</text>
  <text x="719" y="302" text-anchor="middle" font-size="10" fill="#333">多一条「问」的</text>
  <text x="719" y="318" text-anchor="middle" font-size="10" fill="#333">通道</text>
  <text x="719" y="342" text-anchor="middle" font-size="11" fill="#555">用不用都行</text>

  <rect x="40" y="420" width="740" height="110" rx="10" fill="#f2f6fc" stroke="#4a6fa5" stroke-dasharray="6 4"/>
  <text x="70" y="450" font-size="15" font-weight="bold" fill="#24364d">漂移先撞机器，不先撞读者</text>
  <text x="70" y="474" font-size="13" fill="#333">面与代码不一致时：编译器拒绝 → 门禁红灯 → 生成器 freshness 断 → 双 SDK 不同步</text>
  <text x="70" y="496" font-size="13" fill="#333">LLM 与人类读者最后才遇到矛盾——「LLM 读得懂」是宽松读数，「机器消费得到」才是硬检验</text>
  <text x="70" y="516" font-size="12" fill="#555">LLM 是探针之一，不是唯一，也不是最严格的</text>
</svg>
