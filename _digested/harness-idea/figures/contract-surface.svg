<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="40" y="24" width="740" height="100" rx="10" fill="#f2f6fc" stroke="#4a6fa5"/>
  <text x="70" y="56" font-size="16" font-weight="bold" fill="#24364d">参与者</text>
  <text x="70" y="82" font-size="13" fill="#333">人 · coding agent · 任何会读的 reader</text>
  <text x="70" y="104" font-size="13" fill="#333">只带「识字」；不带背景知识，不访问部落知识</text>

  <rect x="40" y="184" width="740" height="150" rx="10" fill="#fdf6ec" stroke="#b07818"/>
  <text x="70" y="216" font-size="16" font-weight="bold" fill="#5c3a08">合同面（系统的一部分）</text>
  <rect x="70" y="232" width="128" height="84" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="134" y="258" text-anchor="middle" font-size="13">词汇</text>
  <text x="134" y="278" text-anchor="middle" font-size="11" fill="#555">glossary 一词一义</text>
  <rect x="210" y="232" width="128" height="84" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="274" y="258" text-anchor="middle" font-size="13">类型与事件</text>
  <text x="274" y="278" text-anchor="middle" font-size="11" fill="#555">required-on-read</text>
  <rect x="350" y="232" width="128" height="84" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="414" y="258" text-anchor="middle" font-size="13">决策表</text>
  <text x="414" y="278" text-anchor="middle" font-size="11" fill="#555">新行为去哪</text>
  <rect x="490" y="232" width="128" height="84" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="554" y="258" text-anchor="middle" font-size="13">范本</text>
  <text x="554" y="278" text-anchor="middle" font-size="11" fill="#555">shell 三包 · cookbook</text>
  <rect x="630" y="232" width="128" height="84" rx="6" fill="#fff" stroke="#b07818"/>
  <text x="694" y="258" text-anchor="middle" font-size="13">门禁</text>
  <text x="694" y="278" text-anchor="middle" font-size="11" fill="#555">verify · coverage</text>

  <rect x="40" y="394" width="740" height="96" rx="10" fill="#f0f7f0" stroke="#2f6b3a"/>
  <text x="70" y="426" font-size="16" font-weight="bold" fill="#1e4026">系统（插件树）</text>
  <text x="70" y="452" font-size="13" fill="#333">agent-loop · session log · tools · capability seams · preset 组合</text>
  <text x="70" y="474" font-size="13" fill="#333">一切皆插件；扩展点有表可查；错误在源头 fail loud</text>

  <line x1="410" y1="124" x2="410" y2="180" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="428" y="156" font-size="12" fill="#555">读</text>
  <line x1="410" y1="334" x2="410" y2="390" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="428" y="366" font-size="12" fill="#555">约束与执行</text>
  <line x1="756" y1="394" x2="756" y2="132" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="470" y="330" font-size="12" fill="#666">反馈：失败大声 · 门禁结果 · 当场纠正</text>
