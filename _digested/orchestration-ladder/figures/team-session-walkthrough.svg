<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52c41a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fa8c16"/>
    </marker>
  </defs>

  <text x="40" y="32" font-size="16" font-weight="bold" fill="#333">走查：一支小队交叉复核本专题的 1437 条引用并修复越界</text>
  <text x="40" y="52" font-size="11.5" fill="#8c8c8c">场景是读者自己的工作；每条规则的源码出处见正文各节（explicit-ask / CAS / 唤醒语义 / FS_STALE_VERSION / Lead 兜底）</text>

  <line x1="90" y1="70" x2="90" y2="760" stroke="#d9d9d9" stroke-width="1.5"/>
  <line x1="360" y1="70" x2="360" y2="760" stroke="#d9d9d9" stroke-width="1.5"/>
  <line x1="650" y1="70" x2="650" y2="760" stroke="#d9d9d9" stroke-width="1.5"/>
  <line x1="930" y1="70" x2="930" y2="760" stroke="#d9d9d9" stroke-width="1.5"/>

  <rect x="40" y="66" width="100" height="30" rx="6" fill="#fafafa" stroke="#595959" stroke-width="1.5"/>
  <text x="90" y="86" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">人类（ruofei）</text>
  <rect x="300" y="66" width="120" height="30" rx="6" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="360" y="86" font-size="12" font-weight="bold" fill="#1677ff" text-anchor="middle">Lead（本会话）</text>
  <rect x="575" y="66" width="150" height="30" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <text x="650" y="86" font-size="12" font-weight="bold" fill="#52c41a" text-anchor="middle">auditor-a（fresh）</text>
  <rect x="855" y="66" width="150" height="30" rx="6" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <text x="930" y="86" font-size="12" font-weight="bold" fill="#52c41a" text-anchor="middle">auditor-b（fresh）</text>

  <line x1="90" y1="120" x2="356" y2="120" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="223" y="112" font-size="11" fill="#333" text-anchor="middle">「开个 team，把引用复核一遍」</text>
  <text x="223" y="136" font-size="9.5" fill="#8c8c8c" text-anchor="middle">explicit-ask 门槛通过（POLICY 首句）</text>

  <rect x="306" y="150" width="108" height="26" rx="5" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="360" y="167" font-size="10" fill="#1677ff" text-anchor="middle">spawn_teammate ×2</text>
  <line x1="414" y1="163" x2="646" y2="163" stroke="#52c41a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="414" y1="186" x2="926" y2="186" stroke="#52c41a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="670" y="156" font-size="10" fill="#52c41a" text-anchor="middle">都是 fresh：读文件核行号不需要对话历史</text>
  <text x="670" y="200" font-size="9.5" fill="#8c8c8c" text-anchor="middle">（fork 留给要继承 Lead 勘察轮次的角色，如评审）</text>

  <rect x="306" y="220" width="108" height="26" rx="5" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="360" y="237" font-size="10" fill="#1677ff" text-anchor="middle">team_task_create ×3</text>
  <text x="440" y="231" font-size="10.5" fill="#333">audit-01-05（产物 docs/audit-01-05.md）∥ audit-06-09（产物 docs/audit-06-09.md）</text>
  <text x="440" y="248" font-size="10.5" fill="#333">→ fix-out-of-bounds（blocked_by 两者，产物：ref-sweep 零越界）</text>
  <text x="440" y="264" font-size="9.5" fill="#8c8c8c">两个 audit 无依赖天然并行；写域不相交；顺序用 blocked_by（advisory 不是锁）</text>

  <line x1="414" y1="296" x2="646" y2="296" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="414" y1="316" x2="926" y2="316" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="670" y="289" font-size="10.5" fill="#333" text-anchor="middle">send_message 各派一个</text>
  <text x="670" y="330" font-size="9.5" fill="#8c8c8c" text-anchor="middle">成功即持久（即使显示 queued），勿重发</text>

  <rect x="586" y="346" width="128" height="44" rx="5" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="650" y="364" font-size="10" fill="#52c41a" text-anchor="middle">claim（CAS revision）</text>
  <text x="650" y="380" font-size="10" fill="#52c41a" text-anchor="middle">perform → complete</text>

  <rect x="866" y="346" width="128" height="62" rx="5" fill="#fff7e6" stroke="#fa8c16" stroke-width="1.5"/>
  <text x="930" y="364" font-size="10" fill="#fa8c16" text-anchor="middle">写 audit 文档撞上</text>
  <text x="930" y="379" font-size="10" fill="#fa8c16" text-anchor="middle">FS_STALE_VERSION</text>
  <text x="930" y="394" font-size="9.5" fill="#8c8c8c" text-anchor="middle">（Lead 同时在改 00-map——</text>
  <text x="930" y="407" font-size="9.5" fill="#8c8c8c" text-anchor="middle">共享文件系统，编辑即时可见）</text>
  <text x="930" y="422" font-size="9.5" fill="#8c8c8c" text-anchor="middle">read → rebase → retry</text>

  <line x1="926" y1="440" x2="366" y2="440" stroke="#fa8c16" stroke-width="2" marker-end="url(#ao)"/>
  <text x="646" y="433" font-size="10.5" fill="#333" text-anchor="middle">send_message 回话（child→parent relay，消息带 sender 名）</text>

  <rect x="306" y="462" width="290" height="44" rx="5" fill="#fff1f0" stroke="#d4380d" stroke-width="1.5"/>
  <text x="451" y="480" font-size="10" fill="#d4380d" text-anchor="middle">两个 audit complete → fix 就绪</text>
  <text x="451" y="496" font-size="9.5" fill="#d4380d" text-anchor="middle">但 task readiness never starts an owner —— 就绪不自动开工</text>

  <rect x="620" y="462" width="108" height="44" rx="5" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="674" y="480" font-size="10" fill="#1677ff" text-anchor="middle">wait_agent</text>
  <text x="674" y="496" font-size="9.5" fill="#8c8c8c" text-anchor="middle">先 list_agents 再等；醒后 re-list</text>
  <line x1="596" y1="484" x2="616" y2="484" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="306" y="534" width="290" height="62" rx="5" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="451" y="554" font-size="10.5" fill="#1677ff" text-anchor="middle">Lead 自己做 fix + 审最终 diff + 跑 ref-sweep</text>
  <text x="451" y="571" font-size="9.5" fill="#8c8c8c" text-anchor="middle">POLICY：bash/脚本不受文件系统版本守卫保护，</text>
  <text x="451" y="585" font-size="9.5" fill="#8c8c8c" text-anchor="middle">最终一致性 Lead 兜底（对应外部叙事的「Reviewer 门禁」真相）</text>

  <line x1="356" y1="630" x2="94" y2="630" stroke="#1677ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="225" y="623" font-size="11" fill="#333" text-anchor="middle">最终答案：哪些引用修了、哪些是历史命中（等齐 required teammates 之后）</text>

  <rect x="620" y="606" width="460" height="100" rx="8" fill="#fafafa" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="640" y="630" font-size="10.5" font-weight="bold" fill="#333">你会看到什么（Web 会话头部的 Team 动作，读 Lead Session 投影）</text>
  <text x="640" y="650" font-size="10" fill="#333">名册：两个 auditor 的状态行 provisioning → running → inactive</text>
  <text x="640" y="666" font-size="10" fill="#333">（inactive 只是没有 turn 在执行，不代表完成——要看任务板）</text>
  <text x="640" y="682" font-size="10" fill="#333">任务板：两个 audit pending → in_progress → completed；</text>
  <text x="640" y="698" font-size="10" fill="#333">fix blocked → ready → in_progress → completed；写域重叠会显示警告</text>

  <rect x="40" y="726" width="1000" height="44" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="1.5"/>
  <text x="58" y="744" font-size="10.5" fill="#333">任意一步崩溃：消息与任务板都在 Lead Session 的事件日志里（log-only 事件 + 投影）——重启后队友 resume 时收到排队的消息，</text>
  <text x="58" y="760" font-size="10.5" fill="#333">任务板原样；这与外部叙事虚构的「dsh rollback --task」形成对照——真实的恢复语义是会话级持久，不是任务级回滚</text>

  <text x="40" y="796" font-size="10" fill="#8c8c8c">fresh/fork 的种子语义见 03 页；外部叙事逐条核对见 09 页；走查中每条规则的源码出处见本页各节与源码入口表</text>
</svg>
