<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#595959"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/></marker>
  </defs>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#262626">“完成”不是一个时刻：四层证据与两个消费窗口</text>
  <text x="40" y="62" font-size="13" fill="#8c8c8c">运行时接受、模型看见、Agent 静止、资源处置分别由不同组件确认</text>

  <line x1="95" y1="190" x2="1080" y2="190" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="120" width="190" height="112" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
  <text x="165" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1677ff">accepted</text>
  <text x="165" y="176" text-anchor="middle" font-size="12" fill="#333">取得 id / handle</text>
  <text x="165" y="198" text-anchor="middle" font-size="12" fill="#333">消息或 job 被接纳</text>
  <text x="165" y="218" text-anchor="middle" font-size="11" fill="#8c8c8c">不等于已执行</text>

  <rect x="315" y="120" width="190" height="112" rx="10" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#389e0d">model-visible</text>
  <text x="410" y="176" text-anchor="middle" font-size="12" fill="#333">进入模型请求或工具结果</text>
  <text x="410" y="198" text-anchor="middle" font-size="12" fill="#333">可被模型消费</text>
  <text x="410" y="218" text-anchor="middle" font-size="11" fill="#8c8c8c">不等于已理解</text>

  <rect x="560" y="120" width="190" height="112" rx="10" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
  <text x="655" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#d46b08">quiescent</text>
  <text x="655" y="176" text-anchor="middle" font-size="12" fill="#333">没有正在执行的 turn</text>
  <text x="655" y="198" text-anchor="middle" font-size="12" fill="#333">没有竞争性输入</text>
  <text x="655" y="218" text-anchor="middle" font-size="11" fill="#8c8c8c">不等于业务完成</text>

  <rect x="805" y="120" width="190" height="112" rx="10" fill="#fff1f0" stroke="#d4380d" stroke-width="2"/>
  <text x="900" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#cf1322">disposed</text>
  <text x="900" y="176" text-anchor="middle" font-size="12" fill="#333">child / producer / handle</text>
  <text x="900" y="198" text-anchor="middle" font-size="12" fill="#333">释放资源并完成收尾</text>
  <text x="900" y="218" text-anchor="middle" font-size="11" fill="#8c8c8c">不等于用户目标满足</text>

  <text x="70" y="290" font-size="15" font-weight="700" fill="#333">不同组件确认不同事实</text>
  <line x1="70" y1="310" x2="1050" y2="310" stroke="#d9d9d9"/>
  <text x="85" y="342" font-size="13" fill="#333">JobRegistry</text><text x="250" y="342" font-size="13" fill="#595959">注册、终态、ring、cursor、awaited</text>
  <text x="85" y="378" font-size="13" fill="#333">Teams mailbox</text><text x="250" y="378" font-size="13" fill="#595959">queued → target receipt → delivered</text>
  <text x="85" y="414" font-size="13" fill="#333">Schedule Host</text><text x="250" y="414" font-size="13" fill="#595959">Session flush → task retire / advance</text>
  <text x="85" y="450" font-size="13" fill="#333">Goal driver</text><text x="250" y="450" font-size="13" fill="#595959">checkpoint、round reservation、wrapup</text>
  <text x="85" y="486" font-size="13" fill="#333">Workflow recorder</text><text x="250" y="486" font-size="13" fill="#595959">观察日志，不是执行恢复 checkpoint</text>

  <path d="M165 250 C165 330 700 330 900 250" fill="none" stroke="#1677ff" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue-arrow)"/>
  <text x="700" y="285" font-size="12" fill="#1677ff">崩溃窗口：前一事实已提交，后一事实可能尚未提交</text>
</svg>
