<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="360" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">候选失败：上一棵好树继续跑，再广播 hmr/config-update-failed</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#6b7280">user-patches.spec · Include 事务性 update · HMR refreshConfig catch</text>

  <rect x="40" y="70" width="200" height="90" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="140" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">好树</text>
  <text x="140" y="126" text-anchor="middle" font-size="11" fill="#15803d">value: live</text>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#15803d">正在服务请求</text>
  <line x1="240" y1="115" x2="278" y2="115" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="280" y="70" width="240" height="90" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="400" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">坏候选</text>
  <text x="400" y="122" text-anchor="middle" font-size="11" fill="#991b1b">config.fail / YAML 解析失败</text>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#991b1b">事务不提交</text>
  <line x1="520" y1="115" x2="558" y2="115" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="560" y="70" width="360" height="90" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="740" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">仍是 live</text>
  <text x="740" y="122" text-anchor="middle" font-size="11" fill="#2563eb">+ parallel hmr/config-update-failed</text>
  <text x="740" y="140" text-anchor="middle" font-size="11" fill="#2563eb">观察者失败被 HMR 吞掉记日志</text>

  <rect x="40" y="186" width="880" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="214" font-size="12" fill="#374151">boot 时坏文件：loadOptionalPatches / parsePatchList 直接抛，进程起不来。热更新时坏文件：不能把正在跑的树拆掉。</text>
  <text x="60" y="238" font-size="12" fill="#374151">删除用户文件：compose 不再含那一层，回到 bundle（测试里的 generated）。这是合法的新一代，不是失败。</text>
  <text x="60" y="262" font-size="11" fill="#374151">组合里若没有 hmr 行（disabled: true 在 dsh-base，web bundle 只加 client-hmr），profile-boot 会再挂一个 root: [] 的 watch-only HMR，只为 patch 文件。</text>
  <text x="60" y="286" font-size="12" fill="#374151">表面在 watcher 还没 ready 时 dispose 整棵树：INACTIVE_EFFECT → 返回空 disposer，不当成 watch 失败。</text>
</svg>
