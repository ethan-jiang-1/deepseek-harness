<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#57606a"/></marker>
  </defs>
  <rect width="1180" height="560" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">首屏交接：五步，每步都有失败信号</text>
  <text x="40" y="68" font-size="13" fill="#6e7781">认证在 HTML 之前，注入在渲染之中，挂 UI 在全部 entry 激活之后</text>

  <rect x="40" y="96" width="200" height="250" rx="10" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="58" y="126" font-size="14" font-weight="700" fill="#0969da">1 · 打印入口</text>
  <text x="58" y="150" font-size="11.5" fill="#57606a">谁：web app</text>
  <text x="58" y="176" font-size="11.5" fill="#424a53">authenticatedUrl 把</text>
  <text x="58" y="194" font-size="11.5" fill="#424a53">launch token 拼进 URL</text>
  <text x="58" y="224" font-size="11.5" fill="#6e7781">web-app/src/index.ts:228</text>
  <rect x="58" y="296" width="164" height="34" rx="6" fill="#ffebe9"/>
  <text x="68" y="317" font-size="11.5" fill="#cf222e">失败：下一步 401</text>

  <line x1="240" y1="221" x2="262" y2="221" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="265" y="96" width="200" height="250" rx="10" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="283" y="126" font-size="14" font-weight="700" fill="#0969da">2 · token 换 cookie</text>
  <text x="283" y="150" font-size="11.5" fill="#57606a">谁：connection</text>
  <text x="283" y="176" font-size="11.5" fill="#424a53">authorizeIndex：单 token、</text>
  <text x="283" y="194" font-size="11.5" fill="#424a53">GET、路径 /、authority 合法</text>
  <text x="283" y="224" font-size="11.5" fill="#6e7781">browser-auth.ts:263-288</text>
  <text x="283" y="248" font-size="11.5" fill="#1a7f37">→ 303 + set-cookie</text>
  <text x="283" y="266" font-size="11.5" fill="#1a7f37">　dsh-auth-&lt;authority&gt;</text>
  <rect x="283" y="296" width="164" height="34" rx="6" fill="#ffebe9"/>
  <text x="293" y="317" font-size="11.5" fill="#cf222e">失败：token 错 → 401</text>

  <line x1="465" y1="221" x2="487" y2="221" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="490" y="96" width="200" height="250" rx="10" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="508" y="126" font-size="14" font-weight="700" fill="#0969da">3 · 发 HTML</text>
  <text x="508" y="150" font-size="11.5" fill="#57606a">谁：frontend-static</text>
  <text x="508" y="168" font-size="11.5" fill="#57606a">　　+ webserver</text>
  <text x="508" y="194" font-size="11.5" fill="#424a53">index 先过认证，再 renderIndex</text>
  <text x="508" y="212" font-size="11.5" fill="#424a53">：结构化行 → 原始 tap</text>
  <text x="508" y="240" font-size="11.5" fill="#6e7781">webserver/src/index.ts:584</text>
  <rect x="508" y="296" width="164" height="34" rx="6" fill="#ffebe9"/>
  <text x="518" y="317" font-size="11.5" fill="#cf222e">失败：404 / 403 / 405</text>

  <line x1="690" y1="221" x2="712" y2="221" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="715" y="96" width="200" height="250" rx="10" fill="#eef6ff" stroke="#9ecbff"/>
  <text x="733" y="126" font-size="14" font-weight="700" fill="#0969da">4 · 注入启动图</text>
  <text x="733" y="150" font-size="11.5" fill="#57606a">谁：client-modules</text>
  <text x="733" y="176" font-size="11.5" fill="#424a53">一个 global 注入行</text>
  <text x="733" y="194" font-size="11.5" fill="#424a53">写成 __DSH_BOOT__</text>
  <text x="733" y="224" font-size="11.5" fill="#6e7781">modules/src/index.ts:592</text>
  <text x="733" y="244" font-size="11.5" fill="#6e7781">injections.ts:17（行种类）</text>
  <rect x="733" y="296" width="164" height="34" rx="6" fill="#ffebe9"/>
  <text x="743" y="317" font-size="11.5" fill="#cf222e">失败：missing or not an object</text>

  <line x1="915" y1="221" x2="937" y2="221" stroke="#57606a" marker-end="url(#ar)"/>

  <rect x="940" y="96" width="200" height="250" rx="10" fill="#e8f5ec" stroke="#8fd19e"/>
  <text x="958" y="126" font-size="14" font-weight="700" fill="#1a7f37">5 · 两段式启动</text>
  <text x="958" y="150" font-size="11.5" fill="#57606a">谁：dsh-client-web</text>
  <text x="958" y="176" font-size="11.5" fill="#424a53">模块段 → 插件段</text>
  <text x="958" y="194" font-size="11.5" fill="#424a53">→ 全部 entry 激活 → 挂 UI</text>
  <text x="958" y="224" font-size="11.5" fill="#6e7781">client/web/src/boot.ts:72</text>
  <text x="958" y="244" font-size="11.5" fill="#6e7781">client/web/README.md:38,73</text>
  <rect x="958" y="288" width="164" height="50" rx="6" fill="#ffebe9"/>
  <text x="968" y="307" font-size="11.5" fill="#cf222e">失败：停在 boot page</text>
  <text x="968" y="325" font-size="11.5" fill="#cf222e">聚合错误点名每个 entry</text>

  <rect x="40" y="382" width="1100" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="410" font-size="14" font-weight="700" fill="#1f2328">这条链的三个设计判断</text>
  <text x="62" y="438" font-size="12.5" fill="#1a7f37">认证在 HTML 之前</text>
  <text x="300" y="438" font-size="12.5" fill="#424a53">未认证请求拿不到任何页面骨架，token 不进 referrer</text>
  <text x="62" y="466" font-size="12.5" fill="#1a7f37">注入在渲染之中</text>
  <text x="300" y="466" font-size="12.5" fill="#424a53">插件贡献结构化行，不拼字符串；tap 只在行之后跑</text>
  <text x="62" y="494" font-size="12.5" fill="#1a7f37">挂 UI 在全部激活之后</text>
  <text x="300" y="494" font-size="12.5" fill="#424a53">「半个界面」不会出现；失败是全页可见的，不是静默缺失</text>

  <text x="40" y="542" font-size="11.5" fill="#6e7781">自证：curl 不带 token 应 401；带 token 应 303 并落 cookie；再抓 index 应能找到 __DSH_BOOT__。</text>
</svg>
