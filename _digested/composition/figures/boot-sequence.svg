<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fafafa" rx="6"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">一次 dsh --profile 怎么变成一棵活树</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#6b7280">apps/cli/src/profile-boot.ts runProfile · packages/boot/app-boot/src/index.ts boot()</text>

  <rect x="40" y="64" width="280" height="200" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="180" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">1. prepareProfile</text>
  <text x="56" y="118" font-size="11" fill="#166534">healProfilesModuleFallback</text>
  <text x="56" y="136" font-size="11" fill="#15803d">loadProfile（缺模板则 init）</text>
  <text x="56" y="154" font-size="11" fill="#15803d">重写 profiles/&lt;name&gt;/cordis.yml</text>
  <text x="56" y="172" font-size="11" fill="#15803d">成空列表 []</text>
  <text x="56" y="200" font-size="11" fill="#14532d">Loader 写回会把已组合的行</text>
  <text x="56" y="216" font-size="11" fill="#14532d">烤进这个文件；下次会重复 insert</text>
  <text x="56" y="240" font-size="11" fill="#14532d">所以每次 boot 都覆盖回去</text>

  <line x1="320" y1="164" x2="358" y2="164" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="360" y="64" width="280" height="200" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="500" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">2. composeProfile</text>
  <text x="376" y="118" font-size="11" fill="#1e40af">bundle patches（声明顺序）</text>
  <text x="376" y="136" font-size="11" fill="#2563eb">+ profile cordis.patch.yml</text>
  <text x="376" y="154" font-size="11" fill="#2563eb">+ home cordis.patch.yml</text>
  <text x="376" y="172" font-size="11" fill="#2563eb">+ --patch 文件</text>
  <text x="376" y="200" font-size="11" fill="#1e3a8a">再加 launcher 派生层（唯一一层）：</text>
  <text x="376" y="218" font-size="11" fill="#1e3a8a">DSH_TELEMETRY_DISABLED 补丁</text>
  <text x="376" y="236" font-size="11" fill="#1e3a8a">shipped preset root 不在层列表里</text>

  <line x1="640" y1="164" x2="678" y2="164" stroke="#4b5563" marker-end="url(#arr)"/>

  <rect x="680" y="64" width="240" height="200" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="800" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">3. boot()</text>
  <text x="696" y="118" font-size="11" fill="#9a3412">new Context</text>
  <text x="696" y="136" font-size="11" fill="#c2410c">provide dshHomePath</text>
  <text x="696" y="154" font-size="11" fill="#c2410c">plugin(Loader)</text>
  <text x="696" y="172" font-size="11" fill="#c2410c">prepare：env + cmdline</text>
  <text x="696" y="190" font-size="11" fill="#c2410c">mountRootInclude</text>
  <text x="696" y="208" font-size="11" fill="#c2410c">loader.await()</text>
  <text x="696" y="226" font-size="11" fill="#c2410c">assertEntriesActivated</text>
  <text x="696" y="248" font-size="11" fill="#7c2d12">失败则 dispose 整棵再抛</text>

  <rect x="40" y="288" width="880" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="316" font-size="13" font-weight="700" fill="#111827">两段失败标签</text>
  <text x="60" y="340" font-size="12" fill="#374151">prepare 抛出：host preparation failed。</text>
  <text x="60" y="362" font-size="12" fill="#374151">prepare 成功后立即切换标签；mountRootInclude 及之后失败：plugin tree failed to load。</text>
  <text x="60" y="390" font-size="12" fill="#374151">assertEntriesLoaded：enabled 却没有 fiber → 解析失败。assertEntriesActivated：FAILED 等原错误；PENDING 点名缺的服务。</text>
  <text x="60" y="416" font-size="12" fill="#374151">Loader 并发 mount。boot 失败走 dispose；后挂 rejection 走 installFailLoud 的 release。</text>
  <text x="60" y="440" font-size="12" fill="#374151">树在 await 中途被表面 dispose：loader 消失则直接返回 ctx，不再做 activation 审计。</text>
  <text x="60" y="468" font-size="11" fill="#6b7280">dispose 后把最深 cause 的 stack 拼上；根 Include id 固定为 include。</text>
</svg>
