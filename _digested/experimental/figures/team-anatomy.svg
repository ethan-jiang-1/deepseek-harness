<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="440" fill="#fafafa" rx="6"/>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Agent Teams 的构造：状态住在 Lead 的日志里</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Lead + 具名 teammate + 共享任务板；teammate 就是 subagent，协调记录是 Lead 日志里的 log-only 事件。</text>

  <rect x="30" y="70" width="440" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="250" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Lead Session</text>
  <text x="250" y="116" text-anchor="middle" font-size="11" fill="#2563eb">每个普通 runtime 根都是隐式 Lead；TeamId = 其 SessionId</text>
  <rect x="50" y="130" width="400" height="106" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="250" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">session log · 追加写，flush 成功才算成功</text>
  <text x="70" y="180" font-size="12" fill="#1e3a8a">team/member —— 名册（含 provisioning / failed）</text>
  <text x="70" y="202" font-size="12" fill="#1e3a8a">team/task —— 任务板（版本化快照，CAS 更新）</text>
  <text x="70" y="224" font-size="11" fill="#6b7280">历史 team/message/* 仍可读，不再写入；全部 log-only，不进模型历史</text>
  <line x1="150" y1="236" x2="150" y2="256" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="50" y="258" width="190" height="50" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="145" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">projection</text>
  <text x="145" y="298" text-anchor="middle" font-size="11" fill="#15803d">agentTeam</text>
  <line x1="240" y1="283" x2="268" y2="283" stroke="#4b5563" marker-end="url(#arr)"/>
  <rect x="270" y="258" width="180" height="50" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="360" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Web UI</text>
  <text x="360" y="298" text-anchor="middle" font-size="11" fill="#7c3aed">名册 + 任务板（读投影）</text>
  <text x="250" y="345" text-anchor="middle" font-size="11" fill="#1e3a8a">UI 不做 Team RPC；崩溃恢复对照 child 自己的 Session 判 active/failed。</text>

  <rect x="520" y="80" width="185" height="74" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="612" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">teammate：reviewer</text>
  <text x="612" y="126" text-anchor="middle" font-size="11" fill="#15803d">一个 subagent session</text>
  <text x="612" y="144" text-anchor="middle" font-size="11" fill="#14532d">fresh 或 fork（继承 Lead 已完成轮）</text>
  <rect x="735" y="80" width="185" height="74" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="827" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">teammate：builder</text>
  <text x="827" y="126" text-anchor="middle" font-size="11" fill="#15803d">名字永久，失败也不复用</text>
  <text x="827" y="144" text-anchor="middle" font-size="11" fill="#14532d">只有 Lead 能创建 / 中断</text>

  <line x1="470" y1="110" x2="518" y2="110" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="494" y="100" text-anchor="middle" font-size="10" fill="#374151">spawn</text>
  <line x1="705" y1="117" x2="733" y2="117" stroke="#4b5563" marker-end="url(#arr)"/>
  <line x1="733" y1="130" x2="705" y2="130" stroke="#4b5563" marker-end="url(#arr)"/>
  <text x="719" y="108" text-anchor="middle" font-size="10" fill="#374151">消息</text>

  <rect x="520" y="180" width="400" height="96" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="720" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">共享任务板 + 直接消息</text>
  <text x="536" y="230" font-size="11" fill="#9a3412">任务：依赖 DAG，依赖全完成才可 claim；claim/complete/release/reopen；</text>
  <text x="536" y="248" font-size="11" fill="#c2410c">Lead 可指派；CAS 更新拒旧副本；文件提示重叠只警告不阻塞。</text>
  <text x="536" y="266" font-size="11" fill="#7c2d12">消息：任意成员 → 任意成员 / Lead；inbox 接纳即成功，不重试不去重。</text>

  <text x="720" y="304" text-anchor="middle" font-size="11" fill="#374151">运行中的目标在最近 step 边界收到 steer；</text>
  <text x="720" y="322" text-anchor="middle" font-size="11" fill="#374151">inactive 目标被冷恢复；消息持久化随目标 Agent 的普通策略。</text>

  <rect x="30" y="390" width="900" height="36" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="413" text-anchor="middle" font-size="12" fill="#374151">durable log, derived state：名册与任务归 Lead 日志，已接纳消息归目标 Agent；Team 不另设存储。</text>
</svg>
