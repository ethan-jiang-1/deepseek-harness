<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">Fresh coding agent 从任务进入仓库反馈回路</title>
  <desc id="desc">六个步骤展示新 agent 从读取仓库地图、路由行为、加载 Skill、完成交付组合、运行证据到进入 GitHub 协作，并把结果留给下一轮。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#475569"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2f8550"/></marker>
  </defs>
  <rect width="1120" height="650" fill="#ffffff"/>
  <text x="560" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">一个 fresh coding agent 怎样完成 DSH 变更</text>
  <text x="560" y="64" text-anchor="middle" font-size="12" fill="#5f6b7a">每一步都有仓库 owner；对话不是下一轮继续工作的唯一来源</text>

  <rect x="420" y="88" width="280" height="58" rx="8" fill="#fff5e6" stroke="#d99939" stroke-width="1.5"/>
  <text x="560" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#744408">任务：新增模型可见工具</text>
  <text x="560" y="133" text-anchor="middle" font-size="11" fill="#805915">结果与验收条件</text>
  <path d="M560 146 V176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="180" width="300" height="116" rx="8" fill="#edf5ff" stroke="#5791c9"/>
  <circle cx="80" cy="210" r="16" fill="#276da8"/>
  <text x="80" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="200" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#173f67">建立最小地图</text>
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#526175">root / subtree AGENTS</text>
  <text x="200" y="261" text-anchor="middle" font-size="11" fill="#526175">architecture · glossary</text>
  <text x="200" y="282" text-anchor="middle" font-size="11" fill="#39709f">知道下一份该读什么</text>

  <rect x="410" y="180" width="300" height="116" rx="8" fill="#f3efff" stroke="#8269bd"/>
  <circle cx="440" cy="210" r="16" fill="#6950a4"/>
  <text x="440" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="560" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#513b85">路由到 owner</text>
  <text x="560" y="240" text-anchor="middle" font-size="11" fill="#526175">extension table · cookbook</text>
  <text x="560" y="261" text-anchor="middle" font-size="11" fill="#526175">README · source · Agent Note</text>
  <text x="560" y="282" text-anchor="middle" font-size="11" fill="#675293">分清当前事实与决定理由</text>

  <rect x="770" y="180" width="300" height="116" rx="8" fill="#eaf7f6" stroke="#3b9a91"/>
  <circle cx="800" cy="210" r="16" fill="#237a72"/>
  <text x="800" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="920" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5f59">加载匹配 Skills</text>
  <text x="920" y="240" text-anchor="middle" font-size="11" fill="#526175">docs · pre-push · review</text>
  <text x="920" y="261" text-anchor="middle" font-size="11" fill="#526175">读取完整任务流程</text>
  <text x="920" y="282" text-anchor="middle" font-size="11" fill="#2f7770">缩小仍需判断的问题</text>

  <path d="M350 238 H406" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M710 238 H766" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M920 296 V332" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="770" y="336" width="300" height="116" rx="8" fill="#edf8f1" stroke="#55a36f"/>
  <circle cx="800" cy="366" r="16" fill="#2f8550"/>
  <text x="800" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="920" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6139">完成交付组合</text>
  <text x="920" y="396" text-anchor="middle" font-size="11" fill="#526175">source · docs · tests</text>
  <text x="920" y="417" text-anchor="middle" font-size="11" fill="#526175">snapshot · owning Note</text>
  <text x="920" y="438" text-anchor="middle" font-size="11" fill="#397a50">同一变更保持一致</text>

  <rect x="410" y="336" width="300" height="116" rx="8" fill="#fff5e6" stroke="#d99939"/>
  <circle cx="440" cy="366" r="16" fill="#b66d12"/>
  <text x="440" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="560" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#744408">运行相关证据</text>
  <text x="560" y="396" text-anchor="middle" font-size="11" fill="#526175">types · tests · invariants</text>
  <text x="560" y="417" text-anchor="middle" font-size="11" fill="#526175">focused local checks</text>
  <text x="560" y="438" text-anchor="middle" font-size="11" fill="#805915">按失败修正</text>

  <rect x="50" y="336" width="300" height="116" rx="8" fill="#f3efff" stroke="#8269bd"/>
  <circle cx="80" cy="366" r="16" fill="#6950a4"/>
  <text x="80" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <text x="200" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#513b85">进入 GitHub 协作</text>
  <text x="200" y="396" text-anchor="middle" font-size="11" fill="#526175">PR policy · CI · review</text>
  <text x="200" y="417" text-anchor="middle" font-size="11" fill="#526175">required checks · merge</text>
  <text x="200" y="438" text-anchor="middle" font-size="11" fill="#675293">共享远端状态</text>

  <path d="M770 394 H714" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M410 394 H354" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M200 452 V492" stroke="#2f8550" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="50" y="496" width="1020" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="560" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#27364a">留给下一轮的仓库记忆</text>
  <rect x="92" y="546" width="278" height="40" rx="7" fill="#edf5ff" stroke="#8bb3d7"/>
  <text x="231" y="571" text-anchor="middle" font-size="11" fill="#244e73">当前行为：source · README · JSDoc</text>
  <rect x="421" y="546" width="278" height="40" rx="7" fill="#fff5e6" stroke="#d99939"/>
  <text x="560" y="571" text-anchor="middle" font-size="11" fill="#744408">决定理由：Agent Notes</text>
  <rect x="750" y="546" width="278" height="40" rx="7" fill="#edf8f1" stroke="#55a36f"/>
  <text x="889" y="571" text-anchor="middle" font-size="11" fill="#1f6139">可重复证据：tests · gates · CI</text>
  <path d="M1028 566 H1084 V118 H704" fill="none" stroke="#64748b" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1051" y="319" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90 1051 319)">下一项任务重新从仓库入口开始</text>
</svg>
